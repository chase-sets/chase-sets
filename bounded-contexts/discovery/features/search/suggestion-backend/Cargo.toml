[package]
name = "chase-sets-discovery-suggestions"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
form_urlencoded = "1"
http = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
tokio-postgres = "0.7"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
