[workspace]
resolver = "3"
members = ["admin", "marketplace", "platform", "public"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Pinned to a Corten revision on purpose: it follows Corten's main, past the 0.3.0 release. Move it
# forward as main moves; see README.md, "Corten pin".
corten = { git = "https://github.com/corten-run/corten", rev = "753db6104c188dd178dda766f766302cb3c1fd64", package = "corten-run", features = ["compress", "json", "zones"] }
corten-ui = { git = "https://github.com/corten-run/corten", rev = "753db6104c188dd178dda766f766302cb3c1fd64" }
platform = { package = "corten-pilot-platform", path = "platform" }
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
ulid = "1"
time = { version = "0.3", default-features = false, features = ["std", "parsing", "formatting"] }
# A visitor's time zone by its name (corten::ClientZone), for a picked date's start where they are.
jiff = "1"
uuid = { version = "1", features = ["v4"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# OpenTelemetry export for an app replacing a React host that exported it (platform's `otlp`).
# The default batch processors run on threads of their own, so the exporters use the blocking client.
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "fmt", "std", "ansi"] }

# Thin LTO, as `corten new` writes it (corten-run/corten#952): about 1.7% fewer instructions per page
# than Cargo's default as Corten measured it, for a slower release build; `corten dev`, the checks
# and the tests do not use it. Not measured on the pilot.
[profile.release]
lto = "thin"
