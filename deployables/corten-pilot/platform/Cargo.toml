[package]
name = "corten-pilot-platform"
description = "What the pilot's apps share: the platform API as the signed-in user, read-after-write, the session and the design system's tokens."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "platform"

[dependencies]
bytes.workspace = true
corten.workspace = true
corten-ui.workspace = true
futures-util.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-appender-tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tower = { workspace = true, optional = true }

[features]
# OpenTelemetry export (`telemetry`), for an app replacing a React host that exported it.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:tower",
]
