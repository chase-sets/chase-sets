name: Slice
description: A lane-ready unit of work (dispatch brief)
type: Slice
title: "<verb + outcome, ubiquitous language>"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Structure contract: `docs/contributing/backlog-model.md`.
        The dropdowns below are applied as labels automatically — a slice is not
        dispatchable until it has a priority and an owning context.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Dispatch rank within its wave. Slices only — never epics.
      options:
        - p0
        - p1
        - p2
        - p3
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Owning context
      description: The bounded context that owns this behavior. Drives parallel-lane collision checks.
      options:
        - auth
        - catalog
        - checkout
        - collections
        - commercial-terms
        - design-system
        - discovery
        - fulfillment
        - identity
        - infrastructure
        - inventory
        - marketplace
        - marketplace-web
        - notifications
        - ops
        - ordering
        - payments
        - platform-runtime
        - pricing
        - public-presence
        - settlement
        - support
        - tax
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: The nature of the work.
      options:
        - product
        - tech-debt
        - security
        - test
        - ops
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this exists; epic/ADR links; 2–5 repo evidence pointers (paths, symbols, prior art).
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope fence
      description: "In-scope behavior plus at least one explicit `Non-goal: ...` or `Out of scope: ...` declaration."
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions already made
      description: Settled rulings with links, or `none`. Unsettled full-path decisions must block this issue via a native Decision dependency.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "One Markdown list item per criterion, each ending `Evidence: ...` with a discriminating test name, command, verifier, screenshot, probe, or ops check. External-provider contracts name the provider test-mode surface."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Runnable scoped commands as a fenced command block or one standalone backticked command per list item; do not hide commands in narrative prose.
    validations:
      required: true
  - type: textarea
    id: footprint
    attributes:
      label: Footprint & chain
      description: "Predicted workspaces/files plus `Callers: ...` (`none` allowed). Record chain links as GitHub issue dependencies (Blocked by / Blocks) — the relationship is authoritative; prose is a convenience."
    validations:
      required: true
  - type: textarea
    id: operator-actions
    attributes:
      label: Operator actions
      description: Credentials, sign-ins, approvals, or live watch windows needed by this slice; enter `none` when there are no operator actions.
    validations:
      required: true
  - type: textarea
    id: glossary-impact
    attributes:
      label: Glossary impact
      description: Terms added or changed with the owning `GLOSSARY.md` pointer; enter `none` when the ubiquitous language is unchanged.
    validations:
      required: true
  - type: textarea
    id: authority-probe
    attributes:
      label: External authority probe & evidence timing
      description: Captured probe or durable evidence link plus the exact lifecycle moment it proves; enter `none` when acceptance does not depend on an external authority.
    validations:
      required: true
  - type: textarea
    id: review-packet
    attributes:
      label: Review packet seed
      description: "Full path: invariants, likely failure modes, and omission-revealing evidence/probes. Fast path: enter `not applicable — fast path`."
    validations:
      required: true
  - type: input
    id: tier
    attributes:
      label: Tier + routing hint
      description: "Enter exactly one: `fast path; presentation`, `fast path; system`, `full path; presentation`, or `full path; system`."
    validations:
      required: true
