name: Slice
description: A lane-ready unit of work (dispatch brief)
type: Slice
title: "<verb + outcome, ubiquitous language>"
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Structure contract: `docs/contributing/backlog-model.md`.
        The dropdowns below are applied as labels automatically — a slice is not
        dispatchable until it has a priority and an owning context.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Dispatch rank within its wave. Slices only — never epics.
      options:
        - p0
        - p1
        - p2
        - p3
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Owning context
      description: The bounded context that owns this behavior. Drives parallel-lane collision checks.
      options:
        - auth
        - catalog
        - checkout
        - collections
        - commercial-terms
        - design-system
        - discovery
        - fulfillment
        - identity
        - infrastructure
        - inventory
        - marketplace
        - marketplace-web
        - notifications
        - ops
        - ordering
        - payments
        - platform-runtime
        - pricing
        - public-presence
        - settlement
        - support
        - tax
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: The nature of the work.
      options:
        - product
        - tech-debt
        - security
        - test
        - ops
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this exists; epic/ADR links; 2–5 repo evidence pointers (paths, symbols, prior art).
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope fence
      description: In-scope, and at least one explicit non-goal.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions already made
      description: Settled rulings with links. Unsettled full-path decisions must block this issue via a decision issue.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One per line, each with its evidence method (test name, verifier, screenshot, ops check).
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Runnable scoped commands that prove the change.
    validations:
      required: true
  - type: textarea
    id: footprint
    attributes:
      label: Footprint & chain
      description: "Predicted workspaces/files. Record chain links as GitHub issue dependencies (Blocked by / Blocks) — the relationship is authoritative; prose is a convenience."
    validations:
      required: true
  - type: input
    id: tier
    attributes:
      label: Tier + routing hint
      description: "fast|full path; presentation|system."
    validations:
      required: true
