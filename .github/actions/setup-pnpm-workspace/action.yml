name: Setup pnpm workspace
description: Configure the pinned Node/pnpm toolchain after checkout.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 11.0.9
        run_install: false

    - uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: pnpm
