name: Setup pnpm workspace
description: Configure the pinned Node/pnpm toolchain after checkout.
inputs:
  install:
    description: Run pnpm install after configuring the toolchain.
    required: false
    default: "false"
  install-warning-seconds:
    description: Warn in the job summary when pnpm install exceeds this duration.
    required: false
    default: "90"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 11.0.9
        run_install: false

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        started_at="$(date +%s)"
        pnpm install --frozen-lockfile
        finished_at="$(date +%s)"
        install_seconds=$((finished_at - started_at))
        echo "pnpm install completed in ${install_seconds}s"

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### pnpm install"
            echo ""
            echo "Completed in ${install_seconds}s."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "$install_seconds" -gt "${{ inputs.install-warning-seconds }}" ]; then
          echo "::warning title=Slow pnpm install::pnpm install completed in ${install_seconds}s, above the ${{ inputs.install-warning-seconds }}s tracking threshold."
        fi
