name: Setup pnpm workspace
description: Configure the pinned Node/pnpm toolchain after checkout.
inputs:
  install:
    description: Run pnpm install after configuring the toolchain.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 11.0.9
        run_install: false

    - uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: |
        set -euo pipefail
        started_at="$(date +%s)"
        pnpm install --frozen-lockfile
        finished_at="$(date +%s)"
        echo "pnpm install completed in $((finished_at - started_at))s"
