name: Block Docker Hub
description: Make Docker Hub unreachable for the rest of this job and prove it, so any remaining Hub pull fails loudly (#9230).

runs:
  using: composite
  steps:
    - name: Block Docker Hub hosts
      shell: bash
      run: |
        set -euo pipefail

        hub_hosts=(
          docker.io
          index.docker.io
          registry-1.docker.io
          registry.hub.docker.com
          auth.docker.io
          production.cloudflare.docker.com
          hub.docker.com
        )
        for host in "${hub_hosts[@]}"; do
          printf '0.0.0.0 %s\n:: %s\n' "$host" "$host" | sudo tee -a /etc/hosts >/dev/null
        done

        canary="docker.io/library/hello-world:latest"
        if timeout 120 docker pull --quiet "$canary" >/dev/null 2>&1; then
          echo "::error title=Docker Hub still reachable::${canary} pulled after blocking ${hub_hosts[*]}."
          exit 1
        fi
        echo "Docker Hub is unreachable for this job; ${canary} pull was refused."
