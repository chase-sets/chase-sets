name: Check the Corten pilot
description: >-
  Export the pilot's text, tokens and nav, then run corten check (cargo fmt, corten fmt, clippy -D warnings,
  the scripts' types and the tests) over the Corten pilot workspace at the pinned Corten revision. Called by
  corten-pilot.yml (advisory, every change) and platform-pr.yml's Corten Pilot Check (required for the
  pilot's marketplace and platform paths), so the two cannot drift. Runs after checkout.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pnpm-workspace
      with:
        # scripts/export.mjs imports admin-web's and marketplace's TypeScript sources through tsx.
        install: "true"

    # Also writes the two uncommitted outputs that carry the brand foil (tokens.json, favicon.svg).
    # From the repository root with the full path: scripts/managed-postgres-authority-guard.mjs resolves
    # a step's script from the root.
    - name: The exported text, tokens, nav and defaults match the React apps' sources
      shell: bash
      run: node --import tsx deployables/corten-pilot/scripts/export.mjs --check

    # corten check type-checks each app's scripts with tsc from the PATH, and fails without it.
    - name: TypeScript on the PATH for corten check
      shell: bash
      run: |
        set -euo pipefail
        test -x "$GITHUB_WORKSPACE/node_modules/.bin/tsc"
        echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/corten
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          deployables/corten-pilot/target
        # v2: v1 cached the binary without cargo's install records, so a cache hit made
        # `cargo install` refuse ("binary `corten` already exists").
        # v3: built on Ubuntu 24.04; a v2 target from a newer image can hold build scripts and proc
        # macros linked against a newer glibc. Corten Marketplace Browser Tests (platform-pr.yml) reads
        # the same key; scripts/corten-pilot-check-action.test.mjs keeps the two equal.
        key: corten-pilot-v3-${{ runner.os }}-${{ hashFiles('deployables/corten-pilot/Cargo.lock') }}

    - name: Rust toolchain and the Corten CLI at the pinned revision
      shell: bash
      working-directory: deployables/corten-pilot
      run: |
        set -euo pipefail
        rustup component add clippy rustfmt
        # The repository and revision the apps build against, so the CLI is always the pin's.
        git="$(sed -n 's/^corten = { git = "\([^"]*\)", rev = "[0-9a-f]*".*/\1/p' Cargo.toml)"
        rev="$(sed -n 's/^corten = { git = "[^"]*", rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)"
        test -n "$git" && test -n "$rev"
        # Skipped when the cached binary was built from the same revision (cargo's install records
        # are cached with it).
        cargo install --locked --git "$git" --rev "$rev" corten-cli

    - name: corten check (cargo fmt, corten fmt, clippy -D warnings, the scripts' types, tests)
      shell: bash
      working-directory: deployables/corten-pilot
      run: |
        set -euo pipefail
        corten check 2>&1 | tee corten-check.log
        ! grep -q "were not type-checked" corten-check.log
