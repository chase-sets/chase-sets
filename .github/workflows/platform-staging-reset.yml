name: Platform Staging Reset

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Ref to redeploy after reset. Defaults to main.
        required: false
        default: main
        type: string
      mode:
        description: Use full-reset for a healthy staging environment or resume-recreate only after partial destruction.
        required: true
        default: full-reset
        type: choice
        options:
          - full-reset
          - resume-recreate
      confirm:
        description: Type "reset staging" for full-reset or "resume staging recreate" for resume-recreate.
        required: true
        type: string
      allow_scrydex_usage_check:
        description: Allow the read-only Scrydex usage/readiness and live option checks required by staging-refresh preflight.
        required: true
        default: false
        type: boolean
      confirm_no_staging_evidence_overlap:
        description: Confirm no wake drill or other staging evidence window is scheduled to overlap this reset.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  checks: read

concurrency:
  # Staging reset rebuilds and pushes the platform image. Share this lane with
  # registry cleanup so DigitalOcean GC cannot overlap registry writes.
  group: platform-registry-mutation
  cancel-in-progress: false

jobs:
  reset-staging:
    name: Reset Staging
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: platform-deploy-staging
      cancel-in-progress: false
    environment: staging
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: staging
      TF_VAR_environment_project_id: ${{ vars.DIGITALOCEAN_PROJECT_ID || '' }}
      DOKS_INGRESS_TARGET: ${{ vars.DOKS_INGRESS_TARGET || '' }}
      TF_VAR_doks_ingress_target: ${{ vars.DOKS_INGRESS_TARGET || '' }}
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_checkout_shopify_simple_kill_switch_active: ${{ vars.CHECKOUT_SHOPIFY_SIMPLE_KILL_SWITCH_ACTIVE == 'true' && 'true' || 'false' }}
      TF_VAR_alert_emails: ${{ vars.PLATFORM_ALERT_EMAILS || '[]' }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
      TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
      TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_accounts_api: ${{ vars.STRIPE_CONNECT_ACCOUNTS_API || 'v2' }}
      TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
      TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
      TF_VAR_voyage_api_key: ${{ secrets.VOYAGE_API_KEY || '' }}
      TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
      TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
      TF_VAR_tcgplayer_automation_tcg_auth_cookie: ${{ secrets.TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE || '' }}
      TF_VAR_scrydex_api_key: ${{ secrets.SCRYDEX_API_KEY || '' }}
      TF_VAR_scrydex_team_id: ${{ secrets.SCRYDEX_TEAM_ID || '' }}
      TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
      TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
      TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
      TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
      TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
      TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
      TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
      TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
      TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED == 'false' && 'false' || 'true' }}
      TF_VAR_observability_otlp_endpoint: ${{ vars.OBSERVABILITY_OTLP_ENDPOINT || '' }}
      TF_VAR_observability_otlp_headers: ${{ secrets.OBSERVABILITY_OTLP_HEADERS || '' }}
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
    steps:
      - name: Confirm destructive reset
        env:
          RESET_MODE: ${{ inputs.mode }}
          RESET_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$RESET_MODE" in
            full-reset)
              if [ "$RESET_CONFIRM" != "reset staging" ]; then
                echo "Confirmation input must exactly equal 'reset staging'." >&2
                exit 1
              fi
              ;;
            resume-recreate)
              if [ "$RESET_CONFIRM" != "resume staging recreate" ]; then
                echo "Confirmation input must exactly equal 'resume staging recreate'." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported staging reset mode '${RESET_MODE}'." >&2
              exit 1
              ;;
          esac

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --release-ref "${{ inputs.release_ref }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_check="PR Required"
          release_commit="${{ steps.release.outputs.release_commit }}"
          deadline=$((SECONDS + 1800))

          while true; do
            completed_checks="$(gh api --paginate "repos/${{ github.repository }}/commits/${release_commit}/check-runs?per_page=100" \
              --jq ".check_runs[] | select(.name == \"${required_check}\" and .status == \"completed\") | [.conclusion, .html_url] | @tsv")"
            successful_check_url="$(printf '%s\n' "$completed_checks" | awk -F '\t' '$1 == "success" { print $2; exit }')"

            if [ -n "$successful_check_url" ]; then
              echo "Validated ${required_check}: ${successful_check_url}"
              break
            fi

            failed_check_url="$(printf '%s\n' "$completed_checks" | awk -F '\t' '$1 != "success" { print $2; exit }')"
            if [ -n "$failed_check_url" ]; then
              echo "Release commit ${release_commit} has a completed non-success '${required_check}' check: ${failed_check_url}" >&2
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for '${required_check}' on ${release_commit}." >&2
              exit 1
            fi

            echo "Waiting for '${required_check}' on ${release_commit}..."
            sleep 30
          done

      - name: Check out release commit
        run: |
          set -euo pipefail
          release_commit="${{ steps.release.outputs.release_commit }}"
          git checkout --detach "$release_commit"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$release_commit" ]; then
            echo "Checked out ${checked_out_commit}, expected release commit ${release_commit}." >&2
            exit 1
          fi
          echo "TF_VAR_platform_image_tag=${release_commit}" >> "$GITHUB_ENV"

      - name: Validate staging configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url \
            TF_VAR_stripe_secret_key \
            TF_VAR_stripe_publishable_key \
            TF_VAR_stripe_webhook_secret \
            TF_VAR_stripe_connect_webhook_secret \
            TF_VAR_easypost_api_key
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required staging configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ "${TF_VAR_observability_enabled:-true}" != "false" ] && [ -z "${TF_VAR_observability_otlp_headers:-}" ]; then
            echo "Staging observability requires OBSERVABILITY_OTLP_HEADERS secret or OBSERVABILITY_ENABLED=false." >&2
            exit 1
          fi

          if [ "${TF_VAR_notification_email_provider:-}" = "amazon-ses" ]; then
            ses_missing=()
            for name in \
              TF_VAR_ses_aws_region \
              TF_VAR_ses_aws_access_key_id \
              TF_VAR_ses_aws_secret_access_key \
              TF_VAR_ses_from_email \
              TF_VAR_ses_configuration_set_name \
              TF_VAR_ses_source_arn
            do
              if [ -z "${!name:-}" ]; then
                ses_missing+=("$name")
              fi
            done

            if [ "${#ses_missing[@]}" -gt 0 ]; then
              printf 'Missing required staging SES configuration: %s\n' "${ses_missing[*]}" >&2
              exit 1
            fi
          fi

      - name: Gate staging refresh provider and set-matrix preflight
        if: inputs.mode == 'full-reset'
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE: ${{ secrets.TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE || '' }}
          SCRYDEX_API_KEY: ${{ secrets.SCRYDEX_API_KEY || '' }}
          SCRYDEX_TEAM_ID: ${{ secrets.SCRYDEX_TEAM_ID || '' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          EASYPOST_API_KEY: ${{ secrets.EASYPOST_API_KEY }}
          STAGING_REFRESH_ALLOW_CREDITED_PROVIDER_READS: ${{ inputs.allow_scrydex_usage_check && 'true' || 'false' }}
          STAGING_REFRESH_NO_SCHEDULED_OVERLAP_CONFIRMED: ${{ inputs.confirm_no_staging_evidence_overlap && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node ./scripts/staging-refresh-preflight.mjs \
            --skip-github-metadata \
            --skip-deployed-secret-check \
            --out artifacts/staging-refresh-preflight.json

      - name: Upload staging refresh preflight evidence
        if: ${{ always() && inputs.mode == 'full-reset' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-refresh-preflight-${{ github.run_id }}
          path: artifacts/staging-refresh-preflight.json
          if-no-files-found: warn
          retention-days: 14

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Terraform init staging environment DNS
        working-directory: infrastructure/digitalocean/environment-dns
        # Keep provider credentials step-local. The workflow contract's negative
        # control strips one key and must catch this credentials-not-threaded class.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=environment-dns/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format staging environment DNS
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform fmt -check -recursive

      - name: Terraform validate staging environment DNS
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform validate

      - name: Terraform apply staging environment DNS
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_google_workspace_dkim_txt_value: ${{ vars.GOOGLE_WORKSPACE_DKIM_TXT_VALUE || '' }}
        run: terraform apply -auto-approve

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: steps.buildx.outcome == 'failure'

      - name: Terraform init
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform fmt -check -recursive

      - name: Fail closed unless staging is absent for resume
        if: inputs.mode == 'resume-recreate'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          state_resources="$(terraform state list)"
          state_platform_resources="$(printf '%s\n' "$state_resources" | grep -E '(^|\.)digitalocean_(app\.platform|database_cluster\.postgres)(\[|$)' || true)"
          if [ -n "$state_platform_resources" ]; then
            echo "Resume-recreate requires the staging app and database to be absent from Terraform state; found:" >&2
            printf '%s\n' "$state_platform_resources" >&2
            exit 1
          fi

          databases_json="$(doctl databases list --output json)"
          if printf '%s' "$databases_json" | jq -e \
            'any(.[]; .name == "chase-sets-staging-postgres")' >/dev/null; then
            echo "Resume-recreate refused: DigitalOcean still reports chase-sets-staging-postgres." >&2
            exit 1
          fi

          apps_json="$(doctl apps list --output json)"
          if printf '%s' "$apps_json" | jq -e \
            'any(.[]; .spec.name == "chase-sets-staging-platform")' >/dev/null; then
            echo "Resume-recreate refused: DigitalOcean still reports chase-sets-staging-platform." >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            admin_status="$(curl --silent --show-error --location --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              https://admin.staging.chasesets.com/api/health/ready || true)"
            echo "Admin readiness returned ${admin_status:-none} on absence probe ${attempt}."
            if [[ ! "$admin_status" =~ ^5[0-9][0-9]$ ]]; then
              echo "Resume-recreate requires three consecutive admin readiness 5xx responses; refusing status ${admin_status:-none}." >&2
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "Staging absence proven; resume-recreate may converge remaining reset resources."

      - name: Re-check staging refresh overlap before destroy
        if: inputs.mode == 'full-reset'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node ./scripts/staging-refresh-preflight.mjs --overlap-only

      - name: Terraform destroy staging platform
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_image_tag: ${{ steps.release.outputs.release_commit }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_connect_accounts_api: ${{ vars.STRIPE_CONNECT_ACCOUNTS_API || 'v2' }}
          TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_voyage_api_key: ${{ secrets.VOYAGE_API_KEY || '' }}
          TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
          TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
          TF_VAR_tcgplayer_automation_tcg_auth_cookie: ${{ secrets.TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE || '' }}
          TF_VAR_scrydex_api_key: ${{ secrets.SCRYDEX_API_KEY || '' }}
          TF_VAR_scrydex_team_id: ${{ secrets.SCRYDEX_TEAM_ID || '' }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
          TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED == 'false' && 'false' || 'true' }}
          TF_VAR_observability_otlp_endpoint: ${{ vars.OBSERVABILITY_OTLP_ENDPOINT || '' }}
          TF_VAR_observability_otlp_headers: ${{ secrets.OBSERVABILITY_OTLP_HEADERS || '' }}
        run: |
          node ../../../scripts/disable-terraform-prevent-destroy.mjs main.tf
          terraform destroy -auto-approve \
            -target=digitalocean_monitor_alert.managed_postgres \
            -target=terraform_data.wake_listener_database_grants \
            -target=terraform_data.context_database_grants \
            -target=digitalocean_database_connection_pool.contexts \
            -target=digitalocean_database_user.wake_listeners \
            -target=digitalocean_database_user.contexts \
            -target=digitalocean_database_db.contexts \
            -target=digitalocean_database_cluster.postgres

      - name: Terraform init catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=catalog-assets/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform fmt -check -recursive

      - name: Reconcile missing staging catalog CDN state
        working-directory: infrastructure/digitalocean/catalog-assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail

          custom_domain="assets.staging.chasesets.com"
          live_cdn_id="$(doctl compute cdn list --output json | jq -r \
            --arg custom_domain "$custom_domain" \
            'first(.[] | select(.custom_domain == $custom_domain) | .id) // empty')"

          cdn_id="$(terraform state pull | jq -r '
            first(
              .resources[]
              | select(.mode == "managed" and .type == "digitalocean_cdn" and .name == "catalog_assets")
              | .instances[]
              | .attributes.id // empty
            ) // empty
          ')"
          if [ -z "$cdn_id" ]; then
            echo "No catalog CDN resource is present in Terraform state."
            if [ -n "$live_cdn_id" ]; then
              echo "Importing live catalog CDN ${live_cdn_id} before reset destroy."
              terraform import digitalocean_cdn.catalog_assets "$live_cdn_id"
            fi
            exit 0
          fi

          if doctl compute cdn get "$cdn_id" >/dev/null 2>&1; then
            echo "Catalog CDN ${cdn_id} exists in DigitalOcean."
            exit 0
          fi

          echo "Catalog CDN ${cdn_id} is missing in DigitalOcean; removing stale Terraform state before destroy."
          terraform state rm digitalocean_cdn.catalog_assets
          if [ -n "$live_cdn_id" ]; then
            echo "Importing live catalog CDN ${live_cdn_id} before reset destroy."
            terraform import digitalocean_cdn.catalog_assets "$live_cdn_id"
          fi

      - name: Terraform destroy staging catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          node ../../../scripts/disable-terraform-prevent-destroy.mjs main.tf
          terraform destroy -auto-approve

      - name: Terraform plan staging catalog assets recreate
        working-directory: infrastructure/digitalocean/catalog-assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform plan -out=tfplan

      - name: Terraform apply staging catalog assets recreate
        working-directory: infrastructure/digitalocean/catalog-assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform apply -auto-approve tfplan

      - name: Verify staging catalog asset CDN
        working-directory: infrastructure/digitalocean/catalog-assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          custom_domain="$(terraform output -raw custom_domain)"
          cdn_endpoint="$(terraform output -raw cdn_endpoint)"
          record_name="${custom_domain%.chasesets.com}"

          doctl compute cdn list --output json | jq -e \
            --arg custom_domain "$custom_domain" \
            --arg cdn_endpoint "$cdn_endpoint" \
            '.[] | select(.custom_domain == $custom_domain and .endpoint == $cdn_endpoint)' >/dev/null

          doctl compute domain records list chasesets.com --output json | jq -e \
            --arg record_name "$record_name" \
            --arg cdn_endpoint "$cdn_endpoint" \
            '.[] | select(.type == "CNAME" and .name == $record_name and .data == $cdn_endpoint)' >/dev/null

          catalog_asset_root_status=""
          for attempt in $(seq 1 12); do
            catalog_asset_root_status="$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' \
              "https://${custom_domain}/" || true)"
            echo "Catalog asset CDN root status ${catalog_asset_root_status} on attempt ${attempt}."
            if [ "$catalog_asset_root_status" = "403" ]; then
              break
            fi
            sleep 10
          done
          if [ "$catalog_asset_root_status" != "403" ]; then
            echo "Catalog asset CDN root must stay protected; expected 403, got ${catalog_asset_root_status:-none}." >&2
            exit 1
          fi
          echo "Catalog asset CDN root returned expected protected status 403."

      - name: Terraform plan staging recreate
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform plan -out=tfplan

      - name: Terraform apply staging recreate
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform apply -auto-approve tfplan

      - name: Queue DOKS redeploy after database recreation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="${{ steps.release.outputs.release_commit }}"
          gh workflow run platform-production.yml             --ref main             -f release_ref="$release_commit"             -f dispatch_source=recovery             -f reason="staging managed Postgres reset ${GITHUB_RUN_ID}"
          echo "Queued the DOKS deployment workflow to rotate runtime database Secrets and redeploy staging."
