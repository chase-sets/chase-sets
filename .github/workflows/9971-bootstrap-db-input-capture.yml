name: 9971 Bootstrap DB Input Capture Only

on:
  push:
    branches: [codex/9971-capture-r2]
    paths: [.github/workflows/9971-bootstrap-db-input-capture.yml]

permissions:
  contents: read

jobs:
  measurement:
    name: Diagnostic API Bootstrap Measurement Only
    if: github.event_name == 'push' && github.repository == 'chase-sets/chase-sets' && github.ref == 'refs/heads/codex/9971-capture-r2' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Raise PostgreSQL lock table capacity for DB Profile
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          target_max_locks_per_transaction=512
          target_max_connections=300
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -c \
            "ALTER SYSTEM SET max_locks_per_transaction = ${target_max_locks_per_transaction};"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -c \
            "ALTER SYSTEM SET max_connections = ${target_max_connections};"
          docker restart "$POSTGRES_CONTAINER_ID"
          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER_ID" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "PostgreSQL did not become ready within 30s after restart." >&2
            docker logs "$POSTGRES_CONTAINER_ID" >&2 || true
            exit 1
          fi
          effective="$(docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -tAc 'SHOW max_locks_per_transaction;' | tr -d '[:space:]')"
          if [ "$effective" != "$target_max_locks_per_transaction" ]; then
            echo "Expected max_locks_per_transaction=${target_max_locks_per_transaction} but Postgres reports ${effective}." >&2
            exit 1
          fi
          echo "PostgreSQL max_locks_per_transaction is now ${effective}."
          effective="$(docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -tAc 'SHOW max_connections;' | tr -d '[:space:]')"
          if [ "$effective" != "$target_max_connections" ]; then
            echo "Expected max_connections=${target_max_connections} but Postgres reports ${effective}." >&2
            exit 1
          fi
          mkdir -p artifacts/9971-reference-capture
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -v ON_ERROR_STOP=1 -c \
            'SHOW max_connections; SHOW max_locks_per_transaction; SHOW shared_buffers; SHOW work_mem; SHOW maintenance_work_mem; SHOW superuser_reserved_connections; SHOW reserved_connections;' \
            | tee artifacts/9971-reference-capture/postgres-settings.txt
          docker image inspect pgvector/pgvector:pg16 --format '{{json .RepoDigests}}' \
            | tee artifacts/9971-reference-capture/postgres-image-digests.json

      - name: Restore immutable diagnostic-only census helpers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0e6d46f7eda95b4788ff0cc96e2b02ac473d6761"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags origin e04bf62981772c43adb0eb6695261679df9f1bd1
          git show e04bf62981772c43adb0eb6695261679df9f1bd1:deployables/platform-api/scripts/8396-capture-census.mjs > deployables/platform-api/scripts/8396-capture-census.mjs
          echo "c9bb1a649b15063088430e6a436acad7e69b17357906148300af82dd3a9df334  deployables/platform-api/scripts/8396-capture-census.mjs" | sha256sum -c -

      - name: Measure exact API partitions without granting enrollment authority
        run: |
          set -euo pipefail
          mkdir -p artifacts/9971-reference-capture
          cat > artifacts/9971-reference-capture/reporter.mjs <<'REPORTER'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { basename } from 'node:path';
          import { deriveBootstrapDbCaseIdentities } from '../../deployables/platform-api/scripts/check-bootstrap-db-enrollment.mjs';
          export default class MeasurementReporter {
            onTestModuleEnd(module) {
              const source = readFileSync(module.moduleId, 'utf8');
              appendFileSync(process.env.MEASUREMENT_OUTPUT, JSON.stringify({
                file: basename(module.moduleId),
                sourceSha256: createHash('sha256').update(source).digest('hex'),
                identities: deriveBootstrapDbCaseIdentities(basename(module.moduleId), source),
                state: module.state(), diagnostic: module.diagnostic(), errors: module.errors(),
                cases: [...module.children.allTests()].map(test => ({
                  name: test.name, fullName: test.fullName,
                  result: test.result(), diagnostic: test.diagnostic(),
                })),
              }) + '\n');
            }
            onTestRunEnd(modules, errors, reason) {
              appendFileSync(process.env.MEASUREMENT_OUTPUT, JSON.stringify({
                runEnd: true, moduleCount: modules.length, errors, reason,
              }) + '\n');
            }
          }
          REPORTER
          cat > artifacts/9971-reference-capture/s-binding.mjs <<'BINDING'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { basename } from 'node:path';
          // Evidence-only binding for the one #9971 capture of frozen S. Every unit, file,
          // case and command below is S's own, derived from S by the canonical producers
          // before publication; nothing is carried over from an earlier capture's groups.
          export const frozenS = '0e6d46f7eda95b4788ff0cc96e2b02ac473d6761';
          export const frozenGroups = Object.freeze({
            "test:db:1": [
              "bootstrap-production-reconciliation.db.test.ts",
              "bootstrap-lock-contention.db.test.ts",
              "seed-command-full-pools.db.test.ts",
              "authoritative-seed-resume-core.db.test.ts",
              "authoritative-seed-resume-reconciliation.db.test.ts"
            ],
            "test:db:2": [
              "bootstrap-scenario.db.test.ts",
              "catalog-seed-aggregate-state.db.test.ts",
              "operator-session/operator-session-grant-mint.db.test.ts",
              "operator-session/operator-session-grant-lifecycle.db.test.ts",
              "operator-session/operator-session-grant-scope.db.test.ts",
              "operator-session/operator-session-push.db.test.ts",
              "operator-session/operator-extension-route-contract.db.test.ts",
              "seed-command-catalog.db.test.ts",
              "bootstrap-shared-seed-command.db.test.ts",
              "connector-mount-gate-isolation.db.test.ts",
              "authoritative-seed-resume-recovery.db.test.ts",
              "inventory-seed-resume.db.test.ts",
              "catalog-seed-interruption-resume.db.test.ts"
            ]
          });
          export const frozenDigests = Object.freeze({
            "caseManifestSha256": "6a73659d3eb369e1ee1c649e79e4f599f677db377e128f508cc45c156ed5c251",
            "commandsSha256": "94737ce2a4b230062264ce6b431e812d9c0920a18b4bf6b3df99db62798d1600",
            "censusSha256": "b4efba85da0dd7b5618f98a7febde80b1a1f6c9744b3c8a353d9eda5fb1d1735",
            "sourceManifestSha256": "90d59bf0f2ff7ab32372e25b6afde2fb8a669b9a36f5b3096cc74a268fc01765"
          });
          export const frozenCounts = Object.freeze({"files":18,"bootstrapFiles":12,"bootstrapCases":68,"cases":133});
          // The immutable #8396 census helper supplies only its reviewed literal-table parser.
          export const censusHelperSha256 = 'c9bb1a649b15063088430e6a436acad7e69b17357906148300af82dd3a9df334';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const guard = 'node ./scripts/check-bootstrap-db-enrollment.mjs && ';
          const commandBody = files => 'vitest run --config ./vitest.config.ts '
            + files.map(file => '__tests__/' + file).join(' ')
            + ' --maxWorkers=3 --reporter=default --reporter=./scripts/bootstrap-db-evidence-reporter.mjs';
          export function assertSoleSParent({ parents, captureParent, sourceBase }) {
            assert.equal(captureParent, frozenS, 'capture parent is frozen S');
            assert.equal(sourceBase, frozenS, 'source base is frozen S');
            assert.deepEqual(parents, [frozenS], 'the capture child has the sole parent S');
          }
          export function bindSScripts(scripts, groups) {
            assert.deepEqual(Object.keys(scripts).filter(name => /^test:db:\d+$/.test(name)).sort(), Object.keys(groups).sort(),
              'numbered DB scripts');
            assert.equal(scripts['test:db'], Object.keys(groups).map(unit => 'pnpm run ' + unit).join(' && '), 'test:db unit order');
            const commands = {};
            for (const [unit, files] of Object.entries(groups)) {
              commands[unit] = commandBody(files);
              assert.equal(scripts[unit], guard + commands[unit], unit + ' equals the frozen S command');
            }
            return commands;
          }
          // Builds the case manifest from S's sources and requires every file's unit to equal
          // S's mirrored checker declaration (bootstrap manifest or non-bootstrap census).
          export function deriveSCaseManifest({ groups, readTest, fixture, deriveBootstrapDbCaseIdentities,
            captureCensusFiles, deriveCaptureCensusCaseNames, declaredManifest, declaredCensus }) {
            const manifest = {};
            for (const [unit, selected] of Object.entries(groups)) {
              for (const file of selected) {
                const bytes = readTest(file);
                const source = bytes.toString('utf8');
                const cases = deriveBootstrapDbCaseIdentities(file, source);
                assert.deepEqual(deriveBootstrapDbCaseIdentities(basename(file), source), cases, file + ' basename identity');
                const entry = { executionUnit: unit, sourceSha256: hash(bytes), cases };
                if (captureCensusFiles.includes(file)) {
                  entry.censusCaseNames = deriveCaptureCensusCaseNames(file, source, fixture);
                  assert.equal(declaredManifest[basename(file)], undefined, file + ' is not a declared bootstrap file');
                  assert.equal(declaredCensus.entries['__tests__/' + file], unit, file + ' declared census unit');
                } else {
                  const declared = declaredManifest[basename(file)];
                  assert(declared, file + ' declared bootstrap entry');
                  assert.equal(declared.executionUnit, unit, file + ' declared unit');
                  assert.deepEqual(declared.cases.map(({ name, identity }) => ({ name, identity })), cases, file + ' declared identities');
                }
                assert.equal(manifest[basename(file)], undefined, file + ' captured once');
                manifest[basename(file)] = entry;
              }
            }
            assert.deepEqual(Object.keys(declaredManifest).sort(),
              Object.keys(manifest).filter(name => !manifest[name].censusCaseNames).sort(), 'declared bootstrap files');
            assert.deepEqual(Object.keys(declaredCensus.entries).sort(),
              Object.values(groups).flat().filter(file => captureCensusFiles.includes(file)).map(file => '__tests__/' + file).sort(),
              'declared non-bootstrap census files');
            return { manifest, manifestBytes: Buffer.from(JSON.stringify(manifest, null, 2) + '\n') };
          }
          export function precheckSCorpus({ groups, scripts, census, readTest, fixture, deriveBootstrapDbCaseIdentities,
            captureCensusFiles, deriveCaptureCensusCaseNames, declaredManifest, declaredCensus }) {
            assert.deepEqual(census.violations, []);
            assert.equal(census.bootstrapEntries.length, frozenCounts.bootstrapFiles);
            assert.equal(census.dbEntries.length, frozenCounts.files);
            assert.deepEqual([...census.dbEntries].sort(), Object.values(groups).flat().map(file => '__tests__/' + file).sort());
            assert.deepEqual(census.dbEntries.filter(entry => !census.bootstrapEntries.includes(entry)).sort(),
              captureCensusFiles.map(file => '__tests__/' + file).sort(), 'non-bootstrap census files');
            const commands = bindSScripts(scripts, groups);
            const { manifest, manifestBytes } = deriveSCaseManifest({ groups, readTest, fixture, deriveBootstrapDbCaseIdentities,
              captureCensusFiles, deriveCaptureCensusCaseNames, declaredManifest, declaredCensus });
            assert.equal(Object.keys(manifest).length, frozenCounts.files);
            assert.equal(Object.values(manifest).filter(entry => !entry.censusCaseNames).flatMap(entry => entry.cases).length,
              frozenCounts.bootstrapCases);
            assert.equal(Object.values(manifest).reduce((count, entry) => count + (entry.censusCaseNames ?? entry.cases).length, 0),
              frozenCounts.cases);
            for (const name of ['test:unit', 'test:fast']) {
              assert.deepEqual([...scripts[name].matchAll(/--exclude ([^ ]+)/g)].map(match => match[1]).sort(), [...census.dbEntries].sort(),
                name + ' excludes');
            }
            const commandsBytes = Buffer.from(JSON.stringify(commands, null, 2));
            const censusBytes = Buffer.from(JSON.stringify(census, null, 2));
            return { commands, commandsBytes, manifest, manifestBytes, censusBytes };
          }
          // Equality with the frozen S values must hold before any measurement starts.
          export function assertFrozenDigests({ groups, manifestBytes, commandsBytes, censusBytes, sourceBytes }) {
            assert.deepEqual(groups, frozenGroups, 'groups are the frozen S groups');
            assert.equal(hash(manifestBytes), frozenDigests.caseManifestSha256, 'frozen S case manifest');
            assert.equal(hash(commandsBytes), frozenDigests.commandsSha256, 'frozen S commands');
            assert.equal(hash(censusBytes), frozenDigests.censusSha256, 'frozen S census');
            assert.equal(hash(sourceBytes), frozenDigests.sourceManifestSha256, 'frozen S source manifest');
          }
          BINDING
          node --input-type=module <<'RUNNER'
          import { spawn, execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { performance } from 'node:perf_hooks';
          const root = process.cwd();
          const output = resolve(root, 'artifacts/9971-reference-capture');
          const cwd = resolve(root, 'deployables/platform-api');
          const scripts = JSON.parse(readFileSync(resolve(cwd, 'package.json'), 'utf8')).scripts;
          const eventPayload = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const commandText = (file, args, options = {}) => execFileSync(file, args, {
            cwd, encoding: 'utf8', timeout: 10000, ...options,
          }).trim();
          const identity = {
            checkoutSha: execFileSync('git', ['rev-parse', 'HEAD'], { cwd, encoding: 'utf8' }).trim(),
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            job: process.env.GITHUB_JOB, event: process.env.GITHUB_EVENT_NAME,
            workflow: process.env.GITHUB_WORKFLOW, workflowRef: process.env.GITHUB_WORKFLOW_REF,
            workflowSha: process.env.GITHUB_WORKFLOW_SHA, repository: process.env.GITHUB_REPOSITORY,
            ref: process.env.GITHUB_REF, runnerOs: process.env.RUNNER_OS,
            githubSha: process.env.GITHUB_SHA, pushAfter: eventPayload.after,
            captureParent: '0e6d46f7eda95b4788ff0cc96e2b02ac473d6761',
            sourceBase: '0e6d46f7eda95b4788ff0cc96e2b02ac473d6761',
            jobName: 'Diagnostic API Bootstrap Measurement Only',
            parents: commandText('git', ['cat-file', '-p', 'HEAD']).split('\n\n', 1)[0]
              .split('\n').filter(line => line.startsWith('parent ')).map(line => line.slice(7)),
            node: process.version, pnpm: commandText('pnpm', ['--version']),
            vitest: commandText('pnpm', ['exec', 'vitest', '--version']),
            imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion,
            runnerImage: 'ubuntu-latest', postgresImage: 'pgvector/pgvector:pg16',
            postgresImageDigests: JSON.parse(readFileSync(resolve(output, 'postgres-image-digests.json'), 'utf8')),
            laneMode: process.env.CHASE_SETS_LANE_MODE ?? null,
            maxWorkers: 3, workspaceConcurrency: 2, serialUnits: 3,
            unitDeadlineMs: 600000, aggregateDeadlineMs: 1800000, modeledUnitCeilingMs: 420000, modeledAggregateCeilingMs: 1080000,
          };
          writeFileSync(resolve(output, 'identity.json'), JSON.stringify(identity, null, 2));
          const units = [];
          const saveUnits = () => writeFileSync(resolve(output, 'units.json'), JSON.stringify(units, null, 2));
          saveUnits();
          if (identity.checkoutSha !== identity.githubSha || identity.pushAfter !== identity.githubSha
            || identity.runAttempt !== '1' || identity.event !== 'push'
            || identity.repository !== 'chase-sets/chase-sets'
            || identity.ref !== 'refs/heads/codex/9971-capture-r2'
            || JSON.stringify(identity.parents) !== JSON.stringify([identity.captureParent])
            || identity.laneMode !== null || !identity.node.startsWith('v24.') || identity.pnpm !== '11.0.9'
            || !identity.imageOS || !identity.imageVersion || identity.postgresImageDigests.length === 0) {
            throw new Error('Capture identity, source parent, or current settings mismatch');
          }
          const { createHash } = await import('node:crypto');
          const { basename } = await import('node:path');
          const { deriveBootstrapDbCaseIdentities, derivePlatformApiDbTestCensus,
            bootstrapDbEnrollmentManifest, platformApiNonBootstrapDbCensus } =
            await import('./deployables/platform-api/scripts/check-bootstrap-db-enrollment.mjs');
          const { captureCensusFiles, deriveCaptureCensusCaseNames } =
            await import('./deployables/platform-api/scripts/8396-capture-census.mjs');
          const { pathToFileURL } = await import('node:url');
          const binding = await import(pathToFileURL(resolve(output, 's-binding.mjs')).href);
          const assert = (await import('node:assert/strict')).default;
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          binding.assertSoleSParent(identity);
          assert.equal(hash(readFileSync(resolve(cwd, 'scripts/8396-capture-census.mjs'))), binding.censusHelperSha256,
            'immutable census helper bytes');
          const files = binding.frozenGroups;
          const sourceFiles = commandText('git', ['ls-files', 'bounded-contexts', 'contracts',
            'infrastructure', 'deployables/platform-api', 'packages', 'scripts', 'pnpm-lock.yaml',
            'pnpm-workspace.yaml', 'package.json', '.github/actions/setup-pnpm-workspace', 'vitest.shared.mjs'],
            { cwd: root }).split('\n').filter(file => !file.includes('/8396-capture-'));
          const sourceBytes = Buffer.from(JSON.stringify({ sourceBase: identity.sourceBase,
            files: Object.fromEntries(sourceFiles.map(file => [file, hash(readFileSync(resolve(root, file)))])),
          }, null, 2) + '\n');
          assert.deepEqual(commandText('git', ['diff', '--name-only', identity.sourceBase, 'HEAD'], { cwd: root })
            .split('\n').filter(Boolean), ['.github/workflows/9971-bootstrap-db-input-capture.yml'],
            'only the authorized temporary workflow may differ from frozen S');
          commandText('git', ['diff', '--exit-code', identity.sourceBase, '--', 'bounded-contexts', 'contracts',
            'infrastructure', 'deployables/platform-api', 'packages', 'scripts', 'pnpm-lock.yaml',
            'pnpm-workspace.yaml', 'package.json', '.github/actions/setup-pnpm-workspace', 'vitest.shared.mjs'],
            { cwd: root });
          const sourceBinding = JSON.parse(sourceBytes);
          assert.equal(sourceBinding.sourceBase, identity.sourceBase);
          for (const [file, expected] of Object.entries(sourceBinding.files)) {
            assert.equal(hash(readFileSync(resolve(root, file))), expected, file + ' source equality');
          }
          writeFileSync(resolve(output, 'capture-sources.json'), sourceBytes);
          const census = derivePlatformApiDbTestCensus({ platformApiRoot: cwd });
          const fixture = readFileSync(resolve(cwd, '__tests__/operator-session/fixture.ts'), 'utf8');
          const { commands: captureCommands, commandsBytes, manifest, manifestBytes, censusBytes } = binding.precheckSCorpus({
            groups: files, scripts, census, readTest: file => readFileSync(resolve(cwd, '__tests__', file)), fixture,
            deriveBootstrapDbCaseIdentities, captureCensusFiles, deriveCaptureCensusCaseNames,
            declaredManifest: bootstrapDbEnrollmentManifest, declaredCensus: platformApiNonBootstrapDbCensus });
          writeFileSync(resolve(output, 'capture-manifest.json'), manifestBytes);
          writeFileSync(resolve(output, 'source-census.json'), censusBytes);
          writeFileSync(resolve(output, 'capture-commands.json'), commandsBytes);
          identity.sourceManifestSha256 = hash(sourceBytes);
          identity.caseManifestSha256 = hash(manifestBytes);
          identity.commandsSha256 = hash(commandsBytes);
          identity.censusSha256 = hash(censusBytes);
          identity.bindingModuleSha256 = hash(readFileSync(resolve(output, 's-binding.mjs')));
          identity.censusHelperSha256 = binding.censusHelperSha256;
          writeFileSync(resolve(output, 's-binding.json'), JSON.stringify({ sourceBase: identity.sourceBase,
            groups: files, digests: binding.frozenDigests, counts: binding.frozenCounts,
            bindingModuleSha256: identity.bindingModuleSha256, censusHelperSha256: identity.censusHelperSha256,
          }, null, 2));
          writeFileSync(resolve(output, 'identity.json'), JSON.stringify(identity, null, 2));
          binding.assertFrozenDigests({ groups: files, manifestBytes, commandsBytes, censusBytes, sourceBytes });
          for (const unit of Object.keys(files)) {
            const args = ['exec', ...captureCommands[unit].split(' '),
              `--reporter=${resolve(output, 'reporter.mjs')}`, '--reporter=json',
              `--outputFile.json=${resolve(output, unit.replaceAll(':', '-') + '.json')}`];
            const startedAt = new Date().toISOString();
            const start = performance.now();
            const record = { unit, ordinaryCommand: scripts[unit], command: ['pnpm', ...args],
              startedAt, deadlineMs: 600000, status: 'running', timedOut: false, interrupted: null };
            units.push(record);
            saveUnits();
            const child = spawn('pnpm', args, { cwd, stdio: 'inherit', detached: true, env: {
              ...process.env, BOOTSTRAP_DB_EVIDENCE_UNIT: unit,
              MEASUREMENT_OUTPUT: resolve(output, unit.replaceAll(':', '-') + '.jsonl'),
            }});
            record.pid = child.pid ?? null;
            const groupMembers = () => child.pid ? commandText('ps', ['-eo', 'pid=,ppid=,pgid=,stat=,comm='], { timeout: 1000 })
              .split('\n').map(line => line.trim().split(/\s+/))
              .filter(fields => Number(fields[2]) === child.pid) : [];
            const terminateGroup = reason => {
              record.terminationReason ??= reason;
              record.terminationAt = new Date().toISOString();
              if (child.pid) {
                try { process.kill(-child.pid, 'SIGKILL'); }
                catch (error) { if (error.code !== 'ESRCH') record.terminationError = error.message; }
              }
              saveUnits();
            };
            const onTerm = () => { record.interrupted = 'SIGTERM'; terminateGroup('host-cancellation'); };
            const onInt = () => { record.interrupted = 'SIGINT'; terminateGroup('host-cancellation'); };
            process.on('SIGTERM', onTerm);
            process.on('SIGINT', onInt);
            const timer = setTimeout(() => {
              record.timedOut = true;
              terminateGroup('unit-deadline');
            }, Math.max(0, 600000 - (performance.now() - start)));
            const result = await new Promise(resolveResult => {
              child.once('error', error => resolveResult({ status: null, signal: null, error }));
              child.once('exit', (status, signal) => resolveResult({ status, signal }));
            });
            clearTimeout(timer);
            record.processExitedAt = new Date().toISOString();
            record.exitCode = result.status;
            record.signal = result.signal;
            record.error = result.error?.message ?? null;
            const cleanupStart = performance.now();
            record.cleanupStartedAt = new Date().toISOString();
            record.membersAtExit = groupMembers();
            if (record.membersAtExit.length > 0) terminateGroup('descendants-after-exit');
            while (performance.now() - cleanupStart < 1000 && groupMembers().length > 0) {
              await new Promise(resolveWait => setTimeout(resolveWait, 10));
            }
            record.membersAfterCleanup = groupMembers();
            record.cleanupComplete = record.membersAfterCleanup.length === 0 && !record.terminationError;
            record.finishedAt = new Date().toISOString();
            record.cleanupDurationMs = performance.now() - cleanupStart;
            record.durationMs = performance.now() - start;
            record.status = result.status === 0 && !record.timedOut && !record.interrupted
              && !record.terminationReason && record.cleanupComplete && record.durationMs <= 600000
              ? 'passed' : 'failed';
            saveUnits();
            process.off('SIGTERM', onTerm);
            process.off('SIGINT', onInt);
            if (record.status !== 'passed') { process.exitCode = 1; break; }
          }
          if (units.length !== Object.keys(files).length || units.some(unit => unit.status !== 'passed')) process.exitCode = 1;
          if (!process.exitCode) {
            for (const [unit, selected] of Object.entries(files)) {
              const rows = readFileSync(resolve(output, unit.replaceAll(':', '-') + '.jsonl'), 'utf8')
                .trim().split('\n').map(line => JSON.parse(line));
              const completed = rows.filter(row => row.runEnd);
              assert.equal(completed.length, 1);
              assert.equal(completed[0].reason, 'passed');
              assert.deepEqual(completed[0].errors, []);
              const modules = rows.filter(row => !row.runEnd);
              assert.deepEqual(modules.map(row => row.file).sort(), selected.map(file => basename(file)).sort());
              for (const row of modules) {
                const entry = manifest[row.file];
                assert.equal(row.state, 'passed');
                assert.deepEqual(row.errors, []);
                assert.equal(row.sourceSha256, entry.sourceSha256);
                assert.deepEqual(row.identities, entry.cases);
                assert.deepEqual(row.cases.map(test => test.name).sort(),
                  (entry.censusCaseNames ?? entry.cases.map(test => test.name)).sort());
                for (const test of row.cases) {
                  assert.equal(test.result.state, 'passed');
                  assert(Number.isFinite(test.diagnostic.duration) && test.diagnostic.duration >= 0);
                }
              }
            }
          }
          RUNNER

      - name: Preserve all diagnostic measurements including failures
        if: always() && github.event_name == 'push' && github.run_attempt == 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 9971-reference-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/9971-reference-capture/
            deployables/platform-api/artifacts/bootstrap-db-evidence/
          if-no-files-found: error
