name: 10062 Bootstrap DB Input Capture Only
on:
  workflow_dispatch:
    inputs:
      host_ticket:
        description: Host capture admission ticket
        required: true
        type: string
permissions:
  contents: read
jobs:
  precheckSCorpus:
    name: precheckSCorpus (M25 source; shipped three-unit and paired two-unit)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'chase-sets/chase-sets' && github.ref == 'refs/heads/codex/10062-capture-a29' && github.run_attempt == 1 && inputs.host_ticket != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true
      - name: Restore immutable diagnostic-only census helpers
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "0038c72c376f1d068629a8b73dc917299603d298"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch --no-tags origin e04bf62981772c43adb0eb6695261679df9f1bd1
          git show e04bf62981772c43adb0eb6695261679df9f1bd1:deployables/platform-api/scripts/8396-capture-census.mjs > deployables/platform-api/scripts/8396-capture-census.mjs
          node --input-type=module <<'PATCH'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'deployables/platform-api/scripts/8396-capture-census.mjs';
          const source = readFileSync(path, 'utf8');
          const replacement = `export const captureCensusFiles = Object.freeze([\n  "operator-session/operator-session-grant-mint.db.test.ts",\n  "operator-session/operator-session-grant-scope.db.test.ts",\n  "operator-session/operator-session-push.db.test.ts",\n  "seed-command-catalog.db.test.ts",\n]);`;
          const updated = source.replace(/export const captureCensusFiles = Object\.freeze\(\[.*?\]\);/s, replacement);
          if (updated === source) throw new Error('capture census file list was not found');
          writeFileSync(path, updated);
          PATCH
          echo "6ffb473dc35ae57f19edc9c02f58105b86663965ec1f16126a451c9c4e6bf384  deployables/platform-api/scripts/8396-capture-census.mjs" | sha256sum -c -
      - name: Premeasure both frozen roles without executing tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/10062-precheck
          cat > artifacts/10062-precheck/current-three-unit-binding.mjs <<'BINDING_current_three_unit'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { basename } from 'node:path';
          // Evidence-only binding for the one #10062 capture of frozen S. Every unit, file,
          // case and command below is S's own, derived from S by the canonical producers
          // before publication; nothing is carried over from an earlier capture's groups.
          export const frozenS = '0038c72c376f1d068629a8b73dc917299603d298';
          export const role = "current-three-unit";
          export const frozenShippedGroups = Object.freeze({
            "test:db:1": [
              "bootstrap-production-reconciliation.db.test.ts",
              "authoritative-seed-resume-core.db.test.ts",
              "authoritative-seed-resume-reconciliation.db.test.ts"
            ],
            "test:db:2": [
              "connector-mount-gate-isolation.db.test.ts",
              "bootstrap-lock-contention.db.test.ts",
              "seed-command-full-pools.db.test.ts",
              "bootstrap-scenario.db.test.ts",
              "catalog-seed-aggregate-state.db.test.ts",
              "bootstrap-shared-seed-command.db.test.ts",
              "operator-session/operator-session-grant-mint.db.test.ts",
              "operator-session/operator-session-grant-scope.db.test.ts",
              "seed-command-catalog.db.test.ts",
              "operator-session/operator-session-push.db.test.ts"
            ],
            "test:db:3": [
              "inventory-seed-resume.db.test.ts",
              "catalog-seed-interruption-resume.db.test.ts",
              "authoritative-seed-resume-recovery.db.test.ts"
            ]
          });
          export const frozenGroups = Object.freeze({
            "test:db:1": [
              "bootstrap-production-reconciliation.db.test.ts",
              "authoritative-seed-resume-core.db.test.ts",
              "authoritative-seed-resume-reconciliation.db.test.ts"
            ],
            "test:db:2": [
              "connector-mount-gate-isolation.db.test.ts",
              "bootstrap-lock-contention.db.test.ts",
              "seed-command-full-pools.db.test.ts",
              "bootstrap-scenario.db.test.ts",
              "catalog-seed-aggregate-state.db.test.ts",
              "bootstrap-shared-seed-command.db.test.ts",
              "operator-session/operator-session-grant-mint.db.test.ts",
              "operator-session/operator-session-grant-scope.db.test.ts",
              "seed-command-catalog.db.test.ts",
              "operator-session/operator-session-push.db.test.ts"
            ],
            "test:db:3": [
              "inventory-seed-resume.db.test.ts",
              "catalog-seed-interruption-resume.db.test.ts",
              "authoritative-seed-resume-recovery.db.test.ts"
            ]
          });
          export const frozenDigests = Object.freeze({
            "caseManifestSha256": "9411ee70fbb1aebdfdc82e1dea3424f1e6bbbede0f01850296552b5549a184e8",
            "commandsSha256": "10b58b46b04d27510ad6be2331833003297163381de38779e05b5709cb1a9f07",
            "censusSha256": "02fb19ecc1966cb95c3300dda9635c8fc5741319e8571b92c7c9cb721ca504b9",
            "sourceManifestSha256": "b143152be8cf97d2b697359085d092b8ca24a2b0f9dd0a08a4243d963680a8e2"
          });
          export const frozenCounts = Object.freeze({"files":16,"bootstrapFiles":12,"bootstrapCases":71,"cases":82});
          // The immutable #8396 census helper supplies only its reviewed literal-table parser.
          export const censusHelperSha256 = '6ffb473dc35ae57f19edc9c02f58105b86663965ec1f16126a451c9c4e6bf384';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const guard = 'node ./scripts/check-bootstrap-db-enrollment.mjs && ';
          const commandBody = files => 'vitest run --config ./vitest.config.ts '
