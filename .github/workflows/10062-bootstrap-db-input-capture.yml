          // Builds the case manifest from S's sources and requires every file's unit to equal
          // S's mirrored checker declaration (bootstrap manifest or non-bootstrap census).
          export function deriveSCaseManifest({ groups, readTest, fixture, deriveBootstrapDbCaseIdentities,
            captureCensusFiles, deriveCaptureCensusCaseNames, declaredManifest, declaredCensus }) {
            const manifest = {};
            for (const [unit, selected] of Object.entries(groups)) {
              for (const file of selected) {
                const bytes = readTest(file);
                const source = bytes.toString('utf8');
                const cases = deriveBootstrapDbCaseIdentities(file, source);
                assert.deepEqual(deriveBootstrapDbCaseIdentities(basename(file), source), cases, file + ' basename identity');
                const entry = { executionUnit: unit, sourceSha256: hash(bytes), cases };
                if (captureCensusFiles.includes(file)) {
                  entry.censusCaseNames = deriveCaptureCensusCaseNames(file, source, fixture);
                  assert.equal(declaredManifest[basename(file)], undefined, file + ' is not a declared bootstrap file');
                  assert.equal(declaredCensus.entries['__tests__/' + file], Object.keys(frozenShippedGroups).find(key => frozenShippedGroups[key].includes(file)), file + ' declared census unit');
                } else {
                  const declared = declaredManifest[basename(file)];
                  assert(declared, file + ' declared bootstrap entry');
                  assert.equal(declared.executionUnit, Object.keys(frozenShippedGroups).find(key => frozenShippedGroups[key].includes(file)), file + ' declared unit');
                  assert.deepEqual(declared.cases.map(({ name, identity }) => ({ name, identity })), cases, file + ' declared identities');
                }
                assert.equal(manifest[basename(file)], undefined, file + ' captured once');
                manifest[basename(file)] = entry;
              }
            }
            assert.deepEqual(Object.keys(declaredManifest).sort(),
              Object.keys(manifest).filter(name => !manifest[name].censusCaseNames).sort(), 'declared bootstrap files');
            assert.deepEqual(Object.keys(declaredCensus.entries).sort(),
              Object.values(groups).flat().filter(file => captureCensusFiles.includes(file)).map(file => '__tests__/' + file).sort(),
              'declared non-bootstrap census files');
            return { manifest, manifestBytes: Buffer.from(JSON.stringify(manifest, null, 2) + '\n') };
          }
          export function precheckSCorpus({ groups, scripts, census, readTest, fixture, deriveBootstrapDbCaseIdentities,
            captureCensusFiles, deriveCaptureCensusCaseNames, declaredManifest, declaredCensus }) {
            assert.deepEqual(census.violations, []);
            assert.equal(census.bootstrapEntries.length, frozenCounts.bootstrapFiles);
            assert.equal(census.dbEntries.length, frozenCounts.files);
            assert.deepEqual([...census.dbEntries].sort(), Object.values(groups).flat().map(file => '__tests__/' + file).sort());
            assert.deepEqual(census.dbEntries.filter(entry => !census.bootstrapEntries.includes(entry)).sort(),
              captureCensusFiles.map(file => '__tests__/' + file).sort(), 'non-bootstrap census files');
            const commands = bindSScripts(scripts, groups);
            const { manifest, manifestBytes } = deriveSCaseManifest({ groups, readTest, fixture, deriveBootstrapDbCaseIdentities,
              captureCensusFiles, deriveCaptureCensusCaseNames, declaredManifest, declaredCensus });
            assert.equal(Object.keys(manifest).length, frozenCounts.files);
            assert.equal(Object.values(manifest).filter(entry => !entry.censusCaseNames).flatMap(entry => entry.cases).length,
              frozenCounts.bootstrapCases);
            assert.equal(Object.values(manifest).reduce((count, entry) => count + (entry.censusCaseNames ?? entry.cases).length, 0),
              frozenCounts.cases);
            for (const name of ['test:unit', 'test:fast']) {
              assert.deepEqual([...scripts[name].matchAll(/--exclude ([^ ]+)/g)].map(match => match[1]).sort(), [...census.dbEntries].sort(),
                name + ' excludes');
            }
            const commandsBytes = Buffer.from(JSON.stringify(commands, null, 2));
            const censusBytes = Buffer.from(JSON.stringify(census, null, 2));
            return { commands, commandsBytes, manifest, manifestBytes, censusBytes };
          }
          // Equality with the frozen S values must hold before any measurement starts.
          export function assertFrozenDigests({ groups, manifestBytes, commandsBytes, censusBytes, sourceBytes }) {
            assert.deepEqual(groups, frozenGroups, 'groups are the frozen S groups');
            assert.equal(hash(manifestBytes), frozenDigests.caseManifestSha256, 'frozen S case manifest');
            assert.equal(hash(commandsBytes), frozenDigests.commandsSha256, 'frozen S commands');
            assert.equal(hash(censusBytes), frozenDigests.censusSha256, 'frozen S census');
            assert.equal(hash(sourceBytes), frozenDigests.sourceManifestSha256, 'frozen S source manifest');
          }
          BINDING_current_three_unit
