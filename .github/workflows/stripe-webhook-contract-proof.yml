name: Stripe Webhook Contract Proof

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stripe-webhook-contract-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove Stripe Test-Mode Webhook Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Create, update, and delete test-mode Payments endpoint
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: >-
          node ./scripts/provider-webhook-lifecycle.mjs prove-payment-events
          --namespace "contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
