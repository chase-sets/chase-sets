name: Platform DOKS Foundation Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: DOKS environment to apply.
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      kubernetes_version:
        description: Supported DigitalOcean Kubernetes version slug, for example 1.36.0-do.2.
        required: true
        type: string
      version_change:
        description: Declare whether this apply keeps the live version or performs a listed upgrade.
        required: true
        default: none
        type: choice
        options:
          - none
          - upgrade
      image_tag:
        description: Immutable platform image tag to use for the DOCR pull proof, such as a release-* tag or commit SHA.
        required: true
        type: string
      confirm:
        description: Type "apply doks foundation" to confirm creating or updating DOKS infrastructure.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-doks-foundation-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply DOKS Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_kubernetes_version: ${{ inputs.kubernetes_version }}
      PLATFORM_IMAGE_REF: registry.digitalocean.com/chase-sets/chase-sets-platform:${{ inputs.image_tag }}
    steps:
      - name: Confirm DOKS foundation apply
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "apply doks foundation" ]; then
            echo "Confirmation input must exactly equal 'apply doks foundation'." >&2
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        with:
          terraform_wrapper: false

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Validate DOKS apply configuration
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY DIGITALOCEAN_ACCESS_TOKEN TF_VAR_kubernetes_version PLATFORM_IMAGE_REF
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required DOKS apply configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ "${{ inputs.image_tag }}" = "latest" ]; then
            echo "DOKS foundation proof requires an immutable image tag, not 'latest'." >&2
            exit 1
          fi

      - name: Terraform init DOKS state
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/${{ inputs.environment }}.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format DOKS
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        working-directory: infrastructure/digitalocean/doks
        run: terraform fmt -check -recursive

      - name: Preflight DOKS version change
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          mkdir -p artifacts/doks-foundation
          captured_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          preflight="artifacts/doks-foundation/pre-apply-cluster.json"
          cluster_read="$(mktemp)"
          cluster_normalized="$(mktemp)"
          cluster_error="$(mktemp)"
          upgrades_read="$(mktemp)"
          state_list="$(mktemp)"
          trap 'rm -f "$cluster_read" "$cluster_normalized" "$cluster_error" "$upgrades_read" "$state_list"' EXIT

          version_change="${{ inputs.version_change }}"
          if ! terraform state list > "$state_list" 2> "$cluster_error"; then
            jq -n --arg capturedAt "$captured_at" '{state: "read-error", captured_at: $capturedAt}' > "$preflight"
            echo "DOKS Terraform state read failed; refusing to classify the cluster as absent." >&2
            exit 1
          fi
          if ! grep -Fxq 'digitalocean_kubernetes_cluster.platform' "$state_list"; then
            jq -n --arg capturedAt "$captured_at" '{state: "absent", captured_at: $capturedAt}' > "$preflight"
            exit 0
          fi

          if ! cluster_id="$(terraform output -raw cluster_id 2> "$cluster_error")"; then
            jq -n --arg capturedAt "$captured_at" '{state: "read-error", captured_at: $capturedAt}' > "$preflight"
            echo "DOKS cluster ID read failed; refusing to classify the cluster as absent." >&2
            exit 1
          fi

          if ! doctl kubernetes cluster get "$cluster_id" --output json > "$cluster_read" 2> "$cluster_error"; then
            jq -n --arg capturedAt "$captured_at" '{state: "read-error", captured_at: $capturedAt}' > "$preflight"
            echo "DOKS cluster read failed; refusing to classify the state as absent." >&2
            exit 1
          fi

          if ! jq -ce '
            if type == "array" then
              if length == 1 then .[0] else error("expected exactly one cluster") end
            elif type == "object" then .
            else error("expected an object or one-element array")
            end
            | if type == "object" and (.id | type == "string") and (.version | type == "string") then .
              else error("cluster response is missing required fields")
              end
          ' "$cluster_read" > "$cluster_normalized" 2> "$cluster_error"; then
            jq -n --arg capturedAt "$captured_at" '{state: "read-error", captured_at: $capturedAt}' > "$preflight"
            echo "DOKS cluster response was not exactly one valid object; refusing to classify the state as absent." >&2
            exit 1
          fi

          jq --arg capturedAt "$captured_at" '{
            state: "present",
            id: .id,
            version: .version,
            auto_upgrade: .auto_upgrade,
            surge_upgrade: .surge_upgrade,
            maintenance_policy: .maintenance_policy,
            updated_at: .updated_at,
            captured_at: $capturedAt
          }' "$cluster_normalized" > "$preflight"

          live_version="$(jq -r '.version' "$preflight")"
          if [ "$version_change" = "none" ]; then
            if [ "$live_version" != "${{ inputs.kubernetes_version }}" ]; then
              echo "version_change=none requires the live DOKS version to match the requested slug." >&2
              exit 1
            fi
          elif [ "$version_change" = "upgrade" ]; then
            if ! doctl kubernetes cluster get-upgrades "$cluster_id" --output json > "$upgrades_read"; then
              echo "DOKS get-upgrades read failed; refusing the version change." >&2
              exit 1
            fi
            jq '.' "$upgrades_read" > artifacts/doks-foundation/get-upgrades.json
            if ! jq -e --arg target "${{ inputs.kubernetes_version }}" 'any(.. | objects; (.slug? == $target or .version? == $target))' "$upgrades_read" >/dev/null; then
              echo "Requested DOKS upgrade target is not listed by get-upgrades." >&2
              exit 1
            fi
          else
            echo "version_change must be none or upgrade." >&2
            exit 1
          fi

      - name: Terraform validate DOKS
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        working-directory: infrastructure/digitalocean/doks
        run: terraform validate

      - name: Terraform plan DOKS
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        working-directory: infrastructure/digitalocean/doks
        run: terraform plan -out=tfplan

      - name: Inspect Terraform plan DOKS
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          plan_json="$(mktemp)"
          trap 'rm -f "$plan_json"' EXIT
          terraform show -json tfplan > "$plan_json"
          node "$GITHUB_WORKSPACE/scripts/terraform-plan-inspection.mjs" summarize-plan "$plan_json" --title="DOKS Terraform plan" | tee -a "$GITHUB_STEP_SUMMARY"
          node "$GITHUB_WORKSPACE/scripts/terraform-plan-inspection.mjs" assert-no-destructive-changes tfplan

      - name: Terraform apply DOKS
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        working-directory: infrastructure/digitalocean/doks
        run: terraform apply -auto-approve tfplan

      - name: Verify DOKS cluster and nodes
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        id: verify
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          mkdir -p artifacts/doks-foundation
          kubeconfig="$(mktemp)"
          terraform output -raw kubeconfig > "$kubeconfig"
          chmod 600 "$kubeconfig"
          export KUBECONFIG="$kubeconfig"

          cluster_id="$(terraform output -raw cluster_id)"
          cluster_name="$(terraform output -raw cluster_name)"
          registry_enabled="$(terraform output -raw registry_integration_enabled)"
          proof_namespace="chase-sets-doks-proof"
          if [ "$registry_enabled" != "true" ]; then
            echo "DOKS cluster does not report DOCR registry integration." >&2
            exit 1
          fi

          kubectl get nodes -o wide
          kubectl wait --for=condition=Ready nodes --all --timeout=10m

          node_count="$(kubectl get nodes -o json | jq '.items | length')"
          if [ "$node_count" -lt 1 ]; then
            echo "DOKS cluster reported zero nodes." >&2
            exit 1
          fi

          doctl kubernetes cluster get "$cluster_id" --output json > artifacts/doks-foundation/cluster.json
          kubectl get nodes -o json > artifacts/doks-foundation/nodes.json

          collect_proof_diagnostics() {
            mkdir -p artifacts/doks-foundation/image-pull-proof
            kubectl get job platform-image-pull-proof -n "$proof_namespace" -o yaml \
              > artifacts/doks-foundation/image-pull-proof/job.yaml 2>/dev/null || true
            kubectl describe job platform-image-pull-proof -n "$proof_namespace" \
              > artifacts/doks-foundation/image-pull-proof/job-describe.txt 2>&1 || true
            kubectl get pods -n "$proof_namespace" -o wide \
              > artifacts/doks-foundation/image-pull-proof/pods.txt 2>&1 || true
            kubectl get pods -n "$proof_namespace" -o yaml \
              > artifacts/doks-foundation/image-pull-proof/pods.yaml 2>/dev/null || true
            kubectl describe pods -n "$proof_namespace" \
              > artifacts/doks-foundation/image-pull-proof/pods-describe.txt 2>&1 || true
            kubectl get events -n "$proof_namespace" --sort-by=.metadata.creationTimestamp \
              > artifacts/doks-foundation/image-pull-proof/events.txt 2>&1 || true
            kubectl logs job/platform-image-pull-proof -n "$proof_namespace" --all-containers \
              > artifacts/doks-foundation/image-pull-proof/logs.txt 2>&1 || true
          }

          kubectl create namespace "$proof_namespace" --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete job platform-image-pull-proof -n "$proof_namespace" --ignore-not-found=true
          kubectl create job platform-image-pull-proof \
            -n "$proof_namespace" \
            --image="$PLATFORM_IMAGE_REF" \
            -- node --version
          if ! kubectl wait --for=condition=Complete job/platform-image-pull-proof -n "$proof_namespace" --timeout=5m; then
            echo "DOKS image-pull proof did not complete. Capturing job, pod, event, and log diagnostics." >&2
            collect_proof_diagnostics
            kubectl delete namespace "$proof_namespace" --wait=false || true
            exit 1
          fi
          kubectl logs job/platform-image-pull-proof -n "$proof_namespace"
          kubectl delete namespace "$proof_namespace" --wait=false

          jq -n \
            --arg environment "${{ inputs.environment }}" \
            --arg clusterId "$cluster_id" \
            --arg clusterName "$cluster_name" \
            --arg registryIntegrationEnabled "$registry_enabled" \
            --arg imagePullProof "$PLATFORM_IMAGE_REF" \
            --argjson nodeCount "$node_count" \
            '{
              environment: $environment,
              clusterId: $clusterId,
              clusterName: $clusterName,
              registryIntegrationEnabled: ($registryIntegrationEnabled == "true"),
              nodeCount: $nodeCount,
              imagePullProof: $imagePullProof
            }' > artifacts/doks-foundation/summary.json

          {
            echo "cluster_id=${cluster_id}"
            echo "cluster_name=${cluster_name}"
            echo "node_count=${node_count}"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize DOKS foundation
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        if: always()
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          record="artifacts/doks-foundation/summary.json"
          {
            echo "## DOKS Foundation"
            echo ""
            if [ ! -f "$record" ]; then
              echo "No DOKS foundation summary was written."
              exit 0
            fi
            jq -r '
              "- Environment: \(.environment)",
              "- Cluster: \(.clusterName) (\(.clusterId))",
              "- Node count: \(.nodeCount)",
              "- DOCR integration: \(.registryIntegrationEnabled)",
              "- Image pull proof: \(.imagePullProof)"
            ' "$record"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DOKS foundation evidence
        env:
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-doks-foundation-${{ inputs.environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: infrastructure/digitalocean/doks/artifacts/doks-foundation
          if-no-files-found: ignore
          retention-days: 30
