            process.off('SIGTERM', onTerm);
            process.off('SIGINT', onInt);
            if (record.status !== 'passed') { process.exitCode = 1; break; }
          }
          if (units.length !== Object.keys(files).length || units.some(unit => unit.status !== 'passed')) process.exitCode = 1;
          if (!process.exitCode) {
            for (const [unit, selected] of Object.entries(files)) {
              const rows = readFileSync(resolve(output, unit.replaceAll(':', '-') + '.jsonl'), 'utf8')
