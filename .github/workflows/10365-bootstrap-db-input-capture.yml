          CAPTURE_ROLE: paired-two-unit
        run: |
          set -euo pipefail
          test -d deployables/platform-api/artifacts/bootstrap-db-evidence
          test ! -e "artifacts/10778-${CAPTURE_ROLE}-capture/bootstrap-db-evidence"
          cp -a deployables/platform-api/artifacts/bootstrap-db-evidence "artifacts/10778-${CAPTURE_ROLE}-capture/bootstrap-db-evidence"
          cp artifacts/10778-phase-guard.mjs "artifacts/10778-${CAPTURE_ROLE}-capture/phase-guard.mjs"
          node --input-type=module <<'COMPLETE'
          import assert from 'node:assert/strict';
          import { readRole, runtime, assertPair } from './artifacts/10778-phase-guard.mjs';
          import { appendFileSync } from 'node:fs';
          const { identity } = readRole(process.cwd(), process.env.CAPTURE_ROLE);
          assert.equal(identity.imageOS, process.env.ImageOS);
          assert.equal(identity.imageVersion, process.env.ImageVersion);
          assert(identity.imageOS && identity.imageVersion);
          if (identity.role === 'paired-two-unit') assertPair(process.cwd());
          appendFileSync(process.env.GITHUB_OUTPUT, 'imageOS=' + identity.imageOS + '\nimageVersion=' + identity.imageVersion + '\nruntimeIdentity=' + JSON.stringify(runtime(identity)) + '\n');
          COMPLETE
      - name: Preserve paired-two-unit capture artifact
        id: pairedUpload
        if: always() && github.event_name == 'workflow_dispatch' && github.repository == 'chase-sets/chase-sets' && github.ref == 'refs/heads/codex/10778-capture-r3' && github.run_attempt == 1 && inputs.host_ticket != '' && (steps.paired.outcome == 'success' && steps.pairedComplete.outcome == 'success' && steps.resetComplete.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 10778-paired-two-unit-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/10778-paired-two-unit-capture/
          if-no-files-found: error
      - name: Preserve paired-two-unit diagnostic-only artifact
        id: pairedDiagnostics
        if: always() && github.event_name == 'workflow_dispatch' && github.repository == 'chase-sets/chase-sets' && github.ref == 'refs/heads/codex/10778-capture-r3' && github.run_attempt == 1 && inputs.host_ticket != '' && (steps.pairedDb.outcome != 'skipped' && (steps.paired.outcome != 'success' || steps.pairedComplete.outcome != 'success'))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 10778-paired-two-unit-diagnostic-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/10778-paired-two-unit-capture/
          if-no-files-found: error
      - name: Require both canonical role artifacts and nonoverlapping intervals
        if: always() && github.event_name == 'workflow_dispatch' && github.repository == 'chase-sets/chase-sets' && github.ref == 'refs/heads/codex/10778-capture-r3' && github.run_attempt == 1 && inputs.host_ticket != ''
        env:
          SHIPPED_UPLOAD: ${{ steps.shippedUpload.outcome }}
          PAIRED_UPLOAD: ${{ steps.pairedUpload.outcome }}
          SHIPPED_ARTIFACT_ID: ${{ steps.shippedUpload.outputs.artifact-id }}
          PAIRED_ARTIFACT_ID: ${{ steps.pairedUpload.outputs.artifact-id }}
          SHIPPED_ARTIFACT_DIGEST: ${{ steps.shippedUpload.outputs.artifact-digest }}
          PAIRED_ARTIFACT_DIGEST: ${{ steps.pairedUpload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test "$SHIPPED_UPLOAD" = success
          test "$PAIRED_UPLOAD" = success
          test -n "$SHIPPED_ARTIFACT_ID" && test -n "$PAIRED_ARTIFACT_ID"
          test "$SHIPPED_ARTIFACT_ID" != "$PAIRED_ARTIFACT_ID"
          test -n "$SHIPPED_ARTIFACT_DIGEST" && test -n "$PAIRED_ARTIFACT_DIGEST"
          node --input-type=module <<'PAIR'
          import { assertPair } from './artifacts/10778-phase-guard.mjs';
          assertPair(process.cwd());
          PAIR
      - name: Remove remaining capture containers and data volumes
        if: always()
        run: |
          set -euo pipefail
          for role in current-three-unit paired-two-unit; do
            container="capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${role}"
            volume="${container}-data"
            if [ -n "$(docker ps -aq --filter "name=^/${container}$")" ]; then timeout 60s docker rm -f "$container"; fi
            if [ -n "$(docker volume ls -q --filter "name=^${volume}$")" ]; then timeout 30s docker volume rm "$volume"; fi
            test -z "$(docker ps -aq --filter "name=^/${container}$")"
            test -z "$(docker volume ls -q --filter "name=^${volume}$")"
          done
      - name: Preserve serial orchestration failure diagnostics only
        if: failure() && github.event_name == 'workflow_dispatch' && github.repository == 'chase-sets/chase-sets' && github.ref == 'refs/heads/codex/10778-capture-r3' && github.run_attempt == 1 && inputs.host_ticket != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 10778-serial-diagnostic-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/10778-phase-guard.mjs
            artifacts/10778-db-reset.json
            artifacts/10778-current-three-unit-capture/
            artifacts/10778-paired-two-unit-capture/
            deployables/platform-api/artifacts/bootstrap-db-evidence/
          if-no-files-found: error
