            assert.equal(captureParent, frozenS, 'capture parent is frozen S');
            assert.equal(sourceBase, frozenS, 'source base is frozen S');
            assert.deepEqual(parents, [frozenS], 'the capture child has the sole parent S');
          }
          export function bindSScripts(scripts, groups) {
