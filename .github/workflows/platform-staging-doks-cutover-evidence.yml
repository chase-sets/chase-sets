name: Platform Staging DOKS Cutover Evidence

# Rehearse and prove the App Platform -> DOKS staging cutover (#4050, milestone
# #103, epic #4059) without moving live traffic. It runs the existing staging
# UAT battery (smoke, marketplace critical flows, Buy Now freshness probes,
# Stripe money smoke) against the DOKS endpoints selected by the phase, and
# captures support-safe cutover evidence: which platform served each host, the
# served TLS certificate chain, and — when a load balancer id is supplied —
# load balancer health.
#
# Phase "rehearse" targets the doks.<zone> shadow hosts (#4604) while App
# Platform still serves the live hosts, so the DOKS pipeline is proven
# end-to-end before the DNS flip. Phase "flip-soak" targets the live hosts once
# STAGING_APP_SERVING=doks, re-proving the same battery on the cut-over surface
# during the soak window. Rollback is DNS-only and needs no workflow.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "run staging doks cutover evidence" to confirm running the DOKS cutover battery.
        required: true
        type: string
      phase:
        description: rehearse (shadow doks.<zone> hosts) or flip-soak (live hosts after the flip).
        required: true
        default: rehearse
        type: choice
        options:
          - rehearse
          - flip-soak
      ingress_target:
        description: DOKS ingress load balancer IPv4 (the DOKS_INGRESS_TARGET value). Used to prove which platform served each host.
        required: true
        type: string
      zone:
        description: Staging environment zone.
        required: false
        default: staging.chasesets.com
        type: string
      load_balancer_id:
        description: Optional DigitalOcean load balancer id to include load balancer health in the evidence.
        required: false
        default: ""
        type: string
      release_ref:
        description: Ref containing the cutover tooling. Defaults to main.
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  # Share the staging deploy lane so the battery never races an in-flight deploy
  # or another cutover rehearsal against the same hosts.
  group: platform-staging-deploy
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    name: Refuse Unconfirmed DOKS Cutover Evidence
    runs-on: ubuntu-latest
    if: inputs.confirm != 'run staging doks cutover evidence'
    steps:
      - name: Refuse unconfirmed DOKS cutover evidence
        run: |
          echo 'Confirmation text did not match exactly; expected "run staging doks cutover evidence".' >&2
          exit 1

  cutover-evidence:
    name: Staging DOKS Cutover Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped'
    env:
      CUTOVER_PHASE: ${{ inputs.phase }}
      CUTOVER_ZONE: ${{ inputs.zone }}
      CUTOVER_INGRESS_TARGET: ${{ inputs.ingress_target }}
      CUTOVER_LOAD_BALANCER_ID: ${{ inputs.load_balancer_id }}
      CUTOVER_EVIDENCE_OUT: artifacts/cutover/staging-doks-cutover-evidence.json
    steps:
      - name: Confirm DOKS cutover evidence run
        run: |
          set -euo pipefail
          echo "Confirmed DOKS cutover evidence for phase '${CUTOVER_PHASE}' against zone '${CUTOVER_ZONE}'."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --release-ref "${{ inputs.release_ref }}" \
            --checkout true

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Resolve DOKS cutover target hosts
        id: hosts
        run: |
          set -euo pipefail
          zone="${CUTOVER_ZONE}"
          if [ -z "$zone" ]; then
            echo "Zone input was empty." >&2
            exit 1
          fi
          # rehearse -> doks.<zone> shadow hosts (App Platform still serves live);
          # flip-soak -> live hosts after STAGING_APP_SERVING=doks. The prefix map
          # mirrors infrastructure/digitalocean/environment-dns/locals.tf.
          if [ "${CUTOVER_PHASE}" = "rehearse" ]; then
            serving="app-platform"
            landing="doks.${zone}"
            www="www.doks.${zone}"
            marketplace="marketplace.doks.${zone}"
            admin="admin.doks.${zone}"
          else
            serving="doks"
            landing="${zone}"
            www="www.${zone}"
            marketplace="marketplace.${zone}"
            admin="admin.${zone}"
          fi
          {
            echo "serving=${serving}"
            echo "landing=${landing}"
            echo "www=${www}"
            echo "marketplace=${marketplace}"
            echo "admin=${admin}"
          } >> "$GITHUB_OUTPUT"
          echo "Phase ${CUTOVER_PHASE} targets marketplace=${marketplace} admin=${admin} landing=${landing}."

      - name: Capture DOKS cutover evidence
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/cutover
          args=(
            --serving "${{ steps.hosts.outputs.serving }}"
            --zone "${CUTOVER_ZONE}"
            --expected-target "${CUTOVER_INGRESS_TARGET}"
            --phase "${CUTOVER_PHASE}"
            --environment staging
            --out "${CUTOVER_EVIDENCE_OUT}"
          )
          if [ -n "${CUTOVER_LOAD_BALANCER_ID}" ]; then
            args+=(--load-balancer-id "${CUTOVER_LOAD_BALANCER_ID}")
          fi
          # Capture evidence but do not abort the battery on a soft miss; the
          # summary step surfaces the verdict and the artifact is uploaded.
          set +e
          pnpm run cutover:doks-evidence -- "${args[@]}"
          echo "cutover_evidence_exit=$?" >> "$GITHUB_ENV"
          set -e

      - name: Summarize DOKS cutover evidence
        if: always()
        run: |
          set -euo pipefail
          artifact="${CUTOVER_EVIDENCE_OUT}"
          if [ ! -f "$artifact" ]; then
            echo "Cutover evidence artifact was not written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Staging DOKS Cutover Evidence (${CUTOVER_PHASE})"
            echo
            jq -r '
              "- capturedAt: " + (.capturedAt // "unknown"),
              "- servingFlag: " + (.servingFlag // "unknown"),
              "- expectedIngressTarget: " + (.expectedIngressTarget // "unknown"),
              "- verdict: " + (.summary.verdict // "unknown"),
              "- loadBalancer: " + ((.loadBalancer.status // .loadBalancer.reason) // "not-checked"),
              "",
              "| Host | Served by | HTTP | TLS issuer | TLS expiry (days) | Matches DOKS LB |",
              "| --- | --- | ---: | --- | ---: | --- |",
              (.hosts[] | "| " + .host + " | " + .servingPlatform + " | " + ((.servedBy.httpStatus // "null") | tostring) + " | " + (.tls.issuerCommonName // "none") + " | " + ((.tls.daysUntilExpiry // "null") | tostring) + " | " + ((.dns.matchesExpectedTarget // "unknown") | tostring) + " |")
            ' "$artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check DOKS endpoints
        env:
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_MARKETPLACE: "true"
          SMOKE_WRITE_WAITLIST: "false"
          SMOKE_SOURCE: staging-doks-cutover
          SMOKE_UTM_CAMPAIGN: staging-doks-cutover
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
          SMOKE_FETCH_TIMEOUT_MS: "15000"
        run: |
          set -euo pipefail
          pnpm run smoke:platform -- \
            "https://${{ steps.hosts.outputs.landing }}" \
            "https://${{ steps.hosts.outputs.admin }}" \
            "https://${{ steps.hosts.outputs.marketplace }}"

      - name: Resolve Playwright Chromium version
        id: playwright-chromium
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "Could not resolve Playwright version from pnpm-lock.yaml." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-chromium.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: DOKS marketplace critical flows
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          CI: "true"
          PLAYWRIGHT_SKIP_WEB_SERVER: "true"
          MARKETPLACE_E2E_EMAIL: ${{ vars.MARKETPLACE_E2E_EMAIL || '' }}
          MARKETPLACE_E2E_PASSWORD: ${{ secrets.MARKETPLACE_E2E_PASSWORD || '' }}
          MARKETPLACE_E2E_SEARCH_QUERY: ${{ vars.MARKETPLACE_E2E_SEARCH_QUERY || 'charizard' }}
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || '' }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          ADMIN_WEB_URL: https://${{ steps.hosts.outputs.admin }}
          MARKETPLACE_WEB_URL: https://${{ steps.hosts.outputs.marketplace }}
        run: |
          set -euo pipefail
          pnpm run test:e2e:deployed

      - name: DOKS Buy Now freshness probes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          GUEST_BUY_NOW_PROBE_ITEM_PATH: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ITEM_PATH || '' }}
          GUEST_BUY_NOW_PROBE_SEARCH_QUERY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_SEARCH_QUERY || 'air balloon' }}
          GUEST_BUY_NOW_PROBE_FIXTURE_KEY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_FIXTURE_KEY || 'staging-guest-buy-now-fixture' }}
          GUEST_BUY_NOW_PROBE_TIMEOUT_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_TIMEOUT_MS || '45000' }}
          GUEST_BUY_NOW_PROBE_READY_SLO_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_READY_SLO_MS || '10000' }}
          GUEST_BUY_NOW_PROBE_SLO_MODE: ${{ vars.GUEST_BUY_NOW_CANARY_SLO_MODE || 'warn' }}
          GUEST_BUY_NOW_PROBE_ATTEMPTS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ATTEMPTS || '3' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_BUDGET_MS || '120000' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_POLL_INTERVAL_MS || '5000' }}
          MARKETPLACE_E2E_EMAIL: ${{ vars.MARKETPLACE_E2E_EMAIL || '' }}
          MARKETPLACE_E2E_PASSWORD: ${{ secrets.MARKETPLACE_E2E_PASSWORD || '' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health
          common_args=(
            --environment staging
            --base-url "https://${{ steps.hosts.outputs.marketplace }}"
            --admin-base-url "https://${{ steps.hosts.outputs.admin }}"
            --search-query "${GUEST_BUY_NOW_PROBE_SEARCH_QUERY}"
            --fixture-key "${GUEST_BUY_NOW_PROBE_FIXTURE_KEY}"
            --timeout-ms "${GUEST_BUY_NOW_PROBE_TIMEOUT_MS}"
            --ready-slo-ms "${GUEST_BUY_NOW_PROBE_READY_SLO_MS}"
            --attempts "${GUEST_BUY_NOW_PROBE_ATTEMPTS}"
            --wake-runtime-ready-budget-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS}"
            --wake-runtime-ready-poll-interval-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS}"
          )
          if [ -n "${GUEST_BUY_NOW_PROBE_ITEM_PATH}" ]; then
            common_args+=(--item-path "${GUEST_BUY_NOW_PROBE_ITEM_PATH}")
          fi
          pnpm run guest-buy-now:freshness-probe -- \
            "${common_args[@]}" \
            --flow guest \
            --guest-email "doks-cutover-probe+${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@chasesets.test" \
            --diagnostic-correlation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-doks-cutover" \
            --out artifacts/release-health/doks-cutover-guest-buy-now-freshness-probe.json

      - name: DOKS Stripe money smoke
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          SMOKE_REGISTER_SELLER: "true"
          SMOKE_SELLER_EMAIL: stripe-doks-cutover+${{ github.run_id }}-${{ github.run_attempt }}@chasesets.test
          SMOKE_SELLER_PASSWORD: staging-stripe-doks-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_SELLER_DISPLAY_NAME: Stripe DOKS Cutover Smoke ${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_INVITATION_PROJECTION_TIMEOUT_MS: ${{ vars.STAGING_STRIPE_MONEY_SMOKE_INVITATION_PROJECTION_TIMEOUT_MS || '300000' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL || env.TF_VAR_platform_admin_email || '' }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD || env.TF_VAR_platform_admin_password || '' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONEY_SMOKE_ENVIRONMENT: staging
          STRIPE_MONEY_SMOKE_REQUIRE_DELIVERED_WEBHOOKS: "false"
          SMOKE_ORDER_IDS: ${{ vars.STAGING_SMOKE_ORDER_IDS || '' }}
          SMOKE_BALANCE_CREDIT_AMOUNT: ${{ vars.STAGING_SMOKE_BALANCE_CREDIT_AMOUNT || '' }}
          SMOKE_PAYMENT_METHOD_CATEGORY: ${{ vars.STAGING_SMOKE_PAYMENT_METHOD_CATEGORY || '' }}
          SMOKE_CREATE_PAYMENT: ${{ vars.STAGING_SMOKE_CREATE_PAYMENT || '' }}
          SMOKE_PAYOUT_AMOUNT: ${{ vars.STAGING_SMOKE_PAYOUT_AMOUNT || '' }}
          SMOKE_REQUEST_PAYOUT: ${{ vars.STAGING_SMOKE_REQUEST_PAYOUT || '' }}
        run: |
          set -euo pipefail
          PLATFORM_API_BASE_URL="https://${{ steps.hosts.outputs.marketplace }}" \
            PLATFORM_AUTH_BASE_URL="https://${{ steps.hosts.outputs.marketplace }}" \
            pnpm run stripe:money-smoke -- --edge-check --seller-flow

      - name: Upload DOKS cutover evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-doks-cutover-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cutover/*.json
            artifacts/release-health/doks-cutover-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce cutover evidence verdict
        if: always()
        run: |
          set -euo pipefail
          artifact="${CUTOVER_EVIDENCE_OUT}"
          if [ ! -f "$artifact" ]; then
            echo "Cutover evidence artifact was not written." >&2
            exit 1
          fi
          verdict="$(jq -r '.summary.verdict // "fail"' "$artifact")"
          if [ "$verdict" != "pass" ]; then
            echo "DOKS cutover evidence verdict was '${verdict}'; a host was not served by the expected DOKS ingress, failed TLS, or was unreachable." >&2
            exit 1
          fi
          echo "DOKS cutover evidence verdict: pass."
