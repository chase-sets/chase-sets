name: Platform Delivery Failure Signatures

on:
  workflow_run:
    workflows: [Platform PR, Platform Deploy, Platform Ephemeral Verification]
    types: [completed]
  schedule:
    # Reconciliation is a backstop; workflow_run is the primary detector.
    - cron: "37 12 * * *"
  workflow_dispatch: {}

permissions: {}

# Canonical issue updates are serialized so two completed runs cannot create
# separate issues for the same signature while crossing a threshold together.
concurrency:
  group: platform-delivery-failure-signatures
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate Delivery Failure Signatures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Evaluate completed delivery run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health
          command=reconcile
          if [ -n "$SOURCE_RUN_ID" ]; then
            command=evaluate-run
          fi
          args=(
            --command "$command"
            --out artifacts/release-health/delivery-failure-signatures.json
            --markdown-out artifacts/release-health/delivery-failure-signatures.md
            --github-summary "$GITHUB_STEP_SUMMARY"
          )
          if [ -n "$SOURCE_RUN_ID" ]; then
            args+=(--source-run-id "$SOURCE_RUN_ID" --source-workflow "$SOURCE_WORKFLOW")
          fi
          pnpm run ops -- release-health:merge-group-failure-signatures "${args[@]}"

      - name: Upload delivery failure signature state
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-delivery-failure-signatures-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-health/delivery-failure-signatures.*
          if-no-files-found: ignore
          retention-days: 30
