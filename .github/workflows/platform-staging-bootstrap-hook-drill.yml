name: Platform Staging Bootstrap Hook Drill

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "run staging bootstrap hook drill" to confirm the staging DOKS bootstrap hook acceptance drill.
        required: true
        type: string
      drill_reference:
        description: Incident, issue, milestone, or operator reference for this acceptance drill.
        required: true
        type: string
      release_ref:
        description: Ref containing the drill tooling. Defaults to main.
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: platform-deploy-staging
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    name: Refuse Unconfirmed Bootstrap Hook Drill
    runs-on: ubuntu-latest
    if: inputs.confirm != 'run staging bootstrap hook drill'
    steps:
      - name: Refuse unconfirmed bootstrap hook drill
        run: |
          echo 'Confirmation text did not match exactly; expected "run staging bootstrap hook drill".' >&2
          exit 1

  staging-bootstrap-hook-drill:
    name: Staging Bootstrap Hook Drill
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped'
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      DEPLOYMENT_ENVIRONMENT: staging
      CHASE_SETS_HELM_RELEASE: chase-sets-platform
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
      CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT: 15m
      STAGING_BOOTSTRAP_HOOK_DRILL_OUT_DIR: artifacts/staging-bootstrap-hook-drill
      STAGING_BOOTSTRAP_HOOK_DRILL_MARKER: bootstrap-hook-drill-${{ github.run_id }}-${{ github.run_attempt }}
      DRILL_REFERENCE: ${{ inputs.drill_reference }}
    steps:
      - name: Confirm staging bootstrap hook drill
        run: |
          set -euo pipefail
          echo "Staging bootstrap hook drill confirmed for ${CHASE_SETS_HELM_RELEASE} in ${CHASE_SETS_KUBERNETES_NAMESPACE}."
          echo "Drill reference: ${DRILL_REFERENCE}"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --release-ref "${{ inputs.release_ref }}" \
            --checkout true

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure staging Kubernetes context
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-staging-bootstrap-hook-drill.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -z "$cluster_id" ] && [ -z "$cluster_name" ]; then
              cluster_address="$(
                terraform state list \
                  | awk '/(^|\.)digitalocean_kubernetes_cluster\./ { print; exit }'
              )"
              if [ -n "$cluster_address" ]; then
                echo "Using staging DOKS cluster Terraform state address ${cluster_address}." >&2
                cluster_state="$(terraform state show -no-color "$cluster_address")"
                cluster_id="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "id") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
                cluster_name="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "name") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
              fi
            fi
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure staging Kubernetes context." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Staging Kubernetes kubeconfig is present but has no current context after Terraform and DigitalOcean refresh attempts." >&2
            KUBECONFIG="$kubeconfig" kubectl config get-contexts || true
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured staging Kubernetes context: ${current_context}"

      - name: Resolve staging smoke domains
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          staging_root_marketplace_domain="$(terraform output -json staging_root_marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ -z "$marketplace_domain" ] || [ -z "$staging_root_marketplace_domain" ]; then
            echo "Required staging smoke domains were not present in Terraform outputs." >&2
            exit 1
          fi

          {
            echo "LANDING_URL=https://${landing_domain}"
            echo "ADMIN_URL=https://${admin_domain}"
            echo "MARKETPLACE_URL=https://${marketplace_domain}"
            echo "MARKETPLACE_ROOT_WEB_URL=https://${staging_root_marketplace_domain}"
          } >> "$GITHUB_ENV"

      - name: Run staging bootstrap hook drill
        env:
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
          SMOKE_FETCH_TIMEOUT_MS: "15000"
        run: |
          set -euo pipefail
          if [ -n "$TF_VAR_google_social_login_client_id" ] &&
            [ -n "$TF_VAR_google_social_login_client_secret" ] &&
            [ -n "$TF_VAR_facebook_social_login_client_id" ] &&
            [ -n "$TF_VAR_facebook_social_login_client_secret" ]; then
            export SMOKE_REQUIRE_SOCIAL_LOGIN=true
          else
            export SMOKE_REQUIRE_SOCIAL_LOGIN=false
          fi

          node ./scripts/staging-bootstrap-hook-drill.mjs \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT" \
            --out-dir "$STAGING_BOOTSTRAP_HOOK_DRILL_OUT_DIR" \
            --landing-url "$LANDING_URL" \
            --admin-url "$ADMIN_URL" \
            --marketplace-url "$MARKETPLACE_URL" \
            --marketplace-root-url "$MARKETPLACE_ROOT_WEB_URL"

      - name: Summarize staging bootstrap hook drill
        if: always()
        run: |
          set -euo pipefail
          record="${STAGING_BOOTSTRAP_HOOK_DRILL_OUT_DIR}/staging-bootstrap-hook-drill.json"
          {
            echo "## Staging Bootstrap Hook Drill"
            echo
            echo "- Drill reference: ${DRILL_REFERENCE}"
            echo "- Release: ${CHASE_SETS_HELM_RELEASE}"
            echo "- Namespace: ${CHASE_SETS_KUBERNETES_NAMESPACE}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$record" ]; then
            echo "- Result: drill record missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '
            "- Result: " + (.result // "unknown"),
            "- Pre-drill Helm revision: " + ((.preDrill.helmRevision // "unknown") | tostring),
            "- Failed-bootstrap rollback: " + (.rollbackVerification.status // "unknown"),
            "- Held-lock phase: " + (.heldLock.result // "see artifact"),
            "- Artifacts are redacted/support-safe: " + ((.supportSafe // false) | tostring)
          ' "$record" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging bootstrap hook drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-staging-bootstrap-hook-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/staging-bootstrap-hook-drill
          if-no-files-found: error
          retention-days: 30
