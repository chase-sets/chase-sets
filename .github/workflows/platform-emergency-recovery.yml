name: Platform Emergency Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Guided recovery path.
        required: true
        default: rollback-readiness
        type: choice
        options:
          - rollback-readiness
          - rollback
          - revert
          - fix-forward
      emergency_reference:
        description: Incident, revert, rollback, or fix-forward evidence reference.
        required: true
        type: string
      target_commit:
        description: Exact main-ancestor recovery commit; required for every guided recovery path.
        required: true
        type: string
      recovery_pr:
        description: Required for revert and fix-forward.
        required: false
        type: string
      release_tag:
        description: Required for rollback-readiness and rollback.
        required: false
        type: string
      image_ref:
        description: Required for rollback-readiness and rollback.
        required: false
        type: string
      rollback_revision:
        description: Exact successful Helm revision; required for rollback mode.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: platform-emergency-recovery-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  guide:
    name: Emergency Recovery Guide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Generate emergency recovery summary
        env:
          CHASE_SETS_HELM_RELEASE: chase-sets-platform
          CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
          CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT: 15m
          EMERGENCY_RECOVERY_GUIDE_OUT: artifacts/release-health/emergency-recovery-guide.json
          EMERGENCY_RECOVERY_MODE: ${{ inputs.mode }}
          EMERGENCY_RELEASE_REFERENCE: ${{ inputs.emergency_reference }}
          RECOVERY_TARGET_COMMIT: ${{ inputs.target_commit }}
          RECOVERY_PULL_REQUEST: ${{ inputs.recovery_pr }}
          ROLLBACK_RELEASE_TAG: ${{ inputs.release_tag }}
          ROLLBACK_IMAGE_REF: ${{ inputs.image_ref }}
          CHASE_SETS_HELM_ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
        run: pnpm run emergency-recovery:guide

      - name: Upload emergency recovery summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emergency-recovery-guide
          path: artifacts/release-health/emergency-recovery-guide.json
          if-no-files-found: ignore
          retention-days: 30
