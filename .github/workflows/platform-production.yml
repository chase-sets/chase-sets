name: Platform Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_ref:
        description: Ref to deploy. Defaults to main.
        required: false
        default: main
        type: string
      force_deploy:
        description: Force deployment even when release diff has no deploy-scoped files.
        required: false
        default: false
        type: boolean
      force_restore_point:
        description: Force a precreated production database restore-point fork for this release.
        required: false
        default: false
        type: boolean
      recovery_reason:
        description: Reason for forcing a production restore-point fork.
        required: false
        default: ""
        type: string
      emergency_release:
        description: Bypass an active production release lock for an audited fix-forward or revert.
        required: false
        default: false
        type: boolean
      emergency_reference:
        description: Incident, PR, or rollback evidence reference required when emergency_release is true.
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read

concurrency:
  # Platform deploy builds, pushes, verifies, and release-tags DOCR images.
  # Share this lane with registry cleanup so DigitalOcean GC cannot overlap
  # registry-pushing deploy paths.
  group: platform-registry-mutation
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    outputs:
      release_commit: ${{ steps.release.outputs.release_commit }}
      deployment_required: ${{ steps.deployment_scope.outputs.deploy }}
      exposure_posture_categories: ${{ steps.deployment_scope.outputs.exposure_posture_categories }}
      exposure_posture_changed: ${{ steps.deployment_scope.outputs.exposure_posture_changed }}
      production_recovery_mode: ${{ steps.recovery_mode.outputs.production_recovery_mode }}
      production_recovery_reason: ${{ steps.recovery_mode.outputs.production_recovery_reason }}
      production_restore_point_required: ${{ steps.recovery_mode.outputs.production_restore_point_required }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --event-name "${{ github.event_name }}" \
            --push-commit "${{ github.sha }}" \
            --release-ref "${{ inputs.release_ref }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_check="PR Required"
          release_commit="${{ steps.release.outputs.release_commit }}"
          deadline=$((SECONDS + 1800))

          while true; do
            completed_checks="$(gh api --paginate "repos/${{ github.repository }}/commits/${release_commit}/check-runs?per_page=100" \
              --jq ".check_runs[] | select(.name == \"${required_check}\" and .status == \"completed\") | [.conclusion, .html_url] | @tsv")"
            successful_check_url="$(printf '%s\n' "$completed_checks" | awk -F '\t' '$1 == "success" { print $2; exit }')"

            if [ -n "$successful_check_url" ]; then
              echo "Validated ${required_check}: ${successful_check_url}"
              break
            fi

            failed_check_url="$(printf '%s\n' "$completed_checks" | awk -F '\t' '$1 != "success" { print $2; exit }')"
            if [ -n "$failed_check_url" ]; then
              echo "Release commit ${release_commit} has a completed non-success '${required_check}' check: ${failed_check_url}" >&2
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for '${required_check}' on ${release_commit}." >&2
              exit 1
            fi

            echo "Waiting for '${required_check}' on ${release_commit}..."
            sleep 30
          done

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Resolve deployment scope
        id: deployment_scope
        run: |
          set -euo pipefail
          node ./scripts/release-deployment-scope.mjs \
            --event-name "${{ github.event_name }}" \
            --release-commit "${{ steps.release.outputs.release_commit }}" \
            --force-deploy "${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy == true && 'true' || 'false' }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve production recovery mode
        id: recovery_mode
        run: |
          set -euo pipefail
          node ./scripts/production-recovery-mode.mjs \
            --release-commit "${{ steps.release.outputs.release_commit }}" \
            --changed-files-json '${{ steps.deployment_scope.outputs.changed_files_json || '[]' }}' \
            --force-restore-point "${{ github.event_name == 'workflow_dispatch' && inputs.force_restore_point == true && 'true' || 'false' }}" \
            --recovery-reason "${{ github.event_name == 'workflow_dispatch' && inputs.recovery_reason || '' }}" \
            --out artifacts/release-health/production-recovery-mode.json \
            --github-output "$GITHUB_OUTPUT"

  build-image:
    name: Build Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve-release
    if: needs.resolve-release.outputs.deployment_required == 'true'
    # Builds the SHA-keyed release image in parallel with any in-flight deploy
    # (no deploy concurrency group), so Deploy Staging reuses it instead of
    # rebuilding inside the serialized deploy lane (issue #1326). The staging
    # environment binding supplies the environment-scoped registry token.
    environment: staging
    env:
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve-release.outputs.release_commit }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: steps.buildx.outcome == 'failure'

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build release image
        id: release_image
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            doctl registry create "$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK" --region nyc3
            registry_name="$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK"
          fi

          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${release_commit}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Release image ${image} already exists; skipping rebuild."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tree="$(git rev-parse 'HEAD^{tree}')"
          tree_image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:tree-${release_tree}"
          if docker buildx imagetools inspect "$tree_image" >/dev/null 2>&1; then
            tree_digest="$(docker buildx imagetools inspect "$tree_image" --format '{{.Manifest.Digest}}')"
            docker buildx imagetools create --tag "$image" "$tree_image"
            release_digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
            if [ "$release_digest" != "$tree_digest" ]; then
              echo "Promoted release image digest ${release_digest} did not match merge-queue tree image digest ${tree_digest}." >&2
              exit 1
            fi
            echo "Promoted merge-queue validated image ${tree_image}@${tree_digest} to ${image}@${release_digest}; skipping rebuild and boot smoke."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker buildx build \
            --pull \
            --cache-from type=gha,scope=platform-image \
            --cache-to type=gha,scope=platform-image,mode=max \
            --load \
            --tag "$image" \
            .
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Boot smoke release image
        if: steps.release_image.outputs.built == 'true'
        env:
          RELEASE_IMAGE: ${{ steps.release_image.outputs.image }}
        run: |
          set -euo pipefail

          # Build-time success does not prove runtime success (issue #1417):
          # start each web component exactly as App Platform does (run_command
          # and health_check from infrastructure/digitalocean/platform/main.tf)
          # so a non-booting image fails this parallel job before the push and
          # never reaches the deploy lane.
          boot_smoke() {
            component="$1"
            workspace="$2"
            health_path="$3"
            host_port="$4"

            container_id="$(docker run -d \
              -e NODE_ENV=production \
              -e PORT=8080 \
              -p "${host_port}:8080" \
              "$RELEASE_IMAGE" \
              pnpm --filter "$workspace" run start)"

            for _ in $(seq 1 30); do
              if curl --fail --silent --output /dev/null "http://localhost:${host_port}${health_path}"; then
                echo "Boot smoke passed for ${component} (${health_path})."
                docker rm -f "$container_id" >/dev/null
                return 0
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
                break
              fi
              sleep 1
            done

            echo "Boot smoke failed for ${component}: ${health_path} never became healthy." >&2
            docker logs "$container_id" >&2 || true
            docker rm -f "$container_id" >/dev/null || true
            return 1
          }

          boot_smoke marketplace "@chase-sets/app-marketplace-web" /health/ready 18080
          boot_smoke public-web "@chase-sets/app-public-web" / 18081

      - name: Push release image
        if: steps.release_image.outputs.built == 'true'
        env:
          RELEASE_IMAGE: ${{ steps.release_image.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$RELEASE_IMAGE"
          echo "Pushed release image ${RELEASE_IMAGE}"

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - resolve-release
      - build-image
    if: needs.resolve-release.outputs.deployment_required == 'true'
    environment: staging
    outputs:
      deployed: ${{ steps.staging_deployed.outputs.deployed }}
      platform_image_digest: ${{ steps.image.outputs.digest }}
      started_at: ${{ steps.staging_started.outputs.started_at }}
      completed_at: ${{ steps.staging_completed.outputs.completed_at }}
      buy_now_probe_result: ${{ steps.buy_now_probes.outputs.result }}
      buy_now_probe_promotion_decision: ${{ steps.buy_now_probes.outputs.promotion_decision }}
      buy_now_probe_guest_failure_reason: ${{ steps.buy_now_probes.outputs.guest_failure_reason }}
      buy_now_probe_account_failure_reason: ${{ steps.buy_now_probes.outputs.account_failure_reason }}
      buy_now_probe_started_at: ${{ steps.buy_now_probes.outputs.started_at }}
      buy_now_probe_completed_at: ${{ steps.buy_now_probes.outputs.completed_at }}
    concurrency:
      group: platform-deploy-staging
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: staging
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: ${{ needs.resolve-release.outputs.release_commit }}
      TF_VAR_checkout_shopify_simple_kill_switch_active: ${{ vars.CHECKOUT_SHOPIFY_SIMPLE_KILL_SWITCH_ACTIVE == 'true' && 'true' || 'false' }}
      TF_VAR_alert_emails: ${{ vars.PLATFORM_ALERT_EMAILS || '[]' }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
      TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
      TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_accounts_api: ${{ vars.STRIPE_CONNECT_ACCOUNTS_API || 'v2' }}
      TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
      TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
      TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
      TF_VAR_easypost_webhook_secret: ${{ secrets.EASYPOST_WEBHOOK_SECRET || '' }}
      TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
      TF_VAR_tcgplayer_automation_tcg_auth_cookie: ${{ secrets.TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE || '' }}
      TF_VAR_scrydex_api_key: ${{ secrets.SCRYDEX_API_KEY || '' }}
      TF_VAR_scrydex_team_id: ${{ secrets.SCRYDEX_TEAM_ID || '' }}
      TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
      TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
      TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
      TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
      TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
      TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
      TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
      TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
      TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED == 'false' && 'false' || 'true' }}
      TF_VAR_observability_otlp_endpoint: ${{ vars.OBSERVABILITY_OTLP_ENDPOINT || '' }}
      TF_VAR_observability_otlp_headers: ${{ secrets.OBSERVABILITY_OTLP_HEADERS || '' }}
      # DOKS owns schema bootstrap once its estate is active. App Platform
      # stays deployed for alias/DNS compatibility, but its pre-deploy
      # bootstrap becomes a logged no-op while DOKS ingress exists.
      TF_VAR_platform_bootstrap_owner: ${{ vars.DOKS_INGRESS_TARGET != '' && 'doks' || 'app-platform' }}
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
      CHASE_SETS_HELM_RELEASE: chase-sets-platform
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
      CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT: 15m
      APP_PLATFORM_DEPLOYMENT_TIMEOUT_SECONDS: "5400"
      # DOKS is the primary rollout lane and always runs. The App Platform lane
      # is legacy: it exists only to keep App Platform's alias DNS reconciled
      # while both platforms serve during the #4053 cutover window. Flipping the
      # single APP_PLATFORM_LANE repo variable to "disabled" is the #4055 kill
      # switch — it stops the workflow maintaining App Platform without touching
      # the DOKS rollout, smoke, or shadow-host verification below.
      APP_PLATFORM_LANE: ${{ vars.APP_PLATFORM_LANE || 'enabled' }}
      # Which platform serves the live staging hosts. #4604 wires this into the
      # environment-dns root: "app-platform" keeps App Platform on the live
      # hosts (DOKS proven via shadow hosts); "doks" flips the live A records to
      # the DOKS load balancer. Smoke always targets the live hosts, so it runs
      # against whichever platform serves live traffic.
      STAGING_APP_SERVING: ${{ vars.STAGING_APP_SERVING || 'app-platform' }}
      # DOKS ingress load balancer IPv4. When set, environment-dns publishes the
      # doks.<zone> shadow validation hosts so the rollout lane can prove DOKS
      # ingress + cert-manager before any live-host flip.
      DOKS_INGRESS_TARGET: ${{ vars.DOKS_INGRESS_TARGET || '' }}
    steps:
      - name: Record staging start
        id: staging_started
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check out release commit
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          git checkout --detach "$release_commit"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$release_commit" ]; then
            echo "Checked out ${checked_out_commit}, expected release commit ${release_commit}." >&2
            exit 1
          fi

      - name: Confirm automatic deploy is latest main
        id: latest_main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          latest_main="$(git rev-parse origin/main)"
          if [ "$release_commit" != "$latest_main" ]; then
            echo "Release commit ${release_commit} is no longer origin/main (${latest_main}); skipping stale staging deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "SHOULD_DEPLOY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "SHOULD_DEPLOY=true" >> "$GITHUB_ENV"

      - name: Validate staging configuration
        if: env.SHOULD_DEPLOY != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url \
            TF_VAR_stripe_secret_key \
            TF_VAR_stripe_publishable_key \
            TF_VAR_stripe_webhook_secret \
            TF_VAR_stripe_connect_webhook_secret \
            TF_VAR_easypost_api_key
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required staging configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ "${TF_VAR_observability_enabled:-true}" != "false" ] && [ -z "${TF_VAR_observability_otlp_headers:-}" ]; then
            echo "Staging observability requires OBSERVABILITY_OTLP_HEADERS secret or OBSERVABILITY_ENABLED=false." >&2
            exit 1
          fi

          if [[ "${TF_VAR_stripe_secret_key}" != sk_test* || "${TF_VAR_stripe_publishable_key}" != pk_test* ]]; then
            echo "Staging requires dedicated Stripe test-mode keys; production live-mode keys must not be used in the staging GitHub Environment." >&2
            exit 1
          fi

          if [ "${TF_VAR_notification_email_provider:-}" = "amazon-ses" ]; then
            ses_missing=()
            for name in \
              TF_VAR_ses_aws_region \
              TF_VAR_ses_aws_access_key_id \
              TF_VAR_ses_aws_secret_access_key \
              TF_VAR_ses_from_email \
              TF_VAR_ses_configuration_set_name \
              TF_VAR_ses_source_arn
            do
              if [ -z "${!name:-}" ]; then
                ses_missing+=("$name")
              fi
            done

            if [ "${#ses_missing[@]}" -gt 0 ]; then
              printf 'Missing required staging SES configuration: %s\n' "${ses_missing[*]}" >&2
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-pnpm-workspace
        if: env.SHOULD_DEPLOY != 'false'

      - name: Install dependencies
        if: env.SHOULD_DEPLOY != 'false'
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.SHOULD_DEPLOY != 'false'
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        if: env.SHOULD_DEPLOY != 'false'
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Package staged doctl binary
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          doctl_path="$(command -v doctl)"
          mkdir -p artifacts/deploy-tools/doctl
          cp "$doctl_path" artifacts/deploy-tools/doctl/doctl
          chmod +x artifacts/deploy-tools/doctl/doctl
          ./artifacts/deploy-tools/doctl/doctl version

      - name: Upload staged doctl binary
        if: env.SHOULD_DEPLOY != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-doctl-linux-amd64
          path: artifacts/deploy-tools/doctl/doctl
          if-no-files-found: error
          retention-days: 1

      - name: Terraform init staging environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=environment-dns/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format staging environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        run: terraform fmt -check -recursive

      - name: Terraform validate staging environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        run: terraform validate

      - name: Terraform apply staging environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_google_workspace_dkim_txt_value: ${{ vars.GOOGLE_WORKSPACE_DKIM_TXT_VALUE || '' }}
          # #4604 serving flags: default reproduces today's App Platform serving
          # and publishes the DOKS shadow hosts when DOKS_INGRESS_TARGET is set.
          TF_VAR_staging_app_serving: ${{ env.STAGING_APP_SERVING }}
          TF_VAR_doks_ingress_target: ${{ env.DOKS_INGRESS_TARGET }}
        run: terraform apply -auto-approve

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        if: env.SHOULD_DEPLOY != 'false'
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: env.SHOULD_DEPLOY != 'false' && steps.buildx.outcome == 'failure'

      - name: Build and push App Platform image
        if: env.SHOULD_DEPLOY != 'false'
        id: image
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            doctl registry create "$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK" --region nyc3
            registry_name="$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK"
          fi

          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${TF_VAR_platform_image_tag}"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Reusing merge-queue validated image ${image}; skipping rebuild."
          else
            docker buildx build \
              --pull \
              --cache-from type=gha,scope=platform-image \
              --cache-to type=gha,scope=platform-image,mode=max \
              --push \
              --tag "$image" \
              .
          fi

          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_platform_image_digest=${digest}" >> "$GITHUB_ENV"
          echo "Pushed ${image}@${digest}"

      - name: Terraform init
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      # Legacy App Platform lane: only reconcile App Platform's alias CNAMEs
      # while the lane is enabled. The #4055 kill switch (APP_PLATFORM_LANE
      # = disabled) skips this without affecting the DOKS rollout below.
      - name: Reconcile staging App Platform alias DNS state
        if: env.SHOULD_DEPLOY != 'false' && env.APP_PLATFORM_LANE != 'disabled'
        working-directory: infrastructure/digitalocean/platform
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_connect_accounts_api: ${{ vars.STRIPE_CONNECT_ACCOUNTS_API || 'v2' }}
          TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
          TF_VAR_easypost_webhook_secret: ${{ secrets.EASYPOST_WEBHOOK_SECRET || '' }}
          TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
          TF_VAR_tcgplayer_automation_tcg_auth_cookie: ${{ secrets.TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE || '' }}
          TF_VAR_scrydex_api_key: ${{ secrets.SCRYDEX_API_KEY || '' }}
          TF_VAR_scrydex_team_id: ${{ secrets.SCRYDEX_TEAM_ID || '' }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
          TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED == 'false' && 'false' || 'true' }}
          TF_VAR_observability_otlp_endpoint: ${{ vars.OBSERVABILITY_OTLP_ENDPOINT || '' }}
          TF_VAR_observability_otlp_headers: ${{ secrets.OBSERVABILITY_OTLP_HEADERS || '' }}
        run: |
          set -euo pipefail
          zone="staging.chasesets.com"
          app_id="$(terraform output -raw app_id 2>/dev/null || true)"
          if [ -z "$app_id" ]; then
            echo "No existing App Platform app was found in Terraform state; skipping alias DNS state reconciliation."
            exit 0
          fi

          target="$(doctl apps get "$app_id" --format DefaultIngress --no-header | sed -e 's#^https://##' -e 's#/$##' || true)"
          if [ -z "$target" ]; then
            echo "No App Platform default ingress was found for ${app_id}; skipping alias DNS state reconciliation."
            exit 0
          fi

          records_json="$(doctl compute domain records list "$zone" --output json)"
          for name in admin marketplace www; do
            address="digitalocean_record.staging_app_alias[\"${name}\"]"
            if terraform state show "$address" >/dev/null 2>&1; then
              continue
            fi

            record_id="$(printf '%s' "$records_json" | jq -r --arg name "$name" --arg target "$target" 'first(.[] | select(.type == "CNAME" and .name == $name and (.data | rtrimstr(".")) == $target) | .id) // empty')"
            if [ -z "$record_id" ]; then
              echo "No live CNAME found for ${name}.${zone}; Terraform will create it."
              continue
            fi

            terraform import "$address" "${zone},${record_id}"
          done

      # Staleness develops while waiting for or holding the serialized deploy
      # lane (42% of staging deploys never promoted); re-check before the
      # expensive apply so superseded releases skip in seconds (issue #1418).
      - name: Re-check release freshness before staging apply
        if: env.SHOULD_DEPLOY != 'false' && github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          latest_main="$(git rev-parse origin/main)"
          if [ "${{ needs.resolve-release.outputs.release_commit }}" != "$latest_main" ]; then
            echo "Release commit superseded by ${latest_main}; skipping remaining staging work."
            echo "SHOULD_DEPLOY=false" >> "$GITHUB_ENV"
          fi

      - name: Terraform plan
        if: env.SHOULD_DEPLOY != 'false'
        id: terraform_plan
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform plan -out=tfplan
          mkdir -p artifacts/terraform-plans
          terraform show -no-color tfplan > artifacts/terraform-plans/staging-tfplan.txt
          terraform show -json tfplan > artifacts/terraform-plans/staging-tfplan.json
          node ../../../scripts/terraform-plan-inspection.mjs summarize-plan artifacts/terraform-plans/staging-tfplan.json --title="Staging Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          echo "plan_written=true" >> "$GITHUB_OUTPUT"
          app_changed="$(node ../../../scripts/terraform-plan-inspection.mjs plan-app-changed tfplan)"
          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"

      - name: Upload staging Terraform plan
        if: always() && env.SHOULD_DEPLOY != 'false' && steps.terraform_plan.outputs.plan_written == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-terraform-plan
          path: infrastructure/digitalocean/platform/artifacts/terraform-plans/staging-tfplan.txt
          if-no-files-found: error
          retention-days: 30

      - name: Terraform apply
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform apply -auto-approve tfplan

      - name: Capture staging Terraform errored state
        if: failure() && env.SHOULD_DEPLOY != 'false'
        id: capture_staging_terraform_errored_state
        working-directory: infrastructure/digitalocean/platform
        run: |
          set -euo pipefail

          state_path="errored.tfstate"
          artifact_path="artifacts/terraform-errored-state/staging-errored.tfstate"
          if [ -f "$state_path" ]; then
            mkdir -p "$(dirname "$artifact_path")"
            cp "$state_path" "$artifact_path"
            echo "captured=true" >> "$GITHUB_OUTPUT"
            echo "### Staging Terraform errored state" >> "$GITHUB_STEP_SUMMARY"
            echo "Captured sensitive recovery artifact \`sensitive-staging-terraform-errored-state-recovery-only\` with 1-day retention. Do not print or share its contents." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "### Staging Terraform errored state" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`errored.tfstate\` file was present after Terraform apply failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload staging Terraform errored state
        if: failure() && env.SHOULD_DEPLOY != 'false' && steps.capture_staging_terraform_errored_state.outputs.captured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensitive-staging-terraform-errored-state-recovery-only
          path: infrastructure/digitalocean/platform/artifacts/terraform-errored-state/staging-errored.tfstate
          if-no-files-found: error
          retention-days: 1

      - name: Configure staging Kubernetes context
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-staging.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl config current-context >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -z "$cluster_id" ] && [ -z "$cluster_name" ]; then
              cluster_address="$(
                terraform state list \
                  | awk '/(^|\.)digitalocean_kubernetes_cluster\./ { print; exit }'
              )"
              if [ -n "$cluster_address" ]; then
                echo "Using staging DOKS cluster Terraform state address ${cluster_address}." >&2
                cluster_state="$(terraform state show -no-color "$cluster_address")"
                cluster_id="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "id") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
                cluster_name="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "name") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
              fi
            fi
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure staging Kubernetes context." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Staging Kubernetes kubeconfig is present but has no current context after Terraform and DigitalOcean refresh attempts." >&2
            KUBECONFIG="$kubeconfig" kubectl config get-contexts || true
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured staging Kubernetes context: ${current_context}"

      - name: Export staging Kubernetes database URLs
        if: env.SHOULD_DEPLOY != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DEPLOYMENT_ENVIRONMENT: staging
        run: |
          set -euo pipefail
          state_path="${RUNNER_TEMP}/platform-staging.tfstate.json"
          terraform -chdir=infrastructure/digitalocean/platform state pull > "$state_path"
          TERRAFORM_STATE_PATH="$state_path" node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const state = JSON.parse(fs.readFileSync(process.env.TERRAFORM_STATE_PATH, "utf8"));
          const resources = Array.isArray(state.resources) ? state.resources : [];
          const resource = (type, name) =>
            resources.find((candidate) => candidate.type === type && candidate.name === name);
          const indexed = (item) =>
            new Map((item?.instances ?? []).map((instance) => [String(instance.index_key ?? ""), instance.attributes ?? {}]));
          const contextFromToken = (token) => token.toLowerCase().replaceAll("_", "-");

          const cluster = resource("digitalocean_database_cluster", "postgres");
          const databases = indexed(resource("digitalocean_database_db", "contexts"));
          const contextUsers = indexed(resource("digitalocean_database_user", "contexts"));
          const wakeUsers = indexed(resource("digitalocean_database_user", "wake_listeners"));
          const clusterAttrs = cluster?.instances?.[0]?.attributes ?? {};
          if (!clusterAttrs.host || !clusterAttrs.port) {
            throw new Error("Staging Terraform state does not contain a usable DigitalOcean database cluster.");
          }

          const secretSummary = JSON.parse(
            execFileSync(process.execPath, [
              "./scripts/platform-kubernetes-secret.mjs",
              "--dry-run",
              "--namespace",
              process.env.CHASE_SETS_KUBERNETES_NAMESPACE,
            ], { encoding: "utf8" }),
          );

          const urlFor = (contextName, users) => {
            const database = databases.get(contextName);
            const user = users.get(contextName);
            if (!database?.name || !user?.name || !user?.password) {
              throw new Error(`Staging Terraform state is missing database/user data for '${contextName}'.`);
            }
            return `postgresql://${encodeURIComponent(user.name)}:${encodeURIComponent(user.password)}` +
              `@${clusterAttrs.host}:${clusterAttrs.port}/${encodeURIComponent(database.name)}?sslmode=require`;
          };

          const lines = [];
          const add = (name, value) => {
            console.log(`::add-mask::${value}`);
            lines.push(`${name}=${value}`);
          };

          for (const key of secretSummary.keys ?? []) {
            let match = /^DATABASE_URL_([A-Z0-9_]+)_WAITER$/.exec(key);
            if (match) {
              add(key, urlFor(contextFromToken(match[1]), wakeUsers));
              continue;
            }

            match = /^WORKER_LISTENER_DATABASE_URL_([A-Z0-9_]+)$/.exec(key);
            if (match) {
              add(key, urlFor(contextFromToken(match[1]), wakeUsers));
              continue;
            }

            match = /^DATABASE_URL_([A-Z0-9_]+)$/.exec(key);
            if (match) {
              add(key, urlFor(contextFromToken(match[1]), contextUsers));
              continue;
            }

            if (key === "PLATFORM_CONTROL_DATABASE_URL" || key === "PLATFORM_WORK_SIGNAL_DATABASE_URL") {
              add(key, urlFor("control", contextUsers));
            }
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          NODE

      - name: Apply staging Kubernetes runtime secrets
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          export CATALOG_ASSET_S3_ACCESS_KEY_ID="${TF_VAR_spaces_access_id:-}"
          export CATALOG_ASSET_S3_SECRET_ACCESS_KEY="${TF_VAR_spaces_secret_key:-}"
          export CHASE_SETS_DISCORD_INVITE_URL="${TF_VAR_discord_invite_url:-}"
          export EASYPOST_API_KEY="${TF_VAR_easypost_api_key:-}"
          export EASYPOST_WEBHOOK_SECRET="${TF_VAR_easypost_webhook_secret:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_facebook_social_login_client_id:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_facebook_social_login_client_secret:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_google_social_login_client_id:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_google_social_login_client_secret:-}"
          export OTEL_EXPORTER_OTLP_HEADERS="${TF_VAR_observability_otlp_headers:-}"
          export PLATFORM_ADMIN_EMAIL="${TF_VAR_platform_admin_email:-}"
          export PLATFORM_ADMIN_PASSWORD="${TF_VAR_platform_admin_password:-}"
          export PLATFORM_INTERNAL_AUTH_SECRET="${TF_VAR_platform_internal_auth_secret:-}"
          export SCRYDEX_API_KEY="${TF_VAR_scrydex_api_key:-}"
          export SCRYDEX_TEAM_ID="${TF_VAR_scrydex_team_id:-}"
          export SES_AWS_ACCESS_KEY_ID="${TF_VAR_ses_aws_access_key_id:-}"
          export SES_AWS_SECRET_ACCESS_KEY="${TF_VAR_ses_aws_secret_access_key:-}"
          export SES_SOURCE_ARN="${TF_VAR_ses_source_arn:-}"
          export STRIPE_CONNECT_WEBHOOK_SECRET="${TF_VAR_stripe_connect_webhook_secret:-}"
          export STRIPE_PUBLISHABLE_KEY="${TF_VAR_stripe_publishable_key:-}"
          export STRIPE_SECRET_KEY="${TF_VAR_stripe_secret_key:-}"
          export STRIPE_WEBHOOK_SECRET="${TF_VAR_stripe_webhook_secret:-}"
          export TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE="${TF_VAR_tcgplayer_automation_tcg_auth_cookie:-}"

          node ./scripts/platform-kubernetes-secret.mjs --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE"

      - name: Apply staging Kubernetes registry pull secret
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry is required before staging Kubernetes deploys can pull images." >&2
            exit 1
          fi

          registry_pull_secret_name="registry-${registry_name}"
          docker_config="$(mktemp)"
          trap 'rm -f "$docker_config"' EXIT
          doctl registry docker-config --expiry-seconds 3600 > "$docker_config"
          kubectl create secret generic "$registry_pull_secret_name" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --from-file=.dockerconfigjson="$docker_config" \
            --type=kubernetes.io/dockerconfigjson \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          echo "CHASE_SETS_IMAGE_PULL_SECRET_NAME=${registry_pull_secret_name}" >> "$GITHUB_ENV"

      - name: Deploy staging Kubernetes release
        if: env.SHOULD_DEPLOY != 'false'
        env:
          PLATFORM_IMAGE_REF: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          catalog_asset_public_base_url="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_public_base_url)"
          catalog_asset_s3_bucket="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_bucket)"
          catalog_asset_s3_endpoint="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_endpoint)"
          catalog_asset_s3_region="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_region)"
          if [ -z "$catalog_asset_public_base_url" ] || [ -z "$catalog_asset_s3_bucket" ] || [ -z "$catalog_asset_s3_endpoint" ] || [ -z "$catalog_asset_s3_region" ]; then
            echo "Staging catalog asset runtime env outputs are required before Kubernetes deploy." >&2
            exit 1
          fi

          pnpm run platform:kubernetes-deployment -- deploy \
            --image "$PLATFORM_IMAGE_REF" \
            --image-pull-secret "$CHASE_SETS_IMAGE_PULL_SECRET_NAME" \
            --runtime-env "DEPLOYMENT_ENVIRONMENT=staging" \
            --runtime-env "CHASE_SETS_RUNTIME_PROFILE=public" \
            --runtime-env "PLATFORM_DATA_PROFILES=critical-bootstrap,catalog-integration-bootstrap" \
            --runtime-env "CATALOG_ASSET_PUBLIC_BASE_URL=${catalog_asset_public_base_url}" \
            --runtime-env "CATALOG_ASSET_S3_BUCKET=${catalog_asset_s3_bucket}" \
            --runtime-env "CATALOG_ASSET_S3_ENDPOINT=${catalog_asset_s3_endpoint}" \
            --runtime-env "CATALOG_ASSET_S3_REGION=${catalog_asset_s3_region}" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT"

      - name: Capture staging Kubernetes deploy diagnostics
        if: failure() && env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          pnpm run platform:kubernetes-deployment -- diagnostics \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" || true

      - name: Wait for staging ingress URLs
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          mapfile -t legacy_public_redirect_domains < <(terraform output -json legacy_public_redirect_domains | jq -r '.[]')
          mapfile -t marketplace_domains < <(terraform output -json marketplace_domains | jq -r '.[]')
          mapfile -t staging_root_marketplace_domains < <(terraform output -json staging_root_marketplace_domains | jq -r '.[]')
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ "${#marketplace_domains[@]}" -eq 0 ] || [ "${#staging_root_marketplace_domains[@]}" -eq 0 ]; then
            echo "Required staging domains were not present in Terraform outputs." >&2
            exit 1
          fi

          ingress_urls=(
            "https://${landing_domain}/health/ready"
            "https://${admin_domain}/health/ready"
          )
          for hostname in "${marketplace_domains[@]}" "${staging_root_marketplace_domains[@]}"; do
            ingress_urls+=("https://${hostname}/health/ready")
          done
          for hostname in "${legacy_public_redirect_domains[@]}"; do
            ingress_urls+=("https://${hostname}/")
          done

          ingress_args=()
          for url in "${ingress_urls[@]}"; do
            ingress_args+=(--url "$url")
          done

          cd ../../..
          node ./scripts/platform-ingress-wait.mjs \
            --attempts 60 \
            --delay-ms 30000 \
            "${ingress_args[@]}"

      # Pre-cutover DOKS proof (#4604, epic #4059): while App Platform still
      # serves the live hosts, prove the DOKS rollout is externally serving on
      # the doks.<zone> shadow hosts with valid cert-manager TLS. The ingress
      # wait does a TLS-validating HTTPS GET, so a missing or invalid
      # certificate fails the step. Skips cleanly until DOKS_INGRESS_TARGET is
      # set (no shadow hosts published yet). Once serving flips to DOKS, the
      # live-host ingress wait above is itself the DOKS proof.
      - name: Verify staging DOKS shadow hosts
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          serving="$(terraform output -raw staging_app_serving)"
          echo "Staging live hosts serve from: ${serving}."
          mapfile -t shadow_domains < <(terraform output -json doks_ingress_shadow_domains | jq -r '.[]')
          if [ "${#shadow_domains[@]}" -eq 0 ]; then
            echo "No DOKS ingress shadow hosts are published (DOKS_INGRESS_TARGET unset); skipping pre-cutover shadow verification."
            exit 0
          fi

          shadow_args=()
          for hostname in "${shadow_domains[@]}"; do
            shadow_args+=(--url "https://${hostname}/health/ready")
          done

          cd ../../..
          node ./scripts/platform-ingress-wait.mjs \
            --attempts 60 \
            --delay-ms 30000 \
            "${shadow_args[@]}"
          echo "DOKS ingress shadow hosts served valid TLS and readiness ahead of the #4053 cutover."

      # Second freshness re-check before the ~3.5-minute smoke/critical-flow/
      # canary tail: a superseded release's staging state has no consumer, so
      # skip the verification work too (issue #1418).
      - name: Re-check release freshness before staging verification
        if: env.SHOULD_DEPLOY != 'false' && github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          latest_main="$(git rev-parse origin/main)"
          if [ "${{ needs.resolve-release.outputs.release_commit }}" != "$latest_main" ]; then
            echo "Release commit superseded by ${latest_main}; skipping staging verification tail."
            echo "SHOULD_DEPLOY=false" >> "$GITHUB_ENV"
          fi

      - name: Smoke check
        timeout-minutes: 12
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_MARKETPLACE: "true"
          SMOKE_REQUIRE_MARKETPLACE_ROOT: "true"
          SMOKE_REQUIRE_LEGACY_REDIRECT: "true"
          SMOKE_WRITE_WAITLIST: "false"
          SMOKE_SOURCE: staging-smoke
          SMOKE_UTM_CAMPAIGN: staging-main
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
          SMOKE_FETCH_TIMEOUT_MS: "15000"
        run: |
          set -euo pipefail
          # Smoke targets the live hosts, which resolve to whichever platform
          # serves live traffic per the #4604 STAGING_APP_SERVING flag.
          echo "Smoking the live staging hosts (serving platform: ${STAGING_APP_SERVING})."
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          catalog_asset_public_base_url="$(terraform output -raw catalog_asset_public_base_url)"
          legacy_public_redirect_domain="$(terraform output -json legacy_public_redirect_domains | jq -r '.[0] // empty')"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          staging_root_marketplace_domain="$(terraform output -json staging_root_marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ -z "$catalog_asset_public_base_url" ] || [ -z "$legacy_public_redirect_domain" ] || [ -z "$marketplace_domain" ] || [ -z "$staging_root_marketplace_domain" ]; then
            echo "Required staging smoke domains were not present in Terraform outputs." >&2
            exit 1
          fi

          if [ -n "$TF_VAR_google_social_login_client_id" ] &&
            [ -n "$TF_VAR_google_social_login_client_secret" ] &&
            [ -n "$TF_VAR_facebook_social_login_client_id" ] &&
            [ -n "$TF_VAR_facebook_social_login_client_secret" ]; then
            export SMOKE_REQUIRE_SOCIAL_LOGIN=true
          else
            export SMOKE_REQUIRE_SOCIAL_LOGIN=false
          fi

          cd ../../..
          export MARKETPLACE_ROOT_WEB_URL="https://${staging_root_marketplace_domain}"
          pnpm run smoke:platform -- \
            "https://${landing_domain}" \
            "https://${admin_domain}" \
            "https://${marketplace_domain}" \
            "https://${legacy_public_redirect_domain}"
          catalog_asset_root_status=""
          for attempt in $(seq 1 12); do
            catalog_asset_root_status="$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' \
              "${catalog_asset_public_base_url}/" || true)"
            echo "Catalog asset CDN root status ${catalog_asset_root_status} on attempt ${attempt}."
            if [ "$catalog_asset_root_status" = "403" ]; then
              break
            fi
            sleep 10
          done
          if [ "$catalog_asset_root_status" != "403" ]; then
            echo "Catalog asset CDN root must stay protected; expected 403, got ${catalog_asset_root_status:-none}." >&2
            exit 1
          fi
          echo "Catalog asset CDN root returned expected protected status 403."

      - name: Resolve Playwright Chromium version
        id: staging-playwright-chromium
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "Could not resolve Playwright version from pnpm-lock.yaml." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium for staging critical flows
        id: staging-playwright-chromium-cache
        if: env.SHOULD_DEPLOY != 'false'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.staging-playwright-chromium.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium for staging critical flows
        if: env.SHOULD_DEPLOY != 'false'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Staging marketplace critical flows
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          CI: "true"
          PLAYWRIGHT_SKIP_WEB_SERVER: "true"
          MARKETPLACE_E2E_EMAIL: ${{ vars.MARKETPLACE_E2E_EMAIL || '' }}
          MARKETPLACE_E2E_PASSWORD: ${{ secrets.MARKETPLACE_E2E_PASSWORD || '' }}
          MARKETPLACE_E2E_SEARCH_QUERY: ${{ vars.MARKETPLACE_E2E_SEARCH_QUERY || 'charizard' }}
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || '' }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          set -euo pipefail
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$admin_domain" ] || [ -z "$marketplace_domain" ]; then
            echo "Required staging admin or marketplace domain was not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          ADMIN_WEB_URL="https://${admin_domain}" MARKETPLACE_WEB_URL="https://${marketplace_domain}" pnpm run test:e2e:deployed

      - name: Await staging projection convergence
        id: projection_convergence_gate
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          PROJECTION_CONVERGENCE_BUDGET_MS: ${{ vars.STAGING_PROJECTION_CONVERGENCE_BUDGET_MS || '300000' }}
          PROJECTION_CONVERGENCE_POLL_INTERVAL_MS: ${{ vars.STAGING_PROJECTION_CONVERGENCE_POLL_INTERVAL_MS || '5000' }}
          PROJECTION_CONVERGENCE_PROJECTION_NAMES: ${{ vars.STAGING_PROJECTION_CONVERGENCE_PROJECTION_NAMES || 'all' }}
        run: |
          set -euo pipefail
          admin_domain="$(terraform output -raw admin_domain)"
          if [ -z "$admin_domain" ]; then
            echo "Required staging admin domain was not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          gate_out=artifacts/release-health/staging-projection-convergence-gate.json
          # Bounded convergence gate (issue #4709): every deploy rolls the fleet, so the
          # Buy Now freshness probes race post-rollout projection replay. Wait for the
          # staging projection-status surface to report all groups caught-up (or spend the
          # budget) before probing. This never blocks promotion on its own; the probe step
          # that follows still fails loudly on steady-state SLO breaches.
          set +e
          pnpm run guest-buy-now:freshness-probe -- \
            --convergence-gate \
            --environment staging \
            --admin-base-url "https://${admin_domain}" \
            --convergence-budget-ms "${PROJECTION_CONVERGENCE_BUDGET_MS}" \
            --convergence-poll-interval-ms "${PROJECTION_CONVERGENCE_POLL_INTERVAL_MS}" \
            --convergence-projection-names "${PROJECTION_CONVERGENCE_PROJECTION_NAMES}" \
            --out "$gate_out"
          gate_exit=$?
          set -e
          converged="$(jq -r '.gate.converged // "unknown"' "$gate_out" 2>/dev/null || echo unknown)"
          converged_after_ms="$(jq -r '.gate.convergedAfterMs // "did not converge"' "$gate_out" 2>/dev/null || echo unknown)"
          lagging="$(jq -r '(.gate.final.laggingGroups // []) | join(", ")' "$gate_out" 2>/dev/null || echo "")"
          {
            echo "## Staging projection convergence gate"
            echo ""
            echo "| Converged | Converged after (ms) | Budget (ms) | Lagging groups |"
            echo "| --- | --- | --- | --- |"
            echo "| ${converged} | ${converged_after_ms} | ${PROJECTION_CONVERGENCE_BUDGET_MS} | ${lagging:-none} |"
            echo ""
            echo "Bounded pre-probe gate (issue #4709): waits for staging projections to catch up after the fleet rollout before the Buy Now freshness probes run. Timing gate only; does not block promotion."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$gate_exit" -ne 0 ]; then
            echo "Staging projection convergence gate failed to run (exit ${gate_exit})." >&2
            exit 1
          fi

      - name: Staging Buy Now freshness probes
        id: buy_now_probes
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          GUEST_BUY_NOW_PROBE_ITEM_PATH: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ITEM_PATH || '' }}
          GUEST_BUY_NOW_PROBE_SEARCH_QUERY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_SEARCH_QUERY || 'air balloon' }}
          GUEST_BUY_NOW_PROBE_FIXTURE_KEY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_FIXTURE_KEY || 'staging-guest-buy-now-fixture' }}
          GUEST_BUY_NOW_PROBE_TIMEOUT_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_TIMEOUT_MS || '45000' }}
          GUEST_BUY_NOW_PROBE_READY_SLO_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_READY_SLO_MS || '10000' }}
          GUEST_BUY_NOW_PROBE_SLO_MODE: ${{ vars.GUEST_BUY_NOW_CANARY_SLO_MODE || 'warn' }}
          GUEST_BUY_NOW_PROBE_ATTEMPTS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ATTEMPTS || '3' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_BUDGET_MS || '120000' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_POLL_INTERVAL_MS || '5000' }}
          MARKETPLACE_E2E_EMAIL: ${{ vars.MARKETPLACE_E2E_EMAIL || '' }}
          MARKETPLACE_E2E_PASSWORD: ${{ secrets.MARKETPLACE_E2E_PASSWORD || '' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          set -euo pipefail
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$admin_domain" ] || [ -z "$marketplace_domain" ]; then
            echo "Required staging admin or marketplace domain was not present in Terraform outputs." >&2
            exit 1
          fi
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cd ../../..
          guest_out=artifacts/release-health/guest-buy-now-freshness-probe.json
          account_out=artifacts/release-health/account-buy-now-freshness-probe.json
          common_args=(
            --environment staging
            --base-url "https://${marketplace_domain}"
            --admin-base-url "https://${admin_domain}"
            --search-query "${GUEST_BUY_NOW_PROBE_SEARCH_QUERY}"
            --fixture-key "${GUEST_BUY_NOW_PROBE_FIXTURE_KEY}"
            --timeout-ms "${GUEST_BUY_NOW_PROBE_TIMEOUT_MS}"
            --ready-slo-ms "${GUEST_BUY_NOW_PROBE_READY_SLO_MS}"
            --attempts "${GUEST_BUY_NOW_PROBE_ATTEMPTS}"
            --wake-runtime-ready-budget-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS}"
            --wake-runtime-ready-poll-interval-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS}"
          )
          if [ -n "${GUEST_BUY_NOW_PROBE_ITEM_PATH}" ]; then
            common_args+=(--item-path "${GUEST_BUY_NOW_PROBE_ITEM_PATH}")
          fi

          set +e
          pnpm run guest-buy-now:freshness-probe -- \
            "${common_args[@]}" \
            --flow guest \
            --guest-email "guest-buy-now-probe+${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@chasesets.test" \
            --diagnostic-correlation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-guest" \
            --out "$guest_out"
          guest_exit=$?
          pnpm run guest-buy-now:freshness-probe -- \
            "${common_args[@]}" \
            --flow account \
            --diagnostic-correlation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-account" \
            --out "$account_out"
          account_exit=$?
          set -e

          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          read_field() {
            local file="$1" field="$2" fallback="$3"
            if [ -f "$file" ]; then
              jq -r ".${field} // \"${fallback}\"" "$file"
            else
              echo "$fallback"
            fi
          }
          guest_final_state="$(read_field "$guest_out" finalState unknown)"
          guest_promotion_decision="$(read_field "$guest_out" promotionDecision abort)"
          guest_failure_reason="$(read_field "$guest_out" failureReason unknown)"
          guest_ready_latency_ms="$(read_field "$guest_out" readyLatencyMs unknown)"
          account_final_state="$(read_field "$account_out" finalState unknown)"
          account_promotion_decision="$(read_field "$account_out" promotionDecision abort)"
          account_failure_reason="$(read_field "$account_out" failureReason unknown)"
          account_ready_latency_ms="$(read_field "$account_out" readyLatencyMs unknown)"

          result=success
          promotion_decision=promote
          if [ "$guest_exit" -ne 0 ] || [ "$account_exit" -ne 0 ]; then
            result=failure
            promotion_decision=abort
          elif [ "$guest_promotion_decision" = "warn" ] || [ "$account_promotion_decision" = "warn" ]; then
            promotion_decision=warn
          fi

          {
            echo "started_at=${started_at}"
            echo "completed_at=${completed_at}"
            echo "result=${result}"
            echo "promotion_decision=${promotion_decision}"
            echo "guest_final_state=${guest_final_state}"
            echo "guest_promotion_decision=${guest_promotion_decision}"
            echo "guest_failure_reason=${guest_failure_reason}"
            echo "guest_ready_latency_ms=${guest_ready_latency_ms}"
            echo "account_final_state=${account_final_state}"
            echo "account_promotion_decision=${account_promotion_decision}"
            echo "account_failure_reason=${account_failure_reason}"
            echo "account_ready_latency_ms=${account_ready_latency_ms}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Staging Buy Now freshness probes"
            echo ""
            echo "| Flow | Final state | Promotion decision | Failure reason | Ready latency (ms) | Correlation id |"
            echo "| --- | --- | --- | --- | --- | --- |"
            echo "| guest | ${guest_final_state} | ${guest_promotion_decision} | ${guest_failure_reason} | ${guest_ready_latency_ms} | github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-guest |"
            echo "| account | ${account_final_state} | ${account_promotion_decision} | ${account_failure_reason} | ${account_ready_latency_ms} | github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-account |"
            echo ""
            echo "Interpretation: docs/runbooks/guest-buy-now-freshness-probe.md. Each probe artifact records wake-runtime preflight status; join server-side wake segments by correlation id via the projection wake dashboard and /api/platform/projections/wake-status."
            if [ "$promotion_decision" = "warn" ]; then
              echo ""
              echo "WARNING: ready SLO exceeded with a user-safe final state. Recorded as a release-health warning; promotion was not blocked (slo-mode=warn, ratified single-write SLO per docs/architecture/push-wake-slo-load-proof.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$result" != "success" ]; then
            echo "Staging Buy Now freshness probes aborted promotion (guest exit ${guest_exit}, account exit ${account_exit})." >&2
            exit 1
          fi

      - name: Upload staging Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-playwright-critical-flow-artifacts
          path: |
            artifacts/playwright/report
            artifacts/playwright/test-results
            artifacts/release-health/guest-buy-now-freshness-probe.json
            artifacts/release-health/account-buy-now-freshness-probe.json

      - name: Upload staging Buy Now probe evidence
        if: always() && env.SHOULD_DEPLOY != 'false' && steps.buy_now_probes.conclusion != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-buy-now-freshness-probes
          path: |
            artifacts/release-health/guest-buy-now-freshness-probe.json
            artifacts/release-health/account-buy-now-freshness-probe.json
          if-no-files-found: error
          retention-days: 30

      - name: Staging Stripe money smoke
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          SMOKE_REGISTER_SELLER: "true"
          SMOKE_SELLER_EMAIL: stripe-staging+${{ github.run_id }}-${{ github.run_attempt }}@chasesets.test
          SMOKE_SELLER_PASSWORD: staging-stripe-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_SELLER_DISPLAY_NAME: Stripe Staging Smoke ${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_INVITATION_PROJECTION_TIMEOUT_MS: ${{ vars.STAGING_STRIPE_MONEY_SMOKE_INVITATION_PROJECTION_TIMEOUT_MS || '300000' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL || env.TF_VAR_platform_admin_email || '' }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD || env.TF_VAR_platform_admin_password || '' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONEY_SMOKE_ENVIRONMENT: staging
          STRIPE_MONEY_SMOKE_REQUIRE_DELIVERED_WEBHOOKS: "false"
          SMOKE_ORDER_IDS: ${{ vars.STAGING_SMOKE_ORDER_IDS || '' }}
          SMOKE_BALANCE_CREDIT_AMOUNT: ${{ vars.STAGING_SMOKE_BALANCE_CREDIT_AMOUNT || '' }}
          SMOKE_PAYMENT_METHOD_CATEGORY: ${{ vars.STAGING_SMOKE_PAYMENT_METHOD_CATEGORY || '' }}
          SMOKE_CREATE_PAYMENT: ${{ vars.STAGING_SMOKE_CREATE_PAYMENT || '' }}
          SMOKE_PAYOUT_AMOUNT: ${{ vars.STAGING_SMOKE_PAYOUT_AMOUNT || '' }}
          SMOKE_REQUEST_PAYOUT: ${{ vars.STAGING_SMOKE_REQUEST_PAYOUT || '' }}
        run: |
          set -euo pipefail
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$marketplace_domain" ]; then
            echo "Required staging marketplace domain was not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          PLATFORM_API_BASE_URL="https://${marketplace_domain}" \
            PLATFORM_AUTH_BASE_URL="https://${marketplace_domain}" \
            pnpm run stripe:money-smoke -- --edge-check --seller-flow

      - name: Mark staging deployed
        id: staging_deployed
        if: env.SHOULD_DEPLOY != 'false'
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Record staging completion
        id: staging_completed
        if: env.SHOULD_DEPLOY != 'false'
        run: echo "completed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  record-staging-release-health:
    name: Record Staging Release Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - resolve-release
      - deploy-staging
      - deploy-production
    if: always() && needs.resolve-release.outputs.deployment_required == 'true' && (needs.deploy-staging.outputs.deployed != 'true' || needs.deploy-production.outputs.superseded == 'true')
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check out release commit
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          git checkout --detach "$release_commit"

      - name: Resolve staging release health metadata
        id: release_health_metadata
        env:
          SOURCE_WORKFLOW_CREATED_AT: ${{ github.event_name == 'push' && github.event.head_commit.timestamp || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          committed_at="$(git show -s --format=%cI "$release_commit")"
          if ! node ./scripts/release-health-github-metadata.mjs \
            --repository "${{ github.repository }}" \
            --release-commit "$release_commit" \
            --source-workflow-created-at "${SOURCE_WORKFLOW_CREATED_AT:-}" \
            --format github-output >> "$GITHUB_OUTPUT"; then
            echo "GitHub release-health metadata was unavailable; writing deterministic fallbacks." >&2
            {
              echo "pr_number="
              echo "pr_opened_at="
              echo "pr_ready_for_review_at="
              echo "pr_approved_at="
              echo "queue_queued_at=${SOURCE_WORKFLOW_CREATED_AT:-}"
              echo "queue_merge_group_started_at="
              echo "queue_merged_at=${committed_at}"
              echo "queue_dequeued_at="
              echo "queue_failure_reason="
              echo "queue_batch_size=1"
              echo "merge_sha=${release_commit}"
            } >> "$GITHUB_OUTPUT"
          fi

          git fetch origin production || true
          drift_commits=0
          drift_seconds=0
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            drift_commits="$(git rev-list --count "origin/production..${release_commit}" 2>/dev/null || printf '0')"
            release_epoch="$(git show -s --format=%ct "$release_commit")"
            production_epoch="$(git show -s --format=%ct origin/production)"
            if [ "$release_epoch" -gt "$production_epoch" ]; then
              drift_seconds=$((release_epoch - production_epoch))
            fi
          fi

          {
            echo "completed_at=${completed_at}"
            echo "committed_at=${committed_at}"
            echo "drift_commits=${drift_commits}"
            echo "drift_seconds=${drift_seconds}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve staging CI retry metadata
        id: ci_metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! node ./scripts/release-health-ci-metadata.mjs \
            --repository "${{ github.repository }}" \
            --release-commit "${{ needs.resolve-release.outputs.release_commit }}" \
            --format github-output >> "$GITHUB_OUTPUT"; then
            {
              echo "ci_retry_count=0"
              echo "ci_flaky_failure_count=0"
              echo "ci_top_flaky_jobs=[]"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write staging release health summary
        env:
          RELEASE_HEALTH_OUT: artifacts/release-health/staging-release.json
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'emergency' || 'normal' }}
          PR_OPENED_AT: ${{ steps.release_health_metadata.outputs.pr_opened_at }}
          PR_READY_FOR_REVIEW_AT: ${{ steps.release_health_metadata.outputs.pr_ready_for_review_at }}
          PR_APPROVED_AT: ${{ steps.release_health_metadata.outputs.pr_approved_at }}
          QUEUE_BATCH_SIZE: ${{ steps.release_health_metadata.outputs.queue_batch_size || '1' }}
          QUEUE_QUEUED_AT: ${{ steps.release_health_metadata.outputs.queue_queued_at }}
          QUEUE_MERGE_GROUP_STARTED_AT: ${{ steps.release_health_metadata.outputs.queue_merge_group_started_at }}
          QUEUE_MERGED_AT: ${{ steps.release_health_metadata.outputs.queue_merged_at }}
          QUEUE_DEQUEUED_AT: ${{ steps.release_health_metadata.outputs.queue_dequeued_at }}
          QUEUE_FAILURE_REASON: ${{ steps.release_health_metadata.outputs.queue_failure_reason }}
          MERGE_SHA: ${{ steps.release_health_metadata.outputs.merge_sha }}
          RELEASE_COMMIT_COMMITTED_AT: ${{ steps.release_health_metadata.outputs.committed_at }}
          RELEASE_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'emergency-recovery' || needs.resolve-release.outputs.exposure_posture_changed == 'true' && 'exposure-posture-change' || 'ordinary-deploy' }}
          EXPOSURE_POSTURE_CATEGORIES: ${{ needs.resolve-release.outputs.exposure_posture_categories }}
          DEPLOYMENT_REQUIRED: ${{ needs.resolve-release.outputs.deployment_required }}
          STAGING_JOB_RESULT: ${{ needs.deploy-staging.result }}
          STAGING_DEPLOYED: ${{ needs.deploy-staging.outputs.deployed }}
          STAGING_STARTED_AT: ${{ needs.deploy-staging.outputs.started_at }}
          STAGING_COMPLETED_AT: ${{ needs.deploy-staging.outputs.completed_at }}
          CANARY_RESULT: ${{ needs.deploy-staging.outputs.buy_now_probe_result || 'skipped' }}
          CANARY_STARTED_AT: ${{ needs.deploy-staging.outputs.buy_now_probe_started_at }}
          CANARY_COMPLETED_AT: ${{ needs.deploy-staging.outputs.buy_now_probe_completed_at }}
          CANARY_COHORT_SUBJECT_TYPE: operator
          CANARY_COHORT_SIZE: "0"
          CANARY_PROMOTION_DECISION: ${{ needs.deploy-staging.outputs.buy_now_probe_promotion_decision || 'skipped' }}
          PRODUCTION_SUPERSEDED: ${{ needs.deploy-production.outputs.superseded }}
          PRODUCTION_SUPERSEDED_BY_COMMIT: ${{ needs.deploy-production.outputs.superseded_by_commit }}
          PRODUCTION_RESULT: skipped
          PRODUCTION_COMPLETED_AT: ${{ steps.release_health_metadata.outputs.completed_at }}
          CI_RETRY_COUNT: ${{ steps.ci_metadata.outputs.ci_retry_count }}
          CI_FLAKY_FAILURE_COUNT: ${{ steps.ci_metadata.outputs.ci_flaky_failure_count }}
          CI_TOP_FLAKY_JOBS: ${{ steps.ci_metadata.outputs.ci_top_flaky_jobs }}
          MAIN_TO_PRODUCTION_DRIFT_COMMITS: ${{ steps.release_health_metadata.outputs.drift_commits }}
          MAIN_TO_PRODUCTION_DRIFT_SECONDS: ${{ steps.release_health_metadata.outputs.drift_seconds }}
          EMERGENCY_RELEASE_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_reference || '' }}
          RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'fix-forward' || 'none' }}
          RECOVERY_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_reference || '' }}
          ROLLBACK_READINESS_RESULT: skipped
        run: |
          set -euo pipefail
          staging_result="${STAGING_JOB_RESULT:-unknown}"
          attempt_reason="staging-${staging_result}"
          if [ "${STAGING_DEPLOYED:-}" = "true" ]; then
            staging_result="success"
            attempt_reason="staging-deployed"
          elif [ "$staging_result" = "success" ]; then
            staging_result="skipped"
            attempt_reason="staging-not-deployed"
          fi

          attempt_result="$staging_result"
          attempt_phase="staging"
          superseded_by_commit=""
          if [ "${PRODUCTION_SUPERSEDED:-}" = "true" ]; then
            attempt_result="skipped"
            attempt_phase="production"
            attempt_reason="production-superseded-by-newer-main"
            superseded_by_commit="${PRODUCTION_SUPERSEDED_BY_COMMIT:-}"
          fi

          export STAGING_RESULT="$staging_result"
          if [ "${CANARY_RESULT:-skipped}" = "skipped" ]; then
            export CANARY_SKIPPED_REASON="$attempt_reason"
          fi
          export RELEASE_ATTEMPT_RESULT="$attempt_result"
          export RELEASE_ATTEMPT_PHASE="$attempt_phase"
          export RELEASE_ATTEMPT_REASON="$attempt_reason"
          export RELEASE_ATTEMPT_SUPERSEDED_BY_COMMIT="$superseded_by_commit"
          export RELEASE_ATTEMPT_WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"

          node ./scripts/release-health.mjs

      - name: Upload staging release health summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-release-health
          path: artifacts/release-health/staging-release.json
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - resolve-release
      - deploy-staging
    if: needs.deploy-staging.outputs.deployed == 'true'
    environment: production
    outputs:
      superseded: ${{ steps.latest_main.outputs.superseded || 'false' }}
      superseded_by_commit: ${{ steps.latest_main.outputs.latest_main }}
    concurrency:
      group: platform-deploy-production
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: production
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: ${{ needs.resolve-release.outputs.release_commit }}
      TF_VAR_platform_image_digest: ${{ needs.deploy-staging.outputs.platform_image_digest }}
      TF_VAR_production_runtime_profile: ${{ vars.PRODUCTION_RUNTIME_PROFILE || (vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true' && 'public' || 'landing') }}
      TF_VAR_production_marketplace_public_enabled: ${{ vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED || 'false' }}
      TF_VAR_production_marketplace_promotion_approved: ${{ vars.PRODUCTION_MARKETPLACE_PROMOTION_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_marketplace_promotion_reference: ${{ vars.PRODUCTION_MARKETPLACE_PROMOTION_REFERENCE || '' }}
      TF_VAR_production_marketplace_checkout_fee_approved: ${{ vars.PRODUCTION_MARKETPLACE_CHECKOUT_FEE_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_marketplace_checkout_fee_reference: ${{ vars.PRODUCTION_MARKETPLACE_CHECKOUT_FEE_REFERENCE || '' }}
      TF_VAR_production_checkout_launch_evidence_approved: ${{ vars.PRODUCTION_CHECKOUT_LAUNCH_EVIDENCE_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_checkout_launch_evidence_reference: ${{ vars.PRODUCTION_CHECKOUT_LAUNCH_EVIDENCE_REFERENCE || '' }}
      TF_VAR_checkout_shopify_simple_kill_switch_active: ${{ vars.CHECKOUT_SHOPIFY_SIMPLE_KILL_SWITCH_ACTIVE == 'true' && 'true' || 'false' }}
      TF_VAR_production_stripe_money_operations_approved: ${{ vars.PRODUCTION_STRIPE_MONEY_OPERATIONS_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_stripe_money_operations_reference: ${{ vars.PRODUCTION_STRIPE_MONEY_OPERATIONS_REFERENCE || '' }}
      TF_VAR_production_support_operations_approved: ${{ vars.PRODUCTION_SUPPORT_OPERATIONS_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_support_operations_reference: ${{ vars.PRODUCTION_SUPPORT_OPERATIONS_REFERENCE || '' }}
      TF_VAR_production_fulfillment_postage_approved: ${{ vars.PRODUCTION_FULFILLMENT_POSTAGE_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_fulfillment_postage_reference: ${{ vars.PRODUCTION_FULFILLMENT_POSTAGE_REFERENCE || '' }}
      TF_VAR_production_transactional_email_approved: ${{ vars.PRODUCTION_TRANSACTIONAL_EMAIL_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_transactional_email_reference: ${{ vars.PRODUCTION_TRANSACTIONAL_EMAIL_REFERENCE || '' }}
      TF_VAR_production_launch_supply_measurements_approved: ${{ vars.PRODUCTION_LAUNCH_SUPPLY_MEASUREMENTS_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_launch_supply_measurements_reference: ${{ vars.PRODUCTION_LAUNCH_SUPPLY_MEASUREMENTS_REFERENCE || '' }}
      TF_VAR_alert_emails: ${{ vars.PLATFORM_ALERT_EMAILS || '[]' }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
      TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
      TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
      TF_VAR_production_tax_readiness_approved: ${{ vars.PRODUCTION_TAX_READINESS_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_tax_readiness_reference: ${{ vars.PRODUCTION_TAX_READINESS_REFERENCE || '' }}
      TF_VAR_tax_provider_backed_quotes_required: ${{ vars.TAX_PROVIDER_BACKED_QUOTES_REQUIRED == 'true' && 'true' || 'false' }}
      TF_VAR_stripe_secret_key: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.STRIPE_SECRET_KEY || '' }}
      TF_VAR_stripe_publishable_key: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.STRIPE_PUBLISHABLE_KEY || '' }}
      TF_VAR_stripe_webhook_secret: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.STRIPE_WEBHOOK_SECRET || '' }}
      TF_VAR_stripe_connect_webhook_secret: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.STRIPE_CONNECT_WEBHOOK_SECRET || '' }}
      TF_VAR_stripe_connect_accounts_api: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && (vars.STRIPE_CONNECT_ACCOUNTS_API || 'v2') || 'v2' }}
      TF_VAR_stripe_api_base_url: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && vars.STRIPE_API_BASE_URL || '' }}
      TF_VAR_easypost_api_key: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.EASYPOST_API_KEY || '' }}
      TF_VAR_easypost_api_base_url: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && vars.EASYPOST_API_BASE_URL || '' }}
      TF_VAR_easypost_webhook_secret: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.EASYPOST_WEBHOOK_SECRET || '' }}
      TF_VAR_easypost_mode: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && (vars.EASYPOST_MODE || 'production') || 'test' }}
      TF_VAR_tcgplayer_automation_tcg_auth_cookie: ${{ secrets.TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE || '' }}
      TF_VAR_scrydex_api_key: ${{ secrets.SCRYDEX_API_KEY || '' }}
      TF_VAR_scrydex_team_id: ${{ secrets.SCRYDEX_TEAM_ID || '' }}
      TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
      TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
      TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
      TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
      TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
      TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
      TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
      TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
      TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED == 'false' && 'false' || 'true' }}
      TF_VAR_observability_otlp_endpoint: ${{ vars.OBSERVABILITY_OTLP_ENDPOINT || '' }}
      TF_VAR_observability_otlp_headers: ${{ secrets.OBSERVABILITY_OTLP_HEADERS || '' }}
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
      CHASE_SETS_HELM_RELEASE: chase-sets-platform
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
      CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT: 15m
      DESTRUCTIVE_CHANGE_ALLOW_FILE: .github/deployment/production-destructive-change-approved.md
      PRODUCTION_RELEASE_LOCKED: ${{ vars.PRODUCTION_RELEASE_LOCKED || 'false' }}
      PRODUCTION_RELEASE_LOCK_REASON: ${{ vars.PRODUCTION_RELEASE_LOCK_REASON || '' }}
      PRODUCTION_RELEASE_LOCK_REFERENCE: ${{ vars.PRODUCTION_RELEASE_LOCK_REFERENCE || '' }}
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check out release commit
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          git checkout --detach "$release_commit"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$release_commit" ]; then
            echo "Checked out ${checked_out_commit}, expected release commit ${release_commit}." >&2
            exit 1
          fi

      - name: Confirm automatic deploy is latest main
        id: latest_main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          latest_main="$(git rev-parse origin/main)"
          if [ "$release_commit" != "$latest_main" ]; then
            echo "Release commit ${release_commit} is no longer origin/main (${latest_main}); skipping stale production deployment."
            {
              echo "should_deploy=false"
              echo "superseded=true"
              echo "latest_main=${latest_main}"
            } >> "$GITHUB_OUTPUT"
            echo "SHOULD_DEPLOY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "should_deploy=true"
            echo "superseded=false"
            echo "latest_main=${latest_main}"
          } >> "$GITHUB_OUTPUT"
          echo "SHOULD_DEPLOY=true" >> "$GITHUB_ENV"

      - name: Record superseded production deployment
        if: env.SHOULD_DEPLOY == 'false'
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          latest_main="${{ steps.latest_main.outputs.latest_main }}"
          {
            echo "## Production deployment superseded"
            echo
            echo "Production intentionally skipped because a newer main commit owns deployment."
            echo
            echo "- Release commit: ${release_commit}"
            echo "- Superseding commit: ${latest_main}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record production start
        id: production_started
        if: env.SHOULD_DEPLOY != 'false'
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Evaluate production release lock
        id: release_lock
        if: env.SHOULD_DEPLOY != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ENVIRONMENT: production
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          EMERGENCY_RELEASE_BYPASS: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'true' || 'false' }}
          EMERGENCY_RELEASE_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_reference || '' }}
        run: node ./scripts/release-lock.mjs

      - name: Validate production configuration
        if: env.SHOULD_DEPLOY != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          PRODUCTION_TAX_PROVIDER_BACKED_QUOTES_REQUIRED_RAW: ${{ vars.TAX_PROVIDER_BACKED_QUOTES_REQUIRED || '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ "${TF_VAR_observability_enabled:-true}" != "false" ] && [ -z "${TF_VAR_observability_otlp_headers:-}" ]; then
            echo "Production observability requires OBSERVABILITY_OTLP_HEADERS secret or OBSERVABILITY_ENABLED=false." >&2
            exit 1
          fi

          if [ -n "${TF_VAR_admin_google_workspace_hosted_domains:-}" ]; then
            google_sso_missing=()
            for name in \
              TF_VAR_google_social_login_client_id \
              TF_VAR_google_social_login_client_secret
            do
              if [ -z "${!name:-}" ]; then
                google_sso_missing+=("$name")
              fi
            done

            if [ "${#google_sso_missing[@]}" -gt 0 ]; then
              printf 'Missing required production Google Workspace SSO configuration: %s\n' "${google_sso_missing[*]}" >&2
              exit 1
            fi
          fi

          if [ "${TF_VAR_production_runtime_profile:-landing}" != "landing" ]; then
            marketplace_missing=()
            for name in \
              TF_VAR_stripe_secret_key \
              TF_VAR_stripe_publishable_key \
              TF_VAR_stripe_webhook_secret \
              TF_VAR_stripe_connect_webhook_secret \
              TF_VAR_easypost_api_key \
              TF_VAR_easypost_webhook_secret
            do
              if [ -z "${!name:-}" ]; then
                marketplace_missing+=("$name")
              fi
            done

            if [ "${#marketplace_missing[@]}" -gt 0 ]; then
              printf 'Missing required production marketplace platform configuration: %s\n' "${marketplace_missing[*]}" >&2
              exit 1
            fi

            if [[ "${TF_VAR_stripe_secret_key}" != sk_live* || "${TF_VAR_stripe_publishable_key}" != pk_live* ]]; then
              echo "Production proof/public platform deployment requires Stripe live-mode keys." >&2
              exit 1
            fi

            if [ "${TF_VAR_easypost_mode:-}" != "production" ]; then
              echo "Production proof/public platform deployment requires EASYPOST_MODE=production." >&2
              exit 1
            fi

            if [ -n "${TF_VAR_stripe_api_base_url:-}" ]; then
              echo "Production proof/public platform deployment requires STRIPE_API_BASE_URL to be unset." >&2
              exit 1
            fi

            if [ -n "${TF_VAR_easypost_api_base_url:-}" ]; then
              echo "Production proof/public platform deployment requires EASYPOST_API_BASE_URL to be unset." >&2
              exit 1
            fi
          fi

          if [ "${TF_VAR_production_marketplace_public_enabled:-false}" = "true" ]; then
            if [ "${TF_VAR_production_marketplace_promotion_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_marketplace_promotion_reference:-}" ]; then
              echo "Production marketplace promotion requires an approved marketplace promotion record." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_marketplace_checkout_fee_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_marketplace_checkout_fee_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Marketplace Checkout Fee evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_checkout_launch_evidence_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_checkout_launch_evidence_reference:-}" ]; then
              echo "Production marketplace promotion requires approved checkout launch evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_support_operations_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_support_operations_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Support readiness." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_stripe_money_operations_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_stripe_money_operations_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Stripe money operations evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_fulfillment_postage_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_fulfillment_postage_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Fulfillment postage evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_launch_supply_measurements_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_launch_supply_measurements_reference:-}" ]; then
              echo "Production marketplace promotion requires approved launch supply measurement evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_tax_readiness_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_tax_readiness_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Tax readiness evidence." >&2
              exit 1
            fi

            if [ "${PRODUCTION_TAX_PROVIDER_BACKED_QUOTES_REQUIRED_RAW:-}" != "true" ] && [ "${PRODUCTION_TAX_PROVIDER_BACKED_QUOTES_REQUIRED_RAW:-}" != "false" ]; then
              echo "Production marketplace promotion requires TAX_PROVIDER_BACKED_QUOTES_REQUIRED to be explicitly true or false." >&2
              exit 1
            fi

            if [ "${TF_VAR_notification_email_provider:-}" != "amazon-ses" ]; then
              echo "Production marketplace promotion requires NOTIFICATION_EMAIL_PROVIDER=amazon-ses." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_transactional_email_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_transactional_email_reference:-}" ]; then
              echo "Production marketplace promotion requires approved transactional email evidence." >&2
              exit 1
            fi
          fi

          if [ "${TF_VAR_notification_email_provider:-}" = "amazon-ses" ]; then
            ses_missing=()
            for name in \
              TF_VAR_ses_aws_region \
              TF_VAR_ses_aws_access_key_id \
              TF_VAR_ses_aws_secret_access_key \
              TF_VAR_ses_from_email \
              TF_VAR_ses_configuration_set_name \
              TF_VAR_ses_source_arn
            do
              if [ -z "${!name:-}" ]; then
                ses_missing+=("$name")
              fi
            done

            if [ "${#ses_missing[@]}" -gt 0 ]; then
              printf 'Missing required production SES configuration: %s\n' "${ses_missing[*]}" >&2
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-pnpm-workspace
        if: env.SHOULD_DEPLOY != 'false'

      - name: Install dependencies
        if: env.SHOULD_DEPLOY != 'false'
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.SHOULD_DEPLOY != 'false'
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Download staged doctl binary
        if: env.SHOULD_DEPLOY != 'false'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: staged-doctl-linux-amd64
          path: artifacts/deploy-tools/doctl

      - name: Install staged doctl binary
        if: env.SHOULD_DEPLOY != 'false'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          install -m 0755 artifacts/deploy-tools/doctl/doctl "$RUNNER_TEMP/doctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/doctl" version
          "$RUNNER_TEMP/doctl" auth init --access-token "$DIGITALOCEAN_ACCESS_TOKEN"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        if: env.SHOULD_DEPLOY != 'false'
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: env.SHOULD_DEPLOY != 'false' && steps.buildx.outcome == 'failure'

      - name: Verify promoted App Platform image
        if: env.SHOULD_DEPLOY != 'false'
        id: image
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry does not exist. Run staging for this commit before production promotion." >&2
            exit 1
          fi

          doctl registry login --expiry-seconds 3600
          expected_digest="${TF_VAR_platform_image_digest}"
          if [ -z "$expected_digest" ]; then
            echo "Staging did not publish a verified App Platform image digest; refusing production promotion." >&2
            exit 1
          fi

          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${TF_VAR_platform_image_tag}"
          if ! docker buildx imagetools inspect "$image" >/tmp/promoted-image.txt; then
            echo "Promoted image ${image} was not found. Run a successful staging deployment for ${TF_VAR_platform_image_tag} first." >&2
            exit 1
          fi

          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          if [ "$digest" != "$expected_digest" ]; then
            echo "Promoted image digest ${digest} did not match staging verified digest ${expected_digest}." >&2
            exit 1
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_platform_image_digest=${digest}" >> "$GITHUB_ENV"
          echo "Promoting ${image}@${digest}"

      - name: Terraform init
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/production.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Terraform plan
        if: env.SHOULD_DEPLOY != 'false'
        id: terraform_plan
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform plan -out=tfplan
          mkdir -p artifacts/terraform-plans
          terraform show -no-color tfplan > artifacts/terraform-plans/production-tfplan.txt
          terraform show -json tfplan > artifacts/terraform-plans/production-tfplan.json
          node ../../../scripts/terraform-plan-inspection.mjs summarize-plan artifacts/terraform-plans/production-tfplan.json --title="Production Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          echo "plan_written=true" >> "$GITHUB_OUTPUT"
          node ../../../scripts/terraform-plan-inspection.mjs assert-no-destructive-changes tfplan --allow-file="../../../${DESTRUCTIVE_CHANGE_ALLOW_FILE}"
          app_changed="$(node ../../../scripts/terraform-plan-inspection.mjs plan-app-changed tfplan)"
          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"

      - name: Upload production Terraform plan
        if: always() && env.SHOULD_DEPLOY != 'false' && steps.terraform_plan.outputs.plan_written == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-terraform-plan
          path: infrastructure/digitalocean/platform/artifacts/terraform-plans/production-tfplan.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create production database restore point
        if: env.SHOULD_DEPLOY != 'false'
        id: production_restore_point
        working-directory: infrastructure/digitalocean/platform
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          RELEASE_MODE: ${{ steps.release_lock.outputs.release_mode || 'normal' }}
          EMERGENCY_RELEASE_REFERENCE: ${{ steps.release_lock.outputs.emergency_reference || '' }}
          PRODUCTION_DB_RESTORE_POINT_BYPASS: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'true' || 'false' }}
          PRODUCTION_DB_RESTORE_POINT_SKIP: ${{ needs.resolve-release.outputs.production_restore_point_required == 'true' && 'false' || 'true' }}
          PRODUCTION_DB_RESTORE_POINT_SKIP_REASON: ${{ needs.resolve-release.outputs.production_recovery_mode == 'pitr' && needs.resolve-release.outputs.production_recovery_reason || '' }}
          PRODUCTION_DB_RESTORE_POINT_CLEANUP_HOLD_NAMES: ${{ vars.PRODUCTION_DB_RESTORE_POINT_CLEANUP_HOLD_NAMES || '' }}
          PRODUCTION_DB_RESTORE_POINT_PRE_MIGRATE_STATE_KEY: ${{ vars.PRODUCTION_DB_RESTORE_POINT_PRE_MIGRATE_STATE_KEY || '' }}
        run: |
          set -euo pipefail
          pre_migrate_state_key="${PRODUCTION_DB_RESTORE_POINT_PRE_MIGRATE_STATE_KEY:-}"
          if [ -z "$pre_migrate_state_key" ]; then
            git fetch origin production || true
            production_marker_commit="$(git rev-parse --verify origin/production 2>/dev/null || true)"
            if [ -n "$production_marker_commit" ]; then
              pre_migrate_state_key="production-marker:${production_marker_commit}"
              echo "Using production marker commit as restore-point pre-migrate state key."
            fi
          fi
          if [ -z "$pre_migrate_state_key" ] && [ "$PRODUCTION_DB_RESTORE_POINT_BYPASS" != "true" ] && [ "$PRODUCTION_DB_RESTORE_POINT_SKIP" != "true" ]; then
            echo "Production marker did not resolve; refusing to continue without a pre-migrate restore-point state key." >&2
            exit 1
          fi

          source_cluster_id="$(terraform output -raw postgres_cluster_id 2>/dev/null || true)"
          if [ -z "$source_cluster_id" ]; then
            database_cluster_address="$(
              terraform state list 2>/dev/null \
                | awk '/(^|\.)digitalocean_database_cluster\./ { print; exit }' \
                || true
            )"
            if [ -n "$database_cluster_address" ]; then
              echo "Using production database cluster Terraform state address ${database_cluster_address}."
              source_cluster_id="$(
                terraform state show -no-color "$database_cluster_address" 2>/dev/null \
                  | awk -F '=' '{ key = $1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", key); if (key == "id") { value = $2; gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value); print value; exit } }' \
                  || true
              )"
            fi
          fi
          if [ -z "$source_cluster_id" ] && [ -f tfplan ]; then
            source_cluster_id="$(
              node ../../../scripts/terraform-plan-inspection.mjs postgres-cluster-id tfplan 2>/dev/null \
                || true
            )"
            if [ -n "$source_cluster_id" ]; then
              echo "Using production database cluster id from Terraform plan."
            fi
          fi
          if [ -z "$source_cluster_id" ] && [ "$PRODUCTION_DB_RESTORE_POINT_BYPASS" != "true" ] && [ "$PRODUCTION_DB_RESTORE_POINT_SKIP" != "true" ]; then
            echo "Production Terraform state did not expose postgres_cluster_id; refusing to continue without a pre-migrate restore point." >&2
            exit 1
          fi

          cd ../../..
          node ./scripts/production-db-restore-point.mjs \
            --source-cluster-id "$source_cluster_id" \
            --pre-migrate-state-key "$pre_migrate_state_key" \
            --out artifacts/release-health/production-db-restore-point.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Configure production Kubernetes context
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/production.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-production.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl config current-context >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -z "$cluster_id" ] && [ -z "$cluster_name" ]; then
              cluster_address="$(
                terraform state list \
                  | awk '/(^|\.)digitalocean_kubernetes_cluster\./ { print; exit }'
              )"
              if [ -n "$cluster_address" ]; then
                echo "Using production DOKS cluster Terraform state address ${cluster_address}." >&2
                cluster_state="$(terraform state show -no-color "$cluster_address")"
                cluster_id="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "id") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
                cluster_name="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "name") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
              fi
            fi
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure production Kubernetes context." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Production Kubernetes kubeconfig is present but has no current context after Terraform and DigitalOcean refresh attempts." >&2
            KUBECONFIG="$kubeconfig" kubectl config get-contexts || true
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured production Kubernetes context: ${current_context}"

      - name: Capture production rollback target
        if: env.SHOULD_DEPLOY != 'false'
        id: rollback_target
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin production --tags
          last_known_good_commit="$(git rev-parse origin/production)"
          release_tag="$(
            git tag --points-at "$last_known_good_commit" --list 'release-*' \
              | sort \
              | tail -n 1
          )"
          if [ -z "$release_tag" ]; then
            echo "Production marker ${last_known_good_commit} has no release-* tag; rollback readiness will fail closed." >&2
          fi

          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry does not exist; refusing cutover without rollback image evidence." >&2
            exit 1
          fi

          mkdir -p artifacts/release-health
          target_path="artifacts/release-health/production-rollback-target.json"
          node ./scripts/platform-kubernetes-deployment.mjs capture-rollback-target \
            --registry-name="$registry_name" \
            --repository="$PLATFORM_IMAGE_REPOSITORY" \
            --last-known-good-commit="$last_known_good_commit" \
            --release-tag="$release_tag" \
            --namespace="$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release="$CHASE_SETS_HELM_RELEASE" \
            --out="$target_path" \
            --github-output="$GITHUB_OUTPUT"

          image_ref="$(jq -r '.imageRef // ""' "$target_path")"
          doctl registry login --expiry-seconds 3600
          if [ -n "$image_ref" ] && docker buildx imagetools inspect "$image_ref" >/dev/null 2>&1; then
            image_exists=true
          else
            image_exists=false
          fi

          smoke_verified=false
          if [ -n "$release_tag" ] && git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            if [ "$tag_commit" = "$last_known_good_commit" ]; then
              smoke_verified=true
            fi
          fi

          {
            echo "image_exists=${image_exists}"
            echo "smoke_verified=${smoke_verified}"
            echo "last_known_good_commit=${last_known_good_commit}"
            echo "rollback_release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate production rollback readiness
        if: env.SHOULD_DEPLOY != 'false'
        id: rollback_readiness
        env:
          ROLLBACK_READINESS_OUT: artifacts/release-health/production-rollback-readiness.json
          RECOVERY_MODE: rollback
          ROLLBACK_TARGET_COMMIT: ${{ steps.rollback_target.outputs.last_known_good_commit }}
          LAST_KNOWN_GOOD_COMMIT: ${{ steps.rollback_target.outputs.last_known_good_commit }}
          ROLLBACK_RELEASE_TAG: ${{ steps.rollback_target.outputs.rollback_release_tag }}
          ROLLBACK_IMAGE_REF: ${{ steps.rollback_target.outputs.rollback_image_ref }}
          ROLLBACK_IMAGE_EXISTS: ${{ steps.rollback_target.outputs.image_exists }}
          ROLLBACK_SMOKE_VERIFIED: ${{ steps.rollback_target.outputs.smoke_verified }}
          ROLLBACK_DESTRUCTIVE_PLAN_APPROVED: "false"
          EMERGENCY_RELEASE_REFERENCE: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pnpm run rollback:readiness
          result="$(jq -r '.result // "failure"' artifacts/release-health/production-rollback-readiness.json)"
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform apply -auto-approve tfplan

      - name: Capture production Terraform errored state
        if: failure() && env.SHOULD_DEPLOY != 'false'
        id: capture_production_terraform_errored_state
        working-directory: infrastructure/digitalocean/platform
        run: |
          set -euo pipefail

          state_path="errored.tfstate"
          artifact_path="artifacts/terraform-errored-state/production-errored.tfstate"
          if [ -f "$state_path" ]; then
            mkdir -p "$(dirname "$artifact_path")"
            cp "$state_path" "$artifact_path"
            echo "captured=true" >> "$GITHUB_OUTPUT"
            echo "### Production Terraform errored state" >> "$GITHUB_STEP_SUMMARY"
            echo "Captured sensitive recovery artifact \`sensitive-production-terraform-errored-state-recovery-only\` with 1-day retention. Do not print or share its contents." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "### Production Terraform errored state" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`errored.tfstate\` file was present after Terraform apply failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production Terraform errored state
        if: failure() && env.SHOULD_DEPLOY != 'false' && steps.capture_production_terraform_errored_state.outputs.captured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensitive-production-terraform-errored-state-recovery-only
          path: infrastructure/digitalocean/platform/artifacts/terraform-errored-state/production-errored.tfstate
          if-no-files-found: error
          retention-days: 1

      - name: Export production Kubernetes database URLs
        if: env.SHOULD_DEPLOY != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DEPLOYMENT_ENVIRONMENT: production
        run: |
          set -euo pipefail
          state_path="${RUNNER_TEMP}/platform-production.tfstate.json"
          terraform -chdir=infrastructure/digitalocean/platform state pull > "$state_path"
          TERRAFORM_STATE_PATH="$state_path" node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const state = JSON.parse(fs.readFileSync(process.env.TERRAFORM_STATE_PATH, "utf8"));
          const resources = Array.isArray(state.resources) ? state.resources : [];
          const resource = (type, name) =>
            resources.find((candidate) => candidate.type === type && candidate.name === name);
          const indexed = (item) =>
            new Map((item?.instances ?? []).map((instance) => [String(instance.index_key ?? ""), instance.attributes ?? {}]));
          const contextFromToken = (token) => token.toLowerCase().replaceAll("_", "-");

          const cluster = resource("digitalocean_database_cluster", "postgres");
          const databases = indexed(resource("digitalocean_database_db", "contexts"));
          const contextUsers = indexed(resource("digitalocean_database_user", "contexts"));
          const wakeUsers = indexed(resource("digitalocean_database_user", "wake_listeners"));
          const clusterAttrs = cluster?.instances?.[0]?.attributes ?? {};
          if (!clusterAttrs.host || !clusterAttrs.port) {
            throw new Error("Production Terraform state does not contain a usable DigitalOcean database cluster.");
          }

          const secretSummary = JSON.parse(
            execFileSync(process.execPath, [
              "./scripts/platform-kubernetes-secret.mjs",
              "--dry-run",
              "--namespace",
              process.env.CHASE_SETS_KUBERNETES_NAMESPACE,
            ], { encoding: "utf8" }),
          );

          const urlFor = (contextName, users) => {
            const database = databases.get(contextName);
            const user = users.get(contextName);
            if (!database?.name || !user?.name || !user?.password) {
              throw new Error(`Production Terraform state is missing database/user data for '${contextName}'.`);
            }
            return `postgresql://${encodeURIComponent(user.name)}:${encodeURIComponent(user.password)}` +
              `@${clusterAttrs.host}:${clusterAttrs.port}/${encodeURIComponent(database.name)}?sslmode=require`;
          };

          const lines = [];
          const add = (name, value) => {
            console.log(`::add-mask::${value}`);
            lines.push(`${name}=${value}`);
          };

          for (const key of secretSummary.keys ?? []) {
            let match = /^DATABASE_URL_([A-Z0-9_]+)_WAITER$/.exec(key);
            if (match) {
              add(key, urlFor(contextFromToken(match[1]), wakeUsers));
              continue;
            }

            match = /^WORKER_LISTENER_DATABASE_URL_([A-Z0-9_]+)$/.exec(key);
            if (match) {
              add(key, urlFor(contextFromToken(match[1]), wakeUsers));
              continue;
            }

            match = /^DATABASE_URL_([A-Z0-9_]+)$/.exec(key);
            if (match) {
              add(key, urlFor(contextFromToken(match[1]), contextUsers));
              continue;
            }

            if (key === "PLATFORM_CONTROL_DATABASE_URL" || key === "PLATFORM_WORK_SIGNAL_DATABASE_URL") {
              add(key, urlFor("control", contextUsers));
            }
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          NODE

      - name: Apply production Kubernetes runtime secrets
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          export CATALOG_ASSET_S3_ACCESS_KEY_ID="${TF_VAR_spaces_access_id:-}"
          export CATALOG_ASSET_S3_SECRET_ACCESS_KEY="${TF_VAR_spaces_secret_key:-}"
          export CHASE_SETS_DISCORD_INVITE_URL="${TF_VAR_discord_invite_url:-}"
          export EASYPOST_API_KEY="${TF_VAR_easypost_api_key:-}"
          export EASYPOST_WEBHOOK_SECRET="${TF_VAR_easypost_webhook_secret:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_facebook_social_login_client_id:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_facebook_social_login_client_secret:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_google_social_login_client_id:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_google_social_login_client_secret:-}"
          export OTEL_EXPORTER_OTLP_HEADERS="${TF_VAR_observability_otlp_headers:-}"
          export PLATFORM_ADMIN_EMAIL="${TF_VAR_platform_admin_email:-}"
          export PLATFORM_ADMIN_PASSWORD="${TF_VAR_platform_admin_password:-}"
          export PLATFORM_INTERNAL_AUTH_SECRET="${TF_VAR_platform_internal_auth_secret:-}"
          export SCRYDEX_API_KEY="${TF_VAR_scrydex_api_key:-}"
          export SCRYDEX_TEAM_ID="${TF_VAR_scrydex_team_id:-}"
          export SES_AWS_ACCESS_KEY_ID="${TF_VAR_ses_aws_access_key_id:-}"
          export SES_AWS_SECRET_ACCESS_KEY="${TF_VAR_ses_aws_secret_access_key:-}"
          export SES_SOURCE_ARN="${TF_VAR_ses_source_arn:-}"
          export STRIPE_CONNECT_WEBHOOK_SECRET="${TF_VAR_stripe_connect_webhook_secret:-}"
          export STRIPE_PUBLISHABLE_KEY="${TF_VAR_stripe_publishable_key:-}"
          export STRIPE_SECRET_KEY="${TF_VAR_stripe_secret_key:-}"
          export STRIPE_WEBHOOK_SECRET="${TF_VAR_stripe_webhook_secret:-}"
          export TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE="${TF_VAR_tcgplayer_automation_tcg_auth_cookie:-}"

          node ./scripts/platform-kubernetes-secret.mjs --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE"

      - name: Apply production Kubernetes registry pull secret
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry is required before production Kubernetes deploys can pull images." >&2
            exit 1
          fi

          registry_pull_secret_name="registry-${registry_name}"
          docker_config="$(mktemp)"
          trap 'rm -f "$docker_config"' EXIT
          doctl registry docker-config --expiry-seconds 3600 > "$docker_config"
          kubectl create secret generic "$registry_pull_secret_name" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --from-file=.dockerconfigjson="$docker_config" \
            --type=kubernetes.io/dockerconfigjson \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          echo "CHASE_SETS_IMAGE_PULL_SECRET_NAME=${registry_pull_secret_name}" >> "$GITHUB_ENV"

      - name: Deploy production Kubernetes release
        if: env.SHOULD_DEPLOY != 'false'
        env:
          PLATFORM_IMAGE_REF: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          catalog_asset_public_base_url="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_public_base_url)"
          catalog_asset_s3_bucket="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_bucket)"
          catalog_asset_s3_endpoint="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_endpoint)"
          catalog_asset_s3_region="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_region)"
          if [ -z "$catalog_asset_public_base_url" ] || [ -z "$catalog_asset_s3_bucket" ] || [ -z "$catalog_asset_s3_endpoint" ] || [ -z "$catalog_asset_s3_region" ]; then
            echo "Production catalog asset runtime env outputs are required before Kubernetes deploy." >&2
            exit 1
          fi

          pnpm run platform:kubernetes-deployment -- deploy \
            --image "$PLATFORM_IMAGE_REF" \
            --image-pull-secret "$CHASE_SETS_IMAGE_PULL_SECRET_NAME" \
            --runtime-env "DEPLOYMENT_ENVIRONMENT=production" \
            --runtime-env "CHASE_SETS_RUNTIME_PROFILE=${TF_VAR_production_runtime_profile:-landing}" \
            --runtime-env "PLATFORM_DATA_PROFILES=critical-bootstrap,catalog-integration-bootstrap" \
            --runtime-env "CATALOG_ASSET_PUBLIC_BASE_URL=${catalog_asset_public_base_url}" \
            --runtime-env "CATALOG_ASSET_S3_BUCKET=${catalog_asset_s3_bucket}" \
            --runtime-env "CATALOG_ASSET_S3_ENDPOINT=${catalog_asset_s3_endpoint}" \
            --runtime-env "CATALOG_ASSET_S3_REGION=${catalog_asset_s3_region}" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT"

      - name: Capture production Kubernetes deploy diagnostics
        if: failure() && env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          pnpm run platform:kubernetes-deployment -- diagnostics \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" || true

      - name: Wait for production domains
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          mapfile -t public_domains < <(terraform output -json public_domains | jq -r '.[]')
          mapfile -t marketplace_domains < <(terraform output -json marketplace_domains | jq -r '.[]')
          admin_domain="$(terraform output -raw admin_domain)"
          if [ "${#public_domains[@]}" -eq 0 ] || [ -z "$admin_domain" ]; then
            echo "Required production domains were not present in Terraform outputs." >&2
            exit 1
          fi
          if [ "${TF_VAR_production_marketplace_public_enabled:-false}" = "true" ] && [ "${#marketplace_domains[@]}" -eq 0 ]; then
            echo "Production marketplace promotion was enabled but no marketplace domains were present in Terraform outputs." >&2
            exit 1
          fi

          wait_for_domain() {
            local hostname="$1"
            local url="https://${hostname}"
            curl --fail --silent --show-error --head --retry 120 --retry-delay 30 --retry-all-errors --max-time 15 "$url" >/dev/null
          }

          for hostname in "${public_domains[@]}" "${marketplace_domains[@]}" "$admin_domain"; do
            wait_for_domain "$hostname"
          done

      # Post-deploy readiness gate (#1237): derive direct production database
      # URLs for the audited wave contexts from Terraform state (same pattern
      # as the staging wake drills / representative-commerce-state workflows)
      # so the readiness gate below can compare projection checkpoints against
      # the event-store head before projection-dependent smoke assertions run.
      - name: Export production readiness database URLs
        if: env.SHOULD_DEPLOY != 'false'
        # Support step: an export failure leaves the gate without database
        # URLs, which it reports as a config error and fails closed before
        # production smoke runs.
        continue-on-error: true
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          READINESS_GATE_SOURCE_CONTEXTS: ${{ vars.PRODUCTION_READINESS_GATE_SOURCE_CONTEXTS || 'checkout,public-presence' }}
        run: |
          set -euo pipefail
          state_path="${RUNNER_TEMP}/platform-production.tfstate.json"
          terraform state pull > "$state_path"
          TERRAFORM_STATE_PATH="$state_path" node <<'NODE'
          const fs = require("node:fs");
          const state = JSON.parse(fs.readFileSync(process.env.TERRAFORM_STATE_PATH, "utf8"));
          const resources = Array.isArray(state.resources) ? state.resources : [];
          const cluster = resources.find((resource) =>
            resource.type === "digitalocean_database_cluster" && resource.name === "postgres"
          );
          const databases = resources.find((resource) =>
            resource.type === "digitalocean_database_db" && resource.name === "contexts"
          );
          const users = resources.find((resource) =>
            resource.type === "digitalocean_database_user" && resource.name === "contexts"
          );
          const clusterAttrs = cluster?.instances?.[0]?.attributes ?? {};
          if (!clusterAttrs.host || !clusterAttrs.port) {
            throw new Error("Production Terraform state does not contain a usable DigitalOcean database cluster.");
          }

          const databaseByContext = new Map(
            (databases?.instances ?? []).map((instance) => [instance.index_key, instance.attributes ?? {}])
          );
          const userByContext = new Map(
            (users?.instances ?? []).map((instance) => [instance.index_key, instance.attributes ?? {}])
          );
          const readinessContexts = String(process.env.READINESS_GATE_SOURCE_CONTEXTS ?? "checkout,public-presence")
            .split(",")
            .map((entry) => entry.trim())
            .filter(Boolean);
          const contextNames = [...new Set([...readinessContexts, "checkout", "public-presence", "control"])].sort();

          const lines = [];
          for (const contextName of contextNames) {
            const database = databaseByContext.get(contextName);
            const user = userByContext.get(contextName);
            if (!contextName || !database?.name || !user?.name || !user?.password) {
              throw new Error(`Direct database state is incomplete for context '${contextName ?? "unknown"}'.`);
            }

            const url = `postgresql://${encodeURIComponent(user.name)}:${encodeURIComponent(user.password)}` +
              `@${clusterAttrs.host}:${clusterAttrs.port}/${encodeURIComponent(database.name)}?sslmode=require`;
            const envName = contextName === "control"
              ? "PLATFORM_CONTROL_DATABASE_URL"
              : `DATABASE_URL_${String(contextName).toUpperCase().replaceAll("-", "_")}`;
            console.log(`::add-mask::${url}`);
            lines.push(`${envName}=${url}`);
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          NODE

      # Bounded wait for steady state (#1237): poll until the audited contexts'
      # projection checkpoints reach the event-store head or the budget expires
      # so projection-dependent production smoke assertions measure
      # steady-state freshness instead of post-deploy catch-up. Fail closed if
      # the budget expires or the gate cannot sample production databases.
      - name: Production post-deploy readiness gate
        timeout-minutes: 20
        id: readiness_gate
        if: env.SHOULD_DEPLOY != 'false'
        env:
          READINESS_GATE_SOURCE_CONTEXTS: ${{ vars.PRODUCTION_READINESS_GATE_SOURCE_CONTEXTS || 'checkout,public-presence' }}
          READINESS_GATE_BUDGET_MS: ${{ vars.PRODUCTION_READINESS_GATE_BUDGET_MS || '300000' }}
        run: |
          set -euo pipefail
          set +e
          node ./scripts/production-readiness-gate.mjs \
            --out artifacts/release-health/production-readiness-gate.json
          gate_exit=$?
          set -e
          case "$gate_exit" in
            0) outcome=ready ;;
            1) outcome=budget-expired ;;
            *) outcome=error ;;
          esac
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
          if [ "$outcome" != "ready" ]; then
            echo "::error::Production post-deploy readiness gate outcome was '${outcome}'; failing closed before projection-dependent smoke assertions."
            exit "$gate_exit"
          fi

      - name: Smoke check
        timeout-minutes: 15
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_ADMIN_GOOGLE_WORKSPACE_SSO: "true"
          SMOKE_EMAIL: ops+smoke@chasesets.com
          SMOKE_EMAIL_SUFFIX: production-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_SOURCE: production-smoke
          SMOKE_UTM_CAMPAIGN: production-main
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
          SMOKE_FETCH_TIMEOUT_MS: "15000"
        run: |
          set -euo pipefail
          public_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          catalog_asset_public_base_url="$(terraform output -raw catalog_asset_public_base_url)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          smoke_urls=("https://${public_domain}" "https://${admin_domain}")
          if [ "${TF_VAR_production_runtime_profile:-landing}" = "landing" ]; then
            export SMOKE_REQUIRE_NATIVE_MCP="false"
          else
            export SMOKE_REQUIRE_NATIVE_MCP="true"
          fi
          export SMOKE_REQUIRE_FULFILLMENT_POSTAGE="${TF_VAR_production_fulfillment_postage_approved:-false}"
          if [ "${TF_VAR_production_marketplace_public_enabled:-false}" = "true" ]; then
            export SMOKE_ADMIN_TOPOLOGY="public-marketplace"
            if [ -z "$marketplace_domain" ]; then
              echo "Production marketplace promotion was enabled but no marketplace domain was present in Terraform outputs." >&2
              exit 1
            fi
            export SMOKE_REQUIRE_MARKETPLACE="true"
            smoke_urls+=("https://${marketplace_domain}")
          else
            export SMOKE_ADMIN_TOPOLOGY="production-platform-disabled"
          fi
          cd ../../..
          pnpm run smoke:platform -- "${smoke_urls[@]}"
          catalog_asset_root_status=""
          for attempt in $(seq 1 12); do
            catalog_asset_root_status="$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' \
              "${catalog_asset_public_base_url}/" || true)"
            echo "Catalog asset CDN root status ${catalog_asset_root_status} on attempt ${attempt}."
            if [ "$catalog_asset_root_status" = "403" ]; then
              break
            fi
            sleep 10
          done
          if [ "$catalog_asset_root_status" != "403" ]; then
            echo "Catalog asset CDN root must stay protected; expected 403, got ${catalog_asset_root_status:-none}." >&2
            exit 1
          fi
          echo "Catalog asset CDN root returned expected protected status 403."

      - name: Stage 1 production canary
        id: stage1_canary
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"

          public_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          canary_urls=("https://${public_domain}" "https://${admin_domain}")
          if [ "${TF_VAR_production_marketplace_public_enabled:-false}" = "true" ]; then
            if [ -z "$marketplace_domain" ]; then
              echo "Production marketplace canary was requested but no marketplace domain was present." >&2
              exit 1
            fi
            canary_urls+=("https://${marketplace_domain}")
          fi

          for url in "${canary_urls[@]}"; do
            curl --fail --silent --show-error --head --retry 12 --retry-delay 10 --retry-all-errors "$url" >/dev/null
          done

          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "completed_at=${completed_at}" >> "$GITHUB_OUTPUT"
          echo "Stage 1 production canary verified ${#canary_urls[@]} synthetic/operator-safe endpoints."

      - name: Capture post-cutover production Kubernetes diagnostics
        if: failure() && env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          pnpm run platform:kubernetes-deployment -- diagnostics \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" || true

      - name: Roll back production Kubernetes release
        id: production_rollback
        if: failure() && env.SHOULD_DEPLOY != 'false' && steps.rollback_readiness.outputs.result == 'success'
        run: |
          set -euo pipefail

          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"
          rollback_record="artifacts/release-health/production-rollback.json"
          mkdir -p "$(dirname "$rollback_record")"
          pnpm run platform:kubernetes-deployment -- rollback \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT" \
            --out "$rollback_record" \
            --github-output "$GITHUB_OUTPUT"
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          rollback_result="$(jq -r '.result // "unknown"' "$rollback_record")"
          rollback_reason="$(jq -r '.reason // empty' "$rollback_record")"
          rollback_reference="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-automated-production-rollback"
          {
            echo "completed_at=${completed_at}"
            echo "result=${rollback_result}"
            if [ "$rollback_result" = "success" ]; then
              echo "rollback_reference=${rollback_reference}"
              echo "rollback_target_commit=${{ steps.rollback_target.outputs.last_known_good_commit }}"
            else
              echo "rollback_reference="
              echo "rollback_target_commit="
            fi
          } >> "$GITHUB_OUTPUT"
          if [ "$rollback_result" = "success" ]; then
            {
              echo "## Automated production rollback"
              echo
              echo "A post-cutover production verification step failed. Helm rolled the production Kubernetes release back to the previous revision."
              echo
              echo "- Target commit: ${{ steps.rollback_target.outputs.last_known_good_commit }}"
              echo "- Release tag: ${{ steps.rollback_target.outputs.rollback_release_tag }}"
              echo "- Image: ${{ steps.rollback_target.outputs.rollback_image_ref }}"
              echo "- Workloads: ${{ steps.rollback_target.outputs.rollback_components }}"
              echo "- Reference: ${rollback_reference}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Automated production rollback skipped"
              echo
              echo "A production verification step failed before a Helm release existed, so there was no prior Kubernetes release to roll back."
              echo
              echo "- Result: ${rollback_result}"
              echo "- Reason: ${rollback_reason:-unknown}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mark production release
        id: production_marker
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          release_tag="release-$(date -u +%Y%m%d%H%M%S)-$(printf '%s' "$release_commit" | cut -c1-8)"
          promoted_image="${{ steps.image.outputs.image }}"
          release_image="${promoted_image%:*}:${release_tag}"

          docker buildx imagetools create --tag "$release_image" "$promoted_image"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin production || true
          git fetch origin --tags || true

          if ! git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            git tag -a "$release_tag" "$release_commit" -m "Production release ${release_tag}"
            git push origin "refs/tags/${release_tag}"
          fi

          if git show-ref --verify --quiet refs/remotes/origin/production; then
            production_marker_commit="$(git rev-parse origin/production)"
            git checkout -B production origin/production
            if ! git merge --ff-only "$release_commit"; then
              {
                echo "marker_updated=false"
                echo "marker_mismatch=true"
                echo "production_marker_commit=${production_marker_commit}"
                echo "marker_error=production-marker-non-fast-forward"
              } >> "$GITHUB_OUTPUT"
              {
                echo "## Production marker mismatch"
                echo
                echo "Production deployed successfully, but the smoke-verified production marker could not fast-forward."
                echo
                echo "- Deployed commit: ${release_commit}"
                echo "- Current production marker: ${production_marker_commit}"
                echo "- Error: production-marker-non-fast-forward"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            production_marker_commit=""
            git checkout -B production "$release_commit"
          fi

          if ! git push origin production; then
            git fetch origin production || true
            production_marker_commit="$(git rev-parse origin/production 2>/dev/null || printf '%s' "${production_marker_commit}")"
            {
              echo "marker_updated=false"
              echo "marker_mismatch=true"
              echo "production_marker_commit=${production_marker_commit}"
              echo "marker_error=production-marker-push-failed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Production marker mismatch"
              echo
              echo "Production deployed successfully, but the smoke-verified production marker push failed."
              echo
              echo "- Deployed commit: ${release_commit}"
              echo "- Current production marker: ${production_marker_commit:-unknown}"
              echo "- Error: production-marker-push-failed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "marker_updated=true"
            echo "marker_mismatch=false"
            echo "production_marker_commit=${release_commit}"
            echo "marker_error="
          } >> "$GITHUB_OUTPUT"

      - name: Resolve release health metadata
        id: release_health_metadata
        if: always()
        env:
          SOURCE_WORKFLOW_CREATED_AT: ${{ github.event_name == 'push' && github.event.head_commit.timestamp || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          committed_at="$(git show -s --format=%cI "$release_commit")"
          if ! node ./scripts/release-health-github-metadata.mjs \
            --repository "${{ github.repository }}" \
            --release-commit "$release_commit" \
            --source-workflow-created-at "${SOURCE_WORKFLOW_CREATED_AT:-}" \
            --format github-output >> "$GITHUB_OUTPUT"; then
            echo "GitHub release-health metadata was unavailable; writing deterministic fallbacks." >&2
            {
              echo "pr_number="
              echo "pr_opened_at="
              echo "pr_ready_for_review_at="
              echo "pr_approved_at="
              echo "queue_queued_at=${SOURCE_WORKFLOW_CREATED_AT:-}"
              echo "queue_merge_group_started_at="
              echo "queue_merged_at=${committed_at}"
              echo "queue_dequeued_at="
              echo "queue_failure_reason="
              echo "queue_batch_size=1"
              echo "merge_sha=${release_commit}"
            } >> "$GITHUB_OUTPUT"
          fi

          git fetch origin production || true
          drift_commits=0
          drift_seconds=0
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            drift_commits="$(git rev-list --count "origin/production..${release_commit}" 2>/dev/null || printf '0')"
            release_epoch="$(git show -s --format=%ct "$release_commit")"
            production_epoch="$(git show -s --format=%ct origin/production)"
            if [ "$release_epoch" -gt "$production_epoch" ]; then
              drift_seconds=$((release_epoch - production_epoch))
            fi
          fi

          {
            echo "completed_at=${completed_at}"
            echo "committed_at=${committed_at}"
            echo "drift_commits=${drift_commits}"
            echo "drift_seconds=${drift_seconds}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve CI retry metadata
        id: ci_metadata
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! node ./scripts/release-health-ci-metadata.mjs \
            --repository "${{ github.repository }}" \
            --release-commit "${{ needs.resolve-release.outputs.release_commit }}" \
            --format github-output >> "$GITHUB_OUTPUT"; then
            {
              echo "ci_retry_count=0"
              echo "ci_flaky_failure_count=0"
              echo "ci_top_flaky_jobs=[]"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write release health summary
        if: always()
        env:
          RELEASE_HEALTH_OUT: artifacts/release-health/production-release.json
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'emergency' || 'normal' }}
          PR_OPENED_AT: ${{ steps.release_health_metadata.outputs.pr_opened_at }}
          PR_READY_FOR_REVIEW_AT: ${{ steps.release_health_metadata.outputs.pr_ready_for_review_at }}
          PR_APPROVED_AT: ${{ steps.release_health_metadata.outputs.pr_approved_at }}
          QUEUE_BATCH_SIZE: ${{ steps.release_health_metadata.outputs.queue_batch_size || '1' }}
          QUEUE_QUEUED_AT: ${{ steps.release_health_metadata.outputs.queue_queued_at }}
          QUEUE_MERGE_GROUP_STARTED_AT: ${{ steps.release_health_metadata.outputs.queue_merge_group_started_at }}
          QUEUE_MERGED_AT: ${{ steps.release_health_metadata.outputs.queue_merged_at }}
          QUEUE_DEQUEUED_AT: ${{ steps.release_health_metadata.outputs.queue_dequeued_at }}
          QUEUE_FAILURE_REASON: ${{ steps.release_health_metadata.outputs.queue_failure_reason }}
          MERGE_SHA: ${{ steps.release_health_metadata.outputs.merge_sha }}
          RELEASE_COMMIT_COMMITTED_AT: ${{ steps.release_health_metadata.outputs.committed_at }}
          RELEASE_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'emergency-recovery' || needs.resolve-release.outputs.exposure_posture_changed == 'true' && 'exposure-posture-change' || 'ordinary-deploy' }}
          EXPOSURE_POSTURE_CATEGORIES: ${{ needs.resolve-release.outputs.exposure_posture_categories }}
          DEPLOYMENT_REQUIRED: ${{ needs.resolve-release.outputs.deployment_required }}
          STAGING_RESULT: ${{ needs.deploy-staging.result }}
          STAGING_STARTED_AT: ${{ needs.deploy-staging.outputs.started_at }}
          STAGING_COMPLETED_AT: ${{ needs.deploy-staging.outputs.completed_at }}
          CANARY_RESULT: ${{ env.SHOULD_DEPLOY == 'false' && 'skipped' || steps.stage1_canary.outcome || 'skipped' }}
          CANARY_STARTED_AT: ${{ steps.stage1_canary.outputs.started_at }}
          CANARY_COMPLETED_AT: ${{ steps.stage1_canary.outputs.completed_at }}
          CANARY_SKIPPED_REASON: ${{ env.SHOULD_DEPLOY == 'false' && 'production-superseded-by-newer-main' || steps.stage1_canary.outcome == 'skipped' && 'stage-1-canary-not-run' || '' }}
          CANARY_COHORT_SUBJECT_TYPE: operator
          CANARY_COHORT_SIZE: "0"
          CANARY_PROMOTION_DECISION: ${{ env.SHOULD_DEPLOY == 'false' && 'skipped' || steps.stage1_canary.outcome == 'success' && 'promote' || steps.stage1_canary.outcome == 'failure' && 'abort' || 'skipped' }}
          PRODUCTION_READINESS_GATE_OUTCOME: ${{ steps.readiness_gate.outputs.outcome || 'not-run' }}
          PRODUCTION_RESULT: ${{ env.SHOULD_DEPLOY == 'false' && 'skipped' || job.status }}
          PRODUCTION_STARTED_AT: ${{ steps.production_started.outputs.started_at }}
          PRODUCTION_COMPLETED_AT: ${{ steps.release_health_metadata.outputs.completed_at }}
          RELEASE_ATTEMPT_RESULT: ${{ env.SHOULD_DEPLOY == 'false' && 'skipped' || job.status }}
          RELEASE_ATTEMPT_PHASE: production
          RELEASE_ATTEMPT_REASON: ${{ env.SHOULD_DEPLOY == 'false' && 'production-superseded-by-newer-main' || steps.production_marker.outputs.marker_mismatch == 'true' && 'production-marker-mismatch' || 'production-release' }}
          RELEASE_ATTEMPT_SUPERSEDED_BY_COMMIT: ${{ env.SHOULD_DEPLOY == 'false' && steps.latest_main.outputs.latest_main || '' }}
          RELEASE_ATTEMPT_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CI_RETRY_COUNT: ${{ steps.ci_metadata.outputs.ci_retry_count }}
          CI_FLAKY_FAILURE_COUNT: ${{ steps.ci_metadata.outputs.ci_flaky_failure_count }}
          CI_TOP_FLAKY_JOBS: ${{ steps.ci_metadata.outputs.ci_top_flaky_jobs }}
          MAIN_TO_PRODUCTION_DRIFT_COMMITS: ${{ steps.release_health_metadata.outputs.drift_commits }}
          MAIN_TO_PRODUCTION_DRIFT_SECONDS: ${{ steps.release_health_metadata.outputs.drift_seconds }}
          EMERGENCY_RELEASE_REFERENCE: ${{ steps.release_lock.outputs.emergency_reference }}
          RECOVERY_MODE: ${{ steps.production_rollback.outputs.result == 'success' && 'rollback' || github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'fix-forward' || 'none' }}
          RECOVERY_REFERENCE: ${{ steps.production_rollback.outputs.rollback_reference || steps.release_lock.outputs.emergency_reference }}
          RECOVERY_TARGET_COMMIT: ${{ steps.production_rollback.outputs.rollback_target_commit || '' }}
          PRODUCTION_RECOVERY_MODE: ${{ needs.resolve-release.outputs.production_recovery_mode }}
          PRODUCTION_RECOVERY_REASON: ${{ needs.resolve-release.outputs.production_recovery_reason }}
          ROLLBACK_READINESS_RESULT: ${{ env.SHOULD_DEPLOY == 'false' && 'skipped' || steps.rollback_readiness.outputs.result || 'failure' }}
          PRODUCTION_RESTORE_POINT_RESULT: ${{ steps.production_restore_point.outputs.restore_point_result || 'unknown' }}
          PRODUCTION_RESTORE_POINT_TYPE: ${{ steps.production_restore_point.outputs.restore_point_type || '' }}
          PRODUCTION_RESTORE_POINT_CLUSTER_ID: ${{ steps.production_restore_point.outputs.restore_point_cluster_id || '' }}
          PRODUCTION_RESTORE_POINT_NAME: ${{ steps.production_restore_point.outputs.restore_point_name || '' }}
          PRODUCTION_RESTORE_POINT_STATUS: ${{ steps.production_restore_point.outputs.restore_point_status || '' }}
          PRODUCTION_RESTORE_POINT_CREATED_AT: ${{ steps.production_restore_point.outputs.restore_point_created_at || '' }}
          PRODUCTION_RESTORE_POINT_BYPASSED: ${{ steps.production_restore_point.outputs.restore_point_bypassed || 'false' }}
          PRODUCTION_RESTORE_POINT_REMEDIATION: ${{ steps.production_restore_point.outputs.restore_point_remediation || '' }}
          PRODUCTION_RESTORE_POINT_PRE_MIGRATE_STATE_KEY: ${{ steps.production_restore_point.outputs.restore_point_pre_migrate_state_key || '' }}
          PRODUCTION_RESTORE_POINT_PRE_MIGRATE_STATE_FINGERPRINT: ${{ steps.production_restore_point.outputs.restore_point_pre_migrate_state_fingerprint || '' }}
          PRODUCTION_RESTORE_POINT_REUSED: ${{ steps.production_restore_point.outputs.restore_point_reused || 'false' }}
          PRODUCTION_RESTORE_POINT_REUSED_CLUSTER_ID: ${{ steps.production_restore_point.outputs.restore_point_reused_cluster_id || '' }}
        run: node ./scripts/release-health.mjs

      - name: Upload release health summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-health
          path: |
            artifacts/release-health/production-release.json
            artifacts/release-health/production-db-restore-point.json
            artifacts/release-health/production-readiness-gate.json
            artifacts/release-health/production-rollback.json
            artifacts/release-health/production-rollback-target.json
            artifacts/release-health/production-rollback-readiness.json
          if-no-files-found: ignore
          retention-days: 30

  notify-production-deploy-incident:
    name: Notify Production Deploy Incident
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - resolve-release
      - build-image
      - deploy-staging
      - deploy-production
      - record-staging-release-health
    if: >
      always() &&
      (
        contains(fromJSON('["failure", "cancelled"]'), needs.resolve-release.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.build-image.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.deploy-staging.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.deploy-production.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.record-staging-release-health.result)
      )
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update incident issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit || github.sha }}
          BUILD_IMAGE_RESULT: ${{ needs.build-image.result }}
          DEPLOY_STAGING_RESULT: ${{ needs.deploy-staging.result }}
          DEPLOY_PRODUCTION_RESULT: ${{ needs.deploy-production.result }}
          RECORD_STAGING_HEALTH_RESULT: ${{ needs.record-staging-release-health.result }}
          RESOLVE_RELEASE_RESULT: ${{ needs.resolve-release.result }}
        run: |
          set -euo pipefail

          release_commit="${RELEASE_COMMIT:-${GITHUB_SHA}}"
          release_short="${release_commit:0:12}"
          title="Incident: Platform Deploy failed for ${release_short}"

          body="$(cat <<EOF
          Automated production deploy incident signal.

          - Kind: production-deploy-failure
          - Workflow run: ${RUN_URL}
          - Release commit: ${release_commit}
          - Resolve Release: ${RESOLVE_RELEASE_RESULT}
          - Build Release Image: ${BUILD_IMAGE_RESULT}
          - Deploy Staging: ${DEPLOY_STAGING_RESULT}
          - Deploy Production: ${DEPLOY_PRODUCTION_RESULT}
          - Record Staging Release Health: ${RECORD_STAGING_HEALTH_RESULT}

          Next steps:
          1. Inspect the failed job logs and uploaded release-health artifacts.
          2. If the failure is at Create production database restore point or mentions DigitalOcean database quota/limit errors, run the Platform Production Restore Point Cleanup workflow or \`node ./scripts/production-db-restore-point-cleanup.mjs --min-age-hours 6 --out artifacts/release-health/production-db-restore-point-cleanup.json\` first; apply cleanup only after reviewing candidates and passing \`--hold-name\` for any restore-point fork still referenced by an in-flight run.
          3. Link the fix-forward PR, rollback-readiness evidence, cleanup artifact, or emergency release reference here.
          4. Close this issue only after the replacement deploy or accepted no-op signal is documented.
          EOF
          )"

          existing_issue="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "\"${title}\" in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "${existing_issue}" ]; then
            gh issue comment "${existing_issue}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            echo "Updated incident issue #${existing_issue}."
          else
            issue_create_args=(
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body "${body}" \
              --label "kind:ops" \
              --label "area:infrastructure"
            )

            incident_milestone_title="Incidents"
            incident_milestone_number="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/milestones?state=open&per_page=100" \
                --jq '.[] | select(.title == "Incidents") | .number'
            )"

            if [ -n "${incident_milestone_number}" ]; then
              issue_create_args+=(--milestone "${incident_milestone_title}")
            else
              echo "Open incident milestone '${incident_milestone_title}' was not found; creating issue without a milestone."
            fi

            gh issue create "${issue_create_args[@]}"
          fi

  close-resolved-deploy-incidents:
    name: Close Resolved Production Deploy Incidents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - resolve-release
      - deploy-production
    if: >
      always() &&
      needs.deploy-production.result == 'success' &&
      needs.deploy-production.outputs.superseded != 'true'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close resolved deploy incidents
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit || github.sha }}
        run: |
          set -euo pipefail

          release_commit="${RELEASE_COMMIT:-${GITHUB_SHA}}"
          close_comment="$(cat <<EOF
          Automated production deploy incident resolution.

          - Resolving workflow run: ${RUN_URL}
          - Resolving release commit: ${release_commit}

          This successful production deploy documents the replacement deploy requested in the incident next steps.
          EOF
          )"

          open_incidents="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "\"Incident: Platform Deploy\" in:title" \
              --limit 200 \
              --json number,title \
              --jq '.[] | select(.title | startswith("Incident: Platform Deploy failed for ") or startswith("Incident: Platform Deploy superseded before production for ")) | [.number, .title] | @tsv'
          )"

          if [ -z "${open_incidents}" ]; then
            echo "No open production deploy incidents to close."
            exit 0
          fi

          while IFS=$'\t' read -r issue_number issue_title; do
            if [ -z "${issue_number}" ]; then
              continue
            fi

            gh issue close "${issue_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "${close_comment}"
            echo "Closed resolved deploy incident #${issue_number}: ${issue_title}"
          done <<< "${open_incidents}"
