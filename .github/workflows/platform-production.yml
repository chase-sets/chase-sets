name: Platform Deploy

on:
  workflow_run:
    workflows:
      - Platform PR
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_ref:
        description: Ref to deploy. Defaults to main.
        required: false
        default: main
        type: string
      force_deploy:
        description: Force deployment even when release diff has no deploy-scoped files.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  resolve-release:
    name: Resolve Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      release_commit: ${{ steps.release.outputs.release_commit }}
      deployment_required: ${{ steps.deployment_scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            release_commit="${{ github.event.workflow_run.head_sha }}"
          else
            release_ref="${{ inputs.release_ref }}"
            git fetch origin "${release_ref}" || true
            if git rev-parse --verify --quiet "${release_ref}^{commit}" >/dev/null; then
              release_commit="$(git rev-parse "${release_ref}^{commit}")"
            elif git rev-parse --verify --quiet "origin/${release_ref}^{commit}" >/dev/null; then
              release_commit="$(git rev-parse "origin/${release_ref}^{commit}")"
            else
              echo "Release ref '${release_ref}' does not resolve to a commit." >&2
              exit 1
            fi
          fi

          git merge-base --is-ancestor "$release_commit" origin/main
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Validate release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_check="PR Required"
          release_commit="${{ steps.release.outputs.release_commit }}"
          deadline=$((SECONDS + 1800))

          while true; do
            completed_checks="$(gh api --paginate "repos/${{ github.repository }}/commits/${release_commit}/check-runs?per_page=100" \
              --jq ".check_runs[] | select(.name == \"${required_check}\" and .status == \"completed\") | [.conclusion, .html_url] | @tsv")"
            successful_check_url="$(printf '%s\n' "$completed_checks" | awk -F '\t' '$1 == "success" { print $2; exit }')"

            if [ -n "$successful_check_url" ]; then
              echo "Validated ${required_check}: ${successful_check_url}"
              break
            fi

            failed_check_url="$(printf '%s\n' "$completed_checks" | awk -F '\t' '$1 != "success" { print $2; exit }')"
            if [ -n "$failed_check_url" ]; then
              echo "Release commit ${release_commit} has a completed non-success '${required_check}' check: ${failed_check_url}" >&2
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for '${required_check}' on ${release_commit}." >&2
              exit 1
            fi

            echo "Waiting for '${required_check}' on ${release_commit}..."
            sleep 30
          done

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Resolve deployment scope
        id: deployment_scope
        run: |
          set -euo pipefail
          release_commit="${{ steps.release.outputs.release_commit }}"
          git fetch origin production || true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_deploy }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual force deployment requested for ${release_commit}."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && git show-ref --verify --quiet refs/remotes/origin/production; then
            base_commit="$(git rev-parse origin/production)"
          else
            base_commit="$(git rev-parse "${release_commit}^" 2>/dev/null || true)"
          fi

          if [ -z "$base_commit" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "No base commit was available for ${release_commit}; deployment is required."
            exit 0
          fi

          node ./scripts/change-scope.mjs github-output --base="${base_commit}" --head="${release_commit}"

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: resolve-release
    if: needs.resolve-release.outputs.deployment_required == 'true'
    environment: staging
    outputs:
      deployed: ${{ steps.staging_deployed.outputs.deployed }}
    concurrency:
      group: platform-deploy-staging
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: staging
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: ${{ needs.resolve-release.outputs.release_commit }}
      TF_VAR_stripe_connect_return_url: https://marketplace.staging.chasesets.com/account/payouts
      TF_VAR_stripe_connect_refresh_url: https://marketplace.staging.chasesets.com/account/payouts/setup
      TF_VAR_alert_emails: ${{ vars.PLATFORM_ALERT_EMAILS || '[]' }}
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
      APP_PLATFORM_DEPLOYMENT_TIMEOUT_SECONDS: "5400"
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out release commit
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          git checkout --detach "$release_commit"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$release_commit" ]; then
            echo "Checked out ${checked_out_commit}, expected release commit ${release_commit}." >&2
            exit 1
          fi

      - name: Confirm automatic deploy is latest main
        id: latest_main
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          git fetch origin main
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          latest_main="$(git rev-parse origin/main)"
          if [ "$release_commit" != "$latest_main" ]; then
            echo "Release commit ${release_commit} is no longer origin/main (${latest_main}); skipping stale staging deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Validate staging configuration
        if: steps.latest_main.outputs.should_deploy != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url \
            TF_VAR_stripe_secret_key \
            TF_VAR_stripe_publishable_key \
            TF_VAR_stripe_webhook_secret \
            TF_VAR_easypost_api_key
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required staging configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ "${TF_VAR_notification_email_provider:-}" = "amazon-ses" ]; then
            ses_missing=()
            for name in \
              TF_VAR_ses_aws_region \
              TF_VAR_ses_aws_access_key_id \
              TF_VAR_ses_aws_secret_access_key \
              TF_VAR_ses_from_email \
              TF_VAR_ses_configuration_set_name \
              TF_VAR_ses_source_arn
            do
              if [ -z "${!name:-}" ]; then
                ses_missing+=("$name")
              fi
            done

            if [ "${#ses_missing[@]}" -gt 0 ]; then
              printf 'Missing required staging SES configuration: %s\n' "${ses_missing[*]}" >&2
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-pnpm-workspace
        if: steps.latest_main.outputs.should_deploy != 'false'

      - name: Install dependencies
        if: steps.latest_main.outputs.should_deploy != 'false'
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@v4
        if: steps.latest_main.outputs.should_deploy != 'false'
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@v2.5.2
        if: steps.latest_main.outputs.should_deploy != 'false'
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Terraform init staging environment DNS
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=environment-dns/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format staging environment DNS
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        run: terraform fmt -check -recursive

      - name: Terraform validate staging environment DNS
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        run: terraform validate

      - name: Terraform apply staging environment DNS
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_google_workspace_dkim_txt_value: ${{ vars.GOOGLE_WORKSPACE_DKIM_TXT_VALUE || '' }}
        run: terraform apply -auto-approve

      - uses: docker/setup-buildx-action@v4
        if: steps.latest_main.outputs.should_deploy != 'false'

      - name: Build and push App Platform image
        if: steps.latest_main.outputs.should_deploy != 'false'
        id: image
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            doctl registry create "$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK" --region nyc3
            registry_name="$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK"
          fi

          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${TF_VAR_platform_image_tag}"
          docker buildx build \
            --pull \
            --cache-from type=gha,scope=platform-image \
            --cache-to type=gha,scope=platform-image,mode=min \
            --push \
            --tag "$image" \
            .

          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${image}@${digest}"

      - name: Terraform init
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Reconcile staging App Platform alias DNS state
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
          TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: |
          set -euo pipefail
          zone="staging.chasesets.com"
          app_id="$(terraform output -raw app_id 2>/dev/null || true)"
          if [ -z "$app_id" ]; then
            echo "No existing App Platform app was found in Terraform state; skipping alias DNS state reconciliation."
            exit 0
          fi

          target="$(doctl apps get "$app_id" --format DefaultIngress --no-header | sed -e 's#^https://##' -e 's#/$##' || true)"
          if [ -z "$target" ]; then
            echo "No App Platform default ingress was found for ${app_id}; skipping alias DNS state reconciliation."
            exit 0
          fi

          records_json="$(doctl compute domain records list "$zone" --output json)"
          for name in admin marketplace www; do
            address="digitalocean_record.staging_app_alias[\"${name}\"]"
            if terraform state show "$address" >/dev/null 2>&1; then
              continue
            fi

            record_id="$(printf '%s' "$records_json" | jq -r --arg name "$name" --arg target "$target" 'first(.[] | select(.type == "CNAME" and .name == $name and (.data | rtrimstr(".")) == $target) | .id) // empty')"
            if [ -z "$record_id" ]; then
              echo "No live CNAME found for ${name}.${zone}; Terraform will create it."
              continue
            fi

            terraform import "$address" "${zone},${record_id}"
          done

      - name: Terraform plan
        if: steps.latest_main.outputs.should_deploy != 'false'
        id: terraform_plan
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
          TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: |
          set -euo pipefail
          terraform plan -out=tfplan
          app_changed="$(node ../../../scripts/digitalocean-app-deployment.mjs plan-app-changed tfplan)"
          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"

      - name: Wait for previous App Platform deployment
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail

          app_id="$(terraform output -raw app_id 2>/dev/null || true)"
          if [ -z "$app_id" ]; then
            echo "No existing App Platform app was found in Terraform state; skipping deployment wait."
            exit 0
          fi

          node ../../../scripts/digitalocean-app-deployment.mjs wait "$app_id" --timeout-seconds="${APP_PLATFORM_DEPLOYMENT_TIMEOUT_SECONDS}" --poll-seconds=30

      - name: Terraform apply
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
          TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: terraform apply -auto-approve tfplan

      - name: Wait for Terraform App Platform deployment
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          node ../../../scripts/digitalocean-app-deployment.mjs wait "$app_id" --timeout-seconds="${APP_PLATFORM_DEPLOYMENT_TIMEOUT_SECONDS}" --poll-seconds=30

      - name: Reset stale staging root domain attachment
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          node ../../../scripts/digitalocean-app-deployment.mjs reset-domain "$app_id" staging.chasesets.com

      - name: Deploy App Platform image
        if: steps.latest_main.outputs.should_deploy != 'false' && steps.terraform_plan.outputs.app_changed != 'true'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          node ../../../scripts/digitalocean-app-deployment.mjs deploy "$app_id" --force-rebuild

      - name: Wait for staging domains
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          mapfile -t legacy_public_redirect_domains < <(terraform output -json legacy_public_redirect_domains | jq -r '.[]')
          mapfile -t marketplace_domains < <(terraform output -json marketplace_domains | jq -r '.[]')
          mapfile -t staging_root_marketplace_domains < <(terraform output -json staging_root_marketplace_domains | jq -r '.[]')
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ "${#marketplace_domains[@]}" -eq 0 ] || [ "${#staging_root_marketplace_domains[@]}" -eq 0 ]; then
            echo "Required staging domains were not present in Terraform outputs." >&2
            exit 1
          fi

          node ../../../scripts/digitalocean-app-deployment.mjs wait-domains \
            "$app_id" \
            "$landing_domain" \
            "$admin_domain" \
            "${legacy_public_redirect_domains[@]}" \
            "${marketplace_domains[@]}" \
            "${staging_root_marketplace_domains[@]}" \
            --timeout-seconds=1800 \
            --poll-seconds=30

      - name: Smoke check
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_MARKETPLACE: "true"
          SMOKE_REQUIRE_MARKETPLACE_ROOT: "true"
          SMOKE_REQUIRE_LEGACY_REDIRECT: "true"
          SMOKE_WRITE_WAITLIST: "false"
          SMOKE_SOURCE: staging-smoke
          SMOKE_UTM_CAMPAIGN: staging-main
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
        run: |
          set -euo pipefail
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          catalog_asset_public_base_url="$(terraform output -raw catalog_asset_public_base_url)"
          legacy_public_redirect_domain="$(terraform output -json legacy_public_redirect_domains | jq -r '.[0] // empty')"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          staging_root_marketplace_domain="$(terraform output -json staging_root_marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ -z "$catalog_asset_public_base_url" ] || [ -z "$legacy_public_redirect_domain" ] || [ -z "$marketplace_domain" ] || [ -z "$staging_root_marketplace_domain" ]; then
            echo "Required staging smoke domains were not present in Terraform outputs." >&2
            exit 1
          fi

          if [ -n "$TF_VAR_google_social_login_client_id" ] &&
            [ -n "$TF_VAR_google_social_login_client_secret" ] &&
            [ -n "$TF_VAR_facebook_social_login_client_id" ] &&
            [ -n "$TF_VAR_facebook_social_login_client_secret" ]; then
            export SMOKE_REQUIRE_SOCIAL_LOGIN=true
          else
            export SMOKE_REQUIRE_SOCIAL_LOGIN=false
          fi

          cd ../../..
          export MARKETPLACE_ROOT_WEB_URL="https://${staging_root_marketplace_domain}"
          pnpm run smoke:platform -- \
            "https://${landing_domain}" \
            "https://${admin_domain}" \
            "https://${marketplace_domain}" \
            "https://${legacy_public_redirect_domain}"
          curl --fail --silent --show-error --head --retry 12 --retry-delay 10 --retry-all-errors \
            "${catalog_asset_public_base_url}/" >/dev/null

      - name: Install Playwright Chromium for staging critical flows
        if: steps.latest_main.outputs.should_deploy != 'false'
        run: pnpm exec playwright install --with-deps chromium

      - name: Staging marketplace critical flows
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          CI: "true"
          PLAYWRIGHT_SKIP_WEB_SERVER: "true"
          MARKETPLACE_E2E_EMAIL: ${{ vars.MARKETPLACE_E2E_EMAIL || 'demo@chasesets.test' }}
          MARKETPLACE_E2E_PASSWORD: ${{ secrets.MARKETPLACE_E2E_PASSWORD || 'demo1234' }}
          MARKETPLACE_E2E_SEARCH_QUERY: ${{ vars.MARKETPLACE_E2E_SEARCH_QUERY || 'charizard' }}
        run: |
          set -euo pipefail
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$marketplace_domain" ]; then
            echo "Required staging marketplace domain was not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          MARKETPLACE_WEB_URL="https://${marketplace_domain}" pnpm run test:e2e:deployed

      - name: Upload staging Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-critical-flow-artifacts
          path: |
            artifacts/playwright/report
            artifacts/playwright/test-results

      - name: Staging Stripe money smoke
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          SMOKE_REGISTER_SELLER: "true"
          SMOKE_SELLER_EMAIL: stripe-staging+${{ github.run_id }}-${{ github.run_attempt }}@chasesets.test
          SMOKE_SELLER_PASSWORD: staging-stripe-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_SELLER_DISPLAY_NAME: Stripe Staging Smoke Account
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_RETURN_URL: https://marketplace.staging.chasesets.com/account/payouts
          STRIPE_CONNECT_REFRESH_URL: https://marketplace.staging.chasesets.com/account/payouts/setup
          SMOKE_ORDER_IDS: ${{ vars.STAGING_SMOKE_ORDER_IDS || '' }}
          SMOKE_BALANCE_CREDIT_AMOUNT: ${{ vars.STAGING_SMOKE_BALANCE_CREDIT_AMOUNT || '' }}
          SMOKE_PAYMENT_METHOD_CATEGORY: ${{ vars.STAGING_SMOKE_PAYMENT_METHOD_CATEGORY || '' }}
          SMOKE_CREATE_PAYMENT: ${{ vars.STAGING_SMOKE_CREATE_PAYMENT || '' }}
          SMOKE_PAYOUT_AMOUNT: ${{ vars.STAGING_SMOKE_PAYOUT_AMOUNT || '' }}
          SMOKE_REQUEST_PAYOUT: ${{ vars.STAGING_SMOKE_REQUEST_PAYOUT || '' }}
        run: |
          set -euo pipefail
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$marketplace_domain" ]; then
            echo "Required staging marketplace domain was not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          PLATFORM_API_BASE_URL="https://${marketplace_domain}" \
            PLATFORM_AUTH_BASE_URL="https://${marketplace_domain}" \
            pnpm run stripe:money-smoke -- --edge-check --seller-flow

      - name: Mark staging deployed
        id: staging_deployed
        if: steps.latest_main.outputs.should_deploy != 'false'
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - resolve-release
      - deploy-staging
    if: needs.deploy-staging.outputs.deployed == 'true'
    environment: production
    concurrency:
      group: platform-deploy-production
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: production
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: ${{ needs.resolve-release.outputs.release_commit }}
      TF_VAR_alert_emails: ${{ vars.PLATFORM_ALERT_EMAILS || '[]' }}
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
      APP_PLATFORM_DEPLOYMENT_TIMEOUT_SECONDS: "5400"
      DESTRUCTIVE_CHANGE_ALLOW_FILE: .github/deployment/production-destructive-change-approved.md
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out release commit
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          git checkout --detach "$release_commit"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$release_commit" ]; then
            echo "Checked out ${checked_out_commit}, expected release commit ${release_commit}." >&2
            exit 1
          fi

      - name: Confirm automatic deploy is latest main
        id: latest_main
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          git fetch origin main
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          latest_main="$(git rev-parse origin/main)"
          if [ "$release_commit" != "$latest_main" ]; then
            echo "Release commit ${release_commit} is no longer origin/main (${latest_main}); skipping stale production deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Validate production configuration
        if: steps.latest_main.outputs.should_deploy != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ "${TF_VAR_notification_email_provider:-}" = "amazon-ses" ]; then
            ses_missing=()
            for name in \
              TF_VAR_ses_aws_region \
              TF_VAR_ses_aws_access_key_id \
              TF_VAR_ses_aws_secret_access_key \
              TF_VAR_ses_from_email \
              TF_VAR_ses_configuration_set_name \
              TF_VAR_ses_source_arn
            do
              if [ -z "${!name:-}" ]; then
                ses_missing+=("$name")
              fi
            done

            if [ "${#ses_missing[@]}" -gt 0 ]; then
              printf 'Missing required production SES configuration: %s\n' "${ses_missing[*]}" >&2
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-pnpm-workspace
        if: steps.latest_main.outputs.should_deploy != 'false'

      - name: Install dependencies
        if: steps.latest_main.outputs.should_deploy != 'false'
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@v4
        if: steps.latest_main.outputs.should_deploy != 'false'
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@v2.5.2
        if: steps.latest_main.outputs.should_deploy != 'false'
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: steps.latest_main.outputs.should_deploy != 'false'

      - name: Verify promoted App Platform image
        if: steps.latest_main.outputs.should_deploy != 'false'
        id: image
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry does not exist. Run staging for this commit before production promotion." >&2
            exit 1
          fi

          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${TF_VAR_platform_image_tag}"
          if ! docker buildx imagetools inspect "$image" >/tmp/promoted-image.txt; then
            echo "Promoted image ${image} was not found. Run a successful staging deployment for ${TF_VAR_platform_image_tag} first." >&2
            exit 1
          fi

          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Promoting ${image}@${digest}"

      - name: Terraform init
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/production.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Terraform plan
        if: steps.latest_main.outputs.should_deploy != 'false'
        id: terraform_plan
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: |
          set -euo pipefail
          terraform plan -out=tfplan
          node ../../../scripts/digitalocean-app-deployment.mjs assert-no-destructive-changes tfplan --allow-file="../../../${DESTRUCTIVE_CHANGE_ALLOW_FILE}"
          app_changed="$(node ../../../scripts/digitalocean-app-deployment.mjs plan-app-changed tfplan)"
          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"

      - name: Wait for previous App Platform deployment
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail

          app_id="$(terraform output -raw app_id 2>/dev/null || true)"
          if [ -z "$app_id" ]; then
            echo "No existing App Platform app was found in Terraform state; skipping deployment wait."
            exit 0
          fi

          node ../../../scripts/digitalocean-app-deployment.mjs wait "$app_id" --timeout-seconds="${APP_PLATFORM_DEPLOYMENT_TIMEOUT_SECONDS}" --poll-seconds=30

      - name: Terraform apply
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: terraform apply -auto-approve tfplan

      - name: Wait for Terraform App Platform deployment
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          node ../../../scripts/digitalocean-app-deployment.mjs wait "$app_id" --timeout-seconds="${APP_PLATFORM_DEPLOYMENT_TIMEOUT_SECONDS}" --poll-seconds=30

      - name: Deploy App Platform image
        if: steps.latest_main.outputs.should_deploy != 'false' && steps.terraform_plan.outputs.app_changed != 'true'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          node ../../../scripts/digitalocean-app-deployment.mjs deploy "$app_id" --force-rebuild

      - name: Wait for production domains
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          mapfile -t public_domains < <(terraform output -json public_domains | jq -r '.[]')
          admin_domain="$(terraform output -raw admin_domain)"
          if [ "${#public_domains[@]}" -eq 0 ] || [ -z "$admin_domain" ]; then
            echo "Required production domains were not present in Terraform outputs." >&2
            exit 1
          fi

          node ../../../scripts/digitalocean-app-deployment.mjs wait-domains \
            "$app_id" \
            "${public_domains[@]}" \
            "$admin_domain" \
            --timeout-seconds=3600 \
            --poll-seconds=30

      - name: Smoke check
        if: steps.latest_main.outputs.should_deploy != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_EMAIL: ops+smoke@chasesets.com
          SMOKE_SOURCE: production-smoke
          SMOKE_UTM_CAMPAIGN: production-main
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
        run: |
          set -euo pipefail
          public_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          catalog_asset_public_base_url="$(terraform output -raw catalog_asset_public_base_url)"
          cd ../../..
          pnpm run smoke:platform -- "https://${public_domain}" "https://${admin_domain}"
          curl --fail --silent --show-error --head --retry 12 --retry-delay 10 --retry-all-errors \
            "${catalog_asset_public_base_url}/" >/dev/null

      - name: Mark production release
        if: steps.latest_main.outputs.should_deploy != 'false'
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          release_tag="release-$(date -u +%Y%m%d%H%M%S)-$(printf '%s' "$release_commit" | cut -c1-8)"
          promoted_image="${{ steps.image.outputs.image }}"
          release_image="${promoted_image%:*}:${release_tag}"

          docker buildx imagetools create --tag "$release_image" "$promoted_image"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin production || true
          git fetch origin --tags || true

          if ! git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            git tag -a "$release_tag" "$release_commit" -m "Production release ${release_tag}"
            git push origin "refs/tags/${release_tag}"
          fi

          if git show-ref --verify --quiet refs/remotes/origin/production; then
            git checkout -B production origin/production
            git merge --ff-only "$release_commit"
          else
            git checkout -B production "$release_commit"
          fi

          git push origin production
