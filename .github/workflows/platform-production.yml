      TF_VAR_easypost_webhook_secret: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.EASYPOST_WEBHOOK_SECRET || '' }}
      TF_VAR_easypost_mode: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && (vars.EASYPOST_MODE || 'production') || 'test' }}
      TF_VAR_tcgplayer_automation_tcg_auth_cookie: ${{ secrets.TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE || '' }}
      TF_VAR_scrydex_api_key: ${{ secrets.SCRYDEX_API_KEY || '' }}
      TF_VAR_scrydex_team_id: ${{ secrets.SCRYDEX_TEAM_ID || '' }}
      TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
      TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
      TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
      TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
      TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
      TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
      TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
      TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
      TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED == 'false' && 'false' || 'true' }}
      TF_VAR_observability_otlp_endpoint: ${{ vars.OBSERVABILITY_OTLP_ENDPOINT || '' }}
      TF_VAR_observability_otlp_headers: ${{ secrets.OBSERVABILITY_OTLP_HEADERS || '' }}
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
      CHASE_SETS_HELM_RELEASE: chase-sets-platform
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
      CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT: 15m
      ARGO_ROLLOUTS_ENABLED: ${{ vars.PRODUCTION_ARGO_ROLLOUTS_ENABLED == 'true' && 'true' || 'false' }}
      BETA_WAVE_SIZE: ${{ vars.BETA_WAVE_SIZE || '100' }}
      BETA_WAVE_ROLLOUT_EXPOSURE_PERCENT: ${{ vars.BETA_WAVE_ROLLOUT_EXPOSURE_PERCENT || '10' }}
      DESTRUCTIVE_CHANGE_ALLOW_FILE: .github/deployment/production-destructive-change-approved.md
      PRODUCTION_RELEASE_LOCKED: ${{ vars.PRODUCTION_RELEASE_LOCKED || 'false' }}
      PRODUCTION_RELEASE_LOCK_REASON: ${{ vars.PRODUCTION_RELEASE_LOCK_REASON || '' }}
      PRODUCTION_RELEASE_LOCK_REFERENCE: ${{ vars.PRODUCTION_RELEASE_LOCK_REFERENCE || '' }}
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check out release commit
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          git checkout --detach "$release_commit"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$release_commit" ]; then
            echo "Checked out ${checked_out_commit}, expected release commit ${release_commit}." >&2
            exit 1
          fi

      - name: Record production start
        id: production_started
        if: env.SHOULD_DEPLOY != 'false'
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Evaluate production release lock
        id: release_lock
        if: env.SHOULD_DEPLOY != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ENVIRONMENT: production
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          EMERGENCY_RELEASE_BYPASS: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'true' || 'false' }}
          EMERGENCY_RELEASE_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_reference || '' }}
        run: node ./scripts/release-lock.mjs

      - name: Validate production configuration
        if: env.SHOULD_DEPLOY != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          PRODUCTION_TAX_PROVIDER_BACKED_QUOTES_REQUIRED_RAW: ${{ vars.TAX_PROVIDER_BACKED_QUOTES_REQUIRED || '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required production configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ "${TF_VAR_observability_enabled:-true}" != "false" ] && [ -z "${TF_VAR_observability_otlp_headers:-}" ]; then
            echo "Production observability requires OBSERVABILITY_OTLP_HEADERS secret or OBSERVABILITY_ENABLED=false." >&2
            exit 1
          fi

          if [ -n "${TF_VAR_admin_google_workspace_hosted_domains:-}" ]; then
            google_sso_missing=()
            for name in \
              TF_VAR_google_social_login_client_id \
              TF_VAR_google_social_login_client_secret
            do
              if [ -z "${!name:-}" ]; then
                google_sso_missing+=("$name")
              fi
            done

            if [ "${#google_sso_missing[@]}" -gt 0 ]; then
              printf 'Missing required production Google Workspace SSO configuration: %s\n' "${google_sso_missing[*]}" >&2
              exit 1
            fi
          fi

          if [ "${TF_VAR_production_runtime_profile:-landing}" != "landing" ]; then
            marketplace_missing=()
            for name in \
              TF_VAR_stripe_secret_key \
              TF_VAR_stripe_publishable_key \
              TF_VAR_stripe_webhook_secret \
              TF_VAR_stripe_connect_webhook_secret \
              TF_VAR_easypost_api_key \
              TF_VAR_easypost_webhook_secret
            do
              if [ -z "${!name:-}" ]; then
                marketplace_missing+=("$name")
              fi
            done

            if [ "${#marketplace_missing[@]}" -gt 0 ]; then
              printf 'Missing required production marketplace platform configuration: %s\n' "${marketplace_missing[*]}" >&2
              exit 1
            fi

            if [[ "${TF_VAR_stripe_secret_key}" != sk_live* || "${TF_VAR_stripe_publishable_key}" != pk_live* ]]; then
              echo "Production proof/public platform deployment requires Stripe live-mode keys." >&2
              exit 1
            fi

            if [ "${TF_VAR_easypost_mode:-}" != "production" ]; then
              echo "Production proof/public platform deployment requires EASYPOST_MODE=production." >&2
              exit 1
            fi

            if [ -n "${TF_VAR_stripe_api_base_url:-}" ]; then
              echo "Production proof/public platform deployment requires STRIPE_API_BASE_URL to be unset." >&2
              exit 1
            fi

            if [ -n "${TF_VAR_easypost_api_base_url:-}" ]; then
              echo "Production proof/public platform deployment requires EASYPOST_API_BASE_URL to be unset." >&2
              exit 1
            fi
          fi

          if [ "${TF_VAR_production_marketplace_public_enabled:-false}" = "true" ]; then
            if [ "${TF_VAR_production_marketplace_promotion_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_marketplace_promotion_reference:-}" ]; then
              echo "Production marketplace promotion requires an approved marketplace promotion record." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_marketplace_checkout_fee_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_marketplace_checkout_fee_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Marketplace Checkout Fee evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_checkout_launch_evidence_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_checkout_launch_evidence_reference:-}" ]; then
              echo "Production marketplace promotion requires approved checkout launch evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_support_operations_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_support_operations_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Support readiness." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_stripe_money_operations_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_stripe_money_operations_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Stripe money operations evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_fulfillment_postage_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_fulfillment_postage_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Fulfillment postage evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_launch_supply_measurements_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_launch_supply_measurements_reference:-}" ]; then
              echo "Production marketplace promotion requires approved launch supply measurement evidence." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_tax_readiness_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_tax_readiness_reference:-}" ]; then
              echo "Production marketplace promotion requires approved Tax readiness evidence." >&2
              exit 1
            fi

            if [ "${PRODUCTION_TAX_PROVIDER_BACKED_QUOTES_REQUIRED_RAW:-}" != "true" ] && [ "${PRODUCTION_TAX_PROVIDER_BACKED_QUOTES_REQUIRED_RAW:-}" != "false" ]; then
              echo "Production marketplace promotion requires TAX_PROVIDER_BACKED_QUOTES_REQUIRED to be explicitly true or false." >&2
              exit 1
            fi

            if [ "${TF_VAR_notification_email_provider:-}" != "amazon-ses" ]; then
              echo "Production marketplace promotion requires NOTIFICATION_EMAIL_PROVIDER=amazon-ses." >&2
              exit 1
            fi

            if [ "${TF_VAR_production_transactional_email_approved:-false}" != "true" ] || [ -z "${TF_VAR_production_transactional_email_reference:-}" ]; then
              echo "Production marketplace promotion requires approved transactional email evidence." >&2
              exit 1
            fi
          fi

          if [ "${TF_VAR_notification_email_provider:-}" = "amazon-ses" ]; then
            ses_missing=()
            for name in \
              TF_VAR_ses_aws_region \
              TF_VAR_ses_aws_access_key_id \
              TF_VAR_ses_aws_secret_access_key \
              TF_VAR_ses_from_email \
              TF_VAR_ses_configuration_set_name \
              TF_VAR_ses_source_arn
            do
              if [ -z "${!name:-}" ]; then
                ses_missing+=("$name")
              fi
            done

            if [ "${#ses_missing[@]}" -gt 0 ]; then
              printf 'Missing required production SES configuration: %s\n' "${ses_missing[*]}" >&2
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-pnpm-workspace
        if: env.SHOULD_DEPLOY != 'false'

      - name: Install dependencies
        if: env.SHOULD_DEPLOY != 'false'
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.SHOULD_DEPLOY != 'false'
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Download staged doctl binary
        if: env.SHOULD_DEPLOY != 'false'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: staged-doctl-linux-amd64
          path: artifacts/deploy-tools/doctl

      - name: Install staged doctl binary
        if: env.SHOULD_DEPLOY != 'false'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          install -m 0755 artifacts/deploy-tools/doctl/doctl "$RUNNER_TEMP/doctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/doctl" version
          "$RUNNER_TEMP/doctl" auth init --access-token "$DIGITALOCEAN_ACCESS_TOKEN"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        if: env.SHOULD_DEPLOY != 'false'
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: env.SHOULD_DEPLOY != 'false' && steps.buildx.outcome == 'failure'

      - name: Verify promoted platform runtime image
        if: env.SHOULD_DEPLOY != 'false'
        id: image
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry does not exist. Run staging for this commit before production promotion." >&2
            exit 1
          fi

          doctl registry login --expiry-seconds 3600
          expected_digest="${TF_VAR_platform_image_digest}"
          if [ -z "$expected_digest" ]; then
            echo "Staging did not publish a verified platform runtime image digest; refusing production promotion." >&2
            exit 1
          fi

          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${TF_VAR_platform_image_tag}"
          if ! docker buildx imagetools inspect "$image" >/tmp/promoted-image.txt; then
            echo "Promoted image ${image} was not found. Run a successful staging deployment for ${TF_VAR_platform_image_tag} first." >&2
            exit 1
          fi

          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          if [ "$digest" != "$expected_digest" ]; then
            echo "Promoted image digest ${digest} did not match staging verified digest ${expected_digest}." >&2
            exit 1
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_platform_image_digest=${digest}" >> "$GITHUB_ENV"
          echo "Promoting ${image}@${digest}"

      - name: Initialize production environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=environment-dns/production.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Validate production environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Plan production environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform plan -out=production-environment-dns.tfplan
          terraform show -json production-environment-dns.tfplan > production-environment-dns.tfplan.json
          delete_count="$(
            jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' \
              production-environment-dns.tfplan.json
          )"
          if [ "$delete_count" -ne 0 ]; then
            echo "Production environment DNS plans must never delete or replace retained diagnostic resources." >&2
            exit 1
          fi
          node ../../../scripts/terraform-plan-inspection.mjs summarize-plan \
            production-environment-dns.tfplan.json \
            --title="Production environment DNS plan" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply production environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: terraform apply -auto-approve production-environment-dns.tfplan

      - name: Terraform init
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/production.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Terraform plan
        if: env.SHOULD_DEPLOY != 'false'
        id: terraform_plan
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/release-health"
          terraform plan -out=tfplan \
            2> >(tee "${GITHUB_WORKSPACE}/artifacts/release-health/production-terraform-diagnostics.txt" >&2)
          mkdir -p artifacts/terraform-plans
          terraform show -no-color tfplan > artifacts/terraform-plans/production-tfplan.txt
          terraform show -json tfplan > artifacts/terraform-plans/production-tfplan.json
          node ../../../scripts/terraform-plan-inspection.mjs summarize-plan artifacts/terraform-plans/production-tfplan.json --title="Production Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          echo "plan_written=true" >> "$GITHUB_OUTPUT"
          node ../../../scripts/terraform-plan-inspection.mjs assert-no-destructive-changes tfplan --allow-file="../../../${DESTRUCTIVE_CHANGE_ALLOW_FILE}"

      - name: Upload production Terraform plan
        if: always() && env.SHOULD_DEPLOY != 'false' && steps.terraform_plan.outputs.plan_written == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-terraform-plan
          path: infrastructure/digitalocean/platform/artifacts/terraform-plans/production-tfplan.txt
          if-no-files-found: error
          retention-days: 30

      - name: Clean up expired restore-point forks
        # The restore-point preflight fails closed on any fork older than the
        # 6-hour guard; busy deploy days outpace the scheduled cleanup cron, so
        # deploys sweep their own expired forks before creating a new one.
        if: env.SHOULD_DEPLOY != 'false'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          PRODUCTION_DB_RESTORE_POINT_CLEANUP_HOLD_NAMES: ${{ vars.PRODUCTION_DB_RESTORE_POINT_CLEANUP_HOLD_NAMES || '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health
          node ./scripts/production-db-restore-point-cleanup.mjs \
            --min-age-hours 6 \
            --out artifacts/release-health/pre-deploy-restore-point-cleanup.json \
            --apply

      - name: Create production database restore point
        if: env.SHOULD_DEPLOY != 'false'
        id: production_restore_point
        working-directory: infrastructure/digitalocean/platform
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          RELEASE_MODE: ${{ steps.release_lock.outputs.release_mode || 'normal' }}
          EMERGENCY_RELEASE_REFERENCE: ${{ steps.release_lock.outputs.emergency_reference || '' }}
          PRODUCTION_DB_RESTORE_POINT_BYPASS: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'true' || 'false' }}
          PRODUCTION_DB_RESTORE_POINT_SKIP: ${{ needs.resolve-release.outputs.production_restore_point_required == 'true' && 'false' || 'true' }}
          PRODUCTION_DB_RESTORE_POINT_SKIP_REASON: ${{ needs.resolve-release.outputs.production_recovery_mode == 'pitr' && needs.resolve-release.outputs.production_recovery_reason || '' }}
          PRODUCTION_DB_RESTORE_POINT_CLEANUP_HOLD_NAMES: ${{ vars.PRODUCTION_DB_RESTORE_POINT_CLEANUP_HOLD_NAMES || '' }}
          PRODUCTION_DB_RESTORE_POINT_PRE_MIGRATE_STATE_KEY: ${{ vars.PRODUCTION_DB_RESTORE_POINT_PRE_MIGRATE_STATE_KEY || '' }}
        run: |
          set -euo pipefail
          pre_migrate_state_key="${PRODUCTION_DB_RESTORE_POINT_PRE_MIGRATE_STATE_KEY:-}"
          if [ -z "$pre_migrate_state_key" ]; then
            git fetch origin production || true
            production_marker_commit="$(git rev-parse --verify origin/production 2>/dev/null || true)"
            if [ -n "$production_marker_commit" ]; then
              pre_migrate_state_key="production-marker:${production_marker_commit}"
              echo "Using production marker commit as restore-point pre-migrate state key."
            fi
          fi
          if [ -z "$pre_migrate_state_key" ] && [ "$PRODUCTION_DB_RESTORE_POINT_BYPASS" != "true" ] && [ "$PRODUCTION_DB_RESTORE_POINT_SKIP" != "true" ]; then
            echo "Production marker did not resolve; refusing to continue without a pre-migrate restore-point state key." >&2
            exit 1
          fi

          source_cluster_id="$(terraform output -raw postgres_cluster_id 2>/dev/null || true)"
          if [ -z "$source_cluster_id" ]; then
            database_cluster_address="$(
              terraform state list 2>/dev/null \
                | awk '/(^|\.)digitalocean_database_cluster\./ { print; exit }' \
                || true
            )"
            if [ -n "$database_cluster_address" ]; then
              echo "Using production database cluster Terraform state address ${database_cluster_address}."
              source_cluster_id="$(
                terraform state show -no-color "$database_cluster_address" 2>/dev/null \
                  | awk -F '=' '{ key = $1; gsub(/^[[:space:]]+|[[:space:]]+$/, "", key); if (key == "id") { value = $2; gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value); print value; exit } }' \
                  || true
              )"
            fi
          fi
          if [ -z "$source_cluster_id" ] && [ -f tfplan ]; then
            source_cluster_id="$(
              node ../../../scripts/terraform-plan-inspection.mjs postgres-cluster-id tfplan 2>/dev/null \
                || true
            )"
            if [ -n "$source_cluster_id" ]; then
              echo "Using production database cluster id from Terraform plan."
            fi
          fi
          if [ -z "$source_cluster_id" ] && [ "$PRODUCTION_DB_RESTORE_POINT_BYPASS" != "true" ] && [ "$PRODUCTION_DB_RESTORE_POINT_SKIP" != "true" ]; then
            echo "Production Terraform state did not expose postgres_cluster_id; refusing to continue without a pre-migrate restore point." >&2
            exit 1
          fi

          cd ../../..
          node ./scripts/production-db-restore-point.mjs \
            --source-cluster-id "$source_cluster_id" \
            --pre-migrate-state-key "$pre_migrate_state_key" \
            --out artifacts/release-health/production-db-restore-point.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Configure production Kubernetes context
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/production.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-production.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -z "$cluster_id" ] && [ -z "$cluster_name" ]; then
              cluster_address="$(
                terraform state list \
                  | awk '/(^|\.)digitalocean_kubernetes_cluster\./ { print; exit }'
              )"
              if [ -n "$cluster_address" ]; then
                echo "Using production DOKS cluster Terraform state address ${cluster_address}." >&2
                cluster_state="$(terraform state show -no-color "$cluster_address")"
                cluster_id="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "id") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
                cluster_name="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "name") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
              fi
            fi
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure production Kubernetes context." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Production Kubernetes kubeconfig is present but has no current context after Terraform and DigitalOcean refresh attempts." >&2
            KUBECONFIG="$kubeconfig" kubectl config get-contexts || true
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured production Kubernetes context: ${current_context}"

      - name: Install Argo Rollouts kubectl plugin for production
        if: env.SHOULD_DEPLOY != 'false' && env.ARGO_ROLLOUTS_ENABLED == 'true'
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/kubectl-argo-rollouts"
          curl --fail --location --silent --show-error \
            https://github.com/argoproj/argo-rollouts/releases/download/v1.9.0/kubectl-argo-rollouts-linux-amd64 \
            --output "$binary"
          echo "d1c98f59f6d3716b7a35aa540506764700a358448dd6a10e92381b7aa294d00b  ${binary}" | sha256sum --check
          chmod +x "$binary"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
          "$binary" version >/dev/null 2>&1 || "$binary" --help >/dev/null

      - name: Install production DOKS ingress and certificate add-ons
        if: env.SHOULD_DEPLOY != 'false'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          node ./scripts/doks-cluster-addons.mjs --environment production

          if [ "$ARGO_ROLLOUTS_ENABLED" = "true" ]; then
            keda_manifest="${RUNNER_TEMP}/keda-install.yaml"
            curl --fail --location --silent --show-error \
              https://github.com/kedacore/keda/releases/download/v2.17.2/keda-2.17.2.yaml \
              --output "$keda_manifest"
            echo "1912c29059e41e80b6abe8b29a566e07337f85fc4bf4fd5698c637fe63ecbf35  ${keda_manifest}" | sha256sum --check
            kubectl apply --server-side --force-conflicts -f "$keda_manifest"
            kubectl wait --for condition=Established --timeout=120s \
              crd/scaledobjects.keda.sh crd/scaledjobs.keda.sh crd/triggerauthentications.keda.sh
            kubectl -n keda rollout status deployment/keda-operator --timeout=300s
          fi

      - name: Capture production rollback target
        if: env.SHOULD_DEPLOY != 'false'
        id: rollback_target
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin production --tags
          last_known_good_commit="$(git rev-parse origin/production)"
          release_tag="$(
            git tag --points-at "$last_known_good_commit" --list 'release-*' \
              | sort \
              | tail -n 1
          )"
          if [ -z "$release_tag" ]; then
            echo "Production marker ${last_known_good_commit} has no release-* tag; rollback readiness will fail closed." >&2
          fi

          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry does not exist; refusing cutover without rollback image evidence." >&2
            exit 1
          fi

          mkdir -p artifacts/release-health
          target_path="artifacts/release-health/production-rollback-target.json"
          node ./scripts/platform-kubernetes-deployment.mjs capture-rollback-target \
            --registry-name="$registry_name" \
            --repository="$PLATFORM_IMAGE_REPOSITORY" \
            --last-known-good-commit="$last_known_good_commit" \
            --release-tag="$release_tag" \
            --namespace="$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release="$CHASE_SETS_HELM_RELEASE" \
            --out="$target_path" \
            --github-output="$GITHUB_OUTPUT"

          image_ref="$(jq -r '.imageRef // ""' "$target_path")"
          doctl registry login --expiry-seconds 3600
          if [ -n "$image_ref" ] && docker buildx imagetools inspect "$image_ref" >/dev/null 2>&1; then
            image_exists=true
          else
            image_exists=false
          fi

          smoke_verified=false
          if [ -n "$release_tag" ] && git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            if [ "$tag_commit" = "$last_known_good_commit" ]; then
              smoke_verified=true
            fi
          fi

          {
            echo "image_exists=${image_exists}"
            echo "smoke_verified=${smoke_verified}"
            echo "last_known_good_commit=${last_known_good_commit}"
            echo "rollback_release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate production rollback readiness
        if: env.SHOULD_DEPLOY != 'false'
        id: rollback_readiness
        env:
          ROLLBACK_READINESS_OUT: artifacts/release-health/production-rollback-readiness.json
          RECOVERY_MODE: rollback
          ROLLBACK_TARGET_COMMIT: ${{ steps.rollback_target.outputs.last_known_good_commit }}
          LAST_KNOWN_GOOD_COMMIT: ${{ steps.rollback_target.outputs.last_known_good_commit }}
          ROLLBACK_RELEASE_TAG: ${{ steps.rollback_target.outputs.rollback_release_tag }}
          ROLLBACK_IMAGE_REF: ${{ steps.rollback_target.outputs.rollback_image_ref }}
          ROLLBACK_IMAGE_EXISTS: ${{ steps.rollback_target.outputs.image_exists }}
          ROLLBACK_SMOKE_VERIFIED: ${{ steps.rollback_target.outputs.smoke_verified }}
          ROLLBACK_DESTRUCTIVE_PLAN_APPROVED: "false"
          EMERGENCY_RELEASE_REFERENCE: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          pnpm run rollback:readiness
          result="$(jq -r '.result // "failure"' artifacts/release-health/production-rollback-readiness.json)"
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      - name: Terraform apply
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/release-health"
          terraform apply -auto-approve tfplan \
            2> >(tee "${GITHUB_WORKSPACE}/artifacts/release-health/production-terraform-diagnostics.txt" >&2)

      - name: Capture production Terraform errored state
        if: failure() && env.SHOULD_DEPLOY != 'false'
        id: capture_production_terraform_errored_state
        working-directory: infrastructure/digitalocean/platform
        run: |
          set -euo pipefail

          state_path="errored.tfstate"
          artifact_path="artifacts/terraform-errored-state/production-errored.tfstate"
          if [ -f "$state_path" ]; then
            mkdir -p "$(dirname "$artifact_path")"
            cp "$state_path" "$artifact_path"
            echo "captured=true" >> "$GITHUB_OUTPUT"
            echo "### Production Terraform errored state" >> "$GITHUB_STEP_SUMMARY"
            echo "Captured sensitive recovery artifact \`sensitive-production-terraform-errored-state-recovery-only\` with 1-day retention. Do not print or share its contents." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "### Production Terraform errored state" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`errored.tfstate\` file was present after Terraform apply failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production Terraform errored state
        if: failure() && env.SHOULD_DEPLOY != 'false' && steps.capture_production_terraform_errored_state.outputs.captured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensitive-production-terraform-errored-state-recovery-only
          path: infrastructure/digitalocean/platform/artifacts/terraform-errored-state/production-errored.tfstate
          if-no-files-found: error
          retention-days: 1

      - name: Export production Kubernetes database URLs
        if: env.SHOULD_DEPLOY != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DEPLOYMENT_ENVIRONMENT: production
        run: |
          set -euo pipefail
          state_path="${RUNNER_TEMP}/platform-production.tfstate.json"
          terraform -chdir=infrastructure/digitalocean/platform state pull > "$state_path"
          node ./scripts/platform-kubernetes-secret.mjs \
            --export-database-urls "$state_path" \
            --database-environment production \
            --query-connection-mode direct

      - name: Apply production Kubernetes runtime secrets
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          export CATALOG_ASSET_S3_ACCESS_KEY_ID="${TF_VAR_spaces_access_id:-}"
          export CATALOG_ASSET_S3_SECRET_ACCESS_KEY="${TF_VAR_spaces_secret_key:-}"
          export CHASE_SETS_DISCORD_INVITE_URL="${TF_VAR_discord_invite_url:-}"
          export EASYPOST_API_KEY="${TF_VAR_easypost_api_key:-}"
          export VOYAGE_API_KEY="${TF_VAR_voyage_api_key:-}"
          export EASYPOST_WEBHOOK_SECRET="${TF_VAR_easypost_webhook_secret:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_facebook_social_login_client_id:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_facebook_social_login_client_secret:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_google_social_login_client_id:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_google_social_login_client_secret:-}"
          export OTEL_EXPORTER_OTLP_HEADERS="${TF_VAR_observability_otlp_headers:-}"
          export PLATFORM_ADMIN_EMAIL="${TF_VAR_platform_admin_email:-}"
          export PLATFORM_ADMIN_PASSWORD="${TF_VAR_platform_admin_password:-}"
          export PLATFORM_INTERNAL_AUTH_SECRET="${TF_VAR_platform_internal_auth_secret:-}"
          export SCRYDEX_API_KEY="${TF_VAR_scrydex_api_key:-}"
          export SCRYDEX_TEAM_ID="${TF_VAR_scrydex_team_id:-}"
          export SES_AWS_ACCESS_KEY_ID="${TF_VAR_ses_aws_access_key_id:-}"
          export SES_AWS_SECRET_ACCESS_KEY="${TF_VAR_ses_aws_secret_access_key:-}"
          export SES_SOURCE_ARN="${TF_VAR_ses_source_arn:-}"
          export STRIPE_CONNECT_WEBHOOK_SECRET="${TF_VAR_stripe_connect_webhook_secret:-}"
          export STRIPE_PUBLISHABLE_KEY="${TF_VAR_stripe_publishable_key:-}"
          export STRIPE_SECRET_KEY="${TF_VAR_stripe_secret_key:-}"
          export STRIPE_WEBHOOK_SECRET="${TF_VAR_stripe_webhook_secret:-}"
          export UCP_BUSINESS_SIGNING_KEY_ID="${TF_VAR_ucp_business_signing_key_id:-}"
          export UCP_BUSINESS_SIGNING_ALG="${TF_VAR_ucp_business_signing_alg:-ES256}"
          export UCP_BUSINESS_SIGNING_PRIVATE_JWK="${TF_VAR_ucp_business_signing_private_jwk:-}"
          export UCP_BUSINESS_SIGNING_PREVIOUS_PUBLIC_JWKS="${TF_VAR_ucp_business_signing_previous_public_jwks:-[]}"
          export UCP_AP2_VERIFIER_URL="${TF_VAR_ucp_ap2_verifier_url:-}"
          export UCP_AP2_VERIFIER_AUTH_TOKEN="${TF_VAR_ucp_ap2_verifier_auth_token:-}"
          export UCP_AP2_VERIFIER_TIMEOUT_MS="${TF_VAR_ucp_ap2_verifier_timeout_ms:-5000}"
          export TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE="${TF_VAR_tcgplayer_automation_tcg_auth_cookie:-}"

          node ./scripts/platform-kubernetes-secret.mjs \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --deployment-environment production \
            --observability-enabled "${TF_VAR_observability_enabled:-true}"

      - name: Apply production Kubernetes registry pull secret
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry is required before production Kubernetes deploys can pull images." >&2
            exit 1
          fi

          registry_pull_secret_name="registry-${registry_name}"
          docker_config="$(mktemp)"
          trap 'rm -f "$docker_config"' EXIT
          doctl registry docker-config --expiry-seconds 3600 > "$docker_config"
          kubectl create secret generic "$registry_pull_secret_name" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --from-file=.dockerconfigjson="$docker_config" \
            --type=kubernetes.io/dockerconfigjson \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          echo "CHASE_SETS_IMAGE_PULL_SECRET_NAME=${registry_pull_secret_name}" >> "$GITHUB_ENV"

      - name: Deploy production Kubernetes release
        if: env.SHOULD_DEPLOY != 'false'
        env:
          PLATFORM_IMAGE_REF: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          catalog_asset_public_base_url="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_public_base_url)"
          catalog_asset_s3_bucket="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_bucket)"
          catalog_asset_s3_endpoint="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_endpoint)"
          catalog_asset_s3_region="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_region)"
          if [ -z "$catalog_asset_public_base_url" ] || [ -z "$catalog_asset_s3_bucket" ] || [ -z "$catalog_asset_s3_endpoint" ] || [ -z "$catalog_asset_s3_region" ]; then
            echo "Production catalog asset runtime env outputs are required before Kubernetes deploy." >&2
            exit 1
          fi

          # Per-domain base URLs come from Terraform's environment-domain
          # outputs and are threaded into the DOKS runtime.
          landing_domain="$(terraform -chdir=infrastructure/digitalocean/platform output -raw landing_domain)"
          marketplace_domain="$(terraform -chdir=infrastructure/digitalocean/platform output -json marketplace_domains | jq -r 'first(.[]) // empty')"
          if [ -z "$landing_domain" ]; then
            echo "Production landing domain output is required before Kubernetes deploy." >&2
            exit 1
          fi

          # Optional provider endpoint/origin overrides are only passed when set:
          # the deploy script fails closed on empty --runtime-env values, and the
          # Helm chart env defaults carry the canonical posture when a repository
          # variable is unset (mirrors platform-pr.yml).
          # A landing-only production has no public marketplace domain, so
          # CHASE_SETS_MARKETPLACE_ORIGIN stays unset for landing-only production.
          optional_runtime_env=()
          add_optional_runtime_env() {
            if [ -n "$2" ]; then
              optional_runtime_env+=(--runtime-env "$1=$2")
            fi
          }
          add_optional_runtime_env "CHASE_SETS_MARKETPLACE_ORIGIN" "${marketplace_domain:+https://${marketplace_domain}}"
          add_optional_runtime_env "SES_AWS_REGION" "${TF_VAR_ses_aws_region:-}"
          add_optional_runtime_env "SES_FROM_EMAIL" "${TF_VAR_ses_from_email:-}"
          add_optional_runtime_env "SES_CONFIGURATION_SET_NAME" "${TF_VAR_ses_configuration_set_name:-}"
          add_optional_runtime_env "STRIPE_API_BASE_URL" "${TF_VAR_stripe_api_base_url:-}"
          add_optional_runtime_env "EASYPOST_API_BASE_URL" "${TF_VAR_easypost_api_base_url:-}"

          # Application pods send to the in-cluster Collector Service; the
          # in-cluster Collector Service; the deployment helper owns that
          # endpoint and the production Kubernetes resource identity.
          observability_exporter_endpoint="${TF_VAR_observability_otlp_endpoint:-https://otel.chasesets.com}"
          if [ "${TF_VAR_observability_enabled:-true}" != "false" ] && [ -z "$observability_exporter_endpoint" ]; then
            echo "Production observability requires a non-empty OTLP exporter endpoint." >&2
            exit 1
          fi

          pnpm run platform:kubernetes-deployment -- deploy \
            --image "$PLATFORM_IMAGE_REF" \
            --image-pull-secret "$CHASE_SETS_IMAGE_PULL_SECRET_NAME" \
            --observability-exporter-endpoint "$observability_exporter_endpoint" \
            --runtime-env "DEPLOYMENT_ENVIRONMENT=production" \
            --runtime-env "OBSERVABILITY_ENABLED=${TF_VAR_observability_enabled:-true}" \
            --runtime-env "CHASE_SETS_RUNTIME_PROFILE=${TF_VAR_production_runtime_profile:-landing}" \
            --runtime-env "PLATFORM_DATA_PROFILES=critical-bootstrap,catalog-integration-bootstrap" \
            --runtime-env "ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS=${TF_VAR_admin_google_workspace_hosted_domains:-}" \
            --runtime-env "CHASE_SETS_PUBLIC_ORIGIN=https://${landing_domain}" \
            --runtime-env "NOTIFICATION_EMAIL_PROVIDER=${TF_VAR_notification_email_provider:-noop}" \
            --runtime-env "STRIPE_CONNECT_ACCOUNTS_API=${TF_VAR_stripe_connect_accounts_api:-v2}" \
            --runtime-env "EASYPOST_MODE=${TF_VAR_easypost_mode:-test}" \
            --runtime-env "CATALOG_ASSET_PUBLIC_BASE_URL=${catalog_asset_public_base_url}" \
            --runtime-env "CATALOG_ASSET_S3_BUCKET=${catalog_asset_s3_bucket}" \
            --runtime-env "CATALOG_ASSET_S3_ENDPOINT=${catalog_asset_s3_endpoint}" \
            --runtime-env "CATALOG_ASSET_S3_REGION=${catalog_asset_s3_region}" \
            "${optional_runtime_env[@]}" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --rollouts-enabled "$ARGO_ROLLOUTS_ENABLED" \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT"

      - name: Capture production Kubernetes deploy diagnostics
        if: failure() && env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health
          pnpm run platform:kubernetes-deployment -- diagnostics \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --out artifacts/release-health/production-kubernetes-deploy-diagnostics.json || true

      - name: Upload production Kubernetes deploy diagnostics
        if: always() && env.SHOULD_DEPLOY != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-kubernetes-deploy-diagnostics
          path: artifacts/release-health/production-kubernetes-deploy-diagnostics.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Verify production DOKS live hosts and certificate
        if: env.SHOULD_DEPLOY != 'false' && env.PRODUCTION_DOKS_INGRESS_TARGET != ''
        run: |
          set -euo pipefail
          certificate_name="chase-sets-platform-doks-tls"
          kubectl wait \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --for=condition=Ready \
            "certificate/${certificate_name}" \
            --timeout=10m

          live_urls=(
            --url https://chasesets.com/
            --url https://www.chasesets.com/
            --url https://admin.chasesets.com/health/ready
          )
          if [ "${TF_VAR_production_marketplace_public_enabled:-false}" = "true" ]; then
            live_urls+=(--url https://marketplace.chasesets.com/health/ready)
          fi
          node ./scripts/platform-ingress-wait.mjs "${live_urls[@]}"

          unresolved="$(
            kubectl get orders.acme.cert-manager.io,challenges.acme.cert-manager.io \
              --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
              --output json \
              | jq '[.items[] | select((.status.state // "") != "valid")] | length'
          )"
          if [ "$unresolved" -ne 0 ]; then
            echo "Production cert-manager still has unresolved Order or Challenge resources." >&2
            exit 1
          fi

      - name: Wait for production domains
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          mapfile -t public_domains < <(terraform output -json public_domains | jq -r '.[]')
          mapfile -t marketplace_domains < <(terraform output -json marketplace_domains | jq -r '.[]')
          admin_domain="$(terraform output -raw admin_domain)"
          if [ "${#public_domains[@]}" -eq 0 ] || [ -z "$admin_domain" ]; then
            echo "Required production domains were not present in Terraform outputs." >&2
            exit 1
          fi
          if [ "${TF_VAR_production_marketplace_public_enabled:-false}" = "true" ] && [ "${#marketplace_domains[@]}" -eq 0 ]; then
            echo "Production marketplace promotion was enabled but no marketplace domains were present in Terraform outputs." >&2
            exit 1
          fi

          wait_for_domain() {
            local hostname="$1"
            local url="https://${hostname}"
            curl --fail --silent --show-error --head --retry 120 --retry-delay 30 --retry-all-errors --max-time 15 "$url" >/dev/null
          }

          for hostname in "${public_domains[@]}" "${marketplace_domains[@]}" "$admin_domain"; do
            wait_for_domain "$hostname"
          done

      # Post-deploy readiness gate (#1237): derive direct production database
      # URLs for the audited wave contexts from Terraform state (same pattern
      # as the staging wake drills / representative-commerce-state workflows)
      # so the readiness gate below can compare projection checkpoints against
      # the event-store head before projection-dependent smoke assertions run.
      - name: Export production readiness database URLs
        if: env.SHOULD_DEPLOY != 'false'
        # Support step: an export failure leaves the gate without database
        # URLs, which it reports as a config error and fails closed before
        # production smoke runs.
        continue-on-error: true
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          READINESS_GATE_SOURCE_CONTEXTS: ${{ vars.PRODUCTION_READINESS_GATE_SOURCE_CONTEXTS || 'checkout,public-presence' }}
        run: |
          set -euo pipefail
          state_path="${RUNNER_TEMP}/platform-production.tfstate.json"
          terraform state pull > "$state_path"
          TERRAFORM_STATE_PATH="$state_path" node <<'NODE'
          const fs = require("node:fs");
          const state = JSON.parse(fs.readFileSync(process.env.TERRAFORM_STATE_PATH, "utf8"));
          const resources = Array.isArray(state.resources) ? state.resources : [];
          const cluster = resources.find((resource) =>
            resource.type === "digitalocean_database_cluster" && resource.name === "postgres"
          );
          const databases = resources.find((resource) =>
            resource.type === "digitalocean_database_db" && resource.name === "contexts"
          );
          const users = resources.find((resource) =>
            resource.type === "digitalocean_database_user" && resource.name === "contexts"
          );
          const clusterAttrs = cluster?.instances?.[0]?.attributes ?? {};
          if (!clusterAttrs.host || !clusterAttrs.port) {
            throw new Error("Production Terraform state does not contain a usable DigitalOcean database cluster.");
          }

          const databaseByContext = new Map(
            (databases?.instances ?? []).map((instance) => [instance.index_key, instance.attributes ?? {}])
          );
          const userByContext = new Map(
            (users?.instances ?? []).map((instance) => [instance.index_key, instance.attributes ?? {}])
          );
          const readinessContexts = String(process.env.READINESS_GATE_SOURCE_CONTEXTS ?? "checkout,public-presence")
            .split(",")
            .map((entry) => entry.trim())
            .filter(Boolean);
          const contextNames = [...new Set([...readinessContexts, "checkout", "public-presence", "control"])].sort();

          const lines = [];
          for (const contextName of contextNames) {
            const database = databaseByContext.get(contextName);
            const user = userByContext.get(contextName);
            if (!contextName || !database?.name || !user?.name || !user?.password) {
              throw new Error(`Direct database state is incomplete for context '${contextName ?? "unknown"}'.`);
            }

            const url = `postgresql://${encodeURIComponent(user.name)}:${encodeURIComponent(user.password)}` +
              `@${clusterAttrs.host}:${clusterAttrs.port}/${encodeURIComponent(database.name)}?sslmode=require`;
            const envName = contextName === "control"
              ? "PLATFORM_CONTROL_DATABASE_URL"
              : `DATABASE_URL_${String(contextName).toUpperCase().replaceAll("-", "_")}`;
            console.log(`::add-mask::${url}`);
            lines.push(`${envName}=${url}`);
          }

          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join("\n")}\n`);
          NODE

      # Bounded wait for steady state (#1237): poll until the audited contexts'
      # projection checkpoints reach the event-store head or the budget expires
      # so projection-dependent production smoke assertions measure
      # steady-state freshness instead of post-deploy catch-up. Fail closed if
      # the budget expires or the gate cannot sample production databases.
      - name: Production post-deploy readiness gate
        timeout-minutes: 20
        id: readiness_gate
        if: env.SHOULD_DEPLOY != 'false'
        env:
          READINESS_GATE_SOURCE_CONTEXTS: ${{ vars.PRODUCTION_READINESS_GATE_SOURCE_CONTEXTS || 'checkout,public-presence' }}
          READINESS_GATE_BUDGET_MS: ${{ vars.PRODUCTION_READINESS_GATE_BUDGET_MS || '300000' }}
        run: |
          set -euo pipefail
          set +e
          node ./scripts/production-readiness-gate.mjs \
            --out artifacts/release-health/production-readiness-gate.json
          gate_exit=$?
          set -e
          case "$gate_exit" in
            0) outcome=ready ;;
            1) outcome=budget-expired ;;
            *) outcome=error ;;
          esac
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"
          if [ "$outcome" != "ready" ]; then
            echo "::error::Production post-deploy readiness gate outcome was '${outcome}'; failing closed before projection-dependent smoke assertions."
            exit "$gate_exit"
          fi

      - name: Smoke check
        timeout-minutes: 15
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_ADMIN_GOOGLE_WORKSPACE_SSO: "true"
          SMOKE_EMAIL: ops+smoke@chasesets.com
          SMOKE_EMAIL_SUFFIX: production-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_SOURCE: production-smoke
          SMOKE_UTM_CAMPAIGN: production-main
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
          SMOKE_FETCH_TIMEOUT_MS: "15000"
        run: |
          set -euo pipefail
          public_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          catalog_asset_public_base_url="$(terraform output -raw catalog_asset_public_base_url)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          smoke_urls=("https://${public_domain}" "https://${admin_domain}")
          if [ "${TF_VAR_production_runtime_profile:-landing}" = "landing" ]; then
            export SMOKE_REQUIRE_NATIVE_MCP="false"
          else
            export SMOKE_REQUIRE_NATIVE_MCP="true"
          fi
          export SMOKE_REQUIRE_FULFILLMENT_POSTAGE="${TF_VAR_production_fulfillment_postage_approved:-false}"
          if [ "${TF_VAR_production_marketplace_public_enabled:-false}" = "true" ]; then
            export SMOKE_ADMIN_TOPOLOGY="public-marketplace"
            if [ -z "$marketplace_domain" ]; then
              echo "Production marketplace promotion was enabled but no marketplace domain was present in Terraform outputs." >&2
              exit 1
            fi
            export SMOKE_REQUIRE_MARKETPLACE="true"
            smoke_urls+=("https://${marketplace_domain}")
          else
            export SMOKE_ADMIN_TOPOLOGY="production-platform-disabled"
          fi
          cd ../../..
          pnpm run smoke:platform -- "${smoke_urls[@]}"
          catalog_asset_root_status=""
          for attempt in $(seq 1 12); do
            catalog_asset_root_status="$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' \
              "${catalog_asset_public_base_url}/" || true)"
            echo "Catalog asset CDN root status ${catalog_asset_root_status} on attempt ${attempt}."
            if [ "$catalog_asset_root_status" = "403" ]; then
              break
            fi
            sleep 10
          done
          if [ "$catalog_asset_root_status" != "403" ]; then
            echo "Catalog asset CDN root must stay protected; expected 403, got ${catalog_asset_root_status:-none}." >&2
            exit 1
          fi
          echo "Catalog asset CDN root returned expected protected status 403."

      - name: Stage 1 production canary
        id: stage1_canary
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"

          public_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          canary_urls=("https://${public_domain}" "https://${admin_domain}")
          if [ "${TF_VAR_production_marketplace_public_enabled:-false}" = "true" ]; then
            if [ -z "$marketplace_domain" ]; then
              echo "Production marketplace canary was requested but no marketplace domain was present." >&2
              exit 1
            fi
            canary_urls+=("https://${marketplace_domain}")
          fi

          for url in "${canary_urls[@]}"; do
            curl --fail --silent --show-error --head --retry 12 --retry-delay 10 --retry-all-errors "$url" >/dev/null
          done

          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "completed_at=${completed_at}" >> "$GITHUB_OUTPUT"
          echo "Stage 1 production canary verified ${#canary_urls[@]} synthetic/operator-safe endpoints."

      - name: Promote production Argo Rollouts
        if: env.SHOULD_DEPLOY != 'false' && env.ARGO_ROLLOUTS_ENABLED == 'true'
        run: |
          set -euo pipefail
          pnpm run platform:kubernetes-deployment -- promote \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --rollouts-enabled true \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT"

      - name: Abort production Argo Rollouts
        if: failure() && env.SHOULD_DEPLOY != 'false' && env.ARGO_ROLLOUTS_ENABLED == 'true'
        run: |
          pnpm run platform:kubernetes-deployment -- abort \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --rollouts-enabled true || true

      - name: Capture post-cutover production Kubernetes diagnostics
        if: failure() && env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health
          pnpm run platform:kubernetes-deployment -- diagnostics \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --out artifacts/release-health/production-kubernetes-deploy-diagnostics.json || true

      - name: Roll back production Kubernetes release
        id: production_rollback
        if: failure() && env.SHOULD_DEPLOY != 'false' && steps.rollback_readiness.outputs.result == 'success'
        run: |
          set -euo pipefail

          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"
          rollback_record="artifacts/release-health/production-rollback.json"
          rollback_reference="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-automated-production-rollback"
          rollback_target_commit="${{ steps.rollback_target.outputs.last_known_good_commit }}"
          mkdir -p "$(dirname "$rollback_record")"
          set +e
          pnpm run platform:kubernetes-deployment -- rollback \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --rollouts-enabled "$ARGO_ROLLOUTS_ENABLED" \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT" \
            --out "$rollback_record" \
            --github-output "$GITHUB_OUTPUT"
          rollback_command_exit=$?
          set -e
          if [ ! -f "$rollback_record" ]; then
            node - "$rollback_record" "$rollback_command_exit" <<'NODE'
          const { writeFileSync } = require("node:fs");
          const [outputPath, exitCode] = process.argv.slice(2);
          writeFileSync(outputPath, `${JSON.stringify({
            schemaVersion: "platform-kubernetes-deployment/v1",
            action: "rollback",
            release: process.env.CHASE_SETS_HELM_RELEASE,
            namespace: process.env.CHASE_SETS_KUBERNETES_NAMESPACE,
            result: "failure",
            reason: `rollback command exited with code ${exitCode}`,
          }, null, 2)}\n`);
          NODE
          fi
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          rollback_result="$(jq -r '.result // "unknown"' "$rollback_record")"
          rollback_reason="$(jq -r '.reason // empty' "$rollback_record")"
          {
            echo "completed_at=${completed_at}"
            echo "result=${rollback_result}"
            echo "rollback_reference=${rollback_reference}"
            echo "rollback_target_commit=${rollback_target_commit}"
          } >> "$GITHUB_OUTPUT"
          if [ "$rollback_result" = "success" ]; then
            {
              echo "## Automated production rollback"
              echo
              echo "A post-cutover production verification step failed. Helm rolled the production Kubernetes release back to the previous revision."
              echo
              echo "- Target commit: ${{ steps.rollback_target.outputs.last_known_good_commit }}"
              echo "- Release tag: ${{ steps.rollback_target.outputs.rollback_release_tag }}"
              echo "- Image: ${{ steps.rollback_target.outputs.rollback_image_ref }}"
              echo "- Workloads: ${{ steps.rollback_target.outputs.rollback_components }}"
              echo "- Reference: ${rollback_reference}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Automated production rollback failed"
              echo
              echo "A production verification step failed and the automated Helm rollback did not restore the target revision."
              echo
              echo "- Result: ${rollback_result}"
              echo "- Reason: ${rollback_reason:-unknown}"
              echo "- Target commit: ${rollback_target_commit}"
              echo "- Reference: ${rollback_reference}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mark production release
        id: production_marker
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          release_tag="release-$(date -u +%Y%m%d%H%M%S)-$(printf '%s' "$release_commit" | cut -c1-8)"
          promoted_image="${{ steps.image.outputs.image }}"
          promoted_digest="${{ steps.image.outputs.digest }}"
          release_image="${promoted_image%:*}:${release_tag}"

          docker buildx imagetools create --tag "$release_image" "${promoted_image}@${promoted_digest}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin production || true
          git fetch origin --tags || true

          if ! git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            git tag -a "$release_tag" "$release_commit" -m "Production release ${release_tag}"
            git push origin "refs/tags/${release_tag}"
          fi

          if git show-ref --verify --quiet refs/remotes/origin/production; then
            production_marker_commit="$(git rev-parse origin/production)"
            git checkout -B production origin/production
            if ! git merge --ff-only "$release_commit"; then
              {
                echo "marker_updated=false"
                echo "marker_mismatch=true"
                echo "production_marker_commit=${production_marker_commit}"
                echo "marker_error=production-marker-non-fast-forward"
              } >> "$GITHUB_OUTPUT"
              {
                echo "## Production marker mismatch"
                echo
                echo "Production deployed successfully, but the smoke-verified production marker could not fast-forward."
                echo
                echo "- Deployed commit: ${release_commit}"
                echo "- Current production marker: ${production_marker_commit}"
                echo "- Error: production-marker-non-fast-forward"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            production_marker_commit=""
            git checkout -B production "$release_commit"
          fi

          if ! git push origin production; then
            git fetch origin production || true
            production_marker_commit="$(git rev-parse origin/production 2>/dev/null || printf '%s' "${production_marker_commit}")"
            {
              echo "marker_updated=false"
              echo "marker_mismatch=true"
              echo "production_marker_commit=${production_marker_commit}"
              echo "marker_error=production-marker-push-failed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Production marker mismatch"
              echo
              echo "Production deployed successfully, but the smoke-verified production marker push failed."
              echo
              echo "- Deployed commit: ${release_commit}"
              echo "- Current production marker: ${production_marker_commit:-unknown}"
              echo "- Error: production-marker-push-failed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "marker_updated=true"
            echo "marker_mismatch=false"
            echo "production_marker_commit=${release_commit}"
            echo "marker_error="
          } >> "$GITHUB_OUTPUT"

      - name: Write promoted release handoff
        if: steps.production_marker.outputs.marker_updated == 'true'
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          RELEASE_IMAGE: ${{ steps.image.outputs.image }}
          RELEASE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          tree_hash="$(git rev-parse "${RELEASE_COMMIT}^{tree}")"
          node ./scripts/promoted-release.mjs create \
            --out artifacts/release-health/promoted-release.json \
            --producer-run-id "${{ github.run_id }}" \
            --producer-run-attempt "${{ github.run_attempt }}" \
            --environment production \
            --release-commit "$RELEASE_COMMIT" \
            --tree-hash "$tree_hash" \
            --image-repository "$RELEASE_IMAGE" \
            --image-digest "$RELEASE_IMAGE_DIGEST" \
            --promotion-result promoted \
            --promoted-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Upload promoted release handoff
        if: steps.production_marker.outputs.marker_updated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promoted-release
          path: artifacts/release-health/promoted-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Resolve terminal release state
        id: release_state
        if: always()
        env:
          RELEASE_COMMIT: ${{ needs.deploy-staging.outputs.active_release_commit }}
          RELEASE_IMAGE_DIGEST: ${{ needs.deploy-staging.outputs.active_image_digest }}
          RELEASE_STATE_MODE: ${{ inputs.dispatch_source }}
          AUTOMATIC_RELEASE: ${{ inputs.dispatch_source == 'automatic' && 'true' || 'false' }}
          PRODUCTION_MARKER_UPDATED: ${{ steps.production_marker.outputs.marker_updated || 'false' }}
          PRODUCTION_ROLLBACK_RESULT: ${{ steps.production_rollback.outputs.result || 'not-attempted' }}
        run: |
          set -euo pipefail
          if [ "$PRODUCTION_ROLLBACK_RESULT" = "success" ]; then
            terminal="rolled-back"
          elif [ "$PRODUCTION_MARKER_UPDATED" = "true" ]; then
            terminal="promoted"
          else
            terminal="failed"
          fi

          pending_commit=""
          coalesced_count=0
          if [ "$AUTOMATIC_RELEASE" = "true" ]; then
            git fetch origin main
            latest_main="$(git rev-parse origin/main)"
            if [ "$latest_main" != "$RELEASE_COMMIT" ]; then
              pending_commit="$latest_main"
              coalesced_count="$(git rev-list --count "${RELEASE_COMMIT}..${latest_main}")"
            fi
          fi

          transitions="$(jq -cn \
            --arg commit "$RELEASE_COMMIT" \
            --arg digest "$RELEASE_IMAGE_DIGEST" \
            --arg mode "$RELEASE_STATE_MODE" \
            --arg terminal "$terminal" \
            --arg pending "$pending_commit" \
            --argjson count "$coalesced_count" \
            '[{type:"active", commit:$commit, imageDigest:$digest, mode:$mode}]
              + (if $pending == "" then [] else [
                  {type:"pending", commit:$pending, mode:"automatic"},
                  {type:"coalesced", commit:$pending, count:$count}
                ] end)
              + [{type:$terminal, commit:$commit, imageDigest:$digest, mode:$mode}]')"
          echo "transitions=${transitions}" >> "$GITHUB_OUTPUT"
          echo "Terminal release outcome: ${terminal}; pending latest: ${pending_commit:-none}; coalesced commits: ${coalesced_count}."

      - name: Resolve release health metadata
        id: release_health_metadata
        if: always()
        env:
          SOURCE_WORKFLOW_CREATED_AT: ${{ needs.resolve-release.outputs.dispatch_created_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          committed_at="$(git show -s --format=%cI "$release_commit")"
          linkage_args=()
          if [ "${{ inputs.dispatch_source }}" = "automatic" ]; then
            linkage_name="release-candidate-linkage-${{ inputs.dispatch_run_id }}-${{ inputs.dispatch_attempt }}"
            gh run download "${{ inputs.dispatch_run_id }}" --name "$linkage_name" --dir artifacts/release-candidate-linkage
            linkage_args=(--linkage-file artifacts/release-candidate-linkage/linkage.json)
          fi
          if ! node ./scripts/release-health-github-metadata.mjs \
            --repository "${{ github.repository }}" \
            --release-commit "$release_commit" \
            --source-workflow-created-at "${SOURCE_WORKFLOW_CREATED_AT:-}" \
            "${linkage_args[@]}" \
            --format github-output >> "$GITHUB_OUTPUT"; then
            echo "GitHub release-health metadata was unavailable; writing deterministic fallbacks." >&2
            {
              echo "pr_number="
              echo "pr_opened_at="
              echo "pr_ready_for_review_at="
              echo "pr_approved_at="
              echo "queue_queued_at=${SOURCE_WORKFLOW_CREATED_AT:-}"
              echo "queue_merge_group_started_at="
              echo "queue_merged_at=${committed_at}"
              echo "queue_dequeued_at="
              echo "queue_failure_reason="
              echo "queue_batch_size=1"
              echo "candidate_artifact_id="
              echo "candidate_artifact_name="
              echo "merge_group_workflow_id="
              echo "merge_group_workflow_path="
              echo "candidate_sha="
              echo "candidate_tree_sha="
              echo "candidate_image_digest="
              echo "merge_group_run_id="
              echo "merge_group_run_attempt="
              echo "merge_sha=${release_commit}"
              echo "merge_tree_sha=$(git rev-parse "${release_commit}^{tree}")"
              echo "lineage_complete=false"
              echo 'lineage_reasons_json=["metadata-unavailable"]'
            } >> "$GITHUB_OUTPUT"
          fi

          git fetch origin production || true
          drift_commits=0
          drift_seconds=0
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            drift_commits="$(git rev-list --count "origin/production..${release_commit}" 2>/dev/null || printf '0')"
            release_epoch="$(git show -s --format=%ct "$release_commit")"
            production_epoch="$(git show -s --format=%ct origin/production)"
            if [ "$release_epoch" -gt "$production_epoch" ]; then
              drift_seconds=$((release_epoch - production_epoch))
            fi
          fi

          {
            echo "completed_at=${completed_at}"
            echo "committed_at=${committed_at}"
            echo "drift_commits=${drift_commits}"
            echo "drift_seconds=${drift_seconds}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve CI retry metadata
        id: ci_metadata
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! node ./scripts/release-health-ci-metadata.mjs \
            --repository "${{ github.repository }}" \
            --release-commit "${{ needs.resolve-release.outputs.release_commit }}" \
            --format github-output >> "$GITHUB_OUTPUT"; then
            {
              echo "ci_retry_count=0"
              echo "ci_flaky_failure_count=0"
              echo "ci_top_flaky_jobs=[]"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Classify production deployment failure
        if: failure()
        id: production_failure_classification
        run: |
          set -euo pipefail
          node ./scripts/platform-deploy-incident.mjs \
            --command classify-root-cause \
            --phase production-deploy \
            --diagnostics artifacts/release-health/production-terraform-diagnostics.txt \
            --diagnostics artifacts/release-health/production-kubernetes-deploy-diagnostics.json \
            --diagnostics artifacts/release-health/production-readiness-gate.json \
            --diagnostics artifacts/release-health/production-rollback.json \
            --out artifacts/release-health/production-deploy-root-cause.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --format github-output >> "$GITHUB_OUTPUT"

      - name: Write release health summary
        if: always()
        env:
          RELEASE_HEALTH_OUT: artifacts/release-health/production-release.json
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          DISPATCH_SOURCE: ${{ inputs.dispatch_source }}
          DISPATCH_RUN_ID: ${{ inputs.dispatch_run_id }}
          DISPATCH_ATTEMPT: ${{ inputs.dispatch_attempt }}
          DISPATCH_REASON: ${{ inputs.reason }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'emergency' || 'normal' }}
          PR_NUMBER: ${{ steps.release_health_metadata.outputs.pr_number }}
          PR_OPENED_AT: ${{ steps.release_health_metadata.outputs.pr_opened_at }}
          PR_READY_FOR_REVIEW_AT: ${{ steps.release_health_metadata.outputs.pr_ready_for_review_at }}
          PR_APPROVED_AT: ${{ steps.release_health_metadata.outputs.pr_approved_at }}
          QUEUE_BATCH_SIZE: ${{ steps.release_health_metadata.outputs.queue_batch_size || '1' }}
          QUEUE_QUEUED_AT: ${{ steps.release_health_metadata.outputs.queue_queued_at }}
          QUEUE_MERGE_GROUP_STARTED_AT: ${{ steps.release_health_metadata.outputs.queue_merge_group_started_at }}
          QUEUE_MERGED_AT: ${{ steps.release_health_metadata.outputs.queue_merged_at }}
          QUEUE_DEQUEUED_AT: ${{ steps.release_health_metadata.outputs.queue_dequeued_at }}
          QUEUE_FAILURE_REASON: ${{ steps.release_health_metadata.outputs.queue_failure_reason }}
          CANDIDATE_SHA: ${{ steps.release_health_metadata.outputs.candidate_sha }}
          CANDIDATE_TREE_SHA: ${{ steps.release_health_metadata.outputs.candidate_tree_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.release_health_metadata.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.release_health_metadata.outputs.candidate_artifact_name }}
          MERGE_GROUP_WORKFLOW_ID: ${{ steps.release_health_metadata.outputs.merge_group_workflow_id }}
          MERGE_GROUP_WORKFLOW_PATH: ${{ steps.release_health_metadata.outputs.merge_group_workflow_path }}
          CANDIDATE_IMAGE_DIGEST: ${{ steps.release_health_metadata.outputs.candidate_image_digest }}
          MERGE_GROUP_RUN_ID: ${{ steps.release_health_metadata.outputs.merge_group_run_id }}
          MERGE_GROUP_RUN_ATTEMPT: ${{ steps.release_health_metadata.outputs.merge_group_run_attempt }}
          MERGE_SHA: ${{ steps.release_health_metadata.outputs.merge_sha }}
          MERGE_TREE_SHA: ${{ steps.release_health_metadata.outputs.merge_tree_sha }}
          LINEAGE_COMPLETE: ${{ steps.release_health_metadata.outputs.lineage_complete || 'false' }}
          LINEAGE_REASONS_JSON: ${{ steps.release_health_metadata.outputs.lineage_reasons_json || '["metadata-unavailable"]' }}
          RELEASE_COMMIT_COMMITTED_AT: ${{ steps.release_health_metadata.outputs.committed_at }}
          RELEASE_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'emergency-recovery' || needs.resolve-release.outputs.exposure_posture_changed == 'true' && 'exposure-posture-change' || 'ordinary-deploy' }}
          EXPOSURE_POSTURE_CATEGORIES: ${{ needs.resolve-release.outputs.exposure_posture_categories }}
          DEPLOYMENT_REQUIRED: ${{ needs.resolve-release.outputs.deployment_required }}
          STAGING_RESULT: ${{ needs.deploy-staging.result }}
          STAGING_STARTED_AT: ${{ needs.deploy-staging.outputs.started_at }}
          STAGING_COMPLETED_AT: ${{ needs.deploy-staging.outputs.completed_at }}
          CANARY_RESULT: ${{ steps.stage1_canary.outcome || 'skipped' }}
          CANARY_STARTED_AT: ${{ steps.stage1_canary.outputs.started_at }}
          CANARY_COMPLETED_AT: ${{ steps.stage1_canary.outputs.completed_at }}
          CANARY_SKIPPED_REASON: ${{ steps.stage1_canary.outcome == 'skipped' && 'stage-1-canary-not-run' || '' }}
          CANARY_COHORT_SUBJECT_TYPE: operator
          CANARY_COHORT_SIZE: "0"
          CANARY_PROMOTION_DECISION: ${{ steps.stage1_canary.outcome == 'success' && 'promote' || steps.stage1_canary.outcome == 'failure' && 'abort' || 'skipped' }}
          ACCOUNT_CART_CANARY_RESULT: ${{ needs.deploy-staging.outputs.account_cart_canary_result || 'skipped' }}
          ACCOUNT_CART_CANARY_STARTED_AT: ${{ needs.deploy-staging.outputs.account_cart_canary_started_at }}
          ACCOUNT_CART_CANARY_COMPLETED_AT: ${{ needs.deploy-staging.outputs.account_cart_canary_completed_at }}
          ACCOUNT_CART_CANARY_PROMOTION_DECISION: ${{ needs.deploy-staging.outputs.account_cart_canary_promotion_decision || 'skipped' }}
          ACCOUNT_CART_CANARY_CONFIGURED: ${{ needs.deploy-staging.outputs.account_cart_canary_configured || 'false' }}
          PRODUCTION_READINESS_GATE_OUTCOME: ${{ steps.readiness_gate.outputs.outcome || 'not-run' }}
          PRODUCTION_RESULT: ${{ job.status }}
          PRODUCTION_STARTED_AT: ${{ steps.production_started.outputs.started_at }}
          PRODUCTION_COMPLETED_AT: ${{ steps.release_health_metadata.outputs.completed_at }}
          RELEASE_ATTEMPT_RESULT: ${{ job.status }}
          RELEASE_ATTEMPT_PHASE: production
          RELEASE_ATTEMPT_REASON: ${{ steps.production_marker.outputs.marker_mismatch == 'true' && 'production-marker-mismatch' || steps.production_rollback.outputs.result == 'success' && 'production-rolled-back' || 'production-release' }}
          RELEASE_STATE_TRANSITIONS: ${{ steps.release_state.outputs.transitions }}
          RELEASE_ATTEMPT_WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          CI_RETRY_COUNT: ${{ steps.ci_metadata.outputs.ci_retry_count }}
          CI_FLAKY_FAILURE_COUNT: ${{ steps.ci_metadata.outputs.ci_flaky_failure_count }}
          CI_TOP_FLAKY_JOBS: ${{ steps.ci_metadata.outputs.ci_top_flaky_jobs }}
          MAIN_TO_PRODUCTION_DRIFT_COMMITS: ${{ steps.release_health_metadata.outputs.drift_commits }}
          MAIN_TO_PRODUCTION_DRIFT_SECONDS: ${{ steps.release_health_metadata.outputs.drift_seconds }}
          EMERGENCY_RELEASE_REFERENCE: ${{ steps.release_lock.outputs.emergency_reference }}
          RECOVERY_MODE: ${{ steps.production_rollback.outputs.result == 'success' && 'rollback' || github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'fix-forward' || 'none' }}
          RECOVERY_REFERENCE: ${{ steps.production_rollback.outputs.rollback_reference || steps.release_lock.outputs.emergency_reference }}
          RECOVERY_TARGET_COMMIT: ${{ steps.production_rollback.outputs.rollback_target_commit || '' }}
          PRODUCTION_RECOVERY_MODE: ${{ needs.resolve-release.outputs.production_recovery_mode }}
          PRODUCTION_RECOVERY_REASON: ${{ needs.resolve-release.outputs.production_recovery_reason }}
          ROLLBACK_READINESS_RESULT: ${{ steps.rollback_readiness.outputs.result || 'failure' }}
          PRODUCTION_RESTORE_POINT_RESULT: ${{ steps.production_restore_point.outputs.restore_point_result || 'unknown' }}
          PRODUCTION_RESTORE_POINT_TYPE: ${{ steps.production_restore_point.outputs.restore_point_type || '' }}
          PRODUCTION_RESTORE_POINT_CLUSTER_ID: ${{ steps.production_restore_point.outputs.restore_point_cluster_id || '' }}
          PRODUCTION_RESTORE_POINT_NAME: ${{ steps.production_restore_point.outputs.restore_point_name || '' }}
          PRODUCTION_RESTORE_POINT_STATUS: ${{ steps.production_restore_point.outputs.restore_point_status || '' }}
          PRODUCTION_RESTORE_POINT_CREATED_AT: ${{ steps.production_restore_point.outputs.restore_point_created_at || '' }}
          PRODUCTION_RESTORE_POINT_BYPASSED: ${{ steps.production_restore_point.outputs.restore_point_bypassed || 'false' }}
          PRODUCTION_RESTORE_POINT_REMEDIATION: ${{ steps.production_restore_point.outputs.restore_point_remediation || '' }}
          PRODUCTION_RESTORE_POINT_PRE_MIGRATE_STATE_KEY: ${{ steps.production_restore_point.outputs.restore_point_pre_migrate_state_key || '' }}
          PRODUCTION_RESTORE_POINT_PRE_MIGRATE_STATE_FINGERPRINT: ${{ steps.production_restore_point.outputs.restore_point_pre_migrate_state_fingerprint || '' }}
          PRODUCTION_RESTORE_POINT_REUSED: ${{ steps.production_restore_point.outputs.restore_point_reused || 'false' }}
          PRODUCTION_RESTORE_POINT_REUSED_CLUSTER_ID: ${{ steps.production_restore_point.outputs.restore_point_reused_cluster_id || '' }}
        run: node ./scripts/release-health.mjs

      - name: Upload release health summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-health
          path: |
            artifacts/release-health/production-release.json
            artifacts/release-health/production-db-restore-point.json
            artifacts/release-health/production-readiness-gate.json
            artifacts/release-health/production-rollback.json
            artifacts/release-health/production-rollback-target.json
            artifacts/release-health/production-rollback-readiness.json
            artifacts/release-health/production-kubernetes-deploy-diagnostics.json
            artifacts/release-health/production-deploy-root-cause.json
          if-no-files-found: ignore
          retention-days: 30

  notify-production-deploy-incident:
    name: Notify Production Deploy Incident
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - resolve-release
      - deployment-contract-preflight
      - build-image
      - deploy-staging
      - deploy-production
      - record-staging-release-health
    if: >
      always() &&
      (
        contains(fromJSON('["failure", "cancelled"]'), needs.resolve-release.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.deployment-contract-preflight.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.build-image.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.deploy-staging.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.deploy-production.result) ||
        contains(fromJSON('["failure", "cancelled"]'), needs.record-staging-release-health.result) ||
        (
          needs.resolve-release.result == 'success' &&
          needs.build-image.result == 'success' &&
          needs.deploy-staging.result == 'success' &&
          needs.deploy-production.result == 'skipped' &&
          needs.deploy-staging.outputs.applied != 'true'
        )
      )
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Classify deploy outcome
        id: classify_deploy_outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit || inputs.release_ref || 'unresolved' }}
          BUILD_IMAGE_RESULT: ${{ needs.build-image.result }}
          DEPLOY_STAGING_RESULT: ${{ needs.deploy-staging.result }}
          DEPLOY_PRODUCTION_RESULT: ${{ needs.deploy-production.result }}
          RECORD_STAGING_HEALTH_RESULT: ${{ needs.record-staging-release-health.result }}
          RESOLVE_RELEASE_RESULT: ${{ needs.resolve-release.result }}
          STAGING_ROOT_CAUSE_CODE: ${{ needs.deploy-staging.outputs.root_cause_code || 'unknown' }}
          PRODUCTION_ROOT_CAUSE_CODE: ${{ needs.deploy-production.outputs.root_cause_code || 'unknown' }}
          ROOT_CAUSE_SUMMARY: ${{ needs.deploy-staging.result == 'failure' && needs.deploy-staging.outputs.root_cause_summary || needs.deploy-production.outputs.root_cause_summary }}
          AFFECTED_COMPONENT: ${{ needs.deploy-staging.result == 'failure' && needs.deploy-staging.outputs.affected_component || needs.deploy-production.outputs.affected_component }}
          ROOT_CAUSE_PHASE: ${{ needs.deploy-staging.result == 'failure' && needs.deploy-staging.outputs.root_cause_phase || needs.deploy-production.outputs.root_cause_phase }}
          ROOT_CAUSE_REMEDIATION: ${{ needs.deploy-staging.result == 'failure' && needs.deploy-staging.outputs.root_cause_remediation || needs.deploy-production.outputs.root_cause_remediation }}
          ROOT_CAUSE_PROVIDER_REASON: ${{ needs.deploy-staging.result == 'failure' && needs.deploy-staging.outputs.root_cause_provider_reason || needs.deploy-production.outputs.root_cause_provider_reason }}
          STAGING_APPLIED: ${{ needs.deploy-staging.outputs.applied || '' }}
          STAGING_DEPLOYED: ${{ needs.deploy-staging.outputs.deployed || '' }}
          PRODUCTION_SUPERSEDED: "false"
          SUPERSEDED_BY_COMMIT: ${{ needs.deploy-staging.outputs.superseded_by_commit || '' }}
        run: |
          set -euo pipefail
          node ./scripts/platform-deploy-incident.mjs \
            --command classify-run \
            --format github-output >> "$GITHUB_OUTPUT"

      - name: Create, update, or resolve incident issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit || inputs.release_ref || 'unresolved' }}
          DEPLOY_INCIDENT_ACTION: ${{ steps.classify_deploy_outcome.outputs.action }}
          PLATFORM_DEPLOY_INCIDENT_REASON: ${{ steps.classify_deploy_outcome.outputs.root_cause_code }}
          ROOT_CAUSE_SUMMARY: ${{ steps.classify_deploy_outcome.outputs.root_cause_summary }}
          AFFECTED_COMPONENT: ${{ steps.classify_deploy_outcome.outputs.affected_component }}
          ROOT_CAUSE_PHASE: ${{ steps.classify_deploy_outcome.outputs.phase }}
          ROOT_CAUSE_REMEDIATION: ${{ steps.classify_deploy_outcome.outputs.remediation }}
          ROOT_CAUSE_PROVIDER_REASON: ${{ steps.classify_deploy_outcome.outputs.provider_reason }}
          ROOT_CAUSE_SIGNATURE: ${{ steps.classify_deploy_outcome.outputs.root_cause_signature }}
          DEPLOYMENT_CONTRACT_PREFLIGHT_RESULT: ${{ needs.deployment-contract-preflight.result }}
          SUPERSEDED_BY_COMMIT: ${{ needs.deploy-staging.outputs.superseded_by_commit || '' }}
          RESOLVE_RELEASE_RESULT: ${{ needs.resolve-release.result }}
          BUILD_IMAGE_RESULT: ${{ needs.build-image.result }}
          DEPLOY_STAGING_RESULT: ${{ needs.deploy-staging.result }}
          DEPLOY_PRODUCTION_RESULT: ${{ needs.deploy-production.result }}
          ROLLBACK_RESULT: ${{ needs.deploy-production.outputs.rollback_result || 'not-attempted' }}
          RECORD_STAGING_HEALTH_RESULT: ${{ needs.record-staging-release-health.result }}
          ARTIFACTS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?attempt=${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [ "${DEPLOY_INCIDENT_ACTION}" = "close" ]; then
            close_comment="$(node ./scripts/platform-deploy-incident.mjs --command build-comment)"
            open_incidents="$(
              gh issue list \
                --repo "${GITHUB_REPOSITORY}" \
                --state open \
                --search "\"Incident: Platform Deploy\" in:title" \
                --limit 200 \
                --json number,title,body \
                --jq '.[] | @base64'
            )"

            if [ -z "${open_incidents}" ]; then
              echo "No open superseded deploy incidents to close."
              exit 0
            fi

            while IFS= read -r encoded_issue; do
              if [ -z "${encoded_issue}" ]; then
                continue
              fi
              issue_json="$(printf '%s' "${encoded_issue}" | base64 --decode)"
              issue_number="$(jq -r '.number' <<< "${issue_json}")"
              issue_title="$(jq -r '.title' <<< "${issue_json}")"
              issue_body="$(jq -r '.body // ""' <<< "${issue_json}")"
              issue_action="$(node ./scripts/platform-deploy-incident.mjs \
                --command classify-issue \
                --format plain \
                --title "${issue_title}" \
                --body "${issue_body}")"
              if [ "${issue_action}" != "close" ]; then
                continue
              fi

              gh issue close "${issue_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "${close_comment}"
              echo "Closed superseded no-op deploy incident #${issue_number}: ${issue_title}"
            done <<< "${open_incidents}"
            exit 0
          fi

          title="Incident: Platform Deploy ${PLATFORM_DEPLOY_INCIDENT_REASON} [${ROOT_CAUSE_SIGNATURE}]"
          body="$(node ./scripts/platform-deploy-incident.mjs --command build-incident-body)"

          existing_issue="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "\"${title}\" in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "${existing_issue}" ]; then
            gh issue comment "${existing_issue}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            echo "Updated incident issue #${existing_issue}."
          else
            issue_create_args=(
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body "${body}" \
              --label "kind:ops" \
              --label "area:infrastructure"
            )

            incident_milestone_title="Incidents"
            incident_milestone_number="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/milestones?state=open&per_page=100" \
                --jq '.[] | select(.title == "Incidents") | .number'
            )"

            if [ -n "${incident_milestone_number}" ]; then
              issue_create_args+=(--milestone "${incident_milestone_title}")
            else
              echo "Open incident milestone '${incident_milestone_title}' was not found; creating issue without a milestone."
            fi

            gh issue create "${issue_create_args[@]}"
          fi

  notify-production-rollback-incident:
    name: Notify Production Rollback Incident
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - resolve-release
      - deploy-production
    if: always() && needs.deploy-production.outputs.rollback_result == 'failure'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update rollback incident issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          ARTIFACTS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?attempt=${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit || inputs.release_ref || 'unresolved' }}
          ROLLBACK_TARGET_COMMIT: ${{ needs.deploy-production.outputs.rollback_target_commit || 'unknown' }}
          ROLLBACK_REFERENCE: ${{ needs.deploy-production.outputs.rollback_reference || 'not-recorded' }}
        run: |
          set -euo pipefail

          release_commit="${RELEASE_COMMIT:-unresolved}"
          release_short="${release_commit:0:12}"
          title="Incident: Platform Deploy rollback failed for ${release_short}"

          body="$(cat <<EOF
          Automated production rollback incident signal.

          - Kind: production-deploy-rollback-failure
          - Workflow run: ${RUN_URL}
          - Release commit: ${release_commit}
          - Attempted rollback target commit: ${ROLLBACK_TARGET_COMMIT}
          - Rollback reference: ${ROLLBACK_REFERENCE}
          - Diagnostics and release-health artifacts: ${ARTIFACTS_URL}

          This issue is intentionally separate from the primary deploy failure. Inspect the rollback record and Kubernetes diagnostics before attempting another rollback or fix-forward.
          EOF
          )"

          existing_issue="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "\"${title}\" in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "${existing_issue}" ]; then
            gh issue comment "${existing_issue}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            echo "Updated rollback incident issue #${existing_issue}."
          else
            issue_create_args=(
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body "${body}" \
              --label "kind:ops" \
              --label "area:infrastructure"
            )

            incident_milestone_title="Incidents"
            incident_milestone_number="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/milestones?state=open&per_page=100" \
                --jq '.[] | select(.title == "Incidents") | .number'
            )"

            if [ -n "${incident_milestone_number}" ]; then
              issue_create_args+=(--milestone "${incident_milestone_title}")
            fi

            gh issue create "${issue_create_args[@]}"
          fi

  close-resolved-deploy-incidents:
    name: Close Resolved Production Deploy Incidents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - resolve-release
      - deploy-production
    if: >
      always() &&
      needs.deploy-production.result == 'success'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close resolved deploy incidents
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit || inputs.release_ref || 'unresolved' }}
        run: |
          set -euo pipefail

          release_commit="${RELEASE_COMMIT:-unresolved}"
          close_comment="$(cat <<EOF
          Automated production deploy incident resolution.

          - Resolving workflow run: ${RUN_URL}
          - Resolving release commit: ${release_commit}

          This successful production deploy documents the replacement deploy requested in the incident next steps.
          EOF
          )"

          open_incidents="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "\"Incident: Platform Deploy\" in:title" \
              --limit 200 \
              --json number,title \
              --jq '.[] | select(.title | startswith("Incident: Platform Deploy ")) | [.number, .title] | @tsv'
          )"

          if [ -z "${open_incidents}" ]; then
            echo "No open production deploy incidents to close."
            exit 0
          fi

          while IFS=$'\t' read -r issue_number issue_title; do
            if [ -z "${issue_number}" ]; then
              continue
            fi

            gh issue close "${issue_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "${close_comment}"
            echo "Closed resolved deploy incident #${issue_number}: ${issue_title}"
          done <<< "${open_incidents}"
