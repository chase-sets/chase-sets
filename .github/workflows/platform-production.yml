name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Ref to deploy. Defaults to main.
        required: true
        default: main
        type: string
      dispatch_source:
        description: Audited source of this release request.
        required: true
        default: manual
        type: choice
        options:
          - automatic
          - manual
          - recovery
          - emergency
      dispatch_run_id:
        description: Platform Release Candidate Dispatch run ID. Required for automatic releases.
        required: false
        default: ""
        type: string
      dispatch_attempt:
        description: Platform Release Candidate Dispatch run attempt. Required for automatic releases.
        required: false
        default: ""
        type: string
      reason:
        description: Audited reason required for manual, recovery, and emergency releases.
        required: false
        default: ""
        type: string
      force_deploy:
        description: Force deployment even when release diff has no deploy-scoped files.
        required: false
        default: false
        type: boolean
      force_restore_point:
        description: Force a precreated production database restore-point fork for this release.
        required: false
        default: false
        type: boolean
      recovery_reason:
        description: Reason for forcing a production restore-point fork.
        required: false
        default: ""
        type: string
      emergency_release:
        description: Bypass an active production release lock for an audited fix-forward or revert.
        required: false
        default: false
        type: boolean
      emergency_reference:
        description: Incident, PR, or rollback evidence reference required when emergency_release is true.
        required: false
        default: ""
        type: string
      circuit_issue_number:
        description: Active canonical delivery circuit issue required for manual recovery while a lane is held.
        required: false
        default: ""
        type: string
      circuit_reason:
        description: Audited recovery reason required with circuit_issue_number.
        required: false
        default: ""
        type: string
      decommission_plan_only:
        description: Run exact live read-only staging and production App Platform decommission plans. Never applies.
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read

concurrency:
  # Dispatched automatic, manual, recovery, and emergency releases share the
  # registry-mutation lane: GitHub keeps one running and one
  # latest pending member, and never cancels the immutable active release. The
  # read-only decommission plan has its own ref-scoped lane and cannot delay or join
  # a registry/deployment mutation.
  group: ${{ inputs.decommission_plan_only && format('platform-production-decommission-plan-{0}', github.ref) || 'platform-registry-mutation' }}
  cancel-in-progress: false

jobs:
  decommission-live-plan:
    name: App Platform Decommission Live Plans
    if: github.event_name == 'workflow_dispatch' && inputs.decommission_plan_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Plan retained diagnostic DNS state
        run: |
          set -euo pipefail
          artifact_root="${GITHUB_WORKSPACE}/artifacts/decommission-live-plans"
          mkdir -p "$artifact_root"

          for environment in staging production; do
            root="infrastructure/digitalocean/environment-dns"
            state_key="environment-dns/${environment}.tfstate"
            (
              cd "$root"
              ../../../scripts/terraform-init-with-retry.sh                 -reconfigure                 -backend-config=bucket=chase-sets-terraform-state                 -backend-config=key="$state_key"                 -backend-config=region=us-east-1                 -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}'                 -backend-config=skip_credentials_validation=true                 -backend-config=skip_metadata_api_check=true                 -backend-config=skip_region_validation=true                 -backend-config=skip_requesting_account_id=true                 -backend-config=use_path_style=true                 -backend-config=use_lockfile=true
            )

            state_file="${RUNNER_TEMP}/environment-dns-${environment}.tfstate"
            terraform -chdir="$root" state pull > "$state_file"
            target="$(jq -r 'first(.resources[]? | select(.type == "digitalocean_record" and .name == "doks_ingress_shadow") | .instances[]?.attributes.value) // empty' "$state_file")"
            project_id="$(jq -r 'first(.resources[]? | select(.type == "digitalocean_project_resources") | .instances[]?.attributes.project) // empty' "$state_file")"
            google_dkim="$(jq -r 'first(.resources[]? | select(.type == "digitalocean_record" and .name == "google_workspace_dkim") | .instances[]?.attributes.value) // empty' "$state_file")"
            marketplace_enabled=false
            if [ "$environment" = production ]; then
              marketplace_enabled="$(jq -r 'any(.resources[]? | select(.type == "digitalocean_record" and .name == "doks_ingress_shadow") | .instances[]?; .index_key == "marketplace")' "$state_file")"
            fi

            TF_VAR_environment="$environment"             TF_VAR_environment_project_id="$project_id"             TF_VAR_doks_ingress_target="$target"             TF_VAR_google_workspace_dkim_txt_value="$google_dkim"             TF_VAR_production_marketplace_public_enabled="$marketplace_enabled"               terraform -chdir="$root" plan -lock=false -out="${environment}-environment-dns.tfplan"
            terraform -chdir="$root" show -no-color "${environment}-environment-dns.tfplan"               > "$artifact_root/${environment}-environment-dns-plan.txt"
            terraform -chdir="$root" show -json "${environment}-environment-dns.tfplan"               > "$artifact_root/${environment}-environment-dns-plan.json"
            node scripts/terraform-plan-inspection.mjs list-destructive-changes               "$artifact_root/${environment}-environment-dns-plan.json"               > "$artifact_root/${environment}-environment-dns-delete-set.txt"
            test ! -s "$artifact_root/${environment}-environment-dns-delete-set.txt"
            rm -f "$state_file" "$root/${environment}-environment-dns.tfplan"
          done

      - name: Plan retired staging and production applications
        run: |
          set -euo pipefail
          artifact_root="${GITHUB_WORKSPACE}/artifacts/decommission-live-plans"
          expected_delete='digitalocean_app.platform'
          expected_fingerprint='sha256:6eefaf301867bc08a35bbca0e5b9a68874eaabd2c0970239f2b30e15212cdf29'

          for environment in staging production; do
            root="infrastructure/digitalocean/platform"
            state_key="landing/${environment}.tfstate"
            (
              cd "$root"
              ../../../scripts/terraform-init-with-retry.sh                 -reconfigure                 -backend-config=bucket=chase-sets-terraform-state                 -backend-config=key="$state_key"                 -backend-config=region=us-east-1                 -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}'                 -backend-config=skip_credentials_validation=true                 -backend-config=skip_metadata_api_check=true                 -backend-config=skip_region_validation=true                 -backend-config=skip_requesting_account_id=true                 -backend-config=use_path_style=true                 -backend-config=use_lockfile=true
            )

            state_file="${RUNNER_TEMP}/platform-${environment}.tfstate"
            terraform -chdir="$root" state pull > "$state_file"
            target="$(jq -r 'first(.resources[]? | select(.type == "digitalocean_record" and (.name == "app_serving" or .name == "doks_apex")) | .instances[]?.attributes.value) // empty' "$state_file")"
            project_id="$(jq -r 'first(.resources[]? | select(.type == "digitalocean_project_resources") | .instances[]?.attributes.project) // empty' "$state_file")"
            alert_emails="$(jq -c '[.resources[]?.instances[]?.attributes | ((.alerts? // []) + (.notifications? // []))[]?.email[]?] | unique' "$state_file")"
            marketplace_public=false
            has_checkout_pool=false
            runtime_profile=landing
            if [ "$environment" = "production" ]; then
              marketplace_public="$(jq -r 'any(.resources[]? | select(.type == "digitalocean_record" and .name == "app_serving") | .instances[]?; .index_key == "marketplace")' "$state_file")"
              has_checkout_pool="$(jq -r 'any(.resources[]? | select(.type == "digitalocean_database_connection_pool" and .name == "contexts") | .instances[]?; .index_key == "checkout")' "$state_file")"
              if [ "$marketplace_public" = "true" ]; then
                runtime_profile=public
              elif [ "$has_checkout_pool" = "true" ]; then
                runtime_profile=proof
              fi
            fi
            if [ -z "$target" ]; then
              echo "${environment} platform state did not expose its live DOKS target." >&2
              exit 1
            fi

            TF_VAR_environment="$environment"             TF_VAR_environment_project_id="$project_id"             TF_VAR_doks_ingress_target="$target"             TF_VAR_alert_emails="$alert_emails"             TF_VAR_production_runtime_profile="$runtime_profile"             TF_VAR_production_marketplace_public_enabled="$marketplace_public"             TF_VAR_observability_otlp_headers=plan-only-placeholder               terraform -chdir="$root" plan -lock=false -out="${environment}-platform.tfplan"
            terraform -chdir="$root" show -no-color "${environment}-platform.tfplan"               > "$artifact_root/${environment}-platform-plan.txt"
            terraform -chdir="$root" show -json "${environment}-platform.tfplan"               > "$artifact_root/${environment}-platform-plan.json"
            node scripts/terraform-plan-inspection.mjs list-destructive-changes               "$artifact_root/${environment}-platform-plan.json"               > "$artifact_root/${environment}-platform-delete-set.txt"
            test "$(cat "$artifact_root/${environment}-platform-delete-set.txt")" = "$expected_delete"
            node scripts/terraform-plan-inspection.mjs fingerprint-destructive-changes               "$artifact_root/${environment}-platform-plan.json"               > "$artifact_root/${environment}-platform-fingerprint.txt"
            test "$(cat "$artifact_root/${environment}-platform-fingerprint.txt")" = "$expected_fingerprint"
            rm -f "$state_file" "$root/${environment}-platform.tfplan"
          done

      - name: Summarize and upload decommission plans
        run: |
          {
            echo '## App Platform decommission live plans'
            echo
            echo "- Production approval delete-set: \`digitalocean_app.platform\` (\`landing/production.tfstate\`)"
            echo "- Production fingerprint: \`sha256:6eefaf301867bc08a35bbca0e5b9a68874eaabd2c0970239f2b30e15212cdf29\`"
            echo "- Production plan also removes two inert \`terraform_data\` cutover markers, which the approval contract intentionally excludes:"
            echo "  - \`terraform_data.production_app_platform_parking_preparation[0]\`"
            echo "  - \`terraform_data.production_serving_dns_ttl_preparation[0]\`"
            echo "- Staging delete-set: \`digitalocean_app.platform\` (\`landing/staging.tfstate\`)"
            echo '- Retained diagnostic DNS delete-set: empty'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-platform-decommission-live-plans
          path: artifacts/decommission-live-plans/*
          if-no-files-found: error
          retention-days: 30

  resolve-release:
    name: Resolve Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' && inputs.decommission_plan_only != true
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
    outputs:
      release_commit: ${{ steps.release.outputs.release_commit }}
      deployment_required: ${{ steps.deployment_scope.outputs.deploy }}
      exposure_posture_categories: ${{ steps.deployment_scope.outputs.exposure_posture_categories }}
      exposure_posture_changed: ${{ steps.deployment_scope.outputs.exposure_posture_changed }}
      production_recovery_mode: ${{ steps.recovery_mode.outputs.production_recovery_mode }}
      production_recovery_reason: ${{ steps.recovery_mode.outputs.production_recovery_reason }}
      production_restore_point_required: ${{ steps.recovery_mode.outputs.production_restore_point_required }}
      dispatch_created_at: ${{ steps.dispatch_contract.outputs.dispatch_created_at }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --event-name "${{ github.event_name }}" \
            --release-ref "${{ inputs.release_ref }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate release dispatch contract
        id: dispatch_contract
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          DISPATCH_SOURCE: ${{ inputs.dispatch_source }}
          DISPATCH_RUN_ID: ${{ inputs.dispatch_run_id }}
          DISPATCH_ATTEMPT: ${{ inputs.dispatch_attempt }}
          DISPATCH_REASON: ${{ inputs.reason }}
          EMERGENCY_RELEASE: ${{ inputs.emergency_release == true && 'true' || 'false' }}
          EMERGENCY_REFERENCE: ${{ inputs.emergency_reference }}
        run: |
          set -euo pipefail
          node ./scripts/release-dispatch-contract.mjs

          dispatch_created_at=""
          if [ "$DISPATCH_SOURCE" = "automatic" ]; then
            dispatch_run="$(gh api "repos/${{ github.repository }}/actions/runs/${DISPATCH_RUN_ID}")"
            if ! jq -e \
              --arg commit "$RELEASE_COMMIT" \
              --argjson attempt "$DISPATCH_ATTEMPT" \
              '.name == "Platform Release Candidate Dispatch" and
               .event == "push" and
               .head_branch == "main" and
               .head_sha == $commit and
               .run_attempt == $attempt' <<<"$dispatch_run" >/dev/null; then
              echo "Automatic dispatch provenance does not match the selected release commit." >&2
              exit 1
            fi
            dispatch_created_at="$(jq -r '.created_at' <<<"$dispatch_run")"
          fi
          echo "dispatch_created_at=${dispatch_created_at}" >> "$GITHUB_OUTPUT"

      - name: Validate release checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_check="PR Required"
          release_commit="${{ steps.release.outputs.release_commit }}"
          deadline=$((SECONDS + 1800))

          while true; do
            completed_checks="$(gh api --paginate "repos/${{ github.repository }}/commits/${release_commit}/check-runs?per_page=100" \
              --jq ".check_runs[] | select(.name == \"${required_check}\" and .status == \"completed\") | [.conclusion, .html_url] | @tsv")"
            successful_check_url="$(printf '%s\n' "$completed_checks" | awk -F '\t' '$1 == "success" { print $2; exit }')"

            if [ -n "$successful_check_url" ]; then
              echo "Validated ${required_check}: ${successful_check_url}"
              break
            fi

            failed_check_url="$(printf '%s\n' "$completed_checks" | awk -F '\t' '$1 != "success" { print $2; exit }')"
            if [ -n "$failed_check_url" ]; then
              echo "Release commit ${release_commit} has a completed non-success '${required_check}' check: ${failed_check_url}" >&2
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for '${required_check}' on ${release_commit}." >&2
              exit 1
            fi

            echo "Waiting for '${required_check}' on ${release_commit}..."
            sleep 30
          done

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Resolve deployment scope
        id: deployment_scope
        run: |
          set -euo pipefail
          node ./scripts/release-deployment-scope.mjs \
            --event-name "${{ github.event_name }}" \
            --release-commit "${{ steps.release.outputs.release_commit }}" \
            --force-deploy "${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy == true && 'true' || 'false' }}" \
            --changed-files-out "${RUNNER_TEMP}/release-changed-files.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve production recovery mode
        id: recovery_mode
        run: |
          set -euo pipefail
          node ./scripts/production-recovery-mode.mjs \
            --release-commit "${{ steps.release.outputs.release_commit }}" \
            --changed-files-file "${RUNNER_TEMP}/release-changed-files.json" \
            --force-restore-point "${{ github.event_name == 'workflow_dispatch' && inputs.force_restore_point == true && 'true' || 'false' }}" \
            --recovery-reason "${{ github.event_name == 'workflow_dispatch' && inputs.recovery_reason || '' }}" \
            --out artifacts/release-health/production-recovery-mode.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Known Failure Guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_FAILURE_CIRCUIT_ENFORCEMENT: ${{ vars.DELIVERY_FAILURE_RELEASE_CIRCUIT_ENFORCEMENT == 'true' && 'true' || 'false' }}
        run: |
          node ./scripts/release-health-merge-group-failure-signatures.mjs \
            --command guard \
            --lane release-dispatch \
            --lane staging \
            --lane production \
            --base-sha "${{ steps.release.outputs.release_commit }}" \
            --candidate-sha "${{ steps.release.outputs.release_commit }}" \
            --actor "${{ github.triggering_actor }}" \
            --automatic "${{ inputs.dispatch_source == 'automatic' && 'true' || 'false' }}" \
            --circuit-issue-number "${{ inputs.circuit_issue_number }}" \
            --circuit-reason "${{ inputs.circuit_reason }}" \
            --enforcement "$DELIVERY_FAILURE_CIRCUIT_ENFORCEMENT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

  deployment-contract-preflight:
    name: Preflight Deployment Contract (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: resolve-release
    if: needs.resolve-release.outputs.deployment_required == 'true'
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            argo_rollouts_variable: STAGING_ARGO_ROLLOUTS_ENABLED
          - environment: production
            argo_rollouts_variable: PRODUCTION_ARGO_ROLLOUTS_ENABLED
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Materialize release deployment contract
        id: deployment_contract_inputs
        run: |
          set -euo pipefail
          contract_root="${RUNNER_TEMP}/deployment-contract-release"
          mkdir -p \
            "$contract_root/.github/workflows" \
            "$contract_root/infrastructure/digitalocean/platform"
          cp .github/workflows/platform-production.yml "$contract_root/.github/workflows/platform-production.yml"
          for source_path in \
            infrastructure/digitalocean/platform/main.tf \
            infrastructure/digitalocean/platform/locals.tf \
            infrastructure/digitalocean/platform/variables.tf
          do
            git show "${{ needs.resolve-release.outputs.release_commit }}:${source_path}" > "$contract_root/${source_path}"
          done
          echo "contract_root=${contract_root}" >> "$GITHUB_OUTPUT"

      - name: Preflight deployment contract
        id: deployment_contract
        continue-on-error: true
        env:
          PLATFORM_BOOTSTRAP_OWNER: ${{ vars.PLATFORM_BOOTSTRAP_OWNER || '' }}
          ARGO_ROLLOUTS_ENABLED: ${{ vars[matrix.argo_rollouts_variable] || '' }}
          PRODUCTION_RUNTIME_PROFILE: ${{ vars.PRODUCTION_RUNTIME_PROFILE || '' }}
          PRODUCTION_MARKETPLACE_PUBLIC_ENABLED: ${{ vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED || '' }}
        run: |
          node ./scripts/deployment-contract-preflight.mjs \
            --root-dir "${{ steps.deployment_contract_inputs.outputs.contract_root }}" \
            --environment "${{ matrix.environment }}" \
            --bootstrap-owner-override "$PLATFORM_BOOTSTRAP_OWNER" \
            --production-runtime-profile-override "$PRODUCTION_RUNTIME_PROFILE" \
            --production-marketplace-public-enabled "$PRODUCTION_MARKETPLACE_PUBLIC_ENABLED" \
            --argo-rollouts-enabled "$ARGO_ROLLOUTS_ENABLED" \
            --out "artifacts/deployment-contract/${{ matrix.environment }}.json" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload failed deployment contract
        if: steps.deployment_contract.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-contract-preflight-${{ matrix.environment }}
          path: artifacts/deployment-contract/${{ matrix.environment }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce deployment contract preflight
        if: steps.deployment_contract.outcome == 'failure'
        run: |
          echo "The ${{ matrix.environment }} deployment contract is invalid; refusing image build and environment mutation." >&2
          exit 1

  build-image:
    name: Build Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - resolve-release
      - deployment-contract-preflight
    if: needs.resolve-release.outputs.deployment_required == 'true'
    # Builds the SHA-keyed release image in parallel with any in-flight deploy
    # (no deploy concurrency group), so Deploy Staging reuses it instead of
    # rebuilding inside the serialized deploy lane (issue #1326). The staging
    # environment binding supplies the environment-scoped registry token.
    environment: staging
    outputs:
      platform_image: ${{ steps.release_image_identity.outputs.image }}
      platform_image_digest: ${{ steps.release_image_identity.outputs.digest }}
    env:
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.resolve-release.outputs.release_commit }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: steps.buildx.outcome == 'failure'

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build release image
        id: release_image
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            doctl registry create "$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK" --region nyc3
            registry_name="$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK"
          fi

          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${release_commit}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "Release image ${image} already exists; skipping rebuild."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_tree="$(git rev-parse 'HEAD^{tree}')"
          tree_image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:tree-${release_tree}"
          if docker buildx imagetools inspect "$tree_image" >/dev/null 2>&1; then
            tree_digest="$(docker buildx imagetools inspect "$tree_image" --format '{{.Manifest.Digest}}')"
            docker buildx imagetools create --tag "$image" "$tree_image"
            release_digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
            if [ "$release_digest" != "$tree_digest" ]; then
              echo "Promoted release image digest ${release_digest} did not match merge-queue tree image digest ${tree_digest}." >&2
              exit 1
            fi
            echo "Promoted merge-queue validated image ${tree_image}@${tree_digest} to ${image}@${release_digest}; skipping rebuild and boot smoke."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docker buildx build \
            --pull \
            --cache-from type=gha,scope=platform-image \
            --cache-to type=gha,scope=platform-image,mode=max \
            --load \
            --tag "$image" \
            .
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Boot smoke release image
        if: steps.release_image.outputs.built == 'true'
        env:
          RELEASE_IMAGE: ${{ steps.release_image.outputs.image }}
        run: |
          set -euo pipefail

          # Build-time success does not prove runtime success (issue #1417):
          # start each web component with its deployed command and health check
          # so a non-booting image fails this parallel job before the push and
          # never reaches the deploy lane.
          boot_smoke() {
            component="$1"
            workspace="$2"
            health_path="$3"
            host_port="$4"

            container_id="$(docker run -d \
              -e NODE_ENV=production \
              -e PORT=8080 \
              -p "${host_port}:8080" \
              "$RELEASE_IMAGE" \
              pnpm --filter "$workspace" run start)"

            for _ in $(seq 1 30); do
              if curl --fail --silent --output /dev/null "http://localhost:${host_port}${health_path}"; then
                echo "Boot smoke passed for ${component} (${health_path})."
                docker rm -f "$container_id" >/dev/null
                return 0
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
                break
              fi
              sleep 1
            done

            echo "Boot smoke failed for ${component}: ${health_path} never became healthy." >&2
            docker logs "$container_id" >&2 || true
            docker rm -f "$container_id" >/dev/null || true
            return 1
          }

          boot_smoke marketplace "@chase-sets/app-marketplace-web" /health/ready 18080
          boot_smoke public-web "@chase-sets/app-public-web" / 18081

      - name: Push release image
        if: steps.release_image.outputs.built == 'true'
        env:
          RELEASE_IMAGE: ${{ steps.release_image.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$RELEASE_IMAGE"
          echo "Pushed release image ${RELEASE_IMAGE}"

      - name: Pin release image identity
        id: release_image_identity
        env:
          RELEASE_IMAGE: ${{ steps.release_image.outputs.image }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$RELEASE_IMAGE" --format '{{.Manifest.Digest}}')"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Release image ${RELEASE_IMAGE} did not resolve to an immutable sha256 digest." >&2
            exit 1
          fi
          {
            echo "image=${RELEASE_IMAGE}"
            echo "digest=${digest}"
          } >> "$GITHUB_OUTPUT"
          echo "Pinned candidate ${RELEASE_IMAGE}@${digest}."

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    needs:
      - resolve-release
      - build-image
    if: needs.resolve-release.outputs.deployment_required == 'true'
    environment: staging
    outputs:
      deployed: ${{ steps.staging_applied.outputs.deployed || 'false' }}
      applied: ${{ steps.staging_applied.outputs.applied || 'false' }}
      failure_classification: ${{ steps.staging_failure_classification.outputs.root_cause_code || 'unknown' }}
      root_cause_code: ${{ steps.staging_failure_classification.outputs.root_cause_code || 'unknown' }}
      root_cause_summary: ${{ steps.staging_failure_classification.outputs.root_cause_summary || 'The deployment failed without a known safe classification.' }}
      affected_component: ${{ steps.staging_failure_classification.outputs.affected_component || 'unknown' }}
      root_cause_phase: ${{ steps.staging_failure_classification.outputs.phase || 'unknown' }}
      root_cause_remediation: ${{ steps.staging_failure_classification.outputs.remediation || 'Inspect the redacted provider reason and diagnostic artifacts before retrying or recovering.' }}
      root_cause_provider_reason: ${{ steps.staging_failure_classification.outputs.provider_reason || 'No provider reason was captured.' }}
      root_cause_signature: ${{ steps.staging_failure_classification.outputs.root_cause_signature }}
      platform_image_digest: ${{ steps.image.outputs.digest }}
      active_release_commit: ${{ steps.activate_release.outputs.active_release_commit }}
      active_image_digest: ${{ steps.activate_release.outputs.active_image_digest }}
      activated_at: ${{ steps.activate_release.outputs.activated_at }}
      superseded: ${{ steps.activate_release.outputs.superseded || 'false' }}
      superseded_by_commit: ${{ steps.activate_release.outputs.latest_main }}
      started_at: ${{ steps.staging_started.outputs.started_at }}
      completed_at: ${{ steps.staging_completed.outputs.completed_at }}
      buy_now_probe_result: ${{ steps.buy_now_probes.outputs.result }}
      buy_now_probe_promotion_decision: ${{ steps.buy_now_probes.outputs.promotion_decision }}
      buy_now_probe_guest_failure_reason: ${{ steps.buy_now_probes.outputs.guest_failure_reason }}
      buy_now_probe_account_failure_reason: ${{ steps.buy_now_probes.outputs.account_failure_reason }}
      buy_now_probe_started_at: ${{ steps.buy_now_probes.outputs.started_at }}
      buy_now_probe_completed_at: ${{ steps.buy_now_probes.outputs.completed_at }}
      # #2516: account-cart post-write consistency promoted alongside the Buy
      # Now probes as a required migrated canary. Unlike Buy Now, the probe is
      # a doc-backed observation (issue #1810) rather than a self-driving
      # browser flow, so it blocks promotion only when an observation is
      # configured; otherwise it reports an explicit coverage-gap warning
      # instead of silently passing.
      account_cart_canary_result: ${{ steps.account_cart_canary.outputs.result || 'skipped' }}
      account_cart_canary_promotion_decision: ${{ steps.account_cart_canary.outputs.promotion_decision || 'skipped' }}
      account_cart_canary_configured: ${{ steps.account_cart_canary.outputs.configured || 'false' }}
      account_cart_canary_started_at: ${{ steps.account_cart_canary.outputs.started_at }}
      account_cart_canary_completed_at: ${{ steps.account_cart_canary.outputs.completed_at }}
      advisory_dispatch_result: ${{ steps.dispatch_advisory_evidence.outcome || 'skipped' }}
    concurrency:
      group: platform-deploy-staging
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: staging
      TF_VAR_environment_project_id: ${{ vars.DIGITALOCEAN_PROJECT_ID || '' }}
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: ${{ needs.resolve-release.outputs.release_commit }}
      TF_VAR_checkout_shopify_simple_kill_switch_active: ${{ vars.CHECKOUT_SHOPIFY_SIMPLE_KILL_SWITCH_ACTIVE == 'true' && 'true' || 'false' }}
      TF_VAR_alert_emails: ${{ vars.PLATFORM_ALERT_EMAILS || '[]' }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
      TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
      TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_accounts_api: ${{ vars.STRIPE_CONNECT_ACCOUNTS_API || 'v2' }}
      TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
      TF_VAR_ucp_business_signing_key_id: ${{ secrets.UCP_BUSINESS_SIGNING_KEY_ID || '' }}
      TF_VAR_ucp_business_signing_alg: ${{ secrets.UCP_BUSINESS_SIGNING_ALG || 'ES256' }}
      TF_VAR_ucp_business_signing_private_jwk: ${{ secrets.UCP_BUSINESS_SIGNING_PRIVATE_JWK || '' }}
      TF_VAR_ucp_business_signing_previous_public_jwks: ${{ secrets.UCP_BUSINESS_SIGNING_PREVIOUS_PUBLIC_JWKS || '[]' }}
      TF_VAR_ucp_ap2_verifier_url: ${{ secrets.UCP_AP2_VERIFIER_URL || '' }}
      TF_VAR_ucp_ap2_verifier_auth_token: ${{ secrets.UCP_AP2_VERIFIER_AUTH_TOKEN || '' }}
      TF_VAR_ucp_ap2_verifier_timeout_ms: ${{ secrets.UCP_AP2_VERIFIER_TIMEOUT_MS || '5000' }}
      TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
      TF_VAR_voyage_api_key: ${{ secrets.VOYAGE_API_KEY || '' }}
      TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
      TF_VAR_easypost_webhook_secret: ${{ secrets.EASYPOST_WEBHOOK_SECRET || '' }}
      TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
      TF_VAR_tcgplayer_automation_tcg_auth_cookie: ${{ secrets.TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE || '' }}
      TF_VAR_scrydex_api_key: ${{ secrets.SCRYDEX_API_KEY || '' }}
      TF_VAR_scrydex_team_id: ${{ secrets.SCRYDEX_TEAM_ID || '' }}
      TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
      TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
      TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
      TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
      TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
      TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
      TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
      TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
      TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
      TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
      TF_VAR_observability_enabled: ${{ vars.OBSERVABILITY_ENABLED == 'false' && 'false' || 'true' }}
      TF_VAR_observability_otlp_endpoint: ${{ vars.OBSERVABILITY_OTLP_ENDPOINT || '' }}
      TF_VAR_observability_otlp_headers: ${{ secrets.OBSERVABILITY_OTLP_HEADERS || '' }}
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
      CHASE_SETS_HELM_RELEASE: chase-sets-platform
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
      CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT: 15m
      ARGO_ROLLOUTS_ENABLED: ${{ vars.STAGING_ARGO_ROLLOUTS_ENABLED == 'true' && 'true' || 'false' }}
      BETA_WAVE_SIZE: ${{ vars.BETA_WAVE_SIZE || '100' }}
      BETA_WAVE_ROLLOUT_EXPOSURE_PERCENT: ${{ vars.BETA_WAVE_ROLLOUT_EXPOSURE_PERCENT || '10' }}
      # The same checked-in approval gates an identical retired App Platform
      # delete address and fingerprint in both long-lived environment states.
      DESTRUCTIVE_CHANGE_ALLOW_FILE: .github/deployment/production-destructive-change-approved.md
      # DOKS ingress load balancer IPv4 for live serving and retained diagnostics.
      DOKS_INGRESS_TARGET: ${{ vars.DOKS_INGRESS_TARGET || '' }}
      TF_VAR_doks_ingress_target: ${{ vars.DOKS_INGRESS_TARGET || '' }}
    steps:
      - name: Record staging start
        id: staging_started
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check out release commit
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          git checkout --detach "$release_commit"
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$release_commit" ]; then
            echo "Checked out ${checked_out_commit}, expected release commit ${release_commit}." >&2
            exit 1
          fi

      - name: Validate staging configuration
        if: env.SHOULD_DEPLOY != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url \
            TF_VAR_stripe_secret_key \
            TF_VAR_stripe_publishable_key \
            TF_VAR_stripe_webhook_secret \
            TF_VAR_stripe_connect_webhook_secret \
            TF_VAR_easypost_api_key
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required staging configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ "${TF_VAR_observability_enabled:-true}" != "false" ] && [ -z "${TF_VAR_observability_otlp_headers:-}" ]; then
            echo "Staging observability requires OBSERVABILITY_OTLP_HEADERS secret or OBSERVABILITY_ENABLED=false." >&2
            exit 1
          fi

          if [[ "${TF_VAR_stripe_secret_key}" != sk_test* || "${TF_VAR_stripe_publishable_key}" != pk_test* ]]; then
            echo "Staging requires dedicated Stripe test-mode keys; production live-mode keys must not be used in the staging GitHub Environment." >&2
            exit 1
          fi

          if [ "${TF_VAR_notification_email_provider:-}" = "amazon-ses" ]; then
            ses_missing=()
            for name in \
              TF_VAR_ses_aws_region \
              TF_VAR_ses_aws_access_key_id \
              TF_VAR_ses_aws_secret_access_key \
              TF_VAR_ses_from_email \
              TF_VAR_ses_configuration_set_name \
              TF_VAR_ses_source_arn
            do
              if [ -z "${!name:-}" ]; then
                ses_missing+=("$name")
              fi
            done

            if [ "${#ses_missing[@]}" -gt 0 ]; then
              printf 'Missing required staging SES configuration: %s\n' "${ses_missing[*]}" >&2
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-pnpm-workspace
        if: env.SHOULD_DEPLOY != 'false'

      - name: Install dependencies
        if: env.SHOULD_DEPLOY != 'false'
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.SHOULD_DEPLOY != 'false'
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        if: env.SHOULD_DEPLOY != 'false'
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Package staged doctl binary
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          doctl_path="$(command -v doctl)"
          mkdir -p artifacts/deploy-tools/doctl
          cp "$doctl_path" artifacts/deploy-tools/doctl/doctl
          chmod +x artifacts/deploy-tools/doctl/doctl
          ./artifacts/deploy-tools/doctl/doctl version

      - name: Upload staged doctl binary
        if: env.SHOULD_DEPLOY != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-doctl-linux-amd64
          path: artifacts/deploy-tools/doctl/doctl
          if-no-files-found: error
          retention-days: 1

      - name: Terraform init staging environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=environment-dns/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format staging environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        run: terraform fmt -check -recursive

      - name: Terraform validate staging environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        run: terraform validate

      # This is the final cheap candidate check. No staging resource has been
      # mutated yet. Once it succeeds, the commit and image digest below are
      # the immutable active release through promotion, failure, or rollback.
      - name: Activate immutable release before staging mutation
        id: activate_release
        if: env.SHOULD_DEPLOY != 'false'
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          RELEASE_IMAGE_DIGEST: ${{ needs.build-image.outputs.platform_image_digest }}
          AUTOMATIC_RELEASE: ${{ inputs.dispatch_source == 'automatic' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Candidate ${RELEASE_COMMIT} has no immutable release image digest; refusing staging mutation." >&2
            exit 1
          fi

          latest_main="$RELEASE_COMMIT"
          if [ "$AUTOMATIC_RELEASE" = "true" ]; then
            git fetch origin main
            latest_main="$(git rev-parse origin/main)"
            if [ "$RELEASE_COMMIT" != "$latest_main" ]; then
              echo "Candidate ${RELEASE_COMMIT} was coalesced into latest pending ${latest_main} before staging mutation."
              {
                echo "superseded=true"
                echo "latest_main=${latest_main}"
              } >> "$GITHUB_OUTPUT"
              echo "SHOULD_DEPLOY=false" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          {
            echo "superseded=false"
            echo "latest_main=${latest_main}"
            echo "active_release_commit=${RELEASE_COMMIT}"
            echo "active_image_digest=${RELEASE_IMAGE_DIGEST}"
            echo "activated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
          echo "Activated immutable release ${RELEASE_COMMIT}@${RELEASE_IMAGE_DIGEST}."

      - name: Terraform apply staging environment DNS
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/environment-dns
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_google_workspace_dkim_txt_value: ${{ vars.GOOGLE_WORKSPACE_DKIM_TXT_VALUE || '' }}
          TF_VAR_doks_ingress_target: ${{ env.DOKS_INGRESS_TARGET }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/release-health"
          terraform apply -auto-approve \
            2> >(tee "${GITHUB_WORKSPACE}/artifacts/release-health/staging-terraform-diagnostics.txt" >&2)

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        if: env.SHOULD_DEPLOY != 'false'
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: env.SHOULD_DEPLOY != 'false' && steps.buildx.outcome == 'failure'

      - name: Verify immutable active release image
        if: env.SHOULD_DEPLOY != 'false'
        id: image
        env:
          ACTIVE_RELEASE_IMAGE: ${{ needs.build-image.outputs.platform_image }}
          ACTIVE_RELEASE_IMAGE_DIGEST: ${{ steps.activate_release.outputs.active_image_digest }}
        run: |
          set -euo pipefail
          doctl registry login --expiry-seconds 3600
          if ! docker buildx imagetools inspect "$ACTIVE_RELEASE_IMAGE" >/dev/null; then
            echo "Active release image ${ACTIVE_RELEASE_IMAGE} no longer exists." >&2
            exit 1
          fi
          observed_digest="$(docker buildx imagetools inspect "$ACTIVE_RELEASE_IMAGE" --format '{{.Manifest.Digest}}')"
          if [ "$observed_digest" != "$ACTIVE_RELEASE_IMAGE_DIGEST" ]; then
            echo "Active release image digest changed from ${ACTIVE_RELEASE_IMAGE_DIGEST} to ${observed_digest}." >&2
            exit 1
          fi
          {
            echo "image=${ACTIVE_RELEASE_IMAGE}"
            echo "digest=${ACTIVE_RELEASE_IMAGE_DIGEST}"
          } >> "$GITHUB_OUTPUT"
          echo "TF_VAR_platform_image_digest=${ACTIVE_RELEASE_IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "Verified immutable active release ${ACTIVE_RELEASE_IMAGE}@${ACTIVE_RELEASE_IMAGE_DIGEST}."

      - name: Terraform init
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Terraform plan
        if: env.SHOULD_DEPLOY != 'false'
        id: terraform_plan
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/release-health"
          terraform plan -out=tfplan \
            2> >(tee "${GITHUB_WORKSPACE}/artifacts/release-health/staging-terraform-diagnostics.txt" >&2)
          mkdir -p artifacts/terraform-plans
          terraform show -no-color tfplan > artifacts/terraform-plans/staging-tfplan.txt
          terraform show -json tfplan > artifacts/terraform-plans/staging-tfplan.json
          node ../../../scripts/terraform-plan-inspection.mjs summarize-plan artifacts/terraform-plans/staging-tfplan.json --title="Staging Terraform plan" >> "$GITHUB_STEP_SUMMARY"
          echo "plan_written=true" >> "$GITHUB_OUTPUT"
          node ../../../scripts/terraform-plan-inspection.mjs assert-no-destructive-changes tfplan --allow-file="../../../${DESTRUCTIVE_CHANGE_ALLOW_FILE}"

      - name: Upload staging Terraform plan
        if: always() && env.SHOULD_DEPLOY != 'false' && steps.terraform_plan.outputs.plan_written == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-terraform-plan
          path: infrastructure/digitalocean/platform/artifacts/terraform-plans/staging-tfplan.txt
          if-no-files-found: error
          retention-days: 30

      - name: Terraform apply
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/release-health"
          terraform apply -auto-approve tfplan \
            2> >(tee "${GITHUB_WORKSPACE}/artifacts/release-health/staging-terraform-diagnostics.txt" >&2)

      - name: Capture staging Terraform errored state
        if: failure() && env.SHOULD_DEPLOY != 'false'
        id: capture_staging_terraform_errored_state
        working-directory: infrastructure/digitalocean/platform
        run: |
          set -euo pipefail

          state_path="errored.tfstate"
          artifact_path="artifacts/terraform-errored-state/staging-errored.tfstate"
          if [ -f "$state_path" ]; then
            mkdir -p "$(dirname "$artifact_path")"
            cp "$state_path" "$artifact_path"
            echo "captured=true" >> "$GITHUB_OUTPUT"
            echo "### Staging Terraform errored state" >> "$GITHUB_STEP_SUMMARY"
            echo "Captured sensitive recovery artifact \`sensitive-staging-terraform-errored-state-recovery-only\` with 1-day retention. Do not print or share its contents." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "captured=false" >> "$GITHUB_OUTPUT"
            echo "### Staging Terraform errored state" >> "$GITHUB_STEP_SUMMARY"
            echo "No \`errored.tfstate\` file was present after Terraform apply failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload staging Terraform errored state
        if: failure() && env.SHOULD_DEPLOY != 'false' && steps.capture_staging_terraform_errored_state.outputs.captured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensitive-staging-terraform-errored-state-recovery-only
          path: infrastructure/digitalocean/platform/artifacts/terraform-errored-state/staging-errored.tfstate
          if-no-files-found: error
          retention-days: 1

      - name: Configure staging Kubernetes context
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-staging.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -z "$cluster_id" ] && [ -z "$cluster_name" ]; then
              cluster_address="$(
                terraform state list \
                  | awk '/(^|\.)digitalocean_kubernetes_cluster\./ { print; exit }'
              )"
              if [ -n "$cluster_address" ]; then
                echo "Using staging DOKS cluster Terraform state address ${cluster_address}." >&2
                cluster_state="$(terraform state show -no-color "$cluster_address")"
                cluster_id="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "id") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
                cluster_name="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "name") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
              fi
            fi
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure staging Kubernetes context." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Staging Kubernetes kubeconfig is present but has no current context after Terraform and DigitalOcean refresh attempts." >&2
            KUBECONFIG="$kubeconfig" kubectl config get-contexts || true
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured staging Kubernetes context: ${current_context}"

      - name: Install Argo Rollouts kubectl plugin for staging
        if: env.SHOULD_DEPLOY != 'false' && env.ARGO_ROLLOUTS_ENABLED == 'true'
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/kubectl-argo-rollouts"
          curl --fail --location --silent --show-error \
            https://github.com/argoproj/argo-rollouts/releases/download/v1.9.0/kubectl-argo-rollouts-linux-amd64 \
            --output "$binary"
          echo "d1c98f59f6d3716b7a35aa540506764700a358448dd6a10e92381b7aa294d00b  ${binary}" | sha256sum --check
          chmod +x "$binary"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
          "$binary" version >/dev/null 2>&1 || "$binary" --help >/dev/null

      - name: Install Argo Rollouts controller and CRDs for staging
        if: env.SHOULD_DEPLOY != 'false' && env.ARGO_ROLLOUTS_ENABLED == 'true'
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/argo-rollouts-install.yaml"
          curl --fail --location --silent --show-error \
            https://github.com/argoproj/argo-rollouts/releases/download/v1.9.0/install.yaml \
            --output "$manifest"
          echo "6d23b368a668065958124c5670d7c94d8656034fe1b48f6af73b7aecaceea674  ${manifest}" | sha256sum --check
          kubectl create namespace argo-rollouts --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argo-rollouts --server-side --force-conflicts -f "$manifest"
          kubectl wait --for condition=Established --timeout=120s \
            crd/rollouts.argoproj.io crd/analysistemplates.argoproj.io crd/analysisruns.argoproj.io
          kubectl -n argo-rollouts rollout status deployment/argo-rollouts --timeout=300s

          keda_manifest="${RUNNER_TEMP}/keda-install.yaml"
          curl --fail --location --silent --show-error \
            https://github.com/kedacore/keda/releases/download/v2.17.2/keda-2.17.2.yaml \
            --output "$keda_manifest"
          echo "1912c29059e41e80b6abe8b29a566e07337f85fc4bf4fd5698c637fe63ecbf35  ${keda_manifest}" | sha256sum --check
          kubectl apply --server-side --force-conflicts -f "$keda_manifest"
          kubectl wait --for condition=Established --timeout=120s \
            crd/scaledobjects.keda.sh crd/scaledjobs.keda.sh crd/triggerauthentications.keda.sh
          kubectl -n keda rollout status deployment/keda-operator --timeout=300s

      - name: Export staging Kubernetes database URLs
        if: env.SHOULD_DEPLOY != 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DEPLOYMENT_ENVIRONMENT: staging
        run: |
          set -euo pipefail
          state_path="${RUNNER_TEMP}/platform-staging.tfstate.json"
          terraform -chdir=infrastructure/digitalocean/platform state pull > "$state_path"
          node ./scripts/platform-kubernetes-secret.mjs \
            --export-database-urls "$state_path" \
            --database-environment staging \
            --query-connection-mode pooled

      - name: Apply staging Kubernetes runtime secrets
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          export CATALOG_ASSET_S3_ACCESS_KEY_ID="${TF_VAR_spaces_access_id:-}"
          export CATALOG_ASSET_S3_SECRET_ACCESS_KEY="${TF_VAR_spaces_secret_key:-}"
          export CHASE_SETS_DISCORD_INVITE_URL="${TF_VAR_discord_invite_url:-}"
          export EASYPOST_API_KEY="${TF_VAR_easypost_api_key:-}"
          export VOYAGE_API_KEY="${TF_VAR_voyage_api_key:-}"
          export EASYPOST_WEBHOOK_SECRET="${TF_VAR_easypost_webhook_secret:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_facebook_social_login_client_id:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_facebook_social_login_client_secret:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_google_social_login_client_id:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_google_social_login_client_secret:-}"
          export OTEL_EXPORTER_OTLP_HEADERS="${TF_VAR_observability_otlp_headers:-}"
          export PLATFORM_ADMIN_EMAIL="${TF_VAR_platform_admin_email:-}"
          export PLATFORM_ADMIN_PASSWORD="${TF_VAR_platform_admin_password:-}"
          export PLATFORM_INTERNAL_AUTH_SECRET="${TF_VAR_platform_internal_auth_secret:-}"
          export SCRYDEX_API_KEY="${TF_VAR_scrydex_api_key:-}"
          export SCRYDEX_TEAM_ID="${TF_VAR_scrydex_team_id:-}"
          export SES_AWS_ACCESS_KEY_ID="${TF_VAR_ses_aws_access_key_id:-}"
          export SES_AWS_SECRET_ACCESS_KEY="${TF_VAR_ses_aws_secret_access_key:-}"
          export SES_SOURCE_ARN="${TF_VAR_ses_source_arn:-}"
          export STRIPE_CONNECT_WEBHOOK_SECRET="${TF_VAR_stripe_connect_webhook_secret:-}"
          export STRIPE_PUBLISHABLE_KEY="${TF_VAR_stripe_publishable_key:-}"
          export STRIPE_SECRET_KEY="${TF_VAR_stripe_secret_key:-}"
          export STRIPE_WEBHOOK_SECRET="${TF_VAR_stripe_webhook_secret:-}"
          export UCP_BUSINESS_SIGNING_KEY_ID="${TF_VAR_ucp_business_signing_key_id:-}"
          export UCP_BUSINESS_SIGNING_ALG="${TF_VAR_ucp_business_signing_alg:-ES256}"
          export UCP_BUSINESS_SIGNING_PRIVATE_JWK="${TF_VAR_ucp_business_signing_private_jwk:-}"
          export UCP_BUSINESS_SIGNING_PREVIOUS_PUBLIC_JWKS="${TF_VAR_ucp_business_signing_previous_public_jwks:-[]}"
          export UCP_AP2_VERIFIER_URL="${TF_VAR_ucp_ap2_verifier_url:-}"
          export UCP_AP2_VERIFIER_AUTH_TOKEN="${TF_VAR_ucp_ap2_verifier_auth_token:-}"
          export UCP_AP2_VERIFIER_TIMEOUT_MS="${TF_VAR_ucp_ap2_verifier_timeout_ms:-5000}"
          export TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE="${TF_VAR_tcgplayer_automation_tcg_auth_cookie:-}"

          node ./scripts/platform-kubernetes-secret.mjs \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --deployment-environment staging \
            --observability-enabled "${TF_VAR_observability_enabled:-true}"

      - name: Apply staging Kubernetes registry pull secret
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry is required before staging Kubernetes deploys can pull images." >&2
            exit 1
          fi

          registry_pull_secret_name="registry-${registry_name}"
          docker_config="$(mktemp)"
          trap 'rm -f "$docker_config"' EXIT
          doctl registry docker-config --expiry-seconds 3600 > "$docker_config"
          kubectl create secret generic "$registry_pull_secret_name" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --from-file=.dockerconfigjson="$docker_config" \
            --type=kubernetes.io/dockerconfigjson \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          echo "CHASE_SETS_IMAGE_PULL_SECRET_NAME=${registry_pull_secret_name}" >> "$GITHUB_ENV"

      - name: Deploy staging Kubernetes release
        if: env.SHOULD_DEPLOY != 'false'
        env:
          PLATFORM_IMAGE_REF: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          catalog_asset_public_base_url="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_public_base_url)"
          catalog_asset_s3_bucket="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_bucket)"
          catalog_asset_s3_endpoint="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_endpoint)"
          catalog_asset_s3_region="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_region)"
          if [ -z "$catalog_asset_public_base_url" ] || [ -z "$catalog_asset_s3_bucket" ] || [ -z "$catalog_asset_s3_endpoint" ] || [ -z "$catalog_asset_s3_region" ]; then
            echo "Staging catalog asset runtime env outputs are required before Kubernetes deploy." >&2
            exit 1
          fi

          # Per-domain base URLs come from Terraform's environment-domain
          # outputs. The DOKS Helm chart bakes these as ""
          # (see envValueDefaults in render-platform-helm-values.mjs), so without
          # threading them the DOKS public-web falls back to the hardcoded
          # production canonical origin (https://chasesets.com) on staging.
          landing_domain="$(terraform -chdir=infrastructure/digitalocean/platform output -raw landing_domain)"
          marketplace_domain="$(terraform -chdir=infrastructure/digitalocean/platform output -json marketplace_domains | jq -r 'first(.[]) // empty')"
          if [ -z "$landing_domain" ]; then
            echo "Staging landing domain output is required before Kubernetes deploy." >&2
            exit 1
          fi

          # Optional provider endpoint/origin overrides are only passed when set:
          # the deploy script fails closed on empty --runtime-env values, and the
          # Helm chart env defaults carry the canonical posture when a repository
          # variable is unset (mirrors platform-pr.yml).
          optional_runtime_env=()
          add_optional_runtime_env() {
            if [ -n "$2" ]; then
              optional_runtime_env+=(--runtime-env "$1=$2")
            fi
          }
          add_optional_runtime_env "CHASE_SETS_MARKETPLACE_ORIGIN" "${marketplace_domain:+https://${marketplace_domain}}"
          add_optional_runtime_env "SES_AWS_REGION" "${TF_VAR_ses_aws_region:-}"
          add_optional_runtime_env "SES_FROM_EMAIL" "${TF_VAR_ses_from_email:-}"
          add_optional_runtime_env "SES_CONFIGURATION_SET_NAME" "${TF_VAR_ses_configuration_set_name:-}"
          add_optional_runtime_env "STRIPE_API_BASE_URL" "${TF_VAR_stripe_api_base_url:-}"
          add_optional_runtime_env "EASYPOST_API_BASE_URL" "${TF_VAR_easypost_api_base_url:-}"

          # Keep the deploy-critical pre-upgrade hook aligned with production:
          # only schemas and the two long-lived bootstrap profiles belong there.
          # Scenario data is reconciled after this rollout by a separate Job,
          # while the worker fleet is available to drain projections.
          pnpm run platform:kubernetes-deployment -- deploy \
            --image "$PLATFORM_IMAGE_REF" \
            --image-pull-secret "$CHASE_SETS_IMAGE_PULL_SECRET_NAME" \
            --runtime-env "DEPLOYMENT_ENVIRONMENT=staging" \
            --runtime-env "OBSERVABILITY_ENABLED=${TF_VAR_observability_enabled:-true}" \
            --runtime-env "CHASE_SETS_RUNTIME_PROFILE=public" \
            --runtime-env "PLATFORM_DATA_PROFILES=critical-bootstrap,catalog-integration-bootstrap" \
            --runtime-env "ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS=${TF_VAR_admin_google_workspace_hosted_domains:-}" \
            --runtime-env "CHASE_SETS_PUBLIC_ORIGIN=https://${landing_domain}" \
            --runtime-env "NOTIFICATION_EMAIL_PROVIDER=${TF_VAR_notification_email_provider:-noop}" \
            --runtime-env "STRIPE_CONNECT_ACCOUNTS_API=${TF_VAR_stripe_connect_accounts_api:-v2}" \
            --runtime-env "EASYPOST_MODE=${TF_VAR_easypost_mode:-test}" \
            --runtime-env "CATALOG_ASSET_PUBLIC_BASE_URL=${catalog_asset_public_base_url}" \
            --runtime-env "CATALOG_ASSET_S3_BUCKET=${catalog_asset_s3_bucket}" \
            --runtime-env "CATALOG_ASSET_S3_ENDPOINT=${catalog_asset_s3_endpoint}" \
            --runtime-env "CATALOG_ASSET_S3_REGION=${catalog_asset_s3_region}" \
            "${optional_runtime_env[@]}" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --rollouts-enabled "$ARGO_ROLLOUTS_ENABLED" \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT"

      - name: Capture staging Kubernetes deploy diagnostics
        if: failure() && env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health
          pnpm run platform:kubernetes-deployment -- diagnostics \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --out artifacts/release-health/staging-kubernetes-deploy-diagnostics.json || true

      - name: Upload staging Kubernetes deploy diagnostics
        if: always() && env.SHOULD_DEPLOY != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-kubernetes-deploy-diagnostics
          path: artifacts/release-health/staging-kubernetes-deploy-diagnostics.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Wait for staging ingress URLs
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          mapfile -t marketplace_domains < <(terraform output -json marketplace_domains | jq -r '.[]')
          mapfile -t staging_root_marketplace_domains < <(terraform output -json staging_root_marketplace_domains | jq -r '.[]')
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ "${#marketplace_domains[@]}" -eq 0 ] || [ "${#staging_root_marketplace_domains[@]}" -eq 0 ]; then
            echo "Required staging domains were not present in Terraform outputs." >&2
            exit 1
          fi

          # #5564: probe exactly the 4 hosts DOKS serves (landing, admin,
          # marketplace, staging-root — matching buildDoksIngressHosts() in
          # scripts/render-platform-helm-values.mjs). The legacy
          # landing-/marketplace-/admin-staging redirect hostnames were
          # retired outright (#5568): their DNS ALIAS records and App
          # Platform redirect plumbing are deleted, not rewired to DOKS.
          ingress_urls=(
            "https://${landing_domain}/health/ready"
            "https://${admin_domain}/health/ready"
          )
          for hostname in "${marketplace_domains[@]}" "${staging_root_marketplace_domains[@]}"; do
            ingress_urls+=("https://${hostname}/health/ready")
          done

          ingress_args=()
          for url in "${ingress_urls[@]}"; do
            ingress_args+=(--url "$url")
          done

          cd ../../..
          # Bounded transient readiness budget (60 x 30s) for genuinely-warming
          # backends, but fail fast on a deterministic ingress topology defect
          # (#5498): once a ready ingress returns a stable 404 on the same URL
          # for --topology-streak consecutive probes past the --warmup-grace-ms
          # window, stop and hold the promotion with an actionable diagnostic
          # instead of burning the full ~30-minute budget.
          node ./scripts/platform-ingress-wait.mjs \
            --attempts 60 \
            --delay-ms 30000 \
            --topology-streak 4 \
            --warmup-grace-ms 60000 \
            "${ingress_args[@]}"

      - name: Dispatch advisory staging evidence
        id: dispatch_advisory_evidence
        if: env.SHOULD_DEPLOY != 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          PLATFORM_IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          gh workflow run platform-staging-advisory-evidence.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            --field release_commit="$RELEASE_COMMIT" \
            --field platform_image="$PLATFORM_IMAGE" \
            --field platform_image_digest="$PLATFORM_IMAGE_DIGEST"
          echo "Dispatched advisory staging evidence for ${RELEASE_COMMIT}@${PLATFORM_IMAGE_DIGEST}."

      - name: Smoke check
        timeout-minutes: 12
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_admin_google_workspace_hosted_domains: ${{ vars.ADMIN_GOOGLE_WORKSPACE_HOSTED_DOMAINS || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_MARKETPLACE: "true"
          SMOKE_REQUIRE_MARKETPLACE_ROOT: "true"
          SMOKE_WRITE_WAITLIST: "false"
          SMOKE_SOURCE: staging-smoke
          SMOKE_UTM_CAMPAIGN: staging-main
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
          SMOKE_FETCH_TIMEOUT_MS: "15000"
        run: |
          set -euo pipefail
          echo "Smoking the live staging hosts served by DOKS."
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          catalog_asset_public_base_url="$(terraform output -raw catalog_asset_public_base_url)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          staging_root_marketplace_domain="$(terraform output -json staging_root_marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ -z "$catalog_asset_public_base_url" ] || [ -z "$marketplace_domain" ] || [ -z "$staging_root_marketplace_domain" ]; then
            echo "Required staging smoke domains were not present in Terraform outputs." >&2
            exit 1
          fi

          if [ -n "$TF_VAR_google_social_login_client_id" ] &&
            [ -n "$TF_VAR_google_social_login_client_secret" ] &&
            [ -n "$TF_VAR_facebook_social_login_client_id" ] &&
            [ -n "$TF_VAR_facebook_social_login_client_secret" ]; then
            export SMOKE_REQUIRE_SOCIAL_LOGIN=true
          else
            export SMOKE_REQUIRE_SOCIAL_LOGIN=false
          fi

          cd ../../..
          export MARKETPLACE_ROOT_WEB_URL="https://${staging_root_marketplace_domain}"
          pnpm run smoke:platform -- \
            "https://${landing_domain}" \
            "https://${admin_domain}" \
            "https://${marketplace_domain}"
          catalog_asset_root_status=""
          for attempt in $(seq 1 12); do
            catalog_asset_root_status="$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' \
              "${catalog_asset_public_base_url}/" || true)"
            echo "Catalog asset CDN root status ${catalog_asset_root_status} on attempt ${attempt}."
            if [ "$catalog_asset_root_status" = "403" ]; then
              break
            fi
            sleep 10
          done
          if [ "$catalog_asset_root_status" != "403" ]; then
            echo "Catalog asset CDN root must stay protected; expected 403, got ${catalog_asset_root_status:-none}." >&2
            exit 1
          fi
          echo "Catalog asset CDN root returned expected protected status 403."

      - name: Resolve Playwright Chromium version
        id: staging-playwright-chromium
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "Could not resolve Playwright version from pnpm-lock.yaml." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium for staging critical flows
        id: staging-playwright-chromium-cache
        if: env.SHOULD_DEPLOY != 'false'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.staging-playwright-chromium.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium for staging critical flows
        if: env.SHOULD_DEPLOY != 'false'
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Await staging projection convergence
        id: projection_convergence_gate
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          PROJECTION_CONVERGENCE_BUDGET_MS: ${{ vars.STAGING_PROJECTION_CONVERGENCE_BUDGET_MS || '300000' }}
          PROJECTION_CONVERGENCE_POLL_INTERVAL_MS: ${{ vars.STAGING_PROJECTION_CONVERGENCE_POLL_INTERVAL_MS || '5000' }}
          PROJECTION_CONVERGENCE_PROJECTION_NAMES: ${{ vars.STAGING_PROJECTION_CONVERGENCE_PROJECTION_NAMES || 'all' }}
        run: |
          set -euo pipefail
          admin_domain="$(terraform output -raw admin_domain)"
          if [ -z "$admin_domain" ]; then
            echo "Required staging admin domain was not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          gate_out=artifacts/release-health/staging-projection-convergence-gate.json
          # Bounded convergence gate (issue #4709): every deploy rolls the fleet, so the
          # Buy Now freshness probes race post-rollout projection replay. Wait for the
          # staging projection-status surface to report all groups caught-up (or spend the
          # budget) before probing. This never blocks promotion on its own; the probe step
          # that follows still fails loudly on steady-state SLO breaches.
          set +e
          pnpm run guest-buy-now:freshness-probe -- \
            --convergence-gate \
            --environment staging \
            --admin-base-url "https://${admin_domain}" \
            --convergence-budget-ms "${PROJECTION_CONVERGENCE_BUDGET_MS}" \
            --convergence-poll-interval-ms "${PROJECTION_CONVERGENCE_POLL_INTERVAL_MS}" \
            --convergence-projection-names "${PROJECTION_CONVERGENCE_PROJECTION_NAMES}" \
            --out "$gate_out"
          gate_exit=$?
          set -e
          converged="$(jq -r '.gate.converged // "unknown"' "$gate_out" 2>/dev/null || echo unknown)"
          converged_after_ms="$(jq -r '.gate.convergedAfterMs // "did not converge"' "$gate_out" 2>/dev/null || echo unknown)"
          lagging="$(jq -r '(.gate.final.laggingGroups // []) | join(", ")' "$gate_out" 2>/dev/null || echo "")"
          {
            echo "## Staging projection convergence gate"
            echo ""
            echo "| Converged | Converged after (ms) | Budget (ms) | Lagging groups |"
            echo "| --- | --- | --- | --- |"
            echo "| ${converged} | ${converged_after_ms} | ${PROJECTION_CONVERGENCE_BUDGET_MS} | ${lagging:-none} |"
            echo ""
            echo "Bounded pre-probe gate (issue #4709): waits for staging projections to catch up after the fleet rollout before the Buy Now freshness probes run. Timing gate only; does not block promotion."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$gate_exit" -ne 0 ]; then
            echo "Staging projection convergence gate failed to run (exit ${gate_exit})." >&2
            exit 1
          fi

      - name: Staging Buy Now freshness probes
        id: buy_now_probes
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          GUEST_BUY_NOW_PROBE_ITEM_PATH: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ITEM_PATH || '' }}
          GUEST_BUY_NOW_PROBE_SEARCH_QUERY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_SEARCH_QUERY || 'air balloon' }}
          GUEST_BUY_NOW_PROBE_FIXTURE_KEY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_FIXTURE_KEY || 'staging-guest-buy-now-fixture' }}
          GUEST_BUY_NOW_PROBE_TIMEOUT_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_TIMEOUT_MS || '45000' }}
          GUEST_BUY_NOW_PROBE_READY_SLO_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_READY_SLO_MS || '10000' }}
          GUEST_BUY_NOW_PROBE_SLO_MODE: ${{ vars.GUEST_BUY_NOW_CANARY_SLO_MODE || 'warn' }}
          GUEST_BUY_NOW_PROBE_ATTEMPTS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ATTEMPTS || '3' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_BUDGET_MS || '120000' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_POLL_INTERVAL_MS || '5000' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          set -euo pipefail
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$admin_domain" ] || [ -z "$marketplace_domain" ]; then
            echo "Required staging admin or marketplace domain was not present in Terraform outputs." >&2
            exit 1
          fi
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cd ../../..
          guest_out=artifacts/release-health/guest-buy-now-freshness-probe.json
          account_out=artifacts/release-health/account-buy-now-freshness-probe.json
          common_args=(
            --environment staging
            --base-url "https://${marketplace_domain}"
            --admin-base-url "https://${admin_domain}"
            --search-query "${GUEST_BUY_NOW_PROBE_SEARCH_QUERY}"
            --fixture-key "${GUEST_BUY_NOW_PROBE_FIXTURE_KEY}"
            --timeout-ms "${GUEST_BUY_NOW_PROBE_TIMEOUT_MS}"
            --ready-slo-ms "${GUEST_BUY_NOW_PROBE_READY_SLO_MS}"
            --attempts "${GUEST_BUY_NOW_PROBE_ATTEMPTS}"
            --wake-runtime-ready-budget-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS}"
            --wake-runtime-ready-poll-interval-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS}"
          )
          if [ -n "${GUEST_BUY_NOW_PROBE_ITEM_PATH}" ]; then
            common_args+=(--item-path "${GUEST_BUY_NOW_PROBE_ITEM_PATH}")
          fi

          set +e
          pnpm run guest-buy-now:freshness-probe -- \
            "${common_args[@]}" \
            --flow guest \
            --guest-email "guest-buy-now-probe+${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@chasesets.test" \
            --diagnostic-correlation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-guest" \
            --out "$guest_out"
          guest_exit=$?
          pnpm run guest-buy-now:freshness-probe -- \
            "${common_args[@]}" \
            --flow account \
            --diagnostic-correlation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-account" \
            --out "$account_out"
          account_exit=$?
          set -e

          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          read_field() {
            local file="$1" field="$2" fallback="$3"
            if [ -f "$file" ]; then
              jq -r ".${field} // \"${fallback}\"" "$file"
            else
              echo "$fallback"
            fi
          }
          guest_final_state="$(read_field "$guest_out" finalState unknown)"
          guest_promotion_decision="$(read_field "$guest_out" promotionDecision abort)"
          guest_failure_reason="$(read_field "$guest_out" failureReason unknown)"
          guest_ready_latency_ms="$(read_field "$guest_out" readyLatencyMs unknown)"
          account_final_state="$(read_field "$account_out" finalState unknown)"
          account_promotion_decision="$(read_field "$account_out" promotionDecision abort)"
          account_failure_reason="$(read_field "$account_out" failureReason unknown)"
          account_ready_latency_ms="$(read_field "$account_out" readyLatencyMs unknown)"

          result=success
          promotion_decision=promote
          if [ "$guest_exit" -ne 0 ] || [ "$account_exit" -ne 0 ]; then
            result=failure
            promotion_decision=abort
          elif [ "$guest_promotion_decision" = "warn" ] || [ "$account_promotion_decision" = "warn" ]; then
            promotion_decision=warn
          fi

          {
            echo "started_at=${started_at}"
            echo "completed_at=${completed_at}"
            echo "result=${result}"
            echo "promotion_decision=${promotion_decision}"
            echo "guest_final_state=${guest_final_state}"
            echo "guest_promotion_decision=${guest_promotion_decision}"
            echo "guest_failure_reason=${guest_failure_reason}"
            echo "guest_ready_latency_ms=${guest_ready_latency_ms}"
            echo "account_final_state=${account_final_state}"
            echo "account_promotion_decision=${account_promotion_decision}"
            echo "account_failure_reason=${account_failure_reason}"
            echo "account_ready_latency_ms=${account_ready_latency_ms}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Staging Buy Now freshness probes"
            echo ""
            echo "| Flow | Final state | Promotion decision | Failure reason | Ready latency (ms) | Correlation id |"
            echo "| --- | --- | --- | --- | --- | --- |"
            echo "| guest | ${guest_final_state} | ${guest_promotion_decision} | ${guest_failure_reason} | ${guest_ready_latency_ms} | github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-guest |"
            echo "| account | ${account_final_state} | ${account_promotion_decision} | ${account_failure_reason} | ${account_ready_latency_ms} | github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-account |"
            echo ""
            echo "Interpretation: docs/runbooks/guest-buy-now-freshness-probe.md. Each probe artifact records wake-runtime preflight status; join server-side wake segments by correlation id via the projection wake dashboard and /api/platform/projections/wake-status."
            if [ "$promotion_decision" = "warn" ]; then
              echo ""
              echo "WARNING: ready SLO exceeded with a user-safe final state. Recorded as a release-health warning; promotion was not blocked (slo-mode=warn, ratified single-write SLO per docs/architecture/push-wake-slo-load-proof.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$result" != "success" ]; then
            echo "Staging Buy Now freshness probes aborted promotion (guest exit ${guest_exit}, account exit ${account_exit})." >&2
            exit 1
          fi

      - name: Upload staging blocking probe Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-blocking-probe-playwright-artifacts
          path: |
            artifacts/playwright/report
            artifacts/playwright/test-results
            artifacts/release-health/guest-buy-now-freshness-probe.json
            artifacts/release-health/account-buy-now-freshness-probe.json

      - name: Upload staging Buy Now probe evidence
        if: always() && env.SHOULD_DEPLOY != 'false' && steps.buy_now_probes.conclusion != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-buy-now-freshness-probes
          path: |
            artifacts/release-health/guest-buy-now-freshness-probe.json
            artifacts/release-health/account-buy-now-freshness-probe.json
          if-no-files-found: error
          retention-days: 30

      # #2516: promotes account-cart-post-write-consistency from a
      # route-matrix/UAT-only signal to a required migrated canary that gates
      # staging promotion the same way the Buy Now probes do. The probe is a
      # doc-backed observation (docs/runbooks/account-cart-consistency-probe.md):
      # it cannot yet drive its own account-cart mutation, so it blocks
      # promotion only when a redacted observation is configured for the run.
      # When unconfigured it exits 0 but records an explicit warning so the
      # coverage gap stays visible in the release-health gate instead of
      # reading as a silent pass.
      - name: Staging account-cart freshness canary
        id: account_cart_canary
        if: env.SHOULD_DEPLOY != 'false'
        env:
          ACCOUNT_CART_CANARY_OBSERVATION_JSON: ${{ vars.STAGING_ACCOUNT_CART_CANARY_OBSERVATION_JSON || '' }}
        run: |
          set -euo pipefail
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "started_at=${started_at}" >> "$GITHUB_OUTPUT"
          out=artifacts/release-health/account-cart-consistency-probe.json
          mkdir -p "$(dirname "$out")"

          if [ -z "${ACCOUNT_CART_CANARY_OBSERVATION_JSON:-}" ]; then
            completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            {
              echo "completed_at=${completed_at}"
              echo "result=skipped"
              echo "configured=false"
              echo "promotion_decision=not-configured"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Staging account-cart freshness canary"
              echo ""
              echo "::warning::Account-cart post-write consistency observation is not configured (STAGING_ACCOUNT_CART_CANARY_OBSERVATION_JSON); this required migrated canary is a documented coverage gap, not a passing signal. See docs/runbooks/account-cart-consistency-probe.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          observation_file="${RUNNER_TEMP}/account-cart-canary-observation.json"
          printf '%s\n' "${ACCOUNT_CART_CANARY_OBSERVATION_JSON}" > "${observation_file}"

          set +e
          pnpm run ops account-cart:consistency-probe -- \
            --environment staging \
            --release-commit "${{ needs.resolve-release.outputs.release_commit }}" \
            --evidence-reference "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-account-cart-canary" \
            --observation-file "${observation_file}" \
            --out "$out"
          probe_exit=$?
          set -e
          rm -f "${observation_file}"

          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          promotion_decision="$(jq -r '.promotionDecision // "abort"' "$out" 2>/dev/null || echo abort)"
          result=success
          if [ "$probe_exit" -ne 0 ]; then
            result=failure
          fi

          {
            echo "completed_at=${completed_at}"
            echo "result=${result}"
            echo "configured=true"
            echo "promotion_decision=${promotion_decision}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Staging account-cart freshness canary"
            echo ""
            echo "| Result | Promotion decision |"
            echo "| --- | --- |"
            echo "| ${result} | ${promotion_decision} |"
            echo ""
            echo "Interpretation: docs/runbooks/account-cart-consistency-probe.md."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$result" != "success" ]; then
            echo "Staging account-cart freshness canary aborted promotion (exit ${probe_exit})." >&2
            exit 1
          fi

      - name: Upload staging account-cart canary evidence
        if: always() && env.SHOULD_DEPLOY != 'false' && steps.account_cart_canary.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-account-cart-freshness-canary
          path: artifacts/release-health/account-cart-consistency-probe.json
          if-no-files-found: error
          retention-days: 30

      - name: Staging Stripe money smoke
        if: env.SHOULD_DEPLOY != 'false'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          SMOKE_REGISTER_SELLER: "true"
          SMOKE_SELLER_EMAIL: stripe-staging+${{ github.run_id }}-${{ github.run_attempt }}@chasesets.test
          SMOKE_SELLER_PASSWORD: staging-stripe-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_SELLER_DISPLAY_NAME: Stripe Staging Smoke ${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_INVITATION_PROJECTION_TIMEOUT_MS: ${{ vars.STAGING_STRIPE_MONEY_SMOKE_INVITATION_PROJECTION_TIMEOUT_MS || '300000' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL || env.TF_VAR_platform_admin_email || '' }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD || env.TF_VAR_platform_admin_password || '' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONEY_SMOKE_ENVIRONMENT: staging
          STRIPE_MONEY_SMOKE_REQUIRE_DELIVERED_WEBHOOKS: "false"
          SMOKE_ORDER_IDS: ${{ vars.STAGING_SMOKE_ORDER_IDS || '' }}
          SMOKE_BALANCE_CREDIT_AMOUNT: ${{ vars.STAGING_SMOKE_BALANCE_CREDIT_AMOUNT || '' }}
          SMOKE_PAYMENT_METHOD_CATEGORY: ${{ vars.STAGING_SMOKE_PAYMENT_METHOD_CATEGORY || '' }}
          SMOKE_CREATE_PAYMENT: ${{ vars.STAGING_SMOKE_CREATE_PAYMENT || '' }}
          SMOKE_PAYOUT_AMOUNT: ${{ vars.STAGING_SMOKE_PAYOUT_AMOUNT || '' }}
          SMOKE_REQUEST_PAYOUT: ${{ vars.STAGING_SMOKE_REQUEST_PAYOUT || '' }}
        run: |
          set -euo pipefail
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$marketplace_domain" ]; then
            echo "Required staging marketplace domain was not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          PLATFORM_API_BASE_URL="https://${marketplace_domain}" \
            PLATFORM_AUTH_BASE_URL="https://${marketplace_domain}" \
            pnpm run stripe:money-smoke -- --edge-check --seller-flow

      - name: Promote staging Argo Rollouts
        if: env.SHOULD_DEPLOY != 'false' && env.ARGO_ROLLOUTS_ENABLED == 'true'
        run: |
          set -euo pipefail
          pnpm run platform:kubernetes-deployment -- promote \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --rollouts-enabled true \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT"

      - name: Abort staging Argo Rollouts
        if: failure() && env.SHOULD_DEPLOY != 'false' && env.ARGO_ROLLOUTS_ENABLED == 'true'
        run: |
          pnpm run platform:kubernetes-deployment -- abort \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --rollouts-enabled true || true

      - name: Classify staging deployment failure
        if: failure() && env.SHOULD_DEPLOY != 'false'
        id: staging_failure_classification
        run: |
          set -euo pipefail
          node ./scripts/platform-deploy-incident.mjs \
            --command classify-root-cause \
            --phase staging-deploy \
            --diagnostics artifacts/release-health/staging-terraform-diagnostics.txt \
            --diagnostics artifacts/release-health/staging-kubernetes-deploy-diagnostics.json \
            --diagnostics artifacts/release-health/staging-projection-convergence-gate.json \
            --diagnostics artifacts/release-health/guest-buy-now-freshness-probe.json \
            --diagnostics artifacts/release-health/account-buy-now-freshness-probe.json \
            --diagnostics artifacts/release-health/account-cart-consistency-probe.json \
            --out artifacts/release-health/staging-deploy-root-cause.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --format github-output >> "$GITHUB_OUTPUT"

      - name: Upload staging deployment root cause
        if: failure() && env.SHOULD_DEPLOY != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-deploy-root-cause
          path: artifacts/release-health/staging-deploy-root-cause.json
          if-no-files-found: error
          retention-days: 30

      - name: Mark staging applied
        id: staging_applied
        if: env.SHOULD_DEPLOY != 'false'
        run: |
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Record staging completion
        id: staging_completed
        if: env.SHOULD_DEPLOY != 'false'
        run: echo "completed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  notify-staging-advisory-dispatch-failure:
    name: Notify Staging Advisory Dispatch Failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy-staging
    if: always() && needs.deploy-staging.outputs.advisory_dispatch_result == 'failure'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update advisory evidence incident
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.deploy-staging.outputs.active_release_commit || 'unresolved' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          title="Incident: Staging advisory evidence failing"
          body="$(cat <<EOF
          The production workflow could not dispatch advisory staging evidence.

          - Release commit: ${RELEASE_COMMIT}
          - Production workflow run: ${RUN_URL}
          - Advisory workflow: Platform Staging Advisory Evidence

          Production promotion remains governed only by blocking staging gates. Inspect the dispatch step, then rerun the advisory workflow for this release commit and image digest.
          EOF
          )"
          existing_issue="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "\"${title}\" in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "${GITHUB_REPOSITORY}" --body "$body"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --body "$body" \
              --label "kind:ops" \
              --label "area:infrastructure"
          fi

  record-staging-release-health:
    name: Record Staging Release Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - resolve-release
      - deploy-staging
      - deploy-production
    if: always() && needs.resolve-release.outputs.deployment_required == 'true' && needs.deploy-staging.outputs.applied != 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check out release commit
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          git checkout --detach "$release_commit"

      - name: Resolve staging release health metadata
        id: release_health_metadata
        env:
          SOURCE_WORKFLOW_CREATED_AT: ${{ needs.resolve-release.outputs.dispatch_created_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="${{ needs.resolve-release.outputs.release_commit }}"
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          committed_at="$(git show -s --format=%cI "$release_commit")"
          linkage_args=()
          if [ "${{ inputs.dispatch_source }}" = "automatic" ]; then
            linkage_name="release-candidate-linkage-${{ inputs.dispatch_run_id }}-${{ inputs.dispatch_attempt }}"
            gh run download "${{ inputs.dispatch_run_id }}" --name "$linkage_name" --dir artifacts/release-candidate-linkage
            linkage_args=(--linkage-file artifacts/release-candidate-linkage/linkage.json)
          fi
          if ! node ./scripts/release-health-github-metadata.mjs \
            --repository "${{ github.repository }}" \
            --release-commit "$release_commit" \
            --source-workflow-created-at "${SOURCE_WORKFLOW_CREATED_AT:-}" \
            "${linkage_args[@]}" \
            --format github-output >> "$GITHUB_OUTPUT"; then
            echo "GitHub release-health metadata was unavailable; writing deterministic fallbacks." >&2
            {
              echo "pr_number="
              echo "pr_opened_at="
              echo "pr_ready_for_review_at="
              echo "pr_approved_at="
              echo "queue_queued_at=${SOURCE_WORKFLOW_CREATED_AT:-}"
              echo "queue_merge_group_started_at="
              echo "queue_merged_at=${committed_at}"
              echo "queue_dequeued_at="
              echo "queue_failure_reason="
              echo "queue_batch_size=1"
              echo "candidate_artifact_id="
              echo "candidate_artifact_name="
              echo "merge_group_workflow_id="
              echo "merge_group_workflow_path="
              echo "candidate_sha="
              echo "candidate_tree_sha="
              echo "candidate_image_digest="
              echo "merge_group_run_id="
              echo "merge_group_run_attempt="
              echo "merge_sha=${release_commit}"
              echo "merge_tree_sha=$(git rev-parse "${release_commit}^{tree}")"
              echo "lineage_complete=false"
              echo 'lineage_reasons_json=["metadata-unavailable"]'
            } >> "$GITHUB_OUTPUT"
          fi

          git fetch origin production || true
          drift_commits=0
          drift_seconds=0
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            drift_commits="$(git rev-list --count "origin/production..${release_commit}" 2>/dev/null || printf '0')"
            release_epoch="$(git show -s --format=%ct "$release_commit")"
            production_epoch="$(git show -s --format=%ct origin/production)"
            if [ "$release_epoch" -gt "$production_epoch" ]; then
              drift_seconds=$((release_epoch - production_epoch))
            fi
          fi

          {
            echo "completed_at=${completed_at}"
            echo "committed_at=${committed_at}"
            echo "drift_commits=${drift_commits}"
            echo "drift_seconds=${drift_seconds}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve staging CI retry metadata
        id: ci_metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! node ./scripts/release-health-ci-metadata.mjs \
            --repository "${{ github.repository }}" \
            --release-commit "${{ needs.resolve-release.outputs.release_commit }}" \
            --format github-output >> "$GITHUB_OUTPUT"; then
            {
              echo "ci_retry_count=0"
              echo "ci_flaky_failure_count=0"
              echo "ci_top_flaky_jobs=[]"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write staging release health summary
        env:
          RELEASE_HEALTH_OUT: artifacts/release-health/staging-release.json
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.release_commit }}
          DISPATCH_SOURCE: ${{ inputs.dispatch_source }}
          DISPATCH_RUN_ID: ${{ inputs.dispatch_run_id }}
          DISPATCH_ATTEMPT: ${{ inputs.dispatch_attempt }}
          DISPATCH_REASON: ${{ inputs.reason }}
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'emergency' || 'normal' }}
          PR_NUMBER: ${{ steps.release_health_metadata.outputs.pr_number }}
          PR_OPENED_AT: ${{ steps.release_health_metadata.outputs.pr_opened_at }}
          PR_READY_FOR_REVIEW_AT: ${{ steps.release_health_metadata.outputs.pr_ready_for_review_at }}
          PR_APPROVED_AT: ${{ steps.release_health_metadata.outputs.pr_approved_at }}
          QUEUE_BATCH_SIZE: ${{ steps.release_health_metadata.outputs.queue_batch_size || '1' }}
          QUEUE_QUEUED_AT: ${{ steps.release_health_metadata.outputs.queue_queued_at }}
          QUEUE_MERGE_GROUP_STARTED_AT: ${{ steps.release_health_metadata.outputs.queue_merge_group_started_at }}
          QUEUE_MERGED_AT: ${{ steps.release_health_metadata.outputs.queue_merged_at }}
          QUEUE_DEQUEUED_AT: ${{ steps.release_health_metadata.outputs.queue_dequeued_at }}
          QUEUE_FAILURE_REASON: ${{ steps.release_health_metadata.outputs.queue_failure_reason }}
          CANDIDATE_SHA: ${{ steps.release_health_metadata.outputs.candidate_sha }}
          CANDIDATE_TREE_SHA: ${{ steps.release_health_metadata.outputs.candidate_tree_sha }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.release_health_metadata.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.release_health_metadata.outputs.candidate_artifact_name }}
          MERGE_GROUP_WORKFLOW_ID: ${{ steps.release_health_metadata.outputs.merge_group_workflow_id }}
          MERGE_GROUP_WORKFLOW_PATH: ${{ steps.release_health_metadata.outputs.merge_group_workflow_path }}
          CANDIDATE_IMAGE_DIGEST: ${{ steps.release_health_metadata.outputs.candidate_image_digest }}
          MERGE_GROUP_RUN_ID: ${{ steps.release_health_metadata.outputs.merge_group_run_id }}
          MERGE_GROUP_RUN_ATTEMPT: ${{ steps.release_health_metadata.outputs.merge_group_run_attempt }}
          MERGE_SHA: ${{ steps.release_health_metadata.outputs.merge_sha }}
          MERGE_TREE_SHA: ${{ steps.release_health_metadata.outputs.merge_tree_sha }}
          LINEAGE_COMPLETE: ${{ steps.release_health_metadata.outputs.lineage_complete || 'false' }}
          LINEAGE_REASONS_JSON: ${{ steps.release_health_metadata.outputs.lineage_reasons_json || '["metadata-unavailable"]' }}
          RELEASE_COMMIT_COMMITTED_AT: ${{ steps.release_health_metadata.outputs.committed_at }}
          RELEASE_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'emergency-recovery' || needs.resolve-release.outputs.exposure_posture_changed == 'true' && 'exposure-posture-change' || 'ordinary-deploy' }}
          EXPOSURE_POSTURE_CATEGORIES: ${{ needs.resolve-release.outputs.exposure_posture_categories }}
          DEPLOYMENT_REQUIRED: ${{ needs.resolve-release.outputs.deployment_required }}
          STAGING_JOB_RESULT: ${{ needs.deploy-staging.result }}
          STAGING_APPLIED: ${{ needs.deploy-staging.outputs.applied || 'false' }}
          STAGING_STARTED_AT: ${{ needs.deploy-staging.outputs.started_at }}
          STAGING_COMPLETED_AT: ${{ needs.deploy-staging.outputs.completed_at }}
          CANARY_RESULT: ${{ needs.deploy-staging.outputs.buy_now_probe_result || 'skipped' }}
          CANARY_STARTED_AT: ${{ needs.deploy-staging.outputs.buy_now_probe_started_at }}
          CANARY_COMPLETED_AT: ${{ needs.deploy-staging.outputs.buy_now_probe_completed_at }}
          CANARY_COHORT_SUBJECT_TYPE: operator
          CANARY_COHORT_SIZE: "0"
          CANARY_PROMOTION_DECISION: ${{ needs.deploy-staging.outputs.buy_now_probe_promotion_decision || 'skipped' }}
          ACCOUNT_CART_CANARY_RESULT: ${{ needs.deploy-staging.outputs.account_cart_canary_result || 'skipped' }}
          ACCOUNT_CART_CANARY_STARTED_AT: ${{ needs.deploy-staging.outputs.account_cart_canary_started_at }}
          ACCOUNT_CART_CANARY_COMPLETED_AT: ${{ needs.deploy-staging.outputs.account_cart_canary_completed_at }}
          ACCOUNT_CART_CANARY_PROMOTION_DECISION: ${{ needs.deploy-staging.outputs.account_cart_canary_promotion_decision || 'skipped' }}
          ACCOUNT_CART_CANARY_CONFIGURED: ${{ needs.deploy-staging.outputs.account_cart_canary_configured || 'false' }}
          STAGING_SUPERSEDED: ${{ needs.deploy-staging.outputs.superseded || 'false' }}
          STAGING_SUPERSEDED_BY_COMMIT: ${{ needs.deploy-staging.outputs.superseded_by_commit }}
          ACTIVE_RELEASE_COMMIT: ${{ needs.deploy-staging.outputs.active_release_commit }}
          ACTIVE_IMAGE_DIGEST: ${{ needs.deploy-staging.outputs.active_image_digest }}
          RELEASE_STATE_MODE: ${{ inputs.dispatch_source }}
          PRODUCTION_RESULT: skipped
          PRODUCTION_COMPLETED_AT: ${{ steps.release_health_metadata.outputs.completed_at }}
          CI_RETRY_COUNT: ${{ steps.ci_metadata.outputs.ci_retry_count }}
          CI_FLAKY_FAILURE_COUNT: ${{ steps.ci_metadata.outputs.ci_flaky_failure_count }}
          CI_TOP_FLAKY_JOBS: ${{ steps.ci_metadata.outputs.ci_top_flaky_jobs }}
          MAIN_TO_PRODUCTION_DRIFT_COMMITS: ${{ steps.release_health_metadata.outputs.drift_commits }}
          MAIN_TO_PRODUCTION_DRIFT_SECONDS: ${{ steps.release_health_metadata.outputs.drift_seconds }}
          EMERGENCY_RELEASE_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_reference || '' }}
          RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_release == true && 'fix-forward' || 'none' }}
          RECOVERY_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.emergency_reference || '' }}
          ROLLBACK_READINESS_RESULT: skipped
        run: |
          set -euo pipefail
          staging_result="${STAGING_JOB_RESULT:-unknown}"
          attempt_reason="staging-${staging_result}"
          if [ "${STAGING_APPLIED:-}" = "true" ]; then
            staging_result="success"
            attempt_reason="staging-applied"
          elif [ "$staging_result" = "success" ]; then
            staging_result="skipped"
            attempt_reason="staging-not-applied"
          fi

          attempt_result="$staging_result"
          attempt_phase="staging"
          superseded_by_commit=""
          if [ "${STAGING_SUPERSEDED:-}" = "true" ]; then
            attempt_result="skipped"
            attempt_phase="queue"
            attempt_reason="candidate-superseded-before-staging-mutation"
            superseded_by_commit="${STAGING_SUPERSEDED_BY_COMMIT:-}"
            RELEASE_STATE_TRANSITIONS="$(jq -cn \
              --arg commit "$RELEASE_COMMIT" \
              --arg pending "$superseded_by_commit" \
              --arg mode "$RELEASE_STATE_MODE" \
              '[
                {type:"coalesced", commit:$commit, supersededByCommit:$pending},
                {type:"pending", commit:$pending, mode:"automatic"},
                {type:"superseded", commit:$commit, supersededByCommit:$pending, mode:$mode}
              ]')"
          elif [ -n "${ACTIVE_RELEASE_COMMIT:-}" ]; then
            RELEASE_STATE_TRANSITIONS="$(jq -cn \
              --arg commit "$ACTIVE_RELEASE_COMMIT" \
              --arg digest "$ACTIVE_IMAGE_DIGEST" \
              --arg mode "$RELEASE_STATE_MODE" \
              '[
                {type:"active", commit:$commit, imageDigest:$digest, mode:$mode},
                {type:"failed", commit:$commit, imageDigest:$digest, mode:$mode}
              ]')"
          else
            RELEASE_STATE_TRANSITIONS="$(jq -cn \
              --arg commit "$RELEASE_COMMIT" \
              --arg mode "$RELEASE_STATE_MODE" \
              '[{type:"candidate", commit:$commit, mode:$mode}, {type:"failed", commit:$commit, mode:$mode}]')"
          fi
          export RELEASE_STATE_TRANSITIONS

          export STAGING_RESULT="$staging_result"
          if [ "${CANARY_RESULT:-skipped}" = "skipped" ]; then
            export CANARY_SKIPPED_REASON="$attempt_reason"
          fi
          export RELEASE_ATTEMPT_RESULT="$attempt_result"
          export RELEASE_ATTEMPT_PHASE="$attempt_phase"
          export RELEASE_ATTEMPT_REASON="$attempt_reason"
          export RELEASE_ATTEMPT_SUPERSEDED_BY_COMMIT="$superseded_by_commit"
          export RELEASE_ATTEMPT_WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}"

          node ./scripts/release-health.mjs

      - name: Upload staging release health summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-release-health
          path: artifacts/release-health/staging-release.json
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - resolve-release
      - deploy-staging
    if: needs.deploy-staging.outputs.deployed == 'true'
    environment: production
    outputs:
      rollback_result: ${{ steps.production_rollback.outputs.result || 'not-attempted' }}
      rollback_target_commit: ${{ steps.production_rollback.outputs.rollback_target_commit || '' }}
      rollback_reference: ${{ steps.production_rollback.outputs.rollback_reference || '' }}
      root_cause_code: ${{ steps.production_failure_classification.outputs.root_cause_code || 'unknown' }}
      root_cause_summary: ${{ steps.production_failure_classification.outputs.root_cause_summary || 'The deployment failed without a known safe classification.' }}
      affected_component: ${{ steps.production_failure_classification.outputs.affected_component || 'unknown' }}
      root_cause_phase: ${{ steps.production_failure_classification.outputs.phase || 'unknown' }}
      root_cause_remediation: ${{ steps.production_failure_classification.outputs.remediation || 'Inspect the redacted provider reason and diagnostic artifacts before retrying or recovering.' }}
      root_cause_provider_reason: ${{ steps.production_failure_classification.outputs.provider_reason || 'No provider reason was captured.' }}
      root_cause_signature: ${{ steps.production_failure_classification.outputs.root_cause_signature }}
    concurrency:
      group: platform-deploy-production
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: production
      TF_VAR_environment_project_id: ${{ vars.DIGITALOCEAN_PROJECT_ID || '' }}
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: ${{ needs.resolve-release.outputs.release_commit }}
      TF_VAR_platform_image_digest: ${{ needs.deploy-staging.outputs.platform_image_digest }}
      PRODUCTION_DOKS_INGRESS_TARGET: ${{ vars.PRODUCTION_DOKS_INGRESS_TARGET || '' }}
      PRODUCTION_MARKETPLACE_PUBLIC_ENABLED: ${{ vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED || 'false' }}
      TF_VAR_doks_ingress_target: ${{ vars.PRODUCTION_DOKS_INGRESS_TARGET || '' }}
      TF_VAR_production_runtime_profile: ${{ vars.PRODUCTION_RUNTIME_PROFILE || (vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true' && 'public' || 'landing') }}
      TF_VAR_production_marketplace_public_enabled: ${{ vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED || 'false' }}
      TF_VAR_production_marketplace_promotion_approved: ${{ vars.PRODUCTION_MARKETPLACE_PROMOTION_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_marketplace_promotion_reference: ${{ vars.PRODUCTION_MARKETPLACE_PROMOTION_REFERENCE || '' }}
      TF_VAR_production_marketplace_checkout_fee_approved: ${{ vars.PRODUCTION_MARKETPLACE_CHECKOUT_FEE_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_marketplace_checkout_fee_reference: ${{ vars.PRODUCTION_MARKETPLACE_CHECKOUT_FEE_REFERENCE || '' }}
      TF_VAR_production_checkout_launch_evidence_approved: ${{ vars.PRODUCTION_CHECKOUT_LAUNCH_EVIDENCE_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_checkout_launch_evidence_reference: ${{ vars.PRODUCTION_CHECKOUT_LAUNCH_EVIDENCE_REFERENCE || '' }}
      TF_VAR_checkout_shopify_simple_kill_switch_active: ${{ vars.CHECKOUT_SHOPIFY_SIMPLE_KILL_SWITCH_ACTIVE == 'true' && 'true' || 'false' }}
      TF_VAR_production_stripe_money_operations_approved: ${{ vars.PRODUCTION_STRIPE_MONEY_OPERATIONS_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_stripe_money_operations_reference: ${{ vars.PRODUCTION_STRIPE_MONEY_OPERATIONS_REFERENCE || '' }}
      TF_VAR_production_support_operations_approved: ${{ vars.PRODUCTION_SUPPORT_OPERATIONS_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_support_operations_reference: ${{ vars.PRODUCTION_SUPPORT_OPERATIONS_REFERENCE || '' }}
      TF_VAR_production_fulfillment_postage_approved: ${{ vars.PRODUCTION_FULFILLMENT_POSTAGE_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_fulfillment_postage_reference: ${{ vars.PRODUCTION_FULFILLMENT_POSTAGE_REFERENCE || '' }}
      TF_VAR_production_transactional_email_approved: ${{ vars.PRODUCTION_TRANSACTIONAL_EMAIL_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_transactional_email_reference: ${{ vars.PRODUCTION_TRANSACTIONAL_EMAIL_REFERENCE || '' }}
      TF_VAR_production_launch_supply_measurements_approved: ${{ vars.PRODUCTION_LAUNCH_SUPPLY_MEASUREMENTS_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_launch_supply_measurements_reference: ${{ vars.PRODUCTION_LAUNCH_SUPPLY_MEASUREMENTS_REFERENCE || '' }}
      TF_VAR_alert_emails: ${{ vars.PLATFORM_ALERT_EMAILS || '[]' }}
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
      TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
      TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
      TF_VAR_production_tax_readiness_approved: ${{ vars.PRODUCTION_TAX_READINESS_APPROVED == 'true' && 'true' || 'false' }}
      TF_VAR_production_tax_readiness_reference: ${{ vars.PRODUCTION_TAX_READINESS_REFERENCE || '' }}
      TF_VAR_tax_provider_backed_quotes_required: ${{ vars.TAX_PROVIDER_BACKED_QUOTES_REQUIRED == 'true' && 'true' || 'false' }}
      TF_VAR_stripe_secret_key: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.STRIPE_SECRET_KEY || '' }}
      TF_VAR_stripe_publishable_key: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.STRIPE_PUBLISHABLE_KEY || '' }}
      TF_VAR_stripe_webhook_secret: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.STRIPE_WEBHOOK_SECRET || '' }}
      TF_VAR_stripe_connect_webhook_secret: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.STRIPE_CONNECT_WEBHOOK_SECRET || '' }}
      TF_VAR_stripe_connect_accounts_api: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && (vars.STRIPE_CONNECT_ACCOUNTS_API || 'v2') || 'v2' }}
      TF_VAR_stripe_api_base_url: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && vars.STRIPE_API_BASE_URL || '' }}
      TF_VAR_ucp_business_signing_key_id: ${{ secrets.UCP_BUSINESS_SIGNING_KEY_ID || '' }}
      TF_VAR_ucp_business_signing_alg: ${{ secrets.UCP_BUSINESS_SIGNING_ALG || 'ES256' }}
      TF_VAR_ucp_business_signing_private_jwk: ${{ secrets.UCP_BUSINESS_SIGNING_PRIVATE_JWK || '' }}
      TF_VAR_ucp_business_signing_previous_public_jwks: ${{ secrets.UCP_BUSINESS_SIGNING_PREVIOUS_PUBLIC_JWKS || '[]' }}
      TF_VAR_ucp_ap2_verifier_url: ${{ secrets.UCP_AP2_VERIFIER_URL || '' }}
      TF_VAR_ucp_ap2_verifier_auth_token: ${{ secrets.UCP_AP2_VERIFIER_AUTH_TOKEN || '' }}
      TF_VAR_ucp_ap2_verifier_timeout_ms: ${{ secrets.UCP_AP2_VERIFIER_TIMEOUT_MS || '5000' }}
      TF_VAR_easypost_api_key: ${{ (vars.PRODUCTION_RUNTIME_PROFILE == 'proof' || vars.PRODUCTION_RUNTIME_PROFILE == 'public' || vars.PRODUCTION_MARKETPLACE_PUBLIC_ENABLED == 'true') && secrets.EASYPOST_API_KEY || '' }}
      TF_VAR_voyage_api_key: ${{ secrets.VOYAGE_API_KEY || '' }}
