name: Platform PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: platform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and Terraform Plan
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: pr-validation-token
      TF_VAR_spaces_access_id: pr-validation-access-id
      TF_VAR_spaces_secret_key: pr-validation-secret-key
      TF_VAR_environment: staging
      TF_VAR_branch: main
      TF_VAR_platform_internal_auth_secret: pr-validation-internal-auth-secret
      TF_VAR_platform_admin_email: ops+pr@chasesets.com
      TF_VAR_platform_admin_password: pr-validation-password-please-rotate
      TF_VAR_discord_invite_url: https://discord.gg/pr-validation
      TF_VAR_stripe_secret_key: sk_test_pr_validation
      TF_VAR_stripe_publishable_key: pk_test_pr_validation
      TF_VAR_stripe_webhook_secret: whsec_pr_validation
      TF_VAR_stripe_connect_return_url: https://marketplace-staging.chasesets.com/account/payouts
      TF_VAR_stripe_connect_refresh_url: https://marketplace-staging.chasesets.com/account/payouts/setup
      TF_VAR_easypost_api_key: EZTK_pr_validation
      TF_VAR_easypost_mode: test
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: hashicorp/setup-terraform@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm run verify

      - name: Terraform init without remote backend
        working-directory: infrastructure/digitalocean/platform
        run: terraform init -backend=false

      - name: Terraform format platform
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Terraform validate platform
        working-directory: infrastructure/digitalocean/platform
        run: terraform validate

      - name: Terraform plan platform
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/platform/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

      - name: Terraform init state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform init

      - name: Terraform format state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform fmt -check -recursive

      - name: Terraform validate state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform validate

      - name: Terraform plan state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform plan -refresh=false -lock=false -out=tfplan
