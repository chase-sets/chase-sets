  terraform-observability-plan:
    name: Terraform Observability Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: change-scope
    if: needs['change-scope'].outputs.terraform == 'true'
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: pr-validation-token
      TF_VAR_spaces_access_id: pr-validation-access-id
      TF_VAR_spaces_secret_key: pr-validation-secret-key
      TF_VAR_grafana_admin_password: pr-validation-password-please-rotate
      TF_VAR_otel_write_token: pr-validation-otel-token
      TF_VAR_prometheus_query_token: pr-validation-prometheus-token
      TF_VAR_alert_emails: '["ops@example.com"]'
      TF_VAR_ses_aws_access_key_id: pr-validation-ses-access-key
      TF_VAR_ses_aws_secret_access_key: pr-validation-ses-secret-key
      TF_VAR_ses_configuration_set_name: pr-validation-configuration-set
      TF_VAR_ses_source_arn: arn:aws:ses:us-east-2:123456789012:identity/example.com
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init observability without remote backend
        working-directory: infrastructure/digitalocean/observability
        run: terraform init -backend=false

      - name: Terraform format observability
        working-directory: infrastructure/digitalocean/observability
        run: terraform fmt -check -recursive

      - name: Terraform validate observability
        working-directory: infrastructure/digitalocean/observability
        run: terraform validate

      - name: Terraform plan shared observability
        run: |
          set -euo pipefail
          plan_root="${RUNNER_TEMP}/chase-sets-observability-plan"
          rm -rf "${plan_root}"
          mkdir -p "${plan_root}/infrastructure/digitalocean" "${plan_root}/infrastructure/observability"
          cp -R infrastructure/digitalocean/observability "${plan_root}/infrastructure/digitalocean/observability"
          cp -R infrastructure/observability/stack "${plan_root}/infrastructure/observability/stack"
          rm -rf "${plan_root}/infrastructure/digitalocean/observability/.terraform" "${plan_root}/infrastructure/digitalocean/observability/artifacts"
          python - <<'PY'
          from pathlib import Path

          versions_path = Path("${{ runner.temp }}/chase-sets-observability-plan/infrastructure/digitalocean/observability/versions.tf")
          versions = versions_path.read_text()
          backend_block = '\n  backend "s3" {}\n'
          if backend_block not in versions:
              raise SystemExit("Expected observability backend block was not found.")
          versions_path.write_text(versions.replace(backend_block, '\n'))
          PY
          terraform -chdir="${plan_root}/infrastructure/digitalocean/observability" init -backend=false
          terraform -chdir="${plan_root}/infrastructure/digitalocean/observability" plan -refresh=false -lock=false -out=tfplan
          plan_artifact="infrastructure/digitalocean/observability/artifacts/terraform-plans/observability-shared-tfplan.txt"
          mkdir -p "$(dirname "${plan_artifact}")"
          terraform -chdir="${plan_root}/infrastructure/digitalocean/observability" show -no-color tfplan > "${plan_artifact}"

      - name: Upload shared observability Terraform plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-shared-terraform-plan
          path: infrastructure/digitalocean/observability/artifacts/terraform-plans/observability-shared-tfplan.txt
          if-no-files-found: error
          retention-days: 14

  preview-deploy-smoke:
    name: Deploy Preview and Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs['change-scope'].result == 'success' &&
      (needs['change-scope'].outputs.cluster_preview == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'preview')) &&
      (needs['change-scope'].outputs.local_checks != 'true' || needs.static.result == 'success') &&
      needs.typecheck.result == 'success' &&
      (needs['change-scope'].outputs.unit_tests != 'true' || needs['unit-tests'].result == 'success') &&
      (needs['change-scope'].outputs.full_battery_required != 'true' ||
       needs['change-scope'].outputs.db_tests != 'true' ||
       needs['db-tests'].result == 'success') &&
      (needs['change-scope'].outputs.full_battery_required != 'true' ||
       needs['change-scope'].outputs.e2e_tests != 'true' ||
       needs['e2e-tests'].result == 'success') &&
      (needs['change-scope'].outputs.full_battery_required != 'true' ||
       needs['change-scope'].outputs.build != 'true' ||
       needs.build.result == 'success') &&
      (needs['change-scope'].outputs.full_battery_required != 'true' ||
       needs['change-scope'].outputs.docker_image != 'true' ||
       needs['docker-image'].result == 'success') &&
      (needs['change-scope'].outputs.workflow_lint != 'true' || needs['workflow-lint'].result == 'success') &&
      (needs['change-scope'].outputs.full_battery_required != 'true' ||
       needs['change-scope'].outputs.terraform != 'true' ||
       (needs['terraform-preview-plan'].result == 'success' &&
        needs['terraform-staging-plan'].result == 'success' &&
        needs['terraform-production-plan'].result == 'success'))
    environment: preview
    needs:
      - change-scope
      - static
      - typecheck
      - unit-tests
      - db-tests
      - e2e-tests
      - build
      - docker-image
      - workflow-lint
      - terraform-preview-plan
      - terraform-staging-plan
      - terraform-production-plan
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: preview
      TF_VAR_preview_identifier: pr-${{ github.event.pull_request.number }}
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      TF_VAR_alert_emails: ${{ vars.PLATFORM_ALERT_EMAILS || '[]' }}
      TF_VAR_stripe_connect_accounts_api: ${{ vars.STRIPE_CONNECT_ACCOUNTS_API || 'v2' }}
      TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
      TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
      TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
      TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
      TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
      TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
      TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
      PREVIEW_IDENTIFIER: pr-${{ github.event.pull_request.number }}
      CHASE_SETS_HELM_RELEASE: chase-sets-pr-${{ github.event.pull_request.number }}
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-pr-${{ github.event.pull_request.number }}
      CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT: 15m
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate preview configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_ucp_business_signing_key_id: ${{ secrets.UCP_BUSINESS_SIGNING_KEY_ID || '' }}
          TF_VAR_ucp_business_signing_alg: ${{ secrets.UCP_BUSINESS_SIGNING_ALG || 'ES256' }}
          TF_VAR_ucp_business_signing_private_jwk: ${{ secrets.UCP_BUSINESS_SIGNING_PRIVATE_JWK || '' }}
          TF_VAR_ucp_business_signing_previous_public_jwks: ${{ secrets.UCP_BUSINESS_SIGNING_PREVIOUS_PUBLIC_JWKS || '[]' }}
          TF_VAR_ucp_ap2_verifier_url: ${{ secrets.UCP_AP2_VERIFIER_URL || '' }}
          TF_VAR_ucp_ap2_verifier_auth_token: ${{ secrets.UCP_AP2_VERIFIER_AUTH_TOKEN || '' }}
          TF_VAR_ucp_ap2_verifier_timeout_ms: ${{ secrets.UCP_AP2_VERIFIER_TIMEOUT_MS || '5000' }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_voyage_api_key: ${{ secrets.VOYAGE_API_KEY || '' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url \
            TF_VAR_stripe_secret_key \
            TF_VAR_stripe_publishable_key \
            TF_VAR_stripe_webhook_secret \
            TF_VAR_stripe_connect_webhook_secret \
            TF_VAR_easypost_api_key
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required preview configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [[ "${TF_VAR_stripe_secret_key}" != sk_test* || "${TF_VAR_stripe_publishable_key}" != pk_test* ]]; then
            echo "Preview deployments require Stripe test-mode keys. Use staging for complete Stripe-delivered webhook proof and production only for approved live proof." >&2
            exit 1
          fi

          if [ "${TF_VAR_notification_email_provider:-}" = "amazon-ses" ]; then
            ses_missing=()
            for name in \
              TF_VAR_ses_aws_region \
              TF_VAR_ses_aws_access_key_id \
              TF_VAR_ses_aws_secret_access_key \
              TF_VAR_ses_from_email \
              TF_VAR_ses_configuration_set_name \
              TF_VAR_ses_source_arn
            do
              if [ -z "${!name:-}" ]; then
                ses_missing+=("$name")
              fi
            done

            if [ "${#ses_missing[@]}" -gt 0 ]; then
              printf 'Missing required preview SES configuration: %s\n' "${ses_missing[*]}" >&2
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: steps.buildx.outcome == 'failure'

      - name: Build and push platform image
        id: image
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            doctl registry create "$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK" --region nyc3
            registry_name="$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK"
          fi

          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${TF_VAR_platform_image_tag}"
          docker buildx build \
            --pull \
            --cache-from type=gha,scope=platform-image \
            --cache-to type=gha,scope=platform-image,mode=max \
            --push \
            --tag "$image" \
            .

          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${image}@${digest}"

      - name: Configure preview Kubernetes context
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-preview.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure preview Kubernetes context." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Preview Kubernetes kubeconfig is present but has no current context after Terraform and DigitalOcean refresh attempts." >&2
            KUBECONFIG="$kubeconfig" kubectl config get-contexts || true
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured preview Kubernetes context: ${current_context}"

      - name: Reset preview namespace
        run: |
          set -euo pipefail
          kubectl delete namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" --ignore-not-found --wait=true --timeout=5m
          kubectl create namespace "$CHASE_SETS_KUBERNETES_NAMESPACE"

      - name: Apply preview Kubernetes runtime secrets
        env:
          DEPLOYMENT_ENVIRONMENT: preview
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_voyage_api_key: ${{ secrets.VOYAGE_API_KEY || '' }}
          TF_VAR_easypost_webhook_secret: ${{ secrets.EASYPOST_WEBHOOK_SECRET || '' }}
          TF_VAR_google_social_login_client_id: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_google_social_login_client_secret: ${{ secrets.GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_facebook_social_login_client_id: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_ID || '' }}
          TF_VAR_facebook_social_login_client_secret: ${{ secrets.FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET || '' }}
          TF_VAR_ses_aws_access_key_id: ${{ secrets.SES_AWS_ACCESS_KEY_ID || '' }}
          TF_VAR_ses_aws_secret_access_key: ${{ secrets.SES_AWS_SECRET_ACCESS_KEY || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
          TF_VAR_tcgplayer_automation_tcg_auth_cookie: ${{ secrets.TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE || '' }}
          TF_VAR_scrydex_api_key: ${{ secrets.SCRYDEX_API_KEY || '' }}
          TF_VAR_scrydex_team_id: ${{ secrets.SCRYDEX_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          export CATALOG_ASSET_S3_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID:-}"
          export CATALOG_ASSET_S3_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY:-}"
          export CHASE_SETS_DISCORD_INVITE_URL="${TF_VAR_discord_invite_url:-}"
          export EASYPOST_API_KEY="${TF_VAR_easypost_api_key:-}"
          export VOYAGE_API_KEY="${TF_VAR_voyage_api_key:-}"
          export EASYPOST_WEBHOOK_SECRET="${TF_VAR_easypost_webhook_secret:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_facebook_social_login_client_id:-}"
          export FACEBOOK_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_facebook_social_login_client_secret:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_ID="${TF_VAR_google_social_login_client_id:-}"
          export GOOGLE_SOCIAL_LOGIN_CLIENT_SECRET="${TF_VAR_google_social_login_client_secret:-}"
          export OTEL_EXPORTER_OTLP_HEADERS=""
          export PLATFORM_ADMIN_EMAIL="${TF_VAR_platform_admin_email:-}"
          export PLATFORM_ADMIN_PASSWORD="${TF_VAR_platform_admin_password:-}"
          export PLATFORM_INTERNAL_AUTH_SECRET="${TF_VAR_platform_internal_auth_secret:-}"
          export SCRYDEX_API_KEY="${TF_VAR_scrydex_api_key:-}"
          export SCRYDEX_TEAM_ID="${TF_VAR_scrydex_team_id:-}"
          export SES_AWS_ACCESS_KEY_ID="${TF_VAR_ses_aws_access_key_id:-}"
          export SES_AWS_SECRET_ACCESS_KEY="${TF_VAR_ses_aws_secret_access_key:-}"
          export SES_SOURCE_ARN="${TF_VAR_ses_source_arn:-}"
          export STRIPE_CONNECT_WEBHOOK_SECRET="${TF_VAR_stripe_connect_webhook_secret:-}"
          export STRIPE_PUBLISHABLE_KEY="${TF_VAR_stripe_publishable_key:-}"
          export STRIPE_SECRET_KEY="${TF_VAR_stripe_secret_key:-}"
          export STRIPE_WEBHOOK_SECRET="${TF_VAR_stripe_webhook_secret:-}"
          export UCP_BUSINESS_SIGNING_KEY_ID="${TF_VAR_ucp_business_signing_key_id:-}"
          export UCP_BUSINESS_SIGNING_ALG="${TF_VAR_ucp_business_signing_alg:-ES256}"
          export UCP_BUSINESS_SIGNING_PRIVATE_JWK="${TF_VAR_ucp_business_signing_private_jwk:-}"
          export UCP_BUSINESS_SIGNING_PREVIOUS_PUBLIC_JWKS="${TF_VAR_ucp_business_signing_previous_public_jwks:-[]}"
          export UCP_AP2_VERIFIER_URL="${TF_VAR_ucp_ap2_verifier_url:-}"
          export UCP_AP2_VERIFIER_AUTH_TOKEN="${TF_VAR_ucp_ap2_verifier_auth_token:-}"
          export UCP_AP2_VERIFIER_TIMEOUT_MS="${TF_VAR_ucp_ap2_verifier_timeout_ms:-5000}"
          export TCGPLAYER_AUTOMATION_TCG_AUTH_COOKIE="${TF_VAR_tcgplayer_automation_tcg_auth_cookie:-}"

          node ./scripts/platform-kubernetes-secret.mjs --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE"

      - name: Apply preview Kubernetes registry pull secret
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            echo "DigitalOcean Container Registry is required before preview Kubernetes deploys can pull images." >&2
            exit 1
          fi

          registry_pull_secret_name="registry-${registry_name}"
          docker_config="$(mktemp)"
          trap 'rm -f "$docker_config"' EXIT
          doctl registry docker-config --expiry-seconds 3600 > "$docker_config"
          kubectl create secret generic "$registry_pull_secret_name" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --from-file=.dockerconfigjson="$docker_config" \
            --type=kubernetes.io/dockerconfigjson \
            --dry-run=client \
            -o yaml | kubectl apply -f -
          echo "CHASE_SETS_IMAGE_PULL_SECRET_NAME=${registry_pull_secret_name}" >> "$GITHUB_ENV"

      - name: Deploy preview Kubernetes release
        env:
          PLATFORM_IMAGE_REF: ${{ steps.image.outputs.image }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          landing_domain="${PREVIEW_IDENTIFIER}.preview.chasesets.com"
          marketplace_domain="${PREVIEW_IDENTIFIER}-marketplace.preview.chasesets.com"

          # Optional provider endpoint overrides are only passed when the
          # repository variable is set. When absent, the Helm chart's preview
          # env defaults apply (real Stripe/EasyPost API bases, empty SES
          # values), matching the retired App Platform preview posture where
          # empty env values fell through to runtime provider defaults.
          optional_runtime_env=()
          add_optional_runtime_env() {
            if [ -n "$2" ]; then
              optional_runtime_env+=(--runtime-env "$1=$2")
            fi
          }
          add_optional_runtime_env "SES_AWS_REGION" "${TF_VAR_ses_aws_region:-}"
          add_optional_runtime_env "SES_FROM_EMAIL" "${TF_VAR_ses_from_email:-}"
          add_optional_runtime_env "SES_CONFIGURATION_SET_NAME" "${TF_VAR_ses_configuration_set_name:-}"
          add_optional_runtime_env "STRIPE_API_BASE_URL" "${TF_VAR_stripe_api_base_url:-}"
          add_optional_runtime_env "EASYPOST_API_BASE_URL" "${TF_VAR_easypost_api_base_url:-}"

          pnpm run platform:kubernetes-deployment -- deploy \
            --image "$PLATFORM_IMAGE_REF" \
            --image-pull-secret "$CHASE_SETS_IMAGE_PULL_SECRET_NAME" \
            --runtime-env "DEPLOYMENT_ENVIRONMENT=preview" \
            --runtime-env "PREVIEW_IDENTIFIER=${PREVIEW_IDENTIFIER}" \
            --runtime-env "CHASE_SETS_RUNTIME_PROFILE=public" \
            --runtime-env "PLATFORM_DATA_PROFILES=critical-bootstrap,catalog-integration-bootstrap" \
            --runtime-env "CHASE_SETS_PUBLIC_ORIGIN=https://${landing_domain}" \
            --runtime-env "CHASE_SETS_MARKETPLACE_ORIGIN=https://${marketplace_domain}" \
            --runtime-env "CATALOG_ASSET_PUBLIC_BASE_URL=https://assets.preview.chasesets.com" \
            --runtime-env "CATALOG_ASSET_S3_BUCKET=chase-sets-preview-catalog-assets" \
            --runtime-env "CATALOG_ASSET_S3_ENDPOINT=https://nyc3.digitaloceanspaces.com" \
            --runtime-env "CATALOG_ASSET_S3_REGION=nyc3" \
            --runtime-env "NOTIFICATION_EMAIL_PROVIDER=${TF_VAR_notification_email_provider:-noop}" \
            --runtime-env "STRIPE_CONNECT_ACCOUNTS_API=${TF_VAR_stripe_connect_accounts_api:-v2}" \
            --runtime-env "EASYPOST_MODE=${TF_VAR_easypost_mode:-test}" \
            "${optional_runtime_env[@]}" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --timeout "$CHASE_SETS_KUBERNETES_ROLLOUT_TIMEOUT"

      - name: Capture preview Kubernetes deploy diagnostics
        if: failure()
        run: |
          set -euo pipefail
          pnpm run platform:kubernetes-deployment -- diagnostics \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" || true

      # The preview Ingress references the shared *.preview.chasesets.com
      # wildcard secret (copied into this namespace by the deploy step above,
      # before `helm upgrade --install`; see copyPreviewWildcardTlsSecret in
      # platform-kubernetes-deployment.mjs), never a per-PR cert-manager
      # issuance, so there is no ACME order to wait on here. This is a fast
      # presence check, not a poll: the deploy step already failed loudly with
      # a bootstrap pointer if the shared secret did not exist to copy (#4857).
      - name: Verify preview TLS secret
        run: |
          set -euo pipefail
          secret_name="preview-wildcard-tls"
          namespace="$CHASE_SETS_KUBERNETES_NAMESPACE"
          if ! kubectl get "secret/${secret_name}" --namespace "$namespace" >/dev/null 2>&1; then
            echo "::error::Preview TLS secret ${secret_name} is missing from ${namespace} after deploy; the shared preview wildcard copy step should have created it." >&2
            exit 1
          fi
          echo "Preview TLS secret ${secret_name} is present in ${namespace}."

      - name: Wait for preview ingress URLs
        id: preview_domains
        run: |
          set -euo pipefail
          landing_domain="${PREVIEW_IDENTIFIER}.preview.chasesets.com"
          marketplace_domain="${PREVIEW_IDENTIFIER}-marketplace.preview.chasesets.com"
          admin_domain="${PREVIEW_IDENTIFIER}-admin.preview.chasesets.com"

          node ./scripts/platform-ingress-wait.mjs \
            --url "https://${admin_domain}/health/ready" \
            --url "https://${marketplace_domain}/health/ready" \
            --attempts 24 \
            --delay-ms 5000

          node ./scripts/platform-ingress-wait.mjs \
            --url "https://${landing_domain}/" \
            --attempts 6 \
            --delay-ms 5000 && landing_domain_ready=true || landing_domain_ready=false

          {
            echo "landing_domain=${landing_domain}"
            echo "marketplace_domain=${marketplace_domain}"
            echo "admin_domain=${admin_domain}"
            echo "landing_domain_ready=${landing_domain_ready}"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke check
        env:
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_LANDING: ${{ steps.preview_domains.outputs.landing_domain_ready == 'true' && 'true' || 'false' }}
          SMOKE_REQUIRE_MARKETPLACE: "true"
          SMOKE_WAITLIST_EMAIL: ops+preview-pr-${{ github.event.pull_request.number }}@chasesets.com
          SMOKE_SOURCE: preview-smoke
          SMOKE_UTM_CAMPAIGN: pr-${{ github.event.pull_request.number }}
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
        run: |
          set -euo pipefail
          pnpm run smoke:platform -- \
            "https://${{ steps.preview_domains.outputs.landing_domain }}" \
            "https://${{ steps.preview_domains.outputs.admin_domain }}" \
            "https://${{ steps.preview_domains.outputs.marketplace_domain }}"

      - name: Stripe money smoke
        env:
          SMOKE_REGISTER_SELLER: "true"
          SMOKE_SELLER_EMAIL: stripe-preview+pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}@chasesets.test
          SMOKE_SELLER_PASSWORD: preview-stripe-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_SELLER_DISPLAY_NAME: Stripe Preview Smoke PR ${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_INVITATION_PROJECTION_TIMEOUT_MS: ${{ vars.PREVIEW_STRIPE_MONEY_SMOKE_INVITATION_PROJECTION_TIMEOUT_MS || '300000' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_MONEY_SMOKE_ENVIRONMENT: preview
          STRIPE_MONEY_SMOKE_REQUIRE_DELIVERED_WEBHOOKS: "false"
          PLATFORM_API_BASE_URL: https://${{ steps.preview_domains.outputs.marketplace_domain }}
          PLATFORM_AUTH_BASE_URL: https://${{ steps.preview_domains.outputs.marketplace_domain }}
        run: pnpm run stripe:money-smoke -- --edge-check --seller-flow

  compose-preview-smoke:
    name: Compose Boot Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Job-level so every docker compose invocation (boot, status, logs,
      # teardown) can interpolate docker-compose.pr-smoke.yml -- a step-level
      # value here broke the diagnostic steps on the first real run.
      CHASE_SETS_COMPOSE_SMOKE_IMAGE: chase-sets-platform:compose-smoke
    # #4864: app-code PRs that would previously have earned a full
    # chase-sets-pr-<n> cluster preview (dockerImageRequired) but do not
    # touch a deploy surface (cluster_preview) get this cheaper compose
    # boot+smoke instead. It needs no cloud credentials -- every value in
    # its rendered env comes from scripts/platform-compose-smoke.mjs, never
    # from `secrets.*` -- so unlike preview-deploy-smoke it is safe to run
    # on fork PRs too. The `preview` label always wins: a labelled PR gets
    # the real cluster preview above instead of this job.
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      needs['change-scope'].result == 'success' &&
      needs['change-scope'].outputs.compose_smoke == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'preview') &&
      (needs['change-scope'].outputs.local_checks != 'true' || needs.static.result == 'success') &&
      needs.typecheck.result == 'success' &&
      (needs['change-scope'].outputs.unit_tests != 'true' || needs['unit-tests'].result == 'success')
    needs:
      - change-scope
      - static
      - typecheck
      - unit-tests
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: steps.buildx.outcome == 'failure'

      - name: Build App Platform image
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --cache-from type=gha,scope=platform-image \
            --cache-to type=gha,scope=platform-image,mode=max \
            --load \
            --tag chase-sets-platform:compose-smoke \
            .

      - name: Render compose boot+smoke environment
        run: node ./scripts/platform-compose-smoke.mjs render-env-all --out-dir artifacts/compose-smoke/env

      - name: Boot compose stack
        run: docker compose -f docker-compose.pr-smoke.yml up --detach --wait --wait-timeout 300

      - name: Compose service status
        if: always()
        run: docker compose -f docker-compose.pr-smoke.yml ps

      # The compose stack has no ingress, so a small path-based proxy per
      # domain stands in for the real one (see the comment atop
      # scripts/platform-compose-ingress.mjs): platform-smoke.mjs makes the
      # same `/api`, `/ucp`, `/mcp` calls a browser would make against a
      # cluster preview's landing/marketplace/admin origins, and those calls
      # must resolve to platform-api, not the web app container.
      - name: Start compose ingress proxies
        run: |
          set -euo pipefail
          mkdir -p artifacts/compose-smoke
          nohup node ./scripts/platform-compose-ingress.mjs --port 18180 --label landing --web-target http://localhost:18192 --api-target http://localhost:18190 > artifacts/compose-smoke/ingress-landing.log 2>&1 &
          disown
          nohup node ./scripts/platform-compose-ingress.mjs --port 18181 --label marketplace --web-target http://localhost:18193 --api-target http://localhost:18190 > artifacts/compose-smoke/ingress-marketplace.log 2>&1 &
          disown
          nohup node ./scripts/platform-compose-ingress.mjs --port 18182 --label admin --web-target http://localhost:18194 --api-target http://localhost:18190 > artifacts/compose-smoke/ingress-admin.log 2>&1 &
          disown
          sleep 1

      - name: Smoke check
        env:
          # Matches scripts/platform-compose-smoke.mjs's composeSmokeAdminEmail /
          # composeSmokeAdminPassword constants -- these are compose-local
          # placeholder credentials, never a real secret.
          PLATFORM_ADMIN_EMAIL: compose-smoke@chasesets.test
          PLATFORM_ADMIN_PASSWORD: compose-smoke-not-a-real-secret
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_LANDING: "true"
          SMOKE_REQUIRE_MARKETPLACE: "true"
          SMOKE_REQUIRE_SOCIAL_LOGIN: "false"
          SMOKE_REQUIRE_ADMIN_GOOGLE_WORKSPACE_SSO: "false"
          SMOKE_REQUIRE_FULFILLMENT_POSTAGE: "false"
          SMOKE_WAITLIST_EMAIL: ops+compose-smoke-pr-${{ github.event.pull_request.number }}@chasesets.test
          SMOKE_SOURCE: compose-smoke
          SMOKE_UTM_CAMPAIGN: pr-${{ github.event.pull_request.number }}
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
        run: |
          pnpm run smoke:platform -- \
            http://localhost:18180 \
            http://localhost:18182 \
            http://localhost:18181

      - name: Compose boot logs
        if: failure()
        run: docker compose -f docker-compose.pr-smoke.yml logs --no-color

      - name: Compose ingress proxy logs
        if: failure()
        run: cat artifacts/compose-smoke/ingress-*.log

      - name: Compose teardown
        if: always()
        run: docker compose -f docker-compose.pr-smoke.yml down --volumes --remove-orphans

  pr-required:
    name: PR Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - change-scope
      - static
      - typecheck
      - unit-tests
      - db-tests
      - e2e-tests
      - build
      - docker-image
      - workflow-lint
      - terraform-preview-plan
      - terraform-staging-plan
      - terraform-production-plan
      - terraform-observability-plan
      - preview-deploy-smoke
      - compose-preview-smoke
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail

          require_job() {
            local name="$1"
            local result="$2"
            local required="$3"

            if [ "$required" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "${name} was required but finished with result '${result}'." >&2
                exit 1
              fi
              return
            fi

            if [ "$result" != "skipped" ] && [ "$result" != "success" ]; then
              echo "${name} was not required but finished with unexpected result '${result}'." >&2
              exit 1
            fi
          }

          require_job "Change Scope" "${{ needs['change-scope'].result }}" "true"
          require_job "Static Checks" "${{ needs.static.result }}" "${{ needs['change-scope'].outputs.local_checks }}"
          require_job "Typecheck" "${{ needs.typecheck.result }}" "true"
          require_job "Unit Tests" "${{ needs['unit-tests'].result }}" "${{ needs['change-scope'].outputs.unit_tests }}"
          require_job "Workflow Lint" "${{ needs['workflow-lint'].result }}" "${{ needs['change-scope'].outputs.workflow_lint }}"

          full_battery_required="${{ needs['change-scope'].outputs.full_battery_required }}"
          targeted_heavy_required="${{ needs['change-scope'].outputs.targeted_heavy_required }}"
          require_heavy_job() {
            local name="$1"
            local result="$2"
            local affected="$3"

            if [ "$full_battery_required" = "true" ] && [ "$affected" = "true" ]; then
              require_job "$name" "$result" "true"
              return
            fi

            require_job "$name" "$result" "false"
          }

          require_targeted_heavy_job() {
            local name="$1"
            local result="$2"
            local affected="$3"

            if [ "$targeted_heavy_required" = "true" ] && [ "$affected" = "true" ]; then
              require_job "$name" "$result" "true"
              return
            fi

            require_job "$name" "$result" "false"
          }

          require_targeted_heavy_job "DB Profile Tests" "${{ needs['db-tests'].result }}" "${{ needs['change-scope'].outputs.db_tests }}"
          require_targeted_heavy_job "E2E Tests" "${{ needs['e2e-tests'].result }}" "${{ needs['change-scope'].outputs.e2e_tests }}"
          require_heavy_job "Build" "${{ needs.build.result }}" "${{ needs['change-scope'].outputs.build }}"
          require_heavy_job "Docker Image Build" "${{ needs['docker-image'].result }}" "${{ needs['change-scope'].outputs.docker_image }}"
          require_heavy_job "Terraform Preview Plan" "${{ needs['terraform-preview-plan'].result }}" "${{ needs['change-scope'].outputs.terraform }}"
          require_heavy_job "Terraform Staging Plan" "${{ needs['terraform-staging-plan'].result }}" "${{ needs['change-scope'].outputs.terraform }}"
          require_heavy_job "Terraform Production Plan" "${{ needs['terraform-production-plan'].result }}" "${{ needs['change-scope'].outputs.terraform }}"
          require_job "Terraform Observability Plan" "${{ needs['terraform-observability-plan'].result }}" "${{ needs['change-scope'].outputs.terraform }}"

          preview_result="${{ needs['preview-deploy-smoke'].result }}"
          preview_required="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs['change-scope'].outputs.cluster_preview == 'true' || contains(github.event.pull_request.labels.*.name, 'preview')) }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$preview_required" = "true" ] && [ "$preview_result" != "success" ]; then
              echo "Preview deployment and smoke must pass for same-repository deploy-surface PRs and manual preview-label PRs." >&2
              exit 1
            elif [ "$preview_required" != "true" ] && [ "$preview_result" != "skipped" ] && [ "$preview_result" != "success" ]; then
              echo "Preview deployment had an unexpected result when it was not required: ${preview_result}." >&2
              exit 1
            fi
          elif [ "$preview_result" != "skipped" ] && [ "$preview_result" != "success" ]; then
            echo "Preview deployment had an unexpected result on a non-PR event: ${preview_result}." >&2
            exit 1
          fi

          # #4864: app-code PRs that are docker-image-affecting but do not
          # touch a deploy surface (and are not preview-labeled) get the
          # compose boot+smoke job instead of a cluster preview -- exactly
          # the complement of preview_required above.
          compose_result="${{ needs['compose-preview-smoke'].result }}"
          compose_required="${{ github.event_name == 'pull_request' && needs['change-scope'].outputs.compose_smoke == 'true' && !contains(github.event.pull_request.labels.*.name, 'preview') }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$compose_required" = "true" ] && [ "$compose_result" != "success" ]; then
              echo "Compose boot smoke must pass for app-code PRs that are not scoped to a cluster preview." >&2
              exit 1
            elif [ "$compose_required" != "true" ] && [ "$compose_result" != "skipped" ] && [ "$compose_result" != "success" ]; then
              echo "Compose boot smoke had an unexpected result when it was not required: ${compose_result}." >&2
              exit 1
            fi
          elif [ "$compose_result" != "skipped" ] && [ "$compose_result" != "success" ]; then
            echo "Compose boot smoke had an unexpected result on a non-PR event: ${compose_result}." >&2
            exit 1
          fi

  release-status:
    name: PR Release Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name == 'pull_request'
    needs:
      - change-scope
      - preview-deploy-smoke
      - pr-required
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Write PR release status
        env:
          PR_RELEASE_STATUS_OUT: artifacts/pr-release-status.md
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REQUIRED_RESULT: ${{ needs['pr-required'].result }}
          DEPLOYMENT_REQUIRED: ${{ needs['change-scope'].outputs.deploy }}
          PREVIEW_RESULT: ${{ needs['preview-deploy-smoke'].result }}
          EXPOSURE_POSTURE_CHANGED: ${{ needs['change-scope'].outputs.exposure_posture_changed }}
          EXPOSURE_POSTURE_CATEGORIES: ${{ needs['change-scope'].outputs.exposure_posture_categories }}
        run: node ./scripts/pr-release-status.mjs

      - name: Add status to job summary
        if: always()
        run: cat artifacts/pr-release-status.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR release status comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comment_id="$(
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- chase-sets-pr-release-status -->"))) | .id' | tail -n 1
          )"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${comment_id}" \
              -f body="$(cat artifacts/pr-release-status.md)" >/dev/null
          else
            gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -f body="$(cat artifacts/pr-release-status.md)" >/dev/null
          fi
