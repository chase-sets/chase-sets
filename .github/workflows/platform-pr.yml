name: Platform PR

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: platform-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      affected_workspaces: ${{ steps.scope.outputs.affected_workspaces }}
      build: ${{ steps.scope.outputs.build }}
      changed_files_json: ${{ steps.scope.outputs.changed_files_json }}
      cluster_preview: ${{ steps.scope.outputs.cluster_preview }}
      compose_smoke: ${{ steps.scope.outputs.compose_smoke }}
      db_tests: ${{ steps.scope.outputs.db_tests }}
      deploy: ${{ steps.scope.outputs.deploy }}
      docker_image: ${{ steps.scope.outputs.docker_image }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      e2e_tests: ${{ steps.scope.outputs.e2e_tests }}
      e2e_suites: ${{ steps.scope.outputs.e2e_suites }}
      e2e_suites_json: ${{ steps.scope.outputs.e2e_suites_json }}
      e2e_suite_batches_json: ${{ steps.scope.outputs.e2e_suite_batches_json }}
      exposure_posture_categories: ${{ steps.scope.outputs.exposure_posture_categories }}
      exposure_posture_categories_json: ${{ steps.scope.outputs.exposure_posture_categories_json }}
      exposure_posture_changed: ${{ steps.scope.outputs.exposure_posture_changed }}
      integration_risk_required: ${{ steps.scope.outputs.integration_risk_required }}
      integration_risk_reason: ${{ steps.scope.outputs.integration_risk_reason }}
      full_battery_required: ${{ steps.full-battery.outputs.required }}
      targeted_heavy_required: ${{ steps.full-battery.outputs.targeted_required }}
      targeted_heavy_reason: ${{ steps.full-battery.outputs.targeted_reason }}
      local_checks: ${{ steps.scope.outputs.local_checks }}
      terraform: ${{ steps.scope.outputs.terraform }}
      unit_tests: ${{ steps.scope.outputs.unit_tests }}
      workflow_lint: ${{ steps.scope.outputs.workflow_lint }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Resolve changed surface
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.event.merge_group.head_sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$head" ]; then
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ]; then
            base="$(git rev-parse origin/main)"
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          node ./scripts/change-scope.mjs github-output --base="${base}" --head="${head}"

      - name: Resolve full battery lane
        id: full-battery
        env:
          FULL_BATTERY_LABEL: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'full-pr-battery') || contains(github.event.pull_request.labels.*.name, 'preview')) }}
          INTEGRATION_RISK_REQUIRED: ${{ steps.scope.outputs.integration_risk_required }}
          INTEGRATION_RISK_REASON: ${{ steps.scope.outputs.integration_risk_reason }}
        run: |
          set -euo pipefail

          required=false
          reason=pr-fast-lane
          targeted_required=false
          targeted_reason=pr-fast-lane
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            required=true
            reason=merge-group
          elif [ "${FULL_BATTERY_LABEL}" = "true" ]; then
            required=true
            reason=label
          fi

          if [ "$required" = "true" ]; then
            targeted_required=true
            targeted_reason="$reason"
          elif [ "$INTEGRATION_RISK_REQUIRED" = "true" ]; then
            targeted_required=true
            targeted_reason="integration-risk: $INTEGRATION_RISK_REASON"
          fi

          {
            echo "required=${required}"
            echo "reason=${reason}"
            echo "targeted_required=${targeted_required}"
            echo "targeted_reason=${targeted_reason}"
          } >> "$GITHUB_OUTPUT"
          echo "Full battery required: ${required} (${reason})"
          echo "Targeted heavy checks required: ${targeted_required} (${targeted_reason})"

  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: change-scope
    if: needs['change-scope'].outputs.local_checks == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Check generated metadata
        run: pnpm run verify:metadata

      - name: Run static checks
        env:
          CHANGED_FILES_JSON: ${{ needs.change-scope.outputs.changed_files_json }}
        run: pnpm run verify:static

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: change-scope
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Typecheck repository
        run: pnpm run verify:typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: change-scope
    if: needs['change-scope'].outputs.unit_tests == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Run non-DB tests
        run: |
          node ./scripts/run-workspaces.mjs test --exclude-test-profile=db --concurrency=4 --workspace-list="${{ needs['change-scope'].outputs.affected_workspaces }}"
          node ./scripts/run-workspaces.mjs test:unit --test-profile=db --concurrency=4 --workspace-list="${{ needs['change-scope'].outputs.affected_workspaces }}"

  db-tests:
    name: DB Profile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: change-scope
    if: (needs['change-scope'].outputs.full_battery_required == 'true' || needs['change-scope'].outputs.integration_risk_required == 'true') && needs['change-scope'].outputs.db_tests == 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Run DB-profile tests
        run: node ./scripts/run-workspaces.mjs test:db --concurrency=2 --workspace-list="${{ needs['change-scope'].outputs.affected_workspaces }}"

  e2e-tests:
    name: E2E Tests (${{ matrix.suite_batch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: change-scope
    if: (needs['change-scope'].outputs.full_battery_required == 'true' || needs['change-scope'].outputs.integration_risk_required == 'true') && needs['change-scope'].outputs.e2e_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite_batch: ${{ fromJson(needs['change-scope'].outputs.e2e_suite_batches_json) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run marketplace e2e suites
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        run: pnpm run test:e2e:suite "${{ matrix.suite_batch }}"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e-artifacts-${{ strategy.job-index }}
          path: |
            artifacts/playwright/report
            artifacts/playwright/test-results
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: change-scope
    if: needs['change-scope'].outputs.full_battery_required == 'true' && needs['change-scope'].outputs.build == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Build workspaces
        run: node ./scripts/run-workspaces.mjs build --concurrency=4 --workspace-list="${{ needs['change-scope'].outputs.affected_workspaces }}"

  docker-image:
    name: Docker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: change-scope
    if: needs['change-scope'].outputs.full_battery_required == 'true' && needs['change-scope'].outputs.docker_image == 'true'
    env:
      DIGITALOCEAN_REGISTRY_TOKEN: ${{ secrets.DIGITALOCEAN_REGISTRY_TOKEN || secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        if: github.event_name == 'merge_group' && env.DIGITALOCEAN_REGISTRY_TOKEN != ''
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ env.DIGITALOCEAN_REGISTRY_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: steps.buildx.outcome == 'failure'

      - name: Build App Platform image
        run: |
          set -euo pipefail
          docker buildx build \
            --pull \
            --cache-from type=gha,scope=platform-image \
            --cache-to type=gha,scope=platform-image,mode=max \
            --load \
            --tag chase-sets-platform:pr-validation \
            .

      - name: Boot smoke App Platform image
        if: github.event_name == 'merge_group'
        env:
          PLATFORM_IMAGE: chase-sets-platform:pr-validation
        run: |
          set -euo pipefail

          # Keep this aligned with Build Release Image boot smoke in
          # platform-production.yml: start each web component exactly as App
          # Platform does (run_command and health_check from
          # infrastructure/digitalocean/platform/main.tf) before the merge
          # queue accepts a Docker image change.
          boot_smoke() {
            component="$1"
            workspace="$2"
            health_path="$3"
            host_port="$4"

            container_id="$(docker run -d \
              -e NODE_ENV=production \
              -e PORT=8080 \
              -p "${host_port}:8080" \
              "$PLATFORM_IMAGE" \
              pnpm --filter "$workspace" run start)"

            for _ in $(seq 1 30); do
              if curl --fail --silent --output /dev/null "http://localhost:${host_port}${health_path}"; then
                echo "Boot smoke passed for ${component} (${health_path})."
                docker rm -f "$container_id" >/dev/null
                return 0
              fi
              if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
                break
              fi
              sleep 1
            done

            echo "Boot smoke failed for ${component}: ${health_path} never became healthy." >&2
            docker logs "$container_id" >&2 || true
            docker rm -f "$container_id" >/dev/null || true
            return 1
          }

          boot_smoke marketplace "@chase-sets/app-marketplace-web" /health/ready 18080
          boot_smoke public-web "@chase-sets/app-public-web" / 18081

      - name: Push boot-smoked merge-group image
        if: github.event_name == 'merge_group' && env.DIGITALOCEAN_REGISTRY_TOKEN != ''
        env:
          PLATFORM_IMAGE: chase-sets-platform:pr-validation
        run: |
          set -euo pipefail
          tree_tag="tree-$(git rev-parse 'HEAD^{tree}')"
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            doctl registry create "$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK" --region nyc3
            registry_name="$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK"
          fi

          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${tree_tag}"
          docker tag "$PLATFORM_IMAGE" "$image"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          echo "Pushed boot-smoked merge-group image ${image}@${digest}"

      - name: Report skipped merge-group image push
        if: github.event_name == 'merge_group' && env.DIGITALOCEAN_REGISTRY_TOKEN == ''
        run: |
          echo "DigitalOcean registry credentials are unavailable for this merge_group run; build and boot smoke still validated the image."

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: change-scope
    if: needs['change-scope'].outputs.workflow_lint == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Ensure Terraform cache is not tracked
        run: |
          tracked="$(git ls-files ':(glob)**/.terraform/**')"
          if [ -n "$tracked" ]; then
            echo "Terraform working directories must stay untracked:" >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi

      - name: Run Actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Lint platform Helm chart
        run: docker run --rm -v "${PWD}:/repo" -w /repo alpine/helm:3.15.4 lint infrastructure/helm/platform

      - name: Validate rendered platform Helm manifests
        run: |
          rendered="${RUNNER_TEMP}/platform-helm-rendered.yaml"
          docker run --rm -v "${PWD}:/repo" -w /repo alpine/helm:3.15.4 template chase-sets-platform infrastructure/helm/platform > "$rendered"
          docker run --rm \
            -v "${PWD}/.github/kubeconform-schemas:/schemas:ro" \
            -v "${RUNNER_TEMP}:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -schema-location "/schemas/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -schema-location "/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -schema-location "https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -strict \
            -summary \
            "$(basename "$rendered")"

      - name: Lint DOKS ingress add-ons Helm chart
        run: docker run --rm -v "${PWD}:/repo" -w /repo alpine/helm:3.15.4 lint infrastructure/helm/doks-ingress

      - name: Validate rendered DOKS ingress add-ons manifests
        run: |
          rendered="${RUNNER_TEMP}/doks-ingress-rendered.yaml"
          docker run --rm -v "${PWD}:/repo" -w /repo alpine/helm:3.15.4 template chase-sets-doks-ingress infrastructure/helm/doks-ingress > "$rendered"
          # ClusterIssuer is a cert-manager CRD installed with cert-manager, so
          # ignore missing schemas rather than strict-failing on the CRD kind.
          docker run --rm \
            -v "${PWD}/.github/kubeconform-schemas:/schemas:ro" \
            -v "${RUNNER_TEMP}:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -schema-location "/schemas/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -schema-location "/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -schema-location "https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json" \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -ignore-missing-schemas \
            -summary \
            "$(basename "$rendered")"

      - name: Validate DOKS cluster add-ons install contract
        run: |
          node ./scripts/doks-cluster-addons.mjs --dry-run --environment staging
          node ./scripts/doks-cluster-addons.mjs --dry-run --environment production

      - name: Validate platform runtime Secret contract
        run: node ./scripts/platform-kubernetes-secret.mjs --dry-run --namespace validation

      - name: Validate platform ingress wait contract
        run: |
          node ./scripts/platform-ingress-wait.mjs \
            --dry-run \
            --url https://staging.chasesets.com/ \
            --url https://admin.staging.chasesets.com/health/ready \
            --url https://marketplace.staging.chasesets.com/health/ready

  terraform-preview-plan:
    name: Terraform Preview Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: change-scope
    if: needs['change-scope'].outputs.full_battery_required == 'true' && needs['change-scope'].outputs.terraform == 'true'
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: pr-validation-token
      TF_VAR_environment_project_id: 00000000-0000-0000-0000-000000000000
      TF_VAR_spaces_access_id: pr-validation-access-id
      TF_VAR_spaces_secret_key: pr-validation-secret-key
      TF_VAR_environment: preview
      TF_VAR_preview_identifier: pr-0
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: pr-validation
      TF_VAR_platform_internal_auth_secret: pr-validation-internal-auth-secret
      TF_VAR_platform_admin_email: ops+pr@chasesets.com
      TF_VAR_platform_admin_password: pr-validation-password-please-rotate
      TF_VAR_platform_admin_display_name: Platform Admin
      TF_VAR_discord_invite_url: https://discord.gg/pr-validation
      TF_VAR_stripe_secret_key: sk_test_pr_validation
      TF_VAR_stripe_publishable_key: pk_test_pr_validation
      TF_VAR_stripe_webhook_secret: whsec_pr_validation
      TF_VAR_stripe_connect_webhook_secret: whsec_pr_validation
      TF_VAR_easypost_api_key: EZTK_pr_validation
      TF_VAR_voyage_api_key: ""
      TF_VAR_easypost_mode: test
      TF_VAR_google_social_login_client_id: google-pr-validation-client
      TF_VAR_google_social_login_client_secret: google-pr-validation-secret
      TF_VAR_admin_google_workspace_hosted_domains: chasesets.com
      TF_VAR_facebook_social_login_client_id: facebook-pr-validation-client
      TF_VAR_facebook_social_login_client_secret: facebook-pr-validation-secret
      TF_VAR_notification_email_provider: noop
      TF_VAR_alert_emails: "[]"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init platform without remote backend
        working-directory: infrastructure/digitalocean/platform
        run: terraform init -backend=false

      - name: Terraform format platform
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Terraform validate platform
        working-directory: infrastructure/digitalocean/platform
        run: terraform validate

      - name: Terraform plan preview platform
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/platform/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

      - name: Terraform init catalog assets without remote backend
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform init -backend=false

      - name: Terraform format catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform fmt -check -recursive

      - name: Terraform validate catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform validate

      - name: Terraform plan preview catalog assets
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/catalog-assets/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

      - name: Terraform init state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform init

      - name: Terraform format state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform fmt -check -recursive

      - name: Terraform validate state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform validate

      - name: Terraform plan state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform plan -refresh=false -lock=false -out=tfplan

  terraform-production-plan:
    name: Terraform Production Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: change-scope
    if: needs['change-scope'].outputs.full_battery_required == 'true' && needs['change-scope'].outputs.terraform == 'true'
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: pr-validation-token
      TF_VAR_environment_project_id: 00000000-0000-0000-0000-000000000000
      TF_VAR_spaces_access_id: pr-validation-access-id
      TF_VAR_spaces_secret_key: pr-validation-secret-key
      TF_VAR_environment: production
      TF_VAR_kubernetes_version: 1.33.1-do.4
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: pr-validation-production
      TF_VAR_platform_internal_auth_secret: pr-validation-internal-auth-secret
      TF_VAR_platform_admin_email: ops+pr@chasesets.com
      TF_VAR_platform_admin_password: pr-validation-password-please-rotate
      TF_VAR_platform_admin_display_name: Platform Admin
      TF_VAR_discord_invite_url: https://discord.gg/pr-validation
      TF_VAR_tcgplayer_automation_tcg_auth_cookie: pr-validation-tcgplayer-cookie
      TF_VAR_scrydex_api_key: pr-validation-scrydex-api-key
      TF_VAR_scrydex_team_id: pr-validation-scrydex-team
      TF_VAR_google_social_login_client_id: ""
      TF_VAR_google_social_login_client_secret: ""
      TF_VAR_admin_google_workspace_hosted_domains: ""
      TF_VAR_facebook_social_login_client_id: ""
      TF_VAR_facebook_social_login_client_secret: ""
      TF_VAR_notification_email_provider: noop
      TF_VAR_alert_emails: "[]"
      DESTRUCTIVE_CHANGE_ALLOW_FILE: .github/deployment/production-destructive-change-approved.md
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init platform without remote backend
        working-directory: infrastructure/digitalocean/platform
        run: terraform init -backend=false

      - name: Terraform validate platform
        working-directory: infrastructure/digitalocean/platform
        run: terraform validate

      - name: Terraform plan production platform
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/platform/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan
          (
            cd "$tmp"
            node "$GITHUB_WORKSPACE/scripts/terraform-plan-inspection.mjs" assert-no-destructive-changes tfplan --allow-file="$GITHUB_WORKSPACE/${DESTRUCTIVE_CHANGE_ALLOW_FILE}"
          )

      - name: Terraform init catalog assets without remote backend
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform init -backend=false

      - name: Terraform validate catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform validate

      - name: Terraform plan production catalog assets
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/catalog-assets/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

      - name: Terraform init DOKS without remote backend
        working-directory: infrastructure/digitalocean/doks
        run: terraform init -backend=false

      - name: Terraform format DOKS
        working-directory: infrastructure/digitalocean/doks
        run: terraform fmt -check -recursive

      - name: Terraform validate DOKS
        working-directory: infrastructure/digitalocean/doks
        run: terraform validate

      - name: Terraform plan production DOKS
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/doks/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan
          (
            cd "$tmp"
            node "$GITHUB_WORKSPACE/scripts/terraform-plan-inspection.mjs" assert-no-destructive-changes tfplan --allow-file="$GITHUB_WORKSPACE/${DESTRUCTIVE_CHANGE_ALLOW_FILE}"
          )

