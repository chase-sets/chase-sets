name: Platform PR

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: platform-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated metadata
        run: pnpm run verify:metadata

      - name: Run static checks
        run: pnpm run verify:static

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck repository
        run: pnpm run verify:typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run non-DB tests
        run: pnpm run verify:test

  db-tests:
    name: DB Profile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB-profile fast tests
        run: pnpm run verify:test-db

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspaces
        run: pnpm run verify:build

  docker-image:
    name: Docker Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build App Platform image
        run: |
          docker buildx build \
            --pull \
            --cache-from type=gha,scope=platform-image-pr \
            --cache-to type=gha,scope=platform-image-pr,mode=min \
            --load \
            --tag chase-sets-platform:pr-validation \
            .

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Ensure Terraform cache is not tracked
        run: |
          tracked="$(git ls-files ':(glob)**/.terraform/**')"
          if [ -n "$tracked" ]; then
            echo "Terraform working directories must stay untracked:" >&2
            printf '%s\n' "$tracked" >&2
            exit 1
          fi

      - name: Run Actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  terraform-preview-plan:
    name: Terraform Preview Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: pr-validation-token
      TF_VAR_spaces_access_id: pr-validation-access-id
      TF_VAR_spaces_secret_key: pr-validation-secret-key
      TF_VAR_environment: preview
      TF_VAR_preview_identifier: pr-0
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: pr-validation
      TF_VAR_platform_internal_auth_secret: pr-validation-internal-auth-secret
      TF_VAR_platform_admin_email: ops+pr@chasesets.com
      TF_VAR_platform_admin_password: pr-validation-password-please-rotate
      TF_VAR_platform_admin_display_name: Platform Admin
      TF_VAR_discord_invite_url: https://discord.gg/pr-validation
      TF_VAR_stripe_secret_key: sk_test_pr_validation
      TF_VAR_stripe_publishable_key: pk_test_pr_validation
      TF_VAR_stripe_webhook_secret: whsec_pr_validation
      TF_VAR_stripe_connect_return_url: https://marketplace.pr-0.preview.chasesets.com/account/payouts
      TF_VAR_stripe_connect_refresh_url: https://marketplace.pr-0.preview.chasesets.com/account/payouts/setup
      TF_VAR_easypost_api_key: EZTK_pr_validation
      TF_VAR_easypost_mode: test
      TF_VAR_google_social_login_client_id: google-pr-validation-client
      TF_VAR_google_social_login_client_secret: google-pr-validation-secret
      TF_VAR_facebook_social_login_client_id: facebook-pr-validation-client
      TF_VAR_facebook_social_login_client_secret: facebook-pr-validation-secret
      TF_VAR_notification_email_provider: noop
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init platform without remote backend
        working-directory: infrastructure/digitalocean/platform
        run: terraform init -backend=false

      - name: Terraform format platform
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Terraform validate platform
        working-directory: infrastructure/digitalocean/platform
        run: terraform validate

      - name: Terraform plan preview platform
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/platform/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

      - name: Terraform init catalog assets without remote backend
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform init -backend=false

      - name: Terraform format catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform fmt -check -recursive

      - name: Terraform validate catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform validate

      - name: Terraform plan preview catalog assets
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/catalog-assets/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

      - name: Terraform init state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform init

      - name: Terraform format state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform fmt -check -recursive

      - name: Terraform validate state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform validate

      - name: Terraform plan state bootstrap
        working-directory: infrastructure/digitalocean/state-bootstrap
        run: terraform plan -refresh=false -lock=false -out=tfplan

  terraform-production-plan:
    name: Terraform Production Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: pr-validation-token
      TF_VAR_spaces_access_id: pr-validation-access-id
      TF_VAR_spaces_secret_key: pr-validation-secret-key
      TF_VAR_environment: production
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: pr-validation-production
      TF_VAR_platform_internal_auth_secret: pr-validation-internal-auth-secret
      TF_VAR_platform_admin_email: ops+pr@chasesets.com
      TF_VAR_platform_admin_password: pr-validation-password-please-rotate
      TF_VAR_platform_admin_display_name: Platform Admin
      TF_VAR_discord_invite_url: https://discord.gg/pr-validation
      TF_VAR_google_social_login_client_id: ""
      TF_VAR_google_social_login_client_secret: ""
      TF_VAR_facebook_social_login_client_id: ""
      TF_VAR_facebook_social_login_client_secret: ""
      TF_VAR_notification_email_provider: noop
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init platform without remote backend
        working-directory: infrastructure/digitalocean/platform
        run: terraform init -backend=false

      - name: Terraform validate platform
        working-directory: infrastructure/digitalocean/platform
        run: terraform validate

      - name: Terraform plan production platform
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/platform/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

      - name: Terraform init catalog assets without remote backend
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform init -backend=false

      - name: Terraform validate catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform validate

      - name: Terraform plan production catalog assets
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/catalog-assets/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

  terraform-staging-plan:
    name: Terraform Staging Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: pr-validation-token
      TF_VAR_spaces_access_id: pr-validation-access-id
      TF_VAR_spaces_secret_key: pr-validation-secret-key
      TF_VAR_environment: staging
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: pr-validation-staging
      TF_VAR_platform_internal_auth_secret: pr-validation-internal-auth-secret
      TF_VAR_platform_admin_email: ops+pr@chasesets.com
      TF_VAR_platform_admin_password: pr-validation-password-please-rotate
      TF_VAR_platform_admin_display_name: Platform Admin
      TF_VAR_discord_invite_url: https://discord.gg/pr-validation
      TF_VAR_stripe_secret_key: sk_test_pr_validation
      TF_VAR_stripe_publishable_key: pk_test_pr_validation
      TF_VAR_stripe_webhook_secret: whsec_pr_validation
      TF_VAR_stripe_connect_return_url: https://marketplace.staging.chasesets.com/account/payouts
      TF_VAR_stripe_connect_refresh_url: https://marketplace.staging.chasesets.com/account/payouts/setup
      TF_VAR_easypost_api_key: EZTK_pr_validation
      TF_VAR_easypost_mode: test
      TF_VAR_google_social_login_client_id: google-pr-validation-client
      TF_VAR_google_social_login_client_secret: google-pr-validation-secret
      TF_VAR_facebook_social_login_client_id: facebook-pr-validation-client
      TF_VAR_facebook_social_login_client_secret: facebook-pr-validation-secret
      TF_VAR_notification_email_provider: noop
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init platform without remote backend
        working-directory: infrastructure/digitalocean/platform
        run: terraform init -backend=false

      - name: Terraform validate platform
        working-directory: infrastructure/digitalocean/platform
        run: terraform validate

      - name: Terraform plan staging platform
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/platform/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

      - name: Terraform init catalog assets without remote backend
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform init -backend=false

      - name: Terraform validate catalog assets
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform validate

      - name: Terraform plan staging catalog assets
        run: |
          tmp="$(mktemp -d)"
          cp -R infrastructure/digitalocean/catalog-assets/. "$tmp/"
          sed -i '/backend "s3" {}/d' "$tmp/versions.tf"
          terraform -chdir="$tmp" init -backend=false
          terraform -chdir="$tmp" plan -refresh=false -lock=false -out=tfplan

  preview-deploy-smoke:
    name: Deploy Preview and Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    environment: preview
    needs:
      - static
      - typecheck
      - unit-tests
      - db-tests
      - build
      - docker-image
      - workflow-lint
      - terraform-preview-plan
      - terraform-staging-plan
      - terraform-production-plan
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: preview
      TF_VAR_preview_identifier: pr-${{ github.event.pull_request.number }}
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      TF_VAR_stripe_connect_return_url: https://marketplace.pr-${{ github.event.pull_request.number }}.preview.chasesets.com/account/payouts
      TF_VAR_stripe_connect_refresh_url: https://marketplace.pr-${{ github.event.pull_request.number }}.preview.chasesets.com/account/payouts/setup
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v6

      - name: Validate preview configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url \
            TF_VAR_stripe_secret_key \
            TF_VAR_stripe_publishable_key \
            TF_VAR_stripe_webhook_secret \
            TF_VAR_easypost_api_key
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required preview configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [ "${TF_VAR_notification_email_provider:-}" = "amazon-ses" ]; then
            ses_missing=()
            for name in \
              TF_VAR_ses_aws_region \
              TF_VAR_ses_from_email \
              TF_VAR_ses_configuration_set_name \
              TF_VAR_ses_source_arn
            do
              if [ -z "${!name:-}" ]; then
                ses_missing+=("$name")
              fi
            done

            if [ "${#ses_missing[@]}" -gt 0 ]; then
              printf 'Missing required preview SES configuration: %s\n' "${ses_missing[*]}" >&2
              exit 1
            fi
          fi

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push App Platform image
        id: image
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            doctl registry create "$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK" --region nyc3
            registry_name="$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK"
          fi

          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${TF_VAR_platform_image_tag}"
          docker buildx build \
            --pull \
            --cache-from type=gha,scope=platform-image-preview \
            --cache-to type=gha,scope=platform-image-preview,mode=min \
            --push \
            --tag "$image" \
            .

          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${image}@${digest}"

      - name: Terraform init
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=platform/previews/pr-${{ github.event.pull_request.number }}.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Terraform plan
        id: terraform_plan
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
          TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: |
          set -euo pipefail
          terraform plan -out=tfplan
          app_changed="$(node ../../../scripts/digitalocean-app-deployment.mjs plan-app-changed tfplan)"
          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"

      - name: Wait for previous App Platform deployment
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail

          app_id="$(terraform output -raw app_id 2>/dev/null || true)"
          if [ -z "$app_id" ]; then
            echo "No existing App Platform app was found in Terraform state; skipping deployment wait."
            exit 0
          fi

          node ../../../scripts/digitalocean-app-deployment.mjs wait "$app_id" --timeout-seconds=1800 --poll-seconds=30

      - name: Terraform apply
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
          TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
          TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
          TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
          TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
          TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
          TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
          TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
          TF_VAR_notification_email_provider: ${{ vars.NOTIFICATION_EMAIL_PROVIDER || 'noop' }}
          TF_VAR_ses_aws_region: ${{ vars.SES_AWS_REGION || '' }}
          TF_VAR_ses_from_email: ${{ vars.SES_FROM_EMAIL || '' }}
          TF_VAR_ses_configuration_set_name: ${{ vars.SES_CONFIGURATION_SET_NAME || '' }}
          TF_VAR_ses_source_arn: ${{ secrets.SES_SOURCE_ARN || '' }}
        run: terraform apply -auto-approve tfplan

      - name: Wait for Terraform App Platform deployment
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          node ../../../scripts/digitalocean-app-deployment.mjs wait "$app_id" --timeout-seconds=1800 --poll-seconds=30

      - name: Deploy App Platform image
        if: steps.terraform_plan.outputs.app_changed != 'true'
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          node ../../../scripts/digitalocean-app-deployment.mjs deploy "$app_id" --force-rebuild

      - name: Wait for preview domains
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ -z "$marketplace_domain" ]; then
            echo "Required preview domains were not present in Terraform outputs." >&2
            exit 1
          fi

          node ../../../scripts/digitalocean-app-deployment.mjs wait-domains \
            "$app_id" \
            "$landing_domain" \
            "$admin_domain" \
            "$marketplace_domain" \
            --timeout-seconds=1800 \
            --poll-seconds=30

      - name: Smoke check
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_MARKETPLACE: "true"
          SMOKE_WAITLIST_EMAIL: ops+preview-pr-${{ github.event.pull_request.number }}@chasesets.com
          SMOKE_SOURCE: preview-smoke
          SMOKE_UTM_CAMPAIGN: pr-${{ github.event.pull_request.number }}
          SMOKE_FETCH_ATTEMPTS: "24"
          SMOKE_FETCH_RETRY_DELAY_MS: "5000"
        run: |
          set -euo pipefail
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ -z "$marketplace_domain" ]; then
            echo "Required preview smoke domains were not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          pnpm run smoke:platform -- "https://${landing_domain}" "https://${admin_domain}" "https://${marketplace_domain}"

  pr-required:
    name: PR Required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - static
      - typecheck
      - unit-tests
      - db-tests
      - build
      - docker-image
      - workflow-lint
      - terraform-preview-plan
      - terraform-staging-plan
      - terraform-production-plan
      - preview-deploy-smoke
    steps:
      - name: Verify required jobs
        run: |
          set -euo pipefail

          for result in \
            "${{ needs.static.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs['unit-tests'].result }}" \
            "${{ needs['db-tests'].result }}" \
            "${{ needs.build.result }}" \
            "${{ needs['docker-image'].result }}" \
            "${{ needs['workflow-lint'].result }}" \
            "${{ needs['terraform-preview-plan'].result }}" \
            "${{ needs['terraform-staging-plan'].result }}" \
            "${{ needs['terraform-production-plan'].result }}"
          do
            if [ "$result" != "success" ]; then
              echo "At least one required CI job failed or was skipped." >&2
              exit 1
            fi
          done

          preview_result="${{ needs['preview-deploy-smoke'].result }}"
          preview_required="${{ contains(github.event.pull_request.labels.*.name, 'preview') }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$preview_required" = "true" ] && [ "$preview_result" != "success" ]; then
              echo "Preview deployment and smoke must pass when the preview label is present." >&2
              exit 1
            fi
          elif [ "$preview_result" != "skipped" ] && [ "$preview_result" != "success" ]; then
            echo "Preview deployment had an unexpected result on a non-PR event: ${preview_result}." >&2
            exit 1
          fi
