name: Corten Pilot

# The Corten pilot (deployables/corten-pilot) is a Cargo workspace of standalone Rust apps that are
# not deployed and are not part of the platform gates. This job checks it on its own, only when it changes.
on:
  pull_request:
    paths:
      - "deployables/corten-pilot/**"
      - ".github/workflows/corten-pilot.yml"
  push:
    branches: ["pilot/corten"]
    paths:
      - "deployables/corten-pilot/**"
      - ".github/workflows/corten-pilot.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: corten-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the Corten pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: deployables/corten-pilot
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          # scripts/export.mjs imports admin-web's and marketplace's TypeScript sources through tsx.
          install: "true"

      - name: The exported text, tokens, nav and defaults match the React apps' sources
        run: node --import tsx scripts/export.mjs --check

      # Corten does not check that a var() names a defined token yet (todd-skelton/corten#179).
      - name: Every var() names a design-system token or a declared property
        run: node scripts/check-tokens.mjs

      # corten check type-checks each app's scripts with tsc from the PATH, and passes without it,
      # so the repo's TypeScript is put on the PATH and required here (README.md, Corten gaps).
      - name: TypeScript on the PATH for corten check
        run: |
          set -euo pipefail
          test -x "$GITHUB_WORKSPACE/node_modules/.bin/tsc"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/corten
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            deployables/corten-pilot/target
          # v2: v1 cached the binary without cargo's install records, so a cache hit made
          # `cargo install` refuse ("binary `corten` already exists").
          key: corten-pilot-v2-${{ runner.os }}-${{ hashFiles('deployables/corten-pilot/Cargo.lock') }}

      - name: Rust toolchain and the Corten CLI at the pinned revision
        run: |
          set -euo pipefail
          rustup component add clippy rustfmt
          rev="$(sed -n 's/^corten = { git = "[^"]*", rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)"
          test -n "$rev"
          # Skipped when the cached binary was built from the same revision (cargo's install records
          # are cached with it).
          cargo install --locked --git https://github.com/todd-skelton/corten --rev "$rev" corten-cli

      - name: corten check (cargo fmt, corten fmt, clippy -D warnings, the scripts' types, tests)
        run: |
          set -euo pipefail
          corten check 2>&1 | tee corten-check.log
          ! grep -q "were not type-checked" corten-check.log
