name: Corten Pilot

# The Corten pilot (deployables/corten-pilot) is a Cargo workspace of Rust apps; its admin, marketplace
# and public apps serve production. This workflow is advisory: it is not a required status check (main requires only
# "PR Required"), the delivery loop waits only on required checks, and it does not run in the merge
# queue, so it never blocks a merge. Platform PR's Corten Pilot Check runs the same steps (the
# corten-pilot-check action) as a required gate when a change touches the pilot's admin, marketplace,
# platform or public code, its Cargo files or its export, and in the merge queue.
#
# It runs on every pull request and every push to main, except changes to documentation alone, so
# drift between main and the pilot shows up on the PR that causes it rather than days later. The
# pilot's export reads the React apps' text, nav and tokens through their TypeScript imports, which
# reach most of the workspace, so a path list would miss causes. A failure caused by a change
# elsewhere is noted on that PR and fixed by the pilot's owner (deployables/corten-pilot/AGENTS.md).
# A pull request that touches only the paths the required gate selects runs that gate alone.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      # Selected by Platform PR's required Corten Pilot Check (scripts/change-scope.mjs).
      - "deployables/corten-pilot/admin/**"
      - "deployables/corten-pilot/marketplace/**"
      - "deployables/corten-pilot/platform/**"
      - "deployables/corten-pilot/public/**"
      - "deployables/corten-pilot/Cargo.toml"
      - "deployables/corten-pilot/Cargo.lock"
      - "deployables/corten-pilot/scripts/export.mjs"
      - ".github/actions/corten-pilot-check/**"
  push:
    branches: ["main", "pilot/corten"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: corten-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the Corten pilot
    # Ubuntu 24.04, the image Corten Marketplace Browser Tests (platform-pr.yml) needs for Chromium,
    # so that job can reuse this check's Rust cache.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/corten-pilot-check
