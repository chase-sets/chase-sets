name: Platform Staging Advisory Evidence

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact release commit already applied to staging.
        required: true
        type: string
      platform_image:
        description: SHA-tagged platform image already applied to staging.
        required: true
        type: string
      platform_image_digest:
        description: Immutable digest of the platform image applied to staging.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-staging-advisory-evidence
  cancel-in-progress: false

jobs:
  staging-advisory-evidence:
    name: Staging Advisory Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    outputs:
      scenario_seed_error: ${{ steps.summarize.outputs.scenario_seed_error }}
      advisory_preflight_error: ${{ steps.advisory_preflight.outputs.error }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: staging
      CHASE_SETS_HELM_RELEASE: chase-sets-platform
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
      PLATFORM_IMAGE_REF: ${{ inputs.platform_image }}@${{ inputs.platform_image_digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check out applied staging release
        id: checkout_release
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PLATFORM_IMAGE: ${{ inputs.platform_image }}
          PLATFORM_IMAGE_DIGEST: ${{ inputs.platform_image_digest }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Advisory evidence requires a full release commit SHA." >&2
            exit 1
          }
          if ! [[ "$PLATFORM_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Advisory evidence requires an immutable platform image digest." >&2
            exit 1
          fi
          if [[ "$PLATFORM_IMAGE" != registry.digitalocean.com/*/chase-sets-platform:"$RELEASE_COMMIT" ]]; then
            echo "Advisory evidence image must be the release commit's SHA-tagged platform image." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "Advisory evidence release commit must be contained in origin/main." >&2
            exit 1
          fi
          git checkout --detach "$RELEASE_COMMIT"

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Terraform init staging platform
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Configure staging Kubernetes context
        id: advisory_preflight
        continue-on-error: true
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PLATFORM_IMAGE: ${{ inputs.platform_image }}
          PLATFORM_IMAGE_DIGEST: ${{ inputs.platform_image_digest }}
          GITHUB_API_URL: https://api.github.com
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true
          kubeconfig="${RUNNER_TEMP}/chase-sets-staging-advisory.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"
          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS state exposes neither cluster_id nor cluster_name." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi
          KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          export KUBECONFIG="$kubeconfig"
          cd ../../..
          protocol="$(node infrastructure/helm/platform/scripts/bootstrap-quiesce.mjs --protocol-version)"
          if [ "$protocol" != "owner-fenced-seed-yield/v1" ]; then
            echo "advisory preflight refused: owner-fenced-seed-yield/v1 marker is absent" >&2
            {
              echo "freshness_status=stale"
              echo "freshness_reason=owner-fenced-seed-yield/v1 marker is absent"
              echo "error=owner-fenced-seed-yield/v1 marker is absent"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import { execFile } from "node:child_process";
          import { promisify } from "node:util";
          import { parsePlatformImageRef, readGitHubProductionWriterCensus, readHelmOperationCensus } from "./scripts/platform-kubernetes-deployment.mjs";

          const execFileAsync = promisify(execFile);
          const output = (name, value) => appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${String(value ?? "").replaceAll("\\n", " ")}\\n`);
          const refusal = (status, reason, observed = {}) => {
            output("freshness_status", status);
            output("freshness_reason", reason);
            output("error", reason);
            output("observed_release_commit", observed.releaseCommit);
            output("observed_platform_image", observed.platformImage);
            output("observed_platform_image_digest", observed.platformImageDigest);
            throw new Error(reason);
          };
          const members = new Set([
            "platform-preview-wildcard-tls.yml",
            "platform-production.yml",
            "platform-staging-admin-qa-actor-fixtures.yml",
            "platform-staging-bootstrap-hook-drill.yml",
            "platform-staging-cluster-addons.yml",
            "platform-staging-evidence-window.yml",
            "platform-staging-helm-recovery.yml",
            "platform-staging-representative-commerce-state.yml",
            "platform-staging-reset.yml",
            "platform-staging-rollback-drill.yml",
          ]);
          const activeStatuses = new Set(["requested", "pending", "queued", "in_progress", "waiting"]);
          const api = async (path) => {
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/${path}`, {
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GH_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" },
            });
            if (!response.ok) throw new Error(`GitHub authority read failed with HTTP ${response.status}`);
            return response.json();
          };
          const activeRuns = [];
          for (const status of activeStatuses) {
            const page = await api(`actions/runs?status=${status}&per_page=100&page=1`);
            if (!Array.isArray(page.workflow_runs) || !Number.isSafeInteger(page.total_count) || page.total_count > 100 || page.workflow_runs.length !== page.total_count) {
              throw new Error(`GitHub authority census is incomplete for ${status} runs`);
            }
            activeRuns.push(...page.workflow_runs);
          }
          try {
            const currentRun = await api(`actions/runs/${process.env.GITHUB_RUN_ID}`);
            const currentStart = new Date(currentRun.run_started_at ?? currentRun.created_at);
            const memberOverlap = async (workflow) => {
              const page = await api(`actions/workflows/${workflow}/runs?per_page=100&page=1`);
              if (!Array.isArray(page.workflow_runs) || !Number.isSafeInteger(page.total_count) || page.total_count > 100 || page.workflow_runs.length !== page.total_count) {
                throw new Error(`GitHub authority census is incomplete for ${workflow}`);
              }
              for (const run of page.workflow_runs) {
                if (String(run.id) === process.env.GITHUB_RUN_ID) continue;
                if (activeStatuses.has(run.status)) return `active ${workflow} run ${run.id}`;
                if (run.status !== "completed") continue;
                const jobs = await api(`actions/runs/${run.id}/attempts/${run.run_attempt ?? 1}/jobs?per_page=100&page=1`);
                if (!Array.isArray(jobs.jobs) || !Number.isSafeInteger(jobs.total_count) || jobs.total_count > 100 || jobs.jobs.length !== jobs.total_count) {
                  throw new Error(`GitHub authority job census is incomplete for ${workflow} run ${run.id}`);
                }
                if (jobs.jobs.some((job) => job.started_at && job.completed_at && new Date(job.started_at) < currentStart && new Date(job.completed_at) > currentStart)) {
                  return `completed overlap ${workflow} run ${run.id}`;
                }
              }
              return null;
            };
            const requested = parsePlatformImageRef(process.env.PLATFORM_IMAGE);
            const values = JSON.parse((await execFileAsync("helm", ["get", "values", "chase-sets-platform", "--namespace", "chase-sets-platform", "--output", "json"])).stdout);
            const image = values?.global?.image;
            const observed = {
              releaseCommit: image?.tag ?? null,
              platformImage: image ? `${image.registry}/${image.registryName}/${image.repository}:${image.tag}` : null,
              platformImageDigest: image?.digest ?? null,
            };
            if (!image || image.registry !== requested.registry || image.registryName !== requested.registryName || image.repository !== requested.repository || image.tag !== requested.tag || image.digest !== process.env.PLATFORM_IMAGE_DIGEST) {
              refusal("stale", "advisory preflight refused: applied staging release identity does not match requested inputs", observed);
            }
            const helmCensus = await readHelmOperationCensus({ release: "chase-sets-platform", namespace: "chase-sets-platform" });
            if (helmCensus.activeOperations.length > 0) {
              refusal("stale", `advisory preflight refused: active Helm hook ${helmCensus.activeOperations.map(({ kind, name }) => `${kind}/${name}`).join(", ")}`, observed);
            }
            const conflicting = activeRuns.find((run) => members.has(String(run.path ?? "").split("/").at(-1)) && String(run.id) !== process.env.GITHUB_RUN_ID);
            const production = activeRuns.find((run) => ["Platform Deploy", "Platform Production Stale Helm Recovery"].includes(run.name));
            if (production) {
              const productionCensus = await readGitHubProductionWriterCensus({
                env: {
                  GITHUB_TOKEN: process.env.GH_TOKEN,
                  GITHUB_REPOSITORY: process.env.GITHUB_REPOSITORY,
                  GITHUB_RUN_ID: String(production.id),
                  GITHUB_RUN_ATTEMPT: String(production.run_attempt ?? 1),
                  GITHUB_WORKFLOW: production.name,
                  GITHUB_API_URL: process.env.GITHUB_API_URL,
                },
              });
              if (productionCensus.writerRuns.length > 0 || productionCensus.concurrencyQueuedRuns.length > 0) {
                refusal("stale", "advisory preflight refused: platform production writer is active or queued", observed);
              }
            }
            if (conflicting) refusal("stale", `advisory preflight refused: staging member ${conflicting.name} run ${conflicting.id} is active`, observed);
            for (const workflow of members) {
              const overlap = await memberOverlap(workflow);
              if (overlap) refusal("stale", `advisory preflight refused: ${overlap}`, observed);
            }
            output("freshness_status", "fresh");
            output("freshness_reason", "complete non-overlapping staging advisory window");
            output("observed_release_commit", observed.releaseCommit);
            output("observed_platform_image", observed.platformImage);
            output("observed_platform_image_digest", observed.platformImageDigest);
            output("error", "");
          } catch (error) {
            if (!(error instanceof Error) || !error.message.startsWith("advisory preflight")) {
              output("freshness_status", "unknown");
              output("freshness_reason", `advisory preflight authority unknown: ${error instanceof Error ? error.message : String(error)}`);
              output("error", `advisory preflight authority unknown: ${error instanceof Error ? error.message : String(error)}`);
            }
            throw error;
          }
          NODE

      - name: Seed staging Kubernetes scenario data
        id: scenario_seed
        if: steps.advisory_preflight.outcome == 'success'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-advisory-evidence
          catalog_asset_public_base_url="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_public_base_url)"
          catalog_asset_s3_bucket="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_bucket)"
          catalog_asset_s3_endpoint="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_endpoint)"
          catalog_asset_s3_region="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_region)"
          if [ -z "$catalog_asset_public_base_url" ] || [ -z "$catalog_asset_s3_bucket" ] || [ -z "$catalog_asset_s3_endpoint" ] || [ -z "$catalog_asset_s3_region" ]; then
            echo "Staging catalog asset runtime env outputs are required before scenario seeding." >&2
            exit 1
          fi
          managed_postgres_ca_sha256="$(helm get values "$CHASE_SETS_HELM_RELEASE" --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" --output json | jq -r '.global.managedPostgresCaSha256 // empty')"
          if ! [[ "$managed_postgres_ca_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The deployed staging Helm release is not managed-Postgres-CA mount-aware." >&2
            exit 1
          fi
          pnpm run platform:kubernetes-deployment -- scenario-seed \
            --image "$PLATFORM_IMAGE_REF" \
            --image-pull-secret chase-sets \
            --runtime-env "DEPLOYMENT_ENVIRONMENT=staging" \
            --runtime-env "CHASE_SETS_RUNTIME_PROFILE=public" \
            --runtime-env "CATALOG_ASSET_PUBLIC_BASE_URL=${catalog_asset_public_base_url}" \
            --runtime-env "CATALOG_ASSET_S3_BUCKET=${catalog_asset_s3_bucket}" \
            --runtime-env "CATALOG_ASSET_S3_ENDPOINT=${catalog_asset_s3_endpoint}" \
            --runtime-env "CATALOG_ASSET_S3_REGION=${catalog_asset_s3_region}" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --quiesce-workers true \
            --managed-postgres-ca-sha256 "$managed_postgres_ca_sha256" \
            --timeout 60m \
            --out artifacts/staging-advisory-evidence/scenario-seed.json

      - name: Await staging scenario-seed Job termination
        if: always() && steps.scenario_seed.outcome != 'skipped'
        timeout-minutes: 60
        env:
          ADVISORY_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          set -euo pipefail
          ns="$CHASE_SETS_KUBERNETES_NAMESPACE"
          job="${CHASE_SETS_HELM_RELEASE}-scenario-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pods="app.kubernetes.io/instance=${CHASE_SETS_HELM_RELEASE},app.kubernetes.io/component=scenario-seed,batch.kubernetes.io/job-name=${job}"
          deadline=$(( $(date +%s) + 3420 ))
          if [ "$ADVISORY_CANCELLED" = "true" ]; then
            kubectl delete job "$job" -n "$ns" --cascade=foreground --wait=true --ignore-not-found=true
          fi
          while true; do
            status="$(kubectl get job "$job" -n "$ns" --ignore-not-found=true -o json)"
            active="$(kubectl get pods -n "$ns" -l "$pods" \
              --field-selector=status.phase!=Succeeded,status.phase!=Failed -o name)"
            if { [ -z "$status" ] || jq -e '(.status.succeeded // 0) > 0 or
                any(.status.conditions[]?; (.type == "Complete" or .type == "Failed") and .status == "True")' <<< "$status" >/dev/null; } \
                && [ -z "$active" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::scenario-seed Job still active; staging serialization group must not be released" >&2
              exit 1
            fi
            sleep 10
          done
          # Release only this Job's owner/CAS pause; reclaim refuses a deleted Job.
          scenario_seed_release_command="scenario-seed-release"
          if ! node ./scripts/platform-kubernetes-deployment.mjs "$scenario_seed_release_command" \
            --job-name "$job" --namespace "$ns" --release "$CHASE_SETS_HELM_RELEASE" --reclaim true; then
            echo "::error::scenario-seed owner/CAS cleanup refused; advisory evidence is stale." >&2
            exit 1
          fi
          kubectl delete rolebinding,role,serviceaccount -n "$ns" \
            -l "app.kubernetes.io/instance=${CHASE_SETS_HELM_RELEASE},app.kubernetes.io/component=scenario-seed-quiesce,chase-sets.com/scenario-seed-job=${job}" \
            --ignore-not-found=true

      - name: Resolve Playwright Chromium version
        id: staging-playwright-chromium
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "Could not resolve Playwright version from pnpm-lock.yaml." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium for staging critical flows
        id: staging-playwright-chromium-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.staging-playwright-chromium.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium for staging critical flows
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Staging marketplace critical flows
        id: marketplace_e2e
        if: steps.advisory_preflight.outcome == 'success' && steps.scenario_seed.outcome == 'success'
        continue-on-error: true
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          CI: "true"
          PLAYWRIGHT_SKIP_WEB_SERVER: "true"
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL || '' }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD || '' }}
          MARKETPLACE_E2E_EMAIL: ${{ vars.MARKETPLACE_E2E_EMAIL || '' }}
          MARKETPLACE_E2E_PASSWORD: ${{ secrets.MARKETPLACE_E2E_PASSWORD || '' }}
          MARKETPLACE_E2E_SEARCH_QUERY: ${{ vars.MARKETPLACE_E2E_SEARCH_QUERY || 'charizard' }}
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || '' }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          set -euo pipefail
          missing_trust_inputs=()
          for name in PLATFORM_ADMIN_EMAIL PLATFORM_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing_trust_inputs+=("$name")
            fi
          done
          if [ "${#missing_trust_inputs[@]}" -gt 0 ]; then
            printf 'credentials-not-threaded: staging marketplace E2E missing required trust inputs: %s\n' "${missing_trust_inputs[*]}" >&2
            exit 1
          fi
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          landing_domain="$(terraform output -raw landing_domain)"
          if [ -z "$admin_domain" ] || [ -z "$marketplace_domain" ] || [ -z "$landing_domain" ]; then
            echo "Required staging admin, marketplace, or landing domain was not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          ADMIN_WEB_URL="https://${admin_domain}" MARKETPLACE_WEB_URL="https://${marketplace_domain}" PUBLIC_WEB_URL="https://${landing_domain}" pnpm run test:e2e:deployed

      - name: Summarize staging advisory evidence
        id: summarize
        if: always()
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          SCENARIO_SEED_OUTCOME: ${{ steps.scenario_seed.outcome || 'skipped' }}
          MARKETPLACE_E2E_OUTCOME: ${{ steps.marketplace_e2e.outcome || 'skipped' }}
          ADVISORY_PREFLIGHT_OUTCOME: ${{ steps.advisory_preflight.outcome || 'skipped' }}
          ADVISORY_PREFLIGHT_ERROR: ${{ steps.advisory_preflight.outputs.error || 'none captured' }}
          FRESHNESS_STATUS: ${{ steps.advisory_preflight.outputs.freshness_status || 'unknown' }}
          FRESHNESS_REASON: ${{ steps.advisory_preflight.outputs.freshness_reason || 'preflight did not complete' }}
          OBSERVED_RELEASE_COMMIT: ${{ steps.advisory_preflight.outputs.observed_release_commit || '' }}
          OBSERVED_PLATFORM_IMAGE: ${{ steps.advisory_preflight.outputs.observed_platform_image || '' }}
          OBSERVED_PLATFORM_IMAGE_DIGEST: ${{ steps.advisory_preflight.outputs.observed_platform_image_digest || '' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Advisory evidence requires a full release commit SHA." >&2
            exit 1
          }
          mkdir -p artifacts/staging-advisory-evidence
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # The seed CLI writes this record on failure too, so the pod's bootstrap error survives the
          # continue-on-error step and reaches both the step summary and the advisory incident comment.
          scenario_seed_error=""
          if [ -f artifacts/staging-advisory-evidence/scenario-seed.json ]; then
            scenario_seed_error="$(jq -r '.bootstrapError // empty' artifacts/staging-advisory-evidence/scenario-seed.json)"
          fi
          {
            echo "scenario_seed_error<<SCENARIO_SEED_ERROR_EOF"
            echo "$scenario_seed_error"
            echo "SCENARIO_SEED_ERROR_EOF"
          } >> "$GITHUB_OUTPUT"
          failed_phases="$(jq -cn \
            --arg advisoryPreflight "${ADVISORY_PREFLIGHT_OUTCOME:-skipped}" \
            --arg scenarioSeed "${SCENARIO_SEED_OUTCOME:-skipped}" \
            --arg marketplaceE2e "${MARKETPLACE_E2E_OUTCOME:-skipped}" \
            '[if $advisoryPreflight == "success" then empty else "advisory-preflight" end, if $scenarioSeed == "success" then empty else "scenario-seed" end, if $marketplaceE2e == "success" then empty else "marketplace-e2e" end]')"
          jq -n \
            --arg checkedAt "$checked_at" \
            --arg releaseCommit "$RELEASE_COMMIT" \
            --arg platformImage "${{ inputs.platform_image }}" \
            --arg platformImageDigest "${{ inputs.platform_image_digest }}" \
            --arg advisoryPreflight "${ADVISORY_PREFLIGHT_OUTCOME:-skipped}" \
            --arg advisoryPreflightError "${ADVISORY_PREFLIGHT_ERROR:-none captured}" \
            --arg freshnessStatus "${FRESHNESS_STATUS:-unknown}" \
            --arg freshnessReason "${FRESHNESS_REASON:-preflight did not complete}" \
            --arg observedReleaseCommit "${OBSERVED_RELEASE_COMMIT:-}" \
            --arg observedPlatformImage "${OBSERVED_PLATFORM_IMAGE:-}" \
            --arg observedPlatformImageDigest "${OBSERVED_PLATFORM_IMAGE_DIGEST:-}" \
            --arg scenarioSeed "${SCENARIO_SEED_OUTCOME:-skipped}" \
            --arg marketplaceE2e "${MARKETPLACE_E2E_OUTCOME:-skipped}" \
            --argjson failedPhases "$failed_phases" \
            '{schemaVersion:"staging-advisory-evidence/v2",checkedAt:$checkedAt,releaseCommit:$releaseCommit,platformImage:$platformImage,platformImageDigest:$platformImageDigest,admission:{outcome:$freshnessStatus,error:$advisoryPreflightError},freshness:{status:$freshnessStatus,reason:$freshnessReason,requested:{releaseCommit:$releaseCommit,platformImage:$platformImage,platformImageDigest:$platformImageDigest},observed:{releaseCommit:$observedReleaseCommit,platformImage:$observedPlatformImage,platformImageDigest:$observedPlatformImageDigest}},scenarioSeed:{outcome:$scenarioSeed},marketplaceE2e:{outcome:$marketplaceE2e},failedPhases:$failedPhases}' \
            > artifacts/staging-advisory-evidence/summary.json
          {
            echo "## Staging advisory evidence"
            echo ""
            echo "| Evidence | Outcome | Promotion impact |"
            echo "| --- | --- | --- |"
            echo "| Scenario seed | ${SCENARIO_SEED_OUTCOME} | Advisory |"
            echo "| Marketplace deployed E2E | ${MARKETPLACE_E2E_OUTCOME} | Advisory |"
            echo ""
            echo "Scenario seed bootstrap error: ${scenario_seed_error:-none captured}"
            echo "Advisory preflight: ${ADVISORY_PREFLIGHT_OUTCOME:-unknown} (${FRESHNESS_STATUS:-unknown}) — ${FRESHNESS_REASON:-preflight did not complete}"
            echo "Observed release: ${OBSERVED_RELEASE_COMMIT:-unknown}@${OBSERVED_PLATFORM_IMAGE_DIGEST:-unknown}"
            echo ""
            echo "Release: $RELEASE_COMMIT@${{ inputs.platform_image_digest }}"
            echo ""
            echo "Failures remain visible here and through the deduplicated advisory incident; they do not govern production promotion."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging advisory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-advisory-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/staging-advisory-evidence/summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail scenario-seed advisory signal
        if: always() && steps.scenario_seed.outcome != 'success'
        env:
          SCENARIO_SEED_OUTCOME: ${{ steps.scenario_seed.outcome || 'skipped' }}
        run: |
          echo "Advisory scenario-seed phase failed with outcome ${SCENARIO_SEED_OUTCOME}; production promotion is unaffected." >&2
          exit 1

      - name: Fail marketplace E2E advisory signal
        if: always() && steps.marketplace_e2e.outcome != 'success'
        env:
          MARKETPLACE_E2E_OUTCOME: ${{ steps.marketplace_e2e.outcome || 'skipped' }}
        run: |
          echo "Advisory marketplace E2E phase failed with outcome ${MARKETPLACE_E2E_OUTCOME}; production promotion is unaffected." >&2
          exit 1

  notify-staging-advisory-evidence:
    name: Notify Staging Advisory Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: staging-advisory-evidence
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create, update, or resolve advisory evidence incident
        env:
          GH_TOKEN: ${{ github.token }}
          ADVISORY_RESULT: ${{ needs.staging-advisory-evidence.result }}
          SCENARIO_SEED_ERROR: ${{ needs.staging-advisory-evidence.outputs.scenario_seed_error }}
          ADVISORY_PREFLIGHT_ERROR: ${{ needs.staging-advisory-evidence.outputs.advisory_preflight_error }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          ARTIFACTS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?attempt=${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Advisory evidence requires a full release commit SHA." >&2
            exit 1
          }
          title="Incident: Staging advisory evidence failing"
          existing_issue="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "\"${title}\" in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ "$ADVISORY_RESULT" = "success" ]; then
            if [ -n "$existing_issue" ]; then
              gh issue close "$existing_issue" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "Advisory staging evidence recovered for ${RELEASE_COMMIT}: ${RUN_URL}"
            else
              echo "Advisory staging evidence passed; no incident is open."
            fi
            exit 0
          fi
          body="$(cat <<EOF
          Advisory staging evidence failed without changing the production promotion decision.

          - Release commit: ${RELEASE_COMMIT}
          - Advisory result: ${ADVISORY_RESULT}
          - Scenario seed bootstrap error: ${SCENARIO_SEED_ERROR:-none captured}
          - Advisory preflight: ${ADVISORY_PREFLIGHT_ERROR:-none captured}
          - Workflow run: ${RUN_URL}
          - Evidence artifacts: ${ARTIFACTS_URL}

          Inspect scenario-seed and deployed marketplace E2E evidence. Reruns are serialized in the advisory lane and reconcile the same representative staging contracts.
          EOF
          )"
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "${GITHUB_REPOSITORY}" --body "$body"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --body "$body" \
              --label "kind:ops" \
              --label "area:infrastructure"
          fi
