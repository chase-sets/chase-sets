name: Platform Staging Advisory Evidence

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact release commit already applied to staging.
        required: true
        type: string
      platform_image:
        description: SHA-tagged platform image already applied to staging.
        required: true
        type: string
      platform_image_digest:
        description: Immutable digest of the platform image applied to staging.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-staging-advisory-evidence
  cancel-in-progress: false

jobs:
  staging-advisory-evidence:
    name: Staging Advisory Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    outputs:
      scenario_seed_error: ${{ steps.summarize.outputs.scenario_seed_error }}
      advisory_preflight_error: ${{ steps.advisory_preflight.outputs.error }}
      post_window_error: ${{ steps.post_window.outputs.error }}
      freshness_status: ${{ steps.post_window.outputs.freshness_status || 'unknown' }}
      freshness_reason: ${{ steps.post_window.outputs.freshness_reason || 'post-window did not complete' }}
      observed_release_commit: ${{ steps.post_window.outputs.observed_release_commit || '' }}
      observed_platform_image: ${{ steps.post_window.outputs.observed_platform_image || '' }}
      observed_platform_image_digest: ${{ steps.post_window.outputs.observed_platform_image_digest || '' }}
      post_window_publication_at: ${{ steps.post_window.outputs.publication_at || '' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: staging
      CHASE_SETS_HELM_RELEASE: chase-sets-platform
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
      PLATFORM_IMAGE_REF: ${{ inputs.platform_image }}@${{ inputs.platform_image_digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Check out applied staging release
        id: checkout_release
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PLATFORM_IMAGE: ${{ inputs.platform_image }}
          PLATFORM_IMAGE_DIGEST: ${{ inputs.platform_image_digest }}
        run: |
          echo "ADVISORY_JOB_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Advisory evidence requires a full release commit SHA." >&2
            exit 1
          }
          if ! [[ "$PLATFORM_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Advisory evidence requires an immutable platform image digest." >&2
            exit 1
          fi
          if [[ "$PLATFORM_IMAGE" != registry.digitalocean.com/*/chase-sets-platform:"$RELEASE_COMMIT" ]]; then
            echo "Advisory evidence image must be the release commit's SHA-tagged platform image." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "Advisory evidence release commit must be contained in origin/main." >&2
            exit 1
          fi
          git checkout --detach "$RELEASE_COMMIT"

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Terraform init staging platform
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Configure staging Kubernetes context
        id: advisory_preflight
        continue-on-error: true
        timeout-minutes: 50
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PLATFORM_IMAGE: ${{ inputs.platform_image }}
          PLATFORM_IMAGE_DIGEST: ${{ inputs.platform_image_digest }}
          GITHUB_API_URL: https://api.github.com
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true
          kubeconfig="${RUNNER_TEMP}/chase-sets-staging-advisory.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"
          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS state exposes neither cluster_id nor cluster_name." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi
          KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          export KUBECONFIG="$kubeconfig"
          cd ../../..
          protocol="$(node infrastructure/helm/platform/scripts/bootstrap-quiesce.mjs --protocol-version 2>/dev/null || true)"
          if [ "$protocol" != "owner-fenced-seed-yield/v1" ]; then
            echo "advisory preflight refused: owner-fenced-seed-yield/v1 marker is absent" >&2
            {
              echo "freshness_status=stale"
              echo "freshness_reason=owner-fenced-seed-yield/v1 marker is absent"
              echo "error=owner-fenced-seed-yield/v1 marker is absent"
              echo "admission_outcome=refused"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          export ADVISORY_WAIT_POLL_MS=30000
          node --input-type=module - wait-admit <<'NODE'
          import { appendFileSync } from "node:fs";
          import { execFile } from "node:child_process";
          import { promisify } from "node:util";
          import { pathToFileURL } from "node:url";

          const { parsePlatformImageRef, readGitHubProductionWriterCensus, readHelmOperationCensus } = await import(
            pathToFileURL(`${process.env.GITHUB_WORKSPACE ?? process.cwd()}/scripts/platform-kubernetes-deployment.mjs`)
          );

          const execFileAsync = promisify(execFile);
          const output = (name, value) => appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${String(value ?? "").replaceAll(/[\r\n]+/g, " ")}\n`);
          const activeRunStatuses = new Set(["requested", "pending", "queued", "in_progress", "waiting"]);
          const activeJobStatuses = new Set(["queued", "in_progress", "waiting", "requested", "pending"]);
          const productionStagingJobs = new Set(["Reconcile Managed Postgres CA (staging)", "Deploy Staging"]);
          const members = [
            "platform-preview-wildcard-tls.yml",
            "platform-production.yml",
            "platform-staging-admin-qa-actor-fixtures.yml",
            "platform-staging-bootstrap-hook-drill.yml",
            "platform-staging-cluster-addons.yml",
            "platform-staging-evidence-window.yml",
            "platform-staging-helm-recovery.yml",
            "platform-staging-representative-commerce-state.yml",
            "platform-staging-reset.yml",
            "platform-staging-rollback-drill.yml",
          ];
          const memberSet = new Set(members);
          const workflowName = (run) => String(run.path ?? "").split("/").at(-1);
          const scopeJobs = (workflow, jobs) =>
            workflow === "platform-production.yml" ? jobs.filter((job) => productionStagingJobs.has(job.name)) : jobs;
          const parseTime = (value) => {
            const parsed = Date.parse(String(value ?? ""));
            return Number.isFinite(parsed) ? parsed : null;
          };
          const authorityError = (error) => {
            const message = String(error?.message ?? error);
            return /HTTP (403|429)|rate.?limit/i.test(message) ? "GitHub authority rate limit" : "GitHub authority read failed";
          };
          const safeError = (error) => (error instanceof Error && error.message.startsWith("advisory ") ? error.message : authorityError(error));
          const api = async (path) => {
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/${path}`, {
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GH_TOKEN}`, "X-GitHub-Api-Version": "2022-11-28" },
            });
            if (!response.ok) throw new Error(`GitHub authority read failed with HTTP ${response.status}`);
            return response.json();
          };
          const jobsFor = async (run, workflow) => {
            const jobs = await api(`actions/runs/${run.id}/attempts/${run.run_attempt ?? run.runAttempt ?? 1}/jobs?per_page=100&page=1`);
            if (!Array.isArray(jobs.jobs) || !Number.isSafeInteger(jobs.total_count) || jobs.total_count > 100 || jobs.jobs.length !== jobs.total_count) {
              throw new Error(`GitHub authority job census is incomplete for ${workflow} run ${run.id}`);
            }
            return scopeJobs(workflow, jobs.jobs);
          };
          const queryRuns = async (workflow, lowerBound) => {
            const created = encodeURIComponent(`>=${new Date(lowerBound).toISOString()}`);
            const page = await api(`actions/workflows/${workflow}/runs?created=${created}&per_page=100&page=1`);
            if (!Array.isArray(page.workflow_runs) || !Number.isSafeInteger(page.total_count) || page.total_count < 0 || page.total_count > 100 || page.workflow_runs.length !== page.total_count) {
              throw new Error(`GitHub authority census is incomplete for ${workflow}`);
            }
            return page.workflow_runs;
          };
          const jobIsActive = (job, run) => activeJobStatuses.has(job.status) || (activeRunStatuses.has(run.status) && !job.completed_at && !job.conclusion);
          const jobOverlaps = (job, from, to) => {
            const started = parseTime(job.started_at);
            const completed = parseTime(job.completed_at);
            return started !== null && started < to && (completed === null || completed > from);
          };
          const censusMembers = async ({ from, to }) => {
            const lowerBound = from - 90 * 60 * 1000;
            for (const workflow of members) {
              const runs = await queryRuns(workflow, lowerBound);
              for (const run of runs) {
                if (String(run.id) === String(process.env.GITHUB_RUN_ID)) continue;
                const jobs = await jobsFor(run, workflow);
                if (jobs.some((job) => jobIsActive(job, run))) {
                  return `staging member ${workflow} run ${run.id} has an active or queued job`;
                }
                if (jobs.some((job) => jobOverlaps(job, from, to))) {
                  return `staging member ${workflow} run ${run.id} overlaps the evidence window`;
                }
              }
            }
            return null;
          };
          const writerEnv = { ...process.env, GITHUB_RUN_ID: String(process.env.GITHUB_RUN_ID), GITHUB_RUN_ATTEMPT: String(process.env.GITHUB_RUN_ATTEMPT ?? 1) };
          const writerCensus = async () => (await readGitHubProductionWriterCensus({ env: writerEnv })).runs;
          const stagingRunIsActive = async (run) => {
            const workflow = workflowName(run);
            if (!memberSet.has(workflow)) return false;
            const jobs = await jobsFor(run, workflow);
            return jobs.some((job) => jobIsActive(job, run));
          };
          const currentAdmission = () => {
            const startedAt = parseTime(process.env.ADVISORY_JOB_STARTED_AT);
            if (startedAt === null) throw new Error("advisory preflight authority unknown: job-start anchor missing");
            const deadline = startedAt + 37 * 60 * 1000;
            return { deadline, pollMs: Number(process.env.ADVISORY_WAIT_POLL_MS ?? 30000) };
          };
          const waitForAdmission = async () => {
            const { deadline, pollMs } = currentAdmission();
            while (true) {
              const runs = await writerCensus();
              let blocked = null;
              for (const run of runs) {
                if (String(run.id) === String(process.env.GITHUB_RUN_ID)) continue;
                if (await stagingRunIsActive(run)) {
                  blocked = `${workflowName(run)} run ${run.id} has an active staging-scope job`;
                  break;
                }
              }
              if (!blocked) return { admissionAt: new Date().toISOString(), runs };
              if (Date.now() >= deadline) throw new Error("advisory preflight refused: staging member wait timed out");
              await new Promise((resolve) => setTimeout(resolve, Math.min(pollMs, Math.max(1, deadline - Date.now()))));
            }
          };
          const observedIdentity = async () => {
            const requested = parsePlatformImageRef(process.env.PLATFORM_IMAGE);
            const values = JSON.parse((await execFileAsync("helm", ["get", "values", "chase-sets-platform", "--namespace", "chase-sets-platform", "--output", "json"])).stdout);
            const image = values?.global?.image;
            const observed = {
              releaseCommit: image?.tag ?? null,
              platformImage: image ? `${image.registry}/${image.registryName}/${image.repository}:${image.tag}` : null,
              platformImageDigest: image?.digest ?? null,
            };
            if (!image || image.registry !== requested.registry || image.registryName !== requested.registryName || image.repository !== requested.repository || image.tag !== requested.tag || image.digest !== process.env.PLATFORM_IMAGE_DIGEST) {
              const error = new Error("advisory preflight refused: applied staging release identity does not match requested inputs");
              error.observed = observed;
              throw error;
            }
            return observed;
          };
          const refusal = (status, reason, observed = {}) => {
            output("freshness_status", status);
            output("freshness_reason", reason);
            output("error", reason);
            output("admission_outcome", status === "unknown" ? "unknown" : "refused");
            output("observed_release_commit", observed.releaseCommit);
            output("observed_platform_image", observed.platformImage);
            output("observed_platform_image_digest", observed.platformImageDigest);
            throw new Error(reason);
          };
          const runPreflight = async () => {
            const admission = await waitForAdmission();
            const observed = await observedIdentity();
            const helmCensus = await readHelmOperationCensus({ release: "chase-sets-platform", namespace: "chase-sets-platform" });
            if (helmCensus.activeOperations.length > 0) {
              refusal("stale", `advisory preflight refused: active Helm hook ${helmCensus.activeOperations.map(({ kind, name }) => `${kind}/${name}`).join(", ")}`, observed);
            }
            const memberOverlap = await censusMembers({ from: parseTime(admission.admissionAt), to: parseTime(admission.admissionAt) });
            if (memberOverlap) refusal("stale", `advisory preflight refused: ${memberOverlap}`, observed);
            output("admission_at", admission.admissionAt);
            output("admission_outcome", "admitted");
            output("freshness_status", "unknown");
            output("freshness_reason", "post-window advisory qualification is owned by Slice B");
            output("observed_release_commit", observed.releaseCommit);
            output("observed_platform_image", observed.platformImage);
            output("observed_platform_image_digest", observed.platformImageDigest);
            output("error", "");
          };
          const mode = process.argv[2] ?? "wait-admit";
          if (mode !== "wait-admit") throw new Error(`unsupported advisory evaluator mode: ${mode}`);
          {
            try {
              await runPreflight();
            } catch (error) {
              const refused = error instanceof Error && error.message.startsWith("advisory preflight refused");
              const reason = refused ? error.message : `advisory preflight authority unknown: ${safeError(error)}`;
              output("freshness_status", refused ? "stale" : "unknown");
              output("freshness_reason", reason);
              output("error", reason);
              output("admission_outcome", refused ? "refused" : "unknown");
              if (error?.observed) {
                output("observed_release_commit", error.observed.releaseCommit);
                output("observed_platform_image", error.observed.platformImage);
                output("observed_platform_image_digest", error.observed.platformImageDigest);
              }
              throw error;
            }
          }
          NODE

      - name: Seed staging Kubernetes scenario data
        id: scenario_seed
        if: steps.advisory_preflight.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-advisory-evidence
          catalog_asset_public_base_url="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_public_base_url)"
          catalog_asset_s3_bucket="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_bucket)"
          catalog_asset_s3_endpoint="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_endpoint)"
          catalog_asset_s3_region="$(terraform -chdir=infrastructure/digitalocean/platform output -raw catalog_asset_s3_region)"
          if [ -z "$catalog_asset_public_base_url" ] || [ -z "$catalog_asset_s3_bucket" ] || [ -z "$catalog_asset_s3_endpoint" ] || [ -z "$catalog_asset_s3_region" ]; then
            echo "Staging catalog asset runtime env outputs are required before scenario seeding." >&2
            exit 1
          fi
          managed_postgres_ca_sha256="$(helm get values "$CHASE_SETS_HELM_RELEASE" --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" --output json | jq -r '.global.managedPostgresCaSha256 // empty')"
          if ! [[ "$managed_postgres_ca_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The deployed staging Helm release is not managed-Postgres-CA mount-aware." >&2
            exit 1
          fi
          pnpm run platform:kubernetes-deployment -- scenario-seed \
            --image "$PLATFORM_IMAGE_REF" \
            --image-pull-secret chase-sets \
            --runtime-env "DEPLOYMENT_ENVIRONMENT=staging" \
            --runtime-env "CHASE_SETS_RUNTIME_PROFILE=public" \
            --runtime-env "CATALOG_ASSET_PUBLIC_BASE_URL=${catalog_asset_public_base_url}" \
            --runtime-env "CATALOG_ASSET_S3_BUCKET=${catalog_asset_s3_bucket}" \
            --runtime-env "CATALOG_ASSET_S3_ENDPOINT=${catalog_asset_s3_endpoint}" \
            --runtime-env "CATALOG_ASSET_S3_REGION=${catalog_asset_s3_region}" \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            --release "$CHASE_SETS_HELM_RELEASE" \
            --quiesce-workers true \
            --managed-postgres-ca-sha256 "$managed_postgres_ca_sha256" \
            --timeout 9m \
            --out artifacts/staging-advisory-evidence/scenario-seed.json

      - name: Await staging scenario-seed Job termination
        id: await_scenario_seed
        if: always() && steps.scenario_seed.outcome != 'skipped'
        timeout-minutes: 10
        env:
          ADVISORY_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          set -euo pipefail
          ns="$CHASE_SETS_KUBERNETES_NAMESPACE"
          job="${CHASE_SETS_HELM_RELEASE}-scenario-seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          pods="app.kubernetes.io/instance=${CHASE_SETS_HELM_RELEASE},app.kubernetes.io/component=scenario-seed,batch.kubernetes.io/job-name=${job}"
          deadline=$(( $(date +%s) + 540 ))
          missing_job=false
          if [ "$ADVISORY_CANCELLED" = "true" ]; then
            kubectl delete job "$job" -n "$ns" --cascade=foreground --wait=true --ignore-not-found=true
          fi
          while true; do
            status="$(kubectl get job "$job" -n "$ns" --ignore-not-found=true -o json)"
            active="$(kubectl get pods -n "$ns" -l "$pods" \
              --field-selector=status.phase!=Succeeded,status.phase!=Failed -o name)"
            if [ -z "$status" ]; then
              echo "::error::scenario-seed Job was deleted before owner-fenced cleanup; advisory evidence is stale." >&2
              echo "cleanup_outcome=stale" >> "$GITHUB_OUTPUT"
              echo "stale_consumed=true" >> "$GITHUB_OUTPUT"
              missing_job=true
              break
            fi
            if { [ -z "$status" ] || jq -e '(.status.succeeded // 0) > 0 or
                any(.status.conditions[]?; (.type == "Complete" or .type == "Failed") and .status == "True")' <<< "$status" >/dev/null; } \
                && [ -z "$active" ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::scenario-seed Job still active; deleting it before owner-fenced cleanup" >&2
              kubectl delete job "$job" -n "$ns" --cascade=foreground --wait=true --ignore-not-found=true
              echo "cleanup_outcome=stale" >> "$GITHUB_OUTPUT"
              echo "stale_consumed=true" >> "$GITHUB_OUTPUT"
              missing_job=true
              break
            fi
            sleep 10
          done
          owner="$(kubectl get scaledobject "$CHASE_SETS_HELM_RELEASE-chase-sets-platform-platform-worker" -n "$ns" --ignore-not-found=true -o jsonpath='{.metadata.annotations.chase-sets\.com/quiesce-owner}' 2>/dev/null || true)"
          release_failed=false
          cleanup_failed=false
          if [ "$owner" = "scenario-seed:$job" ]; then
            # Keep the release subcommand indirect: it mutates no image and the registry guard's pull-selector rule is not applicable.
            scenario_seed_release_command="scenario-seed-release"
            if ! node ./scripts/platform-kubernetes-deployment.mjs "$scenario_seed_release_command" \
              --job-name "$job" --namespace "$ns" --release "$CHASE_SETS_HELM_RELEASE" --reclaim true; then
              echo "::error::scenario-seed owner/CAS cleanup refused; advisory evidence is stale." >&2
              release_failed=true
              echo "cleanup_outcome=stale" >> "$GITHUB_OUTPUT"
              echo "stale_consumed=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          if ! kubectl delete rolebinding,role,serviceaccount -n "$ns" \
            -l "app.kubernetes.io/instance=${CHASE_SETS_HELM_RELEASE},app.kubernetes.io/component=scenario-seed-quiesce,chase-sets.com/scenario-seed-job=${job}" \
            --ignore-not-found=true; then
            echo "::error::scenario-seed RBAC cleanup failed; advisory evidence is stale." >&2
            cleanup_failed=true
            echo "cleanup_outcome=stale" >> "$GITHUB_OUTPUT"
            echo "stale_consumed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$release_failed" = "true" ] || [ "$cleanup_failed" = "true" ] || [ "$missing_job" = "true" ]; then exit 1; fi

      - name: Resolve Playwright Chromium version
        id: staging-playwright-chromium
        if: steps.advisory_preflight.outcome == 'success' && steps.scenario_seed.outcome == 'success' && steps.await_scenario_seed.outcome == 'success'
        timeout-minutes: 3
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "Could not resolve Playwright version from pnpm-lock.yaml." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium for staging critical flows
        id: staging-playwright-chromium-cache
        if: steps.advisory_preflight.outcome == 'success' && steps.scenario_seed.outcome == 'success' && steps.await_scenario_seed.outcome == 'success'
        timeout-minutes: 1
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.staging-playwright-chromium.outputs.version }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium for staging critical flows
        if: steps.advisory_preflight.outcome == 'success' && steps.scenario_seed.outcome == 'success' && steps.await_scenario_seed.outcome == 'success'
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Staging marketplace critical flows
        id: marketplace_e2e
        if: steps.advisory_preflight.outcome == 'success' && steps.scenario_seed.outcome == 'success' && steps.await_scenario_seed.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          CI: "true"
          PLAYWRIGHT_SKIP_WEB_SERVER: "true"
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL || '' }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD || '' }}
          MARKETPLACE_E2E_EMAIL: ${{ vars.MARKETPLACE_E2E_EMAIL || '' }}
          MARKETPLACE_E2E_PASSWORD: ${{ secrets.MARKETPLACE_E2E_PASSWORD || '' }}
          MARKETPLACE_E2E_SEARCH_QUERY: ${{ vars.MARKETPLACE_E2E_SEARCH_QUERY || 'charizard' }}
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || '' }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          set -euo pipefail
          missing_trust_inputs=()
          for name in PLATFORM_ADMIN_EMAIL PLATFORM_ADMIN_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing_trust_inputs+=("$name")
            fi
          done
          if [ "${#missing_trust_inputs[@]}" -gt 0 ]; then
            printf 'credentials-not-threaded: staging marketplace E2E missing required trust inputs: %s\n' "${missing_trust_inputs[*]}" >&2
            exit 1
          fi
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          landing_domain="$(terraform output -raw landing_domain)"
          if [ -z "$admin_domain" ] || [ -z "$marketplace_domain" ] || [ -z "$landing_domain" ]; then
            echo "Required staging admin, marketplace, or landing domain was not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          ADMIN_WEB_URL="https://${admin_domain}" MARKETPLACE_WEB_URL="https://${marketplace_domain}" PUBLIC_WEB_URL="https://${landing_domain}" pnpm run test:e2e:deployed

      - name: Run post-window evaluator
        id: post_window
        if: always() && steps.advisory_preflight.outputs.admission_outcome == 'admitted'
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: https://api.github.com
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          PLATFORM_IMAGE: ${{ inputs.platform_image }}
          PLATFORM_IMAGE_DIGEST: ${{ inputs.platform_image_digest }}
          ADMISSION_AT: ${{ steps.advisory_preflight.outputs.admission_at || '' }}
          SCENARIO_SEED_OUTCOME: ${{ steps.scenario_seed.outcome || 'skipped' }}
          AWAIT_SCENARIO_SEED_OUTCOME: ${{ steps.await_scenario_seed.outcome || 'skipped' }}
          SCENARIO_SEED_CLEANUP_OUTCOME: ${{ steps.await_scenario_seed.outputs.cleanup_outcome || '' }}
        run: |
          set -euo pipefail
          node --input-type=module - post-window <<'NODE'
          import { appendFileSync } from "node:fs";
          import { execFile } from "node:child_process";
          import { promisify } from "node:util";
          import { pathToFileURL } from "node:url";

          const { parsePlatformImageRef, readGitHubProductionWriterCensus } = await import(
            pathToFileURL(`${process.env.GITHUB_WORKSPACE ?? process.cwd()}/scripts/platform-kubernetes-deployment.mjs`)
          );
          const execFileAsync = promisify(execFile);
          const mode = process.argv[2] ?? "post-window";
          if (!(mode === "post-window")) throw new Error(`unsupported advisory evaluator mode: ${mode}`);
          const output = (name, value) =>
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${String(value ?? "").replaceAll(/[\r\n]+/g, " ")}\n`);
          const activeRunStatuses = new Set(["requested", "pending", "queued", "in_progress", "waiting"]);
          const activeJobStatuses = new Set(["queued", "in_progress", "waiting", "requested", "pending"]);
          const productionStagingJobs = new Set(["Reconcile Managed Postgres CA (staging)", "Deploy Staging"]);
          const members = [
            "platform-preview-wildcard-tls.yml",
            "platform-production.yml",
            "platform-staging-admin-qa-actor-fixtures.yml",
            "platform-staging-bootstrap-hook-drill.yml",
            "platform-staging-cluster-addons.yml",
            "platform-staging-evidence-window.yml",
            "platform-staging-helm-recovery.yml",
            "platform-staging-representative-commerce-state.yml",
            "platform-staging-reset.yml",
            "platform-staging-rollback-drill.yml",
          ];
          const memberSet = new Set(members);
          const workflowName = (run) => String(run.path ?? "").split("/").at(-1);
          const scopeJobs = (workflow, jobs) =>
            workflow === "platform-production.yml" ? jobs.filter((job) => productionStagingJobs.has(job.name)) : jobs;
          const parseTime = (value) => {
            const parsed = Date.parse(String(value ?? ""));
            return Number.isFinite(parsed) ? parsed : null;
          };
          const api = async (path) => {
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) throw new Error(`GitHub authority read failed with HTTP ${response.status}`);
            return response.json();
          };
          const queryRuns = async (workflow, from) => {
            const created = encodeURIComponent(`>=${new Date(from - 30 * 24 * 60 * 60 * 1000).toISOString()}`);
            const pageSize = 100;
            const pageCap = 20;
            const runs = [];
            const ids = new Set();
            let expectedTotal = null;
            for (let pageNumber = 1; pageNumber <= pageCap; pageNumber += 1) {
              const page = await api(`actions/workflows/${workflow}/runs?created=${created}&per_page=${pageSize}&page=${pageNumber}`);
              if (!Array.isArray(page.workflow_runs) || page.workflow_runs.length > pageSize || !Number.isSafeInteger(page.total_count) || page.total_count < 0) {
                throw new Error(`GitHub authority census is incomplete for ${workflow}`);
              }
              if (expectedTotal === null) expectedTotal = page.total_count;
              if (page.total_count !== expectedTotal || expectedTotal > pageCap * pageSize) {
                throw new Error(`GitHub authority census is incomplete for ${workflow}`);
              }
              for (const run of page.workflow_runs) {
                if (!Number.isSafeInteger(run?.id) || ids.has(run.id)) {
                  throw new Error(`GitHub authority census is incomplete for ${workflow}`);
                }
                ids.add(run.id);
                runs.push(run);
              }
              if (runs.length === expectedTotal) return runs;
              if (page.workflow_runs.length === 0 || runs.length > expectedTotal) {
                throw new Error(`GitHub authority census is incomplete for ${workflow}`);
              }
            }
            throw new Error(`GitHub authority census is incomplete for ${workflow}`);
          };
          const jobsFor = async (run, workflow) => {
            const body = await api(`actions/runs/${run.id}/attempts/${run.run_attempt ?? run.runAttempt ?? 1}/jobs?per_page=100&page=1`);
            if (!Array.isArray(body.jobs) || !Number.isSafeInteger(body.total_count) || body.total_count < 0 || body.total_count > 100 || body.jobs.length !== body.total_count) {
              throw new Error(`GitHub authority job census is incomplete for ${workflow} run ${run.id}`);
            }
            return scopeJobs(workflow, body.jobs);
          };
          const observedIdentity = async () => {
            const requested = parsePlatformImageRef(process.env.PLATFORM_IMAGE);
            const values = JSON.parse((await execFileAsync("helm", ["get", "values", "chase-sets-platform", "--namespace", "chase-sets-platform", "--output", "json"])).stdout);
            const image = values?.global?.image;
            const observed = {
              releaseCommit: image?.tag ?? null,
              platformImage: image ? `${image.registry}/${image.registryName}/${image.repository}:${image.tag}` : null,
              platformImageDigest: image?.digest ?? null,
            };
            if (!image || !/^[0-9a-f]{40}$/.test(String(image.tag ?? "")) || !/^sha256:[0-9a-f]{64}$/.test(String(image.digest ?? "")) || !image.registry || !image.registryName || !image.repository) {
              throw new Error("advisory post-window authority unknown: applied Helm identity is unreadable");
            }
            return { observed, superseded: image.registry !== requested.registry || image.registryName !== requested.registryName || image.repository !== requested.repository || image.tag !== requested.tag || image.digest !== process.env.PLATFORM_IMAGE_DIGEST };
          };
          const runPostWindow = async () => {
            const from = parseTime(process.env.ADMISSION_AT);
            if (from === null) throw new Error("advisory post-window authority unknown: admission timestamp missing");
            const publicationAt = new Date().toISOString();
            const to = parseTime(publicationAt);
            output("publication_at", publicationAt);
            const seedOutcome = process.env.SCENARIO_SEED_OUTCOME ?? "skipped";
            const awaitOutcome = process.env.AWAIT_SCENARIO_SEED_OUTCOME ?? "skipped";
            const cleanupOutcome = process.env.SCENARIO_SEED_CLEANUP_OUTCOME ?? "";
            if (seedOutcome !== "success" || awaitOutcome !== "success" || cleanupOutcome === "stale") {
              const reason = cleanupOutcome === "stale"
                ? "scenario-seed cleanup was stale or preempted"
                : `scenario-seed evidence was not successful (seed=${seedOutcome}, cleanup=${awaitOutcome})`;
              output("freshness_status", "stale");
              output("freshness_reason", reason);
              output("error", reason);
              throw new Error(`advisory post-window stale: ${reason}`);
            }
            const { observed, superseded } = await observedIdentity();
            output("observed_release_commit", observed.releaseCommit);
            output("observed_platform_image", observed.platformImage);
            output("observed_platform_image_digest", observed.platformImageDigest);
            output("observed_superseding_identity", superseded ? "true" : "false");
            const census = [];
            let staleReason = superseded ? "applied staging identity was superseded during the evidence window" : "";
            const writerCensus = await readGitHubProductionWriterCensus({
              env: { ...process.env, GITHUB_TOKEN: process.env.GITHUB_TOKEN ?? process.env.GH_TOKEN },
            });
            const activeMemberRuns = new Map();
            for (const run of writerCensus.runs ?? []) {
              const workflow = workflowName(run);
              if (memberSet.has(workflow) && String(run.id) !== String(process.env.GITHUB_RUN_ID)) activeMemberRuns.set(String(run.id), { run, workflow });
            }
            for (const workflow of members) {
              for (const run of await queryRuns(workflow, from)) {
                if (String(run.id) === String(process.env.GITHUB_RUN_ID)) continue;
                if (!Number.isSafeInteger(run.id) || !run.path || !run.run_attempt) throw new Error(`GitHub authority census returned malformed ${workflow} run`);
                const runStarted = parseTime(run.run_started_at);
                const updated = parseTime(run.updated_at);
                const candidate = activeMemberRuns.has(String(run.id)) || (updated !== null && updated > from) || (runStarted !== null && runStarted < to && runStarted > from);
                if (!candidate) continue;
                const jobs = await jobsFor(run, workflow);
                for (const job of jobs) {
                  const started = parseTime(job.started_at);
                  const completed = parseTime(job.completed_at);
                  if (started === null || (completed !== null && completed < started)) throw new Error(`GitHub authority job census returned unsafe timestamps for ${workflow} run ${run.id}`);
                  const active = activeJobStatuses.has(job.status) || (activeRunStatuses.has(run.status) && completed === null && !job.conclusion);
                  const overlap = started < to && (completed === null || completed > from);
                  if (active && overlap) staleReason ||= `${workflow} run ${run.id} remained active at publication`;
                  if (overlap && (job.conclusion === "cancelled" || job.conclusion === "failure" || job.conclusion === "timed_out")) {
                    staleReason ||= `${workflow} run ${run.id} job ${job.name} ended ${job.conclusion} in the evidence window`;
                  }
                  if (overlap && /rollback|recovery|reset|seed|bootstrap|\bca\b|certificate/i.test(`${workflow} ${job.name}`)) {
                    staleReason ||= `${workflow} run ${run.id} job ${job.name} mutated staging during the evidence window`;
                  }
                  if (overlap) staleReason ||= `${workflow} run ${run.id} job ${job.name} overlaps the evidence window`;
                  if (overlap) census.push({ workflow, runId: run.id, job: job.name, conclusion: job.conclusion ?? null, status: job.status });
                }
              }
            }
            for (const { run, workflow } of activeMemberRuns.values()) {
              const jobs = await jobsFor(run, workflow);
              if (jobs.some((job) => activeJobStatuses.has(job.status) || (activeRunStatuses.has(run.status) && !job.completed_at && !job.conclusion))) {
                staleReason ||= `${workflow} run ${run.id} remained active at publication`;
              }
            }
            output("window_census", JSON.stringify({ admissionAt: new Date(from).toISOString(), publicationAt, overlaps: census }));
            if (staleReason) {
              output("freshness_status", "stale");
              output("freshness_reason", staleReason);
              output("error", staleReason);
              throw new Error(`advisory post-window stale: ${staleReason}`);
            }
            output("freshness_status", "fresh");
            output("freshness_reason", "complete staging evidence window contained no staging-scope overlap");
            output("error", "");
          };
          try {
            await runPostWindow();
          } catch (error) {
            const message = String(error?.message ?? error);
            const stale = message.startsWith("advisory post-window stale:");
            const reason = stale ? message.slice("advisory post-window stale: ".length) : message.startsWith("advisory post-window authority unknown:") ? message : "advisory post-window authority unknown: GitHub authority read failed";
            output("freshness_status", stale ? "stale" : "unknown");
            output("freshness_reason", reason);
            output("error", reason);
            throw error;
          }
          NODE

      - name: Summarize staging advisory evidence
        id: summarize
        if: always()
        timeout-minutes: 3
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          SCENARIO_SEED_OUTCOME: ${{ steps.scenario_seed.outcome || 'skipped' }}
          MARKETPLACE_E2E_OUTCOME: ${{ steps.marketplace_e2e.outcome || 'skipped' }}
          ADVISORY_PREFLIGHT_OUTCOME: ${{ steps.advisory_preflight.outcome || 'skipped' }}
          POST_WINDOW_OUTCOME: ${{ steps.post_window.outcome || 'skipped' }}
          ADMISSION_OUTCOME: ${{ steps.advisory_preflight.outputs.admission_outcome || 'unknown' }}
          FRESHNESS_STATUS: ${{ steps.post_window.outputs.freshness_status || 'unknown' }}
          FRESHNESS_REASON: ${{ steps.post_window.outputs.freshness_reason || 'post-window did not complete' }}
          ADVISORY_PREFLIGHT_ERROR: ${{ steps.advisory_preflight.outputs.error || 'none captured' }}
          POST_WINDOW_ERROR: ${{ steps.post_window.outputs.error || 'none captured' }}
          WINDOW_CENSUS: ${{ steps.post_window.outputs.window_census || '{}' }}
          OBSERVED_RELEASE_COMMIT: ${{ steps.post_window.outputs.observed_release_commit || '' }}
          OBSERVED_PLATFORM_IMAGE: ${{ steps.post_window.outputs.observed_platform_image || '' }}
          OBSERVED_PLATFORM_IMAGE_DIGEST: ${{ steps.post_window.outputs.observed_platform_image_digest || '' }}
          OBSERVED_SUPERSEDING_IDENTITY: ${{ steps.post_window.outputs.observed_superseding_identity || '' }}
          POST_WINDOW_PUBLICATION_AT: ${{ steps.post_window.outputs.publication_at || '' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Advisory evidence requires a full release commit SHA." >&2
            exit 1
          }
          mkdir -p artifacts/staging-advisory-evidence
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # The seed CLI writes this record on failure too, so the pod's bootstrap error survives the
          # continue-on-error step and reaches both the step summary and the advisory incident comment.
          scenario_seed_error=""
          if [ -f artifacts/staging-advisory-evidence/scenario-seed.json ]; then
            scenario_seed_error="$(jq -r '.bootstrapError // empty' artifacts/staging-advisory-evidence/scenario-seed.json)"
          fi
          {
            echo "scenario_seed_error<<SCENARIO_SEED_ERROR_EOF"
            echo "$scenario_seed_error"
            echo "SCENARIO_SEED_ERROR_EOF"
          } >> "$GITHUB_OUTPUT"
          failed_phases="$(jq -cn \
            --arg advisoryPreflight "${ADVISORY_PREFLIGHT_OUTCOME:-skipped}" \
            --arg scenarioSeed "${SCENARIO_SEED_OUTCOME:-skipped}" \
            --arg marketplaceE2e "${MARKETPLACE_E2E_OUTCOME:-skipped}" \
            '[if $advisoryPreflight == "success" then empty else "advisory-preflight" end, if $scenarioSeed == "success" then empty else "scenario-seed" end, if $marketplaceE2e == "success" then empty else "marketplace-e2e" end]')"
          jq -n \
            --arg checkedAt "$checked_at" \
            --arg releaseCommit "$RELEASE_COMMIT" \
            --arg platformImage "${{ inputs.platform_image }}" \
            --arg platformImageDigest "${{ inputs.platform_image_digest }}" \
            --arg advisoryPreflight "${ADVISORY_PREFLIGHT_OUTCOME:-skipped}" \
            --arg advisoryPreflightError "${ADVISORY_PREFLIGHT_ERROR:-none captured}" \
             --arg postWindow "${POST_WINDOW_OUTCOME:-skipped}" \
             --arg postWindowError "${POST_WINDOW_ERROR:-none captured}" \
             --arg publicationAt "${POST_WINDOW_PUBLICATION_AT:-}" \
             --arg observedSupersedingIdentity "${OBSERVED_SUPERSEDING_IDENTITY:-}" \
             --arg windowCensus "${WINDOW_CENSUS}" \
            --arg admissionOutcome "${ADMISSION_OUTCOME:-unknown}" \
            --arg freshnessStatus "${FRESHNESS_STATUS:-unknown}" \
            --arg freshnessReason "${FRESHNESS_REASON:-preflight did not complete}" \
            --arg observedReleaseCommit "${OBSERVED_RELEASE_COMMIT:-}" \
            --arg observedPlatformImage "${OBSERVED_PLATFORM_IMAGE:-}" \
            --arg observedPlatformImageDigest "${OBSERVED_PLATFORM_IMAGE_DIGEST:-}" \
            --arg scenarioSeed "${SCENARIO_SEED_OUTCOME:-skipped}" \
            --arg marketplaceE2e "${MARKETPLACE_E2E_OUTCOME:-skipped}" \
            --argjson failedPhases "$failed_phases" \
             '{schemaVersion:"staging-advisory-evidence/v2",checkedAt:$checkedAt,releaseCommit:$releaseCommit,platformImage:$platformImage,platformImageDigest:$platformImageDigest,admission:{outcome:$admissionOutcome,error:$advisoryPreflightError},freshness:{status:$freshnessStatus,reason:$freshnessReason,requested:{releaseCommit:$releaseCommit,platformImage:$platformImage,platformImageDigest:$platformImageDigest},observed:{releaseCommit:$observedReleaseCommit,platformImage:$observedPlatformImage,platformImageDigest:$observedPlatformImageDigest,supersedingIdentity:(if $observedSupersedingIdentity == "true" then true elif $observedSupersedingIdentity == "false" then false else null end)},publicationAt:$publicationAt,windowCensus:($windowCensus|fromjson)},postWindow:{outcome:$postWindow,error:$postWindowError},scenarioSeed:{outcome:$scenarioSeed},marketplaceE2e:{outcome:$marketplaceE2e},failedPhases:$failedPhases}' \
            > artifacts/staging-advisory-evidence/summary.json
          {
            echo "## Staging advisory evidence"
            echo ""
            echo "| Evidence | Outcome | Promotion impact |"
            echo "| --- | --- | --- |"
            echo "| Scenario seed | ${SCENARIO_SEED_OUTCOME} | Advisory |"
            echo "| Marketplace deployed E2E | ${MARKETPLACE_E2E_OUTCOME} | Advisory |"
            echo ""
            echo "Scenario seed bootstrap error: ${scenario_seed_error:-none captured}"
            echo "Post-window freshness: ${FRESHNESS_STATUS:-unknown} — ${FRESHNESS_REASON:-post-window did not complete}"
            echo "Observed release: ${OBSERVED_RELEASE_COMMIT:-unknown}@${OBSERVED_PLATFORM_IMAGE_DIGEST:-unknown}"
            echo "Published at (UTC): ${POST_WINDOW_PUBLICATION_AT:-unknown}"
            echo ""
            echo "Release: $RELEASE_COMMIT@${{ inputs.platform_image_digest }}"
            echo ""
            echo "Failures remain visible here and through the deduplicated advisory incident; they do not govern production promotion."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging advisory evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-advisory-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/staging-advisory-evidence/summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail post-window advisory freshness signal
        if: always() && steps.post_window.outcome != 'success'
        timeout-minutes: 1
        env:
          FRESHNESS_STATUS: ${{ steps.post_window.outputs.freshness_status || 'unknown' }}
          FRESHNESS_REASON: ${{ steps.post_window.outputs.freshness_reason || 'post-window advisory evaluator did not complete' }}
        run: |
          echo "Advisory evidence is ${FRESHNESS_STATUS}: ${FRESHNESS_REASON}; production promotion is unaffected." >&2
          exit 1

      - name: Fail scenario-seed advisory signal
        if: always() && steps.scenario_seed.outcome != 'success'
        timeout-minutes: 1
        env:
          SCENARIO_SEED_OUTCOME: ${{ steps.scenario_seed.outcome || 'skipped' }}
        run: |
          echo "Advisory scenario-seed phase failed with outcome ${SCENARIO_SEED_OUTCOME}; production promotion is unaffected." >&2
          exit 1

      - name: Fail marketplace E2E advisory signal
        if: always() && steps.marketplace_e2e.outcome != 'success'
        timeout-minutes: 1
        env:
          MARKETPLACE_E2E_OUTCOME: ${{ steps.marketplace_e2e.outcome || 'skipped' }}
        run: |
          echo "Advisory marketplace E2E phase failed with outcome ${MARKETPLACE_E2E_OUTCOME}; production promotion is unaffected." >&2
          exit 1

  notify-staging-advisory-evidence:
    name: Notify Staging Advisory Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: staging-advisory-evidence
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create, update, or resolve advisory evidence incident
        env:
          GH_TOKEN: ${{ github.token }}
          ADVISORY_RESULT: ${{ needs.staging-advisory-evidence.result }}
          SCENARIO_SEED_ERROR: ${{ needs.staging-advisory-evidence.outputs.scenario_seed_error }}
          ADVISORY_PREFLIGHT_ERROR: ${{ needs.staging-advisory-evidence.outputs.advisory_preflight_error }}
          POST_WINDOW_ERROR: ${{ needs.staging-advisory-evidence.outputs.post_window_error }}
          FRESHNESS_STATUS: ${{ needs.staging-advisory-evidence.outputs.freshness_status }}
          FRESHNESS_REASON: ${{ needs.staging-advisory-evidence.outputs.freshness_reason }}
          OBSERVED_RELEASE_COMMIT: ${{ needs.staging-advisory-evidence.outputs.observed_release_commit }}
          OBSERVED_PLATFORM_IMAGE: ${{ needs.staging-advisory-evidence.outputs.observed_platform_image }}
          OBSERVED_PLATFORM_IMAGE_DIGEST: ${{ needs.staging-advisory-evidence.outputs.observed_platform_image_digest }}
          POST_WINDOW_PUBLICATION_AT: ${{ needs.staging-advisory-evidence.outputs.post_window_publication_at }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          ARTIFACTS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?attempt=${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Advisory evidence requires a full release commit SHA." >&2
            exit 1
          }
          title="Incident: Staging advisory evidence failing"
          existing_issue="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --search "\"${title}\" in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ "$ADVISORY_RESULT" = "success" ]; then
            if [ -n "$existing_issue" ]; then
              gh issue close "$existing_issue" \
                --repo "${GITHUB_REPOSITORY}" \
                --comment "Advisory staging evidence recovered for ${RELEASE_COMMIT}: ${RUN_URL}"
            else
              echo "Advisory staging evidence passed; no incident is open."
            fi
            exit 0
          fi
          body="$(cat <<EOF
          Advisory staging evidence failed without changing the production promotion decision.

          - Release commit: ${RELEASE_COMMIT}
          - Advisory result: ${ADVISORY_RESULT}
          - Scenario seed bootstrap error: ${SCENARIO_SEED_ERROR:-none captured}
          - Advisory preflight: ${ADVISORY_PREFLIGHT_ERROR:-none captured}
          - Post-window evaluator: ${POST_WINDOW_ERROR:-none captured}
          - Freshness: ${FRESHNESS_STATUS:-unknown} — ${FRESHNESS_REASON:-post-window did not complete}
          - Observed identity: ${OBSERVED_RELEASE_COMMIT:-unknown} / ${OBSERVED_PLATFORM_IMAGE:-unknown}@${OBSERVED_PLATFORM_IMAGE_DIGEST:-unknown}
          - Published at (UTC): ${POST_WINDOW_PUBLICATION_AT:-unknown}
          - Workflow run: ${RUN_URL}
          - Evidence artifacts: ${ARTIFACTS_URL}

          Inspect scenario-seed and deployed marketplace E2E evidence. Reruns are serialized in the advisory lane and reconcile the same representative staging contracts.
          EOF
          )"
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --repo "${GITHUB_REPOSITORY}" --body "$body"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --body "$body" \
              --label "kind:ops" \
              --label "area:infrastructure"
          fi
