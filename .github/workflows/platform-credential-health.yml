name: Platform Credential Health

# Daily credential age and liveness from .github/credential-inventory.json.
# Levels, the rotation App and the inventory terms are defined in
# docs/runbooks/credential-rotation.md. Outputs carry only names, scopes,
# ages, expiry dates and verdicts.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: platform-credential-health
  cancel-in-progress: false

jobs:
  metadata:
    name: Collect secret metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: secret-rotation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.CREDENTIAL_ROTATION_APP_ID }}
          private-key: ${{ secrets.CREDENTIAL_ROTATION_APP_PRIVATE_KEY }}
          permission-environments: read
          permission-secrets: read

      - name: Collect secret metadata
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node ./scripts/credential-health.mjs metadata \
            --repository "$REPOSITORY" \
            --out artifacts/credential-health/metadata.json

      - name: Upload secret metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credential-health-metadata
          path: artifacts/credential-health/metadata.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  liveness:
    name: Check credential liveness (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.scope != 'repository' && matrix.scope || '' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scope: [repository, merge-gate, preview, production, secret-rotation, staging]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Each secret reaches only the rows its inventory scope names.
      - name: Check credential liveness
        env:
          CREDENTIAL_SCOPE: ${{ matrix.scope }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ contains(fromJSON('["merge-gate","preview","production","staging"]'), matrix.scope) && secrets.DIGITALOCEAN_ACCESS_TOKEN || '' }}
          DIGITALOCEAN_READONLY_TOKEN: ${{ contains(fromJSON('["production"]'), matrix.scope) && secrets.DIGITALOCEAN_READONLY_TOKEN || '' }}
          DIGITALOCEAN_REGISTRY_TOKEN: ${{ contains(fromJSON('["staging"]'), matrix.scope) && secrets.DIGITALOCEAN_REGISTRY_TOKEN || '' }}
          ENVIRONMENT_SECRETS_TOKEN: ${{ contains(fromJSON('["production"]'), matrix.scope) && secrets.ENVIRONMENT_SECRETS_TOKEN || '' }}
          PROJECTS_TOKEN: ${{ contains(fromJSON('["repository"]'), matrix.scope) && secrets.PROJECTS_TOKEN || '' }}
          RELEASE_EVIDENCE_SPACES_ACCESS_ID: ${{ contains(fromJSON('["merge-gate","production"]'), matrix.scope) && secrets.RELEASE_EVIDENCE_SPACES_ACCESS_ID || '' }}
          RELEASE_EVIDENCE_SPACES_SECRET_KEY: ${{ contains(fromJSON('["merge-gate","production"]'), matrix.scope) && secrets.RELEASE_EVIDENCE_SPACES_SECRET_KEY || '' }}
          SEED_PACKS_SPACES_ACCESS_ID: ${{ contains(fromJSON('["merge-gate","preview"]'), matrix.scope) && secrets.SEED_PACKS_SPACES_ACCESS_ID || '' }}
          SEED_PACKS_SPACES_SECRET_KEY: ${{ contains(fromJSON('["merge-gate","preview"]'), matrix.scope) && secrets.SEED_PACKS_SPACES_SECRET_KEY || '' }}
          SPACES_ACCESS_ID: ${{ contains(fromJSON('["merge-gate","preview","production","staging"]'), matrix.scope) && secrets.SPACES_ACCESS_ID || '' }}
          SPACES_SECRET_KEY: ${{ contains(fromJSON('["merge-gate","preview","production","staging"]'), matrix.scope) && secrets.SPACES_SECRET_KEY || '' }}
        run: |
          set -euo pipefail
          node ./scripts/credential-health.mjs liveness \
            --scope "$CREDENTIAL_SCOPE" \
            --out "artifacts/credential-health/liveness-${CREDENTIAL_SCOPE}.json"

      - name: Upload liveness verdicts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credential-health-liveness-${{ matrix.scope }}
          path: artifacts/credential-health/liveness-${{ matrix.scope }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  report:
    name: Report credential health
    needs: [metadata, liveness]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download credential health inputs
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: credential-health-*
          path: artifacts/credential-health
          merge-multiple: true

      # A missing or failed metadata or liveness input is a warning, never success.
      - name: Classify credential health
        id: report
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          LIVENESS_RESULT: ${{ needs.liveness.result }}
        run: |
          set -euo pipefail
          node ./scripts/credential-health.mjs report \
            --metadata artifacts/credential-health/metadata.json \
            --liveness-dir artifacts/credential-health \
            --metadata-result "$METADATA_RESULT" \
            --liveness-result "$LIVENESS_RESULT" \
            --out artifacts/credential-health/report.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload credential health report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credential-health-report
          path: artifacts/credential-health/report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Report credential health alert
        if: ${{ always() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Credential Health
          alert-status: ${{ steps.report.outputs.status || 'failure' }}
          alert-summary: ${{ steps.report.outputs.summary || 'Credential health classification did not complete.' }}
          alert-details: ${{ steps.report.outputs.details }}

      - name: Fail on credential failure
        if: ${{ steps.report.outputs.status == 'failure' }}
        run: |
          echo "Credential health is failure; see the run summary and alert issue." >&2
          exit 1
