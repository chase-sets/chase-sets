name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  structure:
    runs-on: ubuntu-latest
    env:
      STRUCTURE_SINGLE_SLICE_SUPPORT_ENFORCEMENT: violation
      STRUCTURE_ALLOW_TEMPORARY_SINGLE_SLICE_SUPPORT_DEBT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'structure-temporary-debt') && 'true' || 'false' }}
      STRUCTURE_METRICS_OUTPUT_PATH: artifacts/structure-metrics.json
      STRUCTURE_METRICS_DASHBOARD_PATH: artifacts/structure-metrics-dashboard.md
      STRUCTURE_BUDGET_MODE: warn
      STRUCTURE_BUDGET_MAX_SINGLE_SLICE_SUPPORT_FILES: 20
      STRUCTURE_BUDGET_MAX_DRIFT_COUNT: 8
      STRUCTURE_BUDGET_MAX_SUPPORT_DIRECTORY_COUNT: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check structure
        run: npm run check:structure:ci

      - name: Evaluate structure budget (non-blocking)
        if: always()
        run: npm run check:structure:budget

      - name: Publish structure metrics dashboard
        if: always()
        run: |
          if [ -f "${STRUCTURE_METRICS_DASHBOARD_PATH}" ]; then
            cat "${STRUCTURE_METRICS_DASHBOARD_PATH}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Structure metrics dashboard not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload structure metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-metrics-${{ github.run_id }}
          path: |
            artifacts/structure-metrics.json
            artifacts/structure-metrics-dashboard.md
          if-no-files-found: warn

  verify-fast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify fast path
        run: npm run verify

  verify-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run DB-backed verification
        run: npm run verify:db
