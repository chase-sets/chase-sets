# #9109: local draft only. Review cost assumptions and secret scope before publishing.
name: Discovery Voyage measurement 9109
on:
  workflow_dispatch:
    inputs:
      cost_review:
        description: Enter 9109-reviewed-cost-and-synthetic-inputs only after reviewing the runbook
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: discovery-voyage-9109
  cancel-in-progress: false
jobs:
  measure:
    # Fail closed until an operator enables this exact reviewed workflow commit.
    if: github.run_attempt == 1 && vars.VOYAGE_9109_APPROVED_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: 5177c88d76eceab88ebcb9b21a1088664ef1ff66
          persist-credentials: false
          path: subject
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
      - name: Synthetic snapshot and 30 sequential uncached direct attempts
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          VOYAGE_MODEL: voyage-4-lite
          QUERY_TIMEOUT_MS: "800"
          REVIEWED_RATE_USD_PER_MILLION: "0.02"
          RESERVED_NON_TOKEN_USD: "2"
          MEASUREMENT_APPROVAL: ${{ inputs.cost_review }}
        run: node harness/scripts/measurements/voyage-9109.mjs subject evidence
      - name: Retain only allowlisted synthetic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: voyage-9109-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            evidence/real-embeddings.json
            evidence/snapshot.sha256
            evidence/timings.json
