name: Platform Staging Evidence Window Cleanup
run-name: Evidence window cleanup ${{ inputs.run_id || github.event.workflow_run.id }} attempt ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}

# The staging evidence window's cleanup observer. The window job dispatches it
# before it installs any credential; a window run's completion starts it again, and a
# host can re-drive it.
# It waits outside the deploy lock, takes over at the earlier of the run's end and
# D-5 min, closes the run's window through the shipped route with the key read from the
# runtime Secret, revokes the key and the run-named journal login, and scans the run's
# logs for credential markers. Expiry, always() or a sweep never count as cleanup.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Window run id to observe.
        required: true
        type: string
      run_attempt:
        description: Window run attempt to observe.
        required: true
        type: string
  workflow_run:
    workflows:
      - Platform Staging Evidence Window
    types:
      - completed

permissions:
  contents: read

jobs:
  evidence-window-cleanup:
    name: Evidence Window Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 200
    environment: staging
    permissions:
      actions: read
      contents: read
    concurrency:
      group: evidence-window-cleanup-${{ inputs.run_id || github.event.workflow_run.id }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Export staging control database authority and TLS trust
        uses: ./.github/actions/export-managed-postgres-authority
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        with:
          environment: staging
          contexts: control
          connection-mode: direct

      - name: Configure staging Kubernetes context
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-staging-evidence-window-cleanup.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure staging Kubernetes context." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Staging Kubernetes kubeconfig has no current context after Terraform and DigitalOcean refresh attempts." >&2
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured staging Kubernetes context: ${current_context}"

      - name: Observe the window run and take over its cleanup
        id: observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          TARGET_RUN_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
        run: pnpm exec tsx scripts/staging-evidence-window.mjs observe

      - name: Remove managed Postgres CA
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${PGSSLROOTCERT:-}" ]; then
            rm -f -- "$PGSSLROOTCERT"
          fi

      - name: Upload the observer receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-evidence-window-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-evidence-window/artifact
          if-no-files-found: error
          retention-days: 30
