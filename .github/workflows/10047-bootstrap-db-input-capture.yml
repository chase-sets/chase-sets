          const changed=cmd('git',['diff','--name-only',frozen,'HEAD'],{cwd:root}).split('\n').filter(Boolean); if(JSON.stringify(changed)!==JSON.stringify(['.github/workflows/10047-bootstrap-db-input-capture.yml'])) throw Error('unexpected diff');
          const pkg=JSON.parse(readFileSync(resolve(cwd,'package.json'))); const scripts=pkg.scripts; const scriptGroups={}; for(const unit of ['test:db:1','test:db:2','test:db:3']) { const files=[...scripts[unit].matchAll(/__tests__\/([^ ]+\.db\.test\.ts)/g)].map(m=>m[1]); if(!files.length) throw Error('empty '+unit); scriptGroups[unit]=files; }
