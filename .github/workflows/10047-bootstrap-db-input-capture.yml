          if(process.env.CAPTURE_MODE!=='shipped'){ const a=check.bootstrapDbMeasuredOneFewerUnitFloor.assignment; for(const f of bootstrap) groups[a[f]??(()=>{throw Error('missing floor assignment '+f)})()].push(f); for(const f of non) groups[check.platformApiNonBootstrapDbCensus.entries['__tests__/'+f]].push(f); if(Object.values(groups).flat().length!==18) throw Error('paired census count'); }
          const manifest={}; for(const [u,files] of Object.entries(groups)) for(const file of files){ const source=readFileSync(resolve(cwd,'__tests__',file),'utf8'); const cases=check.deriveBootstrapDbCaseIdentities(basename(file),source); const e={executionUnit:u,sourceSha256:hash(Buffer.from(source)),cases}; if(!bootstrap.has(file)) e.censusCaseNames=helper.deriveCaptureCensusCaseNames(file,source,fixture); manifest[file]=e; }
          if(Object.keys(manifest).length!==18 || Object.values(manifest).filter(e=>!e.censusCaseNames).reduce((n,e)=>n+e.cases.length,0)!==68 || Object.values(manifest).reduce((n,e)=>n+(e.censusCaseNames??e.cases).length,0)!==133) throw Error('counts mismatch');
