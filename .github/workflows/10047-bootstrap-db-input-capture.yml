name: 10047 Bootstrap DB Input Capture Only

on:
  push:
    branches: [codex/10047-capture-r3]
    paths: [.github/workflows/10047-bootstrap-db-input-capture.yml]

permissions:
  contents: read

env:
  FROZEN_S: 56fa419c5d47cafd5455b7dbf496a4339ce61985
  CAPTURE_REF: refs/heads/codex/10047-capture-r3

jobs:
  shipped:
    name: Diagnostic API Bootstrap Measurement Only
    if: github.event_name == 'push' && github.repository == 'chase-sets/chase-sets' && github.ref == 'refs/heads/codex/10047-capture-r3' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CAPTURE_MODE: shipped
      CAPTURE_OUTPUT: artifacts/10047-reference-capture
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-pnpm-workspace
        with: {install: true}
      - name: Raise PostgreSQL lock table capacity for DB Profile
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -c "ALTER SYSTEM SET max_locks_per_transaction = 512;"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -c "ALTER SYSTEM SET max_connections = 300;"
          docker restart "$POSTGRES_CONTAINER_ID"
          for _ in $(seq 1 30); do docker exec "$POSTGRES_CONTAINER_ID" pg_isready -U postgres -d postgres >/dev/null 2>&1 && break; sleep 1; done
          docker exec "$POSTGRES_CONTAINER_ID" pg_isready -U postgres -d postgres
          test "$(docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -tAc 'SHOW max_locks_per_transaction;' | tr -d '[:space:]')" = 512
          test "$(docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -tAc 'SHOW max_connections;' | tr -d '[:space:]')" = 300
          mkdir -p "$CAPTURE_OUTPUT"; docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -v ON_ERROR_STOP=1 -c 'SHOW max_connections; SHOW max_locks_per_transaction; SHOW shared_buffers; SHOW work_mem; SHOW maintenance_work_mem; SHOW superuser_reserved_connections; SHOW reserved_connections;' | tee "$CAPTURE_OUTPUT/postgres-settings.txt"
          docker image inspect pgvector/pgvector:pg16 --format '{{json .RepoDigests}}' | tee "$CAPTURE_OUTPUT/postgres-image-digests.json"
      - name: Restore immutable diagnostic-only census helper
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$FROZEN_S"
          test "$(git rev-parse --is-shallow-repository)" = false
          git fetch --no-tags origin e04bf62981772c43adb0eb6695261679df9f1bd1
          git show e04bf62981772c43adb0eb6695261679df9f1bd1:deployables/platform-api/scripts/8396-capture-census.mjs > deployables/platform-api/scripts/8396-capture-census.mjs
          echo 'c9bb1a649b15063088430e6a436acad7e69b17357906148300af82dd3a9df334  deployables/platform-api/scripts/8396-capture-census.mjs' | sha256sum -c -
