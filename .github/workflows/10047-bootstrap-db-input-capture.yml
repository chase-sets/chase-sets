          const units=[]; for(const [unit,files] of Object.entries(groups)){ const args=['exec',...commands[unit].split(' ').filter(Boolean),`--reporter=${resolve(out,'reporter.mjs')}`,'--reporter=json',`--outputFile.json=${resolve(out,unit.replaceAll(':','-')+'.json')}`]; const startedAt=new Date().toISOString(),start=Date.now(); const rec={unit,files,command:['pnpm',...args],startedAt,deadlineMs:600000,status:'running'}; units.push(rec); writeFileSync(resolve(out,'units.json'),JSON.stringify(units,null,2)); const child=spawn('pnpm',args,{cwd,stdio:'inherit',detached:true,env:{...process.env,BOOTSTRAP_DB_EVIDENCE_UNIT:unit,MEASUREMENT_OUTPUT:resolve(out,unit.replaceAll(':','-')+'.jsonl')}}); const result=await new Promise(res=>{let done=false; const t=setTimeout(()=>{try{process.kill(-child.pid,'SIGKILL')}catch{}; if(!done){done=true;res({code:null,signal:'SIGKILL',timedOut:true})}},600000); child.on('error',e=>{if(!done){done=true;clearTimeout(t);res({code:null,error:e.message})}}); child.on('exit',(code,signal)=>{if(!done){done=true;clearTimeout(t);res({code,signal})}})}); rec.exitCode=result.code; rec.signal=result.signal??null; rec.timedOut=!!result.timedOut; rec.finishedAt=new Date().toISOString(); rec.durationMs=Date.now()-start; rec.status=result.code===0&&!rec.timedOut?'passed':'failed'; writeFileSync(resolve(out,'units.json'),JSON.stringify(units,null,2)); if(rec.status!=='passed') process.exitCode=1; }
          if(process.exitCode) throw Error('measurement failed');
          for(const [unit,files] of Object.entries(groups)){ const rows=readFileSync(resolve(out,unit.replaceAll(':','-')+'.jsonl'),'utf8').trim().split('\n').map(JSON.parse); const end=rows.find(r=>r.runEnd); if(!end||end.reason!=='passed'||end.errors.length) throw Error(unit+' reporter failure'); for(const row of rows.filter(r=>!r.runEnd)){ if(row.state!=='passed'||row.errors.length) throw Error(row.file+' failed'); if(!files.includes(row.file)) throw Error(row.file+' not in unit'); } }
          capture.provenance.units=units; capture.provenance.artifactRoot=process.env.CAPTURE_OUTPUT; writeFileSync(resolve(out,'capture.json'),JSON.stringify(capture,null,2)+'\n');
          RUNNER
      - name: Upload paired capture
