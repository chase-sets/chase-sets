            onTestRunEnd(modules, errors, reason) { appendFileSync(process.env.MEASUREMENT_OUTPUT, JSON.stringify({runEnd:true,moduleCount:modules.length,errors,reason})+'\n'); }
          }
          REPORTER
          node --input-type=module <<'RUNNER'
          import {createHash} from 'node:crypto'; import {readFileSync,writeFileSync,mkdirSync} from 'node:fs'; import {resolve,basename} from 'node:path'; import {spawn,execFileSync} from 'node:child_process';
