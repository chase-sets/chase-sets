name: Platform Staging Representative Commerce State

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Ref containing the representative refresh code. Defaults to main.
        required: false
        default: main
        type: string
      catalog_item_limit:
        description: Maximum untouched Catalog Items to cover in this pass.
        required: false
        default: "50"
        type: string
      step_timeout_ms:
        description: Per-step timeout for projection sync and representative refresh work.
        required: false
        default: "300000"
        type: string
      confirm:
        description: Type "seed staging commerce", "verify sandbox providers", or "execute combined-parcel probe 6461" exactly.
        required: true
        type: string
      combined_parcel_probe_resume_run_id:
        description: Exact prior combined-parcel probe run id; blank for a fresh probe.
        required: false
        type: string
      combined_parcel_probe_resume_run_attempt:
        description: Exact prior run attempt; required with either other resume input.
        required: false
        type: string
      combined_parcel_probe_resume_checkpoint:
        description: Exact private checkpoint (pre-a, post-a, pre-b, final); required with resume.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: platform-staging-mutating-operations
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    name: Refuse Unconfirmed Representative Commerce State
    runs-on: ubuntu-latest
    if: inputs.confirm != 'seed staging commerce' && inputs.confirm != 'verify sandbox providers' && inputs.confirm != 'execute combined-parcel probe 6461'
    steps:
      - name: Refuse unconfirmed representative commerce state
        run: |
          echo 'Confirmation text did not match exactly; expected "seed staging commerce", "verify sandbox providers", or "execute combined-parcel probe 6461".' >&2
          exit 1

  refresh-representative-commerce-state:
    name: Refresh Representative Commerce State
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    concurrency:
      group: platform-deploy-staging
      cancel-in-progress: false
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped' && inputs.confirm == 'seed staging commerce'
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: staging
      DEPLOYMENT_ENVIRONMENT: staging
      NODE_ENV: production
      REPRESENTATIVE_COMMERCE_STATE_CONFIRM: seed staging commerce
      REPRESENTATIVE_COMMERCE_STATE_CATALOG_ITEM_LIMIT: ${{ inputs.catalog_item_limit }}
      REPRESENTATIVE_COMMERCE_STATE_STEP_TIMEOUT_MS: ${{ inputs.step_timeout_ms }}
      REPRESENTATIVE_COMMERCE_STATE_EVIDENCE_OUT: ${{ github.workspace }}/artifacts/representative-commerce-state/representative-commerce-state-evidence.json
      PLATFORM_INTERNAL_AUTH_SECRET: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_API_BASE_URL: ${{ vars.STRIPE_API_BASE_URL || '' }}
      EASYPOST_API_KEY: ${{ secrets.EASYPOST_API_KEY }}
      EASYPOST_API_BASE_URL: ${{ vars.EASYPOST_API_BASE_URL || '' }}
      EASYPOST_MODE: ${{ vars.EASYPOST_MODE || 'test' }}
      CATALOG_ASSET_STORAGE_KIND: s3
      CATALOG_ASSET_S3_BUCKET: chase-sets-staging-catalog-assets
      CATALOG_ASSET_S3_REGION: nyc3
      CATALOG_ASSET_S3_ENDPOINT: https://nyc3.digitaloceanspaces.com
      CATALOG_ASSET_PUBLIC_BASE_URL: https://assets.staging.chasesets.com
      MARKETPLACE_LISTING_PHOTO_STORAGE_KIND: s3
      MARKETPLACE_LISTING_PHOTO_S3_BUCKET: chase-sets-staging-catalog-assets
      MARKETPLACE_LISTING_PHOTO_S3_REGION: nyc3
      MARKETPLACE_LISTING_PHOTO_S3_ENDPOINT: https://nyc3.digitaloceanspaces.com
      MARKETPLACE_LISTING_PHOTO_PUBLIC_BASE_URL: https://assets.staging.chasesets.com
    steps:
      - name: Confirm representative refresh
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          echo "Representative commerce refresh confirmed."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        with:
          fetch-depth: 0

      - name: Resolve release commit
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --release-ref "${{ inputs.release_ref }}" \
            --checkout true

      - uses: ./.github/actions/setup-pnpm-workspace
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}

      - name: Install dependencies
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: pnpm install --frozen-lockfile

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          NODE_OPTIONS: --no-deprecation

      - name: Export staging database URLs and TLS trust
        uses: ./.github/actions/export-managed-postgres-authority
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        with:
          environment: staging

      - name: Run representative commerce state refresh
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/representative-commerce-state
          pnpm --filter @chase-sets/app-platform-api run representative-commerce-state:production

      - name: Remove managed Postgres CA
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${PGSSLROOTCERT:-}" ]; then
            rm -f -- "$PGSSLROOTCERT"
          fi

      - name: Upload representative commerce selector evidence
        env:
          CATALOG_ASSET_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          CATALOG_ASSET_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          MARKETPLACE_LISTING_PHOTO_S3_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          MARKETPLACE_LISTING_PHOTO_S3_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: representative-commerce-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/representative-commerce-state
          if-no-files-found: error
          retention-days: 30

  verify-sandbox-provider-evidence:
    name: Verify Sandbox Provider Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped' && inputs.confirm == 'verify sandbox providers'
    env:
      NODE_ENV: production
      PLATFORM_API_BASE_URL: https://marketplace.staging.chasesets.com
      PLATFORM_AUTH_BASE_URL: https://marketplace.staging.chasesets.com
      SMOKE_REGISTER_SELLER: "true"
      SMOKE_SELLER_EMAIL: stripe-sandbox-evidence+${{ github.run_id }}-${{ github.run_attempt }}@chasesets.test
      SMOKE_SELLER_PASSWORD: staging-stripe-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_SELLER_DISPLAY_NAME: Stripe Sandbox Evidence ${{ github.run_id }}-${{ github.run_attempt }}
      # Seller-flow synthetic accounts need an admin-created registration bypass.
      PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_API_BASE_URL: ${{ vars.STRIPE_API_BASE_URL || '' }}
      SMOKE_ORDER_IDS: ${{ vars.STAGING_SMOKE_ORDER_IDS || '' }}
      SMOKE_BALANCE_CREDIT_AMOUNT: ${{ vars.STAGING_SMOKE_BALANCE_CREDIT_AMOUNT || '' }}
      SMOKE_PAYMENT_METHOD_CATEGORY: ${{ vars.STAGING_SMOKE_PAYMENT_METHOD_CATEGORY || '' }}
      SMOKE_CREATE_PAYMENT: ${{ vars.STAGING_SMOKE_CREATE_PAYMENT || '' }}
      STAGING_SMOKE_WALLET_FUNDING_AMOUNT: ${{ vars.STAGING_SMOKE_WALLET_FUNDING_AMOUNT || '' }}
      SMOKE_PAYOUT_AMOUNT: ${{ vars.STAGING_SMOKE_PAYOUT_AMOUNT || '' }}
      SMOKE_REQUEST_PAYOUT: ${{ vars.STAGING_SMOKE_REQUEST_PAYOUT || '' }}
      EASYPOST_API_KEY: ${{ secrets.EASYPOST_API_KEY }}
      EASYPOST_MODE: test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Confirm sandbox provider evidence
        run: |
          set -euo pipefail
          if [ "${EASYPOST_API_KEY#EZTK}" = "$EASYPOST_API_KEY" ]; then
            echo "Staging EASYPOST_API_KEY must be an EasyPost test key (EZTK...) for sandbox evidence." >&2
            exit 1
          fi

      - name: Run Stripe staging sandbox money smoke
        run: |
          set -euo pipefail
          mkdir -p artifacts/sandbox-provider-evidence
          pnpm run stripe:money-smoke -- --edge-check --seller-flow \
            | tee artifacts/sandbox-provider-evidence/stripe-staging-money-smoke.log

      - name: Run EasyPost test label smoke
        env:
          EASYPOST_SANDBOX_EVIDENCE_PATH: ${{ github.workspace }}/artifacts/sandbox-provider-evidence/easypost-test-smoke.json
        run: |
          set -euo pipefail
          pnpm --filter @chase-sets/easypost-postage test -- easypost-smoke.test.ts

      - name: Write sandbox provider evidence summary
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const artifactDir = "artifacts/sandbox-provider-evidence";
          const easyPost = JSON.parse(fs.readFileSync(path.join(artifactDir, "easypost-test-smoke.json"), "utf8"));
          const evidence = {
            schemaVersion: "sandbox-provider-evidence/v1",
            label: "sandbox verified but not completed",
            sandboxVerified: true,
            productionCompleted: false,
            checkedAt: new Date().toISOString(),
            releaseCommit: process.env.GITHUB_SHA,
            githubRunId: process.env.GITHUB_RUN_ID,
            githubRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            stripe: {
              environment: "staging",
              mode: "test",
              sandboxVerified: true,
              productionCompleted: false,
              evidenceLog: "stripe-staging-money-smoke.log",
              checks: [
                "payment-webhook-signature-edge",
                "connect-money-movement-webhook-signature-edge",
                "payment-and-settlement-provider-health",
                "hosted-connect-onboarding-url",
                "connect-refresh-url",
                "payout-preview"
              ]
            },
            easyPost,
          };
          fs.writeFileSync(
            path.join(artifactDir, "sandbox-provider-evidence.json"),
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE

      - name: Add sandbox provider evidence summary
        run: |
          set -euo pipefail
          {
            echo "### Sandbox provider evidence"
            echo ""
            echo "- Label: sandbox verified but not completed"
            echo "- Stripe staging sandbox money smoke: passed"
            echo "- EasyPost test label purchase and void/refund smoke: passed"
            echo "- Production completion: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sandbox provider evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-provider-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/sandbox-provider-evidence
          if-no-files-found: error
          retention-days: 30

  combined-parcel-probe:
    name: Combined Parcel Probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      actions: read
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped' && inputs.confirm == 'execute combined-parcel probe 6461'
    env:
      EASYPOST_API_KEY: ${{ secrets.EASYPOST_API_KEY }}
      EASYPOST_MODE: test
      COMBINED_PARCEL_PROBE_CONFIRM: ${{ inputs.confirm }}
      COMBINED_PARCEL_PROBE_WORKFLOW_CONFIRM: ${{ inputs.confirm }}
      COMBINED_PARCEL_PROBE_ENVIRONMENT: staging
      COMBINED_PARCEL_PROBE_SOURCE_SHA: ${{ inputs.release_ref }}
      COMBINED_PARCEL_PROBE_RESUME_RUN_ID: ${{ inputs.combined_parcel_probe_resume_run_id }}
      COMBINED_PARCEL_PROBE_RESUME_RUN_ATTEMPT: ${{ inputs.combined_parcel_probe_resume_run_attempt }}
      COMBINED_PARCEL_PROBE_RESUME_CHECKPOINT: ${{ inputs.combined_parcel_probe_resume_checkpoint }}
    steps:
      - name: Require immutable dispatch source
        env:
          EASYPOST_API_KEY: ""
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMBINED_PARCEL_PROBE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$COMBINED_PARCEL_PROBE_SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        env:
          EASYPOST_API_KEY: ""
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-workspace
        env:
          EASYPOST_API_KEY: ""
        with:
          install: true
      - name: Bind checked out source
        env:
          EASYPOST_API_KEY: ""
        run: echo "COMBINED_PARCEL_PROBE_CHECKED_OUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Download explicit resume checkpoint
        id: download-resume
        if: inputs.combined_parcel_probe_resume_run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        env:
          EASYPOST_API_KEY: ""
        with:
          run-id: ${{ inputs.combined_parcel_probe_resume_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          name: combined-parcel-probe-private-${{ inputs.combined_parcel_probe_resume_run_id }}-${{ inputs.combined_parcel_probe_resume_run_attempt }}-${{ inputs.combined_parcel_probe_resume_checkpoint }}
          path: artifacts/combined-parcel-probe/download-resume
      - name: Validate explicit resume authority
        id: validate-resume
        if: inputs.combined_parcel_probe_resume_run_id != ''
        env:
          EASYPOST_API_KEY: ""
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx infrastructure/easypost-postage/tests/combined-parcel-probe.ts resume

      - name: Execute pre-a
        id: pre-a
        env:
          COMBINED_PARCEL_PROBE_PHASE: pre-a
        run: pnpm --filter @chase-sets/easypost-postage run test tests/combined-parcel-probe.test.ts

      - name: Upload pre-a private checkpoint
        id: upload-pre-a
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          EASYPOST_API_KEY: ""
        with:
          name: combined-parcel-probe-private-${{ github.run_id }}-${{ github.run_attempt }}-pre-a
          path: artifacts/combined-parcel-probe/pre-a/combined-parcel-probe-private-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Download uploaded pre-a
        id: download-pre-a
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        env:
          EASYPOST_API_KEY: ""
        with:
          name: combined-parcel-probe-private-${{ github.run_id }}-${{ github.run_attempt }}-pre-a
          path: artifacts/combined-parcel-probe/download-pre-a
      - name: Validate uploaded pre-a
        id: validate-pre-a
        env:
          EASYPOST_API_KEY: ""
          GH_TOKEN: ${{ github.token }}
          COMBINED_PARCEL_PROBE_ARTIFACT_ID: ${{ steps.upload-pre-a.outputs.artifact-id }}
          COMBINED_PARCEL_PROBE_ARTIFACT_DIGEST: ${{ steps.upload-pre-a.outputs.artifact-digest }}
        run: pnpm exec tsx infrastructure/easypost-postage/tests/combined-parcel-probe.ts pre-a

      - name: Execute case-a-pre-b
        id: case-a-pre-b
        env:
          COMBINED_PARCEL_PROBE_PHASE: case-a-pre-b
        run: pnpm --filter @chase-sets/easypost-postage run test tests/combined-parcel-probe.test.ts

      - name: Upload post-a private checkpoint
        id: upload-post-a
        if: ${{ !cancelled() && hashFiles('artifacts/combined-parcel-probe/post-a/combined-parcel-probe-private-state.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          EASYPOST_API_KEY: ""
        with:
          name: combined-parcel-probe-private-${{ github.run_id }}-${{ github.run_attempt }}-post-a
          path: artifacts/combined-parcel-probe/post-a/combined-parcel-probe-private-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload pre-b private checkpoint
        id: upload-pre-b
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          EASYPOST_API_KEY: ""
        with:
          name: combined-parcel-probe-private-${{ github.run_id }}-${{ github.run_attempt }}-pre-b
          path: artifacts/combined-parcel-probe/pre-b/combined-parcel-probe-private-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Download uploaded post-a
        id: download-post-a
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        env:
          EASYPOST_API_KEY: ""
        with:
          name: combined-parcel-probe-private-${{ github.run_id }}-${{ github.run_attempt }}-post-a
          path: artifacts/combined-parcel-probe/download-post-a
      - name: Validate uploaded post-a
        id: validate-post-a
        env:
          EASYPOST_API_KEY: ""
          GH_TOKEN: ${{ github.token }}
          COMBINED_PARCEL_PROBE_ARTIFACT_ID: ${{ steps.upload-post-a.outputs.artifact-id }}
          COMBINED_PARCEL_PROBE_ARTIFACT_DIGEST: ${{ steps.upload-post-a.outputs.artifact-digest }}
        run: pnpm exec tsx infrastructure/easypost-postage/tests/combined-parcel-probe.ts post-a

      - name: Download uploaded pre-b
        id: download-pre-b
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        env:
          EASYPOST_API_KEY: ""
        with:
          name: combined-parcel-probe-private-${{ github.run_id }}-${{ github.run_attempt }}-pre-b
          path: artifacts/combined-parcel-probe/download-pre-b
      - name: Validate uploaded pre-b
        id: validate-pre-b
        env:
          EASYPOST_API_KEY: ""
          GH_TOKEN: ${{ github.token }}
          COMBINED_PARCEL_PROBE_ARTIFACT_ID: ${{ steps.upload-pre-b.outputs.artifact-id }}
          COMBINED_PARCEL_PROBE_ARTIFACT_DIGEST: ${{ steps.upload-pre-b.outputs.artifact-digest }}
        run: pnpm exec tsx infrastructure/easypost-postage/tests/combined-parcel-probe.ts pre-b

      - name: Execute case-b
        id: case-b
        env:
          COMBINED_PARCEL_PROBE_PHASE: case-b
        run: pnpm --filter @chase-sets/easypost-postage run test tests/combined-parcel-probe.test.ts

      - name: Upload final private checkpoint
        id: upload-final
        if: ${{ !cancelled() && hashFiles('artifacts/combined-parcel-probe/final/combined-parcel-probe-private-state.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          EASYPOST_API_KEY: ""
        with:
          name: combined-parcel-probe-private-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: artifacts/combined-parcel-probe/final/combined-parcel-probe-private-state.json
          if-no-files-found: error
          retention-days: 30

      - name: Download uploaded final
        id: download-final
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        env:
          EASYPOST_API_KEY: ""
        with:
          name: combined-parcel-probe-private-${{ github.run_id }}-${{ github.run_attempt }}-final
          path: artifacts/combined-parcel-probe/download-final
      - name: Validate uploaded final
        id: validate-final
        env:
          EASYPOST_API_KEY: ""
          GH_TOKEN: ${{ github.token }}
          COMBINED_PARCEL_PROBE_ARTIFACT_ID: ${{ steps.upload-final.outputs.artifact-id }}
          COMBINED_PARCEL_PROBE_ARTIFACT_DIGEST: ${{ steps.upload-final.outputs.artifact-digest }}
        run: pnpm exec tsx infrastructure/easypost-postage/tests/combined-parcel-probe.ts final

      - name: Upload validated public evidence
        id: upload-public
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        env:
          EASYPOST_API_KEY: ""
        with:
          name: combined-parcel-probe-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/combined-parcel-probe/public/combined-parcel-probe-evidence.json
          if-no-files-found: error
          retention-days: 30
