name: Platform Staging Route Matrix Evidence

# Generates support-safe read-consistency route-matrix evidence for #2511/#2512.
# The workflow queries staging Prometheus with an environment-scoped query token
# and uploads only the redacted route-matrix artifact, then evaluates the
# combined segment-level projection lag SLO regression gate (`release-health:report
# --gate`) across every freshness artifact the run produced, so a real breach
# fails this workflow closed instead of only being visible in a report a human
# has to remember to read.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "generate staging route matrix evidence" to confirm querying staging observability.
        required: true
        type: string
      release_ref:
        description: Ref containing the evidence tooling. Defaults to main.
        required: false
        default: main
        type: string
      prometheus_url:
        description: Staging Prometheus base URL.
        required: false
        default: https://prometheus.staging.chasesets.com
        type: string
      window:
        description: Prometheus range window such as 30m, 2h, or 1d.
        required: false
        default: 30m
        type: string

permissions:
  contents: read
  # Deploy-quiescence gate (issue #4721): the sampler's self-generated traffic
  # must not race an in-flight staging rollout, so the job lists Platform
  # Deploy runs before driving samples.
  actions: read

concurrency:
  group: platform-staging-route-matrix-evidence
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    name: Refuse Unconfirmed Route Matrix Evidence
    runs-on: ubuntu-latest
    if: inputs.confirm != 'generate staging route matrix evidence'
    steps:
      - name: Refuse unconfirmed route-matrix evidence
        run: |
          echo 'Confirmation text did not match exactly; expected "generate staging route matrix evidence".' >&2
          exit 1

  staging-route-matrix-evidence:
    name: Staging Route Matrix Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped'
    env:
      PROMETHEUS_URL: ${{ inputs.prometheus_url }}
      PROMETHEUS_QUERY_TOKEN: ${{ secrets.PROMETHEUS_QUERY_TOKEN || '' }}
      ROUTE_MATRIX_EVIDENCE_WINDOW: ${{ inputs.window }}
      ROUTE_MATRIX_EVIDENCE_ENVIRONMENT: staging
      READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT: artifacts/wake-drills/read-consistency-route-matrix-evidence.json
      READ_CONSISTENCY_ROUTE_MATRIX_SAMPLER_OUT: artifacts/wake-drills/read-consistency-route-matrix-sampler.json
      ROUTE_MATRIX_CHECKOUT_PROBE_OUT: artifacts/wake-drills/route-matrix-checkout-probe.json
      ROUTE_MATRIX_ACCOUNT_CART_PROBE_OUT: artifacts/wake-drills/route-matrix-account-cart-probe.json
      ROUTE_MATRIX_DEPLOY_WINDOW_OUT: artifacts/wake-drills/read-consistency-route-matrix-deploy-window.json
    steps:
      - name: Confirm staging route-matrix evidence
        run: |
          set -euo pipefail
          echo "Staging route-matrix evidence confirmed for window '${ROUTE_MATRIX_EVIDENCE_WINDOW}'."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --release-ref "${{ inputs.release_ref }}" \
            --checkout true

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Install Playwright Chromium for route-matrix sampler
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Prometheus query configuration
        run: |
          set -euo pipefail
          mkdir -p artifacts/wake-drills
          missing=()
          if [ -z "${PROMETHEUS_URL:-}" ]; then
            missing+=("PROMETHEUS_URL")
          fi
          if [ -z "${PROMETHEUS_QUERY_TOKEN:-}" ]; then
            missing+=("PROMETHEUS_QUERY_TOKEN")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            CONFIG_FAILURE_OUT="artifacts/wake-drills/route-matrix-config-failure.json" \
            ROUTE_MATRIX_MISSING_CONFIG="$(IFS=,; echo "${missing[*]}")" \
            node <<'NODE'
            const fs = require("node:fs");
            const missing = (process.env.ROUTE_MATRIX_MISSING_CONFIG || "")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const report = {
              schemaVersion: "read-consistency-route-matrix-config-failure/v1",
              environment: process.env.ROUTE_MATRIX_EVIDENCE_ENVIRONMENT || "staging",
              checkedAt: new Date().toISOString(),
              window: process.env.ROUTE_MATRIX_EVIDENCE_WINDOW || "unknown",
              status: "configuration-error",
              missingConfiguration: missing,
              prometheusUrlConfigured: Boolean(process.env.PROMETHEUS_URL),
              prometheusQueryTokenConfigured: Boolean(process.env.PROMETHEUS_QUERY_TOKEN),
              supportSafe: true,
              redaction: {
                secrets: "not-written",
                prometheusUrl: "not-written",
                rawQueries: "not-written",
              },
              nextAction:
                "Configure the missing staging GitHub Environment value(s), then rerun Platform Staging Route Matrix Evidence.",
            };
            fs.writeFileSync(process.env.CONFIG_FAILURE_OUT, `${JSON.stringify(report, null, 2)}\n`);
          NODE
            printf 'Missing required staging route-matrix evidence configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Await deploy quiescence
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_QUIESCENCE_BUDGET_S: ${{ vars.STAGING_ROUTE_MATRIX_DEPLOY_QUIESCENCE_BUDGET_S || '1500' }}
          DEPLOY_QUIESCENCE_POLL_INTERVAL_S: ${{ vars.STAGING_ROUTE_MATRIX_DEPLOY_QUIESCENCE_POLL_INTERVAL_S || '30' }}
        run: |
          set -euo pipefail
          # Issue #4721: run 28996898078 drove its checkout samples while a
          # Platform Deploy was rolling the staging fleet (05:33:50-05:50:29Z),
          # so every receipt-backed evaluation in the window timed out and the
          # evidence read as a wake regression. Wait (bounded) until no deploy
          # run is in progress before generating traffic. Timing gate only:
          # on budget exhaustion we proceed and let the samples fail loudly.
          deadline=$((SECONDS + DEPLOY_QUIESCENCE_BUDGET_S))
          while :; do
            in_flight="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/platform-production.yml/runs?status=in_progress&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)"
            queued="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/platform-production.yml/runs?status=queued&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)"
            if [ "${in_flight:-0}" = "0" ] && [ "${queued:-0}" = "0" ]; then
              echo "No Platform Deploy runs in flight; proceeding with route-matrix sampling."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::warning::Platform Deploy still in flight after ${DEPLOY_QUIESCENCE_BUDGET_S}s; route-matrix samples may race the rollout." \
                | tee -a "$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "Platform Deploy in flight (running=${in_flight}, queued=${queued}); waiting ${DEPLOY_QUIESCENCE_POLL_INTERVAL_S}s..."
            sleep "${DEPLOY_QUIESCENCE_POLL_INTERVAL_S}"
          done

      - name: Await staging projection convergence
        env:
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          PROJECTION_CONVERGENCE_BUDGET_MS: ${{ vars.STAGING_PROJECTION_CONVERGENCE_BUDGET_MS || '300000' }}
          PROJECTION_CONVERGENCE_POLL_INTERVAL_MS: ${{ vars.STAGING_PROJECTION_CONVERGENCE_POLL_INTERVAL_MS || '5000' }}
          PROJECTION_CONVERGENCE_PROJECTION_NAMES: ${{ vars.STAGING_PROJECTION_CONVERGENCE_PROJECTION_NAMES || 'checkout.session-projection' }}
        run: |
          set -euo pipefail
          gate_out=artifacts/wake-drills/route-matrix-projection-convergence-gate.json
          # Bounded convergence gate (issues #4709/#4721, same mode the deploy
          # probes use): wait for the checkout sample's exact durable dependency
          # to report caught-up after any recent rollout before driving samples.
          # Unrelated degraded projections remain diagnostic and do not delay this
          # route-scoped evidence. Timing gate only; the samples and evidence still
          # fail loudly on steady-state breaches.
          set +e
          pnpm run guest-buy-now:freshness-probe -- \
            --convergence-gate \
            --environment staging \
            --admin-base-url "https://admin.staging.chasesets.com" \
            --convergence-budget-ms "${PROJECTION_CONVERGENCE_BUDGET_MS}" \
            --convergence-poll-interval-ms "${PROJECTION_CONVERGENCE_POLL_INTERVAL_MS}" \
            --convergence-projection-names "${PROJECTION_CONVERGENCE_PROJECTION_NAMES}" \
            --out "$gate_out"
          gate_exit=$?
          set -e
          converged="$(jq -r 'if .gate.converged == null then "unknown" else (.gate.converged | tostring) end' "$gate_out" 2>/dev/null || echo unknown)"
          converged_after_ms="$(jq -r '.gate.convergedAfterMs // "did not converge"' "$gate_out" 2>/dev/null || echo unknown)"
          lagging="$(jq -r '(.gate.final.laggingGroups // []) | join(", ")' "$gate_out" 2>/dev/null || echo "")"
          {
            echo "## Route-matrix projection convergence gate"
            echo ""
            echo "| Converged | Converged after (ms) | Budget (ms) | Lagging groups |"
            echo "| --- | --- | --- | --- |"
            echo "| ${converged} | ${converged_after_ms} | ${PROJECTION_CONVERGENCE_BUDGET_MS} | ${lagging:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$gate_exit" -ne 0 ]; then
            echo "Route-matrix projection convergence gate failed to run (exit ${gate_exit})." >&2
            exit 1
          fi

      - name: Capture deploy window state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deploy_runs_file="${RUNNER_TEMP}/route-matrix-platform-deploy-runs.json"
          argo_rollouts_file="${RUNNER_TEMP}/route-matrix-argo-rollouts.json"
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/platform-production.yml/runs?per_page=100" > "${deploy_runs_file}"; then
            printf '%s\n' '{"available":false,"workflow_runs":[]}' > "${deploy_runs_file}"
          fi
          if command -v kubectl >/dev/null 2>&1 && [ -n "${KUBECONFIG:-}" ]; then
            if ! kubectl get rollouts --all-namespaces --output json > "${argo_rollouts_file}"; then
              printf '%s\n' '{"available":false,"items":[]}' > "${argo_rollouts_file}"
            fi
          else
            # The route-matrix job normally has no cluster credentials. When a
            # caller supplies KUBECONFIG, the Argo Rollouts CRD is the cheaper
            # and more precise deployment signal; otherwise GitHub Actions is
            # the bounded fallback.
            printf '%s\n' '{"available":false,"items":[]}' > "${argo_rollouts_file}"
          fi
          pnpm run ops read-consistency:route-matrix-deploy-window -- \
            --environment "${ROUTE_MATRIX_EVIDENCE_ENVIRONMENT}" \
            --github-runs-file "${deploy_runs_file}" \
            --argo-rollouts-file "${argo_rollouts_file}" \
            --out "${ROUTE_MATRIX_DEPLOY_WINDOW_OUT}"
          deploy_window_status="$(jq -r '.status // "unknown"' "${ROUTE_MATRIX_DEPLOY_WINDOW_OUT}")"
          if [ "${deploy_window_status}" = "active" ]; then
            echo "::warning::A deployment window is active; route-matrix probes will be skipped and evidence will remain non-passing until rerun."
          fi

      - name: Drive checkout route-matrix sample
        env:
          GUEST_BUY_NOW_PROBE_ITEM_PATH: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ITEM_PATH || '' }}
          GUEST_BUY_NOW_PROBE_SEARCH_QUERY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_SEARCH_QUERY || 'air balloon' }}
          GUEST_BUY_NOW_PROBE_FIXTURE_KEY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_FIXTURE_KEY || 'staging-guest-buy-now-fixture' }}
          GUEST_BUY_NOW_PROBE_TIMEOUT_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_TIMEOUT_MS || '45000' }}
          GUEST_BUY_NOW_PROBE_READY_SLO_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_READY_SLO_MS || '10000' }}
          GUEST_BUY_NOW_PROBE_ATTEMPTS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ATTEMPTS || '3' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_BUDGET_MS || '120000' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_POLL_INTERVAL_MS || '5000' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          set -euo pipefail
          deploy_window_status="$(jq -r '.status // "unknown"' "${ROUTE_MATRIX_DEPLOY_WINDOW_OUT}" 2>/dev/null || echo unknown)"
          if [ "${deploy_window_status}" = "active" ]; then
            echo "::warning::Skipping checkout route-matrix probe because a deploy window is active; evidence will report skipped coverage."
            exit 0
          fi
          checkout_args=(
            --environment staging
            --base-url "https://marketplace.staging.chasesets.com"
            --admin-base-url "https://admin.staging.chasesets.com"
            --search-query "${GUEST_BUY_NOW_PROBE_SEARCH_QUERY}"
            --fixture-key "${GUEST_BUY_NOW_PROBE_FIXTURE_KEY}"
            --timeout-ms "${GUEST_BUY_NOW_PROBE_TIMEOUT_MS}"
            --ready-slo-ms "${GUEST_BUY_NOW_PROBE_READY_SLO_MS}"
            --attempts "${GUEST_BUY_NOW_PROBE_ATTEMPTS}"
            --wake-runtime-ready-budget-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS}"
            --wake-runtime-ready-poll-interval-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS}"
          )
          if [ -n "${GUEST_BUY_NOW_PROBE_ITEM_PATH}" ]; then
            checkout_args+=(--item-path "${GUEST_BUY_NOW_PROBE_ITEM_PATH}")
          fi

          set +e
          pnpm run guest-buy-now:freshness-probe -- \
            "${checkout_args[@]}" \
            --flow guest \
            --guest-email "route-matrix-probe+${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@chasesets.test" \
            --diagnostic-correlation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-route-matrix-checkout" \
            --out "${ROUTE_MATRIX_CHECKOUT_PROBE_OUT}"
          checkout_exit=$?
          set -e
          if [ "$checkout_exit" -ne 0 ]; then
            echo "Checkout route-matrix sample probe did not promote; sampler artifact will record the support-safe blocker."
          fi

      - name: Drive account-cart route-matrix sample
        env:
          ACCOUNT_CART_CONSISTENCY_OBSERVATION_JSON: ${{ vars.STAGING_ACCOUNT_CART_CONSISTENCY_OBSERVATION_JSON || '' }}
          ACCOUNT_CART_CONSISTENCY_EVIDENCE_REFERENCE: ${{ vars.STAGING_ACCOUNT_CART_CONSISTENCY_EVIDENCE_REFERENCE || '' }}
        run: |
          set -euo pipefail
          deploy_window_status="$(jq -r '.status // "unknown"' "${ROUTE_MATRIX_DEPLOY_WINDOW_OUT}" 2>/dev/null || echo unknown)"
          if [ "${deploy_window_status}" = "active" ]; then
            echo "::warning::Skipping account-cart route-matrix probe because a deploy window is active; evidence will report skipped coverage."
            exit 0
          fi
          if [ -z "${ACCOUNT_CART_CONSISTENCY_OBSERVATION_JSON:-}" ]; then
            echo "No account-cart route-matrix observation configured; sampler artifact will record the support-safe blocker."
            exit 0
          fi

          observation_file="${RUNNER_TEMP}/route-matrix-account-cart-observation.json"
          printf '%s\n' "${ACCOUNT_CART_CONSISTENCY_OBSERVATION_JSON}" > "${observation_file}"
          evidence_reference="${ACCOUNT_CART_CONSISTENCY_EVIDENCE_REFERENCE:-github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-route-matrix-account-cart}"

          set +e
          pnpm run ops account-cart:consistency-probe -- \
            --environment "${ROUTE_MATRIX_EVIDENCE_ENVIRONMENT}" \
            --release-commit "${release_commit:-}" \
            --evidence-reference "${evidence_reference}" \
            --observation-file "${observation_file}" \
            --out "${ROUTE_MATRIX_ACCOUNT_CART_PROBE_OUT}"
          account_cart_exit=$?
          set -e
          rm -f "${observation_file}"
          if [ "$account_cart_exit" -ne 0 ]; then
            echo "Account-cart route-matrix sample probe did not promote; sampler artifact will record the support-safe blocker."
          fi

      - name: Generate route-matrix sampler artifact
        run: |
          set -euo pipefail
          pnpm run ops read-consistency:route-matrix-sampler -- \
            --environment "${ROUTE_MATRIX_EVIDENCE_ENVIRONMENT}" \
            --checkout-probe-file "${ROUTE_MATRIX_CHECKOUT_PROBE_OUT}" \
            --account-cart-probe-file "${ROUTE_MATRIX_ACCOUNT_CART_PROBE_OUT}" \
            --deploy-window-file "${ROUTE_MATRIX_DEPLOY_WINDOW_OUT}" \
            --out "${READ_CONSISTENCY_ROUTE_MATRIX_SAMPLER_OUT}"

      - name: Generate route-matrix evidence
        run: |
          set -euo pipefail
          pnpm run ops read-consistency:route-matrix-evidence -- \
            --prometheus-url "${PROMETHEUS_URL}" \
            --prometheus-token "${PROMETHEUS_QUERY_TOKEN}" \
            --environment "${ROUTE_MATRIX_EVIDENCE_ENVIRONMENT}" \
            --window "${ROUTE_MATRIX_EVIDENCE_WINDOW}" \
            --sampler-file "${READ_CONSISTENCY_ROUTE_MATRIX_SAMPLER_OUT}" \
            --out "${READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT}"

      - name: Summarize route-matrix evidence
        if: always()
        run: |
          set -euo pipefail
          artifact="${READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT}"
          if [ ! -f "$artifact" ]; then
            config_failure="artifacts/wake-drills/route-matrix-config-failure.json"
            if [ -f "$config_failure" ]; then
              {
                echo "## Staging Route Matrix Evidence"
                echo
                jq -r '
                  "- checkedAt: " + (.checkedAt // "unknown"),
                  "- status: " + (.status // "unknown"),
                  "- missingConfiguration: " + ((.missingConfiguration // []) | join(", ")),
                  "- supportSafe: " + ((.supportSafe // false) | tostring),
                  "- nextAction: " + (.nextAction // "Configure staging observability and rerun.")
                ' "$config_failure"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Route-matrix evidence artifact was not written."
            exit 0
          fi
          {
            echo "## Staging Route Matrix Evidence"
            echo
            sampler="artifacts/wake-drills/read-consistency-route-matrix-sampler.json"
            if [ -f "$sampler" ]; then
              jq -r '
                "### Sampler",
                "",
                "- sampled: " + (.summary.sampledRouteCount | tostring) + "/" + (.summary.routeCount | tostring),
                "- blocked: " + (.summary.blockedRouteCount | tostring),
                "- failed: " + (.summary.failedRouteCount | tostring),
                "- skipped (deploy window): " + (.summary.skippedRouteCount | tostring),
                "",
                "| Route | Sampler status | Outcome | Blocker |",
                "| --- | --- | --- | --- |",
                (.routes[] | "| " + .routeTemplate + " | " + .status + " | " + .outcomeCategory + " | " + (.blockerCategory // "none") + " |"),
                ""
              ' "$sampler"
            fi
            jq -r '
              "- checkedAt: " + (.checkedAt // "unknown"),
              "- window: " + (.window // "unknown"),
              "- routes: " + ((.summary.passingRouteCount | tostring) + "/" + (.summary.routeCount | tostring) + " passing"),
              "- failing: " + ((.summary.failingRouteCount // "unknown") | tostring),
              "- skipped (deploy window): " + ((.summary.skippedRouteCount // "unknown") | tostring),
              "- blocked (coverage gap, not SLO signal): " + ((.summary.blockedRouteCount // "unknown") | tostring),
              "- coverage: " + (.summary.coverage // "unknown"),
              "",
              "| Route | Status | Samples | p95 | p99 | Target | Projection |",
              "| --- | --- | ---: | ---: | ---: | --- | --- |",
              (.routes[] | "| " + .routeTemplate + " | " + .wakeBeforeWait.status + " | " + (.wakeBeforeWait.sampleCount | tostring) + " | " + ((.wakeBeforeWait.p95Ms // "null") | tostring) + " | " + ((.wakeBeforeWait.p99Ms // "null") | tostring) + " | " + .wakeBeforeWait.targetContext + " | " + .wakeBeforeWait.projectionName + " |")
            ' "$artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Evaluate segment-level projection lag SLO regression gate
        if: always()
        run: |
          set -euo pipefail
          artifact="${READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT}"
          if [ ! -f "$artifact" ]; then
            echo "Route-matrix evidence artifact was not written; skipping the segment-level projection lag SLO regression gate (see the config-failure summary above)."
            exit 0
          fi
          gate_out=artifacts/wake-drills/release-health-segment-slo-gate.md
          # Aggregates every support-safe freshness artifact this run wrote to
          # artifacts/wake-drills/ (route-matrix routes, the checkout Buy Now
          # probe, and the account-cart probe) into one segment-level
          # projection lag SLO posture and fails closed on a real regression.
          # Documented coverage gaps (blocked/skipped routes, unconfigured
          # probes) do not fail the gate on their own.
          set +e
          pnpm run ops release-health:report -- \
            --dir artifacts/wake-drills \
            --gate \
            --out "$gate_out"
          gate_exit=$?
          set -e
          if [ -f "$gate_out" ]; then
            {
              echo "## Segment-Level Projection Lag SLO Regression Gate"
              echo
              cat "$gate_out"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$gate_exit" -ne 0 ]; then
            echo "Segment-level projection lag SLO regression gate failed; see the report above for the failing surface(s)." >&2
            exit 1
          fi

      - name: Upload route-matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-route-matrix-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/wake-drills/*.json
            artifacts/wake-drills/*.md
          if-no-files-found: error
          retention-days: 30
