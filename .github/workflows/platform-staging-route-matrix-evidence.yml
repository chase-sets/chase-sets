name: Platform Staging Route Matrix Evidence

# Generates support-safe read-consistency route-matrix evidence for #2511/#2512.
# The workflow queries staging Prometheus with an environment-scoped query token
# and uploads only the redacted route-matrix artifact.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "generate staging route matrix evidence" to confirm querying staging observability.
        required: true
        type: string
      release_ref:
        description: Ref containing the evidence tooling. Defaults to main.
        required: false
        default: main
        type: string
      prometheus_url:
        description: Staging Prometheus base URL.
        required: false
        default: https://prometheus.staging.chasesets.com
        type: string
      window:
        description: Prometheus range window such as 30m, 2h, or 1d.
        required: false
        default: 30m
        type: string

permissions:
  contents: read

concurrency:
  group: platform-staging-route-matrix-evidence
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    name: Refuse Unconfirmed Route Matrix Evidence
    runs-on: ubuntu-latest
    if: inputs.confirm != 'generate staging route matrix evidence'
    steps:
      - name: Refuse unconfirmed route-matrix evidence
        run: |
          echo 'Confirmation text did not match exactly; expected "generate staging route matrix evidence".' >&2
          exit 1

  staging-route-matrix-evidence:
    name: Staging Route Matrix Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped'
    env:
      PROMETHEUS_URL: ${{ inputs.prometheus_url }}
      PROMETHEUS_QUERY_TOKEN: ${{ secrets.PROMETHEUS_QUERY_TOKEN || '' }}
      ROUTE_MATRIX_EVIDENCE_WINDOW: ${{ inputs.window }}
      ROUTE_MATRIX_EVIDENCE_ENVIRONMENT: staging
      READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT: artifacts/wake-drills/read-consistency-route-matrix-evidence.json
    steps:
      - name: Confirm staging route-matrix evidence
        run: |
          set -euo pipefail
          echo "Staging route-matrix evidence confirmed for window '${ROUTE_MATRIX_EVIDENCE_WINDOW}'."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --release-ref "${{ inputs.release_ref }}" \
            --checkout true

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Validate Prometheus query configuration
        run: |
          set -euo pipefail
          mkdir -p artifacts/wake-drills
          missing=()
          if [ -z "${PROMETHEUS_URL:-}" ]; then
            missing+=("PROMETHEUS_URL")
          fi
          if [ -z "${PROMETHEUS_QUERY_TOKEN:-}" ]; then
            missing+=("PROMETHEUS_QUERY_TOKEN")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            CONFIG_FAILURE_OUT="artifacts/wake-drills/route-matrix-config-failure.json" \
            ROUTE_MATRIX_MISSING_CONFIG="$(IFS=,; echo "${missing[*]}")" \
            node <<'NODE'
            const fs = require("node:fs");
            const missing = (process.env.ROUTE_MATRIX_MISSING_CONFIG || "")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const report = {
              schemaVersion: "read-consistency-route-matrix-config-failure/v1",
              environment: process.env.ROUTE_MATRIX_EVIDENCE_ENVIRONMENT || "staging",
              checkedAt: new Date().toISOString(),
              window: process.env.ROUTE_MATRIX_EVIDENCE_WINDOW || "unknown",
              status: "configuration-error",
              missingConfiguration: missing,
              prometheusUrlConfigured: Boolean(process.env.PROMETHEUS_URL),
              prometheusQueryTokenConfigured: Boolean(process.env.PROMETHEUS_QUERY_TOKEN),
              supportSafe: true,
              redaction: {
                secrets: "not-written",
                prometheusUrl: "not-written",
                rawQueries: "not-written",
              },
              nextAction:
                "Configure the missing staging GitHub Environment value(s), then rerun Platform Staging Route Matrix Evidence.",
            };
            fs.writeFileSync(process.env.CONFIG_FAILURE_OUT, `${JSON.stringify(report, null, 2)}\n`);
          NODE
            printf 'Missing required staging route-matrix evidence configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Generate route-matrix evidence
        run: |
          set -euo pipefail
          pnpm run ops read-consistency:route-matrix-evidence -- \
            --prometheus-url "${PROMETHEUS_URL}" \
            --prometheus-token "${PROMETHEUS_QUERY_TOKEN}" \
            --environment "${ROUTE_MATRIX_EVIDENCE_ENVIRONMENT}" \
            --window "${ROUTE_MATRIX_EVIDENCE_WINDOW}" \
            --out "${READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT}"

      - name: Summarize route-matrix evidence
        if: always()
        run: |
          set -euo pipefail
          artifact="${READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT}"
          if [ ! -f "$artifact" ]; then
            config_failure="artifacts/wake-drills/route-matrix-config-failure.json"
            if [ -f "$config_failure" ]; then
              {
                echo "## Staging Route Matrix Evidence"
                echo
                jq -r '
                  "- checkedAt: " + (.checkedAt // "unknown"),
                  "- status: " + (.status // "unknown"),
                  "- missingConfiguration: " + ((.missingConfiguration // []) | join(", ")),
                  "- supportSafe: " + ((.supportSafe // false) | tostring),
                  "- nextAction: " + (.nextAction // "Configure staging observability and rerun.")
                ' "$config_failure"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Route-matrix evidence artifact was not written."
            exit 0
          fi
          {
            echo "## Staging Route Matrix Evidence"
            echo
            jq -r '
              "- checkedAt: " + (.checkedAt // "unknown"),
              "- window: " + (.window // "unknown"),
              "- routes: " + ((.summary.passingRouteCount | tostring) + "/" + (.summary.routeCount | tostring) + " passing"),
              "",
              "| Route | Status | Samples | p95 | p99 | Target | Projection |",
              "| --- | --- | ---: | ---: | ---: | --- | --- |",
              (.routes[] | "| " + .routeTemplate + " | " + .wakeBeforeWait.status + " | " + (.wakeBeforeWait.sampleCount | tostring) + " | " + ((.wakeBeforeWait.p95Ms // "null") | tostring) + " | " + ((.wakeBeforeWait.p99Ms // "null") | tostring) + " | " + .wakeBeforeWait.targetContext + " | " + .wakeBeforeWait.projectionName + " |")
            ' "$artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload route-matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-route-matrix-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wake-drills/*.json
          if-no-files-found: error
          retention-days: 30
