name: Platform Staging Route Matrix Evidence

# Generates support-safe read-consistency route-matrix evidence for #2511/#2512.
# The workflow queries staging Prometheus with an environment-scoped query token
# and uploads only the redacted route-matrix artifact.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "generate staging route matrix evidence" to confirm querying staging observability.
        required: true
        type: string
      release_ref:
        description: Ref containing the evidence tooling. Defaults to main.
        required: false
        default: main
        type: string
      prometheus_url:
        description: Staging Prometheus base URL.
        required: false
        default: https://prometheus.staging.chasesets.com
        type: string
      window:
        description: Prometheus range window such as 30m, 2h, or 1d.
        required: false
        default: 30m
        type: string

permissions:
  contents: read

concurrency:
  group: platform-staging-route-matrix-evidence
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    name: Refuse Unconfirmed Route Matrix Evidence
    runs-on: ubuntu-latest
    if: inputs.confirm != 'generate staging route matrix evidence'
    steps:
      - name: Refuse unconfirmed route-matrix evidence
        run: |
          echo 'Confirmation text did not match exactly; expected "generate staging route matrix evidence".' >&2
          exit 1

  staging-route-matrix-evidence:
    name: Staging Route Matrix Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped'
    env:
      PROMETHEUS_URL: ${{ inputs.prometheus_url }}
      PROMETHEUS_QUERY_TOKEN: ${{ secrets.PROMETHEUS_QUERY_TOKEN || '' }}
      ROUTE_MATRIX_EVIDENCE_WINDOW: ${{ inputs.window }}
      ROUTE_MATRIX_EVIDENCE_ENVIRONMENT: staging
      READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT: artifacts/wake-drills/read-consistency-route-matrix-evidence.json
      READ_CONSISTENCY_ROUTE_MATRIX_SAMPLER_OUT: artifacts/wake-drills/read-consistency-route-matrix-sampler.json
      ROUTE_MATRIX_CHECKOUT_PROBE_OUT: artifacts/wake-drills/route-matrix-checkout-probe.json
    steps:
      - name: Confirm staging route-matrix evidence
        run: |
          set -euo pipefail
          echo "Staging route-matrix evidence confirmed for window '${ROUTE_MATRIX_EVIDENCE_WINDOW}'."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --release-ref "${{ inputs.release_ref }}" \
            --checkout true

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Install Playwright Chromium for route-matrix sampler
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Prometheus query configuration
        run: |
          set -euo pipefail
          mkdir -p artifacts/wake-drills
          missing=()
          if [ -z "${PROMETHEUS_URL:-}" ]; then
            missing+=("PROMETHEUS_URL")
          fi
          if [ -z "${PROMETHEUS_QUERY_TOKEN:-}" ]; then
            missing+=("PROMETHEUS_QUERY_TOKEN")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            CONFIG_FAILURE_OUT="artifacts/wake-drills/route-matrix-config-failure.json" \
            ROUTE_MATRIX_MISSING_CONFIG="$(IFS=,; echo "${missing[*]}")" \
            node <<'NODE'
            const fs = require("node:fs");
            const missing = (process.env.ROUTE_MATRIX_MISSING_CONFIG || "")
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const report = {
              schemaVersion: "read-consistency-route-matrix-config-failure/v1",
              environment: process.env.ROUTE_MATRIX_EVIDENCE_ENVIRONMENT || "staging",
              checkedAt: new Date().toISOString(),
              window: process.env.ROUTE_MATRIX_EVIDENCE_WINDOW || "unknown",
              status: "configuration-error",
              missingConfiguration: missing,
              prometheusUrlConfigured: Boolean(process.env.PROMETHEUS_URL),
              prometheusQueryTokenConfigured: Boolean(process.env.PROMETHEUS_QUERY_TOKEN),
              supportSafe: true,
              redaction: {
                secrets: "not-written",
                prometheusUrl: "not-written",
                rawQueries: "not-written",
              },
              nextAction:
                "Configure the missing staging GitHub Environment value(s), then rerun Platform Staging Route Matrix Evidence.",
            };
            fs.writeFileSync(process.env.CONFIG_FAILURE_OUT, `${JSON.stringify(report, null, 2)}\n`);
          NODE
            printf 'Missing required staging route-matrix evidence configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Drive checkout route-matrix sample
        env:
          GUEST_BUY_NOW_PROBE_ITEM_PATH: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ITEM_PATH || '' }}
          GUEST_BUY_NOW_PROBE_SEARCH_QUERY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_SEARCH_QUERY || 'air balloon' }}
          GUEST_BUY_NOW_PROBE_FIXTURE_KEY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_FIXTURE_KEY || 'staging-guest-buy-now-fixture' }}
          GUEST_BUY_NOW_PROBE_TIMEOUT_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_TIMEOUT_MS || '45000' }}
          GUEST_BUY_NOW_PROBE_READY_SLO_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_READY_SLO_MS || '10000' }}
          GUEST_BUY_NOW_PROBE_ATTEMPTS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ATTEMPTS || '3' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_BUDGET_MS || '120000' }}
          GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS: ${{ vars.STAGING_GUEST_BUY_NOW_WAKE_RUNTIME_READY_POLL_INTERVAL_MS || '5000' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
        run: |
          set -euo pipefail
          checkout_args=(
            --environment staging
            --base-url "https://marketplace.staging.chasesets.com"
            --admin-base-url "https://admin.staging.chasesets.com"
            --search-query "${GUEST_BUY_NOW_PROBE_SEARCH_QUERY}"
            --fixture-key "${GUEST_BUY_NOW_PROBE_FIXTURE_KEY}"
            --timeout-ms "${GUEST_BUY_NOW_PROBE_TIMEOUT_MS}"
            --ready-slo-ms "${GUEST_BUY_NOW_PROBE_READY_SLO_MS}"
            --attempts "${GUEST_BUY_NOW_PROBE_ATTEMPTS}"
            --wake-runtime-ready-budget-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_BUDGET_MS}"
            --wake-runtime-ready-poll-interval-ms "${GUEST_BUY_NOW_PROBE_WAKE_RUNTIME_READY_POLL_INTERVAL_MS}"
          )
          if [ -n "${GUEST_BUY_NOW_PROBE_ITEM_PATH}" ]; then
            checkout_args+=(--item-path "${GUEST_BUY_NOW_PROBE_ITEM_PATH}")
          fi

          set +e
          pnpm run guest-buy-now:freshness-probe -- \
            "${checkout_args[@]}" \
            --flow guest \
            --guest-email "route-matrix-probe+${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@chasesets.test" \
            --diagnostic-correlation-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-route-matrix-checkout" \
            --out "${ROUTE_MATRIX_CHECKOUT_PROBE_OUT}"
          checkout_exit=$?
          set -e
          if [ "$checkout_exit" -ne 0 ]; then
            echo "Checkout route-matrix sample probe did not promote; sampler artifact will record the support-safe blocker."
          fi

      - name: Generate route-matrix sampler artifact
        run: |
          set -euo pipefail
          pnpm run ops read-consistency:route-matrix-sampler -- \
            --environment "${ROUTE_MATRIX_EVIDENCE_ENVIRONMENT}" \
            --checkout-probe-file "${ROUTE_MATRIX_CHECKOUT_PROBE_OUT}" \
            --out "${READ_CONSISTENCY_ROUTE_MATRIX_SAMPLER_OUT}"

      - name: Generate route-matrix evidence
        run: |
          set -euo pipefail
          pnpm run ops read-consistency:route-matrix-evidence -- \
            --prometheus-url "${PROMETHEUS_URL}" \
            --prometheus-token "${PROMETHEUS_QUERY_TOKEN}" \
            --environment "${ROUTE_MATRIX_EVIDENCE_ENVIRONMENT}" \
            --window "${ROUTE_MATRIX_EVIDENCE_WINDOW}" \
            --out "${READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT}"

      - name: Summarize route-matrix evidence
        if: always()
        run: |
          set -euo pipefail
          artifact="${READ_CONSISTENCY_ROUTE_MATRIX_EVIDENCE_OUT}"
          if [ ! -f "$artifact" ]; then
            config_failure="artifacts/wake-drills/route-matrix-config-failure.json"
            if [ -f "$config_failure" ]; then
              {
                echo "## Staging Route Matrix Evidence"
                echo
                jq -r '
                  "- checkedAt: " + (.checkedAt // "unknown"),
                  "- status: " + (.status // "unknown"),
                  "- missingConfiguration: " + ((.missingConfiguration // []) | join(", ")),
                  "- supportSafe: " + ((.supportSafe // false) | tostring),
                  "- nextAction: " + (.nextAction // "Configure staging observability and rerun.")
                ' "$config_failure"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Route-matrix evidence artifact was not written."
            exit 0
          fi
          {
            echo "## Staging Route Matrix Evidence"
            echo
            sampler="artifacts/wake-drills/read-consistency-route-matrix-sampler.json"
            if [ -f "$sampler" ]; then
              jq -r '
                "### Sampler",
                "",
                "- sampled: " + (.summary.sampledRouteCount | tostring) + "/" + (.summary.routeCount | tostring),
                "- blocked: " + (.summary.blockedRouteCount | tostring),
                "- failed: " + (.summary.failedRouteCount | tostring),
                "",
                "| Route | Sampler status | Outcome | Blocker |",
                "| --- | --- | --- | --- |",
                (.routes[] | "| " + .routeTemplate + " | " + .status + " | " + .outcomeCategory + " | " + (.blockerCategory // "none") + " |"),
                ""
              ' "$sampler"
            fi
            jq -r '
              "- checkedAt: " + (.checkedAt // "unknown"),
              "- window: " + (.window // "unknown"),
              "- routes: " + ((.summary.passingRouteCount | tostring) + "/" + (.summary.routeCount | tostring) + " passing"),
              "",
              "| Route | Status | Samples | p95 | p99 | Target | Projection |",
              "| --- | --- | ---: | ---: | ---: | --- | --- |",
              (.routes[] | "| " + .routeTemplate + " | " + .wakeBeforeWait.status + " | " + (.wakeBeforeWait.sampleCount | tostring) + " | " + ((.wakeBeforeWait.p95Ms // "null") | tostring) + " | " + ((.wakeBeforeWait.p99Ms // "null") | tostring) + " | " + .wakeBeforeWait.targetContext + " | " + .wakeBeforeWait.projectionName + " |")
            ' "$artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload route-matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-route-matrix-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wake-drills/*.json
          if-no-files-found: error
          retention-days: 30
