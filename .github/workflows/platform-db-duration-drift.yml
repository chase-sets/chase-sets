name: Platform DB Duration Drift

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: platform-db-duration-drift
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup-pnpm-workspace
      - name: Collect and reconcile DB duration drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run ops -- release-health:db-duration-drift --publish-issues --out artifacts/release-health/db-duration-drift.json
      - name: Upload DB duration state and cohort
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-db-duration-drift
          path: artifacts/release-health/db-duration-drift.json
          if-no-files-found: error

  reporter:
    name: Report DB Duration Drift Failure
    needs: digest
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Report workflow failure
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform DB Duration Drift
          alert-status: failure
          alert-summary: DB duration drift collection or publication failed. See this run's jobs and artifacts.
