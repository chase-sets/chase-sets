name: Platform Staging Projection Operations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "run staging projection operations" to confirm staging projection triage or repair.
        required: true
        type: string
      mode:
        description: Projection operation mode.
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - retry-blocked
          - rebuild
      targets:
        description: Comma-separated projection keys for retry-blocked, or context/projection groups for rebuild.
        required: false
        default: ""
        type: string
      operator_reference:
        description: Incident, issue, milestone, or operator reference for this projection operation.
        required: true
        type: string
      release_ref:
        description: Ref containing the projection operation tooling. Defaults to main.
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: platform-staging-projection-operations
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    name: Refuse Unconfirmed Projection Operations
    runs-on: ubuntu-latest
    if: inputs.confirm != 'run staging projection operations'
    steps:
      - name: Refuse unconfirmed projection operations
        run: |
          echo 'Confirmation text did not match exactly; expected "run staging projection operations".' >&2
          exit 1

  staging-projection-operations:
    name: Staging Projection Operations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped'
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      DEPLOYMENT_ENVIRONMENT: staging
      STAGING_PROJECTION_OPERATIONS_OUT_DIR: artifacts/staging-projection-operations
      STAGING_PROJECTION_OPERATIONS_OPERATOR_REFERENCE: ${{ inputs.operator_reference }}
    steps:
      - name: Confirm staging projection operations
        run: |
          set -euo pipefail
          echo "Staging projection operations '${{ inputs.mode }}' confirmed."
          echo "Operator reference: ${STAGING_PROJECTION_OPERATIONS_OPERATOR_REFERENCE}"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --release-ref "${{ inputs.release_ref }}" \
            --checkout true

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Resolve staging admin domain
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          admin_domain="$(terraform output -raw admin_domain)"
          if [ -z "$admin_domain" ]; then
            echo "Staging admin domain was not present in Terraform outputs." >&2
            exit 1
          fi
          echo "STAGING_PROJECTION_OPERATIONS_ADMIN_URL=https://${admin_domain}" >> "$GITHUB_ENV"

      - name: Run staging projection operations
        env:
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          STAGING_PROJECTION_OPERATIONS_MODE: ${{ inputs.mode }}
          STAGING_PROJECTION_OPERATIONS_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          node ./scripts/staging-projection-operations.mjs \
            --mode "$STAGING_PROJECTION_OPERATIONS_MODE" \
            --targets "$STAGING_PROJECTION_OPERATIONS_TARGETS" \
            --operator-reference "$STAGING_PROJECTION_OPERATIONS_OPERATOR_REFERENCE" \
            --out-dir "$STAGING_PROJECTION_OPERATIONS_OUT_DIR"

      - name: Summarize staging projection operations
        if: always()
        run: |
          set -euo pipefail
          record="${STAGING_PROJECTION_OPERATIONS_OUT_DIR}/staging-projection-operations.json"
          {
            echo "## Staging Projection Operations"
            echo
            echo "- Operator reference: ${STAGING_PROJECTION_OPERATIONS_OPERATOR_REFERENCE}"
            echo "- Mode: ${{ inputs.mode }}"
            echo "- Targets: ${{ inputs.targets || 'none' }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f "$record" ]; then
            echo "- Result: operation record missing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '
            "- Result: " + (.result // "unknown"),
            "- Support-safe artifacts: " + ((.supportSafe // false) | tostring),
            "- Before degraded/error groups: " + ((.beforeSnapshot.degradedOrErrorGroups // 0) | tostring),
            "- After degraded/error groups: " + ((.afterSnapshot.degradedOrErrorGroups // 0) | tostring),
            "- After blocked streams: " + ((.afterSnapshot.blockedStreamCount // 0) | tostring),
            "- Attention status: " + (.report.status // "unknown")
          ' "$record" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging projection operations evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-staging-projection-operations-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/staging-projection-operations
          if-no-files-found: error
          retention-days: 30
