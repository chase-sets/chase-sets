name: Hosted AC4 AC5 Probe (never merge)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  account-appeal-hosted-proof:
    name: AC4 AC5 hosted proof (never merge)
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'codex/10692-hosted-proof-g1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CHASE_SETS_LANE_MODE: "1"
      PROBE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PROBE_HEAD_SHA: 4ca07dc05c9fe0e4d87803bb24a52ea23598187f
      PROBE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PROBE_GITHUB_SHA: ${{ github.sha }}
      PROBE_RUN_ID: ${{ github.run_id }}
      PROBE_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check out exact repair head
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PROBE_HEAD_SHA"
          checked_out_head="$(git rev-parse HEAD)"
          if [ "$checked_out_head" != "$PROBE_HEAD_SHA" ]; then
            echo "::error::checked-out HEAD $checked_out_head differs from required repair head $PROBE_HEAD_SHA"
            exit 1
          fi
          echo "checked_out_head=$checked_out_head"

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Run AC4 and AC5 hosted probe
        shell: bash
        run: |
          set -u -o pipefail

          log_dir="$RUNNER_TEMP/10692-hosted-proof-g3"
          mkdir -p "$log_dir"
          exec > >(tee "$log_dir/probe-console.log") 2>&1

          focused_test='features/account-appeals/tests/account-appeal-aggregate.db.test.ts'
          focused_title='runtime commands use the typed reader, expected versions, and terminal idempotency'
          focused_args=(
            --filter @chase-sets/platform-operations exec vitest run
            --config ./tests/vitest.config.mjs
            "$focused_test"
            -t "$focused_title"
            --maxWorkers=1
            --no-file-parallelism
          )

          echo "pr_head=$PROBE_PR_HEAD_SHA"
          echo "head=$PROBE_HEAD_SHA"
          echo "base=$PROBE_BASE_SHA"
          echo "merge_ref=$PROBE_GITHUB_SHA"
          git status --short
          git diff --exit-code

          run_focused() {
            local output="$1"
            local budget_seconds="$2"
            set +e
            timeout --foreground "${budget_seconds}s" pnpm "${focused_args[@]}" >"$output" 2>&1
            local status=$?
            set -e
            printf '%s\n' "$status"
            return 0
          }

          extract_assertion() {
            local input="$1"
            local output="$2"
            grep -E -m 8 'AssertionError|expected|❯|FAIL|toHaveLength|toMatchObject|toBe' "$input" >"$output" || true
            if [ ! -s "$output" ]; then
              printf '%s\n' 'NO_ASSERTION_LINE_FOUND' >"$output"
            fi
          }

          overall=0
          repeat_status="$log_dir/repeat-status.tsv"
          : >"$repeat_status"
          repeat_count=0
          repeat_started="$(date +%s)"
          repeat_deadline=$((repeat_started + 600))
          repeat_stop_reason='twenty_green'
          for attempt in $(seq 1 20); do
            now="$(date +%s)"
            remaining=$((repeat_deadline - now))
            if [ "$remaining" -le 0 ]; then
              repeat_stop_reason='maximum_completed_in_600_seconds'
              break
            fi
            attempt_log="$log_dir/repeat-$(printf '%02d' "$attempt").log"
            status="$(run_focused "$attempt_log" "$remaining")"
            repeat_count=$((repeat_count + 1))
            printf '%s\t%s\t%s\n' "$attempt" "$status" "$(basename "$attempt_log")" >>"$repeat_status"
            echo "repeat attempt=$attempt exit=$status log=$(basename "$attempt_log")"
            if [ "$status" -ne 0 ]; then
              repeat_stop_reason="first_red_attempt_$attempt"
              overall=1
              break
            fi
          done

          hash_head_blob() {
            git show "HEAD:$1" | sha256sum | awk '{print $1}'
          }

          write_mutant_patch() {
            local mutant="$1"
            local patch="$log_dir/mutant-$mutant.patch"
            case "$mutant" in
              guard)
                cat >"$patch" <<'PATCH'
          diff --git a/infrastructure/event-core-postgres/event-store.ts b/infrastructure/event-core-postgres/event-store.ts
          index 2a6c72cf90..ed805d5401 100644
          --- a/infrastructure/event-core-postgres/event-store.ts
          +++ b/infrastructure/event-core-postgres/event-store.ts
          @@ -1294,11 +1294,7 @@ function assertExpectedVersion(streamId: string, expectedVersion: ExpectedStream
                return;
              }

          -    throw createEventStoreError("concurrency_conflict", "Expected no stream but stream already exists.", {
          -      streamId,
          -      expectedVersion,
          -      currentVersion,
          -    });
          +    return; // probe mutant: expected-version/no-stream guard removed
            }

            if (expectedVersion !== currentVersion) {
          PATCH
                ;;
              stream_id)
                cat >"$patch" <<'PATCH'
          diff --git a/bounded-contexts/platform-operations/features/account-appeals/api/runtime.ts b/bounded-contexts/platform-operations/features/account-appeals/api/runtime.ts
          index d901c6b42c..e8b3f1e732 100644
          --- a/bounded-contexts/platform-operations/features/account-appeals/api/runtime.ts
          +++ b/bounded-contexts/platform-operations/features/account-appeals/api/runtime.ts
          @@ -99,7 +99,7 @@ export function createAccountAppealRuntime(db: PgQueryable, eventStore: EventSto
                assertAccountAppealFileCapability(capability);
                assertSellerContext(capability, context);
                return handler.commandHandler({
          -        streamId: appealStreamId(action.appealableActionId),
          +        streamId: `${appealStreamId(action.appealableActionId)}-probe-mutant`,
                expectedVersion: "no_stream",
                command: fileAccountAppeal(capability, action, input),
                context,
          PATCH
                ;;
              unscoped_query)
                cat >"$patch" <<'PATCH'
          diff --git a/bounded-contexts/platform-operations/features/account-appeals/tests/account-appeal-aggregate.db.test.ts b/bounded-contexts/platform-operations/features/account-appeals/tests/account-appeal-aggregate.db.test.ts
          index 3a5f876219..1abe59ce51 100644
          --- a/bounded-contexts/platform-operations/features/account-appeals/tests/account-appeal-aggregate.db.test.ts
          +++ b/bounded-contexts/platform-operations/features/account-appeals/tests/account-appeal-aggregate.db.test.ts
          @@ -1137,9 +1137,8 @@ describeDb("account appeal aggregate DB proof", () => {
                 }>(
                   `SELECT stream_version, event_type
                      FROM event_store_events
          -            WHERE stream_id = $1
                     ORDER BY stream_version ASC`,
          -          [streamId],
          +          [],
                 );
                 expect(
                   race.filter((entry) => entry.status === "fulfilled"),
          PATCH
                ;;
              *)
                echo "::error::unknown mutant $mutant" >&2
                return 2
                ;;
            esac
            sha256sum "$patch" | tee "$log_dir/mutant-$mutant.patch.sha256"
          }

          apply_mutant() {
            local mutant="$1"
            local patch="$log_dir/mutant-$mutant.patch"
            write_mutant_patch "$mutant"
            if ! git apply --check --index "$patch"; then
              echo "::error::exact mutant patch did not apply: $mutant" >&2
              return 1
            fi
            if ! git apply --index "$patch"; then
              echo "::error::exact mutant patch apply failed: $mutant" >&2
              return 1
            fi
          }

          run_mutant() {
            local mutant="$1"
            local file="$2"
            local log="$log_dir/mutant-$mutant.log"
            local assertion="$log_dir/mutant-$mutant.assertion.txt"
            local diff="$log_dir/mutant-$mutant.diff"
            local head_hash
            head_hash="$(hash_head_blob "$file")"
            echo "mutant=$mutant file=$file head_blob_sha256=$head_hash"
            set +e
            apply_mutant "$mutant" >"$log_dir/mutant-$mutant-apply.log" 2>&1
            local apply_status=$?
            set -e
            git diff --no-ext-diff -- "$file" >"$diff" || true
            if [ "$apply_status" -eq 0 ]; then
              echo "mutation diff for $mutant:"
              cat "$diff"
              local status
              status="$(run_focused "$log" 600)"
              extract_assertion "$log" "$assertion"
              local assertion_line
              assertion_line="$(head -n 1 "$assertion")"
              local patch_hash
              patch_hash="$(awk '{print $1}' "$log_dir/mutant-$mutant.patch.sha256")"
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$mutant" "$file" "$status" "$head_hash" "$assertion_line" "$patch_hash" >>"$log_dir/mutant-results.tsv"
              echo "mutant=$mutant exit=$status assertion=$(head -n 1 "$assertion")"
              if [ "$status" -eq 0 ] || [ "$(head -n 1 "$assertion")" = 'NO_ASSERTION_LINE_FOUND' ]; then overall=1; fi
              if [ "$mutant" = 'unscoped_query' ] && ! grep -Eq 'account-appeal-aggregate\.db\.test\.ts:1157|toHaveLength|expected.*1' "$assertion"; then
                echo "::error::unscoped-query mutant did not record the rows-length assertion at :1157 or equivalent" >&2
                overall=1
              fi
            else
              echo "::error::mutant substitution did not apply: $mutant" >&2
              cat "$log_dir/mutant-$mutant-apply.log" >&2
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$mutant" "$file" "apply_$apply_status" "$head_hash" "$(head -n 1 "$log_dir/mutant-$mutant-apply.log")" "" >>"$log_dir/mutant-results.tsv"
              overall=1
            fi
            git restore --source=HEAD --staged --worktree -- "$file"
            local restored_hash
            restored_hash="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s\t%s\n' "$mutant" "$restored_hash" >>"$log_dir/restored-hashes.tsv"
            if [ "$restored_hash" != "$head_hash" ]; then
              echo "mutant=$mutant restored hash mismatch: $restored_hash != $head_hash"
              overall=1
            fi
          }

          : >"$log_dir/mutant-results.tsv"
          : >"$log_dir/restored-hashes.tsv"
          run_mutant guard infrastructure/event-core-postgres/event-store.ts
          run_mutant stream_id bounded-contexts/platform-operations/features/account-appeals/api/runtime.ts
          run_mutant unscoped_query bounded-contexts/platform-operations/features/account-appeals/tests/account-appeal-aggregate.db.test.ts

          control_log="$log_dir/restored-control.log"
          control_status="$(run_focused "$control_log" 600)"
          echo "restored control exit=$control_status"
          if [ "$control_status" -ne 0 ]; then overall=1; fi
          if ! git diff --exit-code; then
            echo 'workspace is not restored to HEAD'
            overall=1
          fi
          git status --short >"$log_dir/final-status.txt"

          (
            cd "$log_dir"
            find . -maxdepth 1 -type f ! -name manifest.sha256 ! -name receipt.json -printf '%f\0' |
              sort -z |
              xargs -0 -r sha256sum
          ) >"$log_dir/manifest.sha256"
          manifest_hash="$(sha256sum "$log_dir/manifest.sha256" | awk '{print $1}')"

          PROBE_LOG_DIR="$log_dir" \
          PROBE_MANIFEST_HASH="$manifest_hash" \
          PROBE_REPEAT_COUNT="$repeat_count" \
          PROBE_REPEAT_STOP_REASON="$repeat_stop_reason" \
          PROBE_CONTROL_STATUS="$control_status" \
          PROBE_OVERALL="$overall" \
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const dir = process.env.PROBE_LOG_DIR;
          const lines = (name) => {
            try { return readFileSync(`${dir}/${name}`, 'utf8').trim().split('\n').filter(Boolean); }
            catch { return []; }
          };
          const repeats = lines('repeat-status.tsv').map((line) => {
            const [attempt, exitStatus, log] = line.split('\t');
            return { attempt: Number(attempt), exit_status: Number(exitStatus), log };
          });
          const restored = new Map(lines('restored-hashes.tsv').map((line) => line.split('\t')));
          const mutants = lines('mutant-results.tsv').map((line) => {
            const [name, file, exitStatus, headBlobSha256, assertionLine, patchSha256] = line.split('\t');
            return {
              name,
              file,
              outcome: exitStatus === '0' ? 'green_unexpected' : 'red',
              exit_status: Number.isNaN(Number(exitStatus)) ? exitStatus : Number(exitStatus),
              assertion_line: assertionLine,
              mutation_diff: `mutant-${name}.diff`,
              mutation_patch: `mutant-${name}.patch`,
              mutation_patch_sha256: patchSha256 || null,
              head_blob_sha256: headBlobSha256,
              restored_byte_sha256: restored.get(name) ?? null,
            };
          });
          const receipt = {
            schema_version: 1,
            issue: 10692,
            head: process.env.PROBE_HEAD_SHA,
            base: process.env.PROBE_BASE_SHA,
            merge_ref_github_sha: process.env.PROBE_GITHUB_SHA,
            run_id: Number(process.env.PROBE_RUN_ID),
            run_attempt: Number(process.env.PROBE_RUN_ATTEMPT),
            job_id: 'account-appeal-hosted-proof',
            repeat_count: Number(process.env.PROBE_REPEAT_COUNT),
            repeat_stop_reason: process.env.PROBE_REPEAT_STOP_REASON,
            repeat_results: repeats,
            mutants,
            restored_control: { exit_status: Number(process.env.PROBE_CONTROL_STATUS), log: 'restored-control.log' },
            manifest_sha256: process.env.PROBE_MANIFEST_HASH,
            manifest_scope: 'all probe files except receipt.json and manifest.sha256',
            final: process.env.PROBE_OVERALL === '0' ? 'AC4_AC5_PASS' : 'AC4_AC5_FAIL',
          };
          writeFileSync(`${dir}/receipt.json`, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

          echo "receipt=$log_dir/receipt.json"
          cat "$log_dir/receipt.json"
          exit "$overall"

      - name: Upload AC4 AC5 probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 10692-hosted-proof-g3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/10692-hosted-proof-g3
          if-no-files-found: error
          retention-days: 14
