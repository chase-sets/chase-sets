name: Platform Preview Cleanup

on:
  pull_request_target:
    types:
      - closed
  schedule:
    - cron: "17 10 * * *" # Daily full preview/verification sweep.
    # Merge-gate stale sweep every 3 hours: gate namespaces carry a 2-hour
    # cleanup deadline, so worst-case orphan age stays under the 6-hour gate
    # orphan SLO (#5838). The daily-only jobs below key off the exact cron
    # string and keep their original once-a-day cadence.
    - cron: "47 */3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Preview pull request number to destroy
        required: true
        type: number

permissions:
  contents: read

jobs:
  discover-preview-cleanup:
    name: Discover Preview Cleanup
    # Scheduled runs: daily cron only. The 3-hourly cron exists for the
    # merge-gate stale sweep and must not multiply the full DO sweep.
    if: github.event_name != 'schedule' || github.event.schedule == '17 10 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      target_count: ${{ steps.targets.outputs.target_count }}
      result: ${{ steps.targets.outputs.result }}
    permissions:
      contents: read
      pull-requests: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        # pull_request_target has repo secrets. Preview cleanup discovery never checks
        # out PR head code; it runs from the trusted base workflow.

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: github.event_name == 'schedule'
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The straggler sweep (schedule runs) must reconcile live chase-sets-pr-*
      # namespaces in the staging DOKS cluster: the Kubernetes preview path
      # creates namespaces with Helm, never Terraform, so Terraform state,
      # database cluster, and DNS listings alone can never see a namespace
      # that outlived all three. This is best-effort (continue-on-error): if
      # kubeconfig setup fails, the sweep still runs on state/cluster/DNS
      # candidates and the script degrades the missing namespace listing to a
      # warning rather than failing the whole discovery run.
      - name: Configure staging Kubernetes context for preview sweep
        if: github.event_name == 'schedule'
        continue-on-error: true
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-preview-sweep.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure staging Kubernetes context for the preview sweep." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Staging Kubernetes kubeconfig is present but has no current context after Terraform and DigitalOcean refresh attempts." >&2
            KUBECONFIG="$kubeconfig" kubectl config get-contexts || true
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured staging Kubernetes context for preview sweep: ${current_context}"

      - name: Resolve cleanup targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_MERGED: ${{ github.event.pull_request.merged || false }}
          PULL_REQUEST_MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha || '' }}
          PULL_REQUEST_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number || '' }}
          CHECKOUT_REF: ${{ github.ref }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health

          if [ "${EVENT_NAME}" = "schedule" ]; then
            node ./scripts/digitalocean-preview-cleanup-sweep.mjs discover \
              --checkout-ref "${CHECKOUT_REF}" \
              --image-sha "${IMAGE_SHA}" \
              --out artifacts/release-health/platform-preview-cleanup-sweep.json \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const eventName = process.env.EVENT_NAME;
          const prNumber =
            eventName === "workflow_dispatch" ? process.env.DISPATCH_PR_NUMBER : process.env.PULL_REQUEST_NUMBER;
          if (!/^\d+$/.test(prNumber ?? "")) {
            throw new Error("Preview cleanup requires a pull request number.");
          }
          const checkoutRef =
            eventName === "workflow_dispatch"
              ? process.env.CHECKOUT_REF
              : process.env.PULL_REQUEST_MERGED === "true" && process.env.PULL_REQUEST_MERGE_COMMIT_SHA
                ? process.env.PULL_REQUEST_MERGE_COMMIT_SHA
                : process.env.PULL_REQUEST_BASE_REF;
          const imageSha = eventName === "workflow_dispatch" ? process.env.IMAGE_SHA : process.env.PULL_REQUEST_HEAD_SHA;
          const matrix = {
            include: [
              {
                pr_number: Number(prNumber),
                checkout_ref: checkoutRef,
                image_sha: imageSha,
                expected_database_cluster_name: `chase-sets-pr-${prNumber}-postgres`,
              },
            ],
          };
          console.log(`matrix=${JSON.stringify(matrix)}`);
          console.log("target_count=1");
          console.log("result=success");
          NODE

      - name: Summarize scheduled preview cleanup sweep
        if: ${{ always() && github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          record="artifacts/release-health/platform-preview-cleanup-sweep.json"
          if [ ! -f "$record" ]; then
            echo "No scheduled preview cleanup sweep record was written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node - "$record" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require("node:fs");
          const record = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("## Preview Cleanup Sweep");
          console.log("");
          console.log(`- Result: ${record.result}`);
          console.log(`- Candidate preview states: ${record.stateCandidates?.length ?? 0}`);
          console.log(`- Candidate preview database clusters: ${record.databaseClusterCandidates?.length ?? 0}`);
          console.log(`- Candidate preview namespaces: ${record.namespaceCandidates?.length ?? 0}`);
          console.log(`- Closed PR cleanup targets: ${record.targets?.length ?? 0}`);
          if (record.targets?.length) {
            console.log("");
            console.log("### Targets");
            for (const target of record.targets) {
              const stateKey = target.stateKey ?? "no Terraform state key";
              const clusters = (target.databaseClusters ?? []).map((cluster) => cluster.clusterName).join(", ");
              const clusterSummary = clusters ? `; database clusters: ${clusters}` : "";
              const namespaceSummary = target.namespace ? `; namespace: ${target.namespace}` : "";
              console.log(`- PR #${target.prNumber}: ${stateKey}${clusterSummary}${namespaceSummary}`);
            }
          }
          if (record.errors?.length) {
            console.log("");
            console.log("### Errors");
            for (const error of record.errors) {
              console.log(`- ${error}`);
            }
          }
          NODE

      - name: Upload scheduled preview cleanup sweep artifact
        if: ${{ always() && github.event_name == 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-preview-cleanup-sweep-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-health/platform-preview-cleanup-sweep.json
          if-no-files-found: ignore
          retention-days: 14

  discover-stale-verification:
    name: Discover Stale Verification Namespaces
    if: github.event_name == 'schedule' && github.event.schedule == '17 10 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      target_count: ${{ steps.targets.outputs.target_count }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure verification sweep Kubernetes context
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true
          kubeconfig="${RUNNER_TEMP}/chase-sets-verification-sweep.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"
          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS state exposes neither cluster_id nor cluster_name." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi
          KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Resolve stale verification namespaces
        id: targets
        env:
          VERIFICATION_NAMESPACE_MAX_AGE_HOURS: "24"
        run: |
          set -euo pipefail
          matrix="$(kubectl get namespaces -o json | node ./scripts/ephemeral-verification-namespace.mjs)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "target_count=$(node -e 'const value=JSON.parse(process.argv[1]); console.log(value.include.length)' "$matrix")" >> "$GITHUB_OUTPUT"

  destroy-preview:
    name: Destroy Preview
    needs: discover-preview-cleanup
    if: needs.discover-preview-cleanup.outputs.target_count != '0'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-preview-cleanup.outputs.matrix) }}
    concurrency:
      group: platform-preview-pr-${{ matrix.pr_number }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      TF_VAR_environment: preview
      TF_VAR_preview_identifier: pr-${{ matrix.pr_number }}
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: pr-${{ matrix.pr_number }}-${{ matrix.image_sha }}
      TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
      TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
      TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_webhook_secret: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET || secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_accounts_api: ${{ vars.STRIPE_CONNECT_ACCOUNTS_API || 'v2' }}
      TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
      TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
      TF_VAR_voyage_api_key: ${{ secrets.VOYAGE_API_KEY || '' }}
      TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
      TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        # pull_request_target has repo secrets. Closed PR cleanup never checks
        # out PR head code: merged PRs use the trusted merge commit, unmerged
        # PRs fall back to the base branch, and manual/scheduled runs use the selected ref.
        with:
          ref: ${{ matrix.checkout_ref }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # #4857 replaced per-preview DNS (the `pr-<n>.preview` apex +
      # `*.pr-<n>.preview` wildcard) with a single shared `*.preview.chasesets.com`
      # record, so no PR closing today creates new records here to delete. This
      # step stays a no-op-safe cleanup for any leftover per-preview record
      # created before that fix (created outside Terraform, so Terraform destroy
      # never removes it) until the backlog of such PRs is fully drained.
      - name: Delete preview DNS records
        if: always()
        run: |
          node scripts/digitalocean-preview-cleanup-sweep.mjs destroy-dns \
            --pr-number "${{ matrix.pr_number }}"

      # The Kubernetes preview path creates the preview's namespace with Helm
      # (`--create-namespace`), so Terraform never manages it and Terraform
      # destroy below never removes it. This is the #4778 root cause: every
      # cleanup run before this step destroyed only Terraform-managed DO
      # resources and reported success while the namespace, its workloads,
      # and its in-cluster Postgres persisted on the staging node forever.
      - name: Configure preview Kubernetes context
        if: always()
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-preview-cleanup.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure preview Kubernetes context for cleanup." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Preview cleanup Kubernetes kubeconfig is present but has no current context after Terraform and DigitalOcean refresh attempts." >&2
            KUBECONFIG="$kubeconfig" kubectl config get-contexts || true
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured preview Kubernetes context: ${current_context}"

      # Required step: helm-uninstalls the release (best effort) and then
      # unconditionally deletes the namespace, which removes every workload,
      # Secret, and the in-cluster Postgres PVC regardless of Helm tracking.
      # `teardown` verifies the namespace is actually gone afterward and
      # throws if it survives, so this step — and therefore the run — FAILS
      # rather than reporting green when the delete silently no-ops. Do not
      # add `|| true` or `continue-on-error` here: a leaked namespace must
      # fail the run (see scripts/platform-preview-cleanup-namespace-guard.test.mjs).
      - name: Delete preview Kubernetes namespace
        if: always()
        run: |
          set -euo pipefail
          pnpm run platform:kubernetes-deployment -- teardown \
            --namespace "chase-sets-pr-${{ matrix.pr_number }}" \
            --release "chase-sets-pr-${{ matrix.pr_number }}" \
            --timeout 5m

      - name: Terraform init
        working-directory: infrastructure/digitalocean/platform
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=platform/previews/pr-${{ matrix.pr_number }}.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Disable stateful destroy guard for approved preview cleanup
        run: node scripts/disable-terraform-prevent-destroy.mjs infrastructure/digitalocean/platform/main.tf

      - name: Import live preview database cluster into cleanup state
        run: |
          node scripts/digitalocean-preview-cleanup-sweep.mjs import-database \
            --pr-number "${{ matrix.pr_number }}" \
            --cluster-name "${{ matrix.expected_database_cluster_name }}" \
            --terraform-directory infrastructure/digitalocean/platform

      - name: Terraform destroy
        working-directory: infrastructure/digitalocean/platform
        run: terraform destroy -auto-approve

  destroy-stale-verification:
    name: Destroy Stale Verification Namespace
    needs: discover-stale-verification
    if: needs.discover-stale-verification.outputs.target_count != '0'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-stale-verification.outputs.matrix) }}
    concurrency:
      group: platform-${{ matrix.namespace }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      EASYPOST_API_KEY: ${{ secrets.EASYPOST_API_KEY }}
      STRIPE_API_BASE_URL: ${{ vars.STRIPE_API_BASE_URL || '' }}
      EASYPOST_API_BASE_URL: ${{ vars.EASYPOST_API_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure verification cleanup Kubernetes context
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true
          kubeconfig="${RUNNER_TEMP}/chase-sets-verification-cleanup.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"
          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS state exposes neither cluster_id nor cluster_name." >&2
              exit 1
            fi
          fi
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Delete stale verification provider webhooks
        env:
          PLATFORM_API_BASE_URL: https://${{ matrix.slug }}-marketplace.preview.chasesets.com
        run: node ./scripts/provider-webhook-lifecycle.mjs delete --base-url "$PLATFORM_API_BASE_URL"

      # Required: stale verification cleanup is a quota backstop. Surviving
      # namespaces fail the sweep; never make this best-effort.
      - name: Delete stale verification Kubernetes namespace
        if: always()
        run: pnpm run platform:kubernetes-deployment -- teardown --namespace "${{ matrix.namespace }}" --release "${{ matrix.release }}" --timeout 5m

  # Independent stale-resource backstop for merge-gate verification
  # namespaces (#5838). Selection is strict labels PLUS bounded naming
  # (chase-sets-gate-<run>-<attempt> carrying the merge-gate purpose label and
  # a past cleanup deadline); staging, production, previews, and unlabeled
  # gate-named namespaces are refused and reported, never deleted. Runs on
  # every schedule tick (3-hourly + daily) so worst-case orphan age stays
  # inside the 6-hour gate orphan SLO.
  discover-stale-gate:
    name: Discover Stale Gate Namespaces
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      target_count: ${{ steps.targets.outputs.target_count }}
      scanned: ${{ steps.targets.outputs.scanned }}
      refused: ${{ steps.targets.outputs.refused }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure gate sweep Kubernetes context
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true
          kubeconfig="${RUNNER_TEMP}/chase-sets-gate-sweep.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"
          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS state exposes neither cluster_id nor cluster_name." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi
          KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Resolve stale gate namespaces
        id: targets
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health
          matrix="$(kubectl get namespaces -o json | node ./scripts/ephemeral-verification-namespace.mjs --kind gate --report artifacts/release-health/merge-gate-stale-sweep.json)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "target_count=$(node -e 'const value=JSON.parse(process.argv[1]); console.log(value.include.length)' "$matrix")" >> "$GITHUB_OUTPUT"
          echo "scanned=$(node -e 'const value=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); console.log(value.scanned)' artifacts/release-health/merge-gate-stale-sweep.json)" >> "$GITHUB_OUTPUT"
          echo "refused=$(node -e 'const value=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); console.log(value.refused.length)' artifacts/release-health/merge-gate-stale-sweep.json)" >> "$GITHUB_OUTPUT"

      - name: Upload gate sweep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-gate-stale-sweep-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-health/merge-gate-stale-sweep.json
          if-no-files-found: ignore
          retention-days: 14

  destroy-stale-gate:
    name: Destroy Stale Gate Namespace
    needs: discover-stale-gate
    if: needs.discover-stale-gate.outputs.target_count != '0'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-stale-gate.outputs.matrix) }}
    concurrency:
      group: platform-${{ matrix.namespace }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      EASYPOST_API_KEY: ${{ secrets.EASYPOST_API_KEY }}
      STRIPE_API_BASE_URL: ${{ vars.STRIPE_API_BASE_URL || '' }}
      EASYPOST_API_BASE_URL: ${{ vars.EASYPOST_API_BASE_URL || '' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure gate cleanup Kubernetes context
        working-directory: infrastructure/digitalocean/doks
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true
          kubeconfig="${RUNNER_TEMP}/chase-sets-gate-cleanup.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"
          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS state exposes neither cluster_id nor cluster_name." >&2
              exit 1
            fi
          fi
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Delete stale gate provider webhooks
        env:
          PLATFORM_API_BASE_URL: https://${{ matrix.slug }}-marketplace.preview.chasesets.com
        run: node ./scripts/provider-webhook-lifecycle.mjs delete --base-url "$PLATFORM_API_BASE_URL"

      # Required: the gate sweep is the runner-loss backstop for the merge
      # gate's orphan SLO. Surviving namespaces fail the sweep; never make
      # this best-effort.
      - name: Delete stale gate Kubernetes namespace
        if: always()
        run: pnpm run platform:kubernetes-deployment -- teardown --namespace "${{ matrix.namespace }}" --release "${{ matrix.release }}" --timeout 5m

  report-stale-gate-sweep:
    name: Report Gate Sweep Totals
    needs: [discover-stale-gate, destroy-stale-gate]
    if: always() && github.event_name == 'schedule' && needs.discover-stale-gate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Summarize gate sweep totals
        env:
          GH_TOKEN: ${{ github.token }}
          SCANNED: ${{ needs.discover-stale-gate.outputs.scanned }}
          ELIGIBLE: ${{ needs.discover-stale-gate.outputs.target_count }}
          REFUSED: ${{ needs.discover-stale-gate.outputs.refused }}
          DISCOVERY_RESULT: ${{ needs.discover-stale-gate.result }}
        run: |
          set -euo pipefail
          deleted="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("Destroy Stale Gate Namespace")) | select(.conclusion == "success")] | length')"
          failed="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("Destroy Stale Gate Namespace")) | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")] | length')"
          {
            echo "## Merge-Gate Stale Sweep"
            echo ""
            echo "- Discovery: ${DISCOVERY_RESULT}"
            echo "- Scanned namespaces: ${SCANNED:-unknown}"
            echo "- Eligible (labeled, past deadline): ${ELIGIBLE:-unknown}"
            echo "- Refused (gate-named but unlabeled/foreign): ${REFUSED:-unknown}"
            echo "- Deleted: ${deleted}"
            echo "- Failed deletions: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${REFUSED:-0}" != "0" ]; then
            echo "Refused gate-named namespaces detected; inspect the merge-gate-stale-sweep artifact — a foreign chase-sets-gate-* namespace should not exist." >&2
          fi
