name: Project Status Sync

on:
  schedule:
    # Hourly during the working day; Blocked -> Refined is the transition that
    # matters and it happens whenever a blocker closes.
    - cron: "17 12-23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-status-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync delivery board status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A wholly unconfigured repository skips cleanly. Any partial variable
    # configuration runs the enforcing script, which names the missing input
    # and fails instead of silently reporting a successful synchronization.
    if: ${{ vars.DELIVERY_PROJECT_ID != '' || vars.DELIVERY_STATUS_FIELD_ID != '' || vars.DELIVERY_STATUS_OPTION_IDS != '' || vars.DELIVERY_TARGET_DATE_FIELD_ID != '' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace

      # Recomputes every active derived state from native issue facts: an Epic
      # (by native type, or the legacy kind:epic label on an untyped issue)
      # projects to Epic, a non-Epic carrying status:tracking-only projects to
      # Tracking, and everything else resolves to Blocked / Refined / Backlog
      # from dependencies, milestone, and labels. Closed issues reconcile to
      # Landed or Canceled from GitHub's closure reason; explicitly reopened
      # terminal issues return to derived ownership. Active In lane / In review
      # states remain lane-owned and are never overwritten. DELIVERY_STATUS_OPTION_IDS
      # must map every derived and terminal status, including Epic and Tracking,
      # or the script fails before it reads or writes anything.
      - name: Sync status
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_ID: ${{ vars.DELIVERY_PROJECT_ID }}
          STATUS_FIELD_ID: ${{ vars.DELIVERY_STATUS_FIELD_ID }}
          STATUS_OPTION_IDS: ${{ vars.DELIVERY_STATUS_OPTION_IDS }}
          # The Roadmap layout's date field is re-derived from each item's
          # milestone due date. GitHub cannot plot the built-in Milestone field,
          # so the board carries a real Date field instead.
          TARGET_DATE_FIELD_ID: ${{ vars.DELIVERY_TARGET_DATE_FIELD_ID }}
        run: node ./scripts/project-status-sync.mjs
