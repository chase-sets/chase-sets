name: Platform Catalog Assets Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Catalog asset environment to plan or apply.
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: Run a plan only, or apply the reviewed plan.
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      release_ref:
        description: Ref to check out. Defaults to main.
        required: false
        default: main
        type: string
      catalog_asset_object_path:
        description: Optional known public object path to verify through the CDN after apply. Do not use private or unreleased assets.
        required: false
        default: ""
        type: string
      confirm:
        description: Type "plan catalog-assets <environment>" or "apply catalog-assets <environment>".
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: platform-catalog-assets-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  catalog-assets:
    name: Catalog Assets ${{ inputs.mode }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: ${{ inputs.environment }}
    steps:
      - name: Confirm catalog-assets operation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          expected="${{ inputs.mode }} catalog-assets ${{ inputs.environment }}"
          if [ "${{ inputs.confirm }}" != "$expected" ]; then
            echo "Confirmation text did not match exactly; expected '${expected}'." >&2
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        with:
          ref: ${{ inputs.release_ref }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        with:
          terraform_wrapper: false

      - name: Terraform init catalog assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        working-directory: infrastructure/digitalocean/catalog-assets
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=catalog-assets/${{ inputs.environment }}.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format catalog assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform fmt -check -recursive

      - name: Terraform validate catalog assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform validate

      - name: Terraform plan catalog assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        working-directory: infrastructure/digitalocean/catalog-assets
        run: |
          set -euo pipefail
          terraform plan -out=tfplan
          mkdir -p ../../../artifacts/catalog-assets
          terraform show -no-color tfplan > ../../../artifacts/catalog-assets/${{ inputs.environment }}-catalog-assets-plan.txt

      - name: Upload catalog-assets Terraform plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-assets-${{ inputs.environment }}-terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-assets/${{ inputs.environment }}-catalog-assets-plan.txt
          if-no-files-found: error
          retention-days: 30

      - name: Terraform apply catalog assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        if: inputs.mode == 'apply'
        working-directory: infrastructure/digitalocean/catalog-assets
        run: terraform apply -auto-approve tfplan

      - name: Verify bucket root privacy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        if: inputs.mode == 'apply'
        working-directory: infrastructure/digitalocean/catalog-assets
        run: |
          set -euo pipefail
          bucket_origin="$(terraform output -raw bucket_origin)"
          root_response="${RUNNER_TEMP}/catalog-assets-bucket-root.xml"
          status="$(curl -sS -o "$root_response" -w '%{http_code}' "https://${bucket_origin}/")"
          if [ "$status" != "403" ] || ! grep -qi "AccessDenied" "$root_response"; then
            echo "Catalog asset bucket root did not return AccessDenied; status=${status}." >&2
            exit 1
          fi
          echo "Catalog asset bucket root returned AccessDenied."

      - name: Verify CDN object delivery
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        if: inputs.mode == 'apply' && inputs.catalog_asset_object_path != ''
        working-directory: infrastructure/digitalocean/catalog-assets
        run: |
          set -euo pipefail
          public_base_url="$(terraform output -raw public_base_url)"
          object_path="${{ inputs.catalog_asset_object_path }}"
          object_path="${object_path#/}"
          if printf '%s' "$object_path" | grep -Eq '(^|/)\.\.(/|$)'; then
            echo "Catalog asset object path must not contain traversal segments." >&2
            exit 1
          fi
          status="$(curl -sSL -o /dev/null -w '%{http_code}' "${public_base_url}/${object_path}")"
          if [ "$status" != "200" ]; then
            echo "Catalog asset CDN object delivery check failed; status=${status}." >&2
            exit 1
          fi
          echo "Catalog asset CDN object delivery returned 200."

      - name: Summarize catalog-assets operation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
          TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
        if: always()
        run: |
          {
            echo "## Catalog Assets Terraform"
            echo ""
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Mode: ${{ inputs.mode }}"
            echo "- Release ref: ${{ inputs.release_ref }}"
            echo "- Plan artifact: catalog-assets-${{ inputs.environment }}-terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}"
            if [ "${{ inputs.mode }}" = "apply" ]; then
              echo "- Bucket root privacy check: required and executed"
              if [ -n "${{ inputs.catalog_asset_object_path }}" ]; then
                echo "- CDN object delivery check: required and executed"
              else
                echo "- CDN object delivery check: skipped; provide a support-safe known object path before closing #3586"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
