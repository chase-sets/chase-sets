name: 8689 Browser Capture

on:
  workflow_dispatch:
    inputs:
      target_head:
        description: Exact implementation head to capture against
        required: true
        type: string
      control_head:
        description: Throwaway control head carrying this workflow and capture spec
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    name: Capture seller recommendations browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout throwaway control
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.control_head || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture control identity and materialize probe
        id: control
        shell: bash
        env:
          TARGET_HEAD: ${{ github.event.inputs.target_head || '450f36ab34feab4748dfd2ff95d6aff84ec1a980' }}
        run: |
          set -euo pipefail
          control_head="$(git rev-parse HEAD)"
          control_tree="$(git rev-parse HEAD^{tree})"
          mkdir -p .tmp/8689-browser
          cp deployables/marketplace/e2e/throwaway-8689-browser-capture.mjs .tmp/8689-browser/run-browser-proof.mjs
          printf 'control_head=%s\ncontrol_tree=%s\ntarget_head=%s\n' "$control_head" "$control_tree" "$TARGET_HEAD" >> "$GITHUB_OUTPUT"
          timeout 120s git fetch --no-tags --depth=1 origin "$TARGET_HEAD"
          timeout 120s git checkout --detach "$TARGET_HEAD"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          test -n "$(git rev-parse HEAD^{tree})"

      - name: Setup pinned workspace
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: timeout 540s pnpm install --frozen-lockfile

      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: timeout 540s pnpm exec playwright install --with-deps chromium

      - name: Run exact-head capture
        shell: bash
        env:
          PROOF_HEAD: ${{ steps.control.outputs.target_head }}
          CONTROL_HEAD: ${{ steps.control.outputs.control_head }}
          CONTROL_TREE: ${{ steps.control.outputs.control_tree }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
          CHASE_SETS_BROWSER_E2E_PROBE: true
          NOTIFICATION_EMAIL_PROVIDER: noop
          STRIPE_SECRET_KEY: ''
          STRIPE_PUBLISHABLE_KEY: ''
          STRIPE_WEBHOOK_SECRET: ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PROOF_HEAD"
          test "$(git rev-parse HEAD^{tree})" != ''
          PROOF_HEAD="$PROOF_HEAD" CONTROL_HEAD="$CONTROL_HEAD" CONTROL_TREE="$CONTROL_TREE" timeout 540s node .tmp/8689-browser/run-browser-proof.mjs

      - name: Write identity manifest
        if: always()
        shell: bash
        env:
          TARGET_HEAD: ${{ steps.control.outputs.target_head }}
          CONTROL_HEAD: ${{ steps.control.outputs.control_head }}
          CONTROL_TREE: ${{ steps.control.outputs.control_tree }}
        run: |
          set -euo pipefail
          {
            echo "control_head=$CONTROL_HEAD"
            echo "control_tree=$CONTROL_TREE"
            echo "target_head=$TARGET_HEAD"
            echo "target_tree=$(git rev-parse HEAD^{tree})"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "job=$GITHUB_JOB"
          } > .tmp/8689-browser/identity-manifest.txt

      - name: Upload capture bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 8689-browser-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/8689-browser
          if-no-files-found: warn
          retention-days: 14
