name: Platform Production Stripe Webhook Endpoint Create

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "create production payments webhook endpoint" to create the live endpoint
        required: true
        type: string
      operation:
        description: Create an absent endpoint or replace its immutable API version
        required: true
        default: create-canonical
        type: choice
        options:
          - create-canonical
          - replace-version
      phase:
        description: Prepare keys first, then deploy before completing the signed replay
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - complete
      delivery_event:
        description: Supported Stripe event ID for completion replay
        required: false
        type: string
      use_signed_delivery_capture:
        description: Read the short-lived signed delivery capture from the production Environment secret
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: platform-production-stripe-webhook-endpoint-create
  cancel-in-progress: false

jobs:
  create:
    name: Create Production Stripe Webhook Endpoint
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'create production payments webhook endpoint'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/heads/main

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Create and verify production Stripe webhook endpoint
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ secrets.ENVIRONMENT_SECRETS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_WEBHOOK_SECRET_PREVIOUS: ${{ secrets.STRIPE_WEBHOOK_SECRET_PREVIOUS }}
          OPERATION: ${{ inputs.operation }}
          PHASE: ${{ inputs.phase }}
          DELIVERY_EVENT: ${{ inputs.delivery_event }}
          USE_SIGNED_DELIVERY_CAPTURE: ${{ inputs.use_signed_delivery_capture }}
          STRIPE_WEBHOOK_DELIVERY_CAPTURE: ${{ inputs.operation == 'replace-version' && inputs.phase == 'complete' && inputs.use_signed_delivery_capture && secrets.STRIPE_WEBHOOK_DELIVERY_CAPTURE || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=("$OPERATION" --environment production --confirm "$CONFIRMATION" --phase "$PHASE" --delivery-event "$DELIVERY_EVENT")
          if [[ "$USE_SIGNED_DELIVERY_CAPTURE" == true ]]; then
            if [[ "$OPERATION" != replace-version || "$PHASE" != complete ]]; then
              echo 'A signed delivery capture is only allowed for replace-version completion.' >&2
              exit 1
            fi
            export LC_ALL=C
            if (( ${#STRIPE_WEBHOOK_DELIVERY_CAPTURE} == 0 || ${#STRIPE_WEBHOOK_DELIVERY_CAPTURE} > 49152 )); then
              echo 'The production delivery capture secret must contain 1 to 49152 bytes.' >&2
              exit 1
            fi
            umask 077
            capture_file="$(mktemp "$RUNNER_TEMP/stripe-delivery.XXXXXXXX")"
            trap 'rm -f -- "$capture_file"' EXIT
            printf '%s' "$STRIPE_WEBHOOK_DELIVERY_CAPTURE" > "$capture_file"
            args+=(--delivery-file "$capture_file")
          fi
          unset STRIPE_WEBHOOK_DELIVERY_CAPTURE
          pnpm run ops stripe:webhook-endpoint -- "${args[@]}"
