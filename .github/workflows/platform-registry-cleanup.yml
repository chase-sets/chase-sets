name: Platform Registry Cleanup

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print cleanup actions without deleting tags or running garbage collection.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions: {}

concurrency:
  group: platform-registry-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup DOCR Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      issues: write
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cleanup registry tags
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health

          dry_run="${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run || 'true' }}"
          dry_run_arg=""
          if [ "$dry_run" = "true" ]; then
            dry_run_arg="--dry-run"
          fi
          echo "Registry cleanup dry_run=${dry_run}."

          node ./scripts/digitalocean-registry-cleanup.mjs cleanup \
            --repository="${PLATFORM_IMAGE_REPOSITORY}" \
            --retention-days=7 \
            --app-name=chase-sets-staging-platform \
            --app-name=chase-sets-platform \
            --out artifacts/release-health/digitalocean-registry-cleanup.json \
            ${dry_run_arg}

      - name: Summarize registry cleanup
        if: ${{ always() }}
        run: |
          set -euo pipefail
          record="artifacts/release-health/digitalocean-registry-cleanup.json"
          if [ ! -f "$record" ]; then
            echo "No registry cleanup record was written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node - "$record" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require("node:fs");
          const record = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("## DigitalOcean Registry Cleanup");
          console.log("");
          console.log(`- Result: ${record.result}`);
          console.log(`- Mode: ${record.mode}`);
          console.log(`- Repository: ${record.repository}`);
          console.log(`- Retention days: ${record.retentionDays}`);
          console.log(`- Protected App Platform tags: ${record.protectedTags?.length ?? 0}`);
          console.log(`- Cleanup candidates: ${record.selectedDeletionTags?.length ?? 0}`);
          console.log(`- Deleted tags: ${record.deletedTags?.length ?? 0}`);
          console.log(`- Failed deletes: ${record.failedTags?.length ?? 0}`);
          console.log(`- Garbage collection: ${record.garbageCollection?.status ?? "unknown"}`);
          if (record.errors?.length) {
            console.log("");
            console.log("### Errors");
            for (const error of record.errors) {
              console.log(`- ${error}`);
            }
          }
          NODE

      - name: Upload registry cleanup artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-registry-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-health/digitalocean-registry-cleanup.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report registry cleanup alert
        if: ${{ failure() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Registry Cleanup
          alert-status: failure
          alert-summary: Platform registry cleanup failed. See the cleanup summary and uploaded artifact when present.

      - name: Report registry cleanup recovery
        if: ${{ success() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Registry Cleanup
          alert-status: success
          alert-summary: Platform registry cleanup completed successfully.
