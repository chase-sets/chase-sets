name: Platform Registry Cleanup

on:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print cleanup actions without deleting tags or running garbage collection.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions: {}

concurrency:
  # DOCR garbage collection makes the registry read-only. Share this lane with
  # deploy workflows that push or tag platform images so cleanup cannot enter
  # the delete/GC window while a deploy can start registry writes.
  group: platform-registry-mutation
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup DOCR Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      DIGITALOCEAN_REGISTRY_CLEANUP_REQUESTED_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run == 'true' && 'true' || 'false') }}
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_REGISTRY_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check deploy lane
        id: deploy_lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health

          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const fs = require("node:fs");

          const repository = process.env.GITHUB_REPOSITORY;
          const currentRunId = String(process.env.GITHUB_RUN_ID);
          const workflows = ["platform-production.yml", "platform-staging-reset.yml"];
          const statuses = ["queued", "in_progress", "waiting", "requested", "pending"];
          const blockers = [];

          function ghApi(path) {
            const result = spawnSync("gh", ["api", path], { encoding: "utf8" });
            if (result.status !== 0) {
              throw new Error(result.stderr || result.stdout || `gh api ${path} failed`);
            }
            return JSON.parse(result.stdout || "{}");
          }

          for (const workflow of workflows) {
            for (const status of statuses) {
              const response = ghApi(
                `repos/${repository}/actions/workflows/${workflow}/runs?status=${status}&per_page=100`,
              );
              for (const run of response.workflow_runs ?? []) {
                if (String(run.id) === currentRunId) {
                  continue;
                }
                blockers.push({
                  workflow,
                  id: run.id,
                  status: run.status,
                  event: run.event,
                  headSha: run.head_sha,
                  url: run.html_url,
                });
              }
            }
          }

          const outputPath = process.env.GITHUB_OUTPUT;
          if (blockers.length === 0) {
            fs.appendFileSync(outputPath, "deferred=false\n");
            console.log("No queued or in-progress platform deploy runs found.");
            process.exit(0);
          }

          const record = {
            schemaVersion: "digitalocean-registry-cleanup/v1",
            checkedAt: new Date().toISOString(),
            mode: process.env.DIGITALOCEAN_REGISTRY_CLEANUP_REQUESTED_DRY_RUN === "true" ? "dry-run" : "apply",
            requestedMode:
              process.env.DIGITALOCEAN_REGISTRY_CLEANUP_REQUESTED_DRY_RUN === "true" ? "dry-run" : "apply",
            repository: process.env.PLATFORM_IMAGE_REPOSITORY,
            retentionDays: 7,
            retainRecentShaTreeTags: 25,
            protectedTags: [],
            protectedDigests: [],
            retainedRecentShaTreeTags: [],
            selectedDeletionTags: [],
            deletedTags: [],
            failedTags: [],
            garbageCollection: {
              status: "skipped",
              reason: "deploy-lane-active",
            },
            result: "deferred",
            deployLaneBlockers: blockers,
            errors: [],
          };
          fs.writeFileSync(
            "artifacts/release-health/digitalocean-registry-cleanup.json",
            `${JSON.stringify(record, null, 2)}\n`,
          );
          fs.appendFileSync(outputPath, "deferred=true\n");
          console.log(`Deferring registry cleanup because ${blockers.length} platform deploy run(s) are queued or active.`);
          NODE

      - name: Cleanup registry tags
        if: steps.deploy_lane.outputs.deferred != 'true'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health

          echo "Registry cleanup requested dry_run=${DIGITALOCEAN_REGISTRY_CLEANUP_REQUESTED_DRY_RUN}."

          node ./scripts/digitalocean-registry-cleanup.mjs cleanup \
            --repository="${PLATFORM_IMAGE_REPOSITORY}" \
            --retain-recent-sha-tree-tags=25 \
            --dry-run="${DIGITALOCEAN_REGISTRY_CLEANUP_REQUESTED_DRY_RUN}" \
            --out artifacts/release-health/digitalocean-registry-cleanup.json

      - name: Validate canonical registry cleanup record
        if: ${{ always() }}
        run: |
          set -euo pipefail
          node ./scripts/digitalocean-registry-cleanup-record.mjs --record=artifacts/release-health/digitalocean-registry-cleanup.json

      - name: Summarize registry cleanup
        if: ${{ always() }}
        run: |
          set -euo pipefail
          record="artifacts/release-health/digitalocean-registry-cleanup.json"
          if [ ! -f "$record" ]; then
            echo "No registry cleanup record was written." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          node - "$record" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require("node:fs");
          const record = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("## DigitalOcean Registry Cleanup");
          console.log("");
          console.log(`- Result: ${record.result}`);
          console.log(`- Mode: ${record.mode}`);
          console.log(`- Retained SHA/tree tags: ${record.retainedRecentShaTreeTags?.length ?? 0}/${record.retainRecentShaTreeTags ?? "unknown"}`);
          console.log(`- Explicitly protected tags: ${record.protectedTags?.length ?? 0}`);
          console.log(`- Explicitly protected digests: ${record.protectedDigests?.length ?? 0}`);
          console.log(`- Cleanup candidates: ${record.selectedDeletionTags?.length ?? 0}`);
          console.log(`- Deleted tags: ${record.deletedTags?.length ?? 0}`);
          console.log(`- Failed deletes: ${record.failedTags?.length ?? 0}`);
          console.log(`- Garbage collection: ${record.garbageCollection?.status ?? "unknown"}/${record.garbageCollection?.reason ?? "unknown"}`);
          if (record.deployLaneBlockers?.length) {
            console.log("");
            console.log("### Deploy lane blockers");
            for (const blocker of record.deployLaneBlockers) {
              console.log(`- ${blocker.workflow} #${blocker.id}: ${blocker.status} (${blocker.url})`);
            }
          }
          if (record.errors?.length) {
            console.log("");
            console.log("### Errors");
            for (const error of record.errors) {
              console.log(`- ${error}`);
            }
          }
          NODE

      - name: Upload registry cleanup artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-registry-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-health/digitalocean-registry-cleanup.json
          if-no-files-found: error
          retention-days: 30

      - name: Report registry cleanup alert
        if: ${{ failure() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Registry Cleanup
          alert-status: failure
          alert-summary: Platform registry cleanup failed. See the cleanup summary and canonical artifact validation.

      - name: Report registry cleanup recovery
        if: ${{ success() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Registry Cleanup
          alert-status: success
          alert-summary: Platform registry cleanup completed successfully or deferred because the deploy lane was active.
