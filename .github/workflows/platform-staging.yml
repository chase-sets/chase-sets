name: Platform Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      TF_VAR_spaces_access_id: ${{ secrets.SPACES_ACCESS_ID }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      TF_VAR_environment: staging
      TF_VAR_platform_image_repository: chase-sets-platform
      TF_VAR_platform_image_tag: ${{ github.sha }}
      TF_VAR_platform_internal_auth_secret: ${{ secrets.PLATFORM_INTERNAL_AUTH_SECRET }}
      TF_VAR_platform_admin_email: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      TF_VAR_platform_admin_password: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
      TF_VAR_platform_admin_display_name: ${{ vars.PLATFORM_ADMIN_DISPLAY_NAME || 'Platform Admin' }}
      TF_VAR_discord_invite_url: ${{ secrets.CHASE_SETS_DISCORD_INVITE_URL }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_publishable_key: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_stripe_connect_return_url: ${{ secrets.STRIPE_CONNECT_RETURN_URL }}
      TF_VAR_stripe_connect_refresh_url: ${{ secrets.STRIPE_CONNECT_REFRESH_URL }}
      TF_VAR_stripe_api_base_url: ${{ vars.STRIPE_API_BASE_URL || '' }}
      TF_VAR_easypost_api_key: ${{ secrets.EASYPOST_API_KEY }}
      TF_VAR_easypost_api_base_url: ${{ vars.EASYPOST_API_BASE_URL || '' }}
      TF_VAR_easypost_mode: ${{ vars.EASYPOST_MODE || 'test' }}
      DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK: chase-sets
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v6

      - name: Validate staging configuration
        run: |
          missing=()
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            DIGITALOCEAN_ACCESS_TOKEN \
            TF_VAR_platform_internal_auth_secret \
            TF_VAR_platform_admin_email \
            TF_VAR_platform_admin_password \
            TF_VAR_discord_invite_url \
            TF_VAR_stripe_secret_key \
            TF_VAR_stripe_publishable_key \
            TF_VAR_stripe_webhook_secret \
            TF_VAR_stripe_connect_return_url \
            TF_VAR_stripe_connect_refresh_url \
            TF_VAR_easypost_api_key
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required staging configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-pnpm-workspace

      - uses: hashicorp/setup-terraform@v4
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated metadata
        run: pnpm run verify:metadata

      - name: Run staging static gate
        run: pnpm run verify:static

      - name: Build staging workspaces
        run: pnpm run verify:build

      - name: Build and push App Platform image
        run: |
          set -euo pipefail
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$registry_name" ]; then
            doctl registry create "$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK" --region nyc3
            registry_name="$DIGITALOCEAN_CONTAINER_REGISTRY_FALLBACK"
          fi

          doctl registry login --expiry-seconds 3600
          image="registry.digitalocean.com/${registry_name}/${PLATFORM_IMAGE_REPOSITORY}:${TF_VAR_platform_image_tag}"
          docker build --pull --tag "$image" .
          docker push "$image"

      - name: Terraform init
        working-directory: infrastructure/digitalocean/platform
        run: |
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Terraform format
        working-directory: infrastructure/digitalocean/platform
        run: terraform fmt -check -recursive

      - name: Terraform plan
        id: terraform_plan
        working-directory: infrastructure/digitalocean/platform
        run: |
          terraform plan -out=tfplan
          app_changed="$(node ../../../scripts/digitalocean-app-deployment.mjs plan-app-changed tfplan)"
          echo "Terraform will change digitalocean_app.platform: ${app_changed}"
          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"

      - name: Wait for previous App Platform deployment
        working-directory: infrastructure/digitalocean/platform
        run: |
          set -euo pipefail

          app_id="$(terraform output -raw app_id 2>/dev/null || true)"
          if [ -z "$app_id" ]; then
            echo "No existing App Platform app was found in Terraform state; skipping deployment wait."
            exit 0
          fi

          node ../../../scripts/digitalocean-app-deployment.mjs wait "$app_id" --timeout-seconds=1800 --poll-seconds=30

      - name: Terraform apply
        working-directory: infrastructure/digitalocean/platform
        run: terraform apply -auto-approve tfplan

      - name: Deploy App Platform app
        if: steps.terraform_plan.outputs.app_changed != 'true'
        working-directory: infrastructure/digitalocean/platform
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          node ../../../scripts/digitalocean-app-deployment.mjs deploy "$app_id" --force-rebuild

      - name: Smoke check
        working-directory: infrastructure/digitalocean/platform
        env:
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
          SMOKE_REQUIRE_ADMIN: "true"
          SMOKE_REQUIRE_MARKETPLACE: "true"
          SMOKE_REQUIRE_LEGACY_REDIRECT: "true"
        run: |
          set -euo pipefail
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          legacy_domain="$(terraform output -json legacy_public_redirect_domains | jq -r '.[0] // empty')"
          if [ -z "$landing_domain" ] || [ -z "$admin_domain" ] || [ -z "$marketplace_domain" ] || [ -z "$legacy_domain" ]; then
            echo "Required staging smoke domains were not present in Terraform outputs." >&2
            exit 1
          fi
          cd ../../..
          pnpm run smoke:platform -- "https://${landing_domain}" "https://${admin_domain}" "https://${marketplace_domain}" "https://${legacy_domain}"
