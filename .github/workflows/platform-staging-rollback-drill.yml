name: Platform Staging Rollback Drill

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "run staging rollback drill" to confirm rolling the staging App Platform app back and forward.
        required: true
        type: string
      rollback_digest:
        description: Previous known-good staging image digest to deploy temporarily, in sha256:<64 hex> form.
        required: true
        type: string
      rollback_tag:
        description: Optional DOCR tag for the previous known-good image. Evidence still requires rollback_digest.
        required: false
        default: ""
        type: string
      rollback_reference:
        description: Link to the prior deploy, DOCR tag lookup, issue comment, or release evidence used to choose rollback_digest.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: platform-deploy-staging
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    name: Refuse Unconfirmed Staging Rollback Drill
    runs-on: ubuntu-latest
    if: inputs.confirm != 'run staging rollback drill'
    steps:
      - name: Refuse unconfirmed staging rollback drill
        run: |
          echo 'Confirmation text did not match exactly; expected "run staging rollback drill".' >&2
          exit 1

  staging-rollback-drill:
    name: Staging Rollback Drill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped'
    permissions:
      contents: read
      issues: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      DEPLOYMENT_ENVIRONMENT: staging
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
      STAGING_APP_NAME: chase-sets-staging-platform
      SMOKE_REQUIRE_ADMIN: "true"
      SMOKE_REQUIRE_MARKETPLACE: "true"
      SMOKE_REQUIRE_MARKETPLACE_ROOT: "true"
      SMOKE_WRITE_WAITLIST: "false"
      SMOKE_FETCH_ATTEMPTS: "24"
      SMOKE_FETCH_RETRY_DELAY_MS: "5000"
      PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
      PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
    steps:
      - name: Confirm staging rollback drill
        run: |
          set -euo pipefail
          echo "Staging rollback drill confirmed."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        id: buildx
        continue-on-error: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        if: steps.buildx.outcome == 'failure'

      - name: Terraform init staging platform state
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          terraform init \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=landing/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

      - name: Resolve staging app and smoke targets
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          app_id="$(terraform output -raw app_id)"
          landing_domain="$(terraform output -raw landing_domain)"
          admin_domain="$(terraform output -raw admin_domain)"
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          staging_root_marketplace_domain="$(terraform output -json staging_root_marketplace_domains | jq -r '.[0] // empty')"
          registry_name="$(doctl registry get --format Name --no-header 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$app_id" ] || [ -z "$landing_domain" ] || [ -z "$admin_domain" ] ||
            [ -z "$marketplace_domain" ] || [ -z "$staging_root_marketplace_domain" ] || [ -z "$registry_name" ]; then
            echo "Required staging app, smoke domain, or registry output was missing." >&2
            exit 1
          fi
          {
            echo "STAGING_APP_ID=${app_id}"
            echo "DIGITALOCEAN_REGISTRY_NAME=${registry_name}"
            echo "LANDING_URL=https://${landing_domain}"
            echo "ADMIN_URL=https://${admin_domain}"
            echo "MARKETPLACE_URL=https://${marketplace_domain}"
            echo "MARKETPLACE_ROOT_WEB_URL=https://${staging_root_marketplace_domain}"
          } >> "$GITHUB_ENV"

      - name: Run staging rollback drill
        env:
          STAGING_ROLLBACK_DRILL_OUT: artifacts/staging-rollback-drill/staging-rollback-drill.json
          ROLLBACK_TARGET_DIGEST: ${{ inputs.rollback_digest }}
          ROLLBACK_TARGET_TAG: ${{ inputs.rollback_tag }}
          ROLLBACK_TARGET_REFERENCE: ${{ inputs.rollback_reference }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-rollback-drill
          doctl registry login --expiry-seconds 3600
          node ./scripts/digitalocean-staging-rollback-drill.mjs

      - name: Summarize staging rollback drill
        if: ${{ always() }}
        run: |
          set -euo pipefail
          record="artifacts/staging-rollback-drill/staging-rollback-drill.json"
          if [ ! -f "$record" ]; then
            echo "No staging rollback drill record was written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node - "$record" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require("node:fs");
          const record = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          console.log("## Staging Rollback Drill");
          console.log("");
          console.log(`- Result: ${record.result}`);
          console.log(`- App: ${record.app?.name ?? "unknown"} (${record.app?.id ?? "unknown"})`);
          console.log(`- Current image: ${record.current?.imageRef ?? "unknown"}`);
          console.log(`- Rollback target: ${record.rollbackTarget?.imageRef ?? "unknown"}`);
          console.log(`- Target image exists: ${record.rollbackTarget?.imageExists ?? "unknown"}`);
          for (const [name, phase] of Object.entries(record.phases ?? {})) {
            console.log(`- ${name}: ${phase.status}`);
          }
          if (record.errors?.length) {
            console.log("");
            console.log("### Errors");
            for (const error of record.errors) {
              console.log(`- ${error}`);
            }
          }
          NODE

      - name: Upload staging rollback drill evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-staging-rollback-drill-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/staging-rollback-drill/staging-rollback-drill.json
          if-no-files-found: error
          retention-days: 30

      - name: Report staging rollback drill failure
        if: ${{ failure() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Staging Rollback Drill
          alert-status: failure
          alert-summary: Staging rollback drill failed. See the uploaded evidence artifact when present.

      - name: Report staging rollback drill recovery
        if: ${{ success() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Staging Rollback Drill
          alert-status: success
          alert-summary: Staging rollback drill completed, smoked the rollback image, and rolled forward.
