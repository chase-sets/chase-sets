name: Platform Staging Wake Drills

# Push-wake recovery and bounded load drills against deployed staging
# (#1234 reconciliation/recovery drills, #1237 SLO/load proof).
# Interpretation and drill catalog: docs/runbooks/push-wake-recovery-drills.md.

on:
  workflow_dispatch:
    inputs:
      drill:
        description: Drill to run. "reconciliation" audits relay cursors and projection checkpoints against event-store heads around a synthetic Buy Now write; "load" runs bounded canary load first.
        required: true
        default: reconciliation
        type: choice
        options:
          - reconciliation
          - load
      confirm:
        description: Type "run staging wake drills" to confirm running synthetic drills against staging.
        required: true
        type: string
      release_ref:
        description: Ref containing the drill tooling. Defaults to main.
        required: false
        default: main
        type: string
      skip_canary_write:
        description: Reconciliation only - audit durable positions without generating a synthetic Buy Now write.
        required: false
        default: false
        type: boolean
      load_iterations:
        description: Load drill iterations (hard cap 12).
        required: false
        default: "6"
        type: string
      load_concurrency:
        description: Load drill concurrency (hard cap 4).
        required: false
        default: "2"
        type: string
      load_flow:
        description: Load drill canary flow.
        required: false
        default: guest
        type: choice
        options:
          - guest
          - account
      convergence_budget_ms:
        description: Budget for relay cursor and checkpoint convergence (5000-600000 ms).
        required: false
        default: "120000"
        type: string
      convergence_projection_names:
        description: Comma-separated gated projection names for checkpoint convergence; leave blank for the drill default, or use "all" for every active checkpoint.
        required: false
        default: ""
        type: string
      load_evidence_profile:
        description: Budget profile for the no-secret artifact evaluator after load drills.
        required: false
        default: bounded-staging
        type: choice
        options:
          - bounded-staging
          - representative-volume

permissions:
  contents: read

concurrency:
  group: platform-staging-mutating-operations
  cancel-in-progress: false

jobs:
  refuse-unconfirmed:
    name: Refuse Unconfirmed Wake Drill
    runs-on: ubuntu-latest
    if: inputs.confirm != 'run staging wake drills'
    steps:
      - name: Refuse unconfirmed wake drill
        run: |
          echo 'Confirmation text did not match exactly; expected "run staging wake drills".' >&2
          exit 1

  staging-wake-drill:
    name: Staging Wake Drill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    needs: refuse-unconfirmed
    if: always() && needs.refuse-unconfirmed.result == 'skipped'
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      CHASE_SETS_KUBERNETES_NAMESPACE: chase-sets-platform
    steps:
      - name: Confirm staging wake drill
        run: |
          set -euo pipefail
          echo "Staging wake drill '${{ inputs.drill }}' confirmed."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve release commit
        run: |
          set -euo pipefail
          node ./scripts/resolve-release-commit.mjs \
            --release-ref "${{ inputs.release_ref }}" \
            --checkout true

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Export staging database URLs and TLS trust
        uses: ./.github/actions/export-managed-postgres-authority
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        with:
          environment: staging

      - name: Resolve staging drill domains
        working-directory: infrastructure/digitalocean/platform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          marketplace_domain="$(terraform output -json marketplace_domains | jq -r '.[0] // empty')"
          admin_domain="$(terraform output -raw admin_domain)"
          if [ -z "$marketplace_domain" ] || [ -z "$admin_domain" ]; then
            echo "Required staging marketplace or admin domain was not present in Terraform outputs." >&2
            exit 1
          fi
          {
            echo "WAKE_DRILL_BASE_URL=https://${marketplace_domain}"
            echo "WAKE_DRILL_ADMIN_BASE_URL=https://${admin_domain}"
          } >> "$GITHUB_ENV"

      - name: Configure staging Kubernetes context
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config=key=doks/staging.tfstate \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true

          kubeconfig="${RUNNER_TEMP}/chase-sets-staging-wake-drill.kubeconfig"
          terraform output -raw kubeconfig > "$kubeconfig" || true
          chmod 600 "$kubeconfig"

          if ! KUBECONFIG="$kubeconfig" kubectl get namespace kube-system --request-timeout=15s >/dev/null 2>&1; then
            echo "Terraform DOKS kubeconfig output did not contain a usable current-context; refreshing from DigitalOcean cluster identity." >&2
            cluster_id="$(terraform output -raw cluster_id 2>/dev/null || true)"
            cluster_name="$(terraform output -raw cluster_name 2>/dev/null || true)"
            if [ -z "$cluster_id" ] && [ -z "$cluster_name" ]; then
              cluster_address="$(
                terraform state list \
                  | awk '/(^|\.)digitalocean_kubernetes_cluster\./ { print; exit }'
              )"
              if [ -n "$cluster_address" ]; then
                echo "Using staging DOKS cluster Terraform state address ${cluster_address}." >&2
                cluster_state="$(terraform state show -no-color "$cluster_address")"
                cluster_id="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "id") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
                cluster_name="$(
                  printf '%s\n' "$cluster_state" \
                    | awk -F '=' '
                        {
                          key=$1
                          gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                          if (key == "name") {
                            value=$2
                            gsub(/^[[:space:]"]+|[[:space:]"]+$/, "", value)
                            print value
                            exit
                          }
                        }
                      '
                )"
              fi
            fi
            if [ -n "$cluster_id" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig"
            elif [ -n "$cluster_name" ]; then
              doctl kubernetes cluster kubeconfig show "$cluster_name" > "$kubeconfig"
            else
              echo "DOKS Terraform state does not expose cluster_id or cluster_name; cannot configure staging Kubernetes context." >&2
              exit 1
            fi
            chmod 600 "$kubeconfig"
          fi

          current_context="$(KUBECONFIG="$kubeconfig" kubectl config current-context 2>/dev/null || true)"
          if [ -z "$current_context" ]; then
            echo "Staging Kubernetes kubeconfig is present but has no current context after Terraform and DigitalOcean refresh attempts." >&2
            KUBECONFIG="$kubeconfig" kubectl config get-contexts || true
            exit 1
          fi

          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"
          echo "Configured staging Kubernetes context: ${current_context}"

      - name: Start staging worker-status port-forward
        run: |
          set -euo pipefail
          worker_deployment="$(
            kubectl get deployment \
              --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
              --selector 'app.kubernetes.io/component=platform-worker,app.kubernetes.io/instance=chase-sets-platform,app.kubernetes.io/name=chase-sets-platform' \
              --output jsonpath='{.items[0].metadata.name}'
          )"
          if [ -z "$worker_deployment" ]; then
            echo "No staging platform-worker deployment was found for worker-status capture." >&2
            kubectl get deployment --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" >&2 || true
            exit 1
          fi

          worker_status_port=18080
          worker_target_port="$(
            kubectl get deployment \
              --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
              "$worker_deployment" \
              --output jsonpath='{.spec.template.spec.containers[?(@.name=="platform-worker")].ports[?(@.name=="http")].containerPort}'
          )"
          if ! [[ "$worker_target_port" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve staging platform-worker http container port from deployment/${worker_deployment}." >&2
            kubectl get deployment \
              --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
              "$worker_deployment" \
              --output json >&2 || true
            exit 1
          fi

          port_forward_log="${RUNNER_TEMP}/staging-worker-status-port-forward.log"
          kubectl port-forward \
            --namespace "$CHASE_SETS_KUBERNETES_NAMESPACE" \
            "deployment/${worker_deployment}" \
            "${worker_status_port}:${worker_target_port}" \
            > "$port_forward_log" 2>&1 &
          port_forward_pid="$!"
          echo "$port_forward_pid" > "${RUNNER_TEMP}/staging-worker-status-port-forward.pid"
          echo "WAKE_DRILL_WORKER_STATUS_URL=http://127.0.0.1:${worker_status_port}/internal/workers/status" >> "$GITHUB_ENV"

          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${worker_status_port}/internal/workers/status" >/dev/null; then
              echo "Staging worker-status port-forward is ready."
              exit 0
            fi
            if ! kill -0 "$port_forward_pid" 2>/dev/null; then
              echo "Staging worker-status port-forward exited before becoming ready." >&2
              cat "$port_forward_log" >&2 || true
              exit 1
            fi
            sleep 1
          done

          echo "Timed out waiting for staging worker-status port-forward readiness." >&2
          cat "$port_forward_log" >&2 || true
          exit 1

      - name: Install Playwright Chromium for canary writes
        if: inputs.drill == 'load' || !inputs.skip_canary_write
        run: pnpm exec playwright install --with-deps chromium

      - name: Run staging wake drill
        env:
          WAKE_DRILL_CORRELATION_PREFIX: wake-drill-${{ github.run_id }}-${{ github.run_attempt }}
          WAKE_DRILL_CONVERGENCE_BUDGET_MS: ${{ inputs.convergence_budget_ms }}
          WAKE_DRILL_CONVERGENCE_PROJECTION_NAMES: ${{ inputs.convergence_projection_names }}
          WAKE_DRILL_LOAD_ITERATIONS: ${{ inputs.load_iterations }}
          WAKE_DRILL_LOAD_CONCURRENCY: ${{ inputs.load_concurrency }}
          WAKE_DRILL_FLOW: ${{ inputs.load_flow }}
          WAKE_DRILL_SKIP_CANARY_WRITE: ${{ inputs.skip_canary_write && 'true' || 'false' }}
          GUEST_BUY_NOW_PROBE_ITEM_PATH: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_ITEM_PATH || '' }}
          WAKE_DRILL_SEARCH_QUERY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_SEARCH_QUERY || 'air balloon' }}
          GUEST_BUY_NOW_PROBE_FIXTURE_KEY: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_FIXTURE_KEY || 'staging-guest-buy-now-fixture' }}
          GUEST_BUY_NOW_PROBE_READY_SLO_MS: ${{ vars.STAGING_GUEST_BUY_NOW_CANARY_READY_SLO_MS || '10000' }}
          MARKETPLACE_E2E_EMAIL: ${{ vars.MARKETPLACE_E2E_EMAIL || '' }}
          MARKETPLACE_E2E_PASSWORD: ${{ secrets.MARKETPLACE_E2E_PASSWORD || '' }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          PLATFORM_ADMIN_PASSWORD: ${{ secrets.PLATFORM_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm run wake:drills "${{ inputs.drill }}" \
            --out "artifacts/wake-drills/staging-wake-drill-${{ inputs.drill }}.json"

      - name: Remove managed Postgres CA
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${PGSSLROOTCERT:-}" ]; then
            rm -f -- "$PGSSLROOTCERT"
          fi

      - name: Evaluate captured load artifact
        if: always() && inputs.drill == 'load'
        run: |
          set -euo pipefail
          pnpm run ops push-wake:load-evidence -- \
            --artifact "artifacts/wake-drills/staging-wake-drill-load.json" \
            --profile "${{ inputs.load_evidence_profile }}" \
            --out "artifacts/wake-drills/staging-wake-drill-load-evaluation.json"

      - name: Upload wake drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-wake-drill-${{ inputs.drill }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/wake-drills
          if-no-files-found: error
          retention-days: 30
