name: Platform Production Restore Point Cleanup

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print selected restore-point forks without deleting them.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      min_age_hours:
        description: Minimum restore-point age before cleanup can select it.
        required: false
        default: "6"
        type: string
      hold_names:
        description: Comma-separated restore-point cluster names or ids to retain.
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: platform-production-restore-point-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup Production Restore Points
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      issues: write
    env:
      PRODUCTION_DB_RESTORE_POINT_CLEANUP_PREFIX: cs-prod-rp-
      PRODUCTION_DB_RESTORE_POINT_CLEANUP_HOLD_NAMES: ${{ github.event.inputs.hold_names || vars.PRODUCTION_DB_RESTORE_POINT_CLEANUP_HOLD_NAMES || '' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Cleanup restore-point forks
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health

          dry_run="${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run || 'true' }}"
          min_age_hours="${{ github.event.inputs.min_age_hours || '6' }}"
          apply_arg=""
          if [ "$dry_run" = "false" ]; then
            apply_arg="--apply"
          fi

          echo "Production restore-point cleanup dry_run=${dry_run}, min_age_hours=${min_age_hours}."

          node ./scripts/production-db-restore-point-cleanup.mjs \
            --min-age-hours "$min_age_hours" \
            --out artifacts/release-health/production-db-restore-point-cleanup.json \
            ${apply_arg}

      - name: Summarize cleanup
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        if: ${{ always() }}
        run: |
          set -euo pipefail
          record="artifacts/release-health/production-db-restore-point-cleanup.json"
          if [ ! -f "$record" ]; then
            echo "No restore-point cleanup record was written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node - "$record" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require("node:fs");
          const record = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const count = (name) => record.restorePoints?.[name]?.length ?? 0;
          console.log("## Production Restore Point Cleanup");
          console.log("");
          console.log(`- Result: ${record.result}`);
          console.log(`- Mode: ${record.mode}`);
          console.log(`- Prefix: ${record.prefix}`);
          console.log(`- Minimum age hours: ${record.minAgeHours}`);
          console.log(`- Cutoff: ${record.cutoff ?? "not evaluated"}`);
          console.log(`- Observed restore-point forks: ${count("observed")}`);
          console.log(`- Held restore-point forks: ${count("held")}`);
          console.log(`- Cleanup candidates: ${count("candidates")}`);
          console.log(`- Deleted restore-point forks: ${count("deleted")}`);
          console.log(`- Failed deletes: ${count("failed")}`);
          if (record.errors?.length) {
            console.log("");
            console.log("### Errors");
            for (const error of record.errors) {
              console.log(`- ${error}`);
            }
          }
          NODE

      - name: Upload cleanup artifact
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-production-restore-point-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-health/production-db-restore-point-cleanup.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report restore-point cleanup alert
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        if: ${{ failure() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Production Restore Point Cleanup
          alert-status: failure
          alert-summary: Production restore-point cleanup failed. See the cleanup summary and uploaded artifact when present.

      - name: Report restore-point cleanup recovery
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        if: ${{ success() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Production Restore Point Cleanup
          alert-status: success
          alert-summary: Production restore-point cleanup completed successfully.
