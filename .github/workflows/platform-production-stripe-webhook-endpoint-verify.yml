name: Platform Production Stripe Webhook Endpoint Verify

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: platform-production-stripe-webhook-endpoint-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Production Stripe Webhook Endpoint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/heads/main

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Verify production Stripe webhook endpoint
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: pnpm run ops stripe:webhook-endpoint -- verify --environment production

  prove-test-contract:
    name: Prove Stripe Test-Mode Webhook Contract
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Create, update, and delete test-mode Payments endpoint
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: >-
          node ./scripts/provider-webhook-lifecycle.mjs prove-payment-events
          --namespace "contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
