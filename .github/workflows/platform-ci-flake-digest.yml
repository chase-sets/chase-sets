name: Platform CI Flake Digest

on:
  schedule:
    # Weekly, Monday 15:00 UTC after the review cadence digest.
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: platform-ci-flake-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Platform CI Flake Digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Build flake digest
        id: digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/release-health
          pnpm run ops -- release-health:flake-digest \
            --out artifacts/release-health/ci-flake-digest.json \
            --markdown-out artifacts/release-health/ci-flake-digest.md \
            --issue-body-out artifacts/release-health/ci-flake-digest-issue.md \
            --github-output "$GITHUB_OUTPUT"
          cat artifacts/release-health/ci-flake-digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Link canonical rolling delivery health
        run: |
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Rolling event and stage posture: [Platform Delivery Health](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/platform-delivery-health.yml)." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate canonical flake digest payloads
        env:
          RELEASE_HEALTH_FLAKE_DIGEST_OUT: artifacts/release-health/ci-flake-digest.json
          RELEASE_HEALTH_FLAKE_DIGEST_MARKDOWN_OUT: artifacts/release-health/ci-flake-digest.md
          RELEASE_HEALTH_FLAKE_DIGEST_ISSUE_BODY_OUT: artifacts/release-health/ci-flake-digest-issue.md
        run: |
          pnpm run ops -- release-health:flake-digest \
            --validate-payloads true

      - name: Upload canonical flake digest artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-ci-flake-digest
          path: artifacts/release-health/ci-flake-digest*
          if-no-files-found: error

      - name: Reconcile canonical flake digest issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm run ops -- release-health:flake-digest \
            --publish-issues true \
            --out artifacts/release-health/ci-flake-digest.json \
            --markdown-out artifacts/release-health/ci-flake-digest.md \
            --issue-body-out artifacts/release-health/ci-flake-digest-issue.md \
            --artifact-id "${{ steps.artifact.outputs.artifact-id }}" \
            --artifact-digest "sha256:${{ steps.artifact.outputs.artifact-digest }}" \
            --artifact-producer-outcome "${{ steps.artifact.outcome }}" \
            --producer-workflow platform-ci-flake-digest.yml \
            --producer-job digest \
            --producer-step artifact \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --head-sha "${{ github.sha }}"
