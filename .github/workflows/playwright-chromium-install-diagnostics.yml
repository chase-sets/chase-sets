name: Playwright Chromium Install Diagnostics

# Host-owned, at most two justified dispatches after reviewed default-branch landing.
# This diagnostic never supplies required E2E or reliability proof.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-chromium-install-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Chromium install (${{ matrix.route }}, ${{ matrix.cache }})
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        route: [combined, decomposed]
        cache: [cold, hit]
    env:
      DIAGNOSTIC_ROUTE: ${{ matrix.route }}
      DIAGNOSTIC_CACHE: ${{ matrix.cache }}
      DIAGNOSTIC_CHECK_RUN_ID: ${{ job.check_run_id }}
      BOUNDARY_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Resolve exact browser cache
        id: cache-path
        shell: bash
        run: |
          set -euo pipefail
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          test -n "$version"
          browser_path="${RUNNER_TEMP}/playwright-chromium/${RUNNER_OS}/${RUNNER_ARCH}/${version}"
          test ! -e "$browser_path"
          echo "browser-path=${browser_path}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=${browser_path}" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_DIRECTORY=${RUNNER_TEMP}/chromium-install-diagnostics" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_CACHE_KEY=e2e-playwright-chromium-${RUNNER_OS}-${RUNNER_ARCH}-${version}" >> "$GITHUB_ENV"

      - name: Restore exact-key hit only
        id: restore
        if: matrix.cache == 'hit'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: "${{ steps.cache-path.outputs.browser-path }}"
          key: "e2e-playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-path.outputs.version }}"

      - name: Capture pre-attempt control
        id: prepare
        env:
          DIAGNOSTIC_RESTORED: ${{ steps.restore.outputs.cache-hit }}
        run: node scripts/playwright-chromium-install-diagnostics.mjs prepare

      - name: Measure owned install attempts
        id: install
        if: steps.prepare.outputs.eligible == 'true'
        timeout-minutes: 7
        run: node scripts/playwright-chromium-install-diagnostics.mjs measure

      - name: Capture terminal evidence
        if: always()
        env:
          DIAGNOSTIC_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DIAGNOSTIC_PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
        run: node scripts/playwright-chromium-install-diagnostics.mjs finalize

      - name: Upload every diagnostic cell
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-install-${{ matrix.route }}-${{ matrix.cache }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chromium-install-diagnostics
          if-no-files-found: error
          retention-days: 14
