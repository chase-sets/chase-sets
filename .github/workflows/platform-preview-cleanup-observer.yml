name: Platform Preview Cleanup Observer

run-name: Platform Preview Cleanup Observer ${{ inputs.run_id || github.event.workflow_run.id }} attempt ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [Platform Preview Cleanup]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Platform Preview Cleanup run ID to observe
        required: true
        type: string
      run_attempt:
        description: Attempt number for the completed run
        required: true
        type: string
      dry_run:
        description: Log the planned alert without posting it
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: platform-preview-cleanup-observer-${{ inputs.run_id || github.event.workflow_run.id }}-${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe Platform Preview Cleanup
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: ./.github/actions/setup-pnpm-workspace

      - name: Observe completed scheduled cleanup attempt
        id: observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OBSERVED_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          OBSERVED_RUN_ATTEMPT: ${{ inputs.run_attempt || github.event.workflow_run.run_attempt }}
          OBSERVATION_PATH: artifacts/preview-cleanup-run-observation.json
        run: node scripts/preview-cleanup-run-observer.mjs observe

      - name: Alert when cleanup was not reported
        if: steps.observe.outputs.classification == 'unreported'
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Preview Cleanup
          alert-status: failure
          alert-summary: ${{ steps.observe.outputs.summary }}
          alert-details: ${{ steps.observe.outputs.details }}
          dry-run: ${{ inputs.dry_run || 'false' }}

      - name: Mark the observation as alerted
        if: steps.observe.outputs.classification == 'unreported' && inputs.dry_run != true
        env:
          OBSERVATION_PATH: artifacts/preview-cleanup-run-observation.json
        run: node scripts/preview-cleanup-run-observer.mjs mark-alerted

      - name: Upload cleanup observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-cleanup-run-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preview-cleanup-run-observation.json
          if-no-files-found: error
          retention-days: 14

      - name: Report observer failure
        if: failure()
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform Preview Cleanup Observer
          alert-status: failure
          alert-summary: The Platform Preview Cleanup Observer failed before recording a trustworthy observation.
