name: Platform Merge Qualification Observer

# Trusted observer for the separately triggered advisory workflow. It binds
# the exact repository/workflow/run/attempt, terminalizes missing evidence
# deterministically, and performs event-driven cleanup after every terminal
# advisory run. The scheduled sweep remains only the runner-loss backstop.
on:
  workflow_run:
    workflows: ["Platform PR", "Platform Merge Qualification Advisory"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: merge-qualification-observer
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Pending Qualification Attempts
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Inventory completed producer runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/merge-qualification-reconcile
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/actions/runs?workflow=platform-merge-qualification.yml&event=workflow_dispatch&per_page=100" \
            > artifacts/merge-qualification-reconcile/producer-runs.json
          echo "Reconcile inventory captured; workflow_run delivery remains the terminalization authority."

  inspect:
    name: Inspect Merge Qualification
    if: github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.display_title, 'Merge Qualification ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      provisioned: ${{ steps.prepare.outputs.provisioned }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Inspect complete advisory run evidence
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/merge-qualification
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" > artifacts/merge-qualification/run.json
          parent_run_id="$(jq -r '.display_title | capture("^Merge Qualification (?:merge_group|producer) (?<run>[1-9][0-9]{0,15})-(?<attempt>[1-9][0-9]{0,15})$").run' artifacts/merge-qualification/run.json)"
          parent_run_attempt="$(jq -r '.display_title | capture("^Merge Qualification (?:merge_group|producer) (?<run>[1-9][0-9]{0,15})-(?<attempt>[1-9][0-9]{0,15})$").attempt' artifacts/merge-qualification/run.json)"
          gh api "repos/${{ github.repository }}/actions/runs/${parent_run_id}" > artifacts/merge-qualification/parent-run.json
          if [ "$(jq -r '.repository.full_name' artifacts/merge-qualification/parent-run.json)" != "${{ github.repository }}" ] || \
             [ "$(jq -r '.path' artifacts/merge-qualification/parent-run.json)" != ".github/workflows/platform-pr.yml" ] || \
             [ "$(jq -r '.event' artifacts/merge-qualification/parent-run.json)" != "merge_group" ] || \
             [ "$(jq -r '.id' artifacts/merge-qualification/parent-run.json)" != "$parent_run_id" ] || \
             [ "$(jq -r '.run_attempt' artifacts/merge-qualification/parent-run.json)" != "$parent_run_attempt" ]; then
            echo "Parent merge-group run causal binding failed." >&2
            exit 1
          fi
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
            | jq '{total_count: .[0].total_count, jobs: [.[].jobs[]]}' > artifacts/merge-qualification/jobs.json
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | jq '{total_count: .[0].total_count, artifacts: [.[].artifacts[]]}' > artifacts/merge-qualification/run-artifacts.json
          for file in jobs run-artifacts; do
            total="$(jq -r '.total_count' "artifacts/merge-qualification/${file}.json")"
            field="jobs"
            if [ "$file" = "run-artifacts" ]; then field="artifacts"; fi
            observed="$(jq -r --arg field "$field" '.[$field] | length' "artifacts/merge-qualification/${file}.json")"
            if [ "$total" != "$observed" ]; then
              echo "${field} pagination returned ${observed}/${total}." >&2
              exit 1
            fi
          done
          candidate_name="merge-qualification-candidate-${parent_run_id}-${parent_run_attempt}"
          gh run download "$parent_run_id" --name "$candidate_name" --dir artifacts/merge-qualification/candidate || true
          observation_name="merge-qualification-observation-${RUN_ID}-${RUN_ATTEMPT}"
          observation_count="$(jq -r --arg name "$observation_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' artifacts/merge-qualification/run-artifacts.json)"
          if [ "$observation_count" -gt 1 ]; then exit 1; fi
          if [ "$observation_count" = "1" ]; then
            gh run download "$RUN_ID" --name "$observation_name" --dir artifacts/merge-qualification/observation
          fi
          decision_name="merge-qualification-decision-${RUN_ID}-${RUN_ATTEMPT}"
          if jq -e --arg name "$decision_name" '.artifacts[] | select(.name == $name and .expired == false)' \
            artifacts/merge-qualification/run-artifacts.json >/dev/null; then
            gh run download "$RUN_ID" --name "$decision_name" --dir artifacts/merge-qualification/decision
            echo "decision=artifacts/merge-qualification/decision/decision.json" >> "$GITHUB_OUTPUT"
          else
            revision="$(jq -r '.head_sha' artifacts/merge-qualification/run.json)"
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 1
            git fetch --no-tags origin "$revision"
            scope_name="merge-qualification-scope-${RUN_ID}-${RUN_ATTEMPT}"
            scope_count="$(jq -r --arg name "$scope_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' artifacts/merge-qualification/run-artifacts.json)"
            if [ "$scope_count" -gt 1 ]; then exit 1; fi
            if [ "$scope_count" = "1" ]; then
              gh run download "$RUN_ID" --name "$scope_name" --dir artifacts/merge-qualification/scope
            fi
            node ./scripts/merge-qualification.mjs recover-decision \
              --run artifacts/merge-qualification/run.json \
              --parent-run artifacts/merge-qualification/parent-run.json \
              --candidate-record artifacts/merge-qualification/candidate/candidate.json \
              --classifier-record artifacts/merge-qualification/scope/scope.json \
              --out artifacts/merge-qualification/decision/decision.json
            echo "decision=artifacts/merge-qualification/decision/decision.json" >> "$GITHUB_OUTPUT"
          fi
          provision_name="merge-gate-provisioning-${RUN_ID}-${RUN_ATTEMPT}"
          provision_count="$(jq -r --arg name "$provision_name" '[.artifacts[] | select(.name == $name and .expired == false)] | length' artifacts/merge-qualification/run-artifacts.json)"
          if [ "$provision_count" -gt 1 ]; then
            echo "Duplicate durable provisioning observations were found." >&2
            exit 1
          elif [ "$provision_count" = "1" ]; then
            gh run download "$RUN_ID" --name "$provision_name" --dir artifacts/merge-qualification/provisioning
            echo "provisioning_observation=artifacts/merge-qualification/provisioning/provisioning-observation.json" >> "$GITHUB_OUTPUT"
          else
            echo "provisioning_observation=" >> "$GITHUB_OUTPUT"
          fi

      - name: Recover exact cleanup ownership before terminalization
        id: prepare
        env:
          DECISION_PATH: ${{ steps.inspect.outputs.decision }}
          PROVISIONING_PATH: ${{ steps.inspect.outputs.provisioning_observation }}
        run: |
          set -euo pipefail
          decision_args=()
          if [ -n "$DECISION_PATH" ]; then decision_args=(--decision "$DECISION_PATH"); fi
          provisioning_args=()
          if [ -n "$PROVISIONING_PATH" ]; then provisioning_args=(--provisioning-observation "$PROVISIONING_PATH"); fi
          node ./scripts/merge-qualification.mjs prepare-cleanup \
            --run artifacts/merge-qualification/run.json \
            --parent-run artifacts/merge-qualification/parent-run.json \
            --jobs artifacts/merge-qualification/jobs.json \
            --run-artifacts artifacts/merge-qualification/run-artifacts.json \
            "${decision_args[@]}" \
            "${provisioning_args[@]}" \
            --repository "${{ github.repository }}" \
            --cleanup-ownership-out artifacts/merge-qualification/cleanup-ownership.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Upload inspected run evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-qualification-inspection-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            artifacts/merge-qualification/run.json
            artifacts/merge-qualification/parent-run.json
            artifacts/merge-qualification/jobs.json
            artifacts/merge-qualification/run-artifacts.json
            artifacts/merge-qualification/decision/decision.json
            artifacts/merge-qualification/candidate/candidate.json
            artifacts/merge-qualification/observation/observation.json
            artifacts/merge-qualification/provisioning/provisioning-observation.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact cleanup ownership
        if: steps.prepare.outputs.provisioned == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-qualification-cleanup-ownership-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: artifacts/merge-qualification/cleanup-ownership.json
          if-no-files-found: error
          retention-days: 30

  cleanup:
    name: Cleanup Merge Qualification Resources
    needs: inspect
    if: always() && needs.inspect.result == 'success' && needs.inspect.outputs.provisioned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: merge-gate
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Download exact cleanup ownership
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: merge-qualification-cleanup-ownership-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: artifacts/merge-qualification-cleanup/ownership

      - name: Validate observer cleanup credentials
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          EASYPOST_API_KEY: ${{ secrets.EASYPOST_API_KEY }}
          RELEASE_EVIDENCE_SPACES_ACCESS_ID: ${{ secrets.RELEASE_EVIDENCE_SPACES_ACCESS_ID }}
          RELEASE_EVIDENCE_SPACES_SECRET_KEY: ${{ secrets.RELEASE_EVIDENCE_SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          node ./scripts/merge-gate-verification.mjs credentials \
            --require "DIGITALOCEAN_ACCESS_TOKEN,STRIPE_SECRET_KEY,EASYPOST_API_KEY,RELEASE_EVIDENCE_SPACES_ACCESS_ID,RELEASE_EVIDENCE_SPACES_SECRET_KEY" \
            --stripe-test-mode-var STRIPE_SECRET_KEY

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Inspect complete cancelled-run identity
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/merge-qualification-cleanup
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" > artifacts/merge-qualification-cleanup/run.json
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs?filter=all&per_page=100" \
            | jq '{total_count: .[0].total_count, jobs: [.[].jobs[]]}' > artifacts/merge-qualification-cleanup/jobs.json
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | jq '{total_count: .[0].total_count, artifacts: [.[].artifacts[]]}' > artifacts/merge-qualification-cleanup/artifacts.json
          if [ "$(jq '.jobs | length' artifacts/merge-qualification-cleanup/jobs.json)" != "$(jq '.total_count' artifacts/merge-qualification-cleanup/jobs.json)" ] || \
             [ "$(jq '.artifacts | length' artifacts/merge-qualification-cleanup/artifacts.json)" != "$(jq '.total_count' artifacts/merge-qualification-cleanup/artifacts.json)" ]; then
            echo "Observer cleanup refused truncated jobs/artifacts." >&2
            exit 1
          fi
          decision_name="merge-qualification-decision-${RUN_ID}-${RUN_ATTEMPT}"
          if jq -e --arg name "$decision_name" '.artifacts[] | select(.name == $name and .expired == false)' \
            artifacts/merge-qualification-cleanup/artifacts.json >/dev/null; then
            gh run download "$RUN_ID" --name "$decision_name" --dir artifacts/merge-qualification-cleanup/decision
          fi

      - name: Configure observer Kubernetes context
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          MERGE_GATE_DOKS_CLUSTER: ${{ vars.MERGE_GATE_DOKS_CLUSTER || 'chase-sets-staging-doks' }}
        run: |
          set -euo pipefail
          kubeconfig="${RUNNER_TEMP}/merge-qualification-observer.kubeconfig"
          doctl kubernetes cluster kubeconfig show "$MERGE_GATE_DOKS_CLUSTER" > "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Verify exact cleanup target identity
        id: target
        run: |
          set -euo pipefail
          namespace="chase-sets-gate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}"
          if kubectl get namespace "$namespace" -o json > artifacts/merge-qualification-cleanup/namespace.json 2>/dev/null; then
            namespace_args=(--namespace artifacts/merge-qualification-cleanup/namespace.json)
          else
            namespace_args=()
          fi
          node ./scripts/merge-gate-verification.mjs cleanup-target \
            "${namespace_args[@]}" \
            --provisioning-observation artifacts/merge-qualification-cleanup/ownership/cleanup-ownership.json \
            --repository "${{ github.repository }}" \
            --workflow-id "${{ github.event.workflow_run.workflow_id }}" \
            --workflow-path ".github/workflows/platform-merge-qualification.yml" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --run-attempt "${{ github.event.workflow_run.run_attempt }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Delete exact gate provider webhooks
        if: always() && steps.target.outputs.provider_cleanup_allowed == 'true'
        env:
          PLATFORM_API_BASE_URL: https://gate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-marketplace.preview.chasesets.com
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          EASYPOST_API_KEY: ${{ secrets.EASYPOST_API_KEY }}
        run: |
          set -euo pipefail
          node ./scripts/provider-webhook-lifecycle.mjs delete --base-url "$PLATFORM_API_BASE_URL"

      - name: Persist cancelled post-identity attempt
        if: always() && github.event.workflow_run.conclusion == 'cancelled' && steps.target.outputs.provider_cleanup_allowed == 'true'
        env:
          RELEASE_EVIDENCE_SPACES_ACCESS_ID: ${{ secrets.RELEASE_EVIDENCE_SPACES_ACCESS_ID }}
          RELEASE_EVIDENCE_SPACES_SECRET_KEY: ${{ secrets.RELEASE_EVIDENCE_SPACES_SECRET_KEY }}
        run: |
          set -euo pipefail
          decision="artifacts/merge-qualification-cleanup/decision/decision.json"
          if [ ! -f "$decision" ]; then
            echo "Immutable resolution was observed but exact decision evidence is missing." >&2
            exit 1
          fi
          jq -n \
            --slurpfile decision "$decision" \
            --slurpfile observation artifacts/merge-qualification-cleanup/ownership/cleanup-ownership.json \
            --slurpfile run artifacts/merge-qualification-cleanup/run.json \
            '{schemaVersion:"release-qualification/v1",repository:$observation[0].repository,candidateSha:$observation[0].candidateSha,candidateTreeSha:$observation[0].candidateTreeSha,imageRepository:"registry.digitalocean.com/chase-sets/chase-sets-platform",imageDigest:$observation[0].imageDigest,qualificationLane:"merge-gate",classifierPolicyVersion:"release-qualification-scope/v1",runId:$observation[0].runId,runAttempt:$observation[0].runAttempt,startedAt:$decision[0].observedAt,completedAt:$run[0].updated_at,result:"fail",evidenceLinks:[$run[0].html_url]}' \
            > artifacts/merge-qualification-cleanup/cancelled-qualification.json
          node ./scripts/release-qualification-record.mjs write \
            --record artifacts/merge-qualification-cleanup/cancelled-qualification.json \
            --out artifacts/merge-qualification-cleanup/cancelled-qualification-write.json

      - name: Delete exact gate Kubernetes namespace
        if: always() && steps.target.outputs.namespace_cleanup_allowed == 'true'
        run: |
          set -euo pipefail
          kubectl delete namespace "${{ steps.target.outputs.namespace }}" --wait=true --timeout=10m
          if kubectl get namespace "${{ steps.target.outputs.namespace }}" >/dev/null 2>&1; then
            echo "Exact gate namespace still exists after deletion." >&2
            exit 1
          fi

      - name: Report cleanup no-op
        if: always() && steps.target.outputs.cleanup_status == 'absent'
        run: echo "No exact gate namespace exists; success/failure cleanup or early cancellation already left no resource."

  terminalize:
    name: Terminalize After Cleanup
    needs: [inspect, cleanup]
    if: always() && needs.inspect.result == 'success' && (needs.cleanup.result == 'success' || needs.cleanup.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: merge-qualification-inspection-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: artifacts/merge-qualification
      - name: Emit exact missing terminal result
        id: terminalize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          provisioning_args=()
          if [ -f artifacts/merge-qualification/provisioning/provisioning-observation.json ]; then
            provisioning_args=(--provisioning-observation artifacts/merge-qualification/provisioning/provisioning-observation.json)
          fi
          node ./scripts/merge-qualification.mjs terminalize \
            --run artifacts/merge-qualification/run.json \
            --parent-run artifacts/merge-qualification/parent-run.json \
            --jobs artifacts/merge-qualification/jobs.json \
            --run-artifacts artifacts/merge-qualification/run-artifacts.json \
            --decision artifacts/merge-qualification/decision/decision.json \
            --candidate-record artifacts/merge-qualification/candidate/candidate.json \
            --observation artifacts/merge-qualification/observation/observation.json \
            "${provisioning_args[@]}" \
            --repository "${{ github.repository }}" \
            --out artifacts/merge-qualification/event.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Upload deterministic terminal event
        if: steps.terminalize.outputs.event_written == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-qualification-terminal-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: artifacts/merge-qualification/event.json
          if-no-files-found: error
          retention-days: 30
