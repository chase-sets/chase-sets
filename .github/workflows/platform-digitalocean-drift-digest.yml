name: Platform DigitalOcean Drift Digest

on:
  schedule:
    - cron: "47 10 * * 2"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: platform-digitalocean-drift-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Build DigitalOcean Drift Digest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      issues: write
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_READONLY_TOKEN }}
      DIGITALOCEAN_DRIFT_RESTORE_POINT_HOLD_NAMES: ${{ vars.PRODUCTION_DB_RESTORE_POINT_CLEANUP_HOLD_NAMES || '' }}
      PLATFORM_IMAGE_REPOSITORY: chase-sets-platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          token: ${{ secrets.DIGITALOCEAN_READONLY_TOKEN }}

      - name: Build drift digest
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-health

          node ./scripts/digitalocean-drift-digest.mjs \
            --repository="${PLATFORM_IMAGE_REPOSITORY}" \
            --out artifacts/release-health/digitalocean-drift-digest.json

      - name: Summarize drift digest
        if: ${{ always() }}
        run: |
          set -euo pipefail
          record="artifacts/release-health/digitalocean-drift-digest.json"
          if [ ! -f "$record" ]; then
            echo "No DigitalOcean drift digest was written." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node - "$record" >> "$GITHUB_STEP_SUMMARY" <<'NODE'
          const fs = require("node:fs");
          const record = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const summary = record.summary ?? {};
          const restorePointHolds = record.policies?.restorePointHolds ?? {};
          console.log("## DigitalOcean Drift Digest");
          console.log("");
          console.log(`- Result: ${record.result}`);
          console.log(`- Mode: ${record.mode}`);
          console.log(`- Observed resources: ${summary.observedResources ?? 0}`);
          console.log(`- Terraform-managed resources: ${summary.terraformManagedResources ?? 0}`);
          console.log(`- Unknown Chase Sets resources: ${summary.unknownChaseSetsResources ?? 0}`);
          console.log(`- Cleanup candidates: ${summary.cleanupCandidates ?? 0}`);
          console.log(`- Held restore points: ${summary.heldRestorePoints ?? 0}`);
          console.log(`- Advisory findings: ${summary.advisoryFindings ?? 0}`);
          console.log(`- Warning findings: ${summary.warningFindings ?? 0}`);
          console.log(`- Collection errors: ${summary.collectionErrors ?? 0}`);
          console.log(`- Restore point hold authority: ${restorePointHolds.status ?? "absent"}`);
          console.log(`- Restore point hold tokens: ${restorePointHolds.tokenCount ?? 0}`);
          console.log(`- Restore point holds applied: ${restorePointHolds.appliedCount ?? 0}`);
          console.log(`- Restore point holds unmatched: ${restorePointHolds.unmatchedCount ?? 0}`);
          console.log(`- Restore point hold fingerprint: ${restorePointHolds.effectiveTokenSetSha256 ?? "none"}`);
          if (record.findings?.length) {
            console.log("");
            console.log("### Findings");
            for (const finding of record.findings.slice(0, 20)) {
              console.log(`- [${finding.severity}] ${finding.category}: ${finding.resourceType} ${finding.resourceName}`);
            }
          }
          NODE

      - name: Upload drift digest artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-digitalocean-drift-digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-health/digitalocean-drift-digest.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Classify drift digest alert
        id: drift-alert
        if: ${{ always() }}
        run: |
          set -euo pipefail
          record="artifacts/release-health/digitalocean-drift-digest.json"
          if [ ! -f "$record" ]; then
            echo "status=none" >> "$GITHUB_OUTPUT"
            echo "summary=No drift digest artifact was written." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node - "$record" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const record = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const warningFindings = record.summary?.warningFindings ?? 0;
          const collectionErrors = record.summary?.collectionErrors ?? 0;
          if (warningFindings > 0 || collectionErrors > 0 || record.result === "warning") {
            console.log("status=warning");
          } else {
            console.log("status=success");
          }
          console.log(
            `summary=Warning findings: ${warningFindings}; collection errors: ${collectionErrors}; result: ${record.result}.`,
          );
          NODE

      - name: Report drift digest warning
        if: ${{ !failure() && steps.drift-alert.outputs.status == 'warning' }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform DigitalOcean Drift Digest
          alert-status: warning
          alert-summary: ${{ steps.drift-alert.outputs.summary }}
          alert-details: See the drift digest artifact for support-safe finding details.

      - name: Report drift digest failure
        if: ${{ failure() }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform DigitalOcean Drift Digest
          alert-status: failure
          alert-summary: Platform DigitalOcean drift digest failed before producing a clean result.

      - name: Report drift digest recovery
        if: ${{ success() && steps.drift-alert.outputs.status == 'success' }}
        uses: ./.github/actions/report-scheduled-workflow-alert
        with:
          github-token: ${{ github.token }}
          workflow-name: Platform DigitalOcean Drift Digest
          alert-status: success
          alert-summary: Platform DigitalOcean drift digest completed without warning findings.
