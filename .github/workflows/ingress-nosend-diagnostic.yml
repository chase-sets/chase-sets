name: Ingress No-Send Diagnostic

on:
  push:
    branches: [host/10678-ingress-nosend-diagnostic]

permissions:
  contents: read

concurrency:
  group: ingress-nosend-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingress-nosend-diagnostic:
    name: Ingress No-Send Diagnostic
    if: >-
      github.event_name == 'push' &&
      github.repository == 'chase-sets/chase-sets' &&
      github.ref == 'refs/heads/host/10678-ingress-nosend-diagnostic' &&
      github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Host supplies this independently reviewed digest, never a hash accepted from the checkout.
      DIAGNOSTIC_FREEZE_SHA256: ${{ vars.INGRESS_NOSEND_FREEZE_SHA256 }}
      DIAGNOSTIC_FREEZE_JSON: ${{ vars.INGRESS_NOSEND_FREEZE_JSON }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate bootstrap only without measurement
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          trap 'if [ "$?" -ne 0 ]; then printf "%s\n" "BOOTSTRAP_ONLY_PROCESS_FAILED stage=SHELL_EXEC category=OTHER MEASUREMENT_NOT_EXECUTED rows=0" >&2; fi' EXIT
          if ! bootstrap_node="$(command -v node)"; then
            printf '%s\n' 'BOOTSTRAP_ONLY_REFUSED stage=SHELL_NODE category=OTHER MEASUREMENT_NOT_EXECUTED rows=0' >&2
            exit 1
          fi
          env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_JOB="$GITHUB_JOB" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" RUNNER_TEMP="$RUNNER_TEMP" ImageVersion="$ImageVersion" ImageOS="$ImageOS" \
            DIAGNOSTIC_FREEZE_JSON="$DIAGNOSTIC_FREEZE_JSON" DIAGNOSTIC_FREEZE_SHA256="$DIAGNOSTIC_FREEZE_SHA256" \
            "$bootstrap_node" --input-type=module 2>/dev/null <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const stages = Object.freeze(['MODULE_IMPORT', 'PROTOCOL_READ', 'PROTOCOL_PARSE', 'HOSTED_CONTEXT', 'ENVELOPE_READ', 'ENVELOPE_SIZE', 'ENVELOPE_DECODE', 'TEMP_RESOLVE', 'ROOT_RESOLVE', 'EXTERNAL_LOCATION', 'AUTHORITY_DIRECTORY', 'AUTHORITY_WRITE', 'AUTHORITY_VALIDATE', 'MEASUREMENT_CONFIG', 'BOOTSTRAP_TOOLS', 'STOCK_EXECUTABLES', 'IDENTITY_OBSERVE', 'IDENTITY_COMPARE', 'DISK_HEAD_QUERY', 'DISK_HEAD_COMPARE', 'SUCCESS_REPORT']);
          let stage = 'MODULE_IMPORT';
          let comparison;
          let api;
          const at = (id, operation) => {
            stage = stages.includes(id) ? id : 'MODULE_IMPORT';
            return operation();
          };
          const category = (error) => {
            try {
              if (!(error instanceof Error)) return 'OTHER';
              const descriptor = Object.getOwnPropertyDescriptor(error, 'message');
              const value = descriptor?.value;
              const codes = [...(api?.inventoryRefusalCodes ?? []), ...(api?.bootstrapComparisonCodes ?? []), 'DISK_HEAD_MISMATCH', 'AUTHORITY_PHASE_MISMATCH', 'ENVELOPE_SIZE_REFUSED', 'EXTERNAL_AUTHORITY_REQUIRED'];
              return codes.find((code) => code === value) ?? 'OTHER';
            } catch { return 'OTHER'; }
          };
          try {
            api = await at('MODULE_IMPORT', () => import('./scripts/test-support/10678-ingress-nosend/inventory.mjs'));
            comparison = api.createBootstrapComparison();
            const protocolBytes = at('PROTOCOL_READ', () => readFileSync('scripts/test-support/10678-ingress-nosend/protocol.json', 'utf8'));
            const protocol = at('PROTOCOL_PARSE', () => JSON.parse(protocolBytes));
            const event = at('HOSTED_CONTEXT', () => api.hostedContext(protocol));
            const raw = at('ENVELOPE_READ', () => Buffer.from(process.env.DIAGNOSTIC_FREEZE_JSON ?? '', 'utf8'));
            at('ENVELOPE_SIZE', () => assert(raw.length > 0 && raw.length <= api.maximumEnvelopeBytes, 'ENVELOPE_SIZE_REFUSED'));
            at('ENVELOPE_DECODE', () => api.decodeAuthority(raw, process.env.DIAGNOSTIC_FREEZE_SHA256, { head: event.head, phase: 'inventory', protocol }));
            const temp = at('TEMP_RESOLVE', () => realpathSync(process.env.RUNNER_TEMP));
            const root = at('ROOT_RESOLVE', () => realpathSync('.'));
            at('EXTERNAL_LOCATION', () => assert(temp !== root && !temp.startsWith(`${root}/`), 'EXTERNAL_AUTHORITY_REQUIRED'));
            const dir = path.join(temp, '10678-authority');
            at('AUTHORITY_DIRECTORY', () => mkdirSync(dir, { mode: 0o700 }));
            const file = path.join(dir, 'freeze.json');
            at('AUTHORITY_WRITE', () => writeFileSync(file, raw, { flag: 'wx', mode: 0o600 }));
            const authority = at('AUTHORITY_VALIDATE', () => api.readAuthority(file, process.env.DIAGNOSTIC_FREEZE_SHA256, { head: event.head, phase: 'inventory', protocol }));
            const config = at('MEASUREMENT_CONFIG', () => api.measurementConfig(authority.config));
            const tools = at('BOOTSTRAP_TOOLS', () => api.bootstrapTools(config));
            at('STOCK_EXECUTABLES', () => api.enforceExecutables(tools, api.stockTools, false, comparison));
            const actual = at('IDENTITY_OBSERVE', () => api.observeIdentity(path.join(dir, 'bootstrap-identity'), tools));
            at('IDENTITY_COMPARE', () => api.enforceIdentityPins(config, actual, true, comparison));
            const head = at('DISK_HEAD_QUERY', () => spawnSync(tools.git.path, ['rev-parse', 'HEAD'], { env: { PATH: '/usr/bin:/bin', HOME: dir }, encoding: 'utf8', shell: false }));
            at('DISK_HEAD_COMPARE', () => assert(head.status === 0 && head.stdout.trim() === config.head, 'DISK_HEAD_MISMATCH'));
            at('SUCCESS_REPORT', () => console.log('BOOTSTRAP_ONLY_COMPLETE MEASUREMENT_NOT_EXECUTED rows=0'));
          } catch (error) {
            const recognized = category(error);
            const code = api?.bootstrapComparisonCodes.includes(recognized) ? api.bootstrapComparisonCategory(comparison, error) : recognized;
            let context = 'component=OTHER predicate=OTHER';
            if (code !== 'OTHER' && (stage === 'STOCK_EXECUTABLES' || stage === 'IDENTITY_COMPARE')) {
              try { context = api.bootstrapComparisonResult(comparison); } catch {}
            }
            console.log(`BOOTSTRAP_ONLY_REFUSED stage=${stage} category=${code} ${context} MEASUREMENT_NOT_EXECUTED rows=0`);
            process.exitCode = 1;
          }
          NODE
