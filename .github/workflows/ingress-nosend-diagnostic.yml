name: Ingress No-Send Diagnostic

on:
  push:
    branches: [host/10678-ingress-nosend-diagnostic]

permissions:
  contents: read

concurrency:
  group: ingress-nosend-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingress-nosend-diagnostic:
    name: Ingress No-Send Diagnostic
    if: >-
      github.event_name == 'push' &&
      github.repository == 'chase-sets/chase-sets' &&
      github.ref == 'refs/heads/host/10678-ingress-nosend-diagnostic' &&
      github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Host supplies this independently reviewed digest, never a hash accepted from the checkout.
      DIAGNOSTIC_FREEZE_SHA256: ${{ vars.INGRESS_NOSEND_FREEZE_SHA256 }}
      DIAGNOSTIC_FREEZE_JSON: ${{ vars.INGRESS_NOSEND_FREEZE_JSON }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate external authority and select exactly one phase
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_node="$(command -v node)"
          env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_JOB="$GITHUB_JOB" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" RUNNER_TEMP="$RUNNER_TEMP" ImageVersion="$ImageVersion" ImageOS="$ImageOS" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" DIAGNOSTIC_FREEZE_JSON="$DIAGNOSTIC_FREEZE_JSON" DIAGNOSTIC_FREEZE_SHA256="$DIAGNOSTIC_FREEZE_SHA256" \
            "$bootstrap_node" --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { appendFileSync, mkdirSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { bootstrapTools, decodeAuthority, enforceExecutables, enforceIdentityPins, hostedContext, maximumEnvelopeBytes, observeIdentity, readAuthority, stockTools } from './scripts/test-support/10678-ingress-nosend/inventory.mjs';
          try {
          const protocol = JSON.parse(readFileSync('scripts/test-support/10678-ingress-nosend/protocol.json', 'utf8'));
          const event = hostedContext(protocol);
          const raw = Buffer.from(process.env.DIAGNOSTIC_FREEZE_JSON ?? '', 'utf8');
          assert(raw.length > 0 && raw.length <= maximumEnvelopeBytes, 'ENVELOPE_SIZE_REFUSED');
          decodeAuthority(raw, process.env.DIAGNOSTIC_FREEZE_SHA256, { head: event.head, protocol });
          const temp = realpathSync(process.env.RUNNER_TEMP);
          const root = realpathSync('.');
          assert(temp !== root && !temp.startsWith(`${root}/`), 'EXTERNAL_AUTHORITY_REQUIRED');
          const dir = path.join(temp, '10678-authority');
          mkdirSync(dir, { mode: 0o700 });
          const file = path.join(dir, 'freeze.json');
          writeFileSync(file, raw, { flag: 'wx', mode: 0o600 });
          const authority = readAuthority(file, process.env.DIAGNOSTIC_FREEZE_SHA256, { head: event.head, protocol });
          if (authority.config.phase === 'measurement') {
            enforceExecutables(bootstrapTools(authority.config), stockTools, false);
            const actual = observeIdentity(path.join(dir, 'bootstrap-identity'), bootstrapTools(authority.config));
            enforceIdentityPins(authority.config, actual, true);
          }
          const head = spawnSync(authority.config.phase === 'measurement' ? bootstrapTools(authority.config).git.path : '/usr/bin/git', ['rev-parse', 'HEAD'], { env: { PATH: '/usr/bin:/bin', HOME: dir }, encoding: 'utf8', shell: false });
          assert(head.status === 0 && head.stdout.trim() === authority.config.head, 'DISK_HEAD_MISMATCH');
          appendFileSync(process.env.GITHUB_OUTPUT, `phase=${authority.config.phase}\nnode=${process.execPath}\n`);
          } catch {
            console.error('AUTHORITY_BOOTSTRAP_REFUSED');
            process.exitCode = 1;
          }
          NODE

      - name: Collect read-only inventory without measurement
        id: inventory
        if: steps.authority.outputs.phase == 'inventory'
        shell: bash
        env:
          BOOTSTRAP_NODE: ${{ steps.authority.outputs.node }}
        run: |
          env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_JOB="$GITHUB_JOB" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" RUNNER_TEMP="$RUNNER_TEMP" ImageVersion="$ImageVersion" ImageOS="$ImageOS" \
            DIAGNOSTIC_FREEZE_SHA256="$DIAGNOSTIC_FREEZE_SHA256" \
            "$BOOTSTRAP_NODE" scripts/test-support/10678-ingress-nosend/inventory.mjs "$RUNNER_TEMP/10678-authority/freeze.json"

      - name: Prepare reviewed public prerequisites
        if: steps.authority.outputs.phase == 'measurement'
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          cache="$RUNNER_TEMP/10678-public-prefetch"
          mkdir -m 700 "$cache" "$RUNNER_TEMP/10678-bootstrap-home"
          export HOME="$RUNNER_TEMP/10678-bootstrap-home"
          download() {
            curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --noproxy '*' "$1" --output "$2"
            printf '%s  %s\n' "$3" "$2" | sha256sum --check --status
          }
          download https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.gz "$cache/node.tgz" 361718c444e49af2ca5a110c83ba6a8901143f23ab285ebbef0341f391f482a9
          tar -xzf "$cache/node.tgz" -C "$cache" node-v24.22.2-linux-x64/bin/node
          printf '%s  %s\n' 904a6d3484241d466989f9df9ba3aab822b1496191bdb28230eb491a55c32a52 "$cache/node-v24.22.2-linux-x64/bin/node" | sha256sum --check --status
          sudo -n install -m 755 "$cache/node-v24.22.2-linux-x64/bin/node" /usr/local/bin/node
          download https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64 "$cache/kind" b89aada5a39d620da3fcd16435b7f28d858927dd53f92cbac77686b0588b600d
          download https://get.helm.sh/helm-v3.16.2-linux-amd64.tar.gz "$cache/helm.tgz" 9318379b847e333460d33d291d4c088156299a26cd93d570a7f5d0c36e50b5bb
          tar -xzf "$cache/helm.tgz" -C "$cache" linux-amd64/helm
          printf '%s  %s\n' 2eead53d95473a37d72937e8e3aed5d964271685f3dac5b76955867818c040f4 "$cache/linux-amd64/helm" | sha256sum --check --status
          download https://dl.k8s.io/release/v1.30.4/bin/linux/amd64/kubectl "$cache/kubectl" 2ffd023712bbc1a9390dbd8c0c15201c165a69d394787ef03eda3eccb4b9ac06
          download https://github.com/mikefarah/yq/releases/download/v4.54.2/yq_linux_amd64 "$cache/yq" 44c7759059b4910827a0059a2757b22001e59360cdecdb2ef8dedc4b6c7e9f32
          download https://registry.npmjs.org/pnpm/-/pnpm-11.0.9.tgz "$cache/pnpm.tgz" 4d84d7b0e31c9054f61658795698070007d03b7238481e2161a562557aa90834
          download https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.28.1.tgz "$cache/esbuild.tgz" 9ed00ab5330c94386f3273eda99a1fb0e8f37cfd6cb5270e4ad2fe3527da3546
          mkdir "$cache/pnpm" "$cache/esbuild"
          tar -xzf "$cache/pnpm.tgz" -C "$cache/pnpm"
          tar -xzf "$cache/esbuild.tgz" -C "$cache/esbuild" package/bin/esbuild
          printf '%s  %s\n' 67b035e322203961795e8e34ca63a08c37a4386eda94107fb3d28f3246d882ad "$cache/pnpm/package/bin/pnpm.cjs" | sha256sum --check --status
          printf '%s  %s\n' 0c6588b092a2c291a72bab90659f3c9e0e25e0fe59c9ac12b4dae4d945e5548c "$cache/esbuild/package/bin/esbuild" | sha256sum --check --status
          sudo -n install -m 755 "$cache/kind" /usr/local/bin/kind
          sudo -n install -m 755 "$cache/linux-amd64/helm" /usr/local/bin/helm
          sudo -n install -m 755 "$cache/kubectl" /usr/local/bin/kubectl
          sudo -n install -m 755 "$cache/yq" /usr/local/bin/yq
          sudo -n install -m 755 "$cache/esbuild/package/bin/esbuild" /usr/local/bin/esbuild
          sudo -n cp -R "$cache/pnpm/package" /opt/10678-pnpm
          sudo -n chmod 755 /opt/10678-pnpm/bin/pnpm.cjs
          download https://github.com/kubernetes/ingress-nginx/releases/download/helm-chart-4.11.3/ingress-nginx-4.11.3.tgz "$cache/ingress-nginx-4.11.3.tgz" a9f371489a6c18042508c0b5c2ea669deaad7ccc08f37efc4522e336edda1c20
          sudo -n install -d -m 755 /opt/10678-inputs
          sudo -n install -m 644 "$cache/ingress-nginx-4.11.3.tgz" /opt/10678-inputs/ingress-nginx-4.11.3.tgz

      - name: Prepare isolated diagnostic
        if: steps.authority.outputs.phase == 'measurement'
        shell: bash
        run: |
          env -i PATH=/usr/local/bin:/usr/bin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_JOB="$GITHUB_JOB" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" RUNNER_TEMP="$RUNNER_TEMP" ImageVersion="$ImageVersion" ImageOS="$ImageOS" DIAGNOSTIC_FREEZE_SHA256="$DIAGNOSTIC_FREEZE_SHA256" \
            /usr/local/bin/node scripts/test-support/10678-ingress-nosend/runner.mjs prepare "$RUNNER_TEMP/10678-authority/freeze.json"

      - name: Measure fixed serial protocol
        if: steps.authority.outputs.phase == 'measurement'
        timeout-minutes: 10
        shell: bash
        run: |
          env -i PATH=/usr/local/bin:/usr/bin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_JOB="$GITHUB_JOB" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" RUNNER_TEMP="$RUNNER_TEMP" ImageVersion="$ImageVersion" ImageOS="$ImageOS" DIAGNOSTIC_FREEZE_SHA256="$DIAGNOSTIC_FREEZE_SHA256" \
            /usr/local/bin/node scripts/test-support/10678-ingress-nosend/runner.mjs measure "$RUNNER_TEMP/10678-authority/freeze.json"

      - name: Seal private capture
        id: seal
        if: always() && steps.authority.outcome == 'success' && steps.authority.outputs.phase == 'measurement'
        shell: bash
        run: |
          env -i PATH=/usr/local/bin:/usr/bin:/bin \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_JOB="$GITHUB_JOB" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" RUNNER_TEMP="$RUNNER_TEMP" ImageVersion="$ImageVersion" ImageOS="$ImageOS" DIAGNOSTIC_FREEZE_SHA256="$DIAGNOSTIC_FREEZE_SHA256" \
            /usr/local/bin/node scripts/test-support/10678-ingress-nosend/runner.mjs seal "$RUNNER_TEMP/10678-authority/freeze.json"

      - name: Verify publication gate and complete raw manifest
        id: publication
        if: always() && steps.seal.outcome == 'success'
        shell: bash
        run: |
          env -i PATH=/usr/local/bin:/usr/bin:/bin RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" /usr/local/bin/node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, lstatSync, readFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const run = process.env.GITHUB_RUN_ID;
          const attempt = process.env.GITHUB_RUN_ATTEMPT;
          const dir = path.join(process.env.RUNNER_TEMP, '10678-ingress-nosend', `${run}-${attempt}`, 'diagnostic');
          assert(lstatSync(dir).isDirectory() && !lstatSync(dir).isSymbolicLink());
          const names = readdirSync(dir).sort();
          for (const name of names) assert(lstatSync(path.join(dir, name)).isFile() && !lstatSync(path.join(dir, name)).isSymbolicLink());
          const gate = JSON.parse(readFileSync(path.join(dir, 'publication-gate.json'), 'utf8'));
          assert(gate.publish === true && gate.complete === true && gate.captureComplete === true && gate.scan === 'NO_HITS');
          assert.deepEqual(gate.hits, []);
          const raw = readFileSync(path.join(dir, 'raw-manifest.json'));
          assert.equal(hash(raw), gate.manifestSha256);
          const manifest = JSON.parse(raw);
          assert.equal(manifest.run, run);
          assert.equal(manifest.attempt, attempt);
          assert.deepEqual(manifest.files.map((entry) => entry.file).sort(), names.filter((name) => !['raw-manifest.json', 'publication-gate.json'].includes(name)));
          for (const entry of manifest.files) {
            assert.equal(path.basename(entry.file), entry.file);
            const bytes = readFileSync(path.join(dir, entry.file));
            assert.equal(bytes.length, entry.bytes);
            assert.equal(hash(bytes), entry.sha256);
          }
          assert.equal(hash(readFileSync(path.join(dir, 'receipt.json'))), manifest.receiptSha256);
          appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          NODE

      - name: Upload sealed diagnostic only
        id: upload
        if: always() && steps.seal.outcome == 'success' && steps.publication.outcome == 'success' && steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingress-nosend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/10678-ingress-nosend/${{ github.run_id }}-${{ github.run_attempt }}/diagnostic
          if-no-files-found: error

      - name: Verify typed inventory manifest and private scan gate
        id: inventory-publication
        if: always() && steps.authority.outputs.phase == 'inventory' && steps.inventory.outcome == 'success'
        shell: bash
        env:
          BOOTSTRAP_NODE: ${{ steps.authority.outputs.node }}
        run: |
          env -i PATH=/usr/local/bin:/usr/bin:/bin RUNNER_TEMP="$RUNNER_TEMP" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" DIAGNOSTIC_FREEZE_SHA256="$DIAGNOSTIC_FREEZE_SHA256" "$BOOTSTRAP_NODE" --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFileSync, lstatSync, readFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';
          import { validateInventoryPublication } from './scripts/test-support/10678-ingress-nosend/inventory.mjs';
          const hash = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const run = process.env.GITHUB_RUN_ID;
          const attempt = process.env.GITHUB_RUN_ATTEMPT;
          const dir = path.join(process.env.RUNNER_TEMP, '10678-inventory', `${run}-${attempt}`, 'inventory');
          assert(lstatSync(dir).isDirectory() && !lstatSync(dir).isSymbolicLink());
          const names = readdirSync(dir).sort();
          for (const name of names) assert(lstatSync(path.join(dir, name)).isFile() && !lstatSync(path.join(dir, name)).isSymbolicLink());
          const receipt = JSON.parse(readFileSync(path.join(dir, 'preparation-receipt.json'), 'utf8'));
          const gate = JSON.parse(readFileSync(path.join(dir, 'inventory-publication-gate.json'), 'utf8'));
          validateInventoryPublication(receipt, gate);
          assert.equal(receipt.run, run);
          assert.equal(receipt.attempt, attempt);
          assert.equal(receipt.authority.envelopeSha256, process.env.DIAGNOSTIC_FREEZE_SHA256);
          const raw = readFileSync(path.join(dir, 'inventory-manifest.json'));
          assert.equal(hash(raw), gate.manifestSha256);
          const manifest = JSON.parse(raw);
          assert.equal(manifest.schema, '10678-inventory-manifest/v1');
          assert.equal(manifest.phase, 'inventory');
          assert.equal(manifest.run, run);
          assert.equal(manifest.attempt, attempt);
          assert.deepEqual(manifest.files.map((entry) => entry.file).sort(), names.filter((name) => !['inventory-manifest.json', 'inventory-publication-gate.json'].includes(name)));
          for (const entry of manifest.files) {
            assert.equal(path.basename(entry.file), entry.file);
            const bytes = readFileSync(path.join(dir, entry.file));
            assert.equal(bytes.length, entry.bytes);
            assert.equal(hash(bytes), entry.sha256);
          }
          assert.equal(hash(readFileSync(path.join(dir, 'preparation-receipt.json'))), manifest.receiptSha256);
          appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          NODE

      - name: Upload read-only inventory only
        id: inventory-upload
        if: always() && steps.inventory.outcome == 'success' && steps.inventory-publication.outcome == 'success' && steps.inventory-publication.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingress-nosend-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/10678-inventory/${{ github.run_id }}-${{ github.run_attempt }}/inventory
          if-no-files-found: error
