name: Collections Cutover Authority Capture

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected environment to capture read-only.
        type: choice
        required: true
        options: [staging, production]
      approval_reference:
        description: Required for production, the repository issue URL that authorizes this capture.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: collections-cutover-authority-capture-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Admit capture target
        id: admit
        env:
          CAPTURE_TARGET: ${{ inputs.target }}
          CAPTURE_APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          case "$CAPTURE_TARGET" in
            staging) ;;
            production)
              issue_prefix="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/"
              issue_number="${CAPTURE_APPROVAL_REFERENCE#"$issue_prefix"}"
              if [ "$issue_number" = "$CAPTURE_APPROVAL_REFERENCE" ] || [[ ! "$issue_number" =~ ^[1-9][0-9]*$ ]]; then
                echo "Production capture requires approval_reference to be an issue URL in ${GITHUB_REPOSITORY}." >&2
                exit 1
              fi
              echo "Accepted production approval reference: ${CAPTURE_APPROVAL_REFERENCE}"
              ;;
            *)
              echo "Unsupported capture target." >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
        env:
          NODE_OPTIONS: --no-deprecation

      # Install only: doctl reads DIGITALOCEAN_ACCESS_TOKEN from the one step that uses it.
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          no_auth: "true"

      - name: Export Collections database authority
        uses: ./.github/actions/export-managed-postgres-authority
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        with:
          environment: ${{ inputs.target }}
          contexts: collections
          connection-mode: direct

      - name: Configure Kubernetes context
        working-directory: infrastructure/digitalocean/doks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          CAPTURE_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          ../../../scripts/terraform-init-with-retry.sh \
            -backend-config=bucket=chase-sets-terraform-state \
            -backend-config="key=doks/${CAPTURE_TARGET}.tfstate" \
            -backend-config=region=us-east-1 \
            -backend-config='endpoints={s3="https://nyc3.digitaloceanspaces.com"}' \
            -backend-config=skip_credentials_validation=true \
            -backend-config=skip_metadata_api_check=true \
            -backend-config=skip_region_validation=true \
            -backend-config=skip_requesting_account_id=true \
            -backend-config=use_path_style=true \
            -backend-config=use_lockfile=true
          cluster_id="$(terraform output -raw cluster_id)"
          kubeconfig="${RUNNER_TEMP}/collections-cutover-authority-capture.kubeconfig"
          (umask 077 && doctl kubernetes cluster kubeconfig show "$cluster_id" > "$kubeconfig")
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Capture Collections cutover authority
        if: ${{ !cancelled() && steps.admit.outcome == 'success' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          CAPTURE_TARGET: ${{ inputs.target }}
        run: node scripts/collections-cutover-authority-capture.mjs --target "$CAPTURE_TARGET" --out artifacts/collections-cutover-authority-capture/capture.json

      - name: Remove managed Postgres CA, kubeconfig and pulled state
        if: always()
        env:
          CAPTURE_TARGET: ${{ inputs.target }}
        run: |
          rm -f -- "${RUNNER_TEMP}/collections-cutover-authority-capture.kubeconfig"
          rm -f -- "${RUNNER_TEMP}/platform-${CAPTURE_TARGET}.tfstate.json"
          if [ -n "${PGSSLROOTCERT:-}" ]; then rm -f -- "$PGSSLROOTCERT"; fi

      - name: Retain capture
        if: ${{ always() && steps.admit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collections-cutover-authority-capture-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/collections-cutover-authority-capture/capture.json
          if-no-files-found: error
          retention-days: 14
