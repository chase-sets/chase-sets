name: Catalog Staging Provider UAT

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character commit SHA for this run.
        required: true
        type: string
      confirm:
        description: Type "run catalog staging provider uat" to queue provider syncs from the staging UI.
        required: true
        type: string
      admin_web_url:
        description: Staging admin-web origin.
        required: true
        default: https://admin.staging.chasesets.com
        type: string
      journey_scope:
        description: Provider journey set to run.
        required: true
        default: one-piece-launch
        type: choice
        options:
          - one-piece-launch
          - lorcana-launch
          - all-provider-regression
          - staging-representative-catalog
          - pokemon-matrix
          - mtg-matrix
          - yugioh-matrix
          - one-piece-matrix
          - lorcana-matrix
          - full-matrix-uat
          - m50-final-proof
          - scope-sync-batch-preview-probe
          - full-game-start
          - full-game-settle
          - scope-sync-count-lifecycle
          - scrydex-cache-capture
          - scrydex-coordinate-preview
          - scrydex-force-refresh-bounded
          - admin-origin-generate-probe
      scratch_parent:
        description: Admin-origin generate probe only. Existing admitted job parent id; no scratch setup is performed.
        required: false
        default: ""
        type: string
      capture_dispatch_id:
        description: Count lifecycle only. Canonical host dispatch with server-bound spend and review authority.
        required: false
        default: ""
        type: string
      capture_scope_record_id:
        description: Count lifecycle only. Existing admitted Romance Dawn OP01 English scope record.
        required: false
        default: ""
        type: string
      capture_authority:
        description: Count lifecycle only. JSON host authority envelope bound to this reviewed dispatch.
        required: false
        default: ""
        type: string
      product_domain:
        description: full-game-start only. Catalog Scope product domain to batch, e.g. one-piece.
        required: false
        default: ""
        type: string
      language_code:
        description: full-game-start only. Optional language code; blank batches every language.
        required: false
        default: ""
        type: string
      budget:
        description: full-game-start only. Comma-separated key=value overrides of maxScopesPerTurn, tcgdexRequestLimit, scrydexRateRequestLimit, scrydexRequestLimit, providerFailureThreshold.
        required: false
        default: ""
        type: string
      batch_id:
        description: full-game-settle only. The Scope Sync Batch id the start journey returned.
        required: false
        default: ""
        type: string
      retry_failed:
        description: full-game-settle only. Retry each failed unit once in this dispatch.
        required: false
        default: false
        type: boolean
      resume_cancelled:
        description: full-game-settle only. Resume the batch when it is cancelled.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: platform-staging-mutating-operations
  cancel-in-progress: false

jobs:
  admit-reviewed-sha:
    name: Admit Reviewed Immutable SHA
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation and immutable SHA
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUN_SHA: ${{ github.sha }}
          CONFIRMATION: ${{ inputs.confirm }}
          JOURNEY_SCOPE: ${{ inputs.journey_scope }}
          ADMIN_WEB_URL: ${{ inputs.admin_web_url }}
          SCRATCH_PARENT: ${{ inputs.scratch_parent }}
        with:
          script: |
            const expected = process.env.EXPECTED_SHA ?? '';
            if (process.env.CONFIRMATION !== 'run catalog staging provider uat' ||
                !/^[a-fA-F0-9]{40}$/.test(expected) ||
                expected.toLowerCase() !== process.env.RUN_SHA) {
              core.setFailed('Confirmation and exact immutable expected_sha are required.');
            }
            if (['full-game-start', 'full-game-settle', 'scope-sync-count-lifecycle', 'scrydex-cache-capture', 'scrydex-coordinate-preview', 'scrydex-force-refresh-bounded'].includes(process.env.JOURNEY_SCOPE) &&
                process.env.ADMIN_WEB_URL !== 'https://admin.staging.chasesets.com') {
              core.setFailed('Whole-game and capture journeys require the exact staging origin.');
            }
            if (process.env.JOURNEY_SCOPE === 'admin-origin-generate-probe') {
              if (process.env.ADMIN_WEB_URL !== 'https://admin.staging.chasesets.com') {
                core.setFailed('Admin-origin generate probe requires the exact staging origin.');
              }
              if (!/^job_[A-Z0-9]{26}$/.test(process.env.SCRATCH_PARENT ?? '')) {
                core.setFailed('Admin-origin generate probe requires a job-parent scratch_parent.');
              }
              if (['job_01M5N5MCJ3JET0GSZ32EJ63BA0', 'job_01M5ZZ47714K5B1MVKSTYB2BNB', 'job_01M60J47A1643F0NMN020WC3S3', 'ref_seed_set_time_spiral'].includes(process.env.SCRATCH_PARENT ?? '')) {
                core.setFailed('Admin-origin generate probe refuses a reserved scratch_parent.');
              }
            }

  refuse-unconfirmed:
    name: Refuse Unconfirmed Provider UAT
    runs-on: ubuntu-latest
    if: inputs.confirm != 'run catalog staging provider uat'
    steps:
      - name: Refuse unconfirmed provider UAT
        run: |
          echo 'Confirmation text did not match exactly; expected "run catalog staging provider uat".' >&2
          exit 1

  resolve-provider-uat-plan:
    name: Resolve Provider UAT Plan
    runs-on: ubuntu-latest
    needs: admit-reviewed-sha
    if: needs.admit-reviewed-sha.result == 'success' && inputs.journey_scope != 'scope-sync-count-lifecycle' && inputs.journey_scope != 'scrydex-cache-capture' && inputs.journey_scope != 'scrydex-coordinate-preview' && inputs.journey_scope != 'scrydex-force-refresh-bounded'
    outputs:
      journey_matrix: ${{ steps.plan.outputs.journey_matrix }}
    steps:
      - id: plan
        name: Resolve focused journey jobs
        run: |
          set -euo pipefail
          case "${{ inputs.journey_scope }}" in
            m50-final-proof)
              journey_matrix='{"include":[{"journey_scope":"lorcana-launch"},{"journey_scope":"all-provider-regression"}]}'
              ;;
            full-matrix-uat)
              journey_matrix='{"include":[{"journey_scope":"pokemon-matrix"},{"journey_scope":"mtg-matrix"},{"journey_scope":"yugioh-matrix"},{"journey_scope":"one-piece-matrix"},{"journey_scope":"lorcana-matrix"}]}'
              ;;
            one-piece-launch|lorcana-launch|all-provider-regression|staging-representative-catalog|pokemon-matrix|mtg-matrix|yugioh-matrix|one-piece-matrix|lorcana-matrix|full-game-start|full-game-settle|scope-sync-batch-preview-probe|admin-origin-generate-probe)
              journey_matrix='{"include":[{"journey_scope":"${{ inputs.journey_scope }}"}]}'
              ;;
            *)
              echo "Unsupported journey_scope: ${{ inputs.journey_scope }}" >&2
              exit 1
              ;;
          esac
          echo "journey_matrix=${journey_matrix}" >> "$GITHUB_OUTPUT"

  staging-provider-uat:
    name: Staging Provider Sync UAT (${{ matrix.journey_scope }})
    needs: [admit-reviewed-sha, resolve-provider-uat-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    if: needs.admit-reviewed-sha.result == 'success' && needs.resolve-provider-uat-plan.result == 'success' && inputs.journey_scope != 'scope-sync-count-lifecycle' && inputs.journey_scope != 'scrydex-cache-capture' && inputs.journey_scope != 'scrydex-coordinate-preview' && inputs.journey_scope != 'scrydex-force-refresh-bounded'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve-provider-uat-plan.outputs.journey_matrix) }}
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_WEB_SERVER: "true"
      CATALOG_STAGING_PROVIDER_UAT: "true"
      CATALOG_STAGING_PROVIDER_UAT_SCOPE: ${{ matrix.journey_scope }}
      CATALOG_STAGING_PROVIDER_UAT_TEST_TIMEOUT_MS: "3000000"
      ADMIN_WEB_URL: ${{ inputs.admin_web_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CATALOG_ADMIN_ORIGIN_GENERATE_SCRATCH_PARENT: ${{ inputs.scratch_parent }}
      CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || secrets.PLATFORM_ADMIN_EMAIL || '' }}
      CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || secrets.PLATFORM_ADMIN_PASSWORD || '' }}
      CATALOG_WHOLE_GAME_PRODUCT_DOMAIN: ${{ inputs.product_domain }}
      CATALOG_WHOLE_GAME_LANGUAGE_CODE: ${{ inputs.language_code }}
      CATALOG_WHOLE_GAME_BUDGET: ${{ inputs.budget }}
      CATALOG_WHOLE_GAME_BATCH_ID: ${{ inputs.batch_id }}
      CATALOG_WHOLE_GAME_RETRY_FAILED: ${{ inputs.retry_failed }}
      CATALOG_WHOLE_GAME_RESUME_CANCELLED: ${{ inputs.resume_cancelled }}
    steps:
      - name: Confirm staging provider UAT
        run: |
          set -euo pipefail
          echo "Catalog staging provider UAT confirmed for ${ADMIN_WEB_URL}."
          echo "Focused journey scope: ${CATALOG_STAGING_PROVIDER_UAT_SCOPE}."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run staging provider sync UAT
        id: provider-uat
        timeout-minutes: 55
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        run: |
          if [ "$CATALOG_STAGING_PROVIDER_UAT_SCOPE" = 'admin-origin-generate-probe' ]; then
            pnpm exec playwright test deployables/admin-web/e2e/catalog-staging-provider-sync.uat.spec.ts --project=admin-web-chromium --grep '@catalog-staging-provider-uat' --retries=0 --reporter=line
          else
            pnpm exec playwright test deployables/admin-web/e2e/catalog-staging-provider-sync.uat.spec.ts --project=admin-web-chromium
          fi

      - name: Validate Admin-origin generate receipt
        id: admin-origin-generate-receipt
        if: ${{ always() && matrix.journey_scope == 'admin-origin-generate-probe' && steps.provider-uat.outcome != 'skipped' }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ADMIN_WEB_URL: ${{ inputs.admin_web_url }}
          CATALOG_STAGING_PROVIDER_UAT_SCOPE: ${{ matrix.journey_scope }}
          CATALOG_ADMIN_ORIGIN_GENERATE_SCRATCH_PARENT: ${{ inputs.scratch_parent }}
        run: node scripts/catalog-admin-origin-generate-receipt.mjs validate --file artifacts/catalog-admin-origin-generate/receipt.json

      - name: Upload only the validated Admin-origin generate receipt
        if: ${{ always() && steps.admin-origin-generate-receipt.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-admin-origin-generate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-admin-origin-generate/receipt.json
          if-no-files-found: error
          retention-days: 30

      # Scope Sync Batch preview probe (#9244): publish only the exact receipt,
      # and only after it validates against this admitted SHA/run/attempt and
      # proves the admin credential values are absent. Raw Playwright output
      # (traces, reports, screenshots) is never uploaded.
      - name: Validate Scope Sync Batch preview receipt
        id: preview-receipt
        if: ${{ always() && matrix.journey_scope == 'scope-sync-batch-preview-probe' && steps.provider-uat.outcome != 'skipped' }}
        run: pnpm exec tsx scripts/catalog-staging-preview-probe.mjs validate --file artifacts/catalog-scale-probe/preview.json

      - name: Upload Scope Sync Batch preview receipt
        if: ${{ always() && steps.preview-receipt.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-scale-probe-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-scale-probe/preview.json
          if-no-files-found: error
          retention-days: 30

      # Whole-game journeys write one schema-validated, support-safe receipt; it
      # publishes only when the producing step succeeded and the exact file exists.
      - name: Upload whole-game rehearsal receipt
        if: steps.provider-uat.outcome == 'success' && startsWith(matrix.journey_scope, 'full-game-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-whole-game-rehearsal-${{ matrix.journey_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-whole-game-rehearsal/receipt.json
          if-no-files-found: error
          retention-days: 30

  scope-sync-count-lifecycle:
    name: Scope Sync Count Lifecycle
    needs: admit-reviewed-sha
    if: needs.admit-reviewed-sha.result == 'success' && inputs.journey_scope == 'scope-sync-count-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      actions: read
    env:
      ADMIN_WEB_URL: ${{ inputs.admin_web_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CATALOG_STAGING_PROVIDER_UAT_SCOPE: scope-sync-count-lifecycle
      CATALOG_CAPTURE_DISPATCH_ID: ${{ inputs.capture_dispatch_id }}
      CATALOG_CAPTURE_SCOPE_RECORD_ID: ${{ inputs.capture_scope_record_id }}
      CATALOG_CAPTURE_AUTHORITY: ${{ inputs.capture_authority }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture count lifecycle without confirmation
        id: capture
        env:
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || secrets.PLATFORM_ADMIN_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || secrets.PLATFORM_ADMIN_PASSWORD || '' }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/catalog-staging-count-lifecycle.mjs capture
      - name: Validate exact runner-scanned receipt
        id: capture-receipt
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        env:
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || secrets.PLATFORM_ADMIN_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || secrets.PLATFORM_ADMIN_PASSWORD || '' }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/catalog-staging-count-lifecycle.mjs validate
      - name: Upload only the validated count lifecycle receipt
        if: ${{ always() && steps.capture-receipt.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-count-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-count-lifecycle/receipt.json
          if-no-files-found: error
          retention-days: 30

  # Dedicated Scrydex coordinate preview: one isolated read/preview journey,
  # no refresh or retry. Only a complete validated receipt is canonical;
  # a governed-unknown receipt is published under a separate diagnostic name.
  scrydex-coordinate-preview:
    name: Scrydex Coordinate Preview
    needs: admit-reviewed-sha
    if: needs.admit-reviewed-sha.result == 'success' && inputs.journey_scope == 'scrydex-coordinate-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      actions: read
    env:
      ADMIN_WEB_URL: ${{ inputs.admin_web_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CATALOG_STAGING_PROVIDER_UAT_SCOPE: scrydex-coordinate-preview
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture Scrydex coordinate preview
        id: capture
        env:
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || secrets.PLATFORM_ADMIN_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || secrets.PLATFORM_ADMIN_PASSWORD || '' }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/catalog-staging-scrydex-coordinate-preview.mjs capture
      - name: Validate exact runner-sealed coordinate preview
        id: receipt
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          validation_output="$RUNNER_TEMP/catalog-scrydex-coordinate-preview-validation.json"
          pnpm exec tsx scripts/catalog-staging-scrydex-coordinate-preview.mjs validate > "$validation_output"
          VALIDATION_OUTPUT="$validation_output" node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.env.VALIDATION_OUTPUT, "utf8"));
          if (result.captureStatus !== "complete" && result.captureStatus !== "governed-unknown") {
            throw new Error("unexpected coordinate-preview capture status");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `capture_status=${result.captureStatus}\n`);
          NODE
          mv artifacts/catalog-scrydex-coordinate-preview/capture.json artifacts/catalog-scrydex-coordinate-preview/receipt.json
      - name: Upload the complete Scrydex coordinate preview
        if: ${{ always() && steps.capture.outcome == 'success' && steps.receipt.outcome == 'success' && steps.receipt.outputs.capture_status == 'complete' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-scrydex-coordinate-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-scrydex-coordinate-preview/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload the governed-unknown Scrydex coordinate preview diagnostic
        if: ${{ always() && steps.receipt.outcome == 'success' && steps.receipt.outputs.capture_status == 'governed-unknown' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-scrydex-coordinate-preview-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-scrydex-coordinate-preview/receipt.json
          if-no-files-found: error
          retention-days: 30

  # Cache-only Scrydex option-cache capture: GETs only after the shared sign-in,
  # no refresh, preview or TCGplayer request. The Actions read token binds the
  # deployed revision from its owning Deploy Staging job. Only a complete,
  # validated capture is the canonical artifact; a governed-unknown capture is
  # published under a separate diagnostic name.
  scrydex-cache-capture:
    name: Scrydex Cache Capture
    needs: [admit-reviewed-sha, scrydex-force-refresh-bounded]
    if: ${{ !cancelled() && needs.admit-reviewed-sha.result == 'success' && (inputs.journey_scope == 'scrydex-cache-capture' || (inputs.journey_scope == 'scrydex-force-refresh-bounded' && needs.scrydex-force-refresh-bounded.result == 'success' && needs.scrydex-force-refresh-bounded.outputs.refresh_outcome == 'complete')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      actions: read
    env:
      ADMIN_WEB_URL: ${{ inputs.admin_web_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CATALOG_STAGING_PROVIDER_UAT_SCOPE: scrydex-cache-capture
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture Scrydex option cache without refresh
        id: capture
        env:
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || secrets.PLATFORM_ADMIN_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || secrets.PLATFORM_ADMIN_PASSWORD || '' }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/catalog-staging-scrydex-cache-capture.mjs capture
      - name: Validate exact runner-sealed capture
        id: capture-receipt
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        env:
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || secrets.PLATFORM_ADMIN_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || secrets.PLATFORM_ADMIN_PASSWORD || '' }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/catalog-staging-scrydex-cache-capture.mjs validate
      - name: Upload the complete Scrydex cache capture
        if: ${{ always() && steps.capture.outcome == 'success' && steps.capture-receipt.outcome == 'success' && steps.capture-receipt.outputs.capture_status == 'complete' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-scrydex-cache-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-scrydex-cache-capture/capture.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload the governed-unknown Scrydex cache diagnostic
        if: ${{ always() && steps.capture-receipt.outcome == 'success' && steps.capture-receipt.outputs.capture_status == 'governed-unknown' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-scrydex-cache-capture-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-scrydex-cache-capture/capture.json
          if-no-files-found: error
          retention-days: 30

  scrydex-force-refresh-bounded:
    name: Scrydex Force Refresh (bounded)
    needs: admit-reviewed-sha
    if: needs.admit-reviewed-sha.result == 'success' && inputs.journey_scope == 'scrydex-force-refresh-bounded'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      actions: read
    outputs:
      refresh_outcome: ${{ steps.refresh-receipt.outputs.refresh_outcome }}
    env:
      ADMIN_WEB_URL: ${{ inputs.admin_web_url }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CATALOG_STAGING_PROVIDER_UAT_SCOPE: scrydex-force-refresh-bounded
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true
      - name: Install isolated Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run bounded Scrydex force refresh
        id: refresh
        env:
          CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || secrets.PLATFORM_ADMIN_EMAIL || '' }}
          CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || secrets.PLATFORM_ADMIN_PASSWORD || '' }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/catalog-staging-scrydex-option-refresh.mjs
      - name: Validate bounded refresh receipt
        id: refresh-receipt
        if: ${{ always() && steps.refresh.outcome != 'skipped' }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import { validateScrydexOptionRefreshReceipt } from './bounded-contexts/catalog/features/scope-sync-batches/domain/scrydex-option-refresh.ts'; const p = fs.existsSync('artifacts/catalog-scrydex-option-refresh/receipt.json') ? 'artifacts/catalog-scrydex-option-refresh/receipt.json' : 'artifacts/catalog-scrydex-option-refresh-diagnostic/receipt.json'; const r = JSON.parse(fs.readFileSync(p)); const e = validateScrydexOptionRefreshReceipt(r); if (e.length) throw new Error(e.join(';')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'refresh_outcome=' + r.outcome + '\\n');"
      - name: Upload complete bounded refresh receipt
        if: ${{ always() && steps.refresh-receipt.outcome == 'success' && steps.refresh-receipt.outputs.refresh_outcome == 'complete' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-scrydex-option-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-scrydex-option-refresh/receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic bounded refresh receipt
        if: ${{ always() && steps.refresh-receipt.outcome == 'success' && steps.refresh-receipt.outputs.refresh_outcome != 'complete' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-scrydex-option-refresh-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-scrydex-option-refresh-diagnostic/receipt.json
          if-no-files-found: error
          retention-days: 30
