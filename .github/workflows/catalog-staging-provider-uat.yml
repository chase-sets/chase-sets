name: Catalog Staging Provider UAT

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character commit SHA for this run.
        required: true
        type: string
      confirm:
        description: Type "run catalog staging provider uat" to queue provider syncs from the staging UI.
        required: true
        type: string
      admin_web_url:
        description: Staging admin-web origin.
        required: true
        default: https://admin.staging.chasesets.com
        type: string
      journey_scope:
        description: Provider journey set to run.
        required: true
        default: one-piece-launch
        type: choice
        options:
          - one-piece-launch
          - lorcana-launch
          - tcgplayer-pokemon-targeted
          - all-provider-regression
          - staging-representative-catalog
          - pokemon-matrix
          - mtg-matrix
          - yugioh-matrix
          - one-piece-matrix
          - lorcana-matrix
          - full-matrix-uat
          - m50-final-proof
          - full-game-start
          - full-game-settle
      product_domain:
        description: full-game-start only. Catalog Scope product domain to batch, e.g. one-piece.
        required: false
        default: ""
        type: string
      language_code:
        description: full-game-start only. Optional language code; blank batches every language.
        required: false
        default: ""
        type: string
      budget:
        description: full-game-start only. Comma-separated key=value overrides of maxScopesPerTurn, tcgdexRequestLimit, scrydexRateRequestLimit, scrydexRequestLimit, providerFailureThreshold.
        required: false
        default: ""
        type: string
      batch_id:
        description: full-game-settle only. The Scope Sync Batch id the start journey returned.
        required: false
        default: ""
        type: string
      retry_failed:
        description: full-game-settle only. Retry each failed unit once in this dispatch.
        required: false
        default: false
        type: boolean
      resume_cancelled:
        description: full-game-settle only. Resume the batch when it is cancelled.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: platform-staging-mutating-operations
  cancel-in-progress: false

jobs:
  admit-reviewed-sha:
    name: Admit Reviewed Immutable SHA
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation and immutable SHA
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUN_SHA: ${{ github.sha }}
          CONFIRMATION: ${{ inputs.confirm }}
        with:
          script: |
            const expected = process.env.EXPECTED_SHA ?? '';
            if (process.env.CONFIRMATION !== 'run catalog staging provider uat' ||
                !/^[a-fA-F0-9]{40}$/.test(expected) ||
                expected.toLowerCase() !== process.env.RUN_SHA) {
              core.setFailed('Confirmation and exact immutable expected_sha are required.');
            }

  refuse-unconfirmed:
    name: Refuse Unconfirmed Provider UAT
    runs-on: ubuntu-latest
    if: inputs.confirm != 'run catalog staging provider uat'
    steps:
      - name: Refuse unconfirmed provider UAT
        run: |
          echo 'Confirmation text did not match exactly; expected "run catalog staging provider uat".' >&2
          exit 1

  resolve-provider-uat-plan:
    name: Resolve Provider UAT Plan
    runs-on: ubuntu-latest
    needs: admit-reviewed-sha
    if: needs.admit-reviewed-sha.result == 'success'
    outputs:
      journey_matrix: ${{ steps.plan.outputs.journey_matrix }}
    steps:
      - id: plan
        name: Resolve focused journey jobs
        run: |
          set -euo pipefail
          case "${{ inputs.journey_scope }}" in
            m50-final-proof)
              journey_matrix='{"include":[{"journey_scope":"lorcana-launch"},{"journey_scope":"all-provider-regression"}]}'
              ;;
            full-matrix-uat)
              journey_matrix='{"include":[{"journey_scope":"pokemon-matrix"},{"journey_scope":"mtg-matrix"},{"journey_scope":"yugioh-matrix"},{"journey_scope":"one-piece-matrix"},{"journey_scope":"lorcana-matrix"}]}'
              ;;
            one-piece-launch|lorcana-launch|tcgplayer-pokemon-targeted|all-provider-regression|staging-representative-catalog|pokemon-matrix|mtg-matrix|yugioh-matrix|one-piece-matrix|lorcana-matrix|full-game-start|full-game-settle)
              journey_matrix='{"include":[{"journey_scope":"${{ inputs.journey_scope }}"}]}'
              ;;
            *)
              echo "Unsupported journey_scope: ${{ inputs.journey_scope }}" >&2
              exit 1
              ;;
          esac
          echo "journey_matrix=${journey_matrix}" >> "$GITHUB_OUTPUT"

  staging-provider-uat:
    name: Staging Provider Sync UAT (${{ matrix.journey_scope }})
    needs: [admit-reviewed-sha, resolve-provider-uat-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    if: needs.admit-reviewed-sha.result == 'success' && needs.resolve-provider-uat-plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve-provider-uat-plan.outputs.journey_matrix) }}
    env:
      CI: "true"
      PLAYWRIGHT_SKIP_WEB_SERVER: "true"
      CATALOG_STAGING_PROVIDER_UAT: "true"
      CATALOG_STAGING_PROVIDER_UAT_SCOPE: ${{ matrix.journey_scope }}
      CATALOG_STAGING_PROVIDER_UAT_TEST_TIMEOUT_MS: "3000000"
      ADMIN_WEB_URL: ${{ inputs.admin_web_url }}
      CATALOG_ADMIN_E2E_EMAIL: ${{ vars.CATALOG_ADMIN_E2E_EMAIL || secrets.PLATFORM_ADMIN_EMAIL || '' }}
      CATALOG_ADMIN_E2E_PASSWORD: ${{ secrets.CATALOG_ADMIN_E2E_PASSWORD || secrets.PLATFORM_ADMIN_PASSWORD || '' }}
      CATALOG_WHOLE_GAME_PRODUCT_DOMAIN: ${{ inputs.product_domain }}
      CATALOG_WHOLE_GAME_LANGUAGE_CODE: ${{ inputs.language_code }}
      CATALOG_WHOLE_GAME_BUDGET: ${{ inputs.budget }}
      CATALOG_WHOLE_GAME_BATCH_ID: ${{ inputs.batch_id }}
      CATALOG_WHOLE_GAME_RETRY_FAILED: ${{ inputs.retry_failed }}
      CATALOG_WHOLE_GAME_RESUME_CANCELLED: ${{ inputs.resume_cancelled }}
    steps:
      - name: Confirm staging provider UAT
        run: |
          set -euo pipefail
          echo "Catalog staging provider UAT confirmed for ${ADMIN_WEB_URL}."
          echo "Focused journey scope: ${CATALOG_STAGING_PROVIDER_UAT_SCOPE}."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup-pnpm-workspace
        with:
          install: true

      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run staging provider sync UAT
        id: uat
        timeout-minutes: 55
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        run: pnpm exec playwright test deployables/admin-web/e2e/catalog-staging-provider-sync.uat.spec.ts --project=admin-web-chromium

      # Whole-game journeys write one schema-validated, support-safe receipt; it
      # publishes only when the producing step succeeded and the exact file exists.
      - name: Upload whole-game rehearsal receipt
        if: steps.uat.outcome == 'success' && startsWith(matrix.journey_scope, 'full-game-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-whole-game-rehearsal-${{ matrix.journey_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/catalog-whole-game-rehearsal/receipt.json
          if-no-files-found: error
          retention-days: 30
