# CI compose boot+smoke (#4864): boots the same production platform image
# the docker-image job and the cluster preview deploy build --
# containerized platform-api, platform-worker, and all three web
# deployables -- against a real compose Postgres, then platform-smoke.mjs
# drives it exactly like it drives a cluster preview. This replaces the
# chase-sets-pr-<n> cluster preview for PRs that only touch app code (see
# the change-scope `cluster_preview` output in scripts/change-scope.mjs and
# the compose-preview-smoke job in .github/workflows/platform-pr.yml), so it
# still catches a boot-time crash (the #4835 React-barrel bootstrap class)
# without the cluster namespace, Helm release, or DO node-pool churn a full
# preview needs.
#
# Every component's environment is generated by
# scripts/platform-compose-smoke.mjs from the same buildPlatformHelmValues()
# source of truth the Helm chart renders from, with `secret: true` entries
# swapped for safe local placeholders -- see that script for exactly which
# values are real (Postgres, internal auth, admin credentials) and which
# stay intentionally empty (unconfigured optional providers). No real
# provider credentials are used, so this file needs no CI secrets and is
# safe to run on fork PRs.
name: chase-sets-compose-smoke

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chase_sets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chase_sets"]
      interval: 5s
      timeout: 5s
      retries: 20

  platform-bootstrap:
    image: ${CHASE_SETS_COMPOSE_SMOKE_IMAGE:?CHASE_SETS_COMPOSE_SMOKE_IMAGE is required}
    env_file: ${CHASE_SETS_COMPOSE_SMOKE_ENV_DIR:-artifacts/compose-smoke/env}/platform-bootstrap.env
    # `bootstrap:production` (not `bootstrap`, which loads .env.example via
    # tsx --env-file) matches the exact command the Helm chart's
    # platform-bootstrap Job runs (render-platform-helm-values.mjs's
    # `platformBootstrapCommand`), so this exercises the same code path
    # preview/staging/production use, not a dev-only variant.
    command: ["pnpm", "--filter", "@chase-sets/app-platform-api", "run", "bootstrap:production"]
    depends_on:
      postgres:
        condition: service_healthy

  platform-api:
    image: ${CHASE_SETS_COMPOSE_SMOKE_IMAGE:?CHASE_SETS_COMPOSE_SMOKE_IMAGE is required}
    env_file: ${CHASE_SETS_COMPOSE_SMOKE_ENV_DIR:-artifacts/compose-smoke/env}/platform-api.env
    command: ["pnpm", "--filter", "@chase-sets/app-platform-api", "run", "start:production"]
    ports:
      - "${PLATFORM_API_HOST_PORT:-18190}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      platform-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  platform-worker:
    image: ${CHASE_SETS_COMPOSE_SMOKE_IMAGE:?CHASE_SETS_COMPOSE_SMOKE_IMAGE is required}
    env_file: ${CHASE_SETS_COMPOSE_SMOKE_ENV_DIR:-artifacts/compose-smoke/env}/platform-worker.env
    command: ["pnpm", "--filter", "@chase-sets/app-platform-worker", "run", "start:production"]
    ports:
      - "${PLATFORM_WORKER_HOST_PORT:-18191}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      platform-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  public-web:
    image: ${CHASE_SETS_COMPOSE_SMOKE_IMAGE:?CHASE_SETS_COMPOSE_SMOKE_IMAGE is required}
    env_file: ${CHASE_SETS_COMPOSE_SMOKE_ENV_DIR:-artifacts/compose-smoke/env}/public-web.env
    command: ["pnpm", "--filter", "@chase-sets/app-public-web", "run", "start"]
    ports:
      - "${PUBLIC_WEB_HOST_PORT:-18192}:8080"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  marketplace:
    image: ${CHASE_SETS_COMPOSE_SMOKE_IMAGE:?CHASE_SETS_COMPOSE_SMOKE_IMAGE is required}
    env_file: ${CHASE_SETS_COMPOSE_SMOKE_ENV_DIR:-artifacts/compose-smoke/env}/marketplace.env
    command: ["pnpm", "--filter", "@chase-sets/app-marketplace-web", "run", "start"]
    ports:
      - "${MARKETPLACE_HOST_PORT:-18193}:8080"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  admin-web:
    image: ${CHASE_SETS_COMPOSE_SMOKE_IMAGE:?CHASE_SETS_COMPOSE_SMOKE_IMAGE is required}
    env_file: ${CHASE_SETS_COMPOSE_SMOKE_ENV_DIR:-artifacts/compose-smoke/env}/admin-web.env
    command: ["pnpm", "--filter", "@chase-sets/app-admin-web", "run", "start"]
    ports:
      - "${ADMIN_WEB_HOST_PORT:-18194}:8080"
    depends_on:
      platform-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
