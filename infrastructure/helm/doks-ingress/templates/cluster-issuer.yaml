{{- if .Values.clusterIssuers.enabled }}
{{- $email := required "clusterIssuers.email is required for ACME registration" .Values.clusterIssuers.email }}
{{- $ingressClassName := required "clusterIssuers.ingressClassName is required for the HTTP-01 solver" .Values.clusterIssuers.ingressClassName }}
{{- $issuers := dict "staging" .Values.clusterIssuers.staging "production" .Values.clusterIssuers.production }}
{{- range $tier := (keys $issuers | sortAlpha) }}
{{- $issuer := index $issuers $tier }}
{{- if $issuer.enabled }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ required "issuer name is required" $issuer.name | quote }}
  labels:
{{ include "chase-sets-doks-ingress.labels" $ | nindent 4 }}
    chase-sets.com/acme-tier: {{ $tier | quote }}
spec:
  acme:
    server: {{ required "issuer server is required" $issuer.server | quote }}
    email: {{ $email | quote }}
    privateKeySecretRef:
      name: {{ required "issuer privateKeySecretName is required" $issuer.privateKeySecretName | quote }}
    solvers:
      - http01:
          ingress:
            class: {{ $ingressClassName | quote }}
      {{- if and $issuer.dns01 $issuer.dns01.enabled }}
      # Scoped to the preview wildcard zone only: every other certificate
      # this issuer signs keeps using the http01 solver above. ACME forbids
      # proving a wildcard name over HTTP-01, so the shared
      # `*.preview.chasesets.com` certificate (templates/preview-wildcard-certificate.yaml)
      # needs this DNS-01 solver (#4857).
      - selector:
          dnsZones:
            {{- range $issuer.dns01.dnsZones }}
            - {{ . | quote }}
            {{- end }}
        dns01:
          digitalocean:
            tokenSecretRef:
              name: {{ required "dns01 secretName is required" $issuer.dns01.secretName | quote }}
              key: {{ $issuer.dns01.secretKey | default "access-token" | quote }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
