# Values for the upstream cert-manager chart, installed by
# scripts/doks-cluster-addons.mjs. CRDs install with the chart so the
# ClusterIssuers rendered by this directory's chart apply on first release.
crds:
  enabled: true
  keep: true
replicaCount: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
webhook:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
cainjector:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
prometheus:
  enabled: false
