# Cluster-scoped resources Chase Sets owns for DOKS ingress + TLS. The upstream
# ingress-nginx and cert-manager charts are installed separately with the pinned
# values files in this directory (ingress-nginx-values.yaml, cert-manager-values.yaml)
# by scripts/doks-cluster-addons.mjs. This chart renders only the ACME
# ClusterIssuers so certificate issuance stays source-owned and reviewable.
clusterIssuers:
  enabled: true
  # ACME account email used for Let's Encrypt registration and expiry notices.
  email: "ops@chasesets.com"
  # Ingress class the HTTP-01 solver publishes challenge routes through. Must
  # match controller.ingressClassResource.name in ingress-nginx-values.yaml.
  ingressClassName: "nginx"
  # Let's Encrypt staging issuer: high rate limits, untrusted chain. Use it to
  # rehearse issuance against the shadow validation hosts without burning the
  # production ACME quota.
  staging:
    enabled: true
    name: "letsencrypt-staging"
    server: "https://acme-staging-v02.api.letsencrypt.org/directory"
    privateKeySecretName: "letsencrypt-staging-account-key"
    dns01:
      enabled: false
  # Let's Encrypt production issuer: trusted chain, tight rate limits. Point live
  # Ingress objects at this issuer only after staging issuance is proven.
  production:
    enabled: true
    name: "letsencrypt-production"
    server: "https://acme-v02.api.letsencrypt.org/directory"
    privateKeySecretName: "letsencrypt-production-account-key"
    # DNS-01 solver, scoped by `selector.dnsZones` to ONLY the preview
    # wildcard zone (#4857): every other certificate this issuer signs
    # (staging/production app hosts) keeps using the http01 solver above,
    # unaffected. This solver exists to issue exactly one certificate --
    # the shared `*.preview.chasesets.com` wildcard rendered by
    # templates/preview-wildcard-certificate.yaml -- because ACME forbids
    # proving a wildcard name over HTTP-01.
    dns01:
      enabled: true
      secretName: "digitalocean-dns-token"
      secretKey: "access-token"
      dnsZones:
        - "preview.chasesets.com"

# The ONE shared wildcard certificate every preview namespace's Ingress
# references (copied in at deploy time by copyPreviewWildcardTlsSecret in
# scripts/platform-kubernetes-deployment.mjs), instead of each preview
# namespace requesting -- and each ACME issuance counting against Let's
# Encrypt's 50-certificates-per-168h quota -- its own certificate (#4857).
# Only the staging DOKS cluster hosts previews, so scripts/doks-cluster-addons.mjs
# only enables this for `--environment staging`; the production DOKS cluster
# never renders it.
previewWildcardCertificate:
  enabled: false
  name: "preview-wildcard"
  namespace: "cert-manager"
  secretName: "preview-wildcard-tls"
  dnsZone: "preview.chasesets.com"
  issuerName: "letsencrypt-production"
