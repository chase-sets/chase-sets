# Values for the upstream ingress-nginx chart, installed by
# scripts/doks-cluster-addons.mjs. The controller Service of type LoadBalancer
# is what provisions the DigitalOcean Load Balancer that fronts DOKS ingress.
#
# The DO REGIONAL_NETWORK Load Balancer is L4 same-port passthrough: it forwards
# LB :80/:443 directly to droplet host :80/:443, and NGINX (not the LB)
# terminates TLS with cert-manager-issued certificates. Port 80 stays open and is
# not force-redirected at the LB so cert-manager HTTP-01 challenges can reach the
# controller. The controller pods must bind host ports 80/443 because those are
# the LB targets.
#
# Live #4680 evidence on the DOKS 1.36.0-do.2 cluster showed the CCM
# unconditionally coerces this Service to REGIONAL_NETWORK, re-stamping the
# annotation within seconds even when no LB exists. REGIONAL is not grantable on
# this cluster, so these values intentionally pair with REGIONAL_NETWORK instead
# of fighting reconciliation.
#
# REGIONAL_NETWORK preserves client source IP natively and does not support PROXY
# protocol. Do not enable either the DO proxy-protocol annotation or
# controller.config.use-proxy-protocol: ingress-nginx readiness fails when it
# expects PROXY headers that the network LB never sends.
#
# The annotation must live here (not applied by hand) because the CCM/helm
# reconcile the Service back to these values: "any setting done outside DOKS is
# automatically overridden by DOKS reconciliation."
# Refs:
#   https://docs.digitalocean.com/products/kubernetes/how-to/configure-load-balancers/
#   https://github.com/digitalocean/digitalocean-cloud-controller-manager/blob/master/docs/controllers/services/annotations.md
controller:
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  ingressClass: nginx
  hostPort:
    enabled: true
  # Staging DOKS is single-node: hostPort binding permits one controller
  # replica per node, so more than one replica can never schedule there.
  replicaCount: 1
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      # Per-environment Load Balancer name. Staging is the first cutover target;
      # production uses chase-sets-production-doks-ingress at its cutover.
      service.beta.kubernetes.io/do-loadbalancer-name: "chase-sets-staging-doks-ingress"
      # DOKS 1.36 CCM coerces this Service to REGIONAL_NETWORK; document that
      # final state here and pair it with hostPort 80/443 above.
      service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL_NETWORK"
      service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
  config:
    # REGIONAL_NETWORK preserves source IP natively and never sends PROXY
    # headers, so ingress-nginx must parse ordinary HTTP/TLS streams.
    use-proxy-protocol: "false"
    use-forwarded-headers: "true"
    # cert-manager annotates its own solver Ingress to bypass ssl-redirect, so a
    # global default of true is safe and keeps app traffic on HTTPS.
    ssl-redirect: "true"
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  admissionWebhooks:
    enabled: true
