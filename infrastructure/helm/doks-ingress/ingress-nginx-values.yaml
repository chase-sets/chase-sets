# Values for the upstream ingress-nginx chart, installed by
# scripts/doks-cluster-addons.mjs. The controller Service of type LoadBalancer
# is what provisions the DigitalOcean Load Balancer that fronts DOKS ingress.
#
# The DO REGIONAL_NETWORK Load Balancer is L4 same-port passthrough: it forwards
# LB :80/:443 directly to droplet host :80/:443, and NGINX (not the LB)
# terminates TLS with cert-manager-issued certificates. Port 80 stays open and is
# not force-redirected at the LB so cert-manager HTTP-01 challenges can reach the
# controller. The controller pods must bind host ports 80/443 because those are
# the LB targets.
#
# Live #4680 evidence on the DOKS 1.36.0-do.2 cluster showed the CCM
# unconditionally coerces this Service to REGIONAL_NETWORK, re-stamping the
# annotation within seconds even when no LB exists. REGIONAL is not grantable on
# this cluster, so these values intentionally pair with REGIONAL_NETWORK instead
# of fighting reconciliation.
#
# REGIONAL_NETWORK preserves client source IP natively and does not support PROXY
# protocol. Do not enable either the DO proxy-protocol annotation or
# controller.config.use-proxy-protocol: ingress-nginx readiness fails when it
# expects PROXY headers that the network LB never sends.
#
# The annotation must live here (not applied by hand) because the CCM/helm
# reconcile the Service back to these values: "any setting done outside DOKS is
# automatically overridden by DOKS reconciliation."
# Refs:
#   https://docs.digitalocean.com/products/kubernetes/how-to/configure-load-balancers/
#   https://github.com/digitalocean/digitalocean-cloud-controller-manager/blob/master/docs/controllers/services/annotations.md
controller:
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  ingressClass: nginx
  hostPort:
    enabled: true
  # Staging DOKS is single-node: hostPort binding permits one controller
  # replica per node, so more than one replica can never schedule there.
  replicaCount: 1
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      # Per-environment Load Balancer name. Staging is the first cutover target;
      # production uses chase-sets-production-doks-ingress at its cutover.
      service.beta.kubernetes.io/do-loadbalancer-name: "chase-sets-staging-doks-ingress"
      # DOKS 1.36 CCM coerces this Service to REGIONAL_NETWORK; document that
      # final state here and pair it with hostPort 80/443 above.
      service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL_NETWORK"
      service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
  config:
    # REGIONAL_NETWORK preserves source IP natively and never sends PROXY
    # headers, so ingress-nginx must parse ordinary HTTP/TLS streams.
    use-proxy-protocol: "false"
    use-forwarded-headers: "true"
    # cert-manager annotates its own solver Ingress to bypass ssl-redirect, so a
    # global default of true is safe and keeps app traffic on HTTPS.
    ssl-redirect: "true"
    custom-http-errors: "502,503,504"
    disable-proxy-intercept-errors: "true"
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  admissionWebhooks:
    enabled: true

defaultBackend:
  enabled: true
  replicaCount: 2
  minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  image:
    registry: docker.io
    image: nginxinc/nginx-unprivileged
    tag: 1.30.4-alpine
    digest: sha256:adf5042a17f4ecdd200c595fa9ffd1be37efb18f89a830bd1a00e4ab4d59d42c
    pullPolicy: IfNotPresent
    runAsNonRoot: true
    runAsUser: 101
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
    readOnlyRootFilesystem: true
  serviceAccount:
    automountServiceAccountToken: false
  port: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  podAnnotations:
    chase-sets.com/maintenance-config-sha256: 3aaf832ea25f9154e4f07ae7b2eac3d1a3c56196d8c096e1b632953f47fc3efe
  extraConfigMaps:
    - name: ingress-nginx-maintenance
      data:
        default.conf: |
          map $http_x_format $maintenance_format {
            default json;
            # JSON and SSE must win over browser HTML preferences.
            ~*(^|,)\s*(application/json|text/event-stream)(\s*\x3B[^,]*)?(,|$) json;
            ~*(^|,)\s*text/html[^,]*\x3B\s*q=0(?:\.0*)?(?:\s*,|$) json;
            ~*(^|,)\s*text/html(?:\s*\x3B[^,]*)?(,|$) html;
          }
          map "$http_x_code:$maintenance_format" $maintenance_uri {
            default /not-found;
            "502:html" /maintenance.html;
            "503:html" /maintenance.html;
            "504:html" /maintenance.html;
            "502:json" /502.json;
            "503:json" /503.json;
            "504:json" /504.json;
          }
          error_page 502 =502 $maintenance_uri;
          error_page 503 =503 $maintenance_uri;
          error_page 504 =504 $maintenance_uri;

          server {
            listen 8080;
            server_name _;
            root /opt/chase-sets-maintenance;
            default_type text/plain;

            location = /healthz {
              default_type text/plain;
              return 200 "ok\n";
            }

            location = /maintenance.html {
              internal;
              default_type text/html;
              charset utf-8;
              add_header Retry-After 60 always;
              add_header Cache-Control no-store always;
              try_files /maintenance.html =503;
            }

            location ~ ^/(502|503|504)\.json$ {
              internal;
              default_type application/json;
              add_header Retry-After 60 always;
              add_header Cache-Control no-store always;
              try_files $uri =503;
            }

            location / {
              if ($http_x_code = 502) { return 502; }
              if ($http_x_code = 503) { return 503; }
              if ($http_x_code = 504) { return 504; }
              return 404;
            }
          }
        maintenance.html: |
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Chase Sets temporarily unavailable</title>
              <style>
                :root { color-scheme: light; --background: #f7f5f1; --card: #ffffff; --foreground: #211d33; --text-secondary: #4d4763; --border: #e6e2d9; --radius-lg: 0.75rem; --space-8: 2rem; --space-6: 1.5rem; }
                * { box-sizing: border-box; }
                body { align-items: center; background: var(--background); color: var(--foreground); display: flex; font-family: system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: var(--space-6); }
                main { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); max-width: 32rem; padding: var(--space-8); text-align: center; width: 100%; }
                h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
                p { color: var(--text-secondary); line-height: 1.6; margin: 0; }
              </style>
            </head>
            <body><main><div>Chase Sets</div><h1>We'll be right back</h1><p>Chase Sets is temporarily unavailable. Please try again in a minute.</p></main></body>
          </html>
        502.json: "{\"status\":502,\"error\":\"bad_gateway\",\"message\":\"Chase Sets is temporarily unavailable. Please try again in a minute.\"}\n"
        503.json: "{\"status\":503,\"error\":\"service_unavailable\",\"message\":\"Chase Sets is temporarily unavailable. Please try again in a minute.\"}\n"
        504.json: "{\"status\":504,\"error\":\"gateway_timeout\",\"message\":\"Chase Sets is temporarily unavailable. Please try again in a minute.\"}\n"
  extraVolumes:
    - name: maintenance-config
      configMap:
        name: ingress-nginx-maintenance
        items:
          - key: default.conf
            path: default.conf
    - name: maintenance-bodies
      configMap:
        name: ingress-nginx-maintenance
        items:
          - key: maintenance.html
            path: maintenance.html
          - key: 502.json
            path: 502.json
          - key: 503.json
            path: 503.json
          - key: 504.json
            path: 504.json
    - name: nginx-tmp
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi
  extraVolumeMounts:
    - name: maintenance-config
      mountPath: /etc/nginx/conf.d
      readOnly: true
    - name: maintenance-bodies
      mountPath: /opt/chase-sets-maintenance
      readOnly: true
    - name: nginx-tmp
      mountPath: /tmp
