{{- $ingress := .Values.doksIngress -}}
{{- if $ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chase-sets-platform.fullname" . }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "doks-ingress") | nindent 4 }}
  {{- if or $ingress.clusterIssuer $ingress.annotations }}
  annotations:
    {{- if $ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ $ingress.clusterIssuer | quote }}
    {{- end }}
    {{- with $ingress.annotations }}
{{ toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- if $ingress.className }}
  ingressClassName: {{ $ingress.className | quote }}
  {{- end }}
  {{- if $ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $ingress.hosts }}
        - {{ .host | quote }}
        {{- end }}
      secretName: {{ $ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    {{- range $ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- $component := index $.Values.components .service }}
          - path: {{ .path | quote }}
            pathType: {{ default "Prefix" .pathType | quote }}
            backend:
              service:
                name: {{ include "chase-sets-platform.componentName" (dict "root" $ "name" .service) }}
                port:
                  number: {{ default $component.service.port .port }}
          {{- end }}
    {{- end }}
{{- end }}
