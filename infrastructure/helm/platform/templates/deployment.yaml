{{- range $name, $component := .Values.components }}
{{- $rolloutEnabled := and $component.rollout $component.rollout.enabled }}
{{- if and $component.enabled (not $rolloutEnabled) (or (eq $component.kind "service") (eq $component.kind "worker")) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chase-sets-platform.componentName" (dict "root" $ "name" $name) }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels:
{{ include "chase-sets-platform.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "chase-sets-platform.selectorLabels" (dict "root" $ "name" $name) | nindent 8 }}
{{- with $.Values.global.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with $component.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- $managedPostgresCa := and $component.managedPostgresCa $.Values.global.managedPostgresCaSha256 }}
{{- if or $managedPostgresCa $.Values.global.podAnnotations $component.podAnnotations }}
      annotations:
{{- if $managedPostgresCa }}
        chase-sets.com/managed-postgres-ca-sha256: {{ required "global.managedPostgresCaSha256 is required for database-bearing workloads" $.Values.global.managedPostgresCaSha256 | quote }}
{{- end }}
{{- with $.Values.global.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with $component.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- end }}
    spec:
{{ include "chase-sets-platform.podSpec" (dict "root" $ "name" $name "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
