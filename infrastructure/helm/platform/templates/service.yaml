{{- range $name, $component := .Values.components }}
{{- if and $component.enabled (eq $component.kind "service") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chase-sets-platform.componentName" (dict "root" $ "name" $name) }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  type: {{ $component.service.type }}
  ports:
    - name: http
      port: {{ $component.service.port }}
      targetPort: http
      protocol: TCP
  selector:
{{ include "chase-sets-platform.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
{{- if and $component.rollout $component.rollout.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chase-sets-platform.canaryServiceName" (dict "root" $ "name" $name) }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" $ "name" $name) | nindent 4 }}
    chase-sets.com/traffic-role: canary
spec:
  type: {{ $component.service.type }}
  ports:
    - name: http
      port: {{ $component.service.port }}
      targetPort: http
      protocol: TCP
  selector:
{{ include "chase-sets-platform.selectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
