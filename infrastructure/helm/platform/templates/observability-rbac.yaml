{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chase-sets-platform.observabilityName" . }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "observability") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chase-sets-platform.observabilityName" . }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "observability") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "nodes/stats", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "chase-sets-platform.observabilityName" . }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "observability") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chase-sets-platform.observabilityName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "chase-sets-platform.observabilityName" . }}
{{- end }}
