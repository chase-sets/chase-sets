{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chase-sets-platform.observabilityServiceName" . }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "otel-agent") | nindent 4 }}
spec:
  selector:
{{ include "chase-sets-platform.selectorLabels" (dict "root" . "name" "otel-agent") | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "chase-sets-platform.observabilityName" . }}-agent
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "otel-agent") | nindent 4 }}
spec:
  selector:
    matchLabels:
{{ include "chase-sets-platform.selectorLabels" (dict "root" . "name" "otel-agent") | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "chase-sets-platform.selectorLabels" (dict "root" . "name" "otel-agent") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "chase-sets-platform.observabilityName" . }}
      containers:
        - name: otel-agent
          image: "{{ .Values.observability.collector.image.repository }}:{{ .Values.observability.collector.image.tag }}"
          imagePullPolicy: {{ .Values.observability.collector.image.pullPolicy }}
          args: ["--config=/etc/otelcol/agent.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CHASE_SETS_DEPLOYMENT_ENVIRONMENT
              value: {{ required "observability.environment is required" .Values.observability.environment | quote }}
            - name: CHASE_SETS_K8S_CLUSTER_NAME
              value: {{ required "observability.clusterName is required" .Values.observability.clusterName | quote }}
            - name: CHASE_SETS_OTLP_ENDPOINT
              value: {{ required "observability.exporter.endpoint is required" .Values.observability.exporter.endpoint | quote }}
            - name: CHASE_SETS_OTLP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.exporter.secretName | quote }}
                  key: {{ .Values.observability.exporter.secretKey | quote }}
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
{{ toYaml .Values.observability.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "chase-sets-platform.observabilityName" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chase-sets-platform.observabilityName" . }}-cluster
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "otel-cluster") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "chase-sets-platform.selectorLabels" (dict "root" . "name" "otel-cluster") | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "chase-sets-platform.selectorLabels" (dict "root" . "name" "otel-cluster") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/observability-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "chase-sets-platform.observabilityName" . }}
      containers:
        - name: otel-cluster
          image: "{{ .Values.observability.collector.image.repository }}:{{ .Values.observability.collector.image.tag }}"
          imagePullPolicy: {{ .Values.observability.collector.image.pullPolicy }}
          args: ["--config=/etc/otelcol/cluster.yaml"]
          env:
            - name: CHASE_SETS_DEPLOYMENT_ENVIRONMENT
              value: {{ required "observability.environment is required" .Values.observability.environment | quote }}
            - name: CHASE_SETS_K8S_CLUSTER_NAME
              value: {{ required "observability.clusterName is required" .Values.observability.clusterName | quote }}
            - name: CHASE_SETS_OTLP_ENDPOINT
              value: {{ required "observability.exporter.endpoint is required" .Values.observability.exporter.endpoint | quote }}
            - name: CHASE_SETS_OTLP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.exporter.secretName | quote }}
                  key: {{ .Values.observability.exporter.secretKey | quote }}
          resources:
{{ toYaml .Values.observability.collector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
        - name: kube-state-metrics
          image: "{{ .Values.observability.kubeStateMetrics.image.repository }}:{{ .Values.observability.kubeStateMetrics.image.tag }}"
          imagePullPolicy: {{ .Values.observability.kubeStateMetrics.image.pullPolicy }}
          args:
            - "--host=127.0.0.1"
            - "--port=8080"
            - "--resources=cronjobs,daemonsets,deployments,jobs,namespaces,nodes,pods,replicasets,statefulsets"
          resources:
{{ toYaml .Values.observability.kubeStateMetrics.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "chase-sets-platform.observabilityName" . }}
{{- end }}
