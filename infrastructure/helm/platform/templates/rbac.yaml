{{- if .Values.global.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chase-sets-platform.bootstrapQuiesceServiceAccountName" . }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "bootstrap-quiesce") | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-40"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
{{- with .Values.global.imagePullSecrets }}
imagePullSecrets:
{{ toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chase-sets-platform.fullname" . }}-bootstrap-quiesce
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "bootstrap-quiesce") | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-35"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chase-sets-platform.fullname" . }}-bootstrap-quiesce
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "bootstrap-quiesce") | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-34"
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded"
subjects:
  - kind: ServiceAccount
    name: {{ include "chase-sets-platform.bootstrapQuiesceServiceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "chase-sets-platform.fullname" . }}-bootstrap-quiesce
{{- end }}
