{{- range $name, $component := .Values.components }}
{{- if and $component.enabled (eq $component.kind "service") $component.rollout $component.rollout.enabled }}
{{- if and $component.rollout.canary.trafficRouting.nginx.enabled (not $.Values.doksIngress.enabled) }}
{{- fail (printf "components.%s rollout requires doksIngress.enabled=true for proportional nginx traffic routing" $name) }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "chase-sets-platform.componentName" (dict "root" $ "name" $name) }}
  {{- with $.Values.global.betaWave }}
  annotations:
    chase-sets.com/beta-wave-size: {{ .inviteCount | quote }}
    chase-sets.com/beta-wave-rollout-exposure-percent: {{ .rolloutExposurePercent | quote }}
  {{- end }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: {{ $component.rollout.revisionHistoryLimit }}
  progressDeadlineAbort: true
  progressDeadlineSeconds: {{ $component.rollout.progressDeadlineSeconds }}
  rollbackWindow:
    revisions: {{ $component.rollout.rollbackWindowRevisions }}
  selector:
    matchLabels:
{{ include "chase-sets-platform.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  strategy:
    canary:
      stableService: {{ include "chase-sets-platform.componentName" (dict "root" $ "name" $name) }}
      canaryService: {{ include "chase-sets-platform.canaryServiceName" (dict "root" $ "name" $name) }}
      {{- if $component.rollout.canary.trafficRouting.nginx.enabled }}
      trafficRouting:
        nginx:
          stableIngress: {{ include "chase-sets-platform.rolloutIngressName" (dict "root" $ "name" $name) | quote }}
      {{- end }}
      steps:
      {{- range $weight := $component.rollout.canary.weights }}
        - setWeight: {{ $weight }}
        {{- if $component.rollout.analysis.enabled }}
        - analysis:
            templates:
              - templateName: {{ include "chase-sets-platform.analysisTemplateName" (dict "root" $ "name" $name) }}
        {{- end }}
        {{- if eq (int $weight) (int $component.rollout.canary.pauseAfterWeight) }}
        - pause: {}
        {{- end }}
      {{- end }}
  template:
    metadata:
      labels:
{{ include "chase-sets-platform.selectorLabels" (dict "root" $ "name" $name) | nindent 8 }}
{{- with $.Values.global.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with $component.podLabels }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- if or $.Values.global.podAnnotations $component.podAnnotations }}
      annotations:
{{- with $.Values.global.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- with $component.podAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
{{- end }}
    spec:
{{ include "chase-sets-platform.podSpec" (dict "root" $ "name" $name "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
