{{- $ingress := .Values.doksIngress -}}
{{- if and $ingress.enabled $ingress.tls.enabled $ingress.clusterIssuer }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $ingress.tls.secretName | quote }}
  labels:
{{ include "chase-sets-platform.labels" (dict "root" . "name" "doks-certificate") | nindent 4 }}
spec:
  secretName: {{ $ingress.tls.secretName | quote }}
  dnsNames:
    {{- range $ingress.hosts }}
    - {{ .host | quote }}
    {{- end }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ $ingress.clusterIssuer | quote }}
{{- end }}
