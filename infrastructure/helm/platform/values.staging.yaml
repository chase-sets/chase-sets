generatedBy: "node ./scripts/render-platform-helm-values.mjs"
doksIngress:
  enabled: false
  className: "nginx"
  clusterIssuer: "letsencrypt-production"
  annotations: {}
  tls:
    enabled: true
    secretName: "chase-sets-platform-doks-tls"
  hosts: []
components:
  public-web:
    rollout:
      enabled: true
      revisionHistoryLimit: 5
      progressDeadlineSeconds: 900
      rollbackWindowRevisions: 3
      analysis:
        path: "/health/ready"
        initialDelay: "5s"
        interval: "10s"
        count: 3
        failureLimit: 0
        timeoutSeconds: 5
      canary:
        canaryServiceSuffix: "canary"
        trafficRouting:
          nginx:
            enabled: true
        weights:
          - 10
          - 25
          - 50
          - 100
        pauseAfterWeight: 10
  marketplace:
    rollout:
      enabled: true
      revisionHistoryLimit: 5
      progressDeadlineSeconds: 900
      rollbackWindowRevisions: 3
      analysis:
        path: "/health/ready"
        initialDelay: "5s"
        interval: "10s"
        count: 3
        failureLimit: 0
        timeoutSeconds: 5
      canary:
        canaryServiceSuffix: "canary"
        trafficRouting:
          nginx:
            enabled: true
        weights:
          - 10
          - 25
          - 50
          - 100
        pauseAfterWeight: 10
  platform-api:
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    rollout:
      enabled: true
      revisionHistoryLimit: 5
      progressDeadlineSeconds: 900
      rollbackWindowRevisions: 3
      analysis:
        path: "/health/ready"
        initialDelay: "5s"
        interval: "10s"
        count: 3
        failureLimit: 0
        timeoutSeconds: 5
      canary:
        canaryServiceSuffix: "canary"
        trafficRouting:
          nginx:
            enabled: true
        weights:
          - 10
          - 25
          - 50
          - 100
        pauseAfterWeight: 10
  platform-worker:
    # Keep one warm worker for health and deploy continuity; KEDA adds up to four pods when eligible wake intents accumulate.
    # The cap preserves the staging database connection budget while covering representative wake and import bursts.
    autoscaling:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 4
      pollingInterval: 15
      cooldownPeriod: 300
      triggers:
        - type: "postgresql"
          metadata:
            connectionFromEnv: "PLATFORM_WORK_SIGNAL_DATABASE_URL"
            query: "SELECT COUNT(*)::integer FROM platform_projection_wake_intents WHERE state IN ('queued', 'failed') AND next_eligible_at <= now() AND expires_at > now()"
            targetQueryValue: "1"
            activationTargetQueryValue: "0"
    envOverrides:
      DATABASE_POOL_MAX: "12"
      WORKER_PROJECTION_MAX_CONCURRENT_RUNNERS: "4"
      WORKER_WAKE_MAX_CONCURRENT_RUNNERS: "3"
      WORKER_WAKE_STANDARD_LANE_RUNNER_COUNT: "2"
      WORKER_PROJECTION_WAKE_RELAY_ENABLED: "true"
