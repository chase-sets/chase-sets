#cloud-config
package_update: true
package_upgrade: false
users:
  - name: codex
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - { { SSH_PUBLIC_KEY } }
ssh_pwauth: false
disable_root: false
write_files:
  - path: /usr/local/bin/chase-sets-remote-dev
    permissions: "0755"
    encoding: b64
    content: { { REMOTE_HELPER_B64 } }
  - path: /etc/chase-sets/session
    permissions: "0644"
    content: |
      slug={{SESSION_SLUG}}
      expires_at={{EXPIRES_AT}}
runcmd:
  - install -d -o codex -g codex /opt/chase-sets
  - apt-get update
  - apt-get install -y ca-certificates curl gnupg git openssh-client rsync docker.io docker-compose-plugin caddy
  - usermod -aG docker codex
  - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  - apt-get install -y nodejs
  - npm install -g pnpm@11.0.9 @openai/codex
  - systemctl enable --now docker
  - systemctl enable --now caddy
  - chown -R codex:codex /opt/chase-sets
