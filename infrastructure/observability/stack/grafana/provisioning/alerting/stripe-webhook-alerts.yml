apiVersion: 1

groups:
  - orgId: 1
    name: stripe-webhook-alerts
    folder: Chase Sets
    interval: 1m
    rules:
      - uid: stripe-webhook-signature-failures
        title: Sustained Stripe webhook signature failures
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum by (endpoint) (rate(chase_sets_stripe_webhook_ingestion_total{failure_class="signature-invalid"}[10m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 5m
        labels:
          severity: warning
          context: payments-settlement
          signal: stripe-webhook-signature
      - uid: stripe-webhook-handler-failures
        title: Stripe webhook handler-failure spike
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum by (endpoint) (rate(chase_sets_stripe_webhook_ingestion_total{failure_class="handler-failure"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.1]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 5m
        labels:
          severity: critical
          context: payments-settlement
          signal: stripe-webhook-handler
      - uid: stripe-webhook-dead-letter-growth
        title: Stripe webhook retry/dead-letter growth
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              expr: sum by (endpoint) (increase(chase_sets_stripe_webhook_ingestion_total{failure_class="handler-failure",outcome="failed"}[30m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [10]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 5m
        labels:
          severity: warning
          context: payments-settlement
          signal: dead-letter-growth
