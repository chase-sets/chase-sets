apiVersion: 1

groups:
  - orgId: 1
    name: catalog-integration-alerts
    folder: Chase Sets
    interval: 1m
    rules:
      - uid: catalog-option-query-failures
        title: Catalog option query failures
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: sum(rate(chase_sets_catalog_integration_option_queries_total{result="failure"}[15m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 15m
        labels:
          severity: warning
          context: catalog
      - uid: catalog-option-query-degraded
        title: Catalog option queries serving degraded cache
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: sum(rate(chase_sets_catalog_integration_option_queries_total{degraded="true"}[15m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 30m
        labels:
          severity: info
          context: catalog
      - uid: catalog-integration-job-failures
        title: Catalog integration job failures
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: sum(rate(chase_sets_catalog_integration_jobs_total{operation="integration-job",result="failed"}[15m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 15m
        labels:
          severity: warning
          context: catalog
      - uid: catalog-bulk-review-failures
        title: Catalog bulk review work-unit failures
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              expr: sum(rate(chase_sets_catalog_integration_jobs_total{operation="bulk-review-work-unit",result="failed"}[15m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 15m
        labels:
          severity: warning
          context: catalog
      - uid: catalog-control-plane-blockers
        title: Catalog control-plane blockers elevated
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              expr: sum(increase(chase_sets_catalog_control_plane_events_total{event="catalog_control_plane.blocker_hit"}[30m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [10]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 30m
        labels:
          severity: info
          context: catalog
