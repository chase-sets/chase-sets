apiVersion: 1

groups:
  - orgId: 1
    name: platform-worker-wake-alerts
    folder: Chase Sets
    interval: 1m
    rules:
      - uid: projection-wake-fan-out-failures
        title: Projection wake relay fan-out failures
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum(rate(chase_sets_projection_wake_relay_fan_out_total{status="failed"}[10m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 10m
        labels:
          severity: warning
      - uid: projection-wake-attempts-exhausted
        title: Projection wake intents exhausted their attempts
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum(rate(chase_sets_projection_wake_intent_attempts_exhausted_total[10m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 10m
        labels:
          severity: warning
      - uid: projection-wake-hot-lane-queue-age-p95
        title: Projection wake hot lane queue age p95 above SLO
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(chase_sets_projection_wake_intent_queue_age_ms_bucket{priority_lane="hot"}[10m])))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [2000]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 15m
        labels:
          severity: warning
      - uid: projection-freshness-work-signal-errors
        title: Projection freshness work-signal errors
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: sum(rate(chase_sets_projection_freshness_work_signal_errors_total[10m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 15m
        labels:
          severity: warning
