apiVersion: 1

deleteRules:
  - orgId: 1
    uid: checkout-operator-alert-events

groups:
  - orgId: 1
    name: platform-api-starter-alerts
    folder: Chase Sets
    interval: 1m
    rules:
      - uid: platform-api-5xx-rate
        title: Platform API elevated 5xx rate
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(chase_sets_http_server_requests_total{status_class="5xx"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 5m
        labels:
          severity: warning
      - uid: platform-api-projection-errors
        title: Platform API projection or subscription failures
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(chase_sets_projection_runs_total{status="error"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 2m
        labels:
          severity: warning
      - uid: commercial-terms-policy-overlap
        title: Commercial Terms active policy overlap observed
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(chase_sets_post_write_consistency_events_total{context="commercial-terms",strategy="active-policy-overlap-detection"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 0m
        labels:
          severity: critical
          route: commercial-terms
      - uid: platform-api-ucp-signature-failures
        title: UCP signature verification failures
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(chase_sets_ucp_signature_verification_failed_total[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 2m
        labels:
          severity: warning
      - uid: platform-api-ucp-idempotency-conflicts
        title: UCP idempotency conflicts
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(chase_sets_ucp_idempotency_total{result="conflict"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 2m
        labels:
          severity: warning
      - uid: checkout-observability-alert-events
        title: Checkout observability alert events
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum by (event_name, alert_class, scenario_state, visible_state) (rate(chase_sets_checkout_observability_events_total{alert_class=~"operator-alert|provider-alert|fresh-state-alert"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 2m
        labels:
          severity: warning
          route: checkout-launch
      - uid: checkout-side-effect-boundary-violation
        title: Checkout side-effect boundary violation
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum by (event_name, entry_source, actor_mode, scenario_state) (rate(chase_sets_checkout_observability_events_total{side_effect_status=~"attempted-before-confirmation|forbidden|unsafe"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 1m
        labels:
          severity: critical
          route: checkout-launch
      - uid: projection-freshness-checkout-p95
        title: Checkout freshness p95 above SLO
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(chase_sets_projection_freshness_wait_duration_ms_bucket{route_path="/account/checkout-sessions/:sessionId",target_context="checkout",projection="checkout.session-projection",source_context="checkout",outcome="fresh"}[30m])))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1000]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 5m
        labels:
          severity: warning
          route: checkout-session
      - uid: projection-freshness-checkout-p99
        title: Checkout freshness p99 above SLO
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              expr: histogram_quantile(0.99, sum by (le) (rate(chase_sets_projection_freshness_wait_duration_ms_bucket{route_path="/account/checkout-sessions/:sessionId",target_context="checkout",projection="checkout.session-projection",source_context="checkout",outcome="fresh"}[30m])))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [2250]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 5m
        labels:
          severity: warning
          route: checkout-session
      - uid: projection-freshness-checkout-timeouts
        title: Checkout freshness timeout rate above SLO
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              expr: sum(rate(chase_sets_projection_freshness_evaluations_total{route_path="/account/checkout-sessions/:sessionId",target_context="checkout",projection="checkout.session-projection",source_context="checkout",outcome="timeout"}[30m])) / clamp_min(sum(rate(chase_sets_projection_freshness_evaluations_total{route_path="/account/checkout-sessions/:sessionId",target_context="checkout",projection="checkout.session-projection",source_context="checkout"}[30m])), 1)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.001]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 5m
        labels:
          severity: warning
          route: checkout-session
      - uid: checkout-freshness-contract-reg
        title: Checkout freshness receipt or target-context regression
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(chase_sets_projection_freshness_evaluations_total{route_path="/account/checkout-sessions/:sessionId",target_context="checkout",projection="checkout.session-projection",source_context="checkout",outcome="missing-receipt"}[5m])) + sum(rate(chase_sets_projection_freshness_evaluations_total{route_path="/account/checkout-sessions/:sessionId",target_context="checkout",projection="checkout.session-projection",source_context="checkout",target_context_header=~"missing|present_invalid"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 1m
        labels:
          severity: critical
          route: checkout-session
      - uid: checkout-freshness-target-fallback
        title: Checkout freshness target-context fallback active
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(chase_sets_projection_freshness_evaluations_total{route_path="/account/checkout-sessions/:sessionId",target_context="checkout",wait_mode="target-context"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 1m
        labels:
          severity: warning
          route: checkout-session
      - uid: projection-freshness-pending-error
        title: Projection freshness pending rows with projection errors
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum by (route_path, target_context, projection, source_context, state) (rate(chase_sets_projection_freshness_pending_total{last_error="present"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 2m
        labels:
          severity: warning
