apiVersion: 1

groups:
  - orgId: 1
    name: platform-api-starter-alerts
    folder: Chase Sets
    interval: 1m
    rules:
      - uid: platform-api-5xx-rate
        title: Platform API elevated 5xx rate
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(chase_sets_http_server_requests_total{status_class="5xx"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 5m
        labels:
          severity: warning
      - uid: platform-api-projection-errors
        title: Platform API projection or subscription failures
        condition: C
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(rate(chase_sets_projection_runs_total{status="error"}[5m]))
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              refId: C
              type: classic_conditions
        for: 2m
        labels:
          severity: warning
