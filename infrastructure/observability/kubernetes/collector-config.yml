receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  kubeletstats:
    auth_type: serviceAccount
    collection_interval: 30s
    endpoint: ${env:K8S_NODE_NAME}:10250
    insecure_skip_verify: true
    metric_groups:
      - node
      - pod
      - container
  k8s_cluster:
    collection_interval: 30s

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.deployment.name
        - k8s.node.name
  resource/chase_sets_environment:
    attributes:
      - key: deployment.environment
        value: ${env:CHASE_SETS_DEPLOYMENT_ENVIRONMENT}
        action: upsert
      - key: k8s.cluster.name
        value: ${env:CHASE_SETS_K8S_CLUSTER_NAME}
        action: upsert
      - key: chase_sets.observability_stack
        value: single-shared-stack
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlphttp/central_stack:
    endpoint: ${env:CHASE_SETS_OTLP_ENDPOINT}
    headers:
      X-Chase-Sets-Observability-Token: ${env:CHASE_SETS_OTLP_TOKEN}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource/chase_sets_environment, batch]
      exporters: [otlphttp/central_stack]
    metrics:
      receivers: [otlp, kubeletstats, k8s_cluster]
      processors: [memory_limiter, k8sattributes, resource/chase_sets_environment, batch]
      exporters: [otlphttp/central_stack]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource/chase_sets_environment, batch]
      exporters: [otlphttp/central_stack]
