interface:
  display_name: "Bounded Context Delivery"
  short_description: "Deliver changes with bounded-context evidence"
  default_prompt: "Use $bounded-context-delivery to plan this change in a sibling worktree beside main, ask one blocking question at a time, keep the dated checklist plan as a working artifact, capture the finished plan in PR details, create the implementation goal, and require PR/CI/GitHub merge queue/deployment verification plus generated plan removal, local cleanup, and main refresh before completion."
