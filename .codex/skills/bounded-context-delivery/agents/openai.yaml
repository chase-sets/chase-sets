interface:
  display_name: "Bounded Context Delivery"
  short_description: "Deliver changes with bounded-context evidence"
  default_prompt: "Use $bounded-context-delivery to deliver this change with process proportional to blast radius: fast path (pooled worktree, targeted tests, short PR, merge on green) for low-risk changes; full path (batched planning questions with recommended answers, bounded self-review) for money movement, cross-context contracts/events, schema migrations, or destructive data changes."
